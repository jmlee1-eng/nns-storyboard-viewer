1-C01"},{"start":3.53,"end":7.5374,"kr":"주군의 손끝에는 서명하던 감각이 남아 있습니다.","jp":"主君の指先には、署名した感覚が残っています。","cut":"P03-S01-C01"},{"start":7.5574,"end":12.9225,"kr":"책상에는 산 적도 없는 작자 미상의 낡은 각본집이 놓여 있죠.","jp":"机には、買った覚えもない、作者不明の古い脚本集が置かれています。","cut":"P03-S01-C01"},{"start":12.9425,"end":19.861,"kr":"치코링, 히땅 같은 별명과 여명, 선풍 같은 배역이 그 세계와 일치합니다.","jp":"チコりん、ひーたんといったあだ名も、黎明、旋風といった役名も、あの世界と一致していました。","cut":"P03-S01-C01"},{"start":19.881,"end":23.2115,"kr":"목록 맨 끝 한 줄만 찢겨 있습니다.","jp":"リストの最後の一行だけが、破れています。","cut":"P03-S01-C01"},{"start":23.2315,"end":29.5367,"kr":"고향의 쥬리는 치코링이 자신이 지은 별명이라고 하지만, 언제 지었는지 모릅니다.","jp":"故郷のジュリは、チコりんは自分がつけたあだ名だと言いますが、いつつけたのかはわかりません。","cut":"P03-S01-C01"},{"start":29.5567,"end":34.7848,"kr":"책도 가져다 놓은 적 없다며 제목을 읽다가 말을 늦춥니다.","jp":"持ってきた覚えもない本の題名を読みながら、ふと声がゆっくりになります。","cut":"P03-S01-C01"},{"start":34.8048,"end":36.4348,"kr":"매~지컬 시노비.","jp":"マ〜ジカル・シノビ。","cut":"P03-S01-C01"},{"start":36.4548,"end":39.9848,"kr":"매지컬…… 응, 역시 좋아.","jp":"マジカル……うん、やっぱり好き。","cut":"P03-S01-C01"},{"start":40.0048,"end":41.5548,"kr":"입에 착 붙어.","jp":"口にしっくりくる。","cut":"P03-S01-C01"},{"start":41.5748,"end":43.3491,"kr":"…근데 왜일까?","jp":"…でも、どうしてかな？","cut":"P03-S01-C01"},{"start":43.3691,"end":46.3991,"kr":"좋은데— 조금, 눈물 날 것 같아.","jp":"好きなのに──ちょっと、泣きそう。","cut":"P03-S01-C01"},{"start":46.4191,"end":50.3133,"kr":"이내 쥬리는 평소처럼 아침밥을 찾습니다.","jp":"すぐにジュリは、いつもどおり朝ごはんを欲しがります。","cut":"P03-S01-C01"},{"start":50.583333333333336,"end":55.374433333333336,"kr":"며칠 뒤 만난 치코는 요즘 일기를 쓰기 시작했다고 합니다.","jp":"数日後に会ったチコは、最近、日記を書きはじめたと言います。","cut":"P03-S02-C01-02"},{"start":55.39443333333334,"end":61.58063333333334,"kr":"잊은 것도 없는데 잊는 게 무서워, 그날 만난 사람 이름을 전부 적는다고요.","jp":"忘れたものもないのに、忘れるのが怖くて、その日会った人の名前を全部書くのだと。","cut":"P03-S02-C01-02"},{"start":61.600633333333334,"end":65.97063333333334,"kr":"그, 그리고요…… 가끔, 쓰면서 우는데요.","jp":"そ、それとですね……たまに、書きながら泣いちゃうんです。","cut":"P03-S02-C01-02"},{"start":65.99063333333334,"end":68.31063333333333,"kr":"이, 이유는 모르겠어요.","jp":"り、理由はわからないです。","cut":"P03-S02-C01-02"},{"start":68.33063333333334,"end":71.24063333333334,"kr":"…그, 그래서 그것도 적어 놨어요.","jp":"…だ、だから、それも書いておきました。","cut":"P03-S02-C01-02"},{"start":71.26063333333333,"end":73.03063333333333,"kr":"'이유 모름'이라고.","jp":"『理由不明』って。","cut":"P03-S02-C01-02"},{"start":73.05063333333334,"end":77.14663333333334,"kr":"주군은 좋은 습관이니 계속하라고 답합니다.","jp":"主君は、いい習慣だから続けるといいと答えます。","cut":"P03-S02-C01-02"},{"start":77.41666666666667,"end":82.69666666666667,"kr":"떠나는 치코의 품에서 와카와 타마가 서로를 마주 본 것처럼 보입니다.","jp":"去っていくチコの胸元で、ワカとタマが顔を見合わせたように見えました。","cut":"P03-S02-C02-02"},{"start":82.71666666666667,"end":85.85496666666667,"kr":"주군은 기분 탓이라고 해 둡니다.","jp":"主君は、気のせいということにします。","cut":"P03-S02-C02-02"},{"start":86.125,"end":91.305,"kr":"담장 너머로, 갓 구운 빵 냄새와 함께 아야메가 나타납니다.","jp":"塀の向こうから、焼きたてのパンの匂いとともにアヤメが現れます。","cut":"P03-S03-C01"},{"start":91.325,"end":92.395,"kr":"주군님!","jp":"主君さま！","cut":"P03-S03-C01"},{"start":92.415,"end":93.465,"kr":"봉주르!","jp":"ボンジュール！","cut":"P03-S03-C01"},{"start":93.485,"end":95.7245,"kr":"마침 잘 오셨어요.","jp":"ちょうどよいところへいらっしゃいました。","cut":"P03-S03-C01"},{"start":95.7445,"end":98.4845,"kr":"새로 구운 빵, 드셔 보실래요?","jp":"焼きたてのパン、召し上がりませんか？","cut":"P03-S03-C01"},{"start":98.50450000000001,"end":100.6545,"kr":"오늘 건 자신작이에요.","jp":"今日のは自信作なんです。","cut":"P03-S03-C01"},{"start":100.6745,"end":106.9836,"kr":"마들렌을 만들려고 했는데, 어쩐지 동그랗게 부풀어서— 이름은 '동글이'로 했어요.","jp":"マドレーヌを作るつもりだったのに、なぜか丸く膨らんでしまって——『まるちゃん』と名づけました。","cut":"P03-S03-C01"},{"start":107.0036,"end":109.4135,"kr":"……이름부터 배부르군.","jp":"……名前からして腹いっぱいだな。","cut":"P03-S03-C01"},{"start":109.4335,"end":112.8335,"kr":"꽃밭처럼 웃는, 평소의 아야메였습니다.","jp":"花畑のように笑う、いつものアヤメでした。","cut":"P03-S03-C01"},{"start":112.8535,"end":118.2635,"kr":"그런데 문득, 아야메가 아주 살짝 고개를 기울이며 웃는 채로 묻습니다.","jp":"けれどふと、ほんの少し首をかしげ、笑顔のままで尋ねます。","cut":"P03-S03-C01"},{"start":118.2835,"end":120.18350000000001,"kr":"— 그런데, 주군님.","jp":"——ところで、主君さま。","cut":"P03-S03-C01"},{"start":120.20349999999999,"end":122.9521,"kr":"……좋은 꿈, 꾸셨나요?","jp":"……よい夢を、ご覧になりましたか？","cut":"P03-S03-C01"},{"start":122.9721,"end":127.69210000000001,"kr":"주군은 꿈 이야기를 누구에게도 한 마디도 하지 않았는데 말이죠.","jp":"主君は、夢の話を誰にも一言もしていませんでした。","cut":"P03-S03-C01"},{"start":127.71209999999999,"end":133.4521,"kr":"그럼, 또 들러 주세요! 다음엔 새 레시피에 도전할 거예요!","jp":"では、またお立ち寄りくださいね！次は新しいレシピに挑戦します！","cut":"P03-S03-C01"},{"start":133.4721,"end":136.0321,"kr":"아야메가 손을 흔들며 사라집니다.","jp":"アヤメは手を振って去っていきます。","cut":"P03-S03-C01"},{"start":136.0521,"end":140.73,"kr":"주군은 빵을 든 채 서서, 끝내 대답하지 못했습니다.","jp":"主君はパンを手に立ち尽くし、最後まで答えられませんでした。","cut":"P03-S03-C01"}],"scenes":[{"id":"P03-S01","title":"고향에 남은 각본집","start":0,"end":50.333333333333336,"file":"scenes/P03-S01.mp4?v=renumber-20261127","audio":{"kr":"scenes/P03-S01_kr.m4a?v=renumber-20261127","jp":"scenes/P03-S01_jp.m4a?v=renumber-20261127"}},{"id":"P03-S02","title":"이유를 모르는 일기","start":50.333333333333336,"end":85.875,"file":"scenes/P03-S02.mp4?v=renumber-20261127","audio":{"kr":"scenes/P03-S02_kr.m4a?v=renumber-20261127","jp":"scenes/P03-S02_jp.m4a?v=renumber-20261127"}},{"id":"P03-S03","title":"동그란 마들렌과 꿈의 질문","start":85.875,"end":140.75,"file":"scenes/P03-S03.mp4?v=renumber-20261127","audio":{"kr":"scenes/P03-S03_kr.m4a?v=renumber-20261127","jp":"scenes/P03-S03_jp.m4a?v=renumber-20261127"}}],"mediaRevision":"renumber-20261127"}</script><script>

function update(){const time=gtime()-data.lead;currentIndex=data.cuts.findIndex(c=>time>=c.start&&time<c.end);for(const b of cuts.children){const active=Number(b.dataset.index)===currentIndex;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')};const c=data.cuts[currentIndex];document.getElementById('current').textContent=c?c.displayId+' · '+c.title:gtime()<data.lead?'エピローグ':'おわり';const q=c?.cues.filter(q=>q.scheduledTime<=time).at(-1);document.getElementById('cueInfo').textContent=q?'동작 '+q.step+' · '+q.action:c?'시작 배치':'마무리';document.getElementById('togglePlay').textContent=video.paused?'재생':'일시정지';document.getElementById('sceneSel').value=String(si);}
function setLang(l){lang=l;try{localStorage.setItem('nnsLang',l);}catch(e){}for(const b of document.querySelectorAll('.lang button'))b.setAttribute('aria-pressed',String(b.dataset.lang===l));for(const [k,o] of Object.entries(A))if(k!==l)o.pause();syncAudio(true);}
for(const b of document.querySelectorAll('.lang button'))b.onclick=()=>setLang(b.dataset.lang);
video.addEventListener('play',()=>{syncAudio(true);update();});video.addEventListener('playing',()=>syncAudio(true));
video.addEventListener('pause',()=>{for(const o of Object.values(A))o.pause();update();});video.addEventListener('waiting',()=>cur().pause());
video.addEventListener('seeked',()=>syncAudio(true));video.addEventListener('ratechange',()=>syncAudio(false));
video.addEventListener('timeupdate',()=>{update();syncAudio(false);});video.addEventListener('loadedmetadata',update);
video.addEventListener('ended',()=>{if(si<SC.length-1)load(si+1,0,true);else for(const o of Object.values(A))o.pause();});
document.getElementById('sceneSel').onchange=e=>load(Number(e.target.value),0);
document.getElementById('togglePlay').onclick=()=>video.paused?play_():video.pause();
document.getElementById('muteBtn').onclick=()=>{muted=!muted;for(const o of Object.values(A))o.muted=muted;document.getElementById('muteBtn').textContent=muted?'음소거 해제':'음소거'};
document.getElementById('speed').onchange=e=>{video.playbackRate=Number(e.target.value)};
document.getElementById('previous').onclick=()=>{const c=data.cuts[Math.max(0,currentIndex-1)];seek(c.start+data.lead+.02);update()};document.getElementById('next').onclick=()=>{const c=data.cuts[Math.min(data.cuts.length-1,currentIndex+1)];seek(c.start+data.lead+.02);update()};
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();for(const b of cuts.children)b.hidden=!b.textContent.toLowerCase().includes(q)};
for(const k in A)A[k].src=SC[0].audio[k];setLang(lang);
</script></body></html>
