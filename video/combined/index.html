s/P03-S03_jp.m4a"}}]}</script><script>
const data=JSON.parse(document.getElementById('timeline').textContent),SC=data.scenes,video=document.getElementById('video'),cuts=document.getElementById('cuts');
let loadToken=0,currentIndex=-1,si=0,lang='kr',muted=false;
try{const v=localStorage.getItem('nnsLang');if(v==='kr'||v==='jp')lang=v;}catch(e){}
const A={kr:new Audio(),jp:new Audio()};for(const a of Object.values(A)){a.preload='auto';}
const cur=()=>A[lang];
const gtime=()=>SC[si].start+(video.currentTime||0);
const clock=t=>Math.floor(t/60)+':'+Math.floor(t%60).toString().padStart(2,'0');
function syncAudio(force){const a=cur();if(!a.src)return;if(a.readyState<1){if(!a._wait){a._wait=1;a.addEventListener('loadedmetadata',()=>{a._wait=0;syncAudio(true);},{once:true});}return;}const want=video.currentTime;if(force||Math.abs(a.currentTime-want)>.15){try{a.currentTime=want;}catch(e){}}a.playbackRate=video.playbackRate;a.muted=muted;
 for(const [k,o] of Object.entries(A))if(k!==lang&&!o.paused)o.pause();
 if(!video.paused&&!video.ended&&a.paused)a.play().catch(()=>{});if((video.paused||video.ended)&&!a.paused)a.pause();}
function load(i,t,play){const token=++loadToken;const want=play??!video.paused;si=i;video.src=SC[i].file;for(const k in A){A[k].src=SC[i].audio[k];A[k].load();}
 video.addEventListener('loadedmetadata',function f(){video.removeEventListener('loadedmetadata',f);if(token!==loadToken)return;video.currentTime=Math.max(0,t);video.playbackRate=Number(document.getElementById('speed').value);syncAudio(true);if(want)play_();update();});video.load();}
function play_(){video.play().catch(()=>{});const a=cur();try{a.currentTime=video.currentTime;}catch(e){}a.play().catch(()=>{});}
function seek(T){let i=SC.findIndex(x=>T>=x.start&&T<x.end);if(i<0)i=T<SC[0].start?0:SC.length-1;if(i===si&&video.readyState>0){video.currentTime=Math.max(0,T-SC[i].start);syncAudio(true);}else load(i,T-SC[i].start);}
data.cuts.forEach((c,i)=>{const b=document.createElement('button');b.dataset.index=i;b.innerHTML='<small>'+c.displayId+'</small><small>'+clock(c.start+data.lead)+'</small><span class="title"></span>';b.querySelector('.title').textContent=c.title;b.onclick=()=>{seek(c.start+data.lead+.02);update();};cuts.append(b)});
function update(){const time=gtime()-data.lead;currentIndex=data.cuts.findIndex(c=>time>=c.start&&time<c.end);for(const b of cuts.children){const active=Number(b.dataset.index)===currentIndex;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')};const c=data.cuts[currentIndex];document.getElementById('current').textContent=c?c.displayId+' · '+c.title:'통합본';const q=c?.cues.filter(q=>q.scheduledTime<=time).at(-1);document.getElementById('cueInfo').textContent=q?'동작 '+q.step+' · '+q.action:c?'시작 배치':'마무리';document.getElementById('togglePlay').textContent=video.paused?'재생':'일시정지';document.getElementById('sceneSel').value=String(si);}
function setLang(l){lang=l;try{localStorage.setItem('nnsLang',l);}catch(e){}for(const b of document.querySelectorAll('.lang button'))b.setAttribute('aria-pressed',String(b.dataset.lang===l));for(const [k,o] of Object.entries(A))if(k!==l)o.pause();syncAudio(true);}
for(const b of document.querySelectorAll('.lang button'))b.onclick=()=>setLang(b.dataset.lang);
video.addEventListener('play',()=>{syncAudio(true);update();});video.addEventListener('playing',()=>syncAudio(true));
video.addEventListener('pause',()=>{for(const o of Object.values(A))o.pause();update();});video.addEventListener('waiting',()=>cur().pause());
video.addEventListener('seeked',()=>syncAudio(true));video.addEventListener('ratechange',()=>syncAudio(false));
video.addEventListener('timeupdate',()=>{update();syncAudio(false);});video.addEventListener('loadedmetadata',update);
video.addEventListener('ended',()=>{if(si<SC.length-1)load(si+1,0,true);else for(const o of Object.values(A))o.pause();});
document.getElementById('sceneSel').onchange=e=>load(Number(e.target.value),0);
document.getElementById('togglePlay').onclick=()=>video.paused?play_():video.pause();
document.getElementById('muteBtn').onclick=()=>{muted=!muted;for(const o of Object.values(A))o.muted=muted;document.getElementById('muteBtn').textContent=muted?'음소거 해제':'음소거'};
document.getElementById('speed').onchange=e=>{video.playbackRate=Number(e.target.value)};
document.getElementById('previous').onclick=()=>{const c=data.cuts[Math.max(0,currentIndex-1)];seek(c.start+data.lead+.02);update()};document.getElementById('next').onclick=()=>{const c=data.cuts[Math.min(data.cuts.length-1,currentIndex+1)];seek(c.start+data.lead+.02);update()};
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();for(const b of cuts.children)b.hidden=!b.textContent.toLowerCase().includes(q)};
for(const k in A)A[k].src=SC[0].audio[k];setLang(lang);
</script></body></html>
