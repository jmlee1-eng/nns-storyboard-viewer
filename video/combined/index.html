759,"end":35.581,"cut":"P01-S01-C02","jp":"懐かしさに名前を呼ぶと、少女は驚いた表情で警戒します。"},{"start":35.515,"end":37.571,"cut":"P01-S01-C02","kr":"레오나: …어떻게 제 이름을 아세요?"},{"start":35.581,"end":38.577,"cut":"P01-S01-C02","jp":"レオナ：…どうして僕の名前を知ってるんですか？"},{"start":38.549,"end":39.962,"cut":"P01-S01-C02","kr":"처음 보는 분이신데."},{"start":38.78,"end":41.041,"cut":"P01-S01-C02","jp":"初めてお会いする方ですけど。"},{"start":41.012,"end":43.21,"cut":"P01-S01-C02","kr":"아는 얼굴이 자신을 모릅니다."},{"start":41.24,"end":43.989,"cut":"P01-S01-C02","jp":"知っている顔が、自分を知りません。"},{"start":43.964,"end":48.847,"cut":"P01-S01-C02","kr":"고향에서 이 소녀는 불의 인술에 재능을 보이던 닌자 소녀 레오나였습니다."},{"start":44.16,"end":50.115,"cut":"P01-S01-C02","jp":"故郷で、この少女は火の忍術に才能を見せていた忍者の少女、レオナでした。"},{"start":50.089,"end":54.865,"cut":"P01-S01-C02","kr":"하지만 이곳에서의 레오나는 [홍련의 소녀]로 불리는 마법소녀라고 하죠."},{"start":50.215,"end":55.425,"cut":"P01-S01-C02","jp":"けれど、ここでのレオナは[紅蓮の少女]と呼ばれる魔法少女なのだそうです。"},{"start":55.767,"end":61.799,"cut":"P01-S01-C02","kr":"따지고 싶은 건 많지만 우선 살아서 골목을 벗어나고, 고향으로 돌아갈 방법부터 찾아야 했죠."},{"start":55.9,"end":63.066,"cut":"P01-S01-C02","jp":"問いただしたいことは山ほどありますが、まずは生きて路地を抜け、故郷へ帰る方法を探さなければなりません。"},{"start":63.054,"end":67.17,"cut":"P01-S01-C02","kr":"사정을 들은 레오나는 주군을 자기 뒤에 세워 출구로 안내합니다."},{"start":63.07,"end":68.093,"cut":"P01-S01-C02","jp":"事情を聞いたレオナは、主君を自分の後ろに立たせ、出口へ案内します。"},{"start":68.58,"end":72.562,"cut":"P01-S02-C01","jp":"レオナについて歩きながら、主君はこの街の夜を知っていきます。"},{"start":68.658,"end":71.603,"cut":"P01-S02-C01","kr":"레오나를 따라 걸으며 이 도시의 밤을 배웁니다."},{"start":73.04166666666667,"end":75.881,"cut":"P01-S02-C01-02","kr":"이 도시에서는 밤이면 공간이 접히고,"},{"start":73.15,"end":76.032,"cut":"P01-S02-C01-02","jp":"ここでは夜になると空間が折り畳まれ、"},{"start":76.16666666666667,"end":78.945,"cut":"P01-S02-C01-03","kr":"그 안에 생긴 결계에서 괴이가 나타납니다."},{"start":76.235,"end":79.539,"cut":"P01-S02-C01-03","jp":"その中に生まれた結界に怪異が現れます。"},{"start":79.632,"end":86.332,"cut":"P01-S02-C01-03","kr":"보통 사람은 결계를 잘 보지 못해 무의식적으로 피해 걷지만, 방금의 주군처럼 휘말려 갇히기도 하죠."},{"start":79.69,"end":88.214,"cut":"P01-S02-C01-03","jp":"普通の人には結界がよく見えず、無意識に避けて歩きますが、先ほどの主君のように巻き込まれて閉じ込められることもあります。"},{"start":88.25,"end":92.53,"cut":"P01-S02-C01-03","jp":"そうした人を救い、怪異を倒すのが魔法少女の役目でした。"},{"start":88.354,"end":92.216,"cut":"P01-S02-C01-03","kr":"그런 사람을 구하고 괴이를 없애는 게 마법소녀의 일이었습니다."},{"start":92.95833333333333,"end":96.92,"cut":"P01-S02-C02","kr":"그리고 그런 소녀들조차 두려워하는 마녀도, 이 도시에 있었죠."},{"start":93.103,"end":97.635,"cut":"P01-S02-C02","jp":"そして、そんな少女たちでさえ恐れる魔女も、この街にはいたのです。"},{"start":98.0,"end":103.102,"cut":"P01-S02-C03","kr":"'접힌 골목'을 빠져나가려는데, 골목 끝에 낡은 골동품상 하나가 있습니다."},{"start":98.158,"end":103.64200000000001,"cut":"P01-S02-C03","jp":"「折り畳まれた路地」を抜けようとすると、路地の奥に古い骨董屋が一軒ありました。"},{"start":103.64200000000001,"end":105.84700000000001,"cut":"P01-S02-C03","jp":"店主は中年の男。"},{"start":103.68700000000001,"end":105.24900000000001,"cut":"P01-S02-C03","kr":"주인은 중년의 사내."},{"start":105.81800000000001,"end":111.805,"cut":"P01-S02-C03","kr":"인간의 모습을 하고 있지만, 고향의 상급 닌자 중 하나인 검은 고양이 하케 씨가 분명했습니다."},{"start":105.938,"end":111.97800000000001,"cut":"P01-S02-C03","jp":"人間の姿をしていますが、故郷の上忍の一人、黒猫のハケさんに間違いありませんでした。"},{"start":112.423,"end":119.226,"cut":"P01-S02-C03","jp":"ハケさんはいきなり主君を「契約者」と呼び、代金も取らずに一対の狐の人形を渡します。"},{"start":112.438,"end":118.468,"cut":"P01-S02-C03","kr":"하케 씨는 대뜸 주군을 '계약자'라고 부르며, 값도 받지 않고 여우 인형 한 쌍을 건넵니다."},{"start":119.226,"end":121.092,"cut":"P01-S02-C03","jp":"ワカとタマ。"},{"start":119.40400000000001,"end":120.307,"cut":"P01-S02-C03","kr":"와카와 타마."},{"start":121.06400000000001,"end":126.34,"cut":"P01-S02-C03","kr":"고향에서는 치코의 동료였던 인형들이, 이곳에서는 하케 씨의 가게에 있었습니다."},{"start":121.16300000000001,"end":125.94800000000001,"cut":"P01-S02-C03","jp":"故郷ではチコの仲間だった人形たちが、ここではハケさんの店にいたのです。"},{"start":126.342,"end":126.375,"cut":"P01-S02-C03","kr":"주군은 모든 게 의문투성이지만, 어쩐지 아주 조금 따뜻한 그 인형들을 품에 넣습니다."},{"start":126.375,"end":132.75799999999998,"cut":"P01-S02-C04-02","kr":"주군은 모든 게 의문투성이지만, 어쩐지 아주 조금 따뜻한 그 인형들을 품에 넣습니다."},{"start":126.575,"end":131.97500000000002,"cut":"P01-S02-C04-02","jp":"主君は何もかもがわからないまま、なぜかほんの少し温かい人形を懐に入れます。"},{"start":133.08333333333334, -S03-C01","kr":"마법소녀가 멋있다는 친구의 말에는, 겁을 내면서도 눈을 반짝이며 동경하죠."},{"start":183.36833333333334,"end":187.34033333333332,"cut":"P01-S03-C01","kr":"치코: 마, 마법소녀…… 그, 그거, 위험한 거 아니야…?"},{"start":183.39633333333333,"end":188.35533333333333,"cut":"P01-S03-C01","jp":"チコ：ま、魔法少女……そ、それ、危ないんじゃないの…？"},{"start":188.45633333333333,"end":189.83233333333334,"cut":"P01-S03-C01","jp":"た、戦うんでしょ……。"},{"start":188.46133333333333,"end":189.64433333333332,"cut":"P01-S03-C01","kr":"싸, 싸우는 거잖아……."},{"start":189.69033333333334,"end":191.60033333333334,"cut":"P01-S03-C01","kr":"아카리: 에~ 멋있잖아!"},{"start":189.83233333333334,"end":192.24633333333333,"cut":"P01-S03-C01","jp":"あかり：え〜、かっこいいじゃん！"},{"start":192.36633333333333,"end":193.72633333333334,"cut":"P01-S03-C01","jp":"チコちゃんは怖い？"},{"start":192.72033333333334,"end":194.24433333333334,"cut":"P01-S03-C01","kr":"치코쨩은 무서워?"},{"start":194.18433333333334,"end":195.59833333333333,"cut":"P01-S03-C01","kr":"치코: 무, 무섭지…."},{"start":194.24433333333334,"end":196.51133333333334,"cut":"P01-S03-C01","jp":"チコ：こ、怖いよ…。"},{"start":196.64933333333335,"end":200.96933333333334,"cut":"P01-S03-C01","jp":"怖いけど……で、でも、かっこいいとも、思う…。"},{"start":197.38333333333333,"end":201.01433333333333,"cut":"P01-S03-C01","kr":"무섭지만…… 그, 멋있다고도, 생각해…."},{"start":200.94133333333332,"end":202.19433333333333,"cut":"P01-S03-C01","kr":"조, 조금은."},{"start":201.02933333333334,"end":202.43833333333333,"cut":"P01-S03-C01","jp":"す、少しだけ。"},{"start":202.40433333333334,"end":205.61533333333333,"cut":"P01-S03-C01","kr":"그리고 그 동경은 그날 밤에 더 커졌습니다."},{"start":202.55933333333334,"end":206.26433333333333,"cut":"P01-S03-C01","jp":"そして、その憧れは、その夜、さらに強くなりました。"},{"start":206.65733333333333,"end":206.70833333333334,"cut":"P01-S03-C01","kr":"치코가 상점가의 결계에 휘말립니다."},{"start":206.70833333333334,"end":209.39933333333335,"cut":"P01-S04-C01","kr":"치코가 상점가의 결계에 휘말립니다."},{"start":206.76433333333335,"end":209.74133333333336,"cut":"P01-S04-C01","jp":"チコが商店街の結界に巻き込まれます。"},{"start":209.66933333333336,"end":215.35133333333334,"cut":"P01-S0 6666667,"end":277.26666666666665,"cut":"P01-S05-C01","jp":"主君：ひとつ聞く。"},{"start":277.23866666666663,"end":279.9936666666666,"cut":"P01-S05-C01","kr":"계약하면— 그 아이들은 뭘 치르게 되지?"},{"start":277.4416666666666,"end":280.8116666666666,"cut":"P01-S05-C01","jp":"契約したら──あの子たちは、何を支払うことになる？"},{"start":280.73266666666666,"end":281.9026666666666,"cut":"P01-S05-C01","kr":"와카: 치르다니~?"},{"start":280.8116666666666,"end":282.20866666666666,"cut":"P01-S05-C01","jp":"ワカ：支払うだなんて〜？"},{"start":282.2986666666667,"end":283.2986666666667,"cut":"P01-S05-C01","kr":"이상한 말 하네!"},{"start":282.63166666666666,"end":284.0336666666667,"cut":"P01-S05-C01","jp":"変なこと言うね！"},{"start":284.0666666666666,"end":287.6676666666666,"cut":"P01-S05-C01","jp":"願いを叶えて、力をもらって、大切なものを守る！"},{"start":284.1496666666667,"end":287.07366666666667,"cut":"P01-S05-C01","kr":"소원을 이루고, 힘을 받고, 소중한 걸 지켜!"},{"start":287.7016666666666,"end":289.3446666666666,"cut":"P01-S05-C01","jp":"いいことばかりじゃない？"},{"start":287.76166666666666,"end":288.92466666666667,"cut":"P01-S05-C01","kr":"좋은 일뿐이잖아?"},{"start":289.3176666666667,"end":293.08366666666666,"cut":"P01-S05-C01","kr":"계약을 그만둘 수 있느냐는 질문에도 비밀이라고만 했죠."},{"start":289.4716666666667,"end":293.1546666666667,"cut":"P01-S05-C01","jp":"契約をやめられるのかと聞いても、秘密だと言うばかりでした。"},{"start":293.5916666666667,"end":299.2166666666667,"cut":"P01-S05-C01","jp":"ただし、契約には、人形たちを所有する大人、主君の署名が必要です。"},{"start":293.72366666666665,"end":298.3326666666667,"cut":"P01-S05-C01","kr":"다만, 계약에는 자신들을 소유한 어른, 주군의 서명이 필요합니다."},{"start":299.2166666666667,"end":303.7266666666667,"cut":"P01-S05-C01","jp":"チコが望んでも、主君が署名しなければ契約はできません。"},{"start":299.4076666666666,"end":302.9676666666667,"cut":"P01-S05-C01","kr":"치코가 원해도, 주군이 서명하지 않으면 계약할 수 없었죠."},{"start":303.7936666666667,"end":310.20866666666666,"cut":"P01-S05-C01","kr":"아이를 전장에 보내는 책임이 본인에게 떠넘겨진다는 것을 안 주군은 서명하지 않겠다고 못을 박습니다."},{"start":303.8316666666666,"end":310.7656666666667,"cut":"P01-S05-C01","jp":"子どもを戦場へ送り出す責任が自分に押しつけられるのだと悟った主君は、署名しないときっぱり告げます。"},{"start":310.6916666666666,"end":312.2546666666666,"cut":"P01-S05-C01","kr":"주군: 서명하지 않는다."},{"start":310.7656666666667,"end":312.4566666666666,"cut":"P01-S05-C01","jp":"主君：署名はしない。"},{"start":312.5946666666666,"end":314.8596666666666,"cut":"P01-S05-C01","jp":"今日は──いや、この先もだ。"},{"start":312.71866666666665,"end":314.74766666666665,"cut":"P01-S05-C01","kr":"오늘은— 아니, 앞으로도."},{"start":315.0556666666667,"end":319.0566666666667,"cut":"P01-S05-C04","jp":"チコは無事に帰り、主君は契約を阻止しました。"},{"start":315.06666666666666,"end":318.60266666666666,"cut":"P01-S05-C04","kr":"치코는 안전하게 돌아갔고, 주군은 계약을 막았습니다."},{"start":318.9446666666667,"end":322.1836666666667,"cut":"P01-S05-C04","kr":"하지만 결계는 계속 늘어나고 있었습니다."},{"start":319.1816666666667,"end":321.37966666666665,"cut":"P01-S05-C04","jp":"けれど、結界は増え続けていました。"},{"start":322.4166666666667,"end":326.4866666666667,"cut":"P01-S06-C01","jp":"主君の決意が揺らいだのは、それから間もなくのことでした。"},{"start":322.6016666666667,"end":325.7626666666667,"cut":"P01-S06-C01","kr":"주군의 결심이 흔들린 건 얼마 지나지 않아서였습니다."},{"start":326.4866666666667,"end":331.79466666666667,"cut":"P01-S06-C01","jp":"チコが幼なじみのヒスイと下校していた、ごく普通の夕暮れのことです。"},{"start":326.67266666666666,"end":330.79566666666665,"cut":"P01-S06-C01","kr":"치코가 소꿉친구 히스이와 하교를 하던 평범한 해질녘이었죠."},{"start":331.79466666666667,"end":339.4916666666667,"cut":"P01-S06-C01","jp":"ヒスイは、故郷では幼くして中忍になった実力者ですが、ここではチコと夕食の約束をしている生徒です。"},{"start":331.8186666666667,"end":339.1016666666667,"cut":"P01-S06-C01","kr":"히스이는 고향에서 어린 나이에 중급 닌자가 된 실력자였지만, 여기서는 치코와 저녁 약속을 하던 학생이죠."},{"start":339.78366666666665,"end":343.8586666666667,"cut":"P01-S06-C01","kr":"둘을 지켜보던 주군 앞에서 육교 건너편이 접힙니다."},{"start":339.9816666666667,"end":344.87966666666665,"cut":"P01-S06-C01","jp":"二人を見守る主君の目の前で、歩道橋の向こう側が折り畳まれます。"},{"start":344.8546666666667,"end":349.12466666666666,"cut":"P01-S06-C01","kr":"그리고 하필 히스이가 비틀린 공간 너머로 삼켜졌죠."},{"start":345.0316666666667,"end":350.21666666666664,"cut":"P01-S06-C01","jp":"そして、よりによってヒスイが、歪んだ空間の向こうへ吞み込まれてしまったのです。"},{"start":350.6906666666667,"end":358.35566666666665,"cut":"P01-S06-C01","kr":"결계로 들어가려 0846666666667,"cut":"P01-S06-C01","jp":"いつも先にチコの手を握ってくれた友だちが、今は中に閉じ込められています。"},{"start":393.0106666666667,"end":394.92566666666664,"cut":"P01-S06-C01","kr":"치코: 저, 저기요……!"},{"start":393.18966666666665,"end":395.39566666666667,"cut":"P01-S06-C01","jp":"チコ：あ、あの……！"},{"start":395.36566666666664,"end":396.5996666666667,"cut":"P01-S06-C01","kr":"서, 서명해 주세요…!"},{"start":395.43966666666665,"end":398.1476666666667,"cut":"P01-S06-C01","jp":"しょ、署名してください…！"},{"start":398.20366666666666,"end":406.04466666666667,"cut":"P01-S06-C01","jp":"チコ：ヒスイちゃんがあの中にいるのに、怖くて何もできないのが……そ、それが一番、嫌なんです……！"},{"start":398.23066666666665,"end":405.03566666666666,"cut":"P01-S06-C01","kr":"치코: 히스이 쨩이 저 안에 있는데, 무서워서 아무것도 못 하는 게…… 그, 그게 제일, 싫어요……!"},{"start":405.97266666666667,"end":408.38966666666664,"cut":"P01-S06-C01","kr":"주군은 마지못해 수긍합니다."},{"start":406.21366666666665,"end":408.8686666666667,"cut":"P01-S06-C01","jp":"主君は、しぶしぶうなずきます。"},{"start":408.84166666666664,"end":412.4426666666667,"cut":"P01-S06-C01","kr":"와카가 계약서를 펼치고 타마가 펜을 물어 옵니다."},{"start":408.8686666666667,"end":412.65366666666665,"cut":"P01-S06-C01","jp":"ワカが契約書を広げ、タマがペンをくわえてきます。"},{"start":413.45166666666665,"end":417.22766666666666,"cut":"P01-S07-C02","kr":"계약서에서 주군이 서명할 곳은 ‘입회인’ 란입니다."},{"start":413.56466666666665,"end":418.2026666666667,"cut":"P01-S07-C02","jp":"契約書で主君が署名するのは「立会人」の欄です。"},{"start":418.30466666666666,"end":425.2816666666667,"cut":"P01-S07-C02","jp":"主君は最後まで、契約書の全文を見せるよう求めますが、ワカは時間がないと急かします。"},{"start":418.36066666666665,"end":423.9066666666667,"cut":"P01-S07-C02","kr":"주군은 끝까지 문서 전체를 보여 달라고 요구하지만, 와카는 시간이 없다며 재촉합니다."},{"start":425.3446666666667,"end":429.36466666666666,"cut":"P01-S07-C02","jp":"結局、主君は読めていない巻物に自分の名を記します。"},{"start":425.4236666666667,"end":429.26166666666666,"cut":"P01-S07-C02","kr":"결국 주군은 읽지 못한 두루마리에 자신의 이름을 적습니다."},{"start":429.97166666666664,"end":433.3206666666666,"cut":"P01-S07-C04","kr":"서명이 끝나자 새벽빛이 치코를 감쌉니다."},{"start":430.16166666666663,"end":434.31066666666663,"cut":"P01-S07-C04","jp":"署名が終わると、夜明けの光がチコを包みます。"},{"start":434.2826666666666,"end":436.9896666666666,"cut":"P01-S07-C04","kr":"빛 속에서 와카가 이름을 묻습니다."},{"start":434.4316666666666,"end":437.5716666666666,"cut":"P01-S07-C04","jp":"光の中で、ワカが名前を尋ねます。"},{"start":437.53166666666664,"end":440.0686666666666,"cut":"P01-S07-C04","kr":"와카: 마법소녀에겐 이름이 필요해!"},{"start":437.5716666666666,"end":441.2176666666666,"cut":"P01-S07-C04","jp":"ワカ：魔法少女には名前が必要だよ！"},{"start":441.2176666666666,"end":442.7596666666666,"cut":"P01-S07-C04","jp":"なんて呼ばれたい？"},{"start":441.2686666666666,"end":442.2356666666666,"cut":"P01-S07-C04","kr":"뭐라고 불릴래?"},{"start":442.8446666666666,"end":446.2766666666666,"cut":"P01-S07-C04","jp":"チコ：……チコりんに、します！"},{"start":442.8716666666666,"end":445.0466666666666,"cut":"P01-S07-C04","kr":"치코: ……치코링으로, 할게요!"},{"start":446.3026666666666,"end":452.1916666666666,"cut":"P01-S07-C04","kr":"치코는 [여명의 소녀]라는 칭호를 받고, 마법소녀 치코링으로 모습을 드러냅니다."},{"start":446.3446666666666,"end":453.8986666666666,"cut":"P01-S07-C04","jp":"チコは[黎明の少女]という称号を授かり、魔法少女チコりんとして姿を現します。"},{"start":453.8716666666666,"end":458.7446666666666,"cut":"P01-S07-C04","kr":"그녀가 결계 앞에 서자, 주군이 열 수 없었던 경계가 열립니다."},{"start":454.0146666666666,"end":459.53666666666663,"cut":"P01-S07-C04","jp":"彼女が結界の前に立つと、主君には開けられなかった境界が開きます。"},{"start":459.5296666666666,"end":462.51966666666664,"cut":"P01-S07-C04","kr":"치코링은 히스이를 구하러 안으로 들어가죠."},{"start":459.6146666666666,"end":463.3116666666666,"cut":"P01-S07-C04","jp":"チコりんはヒスイを救うため、その中へ入っていくのです。"},{"start":463.50133333333326,"end":469.9113333333333,"cut":"P01-S07-C05","jp":"チコは不慣れながらも、ついに怪異を倒し、ヒスイとともに結界の外へ戻ってきます。"},{"start":463.5763333333333,"end":468.7013333333333,"cut":"P01-S07-C05","kr":"치코는 서툴지만 끝내 괴이를 물리치고, 히스이와 결계 밖으로 돌아옵니다."},{"start":470.4803333333333,"end":474.21533333333326,"cut":"P01-S08-C01","jp":"チコりんを抱きしめたヒスイも、魔法少女になると言います。"},{"start":470.5773333333333,"end":473.8843333333333,"cut":"P01-S08-C01","kr":"치코링을 껴안은 히스이도 마법소녀가 되겠다고 합니다."},{"start":474.1873333333333,"end":481.1373333333333,"cut":"P01-S08-C01","kr":"치코링이 위험하다며 말리지만 히스이는 안에서 친구가 떨면서 자신을 부르는 소리를 들어버렸습니다."},{"start":474.33533333333327,"end":481.6533333333333,"cut":"P01-S08-C01","jp":"チコりんは危ないと止めますが、ヒスイは結界の中で、友だちが震えながら自分を呼ぶ声を聞いてしまったのです。"},{"start":481.7653333333333,"end":486.7673333333333,"cut":"P01-S08-C01","jp":"自分を救いに来た友だちを、これから一人で怖がらせておくことはできませんでした。"},{"start":481.7933333333333,"end":486.0463333333333,"cut":"P01-S08-C01","kr":"자기를 구하러 온 친구가 앞으로 혼자 무서워하게 둘 수 없었던 거죠."},{"start":486.90533333333326,"end":489.3653333333333,"cut":"P01-S08-C01","kr":"한 번의 서명이 다음 서명을 부릅니다."},{"start":486.9453333333333,"end":489.6903333333333,"cut":"P01-S08-C01","jp":"一度の署名が、次の署名を呼びます。"},{"start":489.6903333333333,"end":492.2003333333333,"cut":"P01-S08-C01","jp":"ヒスイ：危ないから、やるんじゃん。"},{"start":489.7593333333333,"end":491.9023333333333,"cut":"P01-S08-C01","kr":"히스이: 위험하니까 하는 거잖아."},{"start":492.3373333333333,"end":495.4503333333333,"cut":"P01-S08-C01","jp":"チコがやるのに、私だけ寝てるわけにいかないでしょ。"},{"start":492.3603333333333,"end":494.64533333333327,"cut":"P01-S08-C01","kr":"네가 하는데, 내가 자고 있을 순 없지."},{"start":495.5573333333333,"end":496.4373333333333,"cut":"P01-S08-C01","jp":"……めんどくさいけど。"},{"start":495.5763333333333,"end":496.3663333333333,"cut":"P01-S08-C01","kr":"……귀찮지만."},{"start":496.5763333333333,"end":496.625,"cut":"P01-S08-C01","kr":"히스이는 치코링이 붙여 준 이름을 써, 바람을 다루는 [선풍의 소녀] 히땅이 됩니다."},{"start":496.625,"end":502.3843333333333,"cut":"P01-S08-C02","kr":"히스이는 치코링이 붙여 준 이름을 써, 바람을 다루는 [선풍의 소녀] 히땅이 됩니다."},{"start":496.625,"end":503.0113333333333,"cut":"P01-S08-C02","jp":"ヒスイはチコりんにつけてもらった名を使い、風を操る[旋風の少女]、ひーたんになります。"},{"start":503.25,"end":506.04,"cut":"P01-S08-C03","kr":"아이들이 돌아올 거점은 쿠로코가 내줍니다."},{"start":503.25,"end":507.416,"cut":"P01-S08-C03","jp":"子どもたちが帰ってこられる拠点を用意してくれたのは、クロコでした。"},{"start":507.563,"end":512.053,"cut":"P01-S08-C03","kr":"고향에서 건축 인술로 방벽을 짓던 쿠로코는 여기서는 목수였죠."},{"start":507.57,"end":512.8030000000001,"cut":"P01-S08-C03","jp":"故郷で建築の忍術を使って防壁を築いていたクロコは、ここでは大工です。"},{"start":512.96,"end":517.009,"cut":"P01-S08-C03","jp":"夜の危険から目をそらすわけにはいかないと、木工所を貸してくれます。"},{"start":512.9839999999999,"end":516.453,"cut":"P01-S08-C03","kr":"밤의 위험을 외면하지 않겠다며 목공소를 빌려줍니다."},{"start":517.193,"end":521.1300000000001,"cut":"P01-S08-C03","jp":"[閃華の少女]ネネりん、[輪廻の少女]エンマまで。"},{"start":517.3779999999999,"end":521.0160000000001,"cut":"P01-S08-C03","kr":"[섬화의 소녀] 네네링, [윤회의 소녀] 엔마까지."},{"start":521.2539999999999,"end":525.7539999999999,"cut":"P01-S08-C03","jp":"散り散りだった魔法少女たちが、この木工所を拠点に集まりました。"},{"start":521.3309999999999,"end":525.0540000000001,"cut":"P01-S08-C03","kr":"흩어져 있던 마법소녀들이 이 목공소를 거점으로 모였습니다."},{"start":525.914,"end":531.9639999999999,"cut":"P01-S08-C03","jp":"寝られる場所は古いソファだけですが、少女たちは食事を分け合い、笑い、互いを慰めます。"},{"start":525.9269999999999,"end":532.511,"cut":"P01-S08-C03","kr":"잘 수 있는 곳은 낡은 소파뿐이지만, 소녀들은 음식을 나누고, 웃고, 서로에게 위로가 됩니다."},{"start":532.4649999999999,"end":532.5833333333333,"cut":"P01-S08-C03","kr":"치코링은 겁났던 일과 좋았던 일을 일기에 적습니다."},{"start":532.5833333333334,"end":536.59,"cut":"P01-S08-C04-02","kr":"치코링은 겁났던 일과 좋았던 일을 일기에 적습니다."},{"start":532.6360000000001,"end":536.354,"cut":"P01-S08-C04-02","jp":"チコりんは、怖かったことと嬉しかったことを日記に書きます。"},{"start":536.9166666666666,"end":542.4056666666667,"cut":"P01-S09-C01","kr":"치코링은 동경하던 스타, [유성의 소녀] 쥬리땅의 공개전도 처음 보러 갑니다."},{"start":536.9506666666666,"end":543.1576666666666,"cut":"P01-S09-C01","jp":"チコりんは、憧れのスター、[流星の少女]ジュリたんの公開戦にも初めて足を運びます。"},{"start":543.1296666666667,"end":548.2186666666666,"cut":"P01-S09-C01","kr":"쥬리땅은 고향에서 프로 닌자를 꿈꾸던 갸루, 쥬리와 같은 얼굴이었죠."},{"start":543.2506666666667,"end":547.8306666666666,"cut":"P01-S09-C01","jp":"ジュリたんは、故郷でプロの忍者を夢見ていたギャル、ジュリと同じ顔でした。"},{"start":548.5276666666666,"end":552.3886666666667,"cut":"P01-S09-C02","kr":"공개전은 시민들이 실제 괴이 퇴치를 관전하는 행사입니다."},{"start":548.5346666666667,"end":552.7756666666667,"cut":"P01-S09-C02","jp":"公開戦は、市民が実際の怪異退治を観戦する催しです。"},{"start":552.9546666666666,"end":557.8866666666667,"cut":"P01-S09-C02","kr":"결계 예보가 뜰 때마다 안전선이 그어지고 노점과 전광판이 들어섭니다."},{"start":552.9646666666666,"end":557.8646666666667,"cut":"P01-S09-C02","jp":"結界予報が出るたびに安全線が引かれ、屋台や電光掲示板が並びます。"},{"start":557.9996666666667,"end":565.4646666666666,"cut":"P01-S09-C02","kr":"쥬리땅은 웃으며 손을 흔드는 관록의 팬서비스를 보이는 동시에 괴이를 관객 반대편으로 유인해 처치합니다."},{"start":558.1396666666667,"end":566.2406666666667,"cut":"P01-S09-C02","jp":"ジュリたんは、堂に入ったファンサービスで笑顔を振りまき、手を振りながらも、怪異を観客とは逆の方向へ誘導して倒します。"},{"start":566.2146666666666,"end":572.6556666666667,"cut":"P01-S09-C02","kr":"그녀는 무서운 결계의 밤을 축제로 바꿨고, 덕분에 도시는 그녀와 마법 소녀를 사랑했죠."},{"start":566.3796666666667,"end":572.9696666666666,"cut":"P01-S09-C02","jp":"彼女は恐ろしい結界の夜を祭りに変え、そのおかげで、街は彼女と魔法少女を愛していました。"},{"start":573.3096666666667,"end":577.1856666666666,"cut":"P01-S09-C04","jp":"チコりんはジュリたんにサインをもらい、憧れを打ち明けます。"},{"start":573.3626666666667,"end":576.9306666666666,"cut":"P01-S09-C04","kr":"치코링은 쥬리땅에게 싸인을 받으며 동경을 고백합니다."},{"start":577.3396666666666,"end":582.6576666666666,"cut":"P01-S09-C04","jp":"するとジュリたんは、チコりんにだけ、ほんの一瞬、ステージの笑顔を消し、忠告します。"},{"start":577.4026666666666,"end":582.3386666666667,"cut":"P01-S09-C04","kr":"그러자, 쥬리땅은 치코링에게만 잠깐 무대의 웃음을 거두고 경고합니다."},{"start":582.7856666666667,"end":582.8333333333333,"cut":"P01-S09-C04","kr":"쥬리땅: ……저기, 신입 씨."},{"start":582.8333333333334,"end":585.0256666666668,"cut":"P01-S09-C04-02","kr":"쥬리땅: ……저기, 신입 씨."},{"start":582.8333333333334,"end":584.6766666666667,"cut":"P01-S09-C04-02","jp":"ジュリたん：……ねえ、新入りさん。"},{"start":585.0386666666668,"end":585.9156666666668,"cut":"P01-S09-C04-02","kr":"하나만."},{"start":585.1226666666668,"end":586.1106666666668,"cut":"P01-S09-C04-02","jp":"ひとつだけ。"},{"start":586.0836666666668,"end":587.6336666666667,"cut":"P01-S09-C04-02","kr":"무대는 즐거워."},{"start":586.1106666666668,"end":587.7196666666667,"cut":"P01-S09-C04-02","jp":"ステージは楽しいよ。"},{"start":587.6436666666668,"end":589.2276666666668,"cut":"P01-S09-C04-02","kr":"박수도, 조명도."},{"start":587.8956666666668,"end":589.3106666666667,"cut":"P01-S09-C04-02","jp":"拍手も、照明も。"},{"start":589.2816666666668,"end":593.7926666666668,"cut":"P01-S09-C04-02","kr":"그치만— 박수 때문에 싸우게 되면, 그건 좀 위험 신호야."},{"start":589.4056666666668,"end":594.0956666666668,"cut":"P01-S09-C04-02","jp":"でも──拍手のために戦うようになったら、それはちょっと危険信号だよ。"},{"start":594.2056666666667,"end":594.2500000000001,"cut":"P01-S09-C04-02","kr":"축제가 끝나고 돌아가는 골목, 주군과 소녀들에게 구두 소리가 다가옵니다."},{"start":594.25,"end":599.4010000000001,"cut":"P01-S10-C01","kr":"축제가 끝나고 돌아가는 골목, 주군과 소녀들에게 구두 소리가 다가옵니다."},{"start":594.461,"end":598.941,"cut":"P01-S10-C01","jp":"祭りを終えて帰る路地で、主君たちに靴音が近づいてきます。"},{"start":599.702,"end":601.0150000000001,"cut":"P01-S10-C01","kr":"공기마저 멎었죠."},{"start":599.754,"end":601.249,"cut":"P01-S10-C01","jp":"空気さえ止まりました。"},{"start":601.2610000000001,"end":606.0830000000001,"cut":"P01-S10-C01","kr":"모습을 드러낸 존재는 마녀들의 정점, [절화의 마녀] 이리스였습니다."},{"start":601.5540000000001,"end":606.384,"cut":"P01-S10-C01","jp":"姿を現したのは、魔女たちの頂点、[切花の魔女]イリス。"},{"start":606.6890000000001,"end":612.6060000000001,"cut":"P01-S10-C01","kr":"주군에게는 빵과 꽃을 좋아하며 닌자가 되려던 고향의 아야메와 같은 얼굴이었습니다."},{"start":606.7180000000001,"end":612.349,"cut":"P01-S10-C01","jp":"主君には、パンと花が好きで、忍者になろうとしていた故郷のアヤメと同じ顔に見えました。"},{"start":612.8380000000001,"end":615.816,"cut":"P01-S10-C01","jp":"レオナは全員に散開するよう叫びます。"},{"start":612.9200000000001,"end":615.3420000000001,"cut":"P01-S10-C01","kr":"레오나가 모두 산개하라 외쳤지만,"},{"start":615.753,"end":621.1260000000001,"cut":"P01-S10-C01","kr":"치코링은 물러나려 해도 몸이 움직이지 않았고, 주군도 발을 뗄 수 없었습니다."},{"start":615.8320000000001,"end":621.416,"cut":"P01-S10-C01","jp":"けれど、チコりんは後ずさろうとしても体が動かず、主君も一歩も動けません。"},{"start":621.446,"end":627.648,"cut":"P01-S10-C01","kr":"이리스는 공격하는 대신 꽃을 살피듯 소녀들을 훑다가, 치코링 앞에서 시선을 멈춥니다."},{"start":621.489,"end":628.048,"cut":"P01-S10-C01","jp":"イリスは攻撃する代わりに、花を見定めるように少女たちを見渡し、チコりんの前で視線を止めます。"},{"start":628.048,"end":630.493,"cut":"P01-S10-C01","jp":"イリス：──まだ、満開ではないんですね。"},{"start":628.2700000000001,"end":630.903,"cut":"P01-S10-C01","kr":"이리스: — 아직, 만개하지 않았네요."},{"start":631.1170000000001,"end":632.6220000000001,"cut":"P01-S10-C01","jp":"チコりん：ま、満開……？"},{"start":631.1400000000001,"end":633.0730000000001,"cut":"P01-S10-C01","kr":"치코링: 마, 만개……?"},{"start":633.426,"end":635.2810000000001,"cut":"P01-S10-C01","jp":"レオナ：……どういう意味だ、それ。"},{"start":633.49,"end":635.513,"cut":"P01-S10-C01","kr":"레오나: ……무슨 뜻이야, 그거."},{"start":635.806,"end":637.1060000000001,"cut":"P01-S10-C01","jp":"イリス：ふふ。"},{"start":635.8530000000001,"end":637.498,"cut":"P01-S10-C01","kr":"이리스: 후후."},{"start":637.726,"end":638.9530000000001,"cut":"P01-S10-C01","kr":"서두르지 않아도 돼요."},{"start":637.782,"end":639.4380000000001,"cut":"P01-S10-C01","jp":"急がなくていいんですよ。"},{"start":639.368,"end":640.8770000000001,"cut":"P01-S10-C01","kr":"꽃은 반드시 피니까."},{"start":639.623,"end":641.416,"cut":"P01-S10-C01","jp":"花は必ず咲きますから。"},{"start":641.3180000000001,"end":643.0400000000001,"cut":"P01-S10-C01","kr":"……그때 또 만나요, 여러분."},{"start":641.4860000000001,"end":643.5160000000001,"cut":"P01-S10-C01","jp":"……その時にまた会いましょう、皆さん。"},{"start":643.7570000000001,"end":646.3950000000001,"cut":"P01-S10-C01","kr":"그녀가 사라지자 일행은 주저앉습니다."},{"start":643.8560000000001,"end":647.023,"cut":"P01-S10-C01","jp":"彼女が去ると、一行はその場にへたり込みます。"},{"start":647.1840000000001,"end":648.956,"cut":"P01-S10-C01","kr":"싸워 보지도 못한 상대였습니다."},{"start":647.2360000000001,"end":649.1510000000001,"cut":"P01-S10-C01","jp":"戦うことすらできない相手でした。"},{"start":649.043,"end":653.2520000000001,"cut":"P01-S10-C01","kr":"치코링: 레, 레오나 씨…… 저 사람은, 대체……."},{"start":649.1510000000001,"end":652.4730000000001,"cut":"P01-S10-C01","jp":"チコりん：レ、レオナさん……あの人は、いったい……。"},{"start":653.3130000000001,"end":655.577,"cut":"P01-S10-C01","kr":"레오나: ……지금은 몰라도 돼."},{"start":653.5550000000001,"end":655.676,"cut":"P01-S10-C01","jp":"レオナ：……今は知らなくていい。"},{"start":655.6320000000001,"end":658.9830000000001,"cut":"P01-S10-C01","kr":"아니— 부탁이니까, 모르는 채로 있어 줘."},{"start":655.7650000000001,"end":658.97,"cut":"P01-S10-C01","jp":"いや──頼むから、知らないままでいてくれ。"},{"start":658.96,"end":660.989,"cut":"P01-S10-C01","kr":"그날은 무사히 돌아갑니다."},{"start":659.094,"end":661.652,"cut":"P01-S10-C01","jp":"その日は、無事に帰ることができました。"},{"start":661.625,"end":665.951,"cut":"P01-S10-C01","kr":"이리스가 기다린다는 만개가 무엇인지는, 듣지 못한 채로요."},{"start":661.724,"end":665.2660000000001,"cut":"P01-S10-C01","jp":"イリスが待つという「満開」が何なのか、聞けないままに。"},{"start":666.3333333333334,"end":673.3023333333334,"cut":"P01-S11-C01","jp":"一行は、新たに現れた結界の危険を探るため、座標を頼りに丘の上の聖堂を偵察します。"},{"start":666.4883333333335,"end":672.3653333333334,"cut":"P01-S11-C01","kr":"일행은 새로 등장한 결계의 위험을 알아보려 좌표를 따라 언덕 위 성당을 정찰합니다."},{"start":673.4583333333334,"end":676.8883333333334,"cut":"P01-S11-C01","jp":"足を踏み入れると、これまでとは格が違うとわかりました。"},{"start":673.5343333333334,"end":677.1043333333334,"cut":"P01-S11-C01","kr":"들어서자 지금까지와는 격이 다르다는 것을 알 수 있었죠."},{"start":677.5273333333334,"end":682.9753333333334,"cut":"P01-S11-C01","jp":"薔薇の蔓が出入口を覆い、[結縛の魔女]エグランティーヌが迎えます。"},{"start":677.6963333333334,"end":682.4463333333334,"cut":"P01-S11-C01","kr":"장미 덩굴이 출입구를 덮고, [결박의 마녀] 에글랑틴이 맞이합니다."},{"start":683.1183333333335,"end":687.8643333333334,"cut":"P01-S11-C01","kr":"고향에서는 포박술을 사용하던 견습무녀 시즈쿠의 얼굴을 하고 있었죠."},{"start":683.1263333333334,"end":687.3433333333334,"cut":"P01-S11-C01","jp":"故郷で捕縛術を使っていた見習い巫女、シズクと同じ顔をしていました。"},{"start":688.1693333333334,"end":688.2083333333334,"cut":"P01-S11-C01","kr":"에글랑틴: 이리스 님이 말씀하셨어요."},{"start":688.2083333333334,"end":691.1713333333335,"cut":"P01-S11-C01B-03","kr":"에글랑틴: 이리스 님이 말씀하셨어요."},{"start":688.2083333333334,"end":690.7813333333335,"cut":"P01-S11-C01B-03","jp":"エグランティーヌ：イリスさまがおっしゃいましたの。"},{"start":691.5913333333334,"end":694.5083333333334,"cut":"P01-S11-C01B-03","jp":"もうすぐ、きれいに咲くお花たちが来るって。"},{"start":691.6043333333334,"end":693.8143333333334,"cut":"P01-S11-C01B-03","kr":"곧, 예쁘게 필 꽃들이 온다고."},{"start":694.4763333333334,"end":698.0463333333335,"cut":"P01-S11-C01B-03","kr":"…그러니 시들기 전에, 여기 묶여 있어요."},{"start":694.5913333333334,"end":698.0903333333334,"cut":"P01-S11-C01B-03","jp":"…ですから、枯れる前に、ここに結わえられていてくださいな。"},{"start":698.0623333333334,"end":699.5843333333335,"cut":"P01-S11-C01B-03","kr":"제가 지켜 드릴게요."},{"start":698.0903333333334,"end":699.9953333333334,"cut":"P01-S11-C01B-03","jp":"わたくしがお守りしますわ。"},{"start":699.9323333333334,"end":702.6193333333334,"cut":"P01-S11-C01B-03","kr": 3334,"kr":"시들 수 있다는 걸 알면서 왜 계속하느냐고요.","jp":"枯れるかもしれないと知りながら、なぜ続けるのか、と。","cut":"P02-S01-C01"},{"start":1023.6333333333333,"end":1024.964367816092,"kr":"……무, 무서워요.","jp":"……こ、怖いです。","cut":"P02-S01-C01"},{"start":1024.964367816092,"end":1026.2954022988506,"kr":"무서운데요.","jp":"怖いですけど。","cut":"P02-S01-C01"},{"start":1026.2954022988506,"end":1031.3533333333335,"kr":"그치만— 오늘 밤 누가 다치는 건 '지금' 무섭잖아요.","jp":"でも──今夜誰かがケガするのは、『今』怖いじゃないですか。","cut":"P02-S01-C01"},{"start":1031.6533333333334,"end":1035.7833333333333,"kr":"내일 시드는 건…… 내일의 내가 무서워하면 되니까……!","jp":"明日枯れるのは……明日の私が怖がれば、いいですから……！","cut":"P02-S01-C01"},{"start":1036.5416666666667,"end":1042.1069496855346,"kr":"주군도 계약을 끝낼 단서를 찾아 더 적극적으로 움직입니다.","jp":"主君も、契約を終わらせる手がかりを求め、さらに積極的に動きます。","cut":"P02-S01-C02"},{"start":1042.1069496855346,"end":1048.8316666666667,"kr":"아이들이 싸우는 동안, 그들을 살아서 돌아오게 할 길을 찾아야 했습니다.","jp":"子どもたちが戦っているあいだに、彼女たちを生きて帰らせる道を見つけなければなりませんでした。","cut":"P02-S01-C02"},{"start":1049.5833333333333,"end":1055.594658634538,"kr":"주군과 치코링은 소문을 따라, 골목 안 오래된 찻집을 찾아갑니다.","jp":"主君とチコりんは、噂を頼りに路地裏の古い喫茶店を訪ねます。","cut":"P02-S02-C01"},{"start":1055.594658634538,"end":1062.156091954023,"kr":"주인은 만개 직전에 스스로 멈춘 유일한 생환자, [빙화의 소녀], 세나.","jp":"店主は、満開の直前で自ら立ち止まった唯一の生還者、[氷華の少女]セナ。","cut":"P02-S02-C01"},{"start":1062.156091954023,"end":1068.7733333333333,"kr":"세나는 [절화의 마녀] 이리스가 [만개의 소녀]이던 시절의 이야기를 들려줍니다.","jp":"セナは、[切花の魔女]イリスが、[満開の少女]だった頃の話をしてくれます。","cut":"P02-S02-C01"},{"start":1069.5416666666667,"end":1076.1358205128206,"kr":"세나가 기억하는 [만개의 소녀]는 누구보다 강하고 다정한 동료였습니다.","jp":"セナの記憶にある[満開の少女]は、誰よりも強く、優しい仲間でした。","cut":"P02-S02-C02"},{"start":1076.1358205128206,"end":1084.3216666666667,"kr":"시들어 가는 친구들을 모두 지키려고 가장 간절히 싸웠고, 그래서 누구보다 먼저 만개했죠.","jp":"枯れていく友だちをみんな守ろうと、誰よりも必死に戦い、だからこそ、誰よりも先に満開になったのです。","cut":"P02-S02-C02"},{"start":1084.6216666666667,"end":1091.7778205128207,"kr":"모두가 기대던 소녀에게는 정작 자신이 무너지는 모습을 보일 곳이 없었습니다.","jp":"誰もが頼りにしていたその少女には、自分が崩れていく姿を見せられる場所がありませんでした。","cut":"P02-S02-C02"},{"start":1091.7778205128207,"end":1097.9116666666669,"kr":"결국 시들어 가는 모습을 누구에게도 보이고 싶지 않아, 스스로를 꺾고 말았습니다.","jp":"ついに、枯れていく姿を誰にも見せたくないと、自らを切り落としてしまったのです。","cut":"P02-S02-C02"},{"start":1098.6666666666667,"end":1105.7466666666667,"kr":"세나는 이리스가 자신이 겪은 고통을 다른 누구도 겪지 않게 하려 한다고 말합니다.","jp":"セナは、イリスが自分と同じ苦しみを、ほかの誰にも味わわせまいとしているのだと言います。","cut":"P02-S02-C04"},{"start":1106.5,"end":1113.8,"kr":"시들기 전에 세계째로 꺾어, 가장 아름다운 순간에 모두를 멈추려는 겁니다.","jp":"枯れる前に世界ごと切り落とし、いちばん美しい瞬間に、すべてを止めようとしているのです。","cut":"P02-S02-C04-02"},{"start":1113.8,"end":1118.97,"kr":"한때 동료를 지키던 다정함이, 이제는 그런 모양으로 뒤틀려 있었습니다.","jp":"かつて仲間を守っていた優しさは、今ではそんな形に歪んでいました。","cut":"P02-S02-C04-02"},{"start":1119.7083333333333,"end":1124.7683333333332,"kr":"치코링이 이길 방법을 묻자 세나의 답변은 짧았습니다.","jp":"勝つ方法をチコりんが尋ねると、セナの答えは短いものでした。","cut":"P02-S03-C01"},{"start":1125.2183333333332,"end":1126.8183333333332,"kr":"없어.","jp":"ない。","cut":"P02-S03-C01"},{"start":1127.5833333333333,"end":1133.581568627451,"kr":"이긴다는 것은 이리스보다 강해져, 활짝 핀다는 것을 의미했습니다.","jp":"勝つということは、イリスより強くなり、咲ききるということでした。","cut":"P02-S03-C01-02"},{"start":1133.581568627451,"end":1138.9133333333332,"kr":"그리고 그 끝은 치코링이 다음 [절화의 마녀]가 되는 것이었죠.","jp":"その行き着く先は、チコりんが次の[切花の魔女]になることです。","cut":"P02-S03-C01-02"},{"start":1139.6666666666667,"end":1146.2466666666667,"kr":"하지만 세나처럼 만개 전에 싸우지 않고 멈추면 도시가 삼켜집니다.","jp":"けれど、セナのように満開の前に戦いをやめて立ち止まれば、街が吞み込まれます。","cut":"P02-S03-C01-03"},{"start":1147.0,"end":1152.87,"kr":"싸우면 치코링이 지고, 안 싸우면 도시가 지는 문제였죠.","jp":"戦えばチコりんが敗れ、戦わなければ街が敗れる。そんな問題でした。","cut":"P02-S03-C01-04"},{"start":1153.17,"end":1163.4557142857143,"kr":"치코링이 문제 자체가 잘못됐다고 하자 세나는 그 말이 시작이라며 문제 밖에서 정답을 찾아보라고 합니다.","jp":"チコりんが、問題そのものが間違っていると言うと、セナはその言葉こそが始まりだと答え、問題の外で答えを探すよう勧めます。","cut":"P02-S03-C01-04"},{"start":1163.4557142857143,"end":1167.57,"kr":"지금껏 아무도 찾지 못했던 '이기지 않을 방법'을요.","jp":"これまで誰も見つけられなかった、「勝たない方法」を。","cut":"P02-S03-C01-04"},{"start":1167.87,"end":1171.5287323943662,"kr":"더 이상 세나가 아는 것은 없었습니다.","jp":"セナにも、それ以上のことはわかりませんでした。","cut":"P02-S03-C01-04"},{"start":1171.5287323943662,"end":1180.24,"kr":"다만, 이리스도 계약을 끝낼 '문'을 찾았지만, 자기 손에서는 노래하지 않는다고 했다는 단서를 남겼습니다.","jp":"ただ、イリスも契約を終わらせる「扉」を探したものの、自分の手では歌わないと言っていた、という手がかりを残します。","cut":"P02-S03-C01-04"},{"start":1181.0,"end":1185.3633720930234,"kr":"치코링은 에글랑틴을 다시 만나기로 합니다.","jp":"チコりんは、エグランティーヌにもう一度会うと決めます。","cut":"P02-S04-C01"},{"start":1185.3633720930234,"end":1190.5715942028985,"kr":"마녀도 한때 사람을 지키던 소녀라면 이야기가 통할지 모릅니다.","jp":"魔女もかつて人を守っていた少女なら、話が通じるかもしれません。","cut":"P02-S04-C01"},{"start":1190.5715942028985,"end":1196.01,"kr":"지난번에 일행을 끝까지 쫓지 않았다는 사실도 마음에 남았죠.","jp":"前の戦いで、一行を最後まで追ってこなかったことも、心に残っていました。","cut":"P02-S04-C01"},{"start":1196.31,"end":1199.3104,"kr":"히땅도 이번에는 옆에 섰습니다.","jp":"今度は、ひーたんも隣に立ちます。","cut":"P02-S04-C01"},{"start":1199.3104,"end":1207.85,"kr":"이야기가 통한다는 보장은 없지만 네네링이 쓰러진 곳에 치코링을 혼자 보낼 수 없었습니다.","jp":"話が通じる保証はありません。それでも、ネネりんが倒れた場所へ、チコりんを一人で行かせるわけにはいきませんでした。","cut":"P02-S04-C01"},{"start":1208.15,"end":1213.085142857143,"kr":"치코링은 이기려 온 것이 아니라며 빛의 무기를 내립니다.","jp":"チコりんは、勝ちに来たのではないと言って、光の武器を下ろします。","cut":"P02-S04-C01"},{"start":1213.085142857143,"end":1223.17,"kr":"히땅이 파편과 성당 밖으로 뻗는 덩굴을 막는 동안, 치코링은 가시에 찢기는 아픔을 견디며 에글랑틴에게 다가갑니다.","jp":"ひーたんが破片や聖堂の外へ伸びる蔓を食い止めるあいだ、チコりんは棘に裂かれる痛みに耐えながら、エグランティーヌへ近づいていきます。","cut":"P02-S04-C01"},{"start":1223.62,"end":1226.48,"kr":"……이기지 않는, 마법소녀?","jp":"……勝たない、魔法少女？","cut":"P02-S04-C01"},{"start":1226.78,"end":1229.04875,"kr":"후후…… 후후후.","jp":"ふふ……ふふふ。","cut":"P02-S04-C01"},{"start":1229.04875,"end":1234.04,"kr":"그건 그냥— 먹잇감이라고 하는 거랍니다.","jp":"それはただの……獲物ですわ。","cut":"P02-S04-C01"},{"start":1234.49,"end":1240.1399999999999,"kr":"그런데 치코링이 찔릴 때마다 에글랑틴이 먼저 움찔합니다.","jp":"ところが、チコりんが刺されるたびに、エグランティーヌの方が先に身を震わせます。","cut":"P02-S04-C01"},{"start":1240.59,"end":1242.3052,"kr":"오지 마세요.","jp":"来ないでください。","cut":"P02-S04-C01"},{"start":1242.3052,"end":1243.1628,"kr":"…오지 마.","jp":"…来ないで。","cut":"P02-S04-C01"},{"start":1243.1628,"end":1244.6636,"kr":"가시에 찢겨요.","jp":"棘に裂かれます。","cut":"P02-S04-C01"},{"start":1244.6636,"end":1245.95,"kr":"아프다구요.","jp":"痛いんですよ。","cut":"P02-S04-C01"},{"start":1246.3,"end":1247.6403846153846,"kr":"아, 아파요……!","jp":"い、痛いです……！","cut":"P02-S04-C01"},{"start":1247.6403846153846,"end":1249.5169230769231,"kr":"엄청 아파요……!","jp":"すごく痛いです……！","cut":"P02-S04-C01"},{"start":1249.5169230769231,"end":1253.27,"kr":"그, 그치만— 당신의 가시, 이상해요……!","jp":"で、でも──あなたの棘、おかしいです……！","cut":"P02-S04-C01"},{"start":1253.57,"end":1257.5491666666667,"kr":"찌르는 방향이…… 저, 전부, 안쪽이잖아요……!","jp":"棘の向きが……ぜ、全部、内側じゃないですか……！","cut":"P02-S04-C01"},{"start":1257.5491666666667,"end":1263.1200000000001,"kr":"그거, 묶는 게 아니라— 사실은, 노, 놓치기 싫은 거잖아요……!","jp":"それって、縛りたいんじゃなくて──本当は、は、離したくないんじゃないですか……！","cut":"P02-S04-C01"},{"start":1263.875,"end":1269.535,"kr":"치코링의 말에 [결박의 마녀]는 잊었던 이름을 떠올립니다.","jp":"チコりんの言葉に、[結縛の魔女]は、忘れていた名を思い出します。","cut":"P02-S05-C01"},{"start":1269.535,"end":1271.295,"kr":"[인연의 소녀].","jp":"[縁の少女]。","cut":"P02-S05-C01"},{"start":1271.295,"end":1274.825,"kr":"붉은 실로 사람들을 이어 주던 아이였습니다.","jp":"赤い糸で、人と人をつないでいた少女でした。","cut":"P02-S05-C01"},{"start":1275.105,"end":1282.165,"kr":"하지만 인연이 풀리는 게 두려워 매듭을 거듭 조였고, 실은 가시가 되었습니다.","jp":"けれど、縁がほどけるのが怖くて、何度も結び目を締め直すうちに、糸は棘になりました。","cut":"P02-S05-C01"},{"start":1282.165,"end":1286.5349999999999,"kr":"놓치기 싫다는 마음이 사람들을 가둔 거죠.","jp":"離したくないという気持ちが、人々を閉じ込めてしまったのです。","cut":"P02-S05-C01"},{"start":1287.2916666666667,"end":1292.1716666666666,"kr":"제단 앞까지 다가온 치코링 주변에서만 덩굴이 물러납니다.","jp":"祭壇の前まで近づいたチコりんの周りだけ、蔓が退いていきます。","cut":"P02-S05-C03"},{"start":1292.9583333333333,"end":1295.9883333333332,"kr":"치코링이 빈손을 내밉니다.","jp":"チコりんが何も持たない手を差し出します。","cut":"P02-S05-C03-hands"},{"start":1296.4383333333333,"end":1297.8789583333332,"kr":"이, 인연은요.","jp":"き、絆は。","cut":"P02-S05-C03-hands"},{"start":1297.8789583333332,"end":1301.0483333333332,"kr":"묶는 게 아니라— 잡는 거예요.","jp":"縛るものじゃなくて——つかむもの、です。","cut":"P02-S05-C03-hands"},{"start":1301.4983333333334,"end":1304.8583333333333,"kr":"마침내 에글랑틴이 치코링의 손을 잡습니다.","jp":"ついにエグランティーヌがチコりんの手を取ります。","cut":"P02-S05-C03-hands"},{"start":1305.625,"end":1316.605,"kr":"아무도 놓치지 않으려 붙들고 있던 마음을 놓자, 소녀들을 조이던 덩굴이 풀리고 에글랑틴의 몸도 발끝부터 사라지기 시작합니다.","jp":"誰一人失いたくないと抱き続けていた想いを手放すと、少女たちを締めつけていた蔓がほどけ、エグランティーヌの体も足先から消えはじめます。","cut":"P02-S05-C03-farewell"},{"start":1317.055,"end":1317.705,"kr":"……아아.","jp":"……ああ。","cut":"P02-S05-C03-farewell"},{"start":1317.705,"end":1320.2522972972974,"kr":"그런, 거였군요.","jp":"そういう、ことでしたのね。","cut":"P02-S05-C03-farewell"},{"start":1320.2522972972974,"end":1326.1550000000002,"kr":"마녀는— 이 마음을 놓으면, 몸도 사라지는 거였어요.","jp":"魔女は……この想いを手放すと、体も消えてしまうのですね。","cut":"P02-S05-C03-farewell"},{"start":1326.455,"end":1334.055,"kr":"저를 붙들고 있던 건, 이 힘이 아니라— '놓치기 싫다'는 마음이었으니까.","jp":"わたくしをつなぎとめていたのは、この力ではなく──『誰も失いたくない』という想いでしたから。","cut":"P02-S05-C03-farewell"},{"start":1334.505,"end":1339.2064285714287,"kr":"에글랑틴은 희미해지는 손끝을 바라봅니다.","jp":"エグランティーヌは、薄れていく指先を見つめます。","cut":"P02-S05-C03-farewell"},{"start":1339.2064285714287,"end":1345.4750000000001,"kr":"놀란 치코링이 취소하려 해도, 에글랑틴은 손을 더 꼭 쥡니다.","jp":"驚いたチコりんが今のことを取り消そうとしても、エグランティーヌはその手を、さらに強く握ります。","cut":"P02-S05-C03-farewell"},{"start":1345.775,"end":1356.035,"kr":"마지막에 가시 없이 손을 잡은 것으로 충분하다며, 치코링과 히땅에게 [인연의 소녀]라는 이름을 기억해 달라고 부탁합니다.","jp":"最後に、棘のない手をつなげただけで十分だと告げ、チコりんとひーたんに、[縁の少女]という名を覚えていてほしいと頼みます。","cut":"P02-S05-C03-farewell"},{"start":1356.335,"end":1362.625,"kr":"따뜻했던 손이 사라지자 치코링이 울음을 터뜨리고, 히땅이 안아 줍니다.","jp":"温かかった手が消えると、チコりんは泣き出し、ひーたんが抱きしめます。","cut":"P02-S05-C03-farewell"},{"start":1362.9250000000002,"end":1365.0500000000002,"kr":"소녀들은 이제 배웠습니다.","jp":"少女たちは、知りました。","cut":"P02-S05-C03-farewell"},{"start":1365.0500000000002,"end":1370.0727272727272,"kr":"마녀와 손을 잡을 수는 있어도, 사람으로 되돌릴 수는 없었습니다.","jp":"魔女と手をつなぐことはできても、人に戻すことはできない。","cut":"P02-S05-C03-farewell"},{"start":1370.0727272727272,"end":1375.6750000000002,"kr":"남은 소녀들에게는 마녀가 되기 전에 살아서 나갈 출구가 필요했습니다.","jp":"残された少女たちには、魔女になる前に、生きて出られる出口が必要でした。","cut":"P02-S05-C03-farewell"},{"start":1376.4583333333333,"end":1380.5647980779613,"kr":"도시의 전광판에서 실패를 골라 방송하던 벨.","jp":"街の画面で失敗ばかりを選んで放送していたベル。","cut":"P02-BELLE-C01"},{"start":1380.5647980779613,"end":1384.2979478458049,"kr":"주군은 그 얼굴에서 고향의 메이를 떠올렸습니다.","jp":"その顔に、主君は故郷のメイを思い出しました。","cut":"P02-BELLE-C01"},{"start":1385.125,"end":1391.025,"kr":"료가 회선을 뒤집자, 화면에는 편집되지 않은 진실이 흐릅니다.","jp":"リョウが回線を切り替えると、画面には編集されていない真実が流れます。","cut":"P02-BELLE-C02"},{"start":1391.025,"end":1396.525,"kr":"무너지는 탑에서 사람을 구하는 소녀들, 그리고 광장의 노래였죠.","jp":"崩れる塔から人を救う少女たち、そして広場の歌でした。","cut":"P02-BELLE-C02"},{"start":1396.945,"end":1398.825,"kr":"……바보 아냐?","jp":"……バカじゃないの？","cut":"P02-BELLE-C02"},{"start":1398.825,"end":1402.285,"kr":"남의 성이 무너지는데, 왜…….","jp":"他人の城が崩れているのに、どうして……。","cut":"P02-BELLE-C02"},{"start":1402.705,"end":1405.695,"kr":"벨 씨의 화면으로, 모두가 보고 있어요!","jp":"ベルさんの画面で、みんなが見ています！","cut":"P02-BELLE-C02"},{"start":1406.5,"end":1411.56,"kr":"벨은 누구보다 갈채를 잃는 것을 두려워했던 소녀였습니다.","jp":"ベルは誰よりも、喝采を失うことを恐れていた少女でした。","cut":"P02-BELLE-C03"},{"start":1411.56,"end":1415.74,"kr":"미움이라도 시선을 붙잡으려 했던 겁니다.","jp":"憎まれても、誰かの視線をつなぎ留めようとしていたのです。","cut":"P02-BELLE-C03"},{"start":1416.16,"end":1420.71,"kr":"오늘부로 이 채널의 풍문 특집은, 전부 종영!","jp":"本日をもって、このチャンネルの噂特集は全部終了！","cut":"P02-BELLE-C03"},{"start":1420.71,"end":1425.23,"kr":"후속 프로그램은— 지금 보고 계신, 그거.","jp":"後番組は──今、ご覧になっている、それ。","cut":"P02-BELLE-C03"},{"start":1425.65,"end":1430.01,"kr":"마지막으로 진실을 내보낸 벨은 카메라를 내려놓습니다.","jp":"最後に真実を届けたベルは、カメラを下ろします。","cut":"P02-BELLE-C03"},{"start":1430.01,"end":1433.93,"kr":"마녀의 몸은 빛의 노이즈가 되어 흩어집니다.","jp":"魔女の体は光のノイズとなって、散っていきました。","cut":"P02-BELLE-C03"},{"start":1435.0833333333333,"end":1439.9884761904761,"kr":"그동안 주군은 와카와 타마에게 계약서 전문을 요구합니다.","jp":"そのあいだ、主君はワカとタマに契約書の全文を要求します。","cut":"P02-S06-C01"},{"start":1439.9884761904761,"end":1445.7111428571427,"kr":"입회인에게는 자신이 서명한 문서를 끝까지 읽을 권리가 있었습니다.","jp":"立会人には、自分が署名した書類を最後まで読む権利がありました。","cut":"P02-S06-C01"},{"start":1445.7111428571427,"end":1451.090382513661,"kr":"읽지 못한 채 서명했다고 해서, 그 권리까지 사라진 건 아니었죠.","jp":"読めないまま署名したからといって、その権利までなくなったわけではありません。","cut":"P02-S06-C01"},{"start":1451.090382513661,"end":1456.5433333333333,"kr":"주군이 끝까지 물러서지 않자 인형들은 마침내 두루마리를 펼칩니다.","jp":"主君が最後まで引き下がらないので、人形たちはついに巻物を広げます。","cut":"P02-S06-C01"},{"start":1456.8433333333332,"end":1462.5369503546099,"kr":"두루마리에는 소원과 힘, 개화와 대가는 모두 적혀 있습니다.","jp":"巻物には、願いと力、開花と代価がすべて記されていました。","cut":"P02-S06-C01"},{"start":1462.5369503546099,"end":1467.9933333333333,"kr":"그런데 해약 조항이 있어야 할 마지막 줄만 찢겨 있습니다.","jp":"けれど、解約条項があるはずの最後の一行だけが、破り取られています。","cut":"P02-S06-C01"},{"start":1468.2933333333333,"end":1474.6635028248586,"kr":"인형들도 자신들이 태어날 때부터 없던 줄이라 모른다고 하죠.","jp":"人形たちも、自分たちが生まれたときからなかった一行なので、知らないと言います。","cut":"P02-S06-C01"},{"start":1474.6635028248586,"end":1478.7333333333331,"kr":"주군은 다른 기록에 남아 있을지 찾기 시작합니다.","jp":"主君は、ほかの記録に残っていないか、探しはじめます。","cut":"P02-S06-C01"},{"start":1479.5,"end":1484.0909574468085,"kr":"문서를 뒤지던 주군 앞에 황혼빛 아이가 나타납니다.","jp":"書類を調べている主君の前に、黄昏色の子どもが現れます。","cut":"P02-S07-C01"},{"start":1484.0909574468085,"end":1489.1191489361702,"kr":"마법소녀도 마녀도 아닌, 이름과 정체를 알 수 없는 아이죠.","jp":"魔法少女でも魔女でもない、名前も正体もわからない子です。","cut":"P02-S07-C01"},{"start":1489.1191489361702,"end":1494.584574468085,"kr":"계약서를 태우면 전부 끝난다고 권하지만, 주군은 거절합니다.","jp":"契約書を燃やせばすべて終わると勧めますが、主君は断ります。","cut":"P02-S07-C01"},{"start":1494.584574468085,"end":1500.05,"kr":"아이들의 운명이 어떻게 될지 모른 채 끝내 버릴 수는 없습니다.","jp":"子どもたちの運命がどうなるかわからないまま、終わらせるわけにはいきません。","cut":"P02-S07-C01"},{"start":1500.35,"end":1506.67,"kr":"아이들이 나갈 문을 찾겠다는 주군을 보고, 황혼빛 아이가 단서를 줍니다.","jp":"子どもたちが出ていく扉を探すという主君に、黄昏色の子どもは手がかりを与えます。","cut":"P02-S07-C01"},{"start":1507.12,"end":1511.209655172414,"kr":"적힌 걸 찢어도, 말해진 건 남아.","jp":"書かれたものを破いても、語られたことは残る。","cut":"P02-S07-C01"},{"start":1511.209655172414,"end":1515.708275862069,"kr":"그 줄을 '들은' 존재가, 이 도시 어딘가에 아직 있어.","jp":"その一行を『聞いた』者が、この街のどこかにまだいる。","cut":"P02-S07-C01"},{"start":1515.708275862069,"end":1518.98,"kr":"…제일 오래된 물건 곁을 뒤져 봐.","jp":"…いちばん古い品のそばを探してみて。","cut":"P02-S07-C01"},{"start":1519.75,"end":1523.5244680851065,"kr":"오래 남아 있으면서 목소리를 간직할 수 있는 물건.","jp":"長く残り、声をしまっておけるもの。","cut":"P02-S07-C03"},{"start":1523.5244680851065,"end":1528.62,"kr":"그런 골동품을 찾아, 인형들을 받았던 하케 씨의 가게로 돌아갑니다.","jp":"そんな骨董品を探して、人形をもらったハケさんの店へ戻ります。","cut":"P02-S07-C03"},{"start":1528.92,"end":1536.0173134328359,"kr":"하케 씨가 기다렸다는 듯 꺼내 온 것은 축음기 실린더, 목소리를 녹음한 통입니다.","jp":"ハケさんが待っていたかのように取り出したのは、蓄音機のシリンダー。","cut":"P02-S07-C03"},{"start":1536.0173134328359,"end":1543.78,"kr":"이리스도 만개 전에 찾았지만, 힘을 받은 소녀의 손으로는 열 수 없었다고 했던 물건이죠.","jp":"声を録音した筒です。イリスも満開になる前に探し当てたものの、力を受け取った少女の手では開けなかったという品でした。","cut":"P02-S07-C03"},{"start":1544.5416666666667,"end":1550.4116666666669,"kr":"주군은 고장 난 실린더를 목공소로 가져가고, 쿠로코가 태엽을 고칩니다.","jp":"主君は壊れたシリンダーを木工所へ持ち込み、クロコがゼンマイを修理します。","cut":"P02-S08-C01"},{"start":1550.7116666666666,"end":1555.6516666666666,"kr":"실린더를 본 와카와 타마는 계약서 원본을 주군에게 넘깁니다.","jp":"シリンダーを見たワカとタマは、契約書の原本を主君に渡します。","cut":"P02-S08-C01"},{"start":1556.4166666666667,"end":1563.8366666666666,"kr":"한 소녀의 계약서가 아니라, 이 도시의 개별 계약들을 묶는 공통 원본이었습니다.","jp":"それは、一人の少女の契約書ではなく、この街の個々の契約を束ねる共通の原本でした。","cut":"P02-S08-C02"},{"start":1564.1366666666668,"end":1571.8966666666668,"kr":"인형들은 관리자 권한으로, 그 원본에 연결된 계약들의 해약을 집행할 권리를 주군에게 맡깁니다.","jp":"人形たちは管理者の権限で、その原本につながる契約の解約を執行する権利を、主君に託します。","cut":"P02-S08-C02"},{"start":1572.6666666666667,"end":1581.3266666666668,"kr":"태엽은 고쳤지만 낡은 실린더는 서명한 입회인의 손에서만 소리가 나며, 한 번만 재생할 수 있습니다.","jp":"ゼンマイは直りましたが、古いシリンダーは、署名した立会人の手でしか音を出せず、再生できるのも一度きりです。","cut":"P02-S08-C03"},{"start":1581.6266666666666,"end":1584.2972121212122,"kr":"주군은 원본과 통을 챙깁니다.","jp":"主君は、原本と筒を携えます。","cut":"P02-S08-C03"},{"start":1584.2972121212122,"end":1593.8666666666668,"kr":"출구가 없다고 믿는 이리스 앞에서 해약의 조건을 함께 듣고, 세계를 끝내는 대신 다른 길을 찾으려는 겁니다.","jp":"出口はないと信じるイリスの前で、解約の条件を一緒に聞き、世界を終わらせる代わりに、別の道を見つけようというのです。","cut":"P02-S08-C03"},{"start":1594.625,"end":1597.5326923076923,"kr":"목공소에 다시 불이 켜집니다.","jp":"木工所に、再び明かりがともります。","cut":"P02-GATHER-C01"},{"start":1597.5326923076923,"end":1604.705,"kr":"흩어졌던 아이들이 마지막 작전을 위해 하나둘 돌아옵니다.","jp":"散り散りになっていた少女たちが、最後の作戦のために一人、また一人と戻ってきます。","cut":"P02-GATHER-C01"},{"start":1605.005,"end":1611.105,"kr":"네네링은 아직 상처가 낫지 않은 몸으로 병원 창문을 통해 탈출해 왔습니다.","jp":"ネネりんは、まだ傷の癒えない体で病院の窓から抜け出してきました。","cut":"P02-GATHER-C01"},{"start":1611.105,"end":1614.155,"kr":"쥬리땅도 목발을 짚고 나타났습니다.","jp":"ジュリたんも、松葉杖をついて現れました。","cut":"P02-GATHER-C01"},{"start":1614.155,"end":1619.0349999999999,"kr":"아직 아픈 몸이었지만, 오늘 밤만큼은 함께하기로 한 겁니다.","jp":"まだ痛みの残る体でも、今夜だけは共にいると決めたのです。","cut":"P02-GATHER-C01"},{"start":1619.7916666666667,"end":1624.0407894736843,"kr":"모두가 모인 자리에서, 마지막 작전을 확인합니다.","jp":"全員がそろったところで、最後の作戦を確認します。","cut":"P02-S09-C02"},{"start":1624.0407894736843,"end":1631.9016666666666,"kr":"이번 싸움의 목적은 주군과 실린더를 중심부까지 보내, 계약을 끝낼 기회를 만드는 일입니다.","jp":"今度の戦いの目的は、主君とシリンダーを中心部まで送り届け、契約を終わらせる機会を作ることです。","cut":"P02-S09-C02"},{"start":1632.6666666666667,"end":1638.1166666666668,"kr":"도시를 가둘 결계를 설계한 것은 [조화(造花)의 마녀], 뮤게·시엘입니다.","jp":"街を閉じ込める結界を設計したのは、[造花の魔女]、ミュゲ・シエルです。","cut":"P02-MUGUET-HOME-C01"},{"start":1638.3966666666668,"end":1642.3766666666668,"kr":"주군에게는 고향의 치사와 같은 얼굴입니다.","jp":"主君には、故郷のチサと同じ顔に見えます。","cut":"P02-MUGUET-HOME-C01"},{"start":1642.3766666666668,"end":1648.1566666666668,"kr":"이곳의 그녀는 완벽한 작품을 만들어야만 인정받는다고 믿고 있었죠.","jp":"この街の彼女は、完璧な作品を作らなければ認めてもらえないと信じていました。","cut":"P02-MUGUET-HOME-C01"},{"start":1648.9583333333333,"end":1655.3083333333332,"kr":"이리스가 도시를 닫으려는 밤, 결계의 설계자가 마지막 공정을 보고하러 옵니다.","jp":"イリスが街を閉じようとする夜、結界の設計者が最後の工程を報告しに来ます。","cut":"P02-S09-C01-muguet-intro"},{"start":1655.7283333333332,"end":1659.1783333333333,"kr":"도시 전체를 감쌀 최고 걸작의 결계!","jp":"街全体を包む、最高傑作の結界！","cut":"P02-S09-C01-muguet-intro"},{"start":1659.1783333333333,"end":1661.7383333333332,"kr":"마지막 공정만 남은 것이와요.","jp":"残るは最後の工程だけですわ。","cut":"P02-S09-C01-muguet-intro"},{"start":1661.7383333333332,"end":1666.0783333333331,"kr":"시들지 않는 조화처럼, 영원히 완벽한 무대가 되는 것이랍니다!","jp":"枯れない造花のように、永遠に完璧な舞台となるのです！","cut":"P02-S09-C01-muguet-intro"},{"start":1666.4983333333332,"end":1670.2983333333332,"kr":"조화는 살아 있는 꽃을 본떠 만든 꽃입니다.","jp":"造花は、生きた花を模して作った花。","cut":"P02-S09-C01-muguet-intro"},{"start":1670.2983333333332,"end":1675.7183333333332,"kr":"시들지 않지만, 스스로 피거나 더 자라지도 않습니다.","jp":"枯れることはなくても、自ら咲いたり、さらに育ったりはしません。","cut":"P02-S09-C01-muguet-intro"},{"start":1675.7183333333332,"end":1679.4483333333333,"kr":"뮤게는 그런 완성품에 자신을 겹쳐 보고 있었습니다.","jp":"ミュゲは、そんな完成品に自分を重ねていました。","cut":"P02-S09-C01-muguet-intro"},{"start":1679.8683333333333,"end":1682.1183333333333,"kr":"……수고했어요, 뮤게.","jp":"……ご苦労さま、ミュゲ。","cut":"P02-S09-C01-muguet-intro"},{"start":1682.1183333333333,"end":1685.0583333333332,"kr":"정말, 훌륭한 결계예요.","jp":"本当に、見事な結界です。","cut":"P02-S09-C01-muguet-intro"},{"start":1685.0583333333332,"end":1689.9783333333332,"kr":"이제 아이들이 가장 아름다운 순간에 멈출 수 있도록, 완성해 주세요.","jp":"子どもたちがいちばん美しい瞬間で止まれるように、完成させてください。","cut":"P02-S09-C01-muguet-intro"},{"start":1690.3983333333333,"end":1691.7533333333333,"kr":"……! 다, 당연하죠.","jp":"……！と、当然ですわ。","cut":"P02-S09-C01-muguet-intro"},{"start":1691.7533333333333,"end":1694.6983333333333,"kr":"이 몸의…… 최고 걸작이니까요.","jp":"この身の……最高傑作ですもの。","cut":"P02-S09-C01-muguet-intro"},{"start":1694.6983333333333,"end":1697.2383333333332,"kr":"최종 공정, 개시인 것이와요!","jp":"最終工程、開始ですわ！","cut":"P02-S09-C01-muguet-intro"},{"start":1698.0416666666667,"end":1702.3416666666667,"kr":"마침내 이리스의 거대한 결계가 완성됩니다.","jp":"ついに、イリスの巨大な結界が完成します。","cut":"P02-S09-C01"},{"start":1702.3416666666667,"end":1708.0750000000003,"kr":"하늘이 꽃잎처럼 닫히고, 사람과 거리가 강제로 만개합니다.","jp":"空が花びらのように閉じ、人も街も、無理やり満開へと追い込まれていきます。","cut":"P02-S09-C01"},{"start":1708.0750000000003,"end":1715.2416666666668,"kr":"날이 밝기 전, 이리스는 가장 아름다운 순간의 도시를 통째로 꺾으려 합니다.","jp":"夜が明ける前に、イリスは、いちばん美しい瞬間の街を丸ごと切り落とそうとしていました。","cut":"P02-S09-C01"},{"start":1716.0,"end":1718.7689777777778,"kr":"도시를 닫는 결계가 내려앉습니다.","jp":"街を閉ざす結界が降りてきます。","cut":"P02-LAUNCH-C01"},{"start":1718.7689777777778,"end":1720.9446031746033,"kr":"이제, 물러설 곳은 없습니다.","jp":"もう、引き返す場所はありません。","cut":"P02-LAUNCH-C01"},{"start":1721.7083333333333,"end":1723.4683333333332,"kr":"전원— 진격 개시.","jp":"全員──進撃開始。","cut":"P02-LAUNCH-C02"},{"start":1723.4683333333332,"end":1726.4533333333334,"kr":"대피는 계속, 길은 앞으로만.","jp":"避難は続行、道は前だけです。","cut":"P02-LAUNCH-C02"},{"start":1726.4533333333334,"end":1727.628333333333,"kr":"갑니다!","jp":"行きます！","cut":"P02-LAUNCH-C02"},{"start":1728.0483333333332,"end":1729.7683333333332,"kr":"[섬화], 준비 완료!","jp":"[閃華]、準備完了！","cut":"P02-LAUNCH-C02"},{"start":1729.7683333333332,"end":1731.0683333333332,"kr":"제일 앞!","jp":"いちばん前！","cut":"P02-LAUNCH-C02"},{"start":1731.4883333333332,"end":1734.2183333333332,"kr":"[선풍]…… 기상 완료.","jp":"[旋風]……起床完了。","cut":"P02-LAUNCH-C02"},{"start":1734.2183333333332,"end":1735.6983333333333,"kr":"마지못해.","jp":"しぶしぶ。","cut":"P02-LAUNCH-C02"},{"start":1736.1183333333333,"end":1739.4083333333333,"kr":"[윤회]— 등불, 점화했습니다.","jp":"[輪廻]──灯、点しました。","cut":"P02-LAUNCH-C02"},{"start":1739.8283333333334,"end":1742.5383333333334,"kr":"[여명]…… 가, 갑니다!","jp":"[黎明]……い、行きます！","cut":"P02-LAUNCH-C02"},{"start":1743.291666666667,"end":1749.351666666667,"kr":"동료들이 길을 열고 쿠로코가 방벽으로 지키는 동안 주군이 전진합니다.","jp":"仲間たちが道を開き、クロコが防壁で守るあいだに、主君は前へ進みます。","cut":"P02-S09-C03"},{"start":1750.125,"end":1753.845,"kr":"코어의 문 앞을 뮤게가 막아섭니다.","jp":"コアの扉の前に、ミュゲが立ちはだかります。","cut":"P02-S10-C01-muguet-gate-01"},{"start":1753.845,"end":1759.975,"kr":"도시를 가둔 결계는, 자신이 인정받기 위해 쌓아 올린 최고 걸작이었습니다.","jp":"街を閉じ込めた結界は、認めてもらうために積み上げた、彼女の最高傑作でした。","cut":"P02-S10-C01-muguet-gate-01"},{"start":1760.395,"end":1762.735,"kr":"여기서부터는 지나갈 수 없어요.","jp":"ここから先は通せません。","cut":"P02-S10-C01-muguet-gate-01"},{"start":1762.735,"end":1766.015,"kr":"완벽하게, 아름답게 끝나는 것이와요!","jp":"完璧に、美しく終わるのですわ！","cut":"P02-S10-C01-muguet-gate-01"},{"start":1766.015,"end":1769.565,"kr":"미완성은 감점, 미완의 꽃은 낙제랍니다!","jp":"未完成は減点、未完の花は落第なのです！","cut":"P02-S10-C01-muguet-gate-01"},{"start":1769.985,"end":1773.045,"kr":"……채, 채점은 누가 하는데요?","jp":"……さ、採点は、誰がするんですか？","cut":"P02-S10-C01-muguet-gate-01"},{"start":1773.465,"end":1779.135,"kr":"그, 그야, 이리스 님이…… 세계가…… 보는 눈이 있는 모두가, 인 것이와요!","jp":"そ、それは、イリス様が……世界が……見る目のある皆さんが、ですわ！","cut":"P02-S10-C01-muguet-gate-01"},{"start":1779.555,"end":1782.615,"kr":"대답하는 뮤게의 손끝이 떨립니다.","jp":"答えるミュゲの指先が震えます。","cut":"P02-S10-C01-muguet-gate-01"},{"start":1782.615,"end":1788.405,"kr":"남의 평가가 사라지면 자신의 가치도 사라질까 두려운 겁니다.","jp":"他人の評価がなくなれば、自分の価値まで消えてしまう。それが怖いのです。","cut":"P02-S10-C01-muguet-gate-01"},{"start":1788.825,"end":1793.135,"kr":"이 몸은 [조화의 마녀], 시들지 않는 완성품인 것이와요!","jp":"この身は[造花の魔女]、枯れない完成品なのですわ！","cut":"P02-S10-C01-muguet-gate-01"},{"start":1793.555,"end":1797.545,"kr":"……와, 완성품은요.","jp":"……か、完成品は、もう、育ちません。","cut":"P02-S10-C01-muguet-gate-01"},{"start":1797.545,"end":1801.415,"kr":"더는, 안 자라요. 시들지 않는 대신, 피지도, 않아요.","jp":"枯れない代わりに、咲くことも、ないんです。","cut":"P02-S10-C01-muguet-gate-01"},{"start":1802.25,"end":1807.07,"kr":"뮤게가 두려워한 것은 미완성인 작품만이 아니었습니다.","jp":"ミュゲが恐れていたのは、未完成の作品だけではありません。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1807.07,"end":1812.25,"kr":"완벽하지 않은 자신에게는 아무도 박수를 보내지 않을까 두려웠던 겁니다.","jp":"完璧でない自分には、誰も拍手してくれない。それが怖かったのです。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1812.67,"end":1814.87,"kr":"저, 결계 안쪽 봤어요.","jp":"け、結界の中を見ました。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1814.87,"end":1818.17,"kr":"구석까지 꼼꼼하게…… 잘 만들었어요.","jp":"隅々まで丁寧で……よくできていました。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1818.17,"end":1819.39,"kr":"정말로요.","jp":"本当に。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1819.39,"end":1823.75,"kr":"그, 그러니까 세계를 끝내는 데 쓰게 두고 싶지 않은 거예요.","jp":"だ、だから、世界を終わらせるために使わせたくないんです。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1824.17,"end":1825.9,"kr":"……듣고 싶으신가요?","jp":"……聞きたいのですか？","cut":"P02-S10-C01-muguet-gate-02"},{"start":1825.9,"end":1832.88,"kr":"촌스럽고, 시시하고…… 아무도 박수치지 않았던, 옛날 얘기 따위를.","jp":"垢抜けなくて、つまらなくて……誰も拍手しなかった、昔の話など。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1833.3,"end":1834.95,"kr":"드, 듣고 싶어요.","jp":"き、聞きたいです。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1834.95,"end":1838.25,"kr":"돌아와서, 그 결계 얘기도 더 듣고 싶어요.","jp":"戻ってきたら、その結界の話も、もっと。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1838.25,"end":1843.65,"kr":"어디가 제일 어려웠는지, 어디가 제일 자신 있는지…… 저, 전부요.","jp":"どこがいちばん難しくて、どこがいちばん自信があるのか……私、全部。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1844.07,"end":1848.97,"kr":"당장 완벽한 작품을 보여 달라는 말이 아니었습니다.","jp":"今すぐ完璧な作品を見せてほしい、という言葉ではありません。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1848.97,"end":1854.11,"kr":"치코링은 작품을 만든 사람의 이야기를 듣고 싶었습니다.","jp":"チコりんは、作品を作った人の話を聞きたかったのです。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1854.11,"end":1856.91,"kr":"뮤게는 끝내 길을 비킵니다.","jp":"ミュゲは、ついに道を譲ります。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1856.91,"end":1861.3,"kr":"치코링은 열려 있는 문을 지나 코어 안으로 들어갑니다.","jp":"チコりんは開いた扉を通り、コアの中へ入っていきます。","cut":"P02-S10-C01-muguet-gate-02"},{"start":1862.125,"end":1867.916076923077,"kr":"도움을 받아 중심부에 들어선 치코링은 이번에도 무기를 들지 않습니다.","jp":"仲間の助けで中心部へ入ったチコりんは、今回も武器を持ちません。","cut":"P02-S10-C01"},{"start":1867.916076923077,"end":1870.9114615384615,"kr":"힘으로 이기면 자신도 마녀가 됩니다.","jp":"力で勝てば、自分も魔女になる。","cut":"P02-S10-C01"},{"start":1870.9114615384615,"end":1875.105,"kr":"이리스에게 삶을 끝낼 권리를 주지 않으려는 겁니다.","jp":"自分たちの人生を終わらせる権利を、イリスに渡さないためでした。","cut":"P02-S10-C01"},{"start":1875.405,"end":1881.9650000000001,"kr":"치코링은 이리스를 향해, 사람들은 살고 싶어서 서로 도우며 도망쳤다고 말합니다.","jp":"チコりんはイリスに向かって、人々は生きたいからこそ、助け合って逃げたのだと伝えます。","cut":"P02-S10-C01"},{"start":1882.2649999999999,"end":1889.6539285714284,"kr":"이리스는 동료들이 노래도 친구도, 끝내 자기 자신까지 잊어 가던 밤을 이야기합니다.","jp":"イリスは、仲間たちが歌も友だちも、最後には自分自身さえ忘れていった夜のことを語ります。","cut":"P02-S10-C01"},{"start":1889.6539285714284,"end":1894.435,"kr":"치코링에게만은 그런 끝을 겪게 하고 싶지 않았습니다.","jp":"チコりんにだけは、あんな終わりを迎えてほしくありませんでした。","cut":"P02-S10-C01"},{"start":1895.2083333333333,"end":1899.1783333333333,"kr":"에글랑틴과 손을 잡은 끝도 소멸이었습니다.","jp":"エグランティーヌと手をつないだ先にあったのも、消滅でした。","cut":"P02-S10-C02-02"},{"start":1899.9583333333333,"end":1907.0383333333334,"kr":"이리스는 다른 출구가 없으니, 치코링에게 지금 가장 아름다운 채로 끝나기를 권합니다.","jp":"イリスは、ほかに出口はないのだから、今、いちばん美しいまま終わるよう、チコりんに勧めます。","cut":"P02-S10-C02-03"},{"start":1907.7916666666667,"end":1913.1258163265306,"kr":"하지만 치코링에겐, 끝으로 정해진 오늘 뒤에도 이어질 내일이 있었습니다.","jp":"それでもチコりんには、最後と決められた今日の先に、まだ明日がありました。","cut":"P02-S11-C01"},{"start":1913.4058163265308,"end":1917.0258163265307,"kr":"치코링에게는 매일 쓴 일기가 있었습니다.","jp":"チコりんには、毎日書いてきた日記がありました。","cut":"P02-S11-C01"},{"start":1917.0258163265307,"end":1924.0058163265307,"kr":"어제는 무서웠다고만 적었지만, 오늘은 여전히 무서워도 발이 조금 빨리 나갔다고 썼죠.","jp":"昨日は、怖かったとだけ書きました。","cut":"P02-S11-C01"},{"start":1924.0058163265307,"end":1930.6358163265309,"kr":"어제 겪은 일을 딛고, 오늘은 달라진 겁니다.","jp":"でも今日は、相変わらず怖くても、少し早く足を踏み出せたと書いたのです。昨日の経験を足場にして、今日は変われたのです。","cut":"P02-S11-C01"},{"start":1931.375,"end":1936.225,"kr":"에글랑틴이 남긴 손잡는 법도 치코링 안에 남았습니다.","jp":"エグランティーヌが残した、手のつなぎ方も、チコりんの中に残っています。","cut":"P02-S11-C02"},{"start":1937.0,"end":1941.62,"kr":"정점이 지났다고 삶까지 끝난 건 아니었습니다.","jp":"頂点を過ぎたからといって、人生まで終わったわけではありませんでした。","cut":"P02-S11-C02-03"},{"start":1942.0700000000002,"end":1946.9,"kr":"그러니까, 무서워도— 나는, 내일의 나를 보고 싶어요!","jp":"だから、こわくても——私は、明日の私に会ってみたいんです！","cut":"P02-S11-C02-03"},{"start":1947.6666666666667,"end":1950.6402189828314,"kr":"치코링의 말에 이리스의 손이 멈춥니다.","jp":"チコりんの言葉にイリスの手が止まります。","cut":"P02-S11-C02-03-petals-stop"},{"start":1950.6402189828314,"end":1953.1442630385488,"kr":"닫히던 꽃잎이 멎습니다.","jp":"閉じかけていた花びらも止まります。","cut":"P02-S11-C02-03-petals-stop"},{"start":1953.875,"end":1959.9840163934427,"kr":"이리스는 문득, 마지막까지 다음 봄을 이야기했던 동료들을 떠올립니다.","jp":"イリスはふと、最後まで次の春の話をしていた仲間たちを思い出します。","cut":"P02-S11-C03-02"},{"start":1959.9840163934427,"end":1966.725,"kr":"강한 척하는 말이라고 여겼지만, 그들도 정말 내일을 보고 싶었던 건지 모릅니다.","jp":"強がりだと思っていました。けれど彼女たちも、本当に明日を見たかったのかもしれません。","cut":"P02-S11-C03-02"},{"start":1967.5,"end":1972.7380487804878,"kr":"그 틈에 주군이 실린더를 꺼내 태엽을 감습니다.","jp":"その隙に、主君がシリンダーを取り出し、ゼンマイを巻きます。","cut":"P02-S12-C01"},{"start":1972.7380487804878,"end":1975.76,"kr":"오래된 목소리가 해약 조항을 읽습니다.","jp":"古い声が、解約条項を読み上げます。","cut":"P02-S12-C01"},{"start":1976.21,"end":1977.8645454545454,"kr":"『——조항, 마지막.","jp":"『──条項、最後。","cut":"P02-S12-C01"},{"start":1977.8645454545454,"end":1979.85,"kr":"해지에 관하여.』","jp":"解約について。』","cut":"P02-S12-C01"},{"start":1980.625,"end":1981.9664285714284,"kr":"……해, 해지…….","jp":"……か、解約……。","cut":"P02-S12-C01-02"},{"start":1981.9664285714284,"end":1984.249210526316,"kr":"이, 있었어요…….","jp":"あ、あったんですね……。","cut":"P02-S12-C01-02"},{"start":1984.249210526316,"end":1986.885,"kr":"정말로, 있었어…….","jp":"本当に、あったんだ……。","cut":"P02-S12-C01-02"},{"start":1987.2350000000001,"end":1987.9375,"kr":"그래.","jp":"そうだ。","cut":"P02-S12-C01-02"},{"start":1987.9375,"end":1990.045,"kr":"한 글자도, 놓치지 마라.","jp":"一文字も、聞き逃すな。","cut":"P02-S12-C01-02"},{"start":1990.8333333333333,"end":1995.9133333333334,"kr":"실린더는 '입회인'이 계약을 파기할 수 있다고 말합니다.","jp":"シリンダーは、『立会人』が契約を破棄できると語ります。","cut":"P02-S12-C02"},{"start":1995.9133333333334,"end":2002.2933333333333,"kr":"계약이 파기되면 마법소녀들에게서 힘이 빠져나와 씨앗의 상태로 돌아갑니다.","jp":"契約が破棄されれば、魔法少女たちから力が抜け、種の状態へ戻ります。","cut":"P02-S12-C02"},{"start":2002.2933333333333,"end":2007.8933333333332,"kr":"그런데, 그와 함께 소녀들은 기억을 잃는다고 하죠.","jp":"しかし、それと同時に少女たちは記憶を失うというのです。","cut":"P02-S12-C02"},{"start":2007.8933333333332,"end":2013.4533333333334,"kr":"시들어야 하는 운명에서의 탈출이지만, 어쩌면, 영혼을 회수해가는 소멸에 가까울지도 모릅니다.","jp":"枯れなければならない運命からの脱出。","cut":"P02-S12-C02"},{"start":2013.4533333333334,"end":2019.6033333333332,"kr":"게다가 조건이 있었습니다.","jp":"けれどそれは、もしかすると魂を回収される消滅に近いのかもしれません。しかも、条件がありました。","cut":"P02-S12-C02"},{"start":2019.8833333333332,"end":2023.2197697919746,"kr":"입회인이 종이를 찢는 것만으로는 부족했습니다.","jp":"立会人が紙を破るだけでは足りません。","cut":"P02-S12-C02"},{"start":2023.2197697919746,"end":2028.9113378684806,"kr":"소녀들이 스스로 힘을 놓을 때에만 계약의 파기가 성립합니다.","jp":"少女たちが自ら力を手放したときにだけ、契約の破棄は成立します。","cut":"P02-S12-C02"},{"start":2029.666666666667,"end":2033.9266666666667,"kr":"실린더의 목소리가 멎고 공간이 고요해졌습니다.","jp":"シリンダーの声が止まり、その場は静まり返りました。","cut":"P02-S12-C04"},{"start":2033.9266666666667,"end":2040.0866666666668,"kr":"와카도 타마도 백 년 만에 돌아온 말 앞에서는 숙연해졌습니다.","jp":"ワカもタマも、百年ぶりに戻ってきた言葉の前で、厳粛な表情になります。","cut":"P02-S12-C04"},{"start":2040.8333333333333,"end":2048.7233333333334,"kr":"한편, 이리스는 본인이 만개하던 마지막 밤까지 붙잡고 있었던 실린더에서 눈을 떼지 못합니다.","jp":"一方、イリスは、自分が満開になったあの最後の夜まで握りしめていたシリンダーから、目を離せません。","cut":"P02-S12-C05-03"},{"start":2049.003333333333,"end":2064.8533333333335,"kr":"밤새 태엽을 감으며 그토록 알려 달라 빌었던 출구를 마침내 듣게 되자, 그 한 소절만 들었더라면 자르지 않아도 됐을 소녀들의 얼굴이 떠올라 칼날처럼 얇게 웃고 말았죠.","jp":"夜通しゼンマイを巻き、どうか教えてほしいと願い続けた出口を、ついに知ったとき、あの一節さえ聞けていれば、切らずに済んだ少女たちの顔が浮かび、イリスは、刃のように薄く笑ってしまいました。","cut":"P02-S12-C05-03"},{"start":2065.5833333333335,"end":2071.9383333333335,"kr":"그때 결계 바깥에서 하늘이 접히고, [비탄의 마녀] 라르므가 내려옵니다.","jp":"そのとき、結界の外で空が折り畳まれ、[悲嘆の魔女]ラルムが降りてきます。","cut":"P02-S13-C01"},{"start":2071.9383333333335,"end":2080.3433333333332,"kr":"실린더 속 목소리의 주인이자 최초의 입회인, 소원에 힘과 대가를 주는 규칙을 쓴 사람이었습니다.","jp":"シリンダーの声の主であり、最初の立会人。願いに力と代価を与えるルールを書いた人物でした。","cut":"P02-S13-C01"},{"start":2081.125,"end":2085.165,"kr":"라르므는 마지막 줄을 찢은 이유를 털어놓았습니다.","jp":"ラルムは、最後の一行を破った理由を打ち明けます。","cut":"P02-S13-C02"},{"start":2085.615,"end":2086.1478813559324,"kr":"네.","jp":"ええ。","cut":"P02-S13-C02"},{"start":2086.1478813559324,"end":2088.2907446808513,"kr":"해지는 잔인해요.","jp":"解約は残酷です。","cut":"P02-S13-C02"},{"start":2088.2907446808513,"end":2093.6082203389833,"kr":"아이들은 힘을 잃고, 나를 잊고, 떠나요.","jp":"子どもたちは力を失って、私を忘れて、去っていく。","cut":"P02-S13-C02"},{"start":2093.6082203389833,"end":2095.739745762712,"kr":"…그래서 찢었어요.","jp":"…だから破りました。","cut":"P02-S13-C02"},{"start":2095.739745762712,"end":2101.335,"kr":"떠날 문이 없으면— 아무도, 떠나지 않으니까.","jp":"去るための扉がなければ──誰も、去りはしないから。","cut":"P02-S13-C02"},{"start":2101.685,"end":2103.315681818182,"kr":"……그 탓에, 백 년이다.","jp":"……そのせいで、百年だ。","cut":"P02-S13-C02"},{"start":2103.315681818182,"end":2110.7702272727274,"kr":"출구 없는 정원에서— 얼마나 많은 아이가 시들고, 얼마나 많은 마녀가 태어났는지.","jp":"出口のない庭で——どれほどの子が枯れ、どれほどの魔女が生まれたか。","cut":"P02-S13-C02"},{"start":2110.7702272727274,"end":2111.935,"kr":"알고는 있나.","jp":"わかっているのか。","cut":"P02-S13-C02"},{"start":2112.7083333333335,"end":2114.2084289391432,"kr":"알아요.","jp":"知っています。","cut":"P02-S13-C03"},{"start":2114.2084289391432,"end":2116.458572347858,"kr":"전부, 세고 있었어요.","jp":"全部、数えていました。","cut":"P02-S13-C03"},{"start":2116.458572347858,"end":2117.958667953668,"kr":"…한 송이도, 빠짐없이.","jp":"…一輪も、残さず。","cut":"P02-S13-C03"},{"start":2117.958667953668,"end":2120.458827296685,"kr":"그래서 거두는 거예요.","jp":"だから摘み取るのです。","cut":"P02-S13-C03"},{"start":2120.458827296685,"end":2123.846986394558,"kr":"시들어 간 아이를... 씨앗은 위험해요.","jp":"枯れていった子を…。","cut":"P02-S13-C03"},{"start":2123.846986394558,"end":2126.4990466472304,"kr":"다시 피면, 다시 시들어요.","jp":"種は危険です。","cut":"P02-S13-C03"},{"start":2126.4990466472304,"end":2131.2727551020407,"kr":"그러니 여기서— 내 곁에서, 영원히 잠들게 해요.","jp":"また咲けば、また枯れる。だからここで——私のそばで、永遠に眠らせるの。","cut":"P02-S13-C03"},{"start":2131.692755102041,"end":2137.452755102041,"kr":"라르므는 검은 구슬에 시든 아이들의 씨앗까지 가두고 있었습니다.","jp":"ラルムは、枯れた子どもたちの種まで、黒い珠に閉じ込めていました。","cut":"P02-S13-C03"},{"start":2137.452755102041,"end":2142.992755102041,"kr":"다시 피면 다시 아플까 봐 영원히 재운 겁니다.","jp":"また咲けばまた傷つくのではないかと、永遠に眠らせていたのです。","cut":"P02-S13-C03"},{"start":2143.412755102041,"end":2146.5802057013284,"kr":"……잠들어 있으면, 아프지 않아요.","jp":"……眠っていれば、痛くない。","cut":"P02-S13-C03"},{"start":2146.5802057013284,"end":2148.4278852175794,"kr":"무섭지도 않아요.","jp":"こわくもない。","cut":"P02-S13-C03"},{"start":2148.4278852175794,"end":2151.5953358168667,"kr":"시들지도, 잊혀지지도 않아요.","jp":"枯れも、忘れられもしない。","cut":"P02-S13-C03"},{"start":2151.5953358168667,"end":2153.970923766332,"kr":"…그보다 좋은 게, 있나요?","jp":"…それより良いことが、ありますか？","cut":"P02-S13-C03"},{"start":2153.970923766332,"end":2156.6104659324046,"kr":"그러니까, 같이 잠들어요.","jp":"だから、一緒に眠りましょう。","cut":"P02-S13-C03"},{"start":2156.6104659324046,"end":2157.402328582227,"kr":"다 같이.","jp":"みんなで。","cut":"P02-S13-C03"},{"start":2157.402328582227,"end":2160.0418707482995,"kr":"아무도, 잃지 않는 곳에서.","jp":"誰も、失わない場所で。","cut":"P02-S13-C03"},{"start":2160.7916666666665,"end":2164.717156862745,"kr":"라르므가 공간을 접어 일행을 짓누릅니다.","jp":"ラルムが空間を折り畳み、一行を押し潰します。","cut":"P02-S14-C01"},{"start":2164.717156862745,"end":2172.175588235294,"kr":"히땅의 폭풍 전력도, 네네링의 가장 밝은 섬광도 공간과 함께 접혀버릴 뿐이었습니다.","jp":"ひーたんの全力の嵐も、ネネりんの最も明るい閃光も、空間ごと折り畳まれるだけでした。","cut":"P02-S14-C01"},{"start":2172.175588235294,"end":2180.8116666666665,"kr":"레오나가 전력을 다 해 불꽃으로 내려앉는 하늘을 막아서자, 이리스가 소녀들의 곁에서 꽃잎으로 버팁니다.","jp":"レオナが全力の炎で落ちてくる空を受け止めると、イリスも少女たちのそばで花びらを広げ、支えます。","cut":"P02-S14-C01"},{"start":2181.2616666666663,"end":2184.6516666666666,"kr":"………내 정원의 아이들에게, 손대지 마세요.","jp":"………私の庭の子たちに、手を出さないで。","cut":"P02-S14-C01"},{"start":2185.0016666666666,"end":2186.7616666666663,"kr":"……! 당신—","jp":"……！あなた——","cut":"P02-S14-C01"},{"start":2187.1116666666667,"end":2188.705897435897,"kr":"……절화의 아이.","jp":"……切花の子。","cut":"P02-S14-C01"},{"start":2188.705897435897,"end":2189.9812820512816,"kr":"당신이, 왜.","jp":"あなたが、なぜ。","cut":"P02-S14-C01"},{"start":2189.9812820512816,"end":2193.2699523809524,"kr":"…당신이 제일 잘 알잖아요.","jp":"…あなたが一番わかっているでしょう。","cut":"P02-S14-C01"},{"start":2193.2699523809524,"end":2195.4016666666666,"kr":"시드는 게, 얼마나…….","jp":"枯れるのが、どれほど……。","cut":"P02-S14-C01"},{"start":2195.7516666666666,"end":2197.522647058823,"kr":"네, 알아요.","jp":"ええ、知っています。","cut":"P02-S14-C01"},{"start":2197.522647058823,"end":2200.621862745098,"kr":"알다 못해— 잘라 왔어요.","jp":"知るだけでなく——切ってきました。","cut":"P02-S14-C01"},{"start":2200.621862745098,"end":2202.171470588235,"kr":"그래서 알아요.","jp":"だからわかるの。","cut":"P02-S14-C01"},{"start":2202.171470588235,"end":2207.0416666666665,"kr":"당신의 그 손이— 옛날의 나와, 같은 손이라는 걸.","jp":"あなたのその手が——昔の私と、同じ手だということを。","cut":"P02-S14-C01"},{"start":2207.491666666667,"end":2214.9180952380952,"kr":"두려워서 아이들의 시간을 멈추는 손이 소녀들의 내일을 빼앗고 있다는 것을 깨달은 겁니다.","jp":"こわくて子どもたちの時間を止める手が、少女たちの明日を奪っている。","cut":"P02-S14-C01"},{"start":2214.9180952380952,"end":2221.5416666666665,"kr":"이제 아이들의 끝을 대신 정하는 계획을 거두고, 소녀들이 결정한 내일을 지킵니다.","jp":"そのことに気づいたのです。もう子どもたちの終わりを代わりに決める計画を捨て、少女たちが決めた明日を守ります。","cut":"P02-S14-C01"},{"start":2221.991666666667,"end":2222.5095614035085,"kr":"……하.","jp":"……はっ。","cut":"P02-S14-C01"},{"start":2222.5095614035085,"end":2226.9116666666664,"kr":"마녀랑 등을 맞대는 날이 올 줄이야.","jp":"魔女と背中を預け合う日が来るとはね。","cut":"P02-S14-C01"},{"start":2227.2616666666663,"end":2227.8056666666666,"kr":"후후.","jp":"ふふ。","cut":"P02-S14-C01"},{"start":2227.8056666666666,"end":2232.701666666667,"kr":"…아이들을 지키는 데에, 편 가르기는 촌스럽죠.","jp":"…子どもを守るのに、敵味方で分けるなんて野暮でしょう。","cut":"P02-S14-C01"},{"start":2233.4583333333335,"end":2240.84615942029,"kr":"그때, 레오나는 전력으로 뿜어낸 불꽃으로 인해 만개에 이르러 몸이 눈부시게 피어납니다.","jp":"その時、レオナは全力で噴き出した炎によって満開に至り、その身がまばゆく咲き始めます。","cut":"P02-S14-C03"},{"start":2240.84615942029,"end":2242.8983333333335,"kr":"이대로면 마녀가 됩니다.","jp":"このままでは魔女になります。","cut":"P02-S14-C03"},{"start":2243.3483333333334,"end":2244.646794871795,"kr":"레오나 씨——!!","jp":"レオナさん——！！","cut":"P02-S14-C03"},{"start":2244.646794871795,"end":2247.5683333333336,"kr":"안 돼, 피지 마, 피지 마아——!!","jp":"だめ、咲かないで、咲かないでぇ——！！","cut":"P02-S14-C03"},{"start":2248.0183333333334,"end":2252.1983333333337,"kr":"주군은 소녀들에게 힘을 놓으라 소리칩니다.","jp":"主君は少女たちに力を手放せと叫びます。","cut":"P02-S14-C03"},{"start":2252.6483333333335,"end":2254.1483333333335,"kr":"전원— 들어라!","jp":"全員——聞け！","cut":"P02-S14-C03"},{"start":2254.1483333333335,"end":2258.6483333333335,"kr":"파기는 너희가 힘을 '놓아야' 성립한다!","jp":"破棄は、お前たちが力を『手放して』初めて成立する！","cut":"P02-S14-C03"},{"start":2259.4166666666665,"end":2264.9666666666662,"kr":"라르므는 놓으면 이 밤도 서로도 잊을 거라고 경고합니다.","jp":"ラルムは、手放せばこの夜も、お互いのことも忘れると警告します。","cut":"P02-S14-C04"},{"start":2265.4166666666665,"end":2266.2086666666664,"kr":"안 돼요.","jp":"だめ。","cut":"P02-S14-C04"},{"start":2266.2086666666664,"end":2269.887634408602,"kr":"놓으면— 놓으면, 전부 끝나 버려요……!!","jp":"手放したら——手放したら、全部終わってしまう……！！","cut":"P02-S14-C04"},{"start":2269.887634408602,"end":2272.0166666666664,"kr":"놓으면…… 잊어버려요.","jp":"手放せば……忘れてしまう。","cut":"P02-S14-C04"},{"start":2272.0166666666664,"end":2276.487634408602,"kr":"이 밤도, 서로도…… 전부, 처음부터 없던 것처럼…….","jp":"この夜も、お互いも……全部、初めからなかったように……。","cut":"P02-S14-C04"},{"start":2276.487634408602,"end":2278.616666666667,"kr":"그래도, 좋다는 건가요…….","jp":"それでも、いいというの……。","cut":"P02-S14-C04"},{"start":2279.375,"end":2287.835,"kr":"능력과 함께, 구하고 울고 웃은 시간까지 전부, 처음부터 없던 것처럼 잃게 될 거라면서요.","jp":"能力とともに、救い、泣き、笑った時間まで全部、初めからなかったかのように失うことになるんですよね。","cut":"P02-S14-C04-02"},{"start":2288.625,"end":2292.775,"kr":"그 선택은 어른이 대신할 수 없었습니다.","jp":"その選択を、大人が代わりに決めることはできませんでした。","cut":"P02-S14-C05"},{"start":2293.1949999999997,"end":2295.8050000000003,"kr":"그래도— 정해라, 너희가.","jp":"それでも——決めろ、お前たちが。","cut":"P02-S14-C05"},{"start":2295.8050000000003,"end":2298.955,"kr":"꽃의 규칙이 아니라, 너희 자신이!","jp":"花の掟じゃない、お前自身が！","cut":"P02-S14-C05"},{"start":2299.375,"end":2306.145,"kr":"하지만 치코링이 소녀들의 이름을 적은 일기장을 가슴에 꼭 안으며 말합니다.","jp":"しかしチコりんは、少女たちの名前を書き留めた日記帳を胸にぎゅっと抱きしめて言います。","cut":"P02-S14-C05"},{"start":2306.565,"end":2308.8450000000003,"kr":"이 일기에, 다 적어 놨어요.","jp":"この日記に、全部書いてあります。","cut":"P02-S14-C05"},{"start":2308.8450000000003,"end":2311.145,"kr":"오늘 밤도 꼭, 적을 거예요.","jp":"今夜も必ず、書きます。","cut":"P02-S14-C05"},{"start":2311.145,"end":2313.965,"kr":"그러니까…… 무섭지, 않아요.","jp":"だから……こわく、ありません。","cut":"P02-S14-C05"},{"start":2313.965,"end":2315.8966666666665,"kr":"…저희는, 씨앗이니까요.","jp":"…私たちは、種ですから。","cut":"P02-S14-C05"},{"start":2315.8966666666665,"end":2318.035,"kr":"놓아도, 다시 피니까요!","jp":"手放しても、また咲きますから！","cut":"P02-S14-C05"},{"start":2318.455,"end":2324.5950000000003,"kr":"자기 이름 하나를 말하는 데도 세 번을 걸리던 치코링이 한 번도 더듬지 않았죠.","jp":"自分の名前ひとつ言うのにも三度かかっていたチコりんが、一度も言葉に詰まりませんでした。","cut":"P02-S14-C05"},{"start":2324.875,"end":2327.915,"kr":"치코링이 새벽빛을 놓습니다.","jp":"チコりんが暁の光を手放します。","cut":"P02-S14-C05"},{"start":2328.6666666666665,"end":2329.5166666666664,"kr":"……하암.","jp":"……ふあぁ。","cut":"P02-S14-C05-02"},{"start":2329.5166666666664,"end":2333.3366666666666,"kr":"…마지막까지, 좋은 바람이었어.","jp":"…最後まで、いい風だった。","cut":"P02-S14-C05-02"},{"start":2333.3366666666666,"end":2335.9566666666665,"kr":"……처음으로 진심을 다했으니까.","jp":"……初めて、本気を出せたから。","cut":"P02-S14-C05-02"},{"start":2335.9566666666665,"end":2337.5566666666664,"kr":"미련, 없음.","jp":"未練、なし。","cut":"P02-S14-C05-02"},{"start":2337.5566666666664,"end":2338.5566666666664,"kr":"— 놓을게.","jp":"——手放す。","cut":"P02-S14-C05-02"},{"start":2338.9766666666665,"end":2341.2366666666667,"kr":"에잇, 이 몸답지 않아!","jp":"ええい、この私らしくない！","cut":"P02-S14-C05-02"},{"start":2341.2366666666667,"end":2343.2166666666662,"kr":"제일 밝게 터졌다!","jp":"一番明るく弾けた！","cut":"P02-S14-C05-02"},{"start":2343.2166666666662,"end":2344.5966666666664,"kr":"다들 봤지?!","jp":"みんな見たでしょ？！","cut":"P02-S14-C05-02"},{"start":2344.5966666666664,"end":2347.1066666666666,"kr":"그럼— 됐어!!","jp":"なら——それでいい！！","cut":"P02-S14-C05-02"},{"start":2347.5266666666666,"end":2352.6966666666667,"kr":"설령 잊게 되더라도— 있었던 밤이, 없던 밤이 되지는 않아요.","jp":"たとえ忘れてしまっても——あった夜が、なかった夜になるわけではありません。","cut":"P02-S14-C05-02"},{"start":2352.6966666666667,"end":2354.9166666666665,"kr":"힘은— 돌려드릴게요.","jp":"力は——お返しします。","cut":"P02-S14-C05-02"},{"start":2355.3366666666666,"end":2358.1366666666663,"kr":"이번에는, 아무도 잃지 않았어.","jp":"今度は、誰も失わなかった。","cut":"P02-S14-C05-02"},{"start":2358.1366666666663,"end":2361.6266666666666,"kr":"그러니까— 나도, 이제…… 놓을게……!","jp":"だから——私も、もう……手放す……！","cut":"P02-S14-C05-02"},{"start":2362.046666666666,"end":2366.4466666666667,"kr":"히땅의 바람이 잦아들고, 네네링의 섬광도 사그라듭니다.","jp":"ヒーたんの風が静まり、ネネりんの閃光も消えていきます。","cut":"P02-S14-C05-02"},{"start":2366.7266666666665,"end":2370.3530158730155,"kr":"엔마루의 손을 떠난 등불도 빛을 잃습니다.","jp":"エンマルの手を離れた灯火も、光を失います。","cut":"P02-S14-C05-02"},{"start":2370.6330158730157,"end":2372.711609977324,"kr":"레오나도 불꽃을 내려놓습니다.","jp":"レオナも炎を手放します。","cut":"P02-S14-C05-02"},{"start":2373.4583333333335,"end":2378.2683333333334,"kr":"그 시각, 목공소에 남은 쥬리땅도 마지막 유성을 거두죠.","jp":"その頃、木工所に残ったジュリたんも、最後の流星を収めます。","cut":"P02-S23-C02-workshop"},{"start":2378.6883333333335,"end":2381.3983333333335,"kr":"박수가 끝나도, 나는 나니까.","jp":"拍手が終わっても、私は私だから。","cut":"P02-S23-C02-workshop"},{"start":2381.3983333333335,"end":2384.0983333333334,"kr":"이 힘도— 놓을게.","jp":"この力も——手放すよ。","cut":"P02-S23-C02-workshop"},{"start":2384.8333333333335,"end":2388.3278172983482,"kr":"마법소녀 모두 스스로 힘을 내려놓았습니다.","jp":"魔法少女たちは皆、自ら力を手放しました。","cut":"P02-S23-C03-core"},{"start":2388.3278172983482,"end":2391.6281632653063,"kr":"치코링은 코어 입구를 돌아봅니다.","jp":"チコりんはコアの入口を振り返ります。","cut":"P02-S23-C03-core"},{"start":2392.0481632653064,"end":2393.518163265306,"kr":"뮤, 뮤게 씨……!","jp":"ミュ、ミュゲさん……！","cut":"P02-S23-C03-core"},{"start":2393.9381632653062,"end":2395.458163265306,"kr":"……보고 있는 것이와요.","jp":"……見ているのでございます。","cut":"P02-S23-C03-core"},{"start":2395.458163265306,"end":2398.1381632653065,"kr":"말 걸지 않는 것이와요.","jp":"話しかけないでほしいのでございます。","cut":"P02-S23-C03-core"},{"start":2398.1381632653065,"end":2403.2981632653064,"kr":"…지금 이 몸은— 아주 중요한 걸, 놓는 중이니까.","jp":"……今、この身は——とても大切なものを、手放しているのですから。","cut":"P02-S23-C03-core"},{"start":2403.7181632653064,"end":2408.9681632653064,"kr":"마침내 조화의 마녀 뮤게까지— 스스로의 힘을 놓았죠.","jp":"ついに、造花の魔女ミュゲまで——自らの力を手放したのです。","cut":"P02-S23-C03-core"},{"start":2409.7916666666665,"end":2411.9021929824557,"kr":"입회인 권한으로.","jp":"立会人の権限において。","cut":"P02-S15-C01"},{"start":2411.9021929824557,"end":2413.8016666666663,"kr":"이 계약을, 파기한다!!","jp":"この契約を、破棄する！！","cut":"P02-S15-C01"},{"start":2414.1516666666666,"end":2415.1016666666665,"kr":"— 접수.","jp":"——受理。","cut":"P02-S15-C01"},{"start":2415.5516666666663,"end":2421.4716666666664,"kr":"공통 원본이 찢어지자, 그 원본에 묶인 계약들이 함께 끝납니다.","jp":"共通原本が破られると、その原本に結ばれていた契約も共に終わります。","cut":"P02-S15-C01"},{"start":2423.255,"end":2424.1900000000005,"kr":"………어라.","jp":"………あら。","cut":"P02-S24-C02-larme"},{"start":2424.1900000000005,"end":2425.5925,"kr":"……가벼워.","jp":"……軽い。","cut":"P02-S24-C02-larme"},{"start":2425.5925,"end":2430.735,"kr":"아아—— …이렇게, 놓는 거였구나.","jp":"ああ——…こうやって、手放すものだったのね。","cut":"P02-S24-C02-larme"},{"start":2431.1850000000004,"end":2436.665,"kr":"비탄의 마녀, 라르므도 자신이 지은 시스템과 함께 풀려 소멸합니다.","jp":"悲嘆の魔女ラルムも、自ら築いた仕組みとともにほどけ、消滅します。","cut":"P02-S24-C02-larme"},{"start":2439.7916666666665,"end":2442.8721428571425,"kr":"소녀들은 돌아온 밤하늘을 올려다봅니다.","jp":"少女たちは、戻ってきた夜空を見上げます。","cut":"P02-S15-C03-02"},{"start":2443.625,"end":2446.145,"kr":"하지만 이리스도 흩어집니다.","jp":"けれど、イリスも散っていきます。","cut":"P02-S16-C01"},{"start":2446.4449999999997,"end":2450.389482758621,"kr":"치코가 붙잡아도 이리스는 고개를 젓습니다.","jp":"チコが引き止めても、イリスは首を振ります。","cut":"P02-S16-C01"},{"start":2450.389482758621,"end":2455.216690140845,"kr":"무서움은 자신이 해 온 일의 변명이 될 수 없다고요.","jp":"怖かったということは、自分のしてきたことの言い訳にはならない、と。","cut":"P02-S16-C01"},{"start":2455.216690140845,"end":2459.1549999999997,"kr":"정원을 다시 만들자는 치코에게 부탁을 남깁니다.","jp":"もう一度庭を作ろうというチコに、頼みを残します。","cut":"P02-S16-C01"},{"start":2459.9166666666665,"end":2465.9786021505374,"kr":"……그럼, 다음 정원은— 문이 있는 정원으로 해 줘요.","jp":"……じゃあ、次の庭は──扉のある庭にしてください。","cut":"P02-S16-C02-02"},{"start":2465.9786021505374,"end":2470.3566666666666,"kr":"들어오는 문과…… 나가는 문이, 있는.","jp":"入る扉と……出ていく扉が、ある庭に。","cut":"P02-S16-C02-02"},{"start":2471.125,"end":2476.495,"kr":"아이들이 다시 피기를 바라며, 이리스도 소멸합니다.","jp":"子どもたちがまた咲くことを願いながら、イリスもまた消えていきます。","cut":"P02-S16-C03"},{"start":2477.25,"end":2480.818695652174,"kr":"살아남은 아이들에게도 대가가 찾아옵니다.","jp":"生き残った子どもたちにも、代価が訪れます。","cut":"P02-S17-C01"},{"start":2480.818695652174,"end":2486.37,"kr":"레오나는 치코의 이름이 떠오르지 않고, 히스이는 왜 우는지 모릅니다.","jp":"レオナはチコの名を思い出せず、ヒスイはなぜ泣いているのかわかりません。","cut":"P02-S17-C01"},{"start":2487.125,"end":2490.0950000000003,"kr":"함께 싸운 밤들이 지워집니다.","jp":"ともに戦った夜が、消えていきます。","cut":"P02-S17-C01-02"},{"start":2490.875,"end":2496.922594936709,"kr":"치코는 작은 일기장을 끌어안고, 잊기 전에 이름들을 적으려 합니다.","jp":"チコは小さな日記帳を抱きしめ、忘れる前に名前を書き留めようとします。","cut":"P02-S17-C02"},{"start":2496.922594936709,"end":2505.8050000000003,"kr":"몇 번이나 연필을 떨어뜨리지만 다시 주워, 떠오르지 않는 이름의 자리에는 고맙다는 말이라도 남깁니다.","jp":"何度も鉛筆を落としながら、そのたびに拾い上げ、思い出せない名前の場所には、せめて、ありがとうと残します。","cut":"P02-S17-C02"},{"start":2506.5833333333335,"end":2511.0133333333333,"kr":"주군의 시야도 하얗게 바래고, 마침내 눈을 뜹니다.","jp":"主君の視界も白く薄れていき、やがて目を覚まします。","cut":"P02-S17-C03"},{"start":2511.7916666666665,"end":2515.6491666666666,"kr":"다시 눈뜬 곳은 네코다니의 저택이었습니다.","jp":"目覚めた場所は、猫谷の屋敷でした。","cut":"P03-S01-C01"},{"start":2515.6491666666666,"end":2520.4116666666664,"kr":"주군의 손끝에는 서명하던 감각이 남아 있습니다.","jp":"主君の指先には、署名した感覚が残っています。","cut":"P03-S01-C01"},{"start":2520.4116666666664,"end":2530.2116666666666,"kr":"책상에는 산 적도 없는 작자 미상의 낡은 각본집이 놓여 있죠. 치코링, 히땅 같은 별명과 여명,","jp":"机には、買った覚えもない、作者不明の古い脚本集が置かれています。チコりん、ひーたんといったあだ名も、黎明、","cut":"P03-S01-C01"},{"start":2530.2116666666666,"end":2540.0116666666663,"kr":"선풍 같은 배역이 그 세계와 일치합니다. 목록 맨 끝 한 줄만 찢겨 있습니다.","jp":"旋風といった役名も、あの世界と一致していました。リストのいちばん最後の一行だけが、破り取られています。","cut":"P03-S01-C01"},{"start":2540.0116666666663,"end":2548.6679166666663,"kr":"고향의 쥬리는 치코링이 자신이 지은 별명이라고 하지만, 언제 지었는지 모릅니다. 책도 가져다 놓은","jp":"故郷のジュリは、チコりんというあだ名は自分がつけたのだと言います。けれど、いつつけたのかはわかりません。","cut":"P03-S01-C01"},{"start":2548.6679166666663,"end":2557.3241666666663,"kr":"적 없다며 제목을 읽다가 말을 늦춥니다.","jp":"本を持ってきた覚えもないと言いながら、題名を読みます。その声が、ふとゆっくりになります。","cut":"P03-S01-C01"},{"start":2557.3241666666663,"end":2564.2054166666667,"kr":"매~지컬 시노비. 매지컬…… 응, 역시 좋아. 입에 착 붙어. …근데 왜일까? 좋은데— 조금,","jp":"マ〜ジカル・シノビ。マジカル……うん、やっぱり好き。口にしっくりくる。…でも、","cut":"P03-S01-C01"},{"start":2564.2054166666667,"end":2571.0866666666666,"kr":"눈물 날 것 같아.","jp":"どうしてかな？好きなのに──ちょっと、泣きそう。","cut":"P03-S01-C01"},{"start":2571.0866666666666,"end":2575.7786666666666,"kr":"이내 쥬리는 평소처럼 아침밥을 찾습니다.","jp":"すぐにジュリは、いつもどおり朝ごはんを欲しがります。","cut":"P03-S01-C01"},{"start":2576.5416666666665,"end":2583.4141666666665,"kr":"며칠 뒤 만난 치코는 요즘 일기를 쓰기 시작했다고 합니다. 잊은 것도 없는데 잊는 게 무서워,","jp":"数日後に会ったチコは、最近、日記を書きはじめたと言います。何かを忘れたわけでもないのに、忘れるのが怖くて、","cut":"P03-S02-C01-02"},{"start":2583.4141666666665,"end":2590.2866666666664,"kr":"그날 만난 사람 이름을 전부 적는다고요.","jp":"その日会った人の名前を全部書いているのだと。","cut":"P03-S02-C01-02"},{"start":2590.2866666666664,"end":2597.1054166666663,"kr":"그, 그리고요…… 가끔, 쓰면서 우는데요. 이, 이유는 모르겠어요. …그, 그래서 그것도 적어","jp":"そ、それとですね……たまに、書きながら泣いちゃうんです。り、理由はわからないです。…だ、だから、","cut":"P03-S02-C01-02"},{"start":2597.1054166666663,"end":2603.9241666666667,"kr":"놨어요. '이유 모름'이라고.","jp":"それも書いておきました。『理由不明』って。","cut":"P03-S02-C01-02"},{"start":2603.9241666666667,"end":2608.7736666666665,"kr":"주군은 좋은 습관이니 계속하라고 답합니다.","jp":"主君は、いい習慣だから続けるといいと答えます。","cut":"P03-S02-C01-02"},{"start":2609.5416666666665,"end":2615.5491666666667,"kr":"떠나는 치코의 품에서 와카와 타마가 서로를 마주 본 것처럼 보입니다.","jp":"去っていくチコの胸元で、ワカとタマが顔を見合わせたように見えました。","cut":"P03-S02-C02-02"},{"start":2615.5491666666667,"end":2619.3096666666665,"kr":"주군은 기분 탓이라고 해 둡니다.","jp":"主君は、気のせいということにします。","cut":"P03-S02-C02-02"},{"start":2620.0833333333335,"end":2625.7658333333334,"kr":"담장 너머로, 갓 구운 빵 냄새와 함께 아야메가 나타납니다.","jp":"塀の向こうから、焼きたてのパンの匂いとともにアヤメが現れます。","cut":"P03-S03-C01"},{"start":2625.7658333333334,"end":2632.3075000000003,"kr":"주군님! 봉주르! 마침 잘 오셨어요. 새로 구운 빵, 드셔 보실래요? 오늘 건 자신작이에요.","jp":"主君さま！ ボンジュール！ ちょうどよいところへいらっしゃいました。焼きたてのパン、召し上がりませんか？","cut":"P03-S03-C01"},{"start":2632.3075000000003,"end":2638.849166666667,"kr":"주군님! 봉주르! 마침 잘 오셨어요. 새로 구운 빵, 드셔 보실래요? 오늘 건 자신작이에요.","jp":"今日のは自信作なんです。マドレーヌを作るつもりだったのに、","cut":"P03-S03-C01"},{"start":2638.849166666667,"end":2645.3908333333334,"kr":"마들렌을 만들려고 했는데, 어쩐지 동그랗게 부풀어서— 이름은 '동글이'로 했어요.","jp":"なぜか丸く膨らんでしまって——『まるちゃん』と名づけました。","cut":"P03-S03-C01"},{"start":2645.3908333333334,"end":2648.2908333333335,"kr":"……이름부터 배부르군.","jp":"……名前からして腹いっぱいだな。","cut":"P03-S03-C01"},{"start":2648.2908333333335,"end":2653.1908333333336,"kr":"꽃밭처럼 웃는, 평소의 아야메였습니다. 그런데 문득, 아야메가 아주 살짝 고개를 기울이며 웃는","jp":"花畑のように笑う、いつものアヤメでした。けれどふと、ほんの少し首をかしげ、笑顔のままで尋ねます。","cut":"P03-S03-C01"},{"start":2653.1908333333336,"end":2658.0908333333336,"kr":"채로 묻습니다.","jp":"花畑のように笑う、いつものアヤメでした。けれどふと、ほんの少し首をかしげ、笑顔のままで尋ねます。","cut":"P03-S03-C01"},{"start":2658.0908333333336,"end":2663.8158333333336,"kr":"— 그런데, 주군님. ……좋은 꿈, 꾸셨나요?","jp":"——ところで、主君さま。……よい夢を、ご覧になりましたか？","cut":"P03-S03-C01"},{"start":2663.8158333333336,"end":2669.0658333333336,"kr":"주군은 꿈 이야기를 누구에게도 한 마디도 하지 않았는데 말이죠.","jp":"主君は、夢の話を誰にも一言もしていませんでした。","cut":"P03-S03-C01"},{"start":2669.0658333333336,"end":2675.8408333333336,"kr":"그럼, 또 들러 주세요! 다음엔 새 레시피에 도전할 거예요!","jp":"では、またお立ち寄りくださいね！ 次は新しいレシピに挑戦します！","cut":"P03-S03-C01"},{"start":2675.8408333333336,"end":2684.4268333333334,"kr":"아야메가 손을 흔들며 사라집니다. 주군은 빵을 든 채 서서, 끝내 대답하지 못했습니다.","jp":"アヤメは手を振って去っていきます。主君はパンを手に立ち尽くし、最後まで答えられませんでした。","cut":"P03-S03-C01"}],"scenes":[{"id":"P01-S01","title":"낯선 골목의 레오나와 결계의 밤","start":0.0,"end":98.0,"file":"../part1/scenes/P01-S01.mp4","audio":{"kr":"../part1/scenes/P01-S01_kr.m4a","jp":"../part1/scenes/P01-S01_jp.m4a"}},{"id":"P01-S02","title":"골동품상의 하케와 여우 인형","start":98.0,"end":133.08333333333334,"file":"../part1/scenes/P01-S02.mp4","audio":{"kr":"../part1/scenes/P01-S02_kr.m4a","jp":"../part1/scenes/P01-S02_jp.m4a"}},{"id":"P01-S03","title":"등굣길에서 만난 치코","start":133.08333333333334,"end":206.70833333333334,"file":"../part1/scenes/P01-S03.mp4","audio":{"kr":"../part1/scenes/P01-S03_kr.m4a","jp":"../part1/scenes/P01-S03_jp.m4a"}},{"id":"P01-S04","title":"치코의 구출과 품속의 속삭임","start":206.70833333333334,"end":241.16666666666666,"file":"../part1/scenes/P01-S04.mp4","audio":{"kr":"../part1/scenes/P01-S04_kr.m4a","jp":"../part1/scenes/P01-S04_jp.m4a"}},{"id":"P01-S05","title":"책상 위의 계약 권유","start":241.16666666666666,"end":322.4166666666667,"file":"../part1/scenes/P01-S05.mp4","audio":{"kr":"../part1/scenes/P01-S05_kr.m4a","jp":"../part1/scenes/P01-S05_jp.m4a"}},{"id":"P01-S06","title":"평범한 하굣길에서 치코의 계약까지","start":322.4166666666667,"end":463.4583333333333,"file":"../part1/scenes/P01-S06.mp4","audio":{"kr":"../part1/scenes/P01-S06_kr.m4a","jp":"../part1/scenes/P01-S06_jp.m4a"}},{"id":"P01-S07","title":"히스이의 구출과 히땅의 계약","start":463.4583333333333,"end":503.25,"file":"../part1/scenes/P01-S07.mp4","audio":{"kr":"../part1/scenes/P01-S07_kr.m4a","jp":"../part1/scenes/P01-S07_jp.m4a"}},{"id":"P01-S08","title":"쿠로코의 목공소","start":503.25,"end":536.9166666666666,"file":"scenes/P01-S08.mp4","audio":{"kr":"scenes/P01-S08_kr.m4a","jp":"scenes/P01-S08_jp.m4a"}},{"id":"P01-S09","title":"쥬리땅의 공개전","start":536.9166666666666,"end":594.25,"file":"../part1/scenes/P01-S09.mp4","audio":{"kr":"../part1/scenes/P01-S09_kr.m4a","jp":"../part1/scenes/P01-S09_jp.m4a"}},{"id":"P01-S10","title":"이리스와 움직이지 않는 몸","start":594.25,"end":666.3333333333334,"file":"../part1/scenes/P01-S10.mp4","audio":{"kr":"../part1/scenes/P01-S10_kr.m4a","jp":"../part1/scenes/P01-S10_jp.m4a"}},{"id":"P01-S11","title":"가시 성당의 패배","start":666.3333333333334,"end":780.1666666666666,"file":"../part1/scenes/P01-S11.mp4","audio":{"kr":"../part1/scenes/P01-S11_kr.m4a","jp":"../part1/scenes/P01-S11_jp.m4a"}},{"id":"P01-S12","title":"병실에서 만난 네네링","start":780.1666666666666,"end":809.75,"file":"../part1/scenes/P01-S12.mp4","audio":{"kr":"../part1/scenes/P01-S12_kr.m4a","jp":"../part1/scenes/P01-S12_jp.m4a"}},{"id":"P01-S13","title":"손끝에 나타난 이상","start":809.75,"end":819.7916666666666,"file":"../part1/scenes/P01-S13.mp4","audio":{"kr":"../part1/scenes/P01-S13_kr.m4a","jp":"../part1/scenes/P01-S13_jp.m4a"}},{"id":"P01-S14","title":"공개전에서 쓰러진 쥬리땅","start":819.7916666666666,"end":838.4166666666666,"file":"../part1/scenes/P01-S14.mp4","audio":{"kr":"../part1/scenes/P01-S14_kr.m4a","jp":"../part1/scenes/P01-S14_jp.m4a"}},{"id":"P01-S15","title":"숨겨 온 계약의 대가","start":838.4166666666666,"end":928.7916666666666,"file":"scenes/P01-S15.mp4","audio":{"kr":"scenes/P01-S15_kr.m4a","jp":"scenes/P01-S15_jp.m4a"}},{"id":"P01-S16","title":"소녀들이 떠난 목공소","start":928.7916666666666,"end":937.7083333333334,"file":"../part1/scenes/P01-S16.mp4","audio":{"kr":"../part1/scenes/P01-S16_kr.m4a","jp":"../part1/scenes/P01-S16_jp.m4a"}},{"id":"P01-S17","title":"스타가 사라진 광장","start":937.7083333333334,"end":988.375,"file":"scenes/P01-S17.mp4","audio":{"kr":"scenes/P01-S17_kr.m4a","jp":"scenes/P01-S17_jp.m4a"}},{"id":"P01-S18","title":"서명한 어른의 새로운 목표","start":988.375,"end":1006.3333333333334,"file":"../part1/scenes/P01-S18.mp4","audio":{"kr":"../part1/scenes/P01-S18_kr.m4a","jp":"../part1/scenes/P01-S18_jp.m4a"}},{"id":"P02-S01","title":"오늘 밤을 지키는 치코링","start":1006.3333333333334,"end":1036.2916666666667,"file":"../part2/scenes/P02-S01.mp4?v=combined-20261126","audio":{"kr":"../part2/scenes/P02-S01_kr.m4a?v=combined-20261126","jp":"../part2/scenes/P02-S01_jp.m4a?v=combined-20261126"}},{"id":"P02-S02","title":"아이들이 돌아올 길을 찾는 주군","start":1036.2916666666667,"end":1049.3333333333333,"file":"../part2/scenes/P02-S02.mp4?v=combined-20261126","audio":{"kr":"../part2/scenes/P02-S02_kr.m4a?v=combined-20261126","jp":"../part2/scenes/P02-S02_jp.m4a?v=combined-20261126"}},{"id":"P02-S03","title":"세나가 기억하는 동료","start":1049.3333333333333,"end":1119.4583333333333,"file":"../part2/scenes/P02-S03.mp4?v=combined-20261126","audio":{"kr":"../part2/scenes/P02-S03_kr.m4a?v=combined-20261126","jp":"../part2/scenes/P02-S03_jp.m4a?v=combined-20261126"}},{"id":"P02-S04","title":"이기지 않을 방법","start":1119.4583333333333,"end":1180.75,"file":"../part2/scenes/P02-S04.mp4?v=combined-20261126","audio":{"kr":"../part2/scenes/P02-S04
