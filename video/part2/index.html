りました。[黎明の少女]チコりんです。一人で人々を守りに向かう少女に、","cut":"P02-S01-C01"},{"start":38.5225,"end":47.295,"kr":"나서는 아이에게 주군이 묻습니다. 시들 수 있다는 걸 알면서 왜 계속하느냐고요.","jp":"主君は尋ねます。枯れるかもしれないと知りながら、なぜ続けるのか、と。","cut":"P02-S01-C01"},{"start":47.295,"end":56.17,"kr":"……무, 무서워요. 무서운데요. 그치만— 오늘 밤 누가 다치는 건 '지금' 무섭잖아요.","jp":"……こ、怖いです。怖いですけど。でも──今夜誰かがケガするのは、『今』怖いじゃないですか。","cut":"P02-S01-C01"},{"start":56.17,"end":61.31,"kr":"내일 시드는 건…… 내일의 내가 무서워하면 되니까……!","jp":"明日枯れるのは……明日の私が怖がれば、いいですから……！","cut":"P02-S01-C01"},{"start":62.083333333333336,"end":69.07933333333334,"kr":"주군도 계약을 끝낼 단서를 찾아 더 적극적으로 움직입니다. 아이들이 싸우는 동안, 그들을 살아서","jp":"主君も、契約を終わらせる手がかりを求め、さらに積極的に動きます。子どもたちが戦っているあいだに、","cut":"P02-S01-C02"},{"start":69.07933333333334,"end":76.07533333333333,"kr":"돌아오게 할 길을 찾아야 했습니다.","jp":"彼女たちを生きて帰らせる道を見つけなければなりませんでした。","cut":"P02-S01-C02"},{"start":76.83333333333334,"end":83.68933333333334,"kr":"주군과 치코링은 소문을 따라, 골목 안 오래된 찻집을 찾아갑니다. 주인은 만개 직전에 스스로 멈춘","jp":"主君とチコりんは、噂を頼りに路地裏の古い喫茶店を訪ねます。店主は、満開の直前で自ら立ち止まった唯一の生還者、","cut":"P02-S02-C01"},{"start":83.68933333333334,"end":90.54533333333335,"kr":"유일한 생환자, [빙화의 소녀], 세나. 세나는 [절화의 마녀] 이리스가 [만개의 소녀]이던","jp":"主君とチコりんは、噂を頼りに路地裏の古い喫茶店を訪ねます。店主は、満開の直前で自ら立ち止まった唯一の生還者、","cut":"P02-S02-C01"},{"start":90.54533333333335,"end":97.40133333333334,"kr":"시절의 이야기를 들려줍니다.","jp":"[氷華の少女]セナ。セナは、[切花の魔女]イリスが、[満開の少女]だった頃の話をしてくれます。","cut":"P02-S02-C01"},{"start":98.16666666666667,"end":106.12666666666667,"kr":"세나가 기억하는 [만개의 소녀]는 누구보다 강하고 다정한 동료였습니다. 시들어 가는 친구들을 모두","jp":"セナの記憶にある[満開の少女]は、誰よりも強く、優しい仲間でした。枯れていく友だちをみんな守ろうと、","cut":"P02-S02-C02"},{"start":106.12666666666667,"end":114.08666666666667,"kr":"지키려고 가장 간절히 싸웠고, 그래서 누구보다 먼저 만개했죠.","jp":"誰よりも必死に戦い、だからこそ、誰よりも先に満開になったのです。","cut":"P02-S02-C02"},{"start":114.08666666666667,"end":121.41466666666668,"kr":"모두가 기대던 소녀에게는 정작 자신이 무너지는 모습을 보일 곳이 없었습니다. 결국 시들어 가는","jp":"誰もが頼りにしていたその少女には、自分が崩れていく姿を見せられる場所がありませんでした。ついに、","cut":"P02-S02-C02"},{"start":121.41466666666668,"end":128.74266666666668,"kr":"모습을 누구에게도 보이고 싶지 않아, 스스로를 꺾고 말았습니다.","jp":"枯れていく姿を誰にも見せたくないと、自らを切り落としてしまったのです。","cut":"P02-S02-C02"},{"start":129.5,"end":137.276,"kr":"세나는 이리스가 자신이 겪은 고통을 다른 누구도 겪지 않게 하려 한다고 말합니다.","jp":"セナは、イリスが自分と同じ苦しみを、ほかの誰にも味わわせまいとしているのだと言います。","cut":"P02-S02-C04"},{"start":138.04166666666666,"end":144.94166666666666,"kr":"시들기 전에 세계째로 꺾어, 가장 아름다운 순간에 모두를 멈추려는 겁니다. 한때 동료를 지키던","jp":"枯れる前に世界ごと切り落とし、いちばん美しい瞬間に、すべてを止めようとしているのです。","cut":"P02-S02-C04-02"},{"start":144.94166666666666,"end":151.84166666666667,"kr":"다정함이, 이제는 그런 모양으로 뒤틀려 있었습니다.","jp":"かつて仲間を守っていた優しさは、今ではそんな形に歪んでいました。","cut":"P02-S02-C04-02"},{"start":152.625,"end":158.445,"kr":"치코링이 이길 방법을 묻자 세나의 답변은 짧았습니다.","jp":"勝つ方法をチコりんが尋ねると、セナの答えは短いものでした。","cut":"P02-S03-C01"},{"start":158.445,"end":160.089,"kr":"없어.","jp":"ない。","cut":"P02-S03-C01"},{"start":160.875,"end":166.803,"kr":"이긴다는 것은 이리스보다 강해져, 활짝 핀다는 것을 의미했습니다. 그리고 그 끝은 치코링이 다음","jp":"勝つということは、イリスより強くなり、咲ききるということでした。その行き着く先は、","cut":"P02-S03-C01-02"},{"start":166.803,"end":172.731,"kr":"[절화의 마녀]가 되는 것이었죠.","jp":"チコりんが次の[切花の魔女]になることです。","cut":"P02-S03-C01-02"},{"start":173.5,"end":180.556,"kr":"하지만 세나처럼 만개 전에 싸우지 않고 멈추면 도시가 삼켜집니다.","jp":"けれど、セナのように満開の前に戦いをやめて立ち止まれば、街が吞み込まれます。","cut":"P02-S03-C01-03"},{"start":181.33333333333334,"end":188.69083333333333,"kr":"싸우면 치코링이 지고, 안 싸우면 도시가 지는 문제였죠.","jp":"戦えばチコりんが敗れ、戦わなければ街が敗れる。そんな問題でした。","cut":"P02-S03-C01-04"},{"start":188.69083333333333,"end":196.40333333333334,"kr":"치코링이 문제 자체가 잘못됐다고 하자 세나는 그 말이 시작이라며 문제 밖에서 정답을 찾아보라고","jp":"チコりんが、問題そのものが間違っていると言うと、セナはその言葉こそが始まりだと答え、","cut":"P02-S03-C01-04"},{"start":196.40333333333334,"end":204.11583333333334,"kr":"합니다. 지금껏 아무도 찾지 못했던 '이기지 않을 방법'을요.","jp":"問題の外で答えを探すよう勧めます。これまで誰も見つけられなかった、「勝たない方法」を。","cut":"P02-S03-C01-04"},{"start":204.11583333333334,"end":211.07258333333334,"kr":"더 이상 세나가 아는 것은 없었습니다. 다만, 이리스도 계약을 끝낼 '문'을 찾았지만, 자기","jp":"セナにも、それ以上のことはわかりませんでした。ただ、イリスも契約を終わらせる「扉」を探したものの、","cut":"P02-S03-C01-04"},{"start":211.07258333333334,"end":218.02933333333334,"kr":"손에서는 노래하지 않는다고 했다는 단서를 남겼습니다.","jp":"自分の手では歌わないと言っていた、という手がかりを残します。","cut":"P02-S03-C01-04"},{"start":218.79166666666669,"end":227.3704166666667,"kr":"치코링은 에글랑틴을 다시 만나기로 합니다. 마녀도 한때 사람을 지키던 소녀라면 이야기가 통할지","jp":"チコりんは、エグランティーヌにもう一度会うと決めます。魔女もかつて人を守っていた少女なら、","cut":"P02-S04-C01"},{"start":227.3704166666667,"end":235.94916666666668,"kr":"모릅니다. 지난번에 일행을 끝까지 쫓지 않았다는 사실도 마음에 남았죠.","jp":"話が通じるかもしれません。前の戦いで、一行を最後まで追ってこなかったことも、心に残っていました。","cut":"P02-S04-C01"},{"start":235.94916666666668,"end":242.5616666666667,"kr":"히땅도 이번에는 옆에 섰습니다. 이야기가 통한다는 보장은 없지만 네네링이 쓰러진 곳에 치코링을","jp":"今度は、ひーたんも隣に立ちます。話が通じる保証はありません。それでも、ネネりんが倒れた場所へ、","cut":"P02-S04-C01"},{"start":242.5616666666667,"end":249.17416666666668,"kr":"혼자 보낼 수 없었습니다.","jp":"チコりんを一人で行かせるわけにはいきませんでした。","cut":"P02-S04-C01"},{"start":249.17416666666668,"end":254.47833333333335,"kr":"치코링은 이기려 온 것이 아니라며 빛의 무기를 내립니다. 히땅이 파편과 성당 밖으로 뻗는 덩굴을","jp":"チコりんは、勝ちに来たのではないと言って、光の武器を下ろします。","cut":"P02-S04-C01"},{"start":254.47833333333335,"end":259.7825,"kr":"치코링은 이기려 온 것이 아니라며 빛의 무기를 내립니다. 히땅이 파편과 성당 밖으로 뻗는 덩굴을","jp":"ひーたんが破片や聖堂の外へ伸びる蔓を食い止めるあいだ、チコりんは棘に裂かれる痛みに耐えながら、","cut":"P02-S04-C01"},{"start":259.7825,"end":265.0866666666667,"kr":"막는 동안, 치코링은 가시에 찢기는 아픔을 견디며 에글랑틴에게 다가갑니다.","jp":"エグランティーヌへ近づいていきます。","cut":"P02-S04-C01"},{"start":265.0866666666667,"end":267.9616666666667,"kr":"……이기지 않는, 마법소녀?","jp":"……勝たない、魔法少女？","cut":"P02-S04-C01"},{"start":267.9616666666667,"end":274.2866666666667,"kr":"후후…… 후후후. 그건 그냥— 먹잇감이라고 하는 거랍니다.","jp":"ふふ……ふふふ。それはただの……獲物ですわ。","cut":"P02-S04-C01"},{"start":274.2866666666667,"end":280.9241666666667,"kr":"그런데 치코링이 찔릴 때마다 에글랑틴이 먼저 움찔합니다.","jp":"ところが、チコりんが刺されるたびに、エグランティーヌの方が先に身を震わせます。","cut":"P02-S04-C01"},{"start":280.9241666666667,"end":288.38666666666666,"kr":"오지 마세요. …오지 마. 가시에 찢겨요. 아프다구요.","jp":"来ないでください。…来ないで。棘に裂かれます。痛いんですよ。","cut":"P02-S04-C01"},{"start":288.38666666666666,"end":296.0991666666667,"kr":"아, 아파요……! 엄청 아파요……! 그, 그치만— 당신의 가시, 이상해요……!","jp":"い、痛いです……！すごく痛いです……！で、でも──あなたの棘、おかしいです……！","cut":"P02-S04-C01"},{"start":296.0991666666667,"end":301.5891666666667,"kr":"찌르는 방향이…… 저, 전부, 안쪽이잖아요……! 그거, 묶는 게 아니라— 사실은, 노, 놓치기","jp":"棘の向きが……ぜ、全部、内側じゃないですか……！それって、縛りたいんじゃなくて──本当は、は、","cut":"P02-S04-C01"},{"start":301.5891666666667,"end":307.0791666666667,"kr":"싫은 거잖아요……!","jp":"離したくないんじゃないですか……！","cut":"P02-S04-C01"},{"start":307.83333333333337,"end":313.8573333333334,"kr":"치코링의 말에 [결박의 마녀]는 잊었던 이름을 떠올립니다. [인연의 소녀]. 붉은 실로 사람들을","jp":"チコりんの言葉に、[結縛の魔女]は、忘れていた名を思い出します。[縁の少女]。赤い糸で、","cut":"P02-S05-C01"},{"start":313.8573333333334,"end":319.8813333333334,"kr":"이어 주던 아이였습니다.","jp":"人と人をつないでいた少女でした。","cut":"P02-S05-C01"},{"start":320.6666666666667,"end":327.2546666666667,"kr":"하지만 인연이 풀리는 게 두려워 매듭을 거듭 조였고, 실은 가시가 되었습니다. 놓치기 싫다는","jp":"けれど、縁がほどけるのが怖くて、何度も結び目を締め直すうちに、糸は棘になりました。離したくないという気持ちが、","cut":"P02-S05-C02"},{"start":327.2546666666667,"end":333.8426666666667,"kr":"마음이 사람들을 가둔 거죠.","jp":"人々を閉じ込めてしまったのです。","cut":"P02-S05-C02"},{"start":335.5416666666667,"end":341.5896666666667,"kr":"제단 앞까지 다가온 치코링 주변에서만 덩굴이 물러납니다.","jp":"祭壇の前まで近づいたチコりんの周りだけ、蔓が退いていきます。","cut":"P02-S05-C03"},{"start":342.375,"end":345.995,"kr":"치코링이 빈손을 내밉니다.","jp":"チコりんが何も持たない手を差し出します。","cut":"P02-S05-C03-hands"},{"start":345.995,"end":351.2825,"kr":"이, 인연은요. 묶는 게 아니라— 잡는 거예요.","jp":"き、絆は。縛るものじゃなくて——つかむもの、です。","cut":"P02-S05-C03-hands"},{"start":351.2825,"end":355.333,"kr":"마침내 에글랑틴이 치코링의 손을 잡습니다.","jp":"ついにエグランティーヌがチコりんの手を取ります。","cut":"P02-S05-C03-hands"},{"start":356.0833333333333,"end":362.942,"kr":"아무도 놓치지 않으려 붙들고 있던 마음을 놓자, 소녀들을 조이던 덩굴이 풀리고 에글랑틴의 몸도","jp":"誰も失いたくない』という想いでしたから。\n\nエグランティーヌは、薄れていく指先を見つめます。","cut":"P02-S05-C03-farewell"},{"start":362.942,"end":369.80066666666664,"kr":"발끝부터 사라지기 시작합니다.\n\n……아아. 그런, 거였군요. 마녀는— 이 마음을 놓으면, 몸도","jp":"誰も失いたくない』という想いでしたから。\n\nエグランティーヌは、薄れていく指先を見つめます。","cut":"P02-S05-C03-farewell"},{"start":369.80066666666664,"end":376.65933333333334,"kr":"사라지는 거였어요.\n\n저를 붙들고 있던 건, 이 힘이 아니라— '놓치기 싫다'는","jp":"驚いたチコりんが今のことを取り消そうとしても、エグランティーヌはその手を、さらに強く握ります。\n\n最後に、","cut":"P02-S05-C03-farewell"},{"start":376.65933333333334,"end":383.518,"kr":"마음이었으니까.\n\n에글랑틴은 희미해지는 손끝을 바라봅니다. 놀란 치코링이 취소하려 해도,","jp":"棘のない手をつなげただけで十分だと告げ、チコりんとひーたんに、","cut":"P02-S05-C03-farewell"},{"start":383.518,"end":390.37666666666667,"kr":"에글랑틴은 손을 더 꼭 쥡니다.\n\n마지막에 가시 없이 손을 잡은 것으로 충분하다며, 치코링과","jp":"棘のない手をつなげただけで十分だと告げ、チコりんとひーたんに、","cut":"P02-S05-C03-farewell"},{"start":390.37666666666667,"end":397.2353333333333,"kr":"히땅에게 [인연의 소녀]라는 이름을 기억해 달라고 부탁합니다.\n\n따뜻했던 손이 사라지자\n\n치코링이","jp":"[縁の少女]という名を覚えていてほしいと頼みます。\n\n温かかった手が消えると、\n\nチコりんは泣き出し、","cut":"P02-S05-C03-farewell"},{"start":397.2353333333333,"end":404.094,"kr":"울음을 터뜨리고, 히땅이 안아 줍니다.\n\n소녀들은 이제 배웠습니다. 마녀와 손을 잡을 수는","jp":"ひーたんが抱きしめます。\n\n少女たちは、知りました。魔女と手をつなぐことはできても、人に戻すことはできない。","cut":"P02-S05-C03-farewell"},{"start":404.094,"end":410.95266666666663,"kr":"있어도, 사람으로 되돌릴 수는 없었습니다. 남은 소녀들에게는 마녀가 되기 전에 살아서 나갈 출구가","jp":"ひーたんが抱きしめます。\n\n少女たちは、知りました。魔女と手をつなぐことはできても、人に戻すことはできない。","cut":"P02-S05-C03-farewell"},{"start":410.95266666666663,"end":417.8113333333333,"kr":"필요했습니다.","jp":"残された少女たちには、魔女になる前に、生きて出られる出口が必要でした。","cut":"P02-S05-C03-farewell"},{"start":418.5833333333333,"end":424.2620833333333,"kr":"그 무렵, 도시의 전파를 장악한 마녀가 있습니다. [풍문의 마녀], 벨. 주군에게는 고향의 메이와","jp":"その頃、街の電波を支配する魔女がいました。[風聞の魔女]、ベル。主君には、故郷のメイと同じ顔に見えました。","cut":"P02-BELLE-C01"},{"start":424.2620833333333,"end":429.94083333333333,"kr":"같은 얼굴이었죠.","jp":"その頃、街の電波を支配する魔女がいました。[風聞の魔女]、ベル。主君には、故郷のメイと同じ顔に見えました。","cut":"P02-BELLE-C01"},{"start":429.94083333333333,"end":437.4473333333333,"kr":"벨은 소녀들의 실패와 눈물만 골라 방송하며, 사람들의 불안을 키워 왔습니다.","jp":"ベルは少女たちの失敗と涙ばかりを選んで放送し、人々の不安をあおってきたのです。","cut":"P02-BELLE-C01"},{"start":438.2083333333333,"end":444.08708333333334,"kr":"료가 회선을 뒤집자, 화면에는 편집되지 않은 진실이 흐릅니다. 무너지는 탑에서 사람을 구하는","jp":"リョウが回線を切り替えると、画面には編集されていない真実が流れます。崩れる塔から人を救う少女たち、","cut":"P02-BELLE-C02"},{"start":444.08708333333334,"end":449.9658333333333,"kr":"소녀들, 그리고 광장의 노래였죠.","jp":"そして広場の歌でした。","cut":"P02-BELLE-C02"},{"start":449.9658333333333,"end":455.61583333333334,"kr":"……바보 아냐? 남의 성이 무너지는데, 왜…….","jp":"……バカじゃないの？ 他人の城が崩れているのに、どうして……。","cut":"P02-BELLE-C02"},{"start":455.61583333333334,"end":459.34233333333333,"kr":"벨 씨의 화면으로, 모두가 보고 있어요!","jp":"ベルさんの画面で、みんなが見ています！","cut":"P02-BELLE-C02"},{"start":460.125,"end":470.5575,"kr":"벨은 누구보다 갈채를 잃는 것을 두려워했던 소녀였습니다. 미움이라도 시선을 붙잡으려 했던 겁니다.","jp":"ベルは誰よりも、喝采を失うことを恐れていた少女でした。憎まれても、誰かの視線をつなぎ留めようとしていたのです。","cut":"P02-BELLE-C03"},{"start":470.5575,"end":479.57,"kr":"오늘부로 이 채널의 풍문 특집은, 전부 종영! 후속 프로그램은— 지금 보고 계신, 그거.","jp":"本日をもって、このチャンネルの噂特集は全部終了！ 後番組は──今、ご覧になっている、それ。","cut":"P02-BELLE-C03"},{"start":479.57,"end":488.973,"kr":"마지막으로 진실을 내보낸 벨은 카메라를 내려놓습니다. 마녀의 몸은 빛의 노이즈가 되어 흩어집니다.","jp":"最後に真実を届けたベルは、カメラを下ろします。魔女の体は光のノイズとなって、散っていきました。","cut":"P02-BELLE-C03"},{"start":489.75,"end":497.7816666666667,"kr":"그동안 주군은 와카와 타마에게 계약서 전문을 요구합니다. 입회인에게는 자신이 서명한 문서를 끝까지","jp":"そのあいだ、主君はワカとタマに契約書の全文を要求します。立会人には、","cut":"P02-S06-C01"},{"start":497.7816666666667,"end":505.81333333333333,"kr":"읽을 권리가 있었습니다. 읽지 못한 채 서명했다고 해서, 그 권리까지 사라진 건 아니었죠. 주군이","jp":"自分が署名した書類を最後まで読む権利がありました。読めないまま署名したからといって、","cut":"P02-S06-C01"},{"start":505.81333333333333,"end":513.845,"kr":"끝까지 물러서지 않자 인형들은 마침내 두루마리를 펼칩니다.","jp":"その権利までなくなったわけではありません。主君が最後まで引き下がらないので、人形たちはついに巻物を広げます。","cut":"P02-S06-C01"},{"start":513.845,"end":520.05125,"kr":"두루마리에는 소원과 힘, 개화와 대가는 모두 적혀 있습니다. 그런데 해약 조항이 있어야 할 마지막","jp":"巻物には、願いと力、開花と代価がすべて記されていました。けれど、解約条項があるはずの最後の一行だけが、","cut":"P02-S06-C01"},{"start":520.05125,"end":526.2575,"kr":"줄만 찢겨 있습니다.","jp":"破り取られています。","cut":"P02-S06-C01"},{"start":526.2575,"end":532.31575,"kr":"인형들도 자신들이 태어날 때부터 없던 줄이라 모른다고 하죠. 주군은 다른 기록에 남아 있을지 찾기","jp":"人形たちも、自分たちが生まれたときからなかった一行なので、知らないと言います。主君は、","cut":"P02-S06-C01"},{"start":532.31575,"end":538.374,"kr":"시작합니다.","jp":"ほかの記録に残っていないか、探しはじめます。","cut":"P02-S06-C01"},{"start":539.125,"end":546.6108333333333,"kr":"문서를 뒤지던 주군 앞에 황혼빛 아이가 나타납니다. 마법소녀도 마녀도 아닌, 이름과 정체를 알 수","jp":"書類を調べている主君の前に、黄昏色の子どもが現れます。魔法少女でも魔女でもない、名前も正体もわからない子です。","cut":"P02-S07-C01"},{"start":546.6108333333333,"end":554.0966666666667,"kr":"없는 아이죠. 계약서를 태우면 전부 끝난다고 권하지만, 주군은 거절합니다. 아이들의 운명이 어떻게","jp":"契約書を燃やせばすべて終わると勧めますが、主君は断ります。子どもたちの運命がどうなるかわからないまま、","cut":"P02-S07-C01"},{"start":554.0966666666667,"end":561.5825,"kr":"될지 모른 채 끝내 버릴 수는 없습니다.","jp":"終わらせるわけにはいきません。","cut":"P02-S07-C01"},{"start":561.5825,"end":568.6075,"kr":"아이들이 나갈 문을 찾겠다는 주군을 보고, 황혼빛 아이가 단서를 줍니다.","jp":"子どもたちが出ていく扉を探すという主君に、黄昏色の子どもは手がかりを与えます。","cut":"P02-S07-C01"},{"start":568.6075,"end":575.05825,"kr":"적힌 걸 찢어도, 말해진 건 남아. 그 줄을 '들은' 존재가, 이 도시 어딘가에 아직 있어.","jp":"書かれたものを破いても、語られたことは残る。その一行を『聞いた』者が、この街のどこかにまだいる。","cut":"P02-S07-C01"},{"start":575.05825,"end":581.509,"kr":"…제일 오래된 물건 곁을 뒤져 봐.","jp":"…いちばん古い品のそばを探してみて。","cut":"P02-S07-C01"},{"start":582.2916666666666,"end":587.2891666666666,"kr":"오래 남아 있으면서 목소리를 간직할 수 있는 물건. 그런 골동품을 찾아, 인형들을 받았던 하케","jp":"長く残り、声をしまっておけるもの。そんな骨董品を探して、人形をもらったハケさんの店へ戻ります。","cut":"P02-S07-C03"},{"start":587.2891666666666,"end":592.2866666666666,"kr":"씨의 가게로 돌아갑니다.","jp":"長く残り、声をしまっておけるもの。そんな骨董品を探して、人形をもらったハケさんの店へ戻ります。","cut":"P02-S07-C03"},{"start":592.2866666666666,"end":600.4464166666667,"kr":"하케 씨가 기다렸다는 듯 꺼내 온 것은 축음기 실린더, 목소리를 녹음한 통입니다. 이리스도 만개","jp":"ハケさんが待っていたかのように取り出したのは、蓄音機のシリンダー。声を録音した筒です。","cut":"P02-S07-C03"},{"start":600.4464166666667,"end":608.6061666666666,"kr":"전에 찾았지만, 힘을 받은 소녀의 손으로는 열 수 없었다고 했던 물건이죠.","jp":"イリスも満開になる前に探し当てたものの、力を受け取った少女の手では開けなかったという品でした。","cut":"P02-S07-C03"},{"start":609.375,"end":615.745,"kr":"주군은 고장 난 실린더를 목공소로 가져가고, 쿠로코가 태엽을 고칩니다.","jp":"主君は壊れたシリンダーを木工所へ持ち込み、クロコがゼンマイを修理します。","cut":"P02-S08-C01"},{"start":615.745,"end":621.591,"kr":"실린더를 본 와카와 타마는 계약서 원본을 주군에게 넘깁니다.","jp":"シリンダーを見たワカとタマは、契約書の原本を主君に渡します。","cut":"P02-S08-C01"},{"start":622.375,"end":630.4575,"kr":"한 소녀의 계약서가 아니라, 이 도시의 개별 계약들을 묶는 공통 원본이었습니다.","jp":"それは、一人の少女の契約書ではなく、この街の個々の契約を束ねる共通の原本でした。","cut":"P02-S08-C02"},{"start":630.4575,"end":639.583,"kr":"인형들은 관리자 권한으로, 그 원본에 연결된 계약들의 해약을 집행할 권리를 주군에게 맡깁니다.","jp":"人形たちは管理者の権限で、その原本につながる契約の解約を執行する権利を、主君に託します。","cut":"P02-S08-C02"},{"start":640.3333333333334,"end":645.0370833333334,"kr":"태엽은 고쳤지만 낡은 실린더는 서명한 입회인의 손에서만 소리가 나며, 한 번만 재생할 수","jp":"ゼンマイは直りましたが、古いシリンダーは、署名した立会人の手でしか音を出せず、再生できるのも一度きりです。","cut":"P02-S08-C03"},{"start":645.0370833333334,"end":649.7408333333334,"kr":"있습니다.","jp":"ゼンマイは直りましたが、古いシリンダーは、署名した立会人の手でしか音を出せず、再生できるのも一度きりです。","cut":"P02-S08-C03"},{"start":649.7408333333334,"end":656.7370833333333,"kr":"주군은 원본과 통을 챙깁니다. 출구가 없다고 믿는 이리스 앞에서 해약의 조건을 함께 듣고, 세계를","jp":"主君は、原本と筒を携えます。出口はないと信じるイリスの前で、解約の条件を一緒に聞き、世界を終わらせる代わりに、","cut":"P02-S08-C03"},{"start":656.7370833333333,"end":663.7333333333333,"kr":"끝내는 대신 다른 길을 찾으려는 겁니다.","jp":"別の道を見つけようというのです。","cut":"P02-S08-C03"},{"start":664.5,"end":670.06,"kr":"목공소에 다시 불이 켜집니다. 흩어졌던 아이들이 마지막 작전을 위해 하나둘 돌아옵니다.","jp":"木工所に、再び明かりがともります。散り散りになっていた少女たちが、最後の作戦のために一人、","cut":"P02-GATHER-C01"},{"start":670.06,"end":675.62,"kr":"목공소에 다시 불이 켜집니다. 흩어졌던 아이들이 마지막 작전을 위해 하나둘 돌아옵니다.","jp":"また一人と戻ってきます。","cut":"P02-GATHER-C01"},{"start":675.62,"end":683.368,"kr":"네네링은 아직 상처가 낫지 않은 몸으로 병원 창문을 통해 탈출해 왔습니다. 쥬리땅도 목발을 짚고","jp":"ネネりんは、まだ傷の癒えない体で病院の窓から抜け出してきました。ジュリたんも、松葉杖をついて現れました。","cut":"P02-GATHER-C01"},{"start":683.368,"end":691.116,"kr":"나타났습니다. 아직 아픈 몸이었지만, 오늘 밤만큼은 함께하기로 한 겁니다.","jp":"まだ痛みの残る体でも、今夜だけは共にいると決めたのです。","cut":"P02-GATHER-C01"},{"start":691.875,"end":698.895,"kr":"모두가 모인 자리에서, 마지막 작전을 확인합니다. 이번 싸움의 목적은 주군과 실린더를 중심부까지","jp":"全員がそろったところで、最後の作戦を確認します。今度の戦いの目的は、主君とシリンダーを中心部まで送り届け、","cut":"P02-S09-C02"},{"start":698.895,"end":705.915,"kr":"보내, 계약을 끝낼 기회를 만드는 일입니다.","jp":"契約を終わらせる機会を作ることです。","cut":"P02-S09-C02"},{"start":706.6666666666666,"end":712.9741666666666,"kr":"도시를 가둘 결계를 설계한 것은 [조화(造花)의 마녀], 뮤게·시엘입니다.","jp":"街を閉じ込める結界を設計したのは、[造花の魔女]、ミュゲ・シエルです。","cut":"P02-MUGUET-HOME-C01"},{"start":712.9741666666666,"end":718.7124166666666,"kr":"주군에게는 고향의 치사와 같은 얼굴입니다. 이곳의 그녀는 완벽한 작품을 만들어야만 인정받는다고","jp":"主君には、故郷のチサと同じ顔に見えます。この街の彼女は、","cut":"P02-MUGUET-HOME-C01"},{"start":718.7124166666666,"end":724.4506666666666,"kr":"믿고 있었죠.","jp":"完璧な作品を作らなければ認めてもらえないと信じていました。","cut":"P02-MUGUET-HOME-C01"},{"start":725.2083333333333,"end":732.5283333333333,"kr":"이리스가 도시를 닫으려는 밤, 결계의 설계자가 마지막 공정을 보고하러 옵니다.","jp":"イリスが街を閉じようとする夜、結界の設計者が最後の工程を報告しに来ます。","cut":"P02-S09-C01-muguet-intro"},{"start":732.5283333333333,"end":738.6595833333332,"kr":"도시 전체를 감쌀 최고 걸작의 결계! 마지막 공정만 남은 것이와요. 시들지 않는 조화처럼, 영원히","jp":"街全体を包む、最高傑作の結界！ 残るは最後の工程だけですわ。枯れない造花のように、","cut":"P02-S09-C01-muguet-intro"},{"start":738.6595833333332,"end":744.7908333333332,"kr":"완벽한 무대가 되는 것이랍니다!","jp":"永遠に完璧な舞台となるのです！","cut":"P02-S09-C01-muguet-intro"},{"start":744.7908333333332,"end":751.8533333333332,"kr":"조화는 살아 있는 꽃을 본떠 만든 꽃입니다. 시들지 않지만, 스스로 피거나 더 자라지도 않습니다.","jp":"造花は、生きた花を模して作った花。枯れることはなくても、自ら咲いたり、さらに育ったりはしません。ミュゲは、","cut":"P02-S09-C01-muguet-intro"},{"start":751.8533333333332,"end":758.9158333333332,"kr":"뮤게는 그런 완성품에 자신을 겹쳐 보고 있었습니다.","jp":"そんな完成品に自分を重ねていました。","cut":"P02-S09-C01-muguet-intro"},{"start":758.9158333333332,"end":764.7033333333333,"kr":"……수고했어요, 뮤게. 정말, 훌륭한 결계예요. 이제 아이들이 가장 아름다운 순간에 멈출 수","jp":"……ご苦労さま、ミュゲ。本当に、見事な結界です。子どもたちがいちばん美しい瞬間で止まれるように、","cut":"P02-S09-C01-muguet-intro"},{"start":764.7033333333333,"end":770.4908333333333,"kr":"있도록, 완성해 주세요.","jp":"完成させてください。","cut":"P02-S09-C01-muguet-intro"},{"start":770.4908333333333,"end":779.9593333333332,"kr":"……! 다, 당연하죠. 이 몸의…… 최고 걸작이니까요. 최종 공정, 개시인 것이와요!","jp":"……！ と、当然ですわ。この身の……最高傑作ですもの。最終工程、開始ですわ！","cut":"P02-S09-C01-muguet-intro"},{"start":780.7499999999999,"end":787.1019999999999,"kr":"마침내 이리스의 거대한 결계가 완성됩니다. 하늘이 꽃잎처럼 닫히고, 사람과 거리가 강제로","jp":"ついに、イリスの巨大な結界が完成します。空が花びらのように閉じ、人も街も、","cut":"P02-S09-C01"},{"start":787.1019999999999,"end":793.4539999999998,"kr":"마침내 이리스의 거대한 결계가 완성됩니다. 하늘이 꽃잎처럼 닫히고, 사람과 거리가 강제로","jp":"無理やり満開へと追い込まれていきます。夜が明ける前に、イリスは、","cut":"P02-S09-C01"},{"start":793.4539999999998,"end":799.8059999999999,"kr":"만개합니다. 날이 밝기 전, 이리스는 가장 아름다운 순간의 도시를 통째로 꺾으려 합니다.","jp":"いちばん美しい瞬間の街を丸ごと切り落とそうとしていました。","cut":"P02-S09-C01"},{"start":800.5833333333333,"end":808.7193333333332,"kr":"전 회선, 개방. 중계는 학교 옥상— 감도 양호. …시작해요.","jp":"全回線、開放。中継は学校の屋上──感度良好。……始めます。","cut":"P02-LAUNCH-C01"},{"start":809.4999999999999,"end":817.2759999999998,"kr":"전원— 진격 개시. 대피는 계속, 길은 앞으로만. 갑니다!","jp":"全員──進撃開始。避難は続行、道は前だけです。行きます！","cut":"P02-LAUNCH-C02"},{"start":818.0416666666665,"end":822.5741666666665,"kr":"[섬화], 준비 완료! 제일 앞!","jp":"[閃華]、準備完了！いちばん前！","cut":"P02-LAUNCH-C03"},{"start":822.5741666666665,"end":827.3946666666665,"kr":"[선풍]…… 기상 완료. 마지못해.","jp":"[旋風]……起床完了。しぶしぶ。","cut":"P02-LAUNCH-C03"},{"start":828.1666666666665,"end":831.2241666666665,"kr":"[윤회]— 등불, 점화했습니다.","jp":"[輪廻]──灯、点しました。","cut":"P02-LAUNCH-C04"},{"start":831.2241666666665,"end":835.1026666666666,"kr":"[여명]…… 가, 갑니다!","jp":"[黎明]……い、行きます！","cut":"P02-LAUNCH-C04"},{"start":835.8749999999999,"end":844.5629999999999,"kr":"방벽 최종 보강 완료! 부술 거면 지금 다 부숴라— 오늘은 자재비 청구 안 한다!","jp":"防壁、最終補強完了！壊すなら今、全部壊せ──今日は資材代、請求しない！","cut":"P02-LAUNCH-C05"},{"start":845.3333333333333,"end":852.5813333333333,"kr":"동료들이 길을 열고 쿠로코가 방벽으로 지키는 동안 주군이 전진합니다.","jp":"仲間たちが道を開き、クロコが防壁で守るあいだに、主君は前へ進みます。","cut":"P02-S09-C03"},{"start":853.3333333333333,"end":858.9995833333332,"kr":"코어의 문 앞을 뮤게가 막아섭니다. 도시를 가둔 결계는, 자신이 인정받기 위해 쌓아 올린 최고","jp":"コアの扉の前に、ミュゲが立ちはだかります。街を閉じ込めた結界は、認めてもらうために積み上げた、","cut":"P02-S10-C01-muguet-gate-01"},{"start":858.9995833333332,"end":864.6658333333332,"kr":"걸작이었습니다.","jp":"彼女の最高傑作でした。","cut":"P02-S10-C01-muguet-gate-01"},{"start":864.6658333333332,"end":870.0845833333333,"kr":"여기서부터는 지나갈 수 없어요. 완벽하게, 아름답게 끝나는 것이와요! 미완성은 감점, 미완의 꽃은","jp":"ここから先は通せません。完璧に、美しく終わるのですわ！ 未完成は減点、未完の花は落第なのです！","cut":"P02-S10-C01-muguet-gate-01"},{"start":870.0845833333333,"end":875.5033333333332,"kr":"낙제랍니다!","jp":"ここから先は通せません。完璧に、美しく終わるのですわ！ 未完成は減点、未完の花は落第なのです！","cut":"P02-S10-C01-muguet-gate-01"},{"start":875.5033333333332,"end":879.1158333333333,"kr":"……채, 채점은 누가 하는데요?","jp":"……さ、採点は、誰がするんですか？","cut":"P02-S10-C01-muguet-gate-01"},{"start":879.1158333333333,"end":887.1283333333332,"kr":"그, 그야, 이리스 님이…… 세계가…… 보는 눈이 있는 모두가, 인 것이와요!","jp":"そ、それは、イリス様が……世界が……見る目のある皆さんが、ですわ！","cut":"P02-S10-C01-muguet-gate-01"},{"start":887.1283333333332,"end":897.4533333333333,"kr":"대답하는 뮤게의 손끝이 떨립니다. 남의 평가가 사라지면 자신의 가치도 사라질까 두려운 겁니다.","jp":"答えるミュゲの指先が震えます。他人の評価がなくなれば、自分の価値まで消えてしまう。それが怖いのです。","cut":"P02-S10-C01-muguet-gate-01"},{"start":897.4533333333333,"end":902.1783333333333,"kr":"이 몸은 [조화의 마녀], 시들지 않는 완성품인 것이와요!","jp":"この身は[造花の魔女]、枯れない完成品なのですわ！","cut":"P02-S10-C01-muguet-gate-01"},{"start":902.1783333333333,"end":911.2488333333333,"kr":"……와, 완성품은요. 더는, 안 자라요. 시들지 않는 대신, 피지도, 않아요.","jp":"……か、完成品は、もう、育ちません。枯れない代わりに、咲くことも、ないんです。","cut":"P02-S10-C01-muguet-gate-01"},{"start":911.9999999999999,"end":918.0162499999999,"kr":"뮤게가 두려워한 것은 미완성인 작품만이 아니었습니다. 완벽하지 않은 자신에게는 아무도 박수를","jp":"ミュゲが恐れていたのは、未完成の作品だけではありません。完璧でない自分には、誰も拍手してくれない。","cut":"P02-S10-C01-muguet-gate-02"},{"start":918.0162499999999,"end":924.0324999999999,"kr":"보내지 않을까 두려웠던 겁니다.","jp":"それが怖かったのです。","cut":"P02-S10-C01-muguet-gate-02"},{"start":924.0324999999999,"end":931.0199999999999,"kr":"저, 결계 안쪽 봤어요. 구석까지 꼼꼼하게…… 잘 만들었어요. 정말로요. 그, 그러니까 세계를","jp":"け、結界の中を見ました。隅々まで丁寧で……よくできていました。本当に。だ、だから、","cut":"P02-S10-C01-muguet-gate-02"},{"start":931.0199999999999,"end":938.0074999999999,"kr":"끝내는 데 쓰게 두고 싶지 않은 거예요.","jp":"世界を終わらせるために使わせたくないんです。","cut":"P02-S10-C01-muguet-gate-02"},{"start":938.0074999999999,"end":946.7199999999999,"kr":"……듣고 싶으신가요? 촌스럽고, 시시하고…… 아무도 박수치지 않았던, 옛날 얘기 따위를.","jp":"……聞きたいのですか？ 垢抜けなくて、つまらなくて……誰も拍手しなかった、昔の話など。","cut":"P02-S10-C01-muguet-gate-02"},{"start":946.7199999999999,"end":953.1699999999998,"kr":"드, 듣고 싶어요. 돌아와서, 그 결계 얘기도 더 듣고 싶어요. 어디가 제일 어려웠는지, 어디가","jp":"き、聞きたいです。戻ってきたら、その結界の話も、もっと。どこがいちばん難しくて、","cut":"P02-S10-C01-muguet-gate-02"},{"start":953.1699999999998,"end":959.6199999999999,"kr":"제일 자신 있는지…… 저, 전부요.","jp":"どこがいちばん自信があるのか……私、全部。","cut":"P02-S10-C01-muguet-gate-02"},{"start":959.6199999999999,"end":969.2952499999999,"kr":"당장 완벽한 작품을 보여 달라는 말이 아니었습니다. 치코링은 작품을 만든 사람의 이야기를 듣고","jp":"今すぐ完璧な作品を見せてほしい、という言葉ではありません。チコりんは、作品を作った人の話を聞きたかったのです。","cut":"P02-S10-C01-muguet-gate-02"},{"start":969.2952499999999,"end":978.9704999999999,"kr":"싶었습니다. 뮤게는 끝내 길을 비킵니다. 치코링은 열려 있는 문을 지나 코어 안으로 들어갑니다.","jp":"ミュゲは、ついに道を譲ります。チコりんは開いた扉を通り、コアの中へ入っていきます。","cut":"P02-S10-C01-muguet-gate-02"},{"start":979.7499999999999,"end":987.2974999999999,"kr":"도움을 받아 중심부에 들어선 치코링은 이번에도 무기를 들지 않습니다. 힘으로 이기면 자신도 마녀가","jp":"仲間の助けで中心部へ入ったチコりんは、今回も武器を持ちません。力で勝てば、自分も魔女になる。","cut":"P02-S10-C01"},{"start":987.2974999999999,"end":994.8449999999999,"kr":"됩니다. 이리스에게 삶을 끝낼 권리를 주지 않으려는 겁니다.","jp":"自分たちの人生を終わらせる権利を、イリスに渡さないためでした。","cut":"P02-S10-C01"},{"start":994.8449999999999,"end":1002.1199999999999,"kr":"치코링은 이리스를 향해, 사람들은 살고 싶어서 서로 도우며 도망쳤다고 말합니다.","jp":"チコりんはイリスに向かって、人々は生きたいからこそ、助け合って逃げたのだと伝えます。","cut":"P02-S10-C01"},{"start":1002.1199999999999,"end":1008.7069999999999,"kr":"이리스는 동료들이 노래도 친구도, 끝내 자기 자신까지 잊어 가던 밤을 이야기합니다. 치코링에게만은","jp":"イリスは、仲間たちが歌も友だちも、最後には自分自身さえ忘れていった夜のことを語ります。チコりんにだけは、","cut":"P02-S10-C01"},{"start":1008.7069999999999,"end":1015.2939999999999,"kr":"그런 끝을 겪게 하고 싶지 않았습니다.","jp":"あんな終わりを迎えてほしくありませんでした。","cut":"P02-S10-C01"},{"start":1016.0833333333333,"end":1021.0513333333332,"kr":"에글랑틴과 손을 잡은 끝도 소멸이었습니다.","jp":"エグランティーヌと手をつないだ先にあったのも、消滅でした。","cut":"P02-S10-C02-02"},{"start":1021.8333333333333,"end":1030.1613333333332,"kr":"이리스는 다른 출구가 없으니, 치코링에게 지금 가장 아름다운 채로 끝나기를 권합니다.","jp":"イリスは、ほかに出口はないのだから、今、いちばん美しいまま終わるよう、チコりんに勧めます。","cut":"P02-S10-C02-03"},{"start":1030.9166666666665,"end":1040.6606666666664,"kr":"치코링에게는 매일 쓴 일기가 있었습니다. 어제는 무서웠다고만 적었지만, 오늘은 여전히 무서워도","jp":"チコりんには、毎日書いてきた日記がありました。昨日は、怖かったとだけ書きました。でも今日は、","cut":"P02-S11-C01"},{"start":1040.6606666666664,"end":1050.4046666666666,"kr":"발이 조금 빨리 나갔다고 썼죠. 어제 겪은 일을 딛고, 오늘은 달라진 겁니다.","jp":"相変わらず怖くても、少し早く足を踏み出せたと書いたのです。昨日の経験を足場にして、今日は変われたのです。","cut":"P02-S11-C01"},{"start":1051.1666666666665,"end":1057.4306666666664,"kr":"에글랑틴이 남긴 손잡는 법도 치코링 안에 남았습니다.","jp":"エグランティーヌが残した、手のつなぎ方も、チコりんの中に残っています。","cut":"P02-S11-C02"},{"start":1058.2083333333333,"end":1063.9783333333332,"kr":"정점이 지났다고 삶까지 끝난 건 아니었습니다.","jp":"頂点を過ぎたからといって、人生まで終わったわけではありませんでした。","cut":"P02-S11-C02-03"},{"start":1063.9783333333332,"end":1069.4883333333332,"kr":"그러니까, 무서워도— 나는, 내일의 나를 보고 싶어요!","jp":"だから、こわくても——私は、明日の私に会ってみたいんです！","cut":"P02-S11-C02-03"},{"start":1070.25,"end":1073.802,"kr":"닫히던 꽃잎이 멎습니다.","jp":"閉じかけていた花びらが、止まります。","cut":"P02-S11-C02-03-petals-stop"},{"start":1074.5833333333333,"end":1081.7713333333334,"kr":"이리스는 문득, 마지막까지 다음 봄을 이야기했던 동료들을 떠올립니다. 강한 척하는 말이라고","jp":"イリスはふと、最後まで次の春の話をしていた仲間たちを思い出します。強がりだと思っていました。けれど彼女たちも、","cut":"P02-S11-C03-02"},{"start":1081.7713333333334,"end":1088.9593333333332,"kr":"여겼지만, 그들도 정말 내일을 보고 싶었던 건지 모릅니다.","jp":"本当に明日を見たかったのかもしれません。","cut":"P02-S11-C03-02"},{"start":1089.75,"end":1099.145,"kr":"그 틈에 주군이 실린더를 꺼내 태엽을 감습니다. 오래된 목소리가 해약 조항을 읽습니다.","jp":"その隙に、主君がシリンダーを取り出し、ゼンマイを巻きます。古い声が、解約条項を読み上げます。","cut":"P02-S12-C01"},{"start":1099.145,"end":1103.574,"kr":"『——조항, 마지막. 해지에 관하여.』","jp":"『──条項、最後。解約について。』","cut":"P02-S12-C01"},{"start":1104.3333333333333,"end":1110.9158333333332,"kr":"……해, 해지……. 이, 있었어요……. 정말로, 있었어…….","jp":"……か、解約……。あ、あったんですね……。本当に、あったんだ……。","cut":"P02-S12-C01-02"},{"start":1110.9158333333332,"end":1115.3533333333332,"kr":"그래. 한 글자도, 놓치지 마라.","jp":"そうだ。一文字も、聞き逃すな。","cut":"P02-S12-C01-02"},{"start":1116.125,"end":1123.781,"kr":"실린더는 '입회인'이 계약을 파기할 수 있다고 말합니다. 계약이 파기되면 마법소녀들에게서 힘이","jp":"シリンダーは、『立会人』が契約を破棄できると語ります。契約が破棄されれば、魔法少女たちから力が抜け、","cut":"P02-S12-C02"},{"start":1123.781,"end":1131.437,"kr":"빠져나와 씨앗의 상태로 돌아갑니다. 그런데, 그와 함께 소녀들은 기억을 잃는다고 하죠. 시들어야","jp":"シリンダーは、『立会人』が契約を破棄できると語ります。契約が破棄されれば、魔法少女たちから力が抜け、","cut":"P02-S12-C02"},{"start":1131.437,"end":1139.093,"kr":"하는 운명에서의 탈출이지만, 어쩌면, 영혼을 회수해가는 소멸에 가까울지도 모릅니다. 게다가 조건이","jp":"種の状態へ戻ります。しかし、それと同時に少女たちは記憶を失うというのです。枯れなければならない運命からの脱出。","cut":"P02-S12-C02"},{"start":1139.093,"end":1146.749,"kr":"있었습니다.","jp":"けれどそれは、もしかすると魂を回収される消滅に近いのかもしれません。しかも、条件がありました。","cut":"P02-S12-C02"},{"start":1147.5,"end":1153.2225,"kr":"실린더의 목소리가 멎고 공간이 고요해졌습니다. 와카도 타마도 백 년 만에 돌아온 말 앞에서는","jp":"シリンダーの声が止まり、その場は静まり返りました。ワカもタマも、百年ぶりに戻ってきた言葉の前で、","cut":"P02-S12-C04"},{"start":1153.2225,"end":1158.945,"kr":"숙연해졌습니다.","jp":"厳粛な表情になります。","cut":"P02-S12-C04"},{"start":1158.945,"end":1167.67,"kr":"한편, 이리스는 본인이 만개하던 마지막 밤까지 붙잡고 있었던 실린더에서 눈을 떼지 못합니다.","jp":"一方、イリスは、自分が満開になったあの最後の夜まで握りしめていたシリンダーから、目を離せません。","cut":"P02-S12-C04"},{"start":1167.67,"end":1174.795,"kr":"밤새 태엽을 감으며 그토록 알려 달라 빌었던 출구를 마침내 듣게 되자,","jp":"夜通しゼンマイを巻き、どうか教えてほしいと願い続けた出口を、ついに知ったとき、","cut":"P02-S12-C04"},{"start":1174.795,"end":1180.524,"kr":"그 한 소절만 들었더라면 자르지 않아도 됐을 소녀들의 얼굴이 떠올라","jp":"あの一節さえ聞けていれば、切らずに済んだ少女たちの顔が浮かび、","cut":"P02-S12-C04"},{"start":1181.2916666666667,"end":1185.4916666666668,"kr":"칼날처럼 얇게 웃고 말았죠.","jp":"イリスは、刃のように薄く笑ってしまいました。","cut":"P02-S12-C05-03"},{"start":1186.25,"end":1194.29,"kr":"그때 결계 바깥에서 하늘이 접히고, [비탄의 마녀] 라르므가 내려옵니다. 실린더 속 목소리의","jp":"そのとき、結界の外で空が折り畳まれ、[悲嘆の魔女]ラルムが降りてきます。シリンダーの声の主であり、","cut":"P02-S13-C01"},{"start":1194.29,"end":1202.33,"kr":"주인이자 최초의 입회인, 소원에 힘과 대가를 주는 규칙을 쓴 사람이었습니다.","jp":"最初の立会人。願いに力と代価を与えるルールを書いた人物でした。","cut":"P02-S13-C01"},{"start":1203.0833333333333,"end":1208.0283333333332,"kr":"라르므는 마지막 줄을 찢은 이유를 털어놓았습니다.","jp":"ラルムは、最後の一行を破った理由を打ち明けます。","cut":"P02-S13-C02"},{"start":1208.0283333333332,"end":1215.7720833333333,"kr":"네. 해지는 잔인해요. 아이들은 힘을 잃고, 나를 잊고, 떠나요. …그래서 찢었어요. 떠날 문이","jp":"ええ。解約は残酷です。子どもたちは力を失って、私を忘れて、去っていく。…だから破りました。","cut":"P02-S13-C02"},{"start":1215.7720833333333,"end":1223.5158333333331,"kr":"없으면— 아무도, 떠나지 않으니까.","jp":"去るための扉がなければ──誰も、去りはしないから。","cut":"P02-S13-C02"},{"start":1223.5158333333331,"end":1229.0145833333333,"kr":"……그 탓에, 백 년이다. 출구 없는 정원에서— 얼마나 많은 아이가 시들고, 얼마나 많은 마녀가","jp":"……そのせいで、百年だ。出口のない庭で——どれほどの子が枯れ、どれほどの魔女が生まれたか。わかっているのか。","cut":"P02-S13-C02"},{"start":1229.0145833333333,"end":1234.5133333333333,"kr":"태어났는지. 알고는 있나.","jp":"……そのせいで、百年だ。出口のない庭で——どれほどの子が枯れ、どれほどの魔女が生まれたか。わかっているのか。","cut":"P02-S13-C02"},{"start":1235.2916666666665,"end":1241.0516666666665,"kr":"라르므는 검은 구슬에 시든 아이들의 씨앗까지 가두고 있었습니다. 다시 피면 다시 아플까 봐 영원히","jp":"ラルムは、枯れた子どもたちの種まで、黒い珠に閉じ込めていました。また咲けばまた傷つくのではないかと、","cut":"P02-S13-C03"},{"start":1241.0516666666665,"end":1246.8116666666665,"kr":"재운 겁니다.","jp":"永遠に眠らせていたのです。","cut":"P02-S13-C03"},{"start":1246.8116666666665,"end":1256.5676666666666,"kr":"알아요. 전부, 세고 있었어요. …한 송이도, 빠짐없이. 그래서 거두는 거예요. 시들어 간","jp":"知っています。全部、数えていました。…一輪も、残さず。だから摘み取るのです。枯れていった子を…。種は危険です。","cut":"P02-S13-C03"},{"start":1256.5676666666666,"end":1266.3236666666664,"kr":"아이를... 씨앗은 위험해요. 다시 피면, 다시 시들어요. 그러니 여기서— 내 곁에서, 영원히","jp":"また咲けば、また枯れる。だからここで——私のそばで、永遠に眠らせるの。……眠っていれば、痛くない。","cut":"P02-S13-C03"},{"start":1266.3236666666664,"end":1276.0796666666665,"kr":"잠들게 해요. ……잠들어 있으면, 아프지 않아요. 무섭지도 않아요. 시들지도, 잊혀지지도 않아요.","jp":"こわくもない。枯れも、忘れられもしない。…それより良いことが、ありますか？ だから、一緒に眠りましょう。","cut":"P02-S13-C03"},{"start":1276.0796666666665,"end":1285.8356666666666,"kr":"…그보다 좋은 게, 있나요? 그러니까, 같이 잠들어요. 다 같이. 아무도, 잃지 않는 곳에서.","jp":"みんなで。誰も、失わない場所で。","cut":"P02-S13-C03"},{"start":1286.6249999999998,"end":1293.6899999999998,"kr":"라르므가 공간을 접어 일행을 짓누릅니다. 히땅의 폭풍 전력도, 네네링의 가장 밝은 섬광도 공간과","jp":"ラルムが空間を折り畳み、一行を押し潰します。ひーたんの全力の嵐も、ネネりんの最も明るい閃光も、","cut":"P02-S14-C01"},{"start":1293.6899999999998,"end":1300.7549999999999,"kr":"함께 접혀버릴 뿐이었습니다. 레오나가 전력을 다 해 불꽃으로 내려앉는 하늘을 막아서자, 이리스가","jp":"空間ごと折り畳まれるだけでした。レオナが全力の炎で落ちてくる空を受け止めると、","cut":"P02-S14-C01"},{"start":1300.7549999999999,"end":1307.8199999999997,"kr":"소녀들의 곁에서 꽃잎으로 버팁니다.","jp":"イリスも少女たちのそばで花びらを広げ、支えます。","cut":"P02-S14-C01"},{"start":1307.8199999999997,"end":1311.6449999999998,"kr":"………내 정원의 아이들에게, 손대지 마세요.","jp":"………私の庭の子たちに、手を出さないで。","cut":"P02-S14-C01"},{"start":1311.6449999999998,"end":1313.0449999999998,"kr":"……! 당신—","jp":"……！ あなた——","cut":"P02-S14-C01"},{"start":1313.0449999999998,"end":1322.2949999999998,"kr":"……절화의 아이. 당신이, 왜. …당신이 제일 잘 알잖아요. 시드는 게, 얼마나…….","jp":"……切花の子。あなたが、なぜ。…あなたが一番わかっているでしょう。枯れるのが、どれほど……。","cut":"P02-S14-C01"},{"start":1322.2949999999998,"end":1328.495,"kr":"네, 알아요. 알다 못해— 잘라 왔어요. 그래서 알아요. 당신의 그 손이— 옛날의 나와, 같은","jp":"ええ、知っています。知るだけでなく——切ってきました。だからわかるの。あなたのその手が——昔の私と、","cut":"P02-S14-C01"},{"start":1328.495,"end":1334.6949999999997,"kr":"손이라는 걸.","jp":"同じ手だということを。","cut":"P02-S14-C01"},{"start":1334.6949999999997,"end":1342.4699999999998,"kr":"두려워서 아이들의 시간을 멈추는 손이 소녀들의 내일을 빼앗고 있다는 것을 깨달은 겁니다. 이제","jp":"こわくて子どもたちの時間を止める手が、少女たちの明日を奪っている。そのことに気づいたのです。","cut":"P02-S14-C01"},{"start":1342.4699999999998,"end":1350.245,"kr":"아이들의 끝을 대신 정하는 계획을 거두고, 소녀들이 결정한 내일을 지킵니다.","jp":"もう子どもたちの終わりを代わりに決める計画を捨て、少女たちが決めた明日を守ります。","cut":"P02-S14-C01"},{"start":1350.245,"end":1354.995,"kr":"……하. 마녀랑 등을 맞대는 날이 올 줄이야.","jp":"……はっ。魔女と背中を預け合う日が来るとはね。","cut":"P02-S14-C01"},{"start":1354.995,"end":1361.0969999999998,"kr":"후후. …아이들을 지키는 데에, 편 가르기는 촌스럽죠.","jp":"ふふ。…子どもを守るのに、敵味方で分けるなんて野暮でしょう。","cut":"P02-S14-C01"},{"start":1361.8749999999998,"end":1367.1849999999997,"kr":"그때, 레오나는 전력으로 뿜어낸 불꽃으로 인해 만개에 이르러 몸이 눈부시게 피어납니다. 이대로면","jp":"その時、レオナは全力で噴き出した炎によって満開に至り、その身がまばゆく咲き始めます。","cut":"P02-S14-C03"},{"start":1367.1849999999997,"end":1372.4949999999997,"kr":"마녀가 됩니다.","jp":"このままでは魔女になります。","cut":"P02-S14-C03"},{"start":1372.4949999999997,"end":1377.3074999999997,"kr":"레오나 씨——!! 안 돼, 피지 마, 피지 마아——!!","jp":"レオナさん——！！ だめ、咲かないで、咲かないでぇ——！！","cut":"P02-S14-C03"},{"start":1377.3074999999997,"end":1381.6199999999997,"kr":"주군은 소녀들에게 힘을 놓으라 소리칩니다.","jp":"主君は少女たちに力を手放せと叫びます。","cut":"P02-S14-C03"},{"start":1381.6199999999997,"end":1389.1639999999998,"kr":"전원— 들어라! 파기는 너희가 힘을 '놓아야' 성립한다!","jp":"全員——聞け！ 破棄は、お前たちが力を『手放して』初めて成立する！","cut":"P02-S14-C03"},{"start":1389.9166666666665,"end":1396.1991666666665,"kr":"라르므는 놓으면 이 밤도 서로도 잊을 거라고 경고합니다.","jp":"ラルムは、手放せばこの夜も、お互いのことも忘れると警告します。","cut":"P02-S14-C04"},{"start":1396.1991666666665,"end":1404.4096666666665,"kr":"안 돼요. 놓으면— 놓으면, 전부 끝나 버려요……!! 놓으면…… 잊어버려요. 이 밤도, 서로도……","jp":"だめ。手放したら——手放したら、全部終わってしまう……！！ 手放せば……忘れてしまう。この夜も、","cut":"P02-S14-C04"},{"start":1404.4096666666665,"end":1412.6201666666666,"kr":"전부, 처음부터 없던 것처럼……. 그래도, 좋다는 건가요…….","jp":"お互いも……全部、初めからなかったように……。それでも、いいというの……。","cut":"P02-S14-C04"},{"start":1413.3749999999998,"end":1421.9909999999998,"kr":"능력과 함께, 구하고 울고 웃은 시간까지 전부, 처음부터 없던 것처럼 잃게 될 거라면서요.","jp":"能力とともに、救い、泣き、笑った時間まで全部、初めからなかったかのように失うことになるんですよね。","cut":"P02-S14-C04-02"},{"start":1422.7499999999998,"end":1427.7449999999997,"kr":"그 선택은 어른이 대신할 수 없었습니다.","jp":"その選択を、大人が代わりに決めることはできませんでした。","cut":"P02-S14-C04-03"},{"start":1427.7449999999997,"end":1434.0779999999997,"kr":"그래도— 정해라, 너희가. 꽃의 규칙이 아니라, 너희 자신이!","jp":"それでも——決めろ、お前たちが。花の掟じゃない、お前自身が！","cut":"P02-S14-C04-03"},{"start":1434.833333333333,"end":1442.003333333333,"kr":"하지만 치코링이 소녀들의 이름을 적은 일기장을 가슴에 꼭 안으며 말합니다.","jp":"しかしチコりんは、少女たちの名前を書き留めた日記帳を胸にぎゅっと抱きしめて言います。","cut":"P02-S14-C05"},{"start":1442.003333333333,"end":1449.978333333333,"kr":"이 일기에, 다 적어 놨어요. 오늘 밤도 꼭, 적을 거예요. 그러니까…… 무섭지, 않아요.","jp":"この日記に、全部書いてあります。今夜も必ず、書きます。だから……こわく、ありません。…私たちは、種ですから。","cut":"P02-S14-C05"},{"start":1449.978333333333,"end":1457.953333333333,"kr":"…저희는, 씨앗이니까요. 놓아도, 다시 피니까요!","jp":"手放しても、また咲きますから！","cut":"P02-S14-C05"},{"start":1457.953333333333,"end":1465.290833333333,"kr":"자기 이름 하나를 말하는 데도 세 번을 걸리던 치코링이 한 번도 더듬지 않았죠.","jp":"自分の名前ひとつ言うのにも三度かかっていたチコりんが、一度も言葉に詰まりませんでした。","cut":"P02-S14-C05"},{"start":1465.290833333333,"end":1471.059583333333,"kr":"……하암. …마지막까지, 좋은 바람이었어. ……처음으로 진심을 다했으니까. 미련, 없음. —","jp":"……ふあぁ。…最後まで、いい風だった。……初めて、本気を出せたから。未練、なし。——手放す。","cut":"P02-S14-C05"},{"start":1471.059583333333,"end":1476.828333333333,"kr":"놓을게.","jp":"……ふあぁ。…最後まで、いい風だった。……初めて、本気を出せたから。未練、なし。——手放す。","cut":"P02-S14-C05"},{"start":1476.828333333333,"end":1486.240833333333,"kr":"에잇, 이 몸답지 않아! 제일 밝게 터졌다! 다들 봤지?! 그럼— 됐어!!","jp":"ええい、この私らしくない！ 一番明るく弾けた！ みんな見たでしょ？！ なら——それでいい！！","cut":"P02-S14-C05"},{"start":1486.240833333333,"end":1494.828333333333,"kr":"설령 잊게 되더라도— 있었던 밤이, 없던 밤이 되지는 않아요. 힘은— 돌려드릴게요.","jp":"たとえ忘れてしまっても——あった夜が、なかった夜になるわけではありません。力は——お返しします。","cut":"P02-S14-C05"},{"start":1494.828333333333,"end":1501.898333333333,"kr":"이번에는, 아무도 잃지 않았어. 그러니까— 나도, 이제…… 놓을게……!","jp":"今度は、誰も失わなかった。だから——私も、もう……手放す……！","cut":"P02-S14-C05"},{"start":1502.6666666666663,"end":1506.3241666666663,"kr":"치코링이 새벽빛을 놓습니다.","jp":"チコりんが暁の光を手放します。","cut":"P02-S14-C05-02"},{"start":1506.3241666666663,"end":1511.3491666666662,"kr":"히땅의 바람이 잦아들고, 네네링의 섬광도 사그라듭니다.","jp":"ヒーたんの風が静まり、ネネりんの閃光も消えていきます。","cut":"P02-S14-C05-02"},{"start":1511.3491666666662,"end":1516.0616666666663,"kr":"엔마루의 손을 떠난 윤회 고리가 빛을 잃습니다.","jp":"エンマルの手を離れた輪廻の輪が、光を失います。","cut":"P02-S14-C05-02"},{"start":1516.0616666666663,"end":1522.0116666666663,"kr":"그 시각, 목공소에 남은 쥬리땅도 마지막 유성을 거둡니다.","jp":"その頃、木工所に残ったジュリたんも、最後の流星を収めます。","cut":"P02-S14-C05-02"},{"start":1522.0116666666663,"end":1528.3866666666663,"kr":"박수가 끝나도, 나는 나니까. 이 힘도— 놓을게.","jp":"拍手が終わっても、私は私だから。この力も——手放すよ。","cut":"P02-S14-C05-02"},{"start":1528.3866666666663,"end":1533.6991666666663,"kr":"레오나가 불꽃을 거두자, 마법소녀 여섯 명 모두 스스로 힘을 내려놓았습니다. 치코링은 코어 입구를","jp":"レオナが炎を収めると、六人の魔法少女全員が自ら力を手放しました。チコりんはコアの入口を振り返ります。","cut":"P02-S14-C05-02"},{"start":1533.6991666666663,"end":1539.0116666666663,"kr":"돌아봅니다.","jp":"レオナが炎を収めると、六人の魔法少女全員が自ら力を手放しました。チコりんはコアの入口を振り返ります。","cut":"P02-S14-C05-02"},{"start":1539.0116666666663,"end":1541.2116666666664,"kr":"뮤, 뮤게 씨……!","jp":"ミュ、ミュゲさん……！","cut":"P02-S14-C05-02"},{"start":1541.2116666666664,"end":1546.7929166666663,"kr":"……보고 있는 것이와요. 말 걸지 않는 것이와요. …지금 이 몸은— 아주 중요한 걸, 놓는","jp":"……見ているのでございます。話しかけないでほしいのでございます。……今、この身は——とても大切なものを、","cut":"P02-S14-C05-02"},{"start":1546.7929166666663,"end":1552.3741666666663,"kr":"중이니까.","jp":"手放しているのですから。","cut":"P02-S14-C05-02"},{"start":1552.3741666666663,"end":1557.8121666666664,"kr":"마침내 조화의 마녀 뮤게까지— 스스로의 힘을 놓았죠.","jp":"ついに、造花の魔女ミュゲまで——自らの力を手放したのです。","cut":"P02-S14-C05-02"},{"start":1558.583333333333,"end":1564.290833333333,"kr":"입회인 권한으로. 이 계약을, 파기한다!!","jp":"立会人の権限において。この契約を、破棄する！！","cut":"P02-S15-C01"},{"start":1564.290833333333,"end":1565.903333333333,"kr":"— 접수.","jp":"——受理。","cut":"P02-S15-C01"},{"start":1565.903333333333,"end":1572.565833333333,"kr":"공통 원본이 찢어지자, 그 원본에 묶인 계약들이 함께 끝납니다.","jp":"共通原本が破られると、その原本に結ばれていた契約も共に終わります。","cut":"P02-S15-C01"},{"start":1572.565833333333,"end":1579.140833333333,"kr":"………어라. ……가벼워. 아아—— …이렇게, 놓는 거였구나.","jp":"………あら。……軽い。ああ——…こうやって、手放すものだったのね。","cut":"P02-S15-C01"},{"start":1579.140833333333,"end":1585.620833333333,"kr":"비탄의 마녀, 라르므도 자신이 지은 시스템과 함께 풀려 소멸합니다.","jp":"悲嘆の魔女ラルムも、自ら築いた仕組みとともにほどけ、消滅します。","cut":"P02-S15-C01"},{"start":1599.3749999999998,"end":1604.6789999999999,"kr":"소녀들은 평범한 옷으로 진짜 밤하늘을 올려다봅니다.","jp":"少女たちは普段着に戻り、本当の夜空を見上げます。","cut":"P02-S15-C03-02"},{"start":1605.458333333333,"end":1608.740833333333,"kr":"하지만 이리스도 흩어집니다.","jp":"けれど、イリスも散っていきます。","cut":"P02-S16-C01"},{"start":1608.740833333333,"end":1616.135583333333,"kr":"치코가 붙잡아도 이리스는 고개를 젓습니다. 무서움은 자신이 해 온 일의 변명이 될 수 없다고요.","jp":"チコが引き止めても、イリスは首を振ります。怖かったということは、自分のしてきたことの言い訳にはならない、と。","cut":"P02-S16-C01"},{"start":1616.135583333333,"end":1623.530333333333,"kr":"정원을 다시 만들자는 치코에게 부탁을 남깁니다.","jp":"もう一度庭を作ろうというチコに、頼みを残します。","cut":"P02-S16-C01"},{"start":1624.2916666666663,"end":1633.0996666666663,"kr":"……그럼, 다음 정원은— 문이 있는 정원으로 해 줘요. 들어오는 문과…… 나가는 문이, 있는.","jp":"……じゃあ、次の庭は──扉のある庭にしてください。入る扉と……出ていく扉が、ある庭に。","cut":"P02-S16-C02-02"},{"start":1633.8749999999995,"end":1639.3949999999995,"kr":"아이들이 다시 피기를 바라며, 이리스도 소멸합니다.","jp":"子どもたちがまた咲くことを願いながら、イリスもまた消えていきます。","cut":"P02-S16-C03"},{"start":1640.1666666666663,"end":1645.0746666666662,"kr":"살아남은 아이들에게도 대가가 찾아옵니다. 레오나는 치코의 이름이 떠오르지 않고, 히스이는 왜","jp":"生き残った子どもたちにも、代価が訪れます。レオナはチコの名を思い出せず、","cut":"P02-S17-C01"},{"start":1645.0746666666662,"end":1649.9826666666663,"kr":"우는지 모릅니다.","jp":"ヒスイはなぜ泣いているのかわかりません。","cut":"P02-S17-C01"},{"start":1650.7499999999995,"end":1654.4219999999996,"kr":"함께 싸운 밤들이 지워집니다.","jp":"ともに戦った夜が、消えていきます。","cut":"P02-S17-C01-02"},{"start":1655.2083333333328,"end":1663.0323333333329,"kr":"치코는 작은 일기장을 끌어안고, 잊기 전에 이름들을 적으려 합니다. 몇 번이나 연필을 떨어뜨리지만","jp":"チコは小さな日記帳を抱きしめ、忘れる前に名前を書き留めようとします。何度も鉛筆を落としながら、","cut":"P02-S17-C02"},{"start":1663.0323333333329,"end":1670.8563333333327,"kr":"다시 주워, 떠오르지 않는 이름의 자리에는 고맙다는 말이라도 남깁니다.","jp":"そのたびに拾い上げ、思い出せない名前の場所には、せめて、ありがとうと残します。","cut":"P02-S17-C02"},{"start":1671.6249999999995,"end":1676.8329999999996,"kr":"주군의 시야도 하얗게 바래고, 마침내 눈을 뜹니다.","jp":"主君の視界も白く薄れていき、やがて目を覚まします。","cut":"P02-S17-C03"}],"scenes":[{"id":"P02-S00","title":"하이라이트 · 이기지 않는 싸움","start":0.0,"end":29.5,"file":"scenes/P02-S00.mp4","audio":{"kr":"scenes/P02-S00_kr.m4a","jp":"scenes/P02-S00_jp.m4a"}},{"id":"P02-S01","title":"오늘 밤을 지키는 치코링","start":29.5,"end":61.833333333333336,"file":"scenes/P02-S01.mp4","audio":{"kr":"scenes/P02-S01_kr.m4a","jp":"scenes/P02-S01_jp.m4a"}},{"id":"P02-S02","title":"아이들이 돌아올 길을 찾는 주군","start":61.833333333333336,"end":76.58333333333334,"file":"scenes/P02-S02.mp4","audio":{"kr":"scenes/P02-S02_kr.m4a","jp":"scenes/P02-S02_jp.m4a"}},{"id":"P02-S03","title":"세나가 기억하는 동료","start":76.58333333333334,"end":152.375,"file":"scenes/P02-S03.mp4","audio":{"kr":"scenes/P02-S03_kr.m4a","jp":"scenes/P02-S03_jp.m4a"}},{"id":"P02-S04","title":"이기지 않을 방법","start":152.375,"end":218.54166666666669,"file":"scenes/P02-S04.mp4","audio":{"kr":"scenes/P02-S04_kr.m4a","jp":"scenes/P02-S04_jp.m4a"}},{"id":"P02-S05","title":"무기를 내리고 성당으로","start":218.54166666666669,"end":307.58333333333337,"file":"scenes/P02-S05.mp4","audio":{"kr":"scenes/P02-S05_kr.m4a","jp":"scenes/P02-S05_jp.m4a"}},{"id":"P02-S06","title":"에글랑틴의 작별과 벨의 마지막 방송","start":307.58333333333337,"end":489.5,"file":"scenes/P02-S06.mp4","audio":{"kr":"scenes/P02-S06_kr.m4a","jp":"scenes/P02-S06_jp.m4a"}},{"id":"P02-S07","title":"입회인이 요구한 계약서 전문","start":489.5,"end":538.875,"file":"scenes/P02-S07.mp4","audio":{"kr":"scenes/P02-S07_kr.m4a","jp":"scenes/P02-S07_jp.m4a"}},{"id":"P02-S08","title":"황혼빛 아이가 남긴 단서","start":538.875,"end":582.0416666666666,"file":"scenes/P02-S08.mp4","audio":{"kr":"scenes/P02-S08_kr.m4a","jp":"scenes/P02-S08_jp.m4a"}},{"id":"P02-S09","title":"골동품상에 남은 목소리","start":582.0416666666666,"end":609.125,"file":"scenes/P02-S09.mp4","audio":{"kr":"scenes/P02-S09_kr.m4a","jp":"scenes/P02-S09_jp.m4a"}},{"id":"P02-S10","title":"수리된 실린더와 도시의 원본","start":609.125,"end":664.25,"file":"scenes/P02-S10.mp4","audio":{"kr":"scenes/P02-S10_kr.m4a","jp":"scenes/P02-S10_jp.m4a"}},{"id":"P02-S11","title":"목공소에 다시 모인 아이들과 마지막 작전","start":664.25,"end":706.4166666666666,"file":"scenes/P02-S11.mp4","audio":{"kr":"scenes/P02-S11_kr.m4a","jp":"scenes/P02-S11_jp.m4a"}},{"id":"P02-S12","title":"도시를 닫는 이리스의 꽃","start":706.4166666666666,"end":800.3333333333333,"file":"scenes/P02-S12.mp4","audio":{"kr":"scenes/P02-S12_kr.m4a","jp":"scenes/P02-S12_jp.m4a"}},{"id":"P02-S13","title":"전 회선 개방 · 총력전의 시작","start":800.3333333333333,"end":853.0833333333333,"file":"scenes/P02-S13.mp4","audio":{"kr":"scenes/P02-S13_kr.m4a","jp":"scenes/P02-S13_jp.m4a"}},{"id":"P02-S15","title":"코어의 문을 넘어 이리스에게","start":853.0833333333333,"end":1030.6666666666665,"file":"scenes/P02-S15.mp4","audio":{"kr":"scenes/P02-S15_kr.m4a","jp":"scenes/P02-S15_jp.m4a"}},{"id":"P02-S16","title":"치코가 기억하는 어제와 오늘","start":1030.6666666666665,"end":1057.9583333333333,"file":"scenes/P02-S16.mp4","audio":{"kr":"scenes/P02-S16_kr.m4a","jp":"scenes/P02-S16_jp.m4a"}},{"id":"P02-S18","title":"내일의 나를 보고 싶다","start":1057.9583333333333,"end":1089.5,"file":"scenes/P02-S18.mp4","audio":{"kr":"scenes/P02-S18_kr.m4a","jp":"scenes/P02-S18_jp.m4a"}},{"id":"P02-S19","title":"되찾은 해약 조항","start":1089.5,"end":1186.0,"file":"scenes/P02-S19.mp4","audio":{"kr":"scenes/P02-S19_kr.m4a","jp":"scenes/P02-S19_jp.m4a"}},{"id":"P02-S20","title":"마지막 줄을 찢은 라르므","start":1186.0,"end":1286.3749999999998,"file":"scenes/P02-S20.mp4","audio":{"kr":"scenes/P02-S20_kr.m4a","jp":"scenes/P02-S20_jp.m4a"}},{"id":"P02-S21","title":"함께 버티며 힘을 놓기로 하다","start":1286.3749999999998,"end":1434.583333333333,"file":"scenes/P02-S21.mp4","audio":{"kr":"scenes/P02-S21_kr.m4a","jp":"scenes/P02-S21_jp.m4a"}},{"id":"P02-S22","title":"도시 곳곳에서 펼쳐지는 손","start":1434.583333333333,"end":1502.4166666666663,"file":"scenes/P02-S22.mp4","audio":{"kr":"scenes/P02-S22_kr.m4a","jp":"scenes/P02-S22_jp.m4a"}},{"id":"P02-S23","title":"소녀들과 뮤게가 놓는 것","start":1502.4166666666663,"end":1558.333333333333,"file":"scenes/P02-S23.mp4","audio":{"kr":"scenes/P02-S23_kr.m4a","jp":"scenes/P02-S23_jp.m4a"}},{"id":"P02-S24","title":"공통 원본의 파기","start":1558.333333333333,"end":1599.1249999999998,"file":"scenes/P02-S24.mp4","audio":{"kr":"scenes/P02-S24_kr.m4a","jp":"scenes/P02-S24_jp.m4a"}},{"id":"P02-S25","title":"진짜 밤하늘이 열린 도시","start":1599.1249999999998,"end":1605.208333333333,"file":"scenes/P02-S25.mp4","audio":{"kr":"scenes/P02-S25_kr.m4a","jp":"scenes/P02-S25_jp.m4a"}},{"id":"P02-S26","title":"문이 있는 정원","start":1605.208333333333,"end":1639.9166666666663,"file":"scenes/P02-S26.mp4","audio":{"kr":"scenes/P02-S26_kr.m4a","jp":"scenes/P02-S26_jp.m4a"}},{"id":"P02-S27","title":"잊기 전에 남기는 기록","start":1639.9166666666663,"end":1677.3333333333328,"file":"scenes/P02-S27.mp4","audio":{"kr":"scenes/P02-S27_kr.m4a","jp":"scenes/P02-S27_jp.m4a"}}]}</script><script>
const data=JSON.parse(document.getElementById('timeline').textContent),SC=data.scenes,video=document.getElementById('video'),cuts=document.getElementById('cuts');
let loadToken=0,currentIndex=-1,si=0,lang='kr',muted=false;
try{const v=localStorage.getItem('nnsLang');if(v==='kr'||v==='jp')lang=v;}catch(e){}
const A={kr:new Audio(),jp:new Audio()};for(const a of Object.values(A)){a.preload='auto';}
const cur=()=>A[lang];
const gtime=()=>SC[si].start+(video.currentTime||0);
const clock=t=>Math.floor(t/60)+':'+Math.floor(t%60).toString().padStart(2,'0');
function syncAudio(force){const a=cur();if(!a.src)return;if(a.readyState<1){if(!a._wait){a._wait=1;a.addEventListener('loadedmetadata',()=>{a._wait=0;syncAudio(true);},{once:true});}return;}const want=video.currentTime;if(force||Math.abs(a.currentTime-want)>.15){try{a.currentTime=want;}catch(e){}}a.playbackRate=video.playbackRate;a.muted=muted;
 for(const [k,o] of Object.entries(A))if(k!==lang&&!o.paused)o.pause();
 if(!video.paused&&!video.ended&&a.paused)a.play().catch(()=>{});if((video.paused||video.ended)&&!a.paused)a.pause();}
function load(i,t,play){const token=++loadToken;const want=play??!video.paused;si=i;video.src=SC[i].file;for(const k in A){A[k].src=SC[i].audio[k];A[k].load();}
 video.addEventListener('loadedmetadata',function f(){video.removeEventListener('loadedmetadata',f);if(token!==loadToken)return;video.currentTime=Math.max(0,t);video.playbackRate=Number(document.getElementById('speed').value);syncAudio(true);if(want)play_();update();});video.load();}
function play_(){video.play().catch(()=>{});const a=cur();try{a.currentTime=video.currentTime;}catch(e){}a.play().catch(()=>{});}
function seek(T){let i=SC.findIndex(x=>T>=x.start&&T<x.end);if(i<0)i=T<SC[0].start?0:SC.length-1;if(i===si&&video.readyState>0){video.currentTime=Math.max(0,T-SC[i].start);syncAudio(true);}else load(i,T-SC[i].start);}
data.cuts.forEach((c,i)=>{const b=document.createElement('button');b.dataset.index=i;b.innerHTML='<small>'+c.displayId+'</small><small>'+clock(c.start+data.lead)+'</small><span class="title"></span>';b.querySelector('.title').textContent=c.title;b.onclick=()=>{seek(c.start+data.lead+.02);update();};cuts.append(b)});
function update(){const time=gtime()-data.lead;currentIndex=data.cuts.findIndex(c=>time>=c.start&&time<c.end);for(const b of cuts.children){const active=Number(b.dataset.index)===currentIndex;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')};const c=data.cuts[currentIndex];document.getElementById('current').textContent=c?c.displayId+' · '+c.title:gtime()<data.lead?'第2部':'エピローグへ';const q=c?.cues.filter(q=>q.scheduledTime<=time).at(-1);document.getElementById('cueInfo').textContent=q?'동작 '+q.step+' · '+q.action:c?'시작 배치':'마무리';document.getElementById('togglePlay').textContent=video.paused?'재생':'일시정지';document.getElementById('sceneSel').value=String(si);}
function setLang(l){lang=l;try{localStorage.setItem('nnsLang',l);}catch(e){}for(const b of document.querySelectorAll('.lang button'))b.setAttribute('aria-pressed',String(b.dataset.lang===l));for(const [k,o] of Object.entries(A))if(k!==l)o.pause();syncAudio(true);}
for(const b of document.querySelectorAll('.lang button'))b.onclick=()=>setLang(b.dataset.lang);
video.addEventListener('play',()=>{syncAudio(true);update();});video.addEventListener('playing',()=>syncAudio(true));
video.addEventListener('pause',()=>{for(const o of Object.values(A))o.pause();update();});video.addEventListener('waiting',()=>cur().pause());
video.addEventListener('seeked',()=>syncAudio(true));video.addEventListener('ratechange',()=>syncAudio(false));
video.addEventListener('timeupdate',()=>{update();syncAudio(false);});video.addEventListener('loadedmetadata',update);
video.addEventListener('ended',()=>{if(si<SC.length-1)load(si+1,0,true);else for(const o of Object.values(A))o.pause();});
document.getElementById('sceneSel').onchange=e=>load(Number(e.target.value),0);
document.getElementById('togglePlay').onclick=()=>video.paused?play_():video.pause();
document.getElementById('muteBtn').onclick=()=>{muted=!muted;for(const o of Object.values(A))o.muted=muted;document.getElementById('muteBtn').textContent=muted?'음소거 해제':'음소거'};
document.getElementById('speed').onchange=e=>{video.playbackRate=Number(e.target.value)};
document.getElementById('previous').onclick=()=>{const c=data.cuts[Math.max(0,currentIndex-1)];seek(c.start+data.lead+.02);update()};document.getElementById('next').onclick=()=>{const c=data.cuts[Math.min(data.cuts.length-1,currentIndex+1)];seek(c.start+data.lead+.02);update()};
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();for(const b of cuts.children)b.hidden=!b.textContent.toLowerCase().includes(q)};
for(const k in A)A[k].src=SC[0].audio[k];setLang(lang);
</script></body></html>
