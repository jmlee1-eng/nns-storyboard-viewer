바래는 시야","start":1145.583333333333,"end":1150.5416666666663,"cues":[]}],"sentences":[{"start":0.25,"end":4.21,"kr":"밤마다 결계를 걷는 작은 유령불이 있었습니다.","jp":"夜ごと、結界を歩く小さな幽霊火がありました。","cut":"P02-S01-C01"},{"start":4.23,"end":6.76,"kr":"[여명의 소녀] 치코링이었죠.","jp":"[黎明の少女]チコりんです。","cut":"P02-S01-C01"},{"start":6.78,"end":11.03,"kr":"홀로 사람들을 지키러 나서는 아이에게 주군이 묻습니다.","jp":"一人で人々を守りに向かう少女に、主君は尋ねます。","cut":"P02-S01-C01"},{"start":11.05,"end":15.1192,"kr":"시들 수 있다는 걸 알면서 왜 계속하느냐고요.","jp":"枯れるかもしれないと知りながら、なぜ続けるのか、と。","cut":"P02-S01-C01"},{"start":15.1392,"end":16.8592,"kr":"……무, 무서워요.","jp":"……こ、怖いです。","cut":"P02-S01-C01"},{"start":16.8792,"end":18.7192,"kr":"무서운데요.","jp":"怖いですけど。","cut":"P02-S01-C01"},{"start":18.7392,"end":23.3092,"kr":"그치만— 오늘 밤 누가 다치는 건 '지금' 무섭잖아요.","jp":"でも──今夜誰かがケガするのは、『今』怖いじゃないですか。","cut":"P02-S01-C01"},{"start":23.3292,"end":27.5633,"kr":"내일 시드는 건…… 내일의 내가 무서워하면 되니까……!","jp":"明日枯れるのは……明日の私が怖がれば、いいですから……！","cut":"P02-S01-C01"},{"start":27.833333333333332,"end":32.99453333333333,"kr":"주군도 계약을 끝낼 단서를 찾아 더 적극적으로 움직입니다.","jp":"主君も、契約を終わらせる手がかりを求め、さらに積極的に動きます。","cut":"P02-S01-C02"},{"start":33.01453333333333,"end":38.35503333333333,"kr":"아이들이 싸우는 동안, 그들을 살아서 돌아오게 할 길을 찾아야 했습니다.","jp":"子どもたちが戦うあいだに、生きて帰らせる道を探さなければなりませんでした。","cut":"P02-S01-C02"},{"start":38.625,"end":43.925,"kr":"주군과 치코링은 소문을 따라, 골목 안 오래된 찻집을 찾아갑니다.","jp":"主君とチコりんは、噂を頼りに路地裏の古い喫茶店を訪ねます。","cut":"P02-S02-C01"},{"start":43.945,"end":50.3715,"kr":"주인은 만개 직전에 스스로 멈춘 유일한 생환자, [빙화의 소녀], 세나.","jp":"店主は、満開の直前で自ら立ち止まった唯一の生還者、[氷華の少女]セナ。","cut":"P02-S02-C01"},{"start":50.3915,"end":56.3133,"kr":"세나는 [절화의 마녀] 이리스가 [만개의 소녀]이던 시절의 이야기를 들려줍니다.","jp":"セナは、[切花の魔女]イリスが、[満開の少女]だった頃の話をしてくれます。","cut":"P02-S02-C01"},{"start":56.58333333333333,"end":62.33333333333333,"kr":"세나가 기억하는 [만개의 소녀]는 누구보다 강하고 다정한 동료였습니다.","jp":"セナの記憶にある[満開の少女]は、誰よりも強く、優しい仲間でした。","cut":"P02-S02-C02"},{"start":62.353333333333325,"end":70.05393333333333,"kr":"시들어 가는 친구들을 모두 지키려고 가장 간절히 싸웠고, 그래서 누구보다 먼저 만개했죠.","jp":"枯れていく友だちをみんな守ろうと、誰よりも必死に戦い、だからこそ、誰よりも先に満開になったのです。","cut":"P02-S02-C02"},{"start":70.07393333333333,"end":76.48393333333333,"kr":"모두가 기대던 소녀에게는 정작 자신이 무너지는 모습을 보일 곳이 없었습니다.","jp":"誰もが頼りにしていたその少女には、自分が崩れていく姿を見せられる場所がありませんでした。","cut":"P02-S02-C02"},{"start":76.50393333333332,"end":82.68833333333333,"kr":"결국 시들어 가는 모습을 누구에게도 보이고 싶지 않아, 스스로를 꺾고 말았습니다.","jp":"ついに、枯れていく姿を誰にも見せたくないと、自らを切り落としてしまったのです。","cut":"P02-S02-C02"},{"start":82.95833333333333,"end":89.85503333333332,"kr":"세나는 이리스가 자신이 겪은 고통을 다른 누구도 겪지 않게 하려 한다고 말합니다.","jp":"セナは、イリスが自分と同じ苦しみを、ほかの誰にも味わわせまいとしているのだと言います。","cut":"P02-S02-C04"},{"start":90.125,"end":96.755,"kr":"시들기 전에 세계째로 꺾어, 가장 아름다운 순간에 모두를 멈추려는 겁니다.","jp":"枯れる前に世界ごと切り落とし、いちばん美しい瞬間に、すべてを止めようとしているのです。","cut":"P02-S02-C04-02"},{"start":96.775,"end":102.73,"kr":"한때 동료를 지키던 다정함이, 이제는 그런 모양으로 뒤틀려 있었습니다.","jp":"かつて仲間を守っていた優しさは、今ではそんな形に歪んでいました。","cut":"P02-S02-C04-02"},{"start":103.0,"end":108.0719,"kr":"치코링이 이길 방법을 묻자 세나의 답변은 짧았습니다.","jp":"勝つ方法をチコりんが尋ねると、セナの答えは短いものでした。","cut":"P02-S03-C01"},{"start":108.0919,"end":110.0633,"kr":"없어.","jp":"ない。","cut":"P02-S03-C01"},{"start":110.33333333333333,"end":115.75333333333333,"kr":"이긴다는 것은 이리스보다 강해져, 활짝 핀다는 것을 의미했습니다.","jp":"勝つということは、イリスより強くなり、咲ききるということでした。","cut":"P02-S03-C01-02"},{"start":115.77333333333333,"end":121.10503333333332,"kr":"그리고 그 끝은 치코링이 다음 [절화의 마녀]가 되는 것이었죠.","jp":"その行き着く先は、チコりんが次の[切花の魔女]になることです。","cut":"P02-S03-C01-02"},{"start":121.375,"end":127.8133,"kr":"하지만 세나처럼 만개 전에 싸우지 않고 멈추면 도시가 삼켜집니다.","jp":"けれど、セナのように満開の前に戦いをやめて立ち止まれば、街が吞み込まれます。","cut":"P02-S03-C01-03"},{"start":128.08333333333331,"end":133.42023333333333,"kr":"싸우면 치코링이 지고, 안 싸우면 도시가 지는 문제였죠.","jp":"戦えばチコりんが敗れ、戦わなければ街が敗れる。そんな問題でした。","cut":"P02-S03-C01-04"},{"start":133.44023333333334,"end":142.03463333333332,"kr":"치코링이 문제 자체가 잘못됐다고 하자 세나는 그 말이 시작이라며 문제 밖에서 정답을 찾아보라고 합니다.","jp":"チコりんが問題そのものが間違っていると言うと、セナはそれが始まりだと、問題の外で答えを探すよう勧めます。","cut":"P02-S03-C01-04"},{"start":142.05463333333333,"end":146.21463333333332,"kr":"지금껏 아무도 찾지 못했던 '이기지 않을 방법'을요.","jp":"これまで誰も見つけられなかった、「勝たない方法」を。","cut":"P02-S03-C01-04"},{"start":146.23463333333333,"end":149.43463333333332,"kr":"더 이상 세나가 아는 것은 없었습니다.","jp":"セナにも、それ以上のことはわかりませんでした。","cut":"P02-S03-C01-04"},{"start":149.45463333333333,"end":158.06333333333333,"kr":"다만, 이리스도 계약을 끝낼 '문'을 찾았지만, 자기 손에서는 노래하지 않는다고 했다는 단서를 남겼습니다.","jp":"ただ、イリスも契約を終わらせる「扉」を探したものの、自分の手では歌わないと言っていた、という手がかりを残します。","cut":"P02-S03-C01-04"},{"start":158.33333333333331,"end":161.89443333333332,"kr":"치코링은 에글랑틴을 다시 만나기로 합니다.","jp":"チコりんは、エグランティーヌにもう一度会うと決めます。","cut":"P02-S04-C01"},{"start":161.9144333333333,"end":166.6944333333333,"kr":"마녀도 한때 사람을 지키던 소녀라면 이야기가 통할지 모릅니다.","jp":"魔女もかつて人を守っていた少女なら、話が通じるかもしれません。","cut":"P02-S04-C01"},{"start":166.71443333333332,"end":171.87463333333332,"kr":"지난번에 일행을 끝까지 쫓지 않았다는 사실도 마음에 남았죠.","jp":"前の戦いで、一行を最後まで追ってこなかったことも、心に残っていました。","cut":"P02-S04-C01"},{"start":171.8946333333333,"end":174.59463333333332,"kr":"히땅도 이번에는 옆에 섰습니다.","jp":"今度は、ひーたんも隣に立ちます。","cut":"P02-S04-C01"},{"start":174.6146333333333,"end":181.4146333333333,"kr":"이야기가 통한다는 보장은 없지만 네네링이 쓰러진 곳에 치코링을 혼자 보낼 수 없었습니다.","jp":"話が通じる保証はなくても、ネネりんが倒れた場所へ、チコりんを一人では行かせられませんでした。","cut":"P02-S04-C01"},{"start":181.43463333333332,"end":185.85393333333332,"kr":"치코링은 이기려 온 것이 아니라며 빛의 무기를 내립니다.","jp":"チコりんは、勝ちに来たのではないと言って、光の武器を下ろします。","cut":"P02-S04-C01"},{"start":185.87393333333333,"end":195.2498333333333,"kr":"히땅이 파편과 성당 밖으로 뻗는 덩굴을 막는 동안, 치코링은 가시에 찢기는 아픔을 견디며 에글랑틴에게 다가갑니다.","jp":"ひーたんが破片や聖堂の外へ伸びる蔓を食い止めるあいだ、チコりんは棘に裂かれる痛みに耐えながら、エグランティーヌへ近づいていきます。","cut":"P02-S04-C01"},{"start":195.2698333333333,"end":198.25983333333332,"kr":"……이기지 않는, 마법소녀?","jp":"……勝たない、魔法少女？","cut":"P02-S04-C01"},{"start":198.27983333333333,"end":201.1498333333333,"kr":"후후…… 후후후.","jp":"ふふ……ふふふ。","cut":"P02-S04-C01"},{"start":201.16983333333332,"end":206.1198333333333,"kr":"그건 그냥— 먹잇감이라고 하는 거랍니다.","jp":"それはただの……獲物ですわ。","cut":"P02-S04-C01"},{"start":206.1398333333333,"end":211.7133333333333,"kr":"그런데 치코링이 찔릴 때마다 에글랑틴이 먼저 움찔합니다.","jp":"ところが、チコりんが刺されるたびに、エグランティーヌの方が先に身を震わせます。","cut":"P02-S04-C01"},{"start":211.73333333333332,"end":213.04333333333332,"kr":"오지 마세요.","jp":"来ないでください。","cut":"P02-S04-C01"},{"start":213.0633333333333,"end":214.4333333333333,"kr":"…오지 마.","jp":"…来ないで。","cut":"P02-S04-C01"},{"start":214.45333333333332,"end":216.13333333333333,"kr":"가시에 찢겨요.","jp":"棘に裂かれます。","cut":"P02-S04-C01"},{"start":216.1533333333333,"end":217.94333333333333,"kr":"아프다구요.","jp":"痛いんですよ。","cut":"P02-S04-C01"},{"start":217.9633333333333,"end":219.66833333333332,"kr":"아, 아파요……!","jp":"い、痛いです……！","cut":"P02-S04-C01"},{"start":219.6883333333333,"end":221.8083333333333,"kr":"엄청 아파요……!","jp":"すごく痛いです……！","cut":"P02-S04-C01"},{"start":221.82833333333332,"end":225.6683333333333,"kr":"그, 그치만— 당신의 가시, 이상해요……!","jp":"で、でも──あなたの棘、おかしいです……！","cut":"P02-S04-C01"},{"start":225.68833333333333,"end":229.8083333333333,"kr":"찌르는 방향이…… 저, 전부, 안쪽이잖아요……!","jp":"棘の向きが……ぜ、全部、内側じゃないですか……！","cut":"P02-S04-C01"},{"start":229.82833333333332,"end":235.7716333333333,"kr":"그거, 묶는 게 아니라— 사실은, 노, 놓치기 싫은 거잖아요……!","jp":"それって、縛りたいんじゃなくて──本当は、は、離したくないんじゃないですか……！","cut":"P02-S04-C01"},{"start":236.04166666666663,"end":240.92166666666662,"kr":"치코링의 말에 [결박의 마녀]는 잊었던 이름을 떠올립니다.","jp":"チコりんの言葉に、[結縛の魔女]は、忘れていた名を思い出します。","cut":"P02-S05-C01"},{"start":240.94166666666663,"end":246.09166666666664,"kr":"[인연의 소녀]. 붉은 실로 사람들을 이어 주던 아이였습니다.","jp":"[縁の少女]。赤い糸で、人と人をつないでいた少女でした。","cut":"P02-S05-C01"},{"start":246.11166666666662,"end":252.81866666666662,"kr":"하지만 인연이 풀리는 게 두려워 매듭을 거듭 조였고, 실은 가시가 되었습니다.","jp":"けれど、縁がほどけるのが怖くて、何度も結び目を締め直すうちに、糸は棘になりました。","cut":"P02-S05-C01"},{"start":252.83866666666663,"end":256.97996666666666,"kr":"놓치기 싫다는 마음이 사람들을 가둔 거죠.","jp":"離したくないという気持ちが、人々を閉じ込めてしまったのです。","cut":"P02-S05-C01"},{"start":257.24999999999994,"end":262.43829999999997,"kr":"제단 앞까지 다가온 치코링 주변에서만 덩굴이 물러납니다.","jp":"祭壇の前まで近づいたチコりんの周りだけ、蔓が退いていきます。","cut":"P02-S05-C03"},{"start":262.70833333333326,"end":265.88073333333324,"kr":"치코링이 빈손을 내밉니다.","jp":"チコりんが何も持たない手を差し出します。","cut":"P02-S05-C03-hands"},{"start":265.9007333333333,"end":270.70073333333323,"kr":"이, 인연은요. 묶는 게 아니라— 잡는 거예요.","jp":"き、絆は。縛るものじゃなくて——つかむもの、です。","cut":"P02-S05-C03-hands"},{"start":270.72073333333327,"end":274.48003333333327,"kr":"마침내 에글랑틴이 치코링의 손을 잡습니다.","jp":"ついにエグランティーヌがチコりんの手を取ります。","cut":"P02-S05-C03-hands"},{"start":274.74999999999994,"end":285.06999999999994,"kr":"아무도 놓치지 않으려 붙들고 있던 마음을 놓자, 소녀들을 조이던 덩굴이 풀리고 에글랑틴의 몸도 발끝부터 사라지기 시작합니다.","jp":"誰一人失いたくないと抱き続けていた想いを手放すと、少女たちを締めつけていた蔓がほどけ、エグランティーヌの体も足先から消えはじめます。","cut":"P02-S05-C03-farewell"},{"start":285.0899999999999,"end":286.2799999999999,"kr":"……아아.","jp":"……ああ。","cut":"P02-S05-C03-farewell"},{"start":286.29999999999995,"end":288.8322999999999,"kr":"그런, 거였군요.","jp":"そういう、ことでしたのね。","cut":"P02-S05-C03-farewell"},{"start":288.85229999999996,"end":293.88229999999993,"kr":"마녀는— 이 마음을 놓으면, 몸도 사라지는 거였어요.","jp":"魔女は……この想いを手放すと、体も消えてしまうのですね。","cut":"P02-S05-C03-farewell"},{"start":293.90229999999997,"end":300.96389999999997,"kr":"저를 붙들고 있던 건, 이 힘이 아니라— '놓치기 싫다'는 마음이었으니까.","jp":"わたくしをつなぎとめていたのは、この力ではなく──『誰も失いたくない』という想いでしたから。","cut":"P02-S05-C03-farewell"},{"start":300.98389999999995,"end":304.3838999999999,"kr":"에글랑틴은 희미해지는 손끝을 바라봅니다.","jp":"エグランティーヌは、薄れていく指先を見つめます。","cut":"P02-S05-C03-farewell"},{"start":304.40389999999996,"end":309.8938999999999,"kr":"놀란 치코링이 취소하려 해도, 에글랑틴은 손을 더 꼭 쥡니다.","jp":"驚いたチコりんが取り消そうとしても、エグランティーヌは手をさらに強く握ります。","cut":"P02-S05-C03-farewell"},{"start":309.91389999999996,"end":319.78389999999996,"kr":"마지막에 가시 없이 손을 잡은 것으로 충분하다며, 치코링과 히땅에게 [인연의 소녀]라는 이름을 기억해 달라고 부탁합니다.","jp":"最後に、棘のない手をつなげただけで十分だと告げ、チコりんとひーたんに、[縁の少女]という名を覚えていてほしいと頼みます。","cut":"P02-S05-C03-farewell"},{"start":319.80389999999994,"end":322.12389999999994,"kr":"따뜻했던 손이 사라지자","jp":"温かかった手が消えると、","cut":"P02-S05-C03-farewell"},{"start":322.1438999999999,"end":326.22389999999996,"kr":"치코링이 울음을 터뜨리고, 히땅이 안아 줍니다.","jp":"チコりんは泣き出し、ひーたんが抱きしめます。","cut":"P02-S05-C03-farewell"},{"start":326.24389999999994,"end":328.41389999999996,"kr":"소녀들은 이제 배웠습니다.","jp":"少女たちは、知りました。","cut":"P02-S05-C03-farewell"},{"start":328.43389999999994,"end":333.04389999999995,"kr":"마녀와 손을 잡을 수는 있어도, 사람으로 되돌릴 수는 없었습니다.","jp":"魔女と手をつなぐことはできても、人に戻すことはできない。","cut":"P02-S05-C03-farewell"},{"start":333.06389999999993,"end":338.6882999999999,"kr":"남은 소녀들에게는 마녀가 되기 전에 살아서 나갈 출구가 필요했습니다.","jp":"残された少女たちには、魔女になる前に、生きて出られる出口が必要でした。","cut":"P02-S05-C03-farewell"},{"start":338.95833333333326,"end":343.70223333333325,"kr":"그동안 주군은 와카와 타마에게 계약서 전문을 요구합니다.","jp":"そのあいだ、主君はワカとタマに契約書の全文を要求します。","cut":"P02-S06-C01"},{"start":343.72223333333324,"end":348.6822333333333,"kr":"입회인에게는 자신이 서명한 문서를 끝까지 읽을 권리가 있었습니다.","jp":"立会人には、自分が署名した書類を最後まで読む権利がありました。","cut":"P02-S06-C01"},{"start":348.70223333333325,"end":353.41223333333323,"kr":"읽지 못한 채 서명했다고 해서, 그 권리까지 사라진 건 아니었죠.","jp":"読めないまま署名したからといって、その権利までなくなったわけではありません。","cut":"P02-S06-C01"},{"start":353.4322333333333,"end":358.83223333333325,"kr":"주군이 끝까지 물러서지 않자 인형들은 마침내 두루마리를 펼칩니다.","jp":"主君が最後まで引き下がらないので、人形たちはついに巻物を広げます。","cut":"P02-S06-C01"},{"start":358.85223333333323,"end":364.38223333333326,"kr":"두루마리에는 소원과 힘, 개화와 대가는 모두 적혀 있습니다.","jp":"巻物には、願いと力、開花と代価がすべて記されていました。","cut":"P02-S06-C01"},{"start":364.40223333333324,"end":369.31683333333325,"kr":"그런데 해약 조항이 있어야 할 마지막 줄만 찢겨 있습니다.","jp":"けれど、解約条項があるはずの最後の一行だけが、破り取られています。","cut":"P02-S06-C01"},{"start":369.33683333333323,"end":374.5832333333333,"kr":"인형들도 자신들이 태어날 때부터 없던 줄이라 모른다고 하죠.","jp":"人形たちも、生まれたときからなかった一行だから知らないと言います。","cut":"P02-S06-C01"},{"start":374.60323333333326,"end":378.8133333333333,"kr":"주군은 다른 기록에 남아 있을지 찾기 시작합니다.","jp":"主君は、ほかの記録に残っていないか、探しはじめます。","cut":"P02-S06-C01"},{"start":379.08333333333326,"end":383.47083333333325,"kr":"문서를 뒤지던 주군 앞에 황혼빛 아이가 나타납니다.","jp":"書類を調べている主君の前に、黄昏色の子どもが現れます。","cut":"P02-S07-C01"},{"start":383.4908333333333,"end":388.34083333333325,"kr":"마법소녀도 마녀도 아닌, 이름과 정체를 알 수 없는 아이죠.","jp":"魔法少女でも魔女でもない、名前も正体もわからない子です。","cut":"P02-S07-C01"},{"start":388.36083333333323,"end":393.09083333333325,"kr":"계약서를 태우면 전부 끝난다고 권하지만, 주군은 거절합니다.","jp":"契約書を燃やせばすべて終わると勧めますが、主君は断ります。","cut":"P02-S07-C01"},{"start":393.11083333333323,"end":397.88143333333323,"kr":"아이들의 운명이 어떻게 될지 모른 채 끝내 버릴 수는 없습니다.","jp":"子どもたちの運命がどうなるかわからないまま、終わらせるわけにはいきません。","cut":"P02-S07-C01"},{"start":397.9014333333333,"end":404.13113333333325,"kr":"아이들이 나갈 문을 찾겠다는 주군을 보고, 황혼빛 아이가 단서를 줍니다.","jp":"子どもたちが出ていく扉を探すという主君に、黄昏色の子どもは手がかりを与えます。","cut":"P02-S07-C01"},{"start":404.15113333333323,"end":407.6421333333333,"kr":"적힌 걸 찢어도, 말해진 건 남아.","jp":"書かれたものを破いても、語られたことは残る。","cut":"P02-S07-C01"},{"start":407.66213333333326,"end":412.0721333333332,"kr":"그 줄을 '들은' 존재가, 이 도시 어딘가에 아직 있어.","jp":"その一行を『聞いた』者が、この街のどこかにまだいる。","cut":"P02-S07-C01"},{"start":412.09213333333327,"end":415.0633333333333,"kr":"…제일 오래된 물건 곁을 뒤져 봐.","jp":"…いちばん古い品のそばを探してみて。","cut":"P02-S07-C01"},{"start":415.33333333333326,"end":419.15333333333325,"kr":"오래 남아 있으면서 목소리를 간직할 수 있는 물건.","jp":"長く残り、声をしまっておけるもの。","cut":"P02-S07-C03"},{"start":419.17333333333323,"end":424.22333333333324,"kr":"그런 골동품을 찾아, 인형들을 받았던 하케 씨의 가게로 돌아갑니다.","jp":"そんな骨董品を探して、人形をもらったハケさんの店へ戻ります。","cut":"P02-S07-C03"},{"start":424.2433333333333,"end":430.8033333333333,"kr":"하케 씨가 기다렸다는 듯 꺼내 온 것은 축음기 실린더, 목소리를 녹음한 통입니다.","jp":"ハケさんが待っていたかのように取り出したのは、蓄音機のシリンダー。声を録音した筒です。","cut":"P02-S07-C03"},{"start":430.82333333333327,"end":437.8133333333333,"kr":"이리스도 만개 전에 찾았지만, 힘을 받은 소녀의 손으로는 열 수 없었다고 했던 물건이죠.","jp":"イリスも満開になる前に探し当てたものの、力を受け取った少女の手では開けなかったという品でした。","cut":"P02-S07-C03"},{"start":438.08333333333326,"end":444.0033333333333,"kr":"주군은 고장 난 실린더를 목공소로 가져가고, 쿠로코가 태엽을 고칩니다.","jp":"主君は壊れたシリンダーを木工所へ持ち込み、クロコがゼンマイを修理します。","cut":"P02-S08-C01"},{"start":444.02333333333326,"end":449.3133333333333,"kr":"실린더를 본 와카와 타마는 계약서 원본을 주군에게 넘깁니다.","jp":"シリンダーを見たワカとタマは、契約書の原本を主君に渡します。","cut":"P02-S08-C01"},{"start":449.58333333333326,"end":456.5225333333333,"kr":"한 소녀의 계약서가 아니라, 이 도시의 개별 계약들을 묶는 공통 원본이었습니다.","jp":"それは、一人の少女の契約書ではなく、この街の個々の契約を束ねる共通の原本でした。","cut":"P02-S08-C02"},{"start":456.54253333333327,"end":464.60503333333327,"kr":"인형들은 관리자 권한으로, 그 원본에 연결된 계약들의 해약을 집행할 권리를 주군에게 맡깁니다.","jp":"人形たちは管理者の権限で、その原本につながる契約の解約を執行する権利を、主君に託します。","cut":"P02-S08-C02"},{"start":464.87499999999994,"end":473.01109999999994,"kr":"태엽은 고쳤지만 낡은 실린더는 서명한 입회인의 손에서만 소리가 나며, 한 번만 재생할 수 있습니다.","jp":"ゼンマイは直りましたが、古いシリンダーは、署名した立会人の手でしか音を出せず、再生できるのも一度きりです。","cut":"P02-S08-C03"},{"start":473.0310999999999,"end":475.9710999999999,"kr":"주군은 원본과 통을 챙깁니다.","jp":"主君は、原本と筒を携えます。","cut":"P02-S08-C03"},{"start":475.99109999999996,"end":484.56329999999997,"kr":"출구가 없다고 믿는 이리스 앞에서 해약의 조건을 함께 듣고, 세계를 끝내는 대신 다른 길을 찾으려는 겁니다.","jp":"出口はないと信じるイリスの前で、解約の条件を一緒に聞き、世界を終わらせる代わりに、別の道を見つけようというのです。","cut":"P02-S08-C03"},{"start":484.83333333333326,"end":487.70773333333324,"kr":"목공소에 다시 불이 켜집니다.","jp":"木工所に、再び明かりがともります。","cut":"P02-GATHER-C01"},{"start":487.7277333333333,"end":492.69773333333325,"kr":"흩어졌던 아이들이 마지막 작전을 위해 하나둘 돌아옵니다.","jp":"散っていた少女たちが、最後の作戦のために一人ずつ戻ってきます。","cut":"P02-GATHER-C01"},{"start":492.7177333333333,"end":498.0977333333333,"kr":"네네링은 아직 상처가 낫지 않은 몸으로 병원 창문을 통해 탈출해 왔습니다.","jp":"ネネりんは、まだ傷の癒えない体で病院の窓から抜け出してきました。","cut":"P02-GATHER-C01"},{"start":498.11773333333326,"end":501.12773333333325,"kr":"쥬리땅도 목발을 짚고 나타났습니다.","jp":"ジュリたんも、松葉杖をついて現れました。","cut":"P02-GATHER-C01"},{"start":501.14773333333324,"end":505.7877333333333,"kr":"아직 아픈 몸이었지만, 오늘 밤만큼은 함께하기로 한 겁니다.","jp":"まだ痛みの残る体でも、今夜だけは共にいると決めたのです。","cut":"P02-GATHER-C01"},{"start":505.80773333333326,"end":509.7277333333333,"kr":"모두가 모인 자리에서, 마지막 작전을 확인합니다.","jp":"全員がそろったところで、最後の作戦を確認します。","cut":"P02-GATHER-C01"},{"start":509.74773333333326,"end":517.3133333333333,"kr":"이번 싸움의 목적은 주군과 실린더를 중심부까지 보내, 계약을 끝낼 기회를 만드는 일입니다.","jp":"今度の戦いの目的は、主君とシリンダーを中心部まで送り届け、契約を終わらせる機会を作ることです。","cut":"P02-GATHER-C01"},{"start":517.5833333333333,"end":521.3333333333333,"kr":"마침내 이리스의 거대한 결계가 완성됩니다.","jp":"ついに、イリスの巨大な結界が完成します。","cut":"P02-S09-C01"},{"start":521.3533333333332,"end":526.7723333333332,"kr":"하늘이 꽃잎처럼 닫히고, 사람과 거리가 강제로 만개합니다.","jp":"空が花びらのように閉じ、人も街も、無理やり満開へと追い込まれていきます。","cut":"P02-S09-C01"},{"start":526.7923333333332,"end":533.2716333333333,"kr":"날이 밝기 전, 이리스는 가장 아름다운 순간의 도시를 통째로 꺾으려 합니다.","jp":"夜が明ける前に、イリスは、いちばん美しい瞬間の街を丸ごと切り落とそうとしていました。","cut":"P02-S09-C01"},{"start":533.5416666666666,"end":536.0116666666667,"kr":"도시를 닫는 결계가 내려앉습니다.","jp":"街を閉ざす結界が降りてきます。","cut":"P02-LAUNCH-C01"},{"start":536.0316666666666,"end":538.6516666666666,"kr":"이제, 물러설 곳은 없습니다.","jp":"もう、引き返す場所はありません。","cut":"P02-LAUNCH-C01"},{"start":538.6716666666666,"end":540.8316666666666,"kr":"전원— 진격 개시.","jp":"全員──進撃開始。","cut":"P02-LAUNCH-C01"},{"start":540.8516666666666,"end":543.5216666666666,"kr":"대피는 계속, 길은 앞으로만.","jp":"避難は続行、道は前だけです。","cut":"P02-LAUNCH-C01"},{"start":543.5416666666666,"end":544.7116666666666,"kr":"갑니다!","jp":"行きます！","cut":"P02-LAUNCH-C01"},{"start":544.7316666666667,"end":547.8716666666667,"kr":"[섬화], 준비 완료! 제일 앞!","jp":"[閃華]、準備完了！いちばん前！","cut":"P02-LAUNCH-C01"},{"start":547.8916666666667,"end":550.6316666666667,"kr":"[선풍]…… 기상 완료.","jp":"[旋風]……起床完了。","cut":"P02-LAUNCH-C01"},{"start":550.6516666666666,"end":552.0216666666666,"kr":"마지못해.","jp":"しぶしぶ。","cut":"P02-LAUNCH-C01"},{"start":552.0416666666666,"end":555.4716666666666,"kr":"[윤회]— 등불, 점화했습니다.","jp":"[輪廻]──灯、点しました。","cut":"P02-LAUNCH-C01"},{"start":555.4916666666667,"end":558.3966666666666,"kr":"[여명]…… 가, 갑니다!","jp":"[黎明]……い、行きます！","cut":"P02-LAUNCH-C01"},{"start":558.6666666666666,"end":564.6883666666666,"kr":"동료들이 길을 열고 쿠로코가 방벽으로 지키는 동안 주군이 전진합니다.","jp":"仲間たちが道を開き、クロコが防壁で守るあいだに、主君は前へ進みます。","cut":"P02-S09-C03"},{"start":564.9583333333333,"end":569.9483333333333,"kr":"도움을 받아 중심부에 들어선 치코링은 이번에도 무기를 들지 않습니다.","jp":"仲間の助けで中心部へ入ったチコりんは、今回も武器を持ちません。","cut":"P02-S10-C01"},{"start":569.9683333333332,"end":572.6983333333333,"kr":"힘으로 이기면 자신도 마녀가 됩니다.","jp":"力で勝てば、自分も魔女になる。","cut":"P02-S10-C01"},{"start":572.7183333333332,"end":577.0772333333333,"kr":"이리스에게 삶을 끝낼 권리를 주지 않으려는 겁니다.","jp":"自分たちの人生を終わらせる権利を、イリスに渡さないためでした。","cut":"P02-S10-C01"},{"start":577.0972333333333,"end":583.8972333333332,"kr":"치코링은 이리스를 향해, 사람들은 살고 싶어서 서로 도우며 도망쳤다고 말합니다.","jp":"チコりんはイリスに向かって、人々は生きたいからこそ、助け合って逃げたのだと伝えます。","cut":"P02-S10-C01"},{"start":583.9172333333332,"end":591.2872333333332,"kr":"이리스는 동료들이 노래도 친구도, 끝내 자기 자신까지 잊어 가던 밤을 이야기합니다.","jp":"イリスは、仲間たちが歌も友だちも、最後には自分自身さえ忘れていった夜のことを語ります。","cut":"P02-S10-C01"},{"start":591.3072333333332,"end":595.6050333333333,"kr":"치코링에게만은 그런 끝을 겪게 하고 싶지 않았습니다.","jp":"チコりんにだけは、あんな終わりを迎えてほしくありませんでした。","cut":"P02-S10-C01"},{"start":595.8749999999999,"end":600.0216999999999,"kr":"에글랑틴과 손을 잡은 끝도 소멸이었습니다.","jp":"エグランティーヌと手をつないだ先にあったのも、消滅でした。","cut":"P02-S10-C02-02"},{"start":600.2916666666665,"end":607.5216666666665,"kr":"이리스는 다른 출구가 없으니, 치코링에게 지금 가장 아름다운 채로 끝나기를 권합니다.","jp":"イリスは、ほかに出口はないのだから、今、いちばん美しいまま終わるよう、チコりんに勧めます。","cut":"P02-S10-C02-03"},{"start":607.7916666666665,"end":613.3916666666665,"kr":"하지만 치코링에겐, 끝으로 정해진 오늘 뒤에도 이어질 내일이 있었습니다.","jp":"それでもチコりんには、最後と決められた今日の先に、まだ明日がありました。","cut":"P02-S11-C01"},{"start":613.4116666666665,"end":616.7516666666666,"kr":"치코링에게는 매일 쓴 일기가 있었습니다.","jp":"チコりんには、毎日書いてきた日記がありました。","cut":"P02-S11-C01"},{"start":616.7716666666665,"end":624.0616666666665,"kr":"어제는 무서웠다고만 적었지만, 오늘은 여전히 무서워도 발이 조금 빨리 나갔다고 썼죠.","jp":"昨日は怖かったとだけ書き、今日は、まだ怖くても少し早く足が出たと書いたのです。","cut":"P02-S11-C01"},{"start":624.0816666666665,"end":627.8966666666665,"kr":"어제 겪은 일을 딛고, 오늘은 달라진 겁니다.","jp":"昨日の経験を足場にして、今日は変われたのです。","cut":"P02-S11-C01"},{"start":628.1666666666665,"end":633.0216666666665,"kr":"에글랑틴이 남긴 손잡는 법도 치코링 안에 남았습니다.","jp":"エグランティーヌが残した、手のつなぎ方も、チコりんの中に残っています。","cut":"P02-S11-C02"},{"start":633.2916666666665,"end":637.9320666666665,"kr":"정점이 지났다고 삶까지 끝난 건 아니었습니다.","jp":"頂点を過ぎたからといって、人生まで終わったわけではありませんでした。","cut":"P02-S11-C02-03"},{"start":637.9520666666665,"end":643.0633666666665,"kr":"그러니까, 무서워도— 나는, 내일의 나를 보고 싶어요!","jp":"だから、こわくても——私は、明日の私に会ってみたいんです！","cut":"P02-S11-C02-03"},{"start":643.3333333333331,"end":646.3933333333331,"kr":"치코링의 말에 이리스의 손이 멈춥니다.","jp":"チコりんの言葉にイリスの手が止まります。","cut":"P02-S11-C02-03-petals-stop"},{"start":646.4133333333332,"end":649.0633333333332,"kr":"닫히던 꽃잎이 멎습니다.","jp":"閉じかけていた花びらも止まります。","cut":"P02-S11-C02-03-petals-stop"},{"start":649.3333333333331,"end":655.0533333333332,"kr":"이리스는 문득, 마지막까지 다음 봄을 이야기했던 동료들을 떠올립니다.","jp":"イリスはふと、最後まで次の春の話をしていた仲間たちを思い出します。","cut":"P02-S11-C03-02"},{"start":655.0733333333332,"end":661.6883333333332,"kr":"강한 척하는 말이라고 여겼지만, 그들도 정말 내일을 보고 싶었던 건지 모릅니다.","jp":"強がりだと思っていました。けれど彼女たちも、本当に明日を見たかったのかもしれません。","cut":"P02-S11-C03-02"},{"start":661.9583333333331,"end":666.1436333333331,"kr":"그 틈에 주군이 실린더를 꺼내 태엽을 감습니다.","jp":"その隙に、主君がシリンダーを取り出し、ゼンマイを巻きます。","cut":"P02-S12-C01"},{"start":666.1636333333331,"end":669.6436333333331,"kr":"오래된 목소리가 해약 조항을 읽습니다.","jp":"古い声が、解約条項を読み上げます。","cut":"P02-S12-C01"},{"start":669.6636333333331,"end":671.5936333333332,"kr":"『——조항, 마지막.","jp":"『──条項、最後。","cut":"P02-S12-C01"},{"start":671.6136333333332,"end":673.3550333333332,"kr":"해지에 관하여.』","jp":"解約について。』","cut":"P02-S12-C01"},{"start":673.6249999999998,"end":675.3751999999997,"kr":"……해, 해지…….","jp":"……か、解約……。","cut":"P02-S12-C01-02"},{"start":675.3951999999998,"end":678.2651999999998,"kr":"이, 있었어요…….","jp":"あ、あったんですね……。","cut":"P02-S12-C01-02"},{"start":678.2851999999998,"end":680.8851999999998,"kr":"정말로, 있었어…….","jp":"本当に、あったんだ……。","cut":"P02-S12-C01-02"},{"start":680.9051999999998,"end":681.7151999999998,"kr":"그래.","jp":"そうだ。","cut":"P02-S12-C01-02"},{"start":681.7351999999997,"end":684.0632999999998,"kr":"한 글자도, 놓치지 마라.","jp":"一文字も、聞き逃すな。","cut":"P02-S12-C01-02"},{"start":684.3333333333331,"end":688.9733333333331,"kr":"실린더는 '입회인'이 계약을 파기할 수 있다고 말합니다.","jp":"シリンダーは、『立会人』が契約を破棄できると語ります。","cut":"P02-S12-C02"},{"start":688.9933333333331,"end":694.8433333333331,"kr":"계약이 파기되면 마법소녀들에게서 힘이 빠져나와 씨앗의 상태로 돌아갑니다.","jp":"契約が破棄されれば、魔法少女たちから力が抜け、種の状態へ戻ります。","cut":"P02-S12-C02"},{"start":694.8633333333331,"end":699.3176333333331,"kr":"그런데, 그와 함께 소녀들은 기억을 잃는다고 하죠.","jp":"しかし、それと同時に少女たちは記憶を失うというのです。","cut":"P02-S12-C02"},{"start":699.3376333333331,"end":706.9976333333332,"kr":"시들어야 하는 운명에서의 탈출이지만, 어쩌면, 영혼을 회수해가는 소멸에 가까울지도 모릅니다.","jp":"枯れる運命からの脱出。でも、もしかすると魂を回収される消滅に近いのかもしれません。","cut":"P02-S12-C02"},{"start":707.0176333333332,"end":709.3076333333331,"kr":"게다가 조건이 있었습니다.","jp":"しかも、条件がありました。","cut":"P02-S12-C02"},{"start":709.3276333333331,"end":712.7526333333332,"kr":"입회인이 종이를 찢는 것만으로는 부족했습니다.","jp":"立会人が紙を破るだけでは足りません。","cut":"P02-S12-C02"},{"start":712.7726333333331,"end":718.1466333333332,"kr":"소녀들이 스스로 힘을 놓을 때에만 계약의 파기가 성립합니다.","jp":"少女たちが自ら力を手放したときにだけ、契約の破棄は成立します。","cut":"P02-S12-C02"},{"start":718.4166666666665,"end":722.3366666666665,"kr":"실린더의 목소리가 멎고 공간이 고요해졌습니다.","jp":"シリンダーの声が止まり、その場は静まり返りました。","cut":"P02-S12-C04"},{"start":722.3566666666666,"end":727.9799666666665,"kr":"와카도 타마도 백 년 만에 돌아온 말 앞에서는 숙연해졌습니다.","jp":"ワカもタマも、百年ぶりに戻ってきた言葉の前で、厳粛な表情になります。","cut":"P02-S12-C04"},{"start":728.2499999999999,"end":736.1699999999998,"kr":"한편, 이리스는 본인이 만개하던 마지막 밤까지 붙잡고 있었던 실린더에서 눈을 떼지 못합니다.","jp":"一方、イリスは、自分が満開になったあの最後の夜まで握りしめていたシリンダーから、目を離せません。","cut":"P02-S12-C05-03"},{"start":736.1899999999999,"end":742.4582999999999,"kr":"밤새 태엽을 감으며 그토록 알려 달라 빌었던 출구를 마침내 듣게 되자,","jp":"夜通しゼンマイを巻き、どうか教えてほしいと願い続けた出口を、ついに知ったとき、","cut":"P02-S12-C05-03"},{"start":742.4782999999999,"end":747.8682999999999,"kr":"그 한 소절만 들었더라면 자르지 않아도 됐을 소녀들의 얼굴이 떠올라","jp":"あの一節さえ聞けていれば、切らずに済んだ少女たちの顔が浮かび、","cut":"P02-S12-C05-03"},{"start":747.8882999999998,"end":751.6466999999999,"kr":"칼날처럼 얇게 웃고 말았죠.","jp":"イリスは、刃のように薄く笑ってしまいました。","cut":"P02-S12-C05-03"},{"start":751.9166666666665,"end":757.8066666666665,"kr":"그때 결계 바깥에서 하늘이 접히고, [비탄의 마녀] 라르므가 내려옵니다.","jp":"そのとき、結界の外で空が折り畳まれ、[悲嘆の魔女]ラルムが降りてきます。","cut":"P02-S13-C01"},{"start":757.8266666666665,"end":766.0633666666665,"kr":"실린더 속 목소리의 주인이자 최초의 입회인, 소원에 힘과 대가를 주는 규칙을 쓴 사람이었습니다.","jp":"シリンダーの声の主であり、最初の立会人。願いに力と代価を与えるルールを書いた人物でした。","cut":"P02-S13-C01"},{"start":766.3333333333331,"end":770.6133333333331,"kr":"라르므는 마지막 줄을 찢은 이유를 털어놓았습니다.","jp":"ラルムは、最後の一行を破った理由を打ち明けます。","cut":"P02-S13-C02"},{"start":770.6333333333331,"end":771.4633333333331,"kr":"네.","jp":"ええ。","cut":"P02-S13-C02"},{"start":771.4833333333331,"end":773.8733333333331,"kr":"해지는 잔인해요.","jp":"解約は残酷です。","cut":"P02-S13-C02"},{"start":773.8933333333331,"end":778.1286333333331,"kr":"아이들은 힘을 잃고, 나를 잊고, 떠나요.","jp":"子どもたちは力を失って、私を忘れて、去っていく。","cut":"P02-S13-C02"},{"start":778.1486333333331,"end":779.9286333333331,"kr":"…그래서 찢었어요.","jp":"…だから破りました。","cut":"P02-S13-C02"},{"start":779.9486333333332,"end":784.4286333333331,"kr":"떠날 문이 없으면— 아무도, 떠나지 않으니까.","jp":"去るための扉がなければ──誰も、去りはしないから。","cut":"P02-S13-C02"},{"start":784.4486333333332,"end":786.8186333333332,"kr":"……그 탓에, 백 년이다.","jp":"……そのせいで、百年だ。","cut":"P02-S13-C02"},{"start":786.8386333333332,"end":793.0186333333331,"kr":"출구 없는 정원에서— 얼마나 많은 아이가 시들고, 얼마나 많은 마녀가 태어났는지.","jp":"出口のない庭で——どれほどの子が枯れ、どれほどの魔女が生まれたか。","cut":"P02-S13-C02"},{"start":793.0386333333331,"end":794.4800333333332,"kr":"알고는 있나.","jp":"わかっているのか。","cut":"P02-S13-C02"},{"start":794.7499999999998,"end":795.7449999999998,"kr":"알아요.","jp":"知っています。","cut":"P02-S13-C03"},{"start":795.7649999999998,"end":798.3049999999997,"kr":"전부, 세고 있었어요.","jp":"全部、数えていました。","cut":"P02-S13-C03"},{"start":798.3249999999998,"end":800.4649999999998,"kr":"…한 송이도, 빠짐없이.","jp":"…一輪も、残さず。","cut":"P02-S13-C03"},{"start":800.4849999999998,"end":802.3049999999997,"kr":"그래서 거두는 거예요.","jp":"だから摘み取るのです。","cut":"P02-S13-C03"},{"start":802.3249999999998,"end":805.9649999999998,"kr":"시들어 간 아이를... 씨앗은 위험해요.","jp":"枯れていった子を…。種は危険です。","cut":"P02-S13-C03"},{"start":805.9849999999998,"end":808.2449999999998,"kr":"다시 피면, 다시 시들어요.","jp":"また咲けば、また枯れる。","cut":"P02-S13-C03"},{"start":808.2649999999998,"end":812.6149999999998,"kr":"그러니 여기서— 내 곁에서, 영원히 잠들게 해요.","jp":"だからここで——私のそばで、永遠に眠らせるの。","cut":"P02-S13-C03"},{"start":812.6349999999998,"end":817.9618999999998,"kr":"라르므는 검은 구슬에 시든 아이들의 씨앗까지 가두고 있었습니다.","jp":"ラルムは、枯れた子どもたちの種まで、黒い珠に閉じ込めていました。","cut":"P02-S13-C03"},{"start":817.9818999999998,"end":822.7257999999998,"kr":"다시 피면 다시 아플까 봐 영원히 재운 겁니다.","jp":"また咲けばまた傷つくからと、永遠に眠らせていたのです。","cut":"P02-S13-C03"},{"start":822.7457999999998,"end":825.4057999999998,"kr":"……잠들어 있으면, 아프지 않아요.","jp":"……眠っていれば、痛くない。","cut":"P02-S13-C03"},{"start":825.4257999999998,"end":826.7357999999998,"kr":"무섭지도 않아요.","jp":"こわくもない。","cut":"P02-S13-C03"},{"start":826.7557999999998,"end":829.7257999999998,"kr":"시들지도, 잊혀지지도 않아요.","jp":"枯れも、忘れられもしない。","cut":"P02-S13-C03"},{"start":829.7457999999998,"end":832.2157999999997,"kr":"…그보다 좋은 게, 있나요?","jp":"…それより良いことが、ありますか？","cut":"P02-S13-C03"},{"start":832.2357999999998,"end":834.6657999999998,"kr":"그러니까, 같이 잠들어요.","jp":"だから、一緒に眠りましょう。","cut":"P02-S13-C03"},{"start":834.6857999999997,"end":835.6857999999997,"kr":"다 같이.","jp":"みんなで。","cut":"P02-S13-C03"},{"start":835.7057999999997,"end":838.3549999999998,"kr":"아무도, 잃지 않는 곳에서.","jp":"誰も、失わない場所で。","cut":"P02-S13-C03"},{"start":838.6249999999998,"end":842.3560999999997,"kr":"라르므가 공간을 접어 일행을 짓누릅니다.","jp":"ラルムが空間を折り畳み、一行を押し潰します。","cut":"P02-S14-C01"},{"start":842.3760999999997,"end":849.3860999999998,"kr":"히땅의 폭풍 전력도, 네네링의 가장 밝은 섬광도 공간과 함께 접혀버릴 뿐이었습니다.","jp":"ひーたんの全力の嵐も、ネネりんの最も明るい閃光も、空間ごと折り畳まれるだけでした。","cut":"P02-S14-C01"},{"start":849.4060999999998,"end":857.6660999999998,"kr":"레오나가 전력을 다 해 불꽃으로 내려앉는 하늘을 막아서자, 이리스가 소녀들의 곁에서 꽃잎으로 버팁니다.","jp":"レオナが全力の炎で落ちてくる空を受け止めると、イリスも少女たちのそばで花びらを広げ、支えます。","cut":"P02-S14-C01"},{"start":857.6860999999998,"end":861.3760999999997,"kr":"………내 정원의 아이들에게, 손대지 마세요.","jp":"………私の庭の子たちに、手を出さないで。","cut":"P02-S14-C01"},{"start":861.3960999999998,"end":863.1460999999998,"kr":"……! 당신—","jp":"……！あなた——","cut":"P02-S14-C01"},{"start":863.1660999999998,"end":864.9560999999998,"kr":"……절화의 아이.","jp":"……切花の子。","cut":"P02-S14-C01"},{"start":864.9760999999997,"end":866.7960999999998,"kr":"당신이, 왜.","jp":"あなたが、なぜ。","cut":"P02-S14-C01"},{"start":866.8160999999998,"end":869.3060999999998,"kr":"…당신이 제일 잘 알잖아요.","jp":"…あなたが一番わかっているでしょう。","cut":"P02-S14-C01"},{"start":869.3260999999998,"end":871.6960999999998,"kr":"시드는 게, 얼마나…….","jp":"枯れるのが、どれほど……。","cut":"P02-S14-C01"},{"start":871.7160999999998,"end":873.5460999999998,"kr":"네, 알아요.","jp":"ええ、知っています。","cut":"P02-S14-C01"},{"start":873.5660999999998,"end":876.2660999999998,"kr":"알다 못해— 잘라 왔어요.","jp":"知るだけでなく——切ってきました。","cut":"P02-S14-C01"},{"start":876.2860999999998,"end":877.8260999999998,"kr":"그래서 알아요.","jp":"だからわかるの。","cut":"P02-S14-C01"},{"start":877.8460999999998,"end":882.4361999999998,"kr":"당신의 그 손이— 옛날의 나와, 같은 손이라는 걸.","jp":"あなたのその手が——昔の私と、同じ手だということを。","cut":"P02-S14-C01"},{"start":882.4561999999997,"end":889.2961999999998,"kr":"두려워서 아이들의 시간을 멈추는 손이 소녀들의 내일을 빼앗고 있다는 것을 깨달은 겁니다.","jp":"こわくて子どもたちの時間を止める手が、少女たちの明日を奪っている。そのことに気づいたのです。","cut":"P02-S14-C01"},{"start":889.3161999999998,"end":896.3161999999998,"kr":"이제 아이들의 끝을 대신 정하는 계획을 거두고, 소녀들이 결정한 내일을 지킵니다.","jp":"もう子どもたちの終わりを代わりに決める計画を捨て、少女たちが決めた明日を守ります。","cut":"P02-S14-C01"},{"start":896.3361999999997,"end":898.3161999999998,"kr":"……하.","jp":"……はっ。","cut":"P02-S14-C01"},{"start":898.3361999999997,"end":901.6361999999998,"kr":"마녀랑 등을 맞대는 날이 올 줄이야.","jp":"魔女と背中を預け合う日が来るとはね。","cut":"P02-S14-C01"},{"start":901.6561999999998,"end":902.9561999999997,"kr":"후후.","jp":"ふふ。","cut":"P02-S14-C01"},{"start":902.9761999999998,"end":907.9382999999998,"kr":"…아이들을 지키는 데에, 편 가르기는 촌스럽죠.","jp":"…子どもを守るのに、敵味方で分けるなんて野暮でしょう。","cut":"P02-S14-C01"},{"start":908.2083333333331,"end":915.0983333333331,"kr":"그때, 레오나는 전력으로 뿜어낸 불꽃으로 인해 만개에 이르러 몸이 눈부시게 피어납니다.","jp":"その時、レオナは全力で噴き出した炎によって満開に至り、その身がまばゆく咲き始めます。","cut":"P02-S14-C03"},{"start":915.1183333333331,"end":917.3883333333331,"kr":"이대로면 마녀가 됩니다.","jp":"このままでは魔女になります。","cut":"P02-S14-C03"},{"start":917.4083333333332,"end":918.8183333333332,"kr":"레오나 씨——!!","jp":"レオナさん——！！","cut":"P02-S14-C03"},{"start":918.8383333333331,"end":922.3383333333331,"kr":"안 돼, 피지 마, 피지 마아——!!","jp":"だめ、咲かないで、咲かないでぇ——！！","cut":"P02-S14-C03"},{"start":922.3583333333331,"end":926.6392333333331,"kr":"주군은 소녀들에게 힘을 놓으라 소리칩니다.","jp":"主君は少女たちに力を手放せと叫びます。","cut":"P02-S14-C03"},{"start":926.6592333333332,"end":928.1992333333332,"kr":"전원— 들어라!","jp":"全員——聞け！","cut":"P02-S14-C03"},{"start":928.2192333333331,"end":932.4383333333332,"kr":"파기는 너희가 힘을 '놓아야' 성립한다!","jp":"破棄は、お前たちが力を『手放して』初めて成立する！","cut":"P02-S14-C03"},{"start":932.7083333333331,"end":938.2360333333331,"kr":"라르므는 놓으면 이 밤도 서로도 잊을 거라고 경고합니다.","jp":"ラルムは、手放せばこの夜も、お互いのことも忘れると警告します。","cut":"P02-S14-C04"},{"start":938.2560333333331,"end":939.2760333333331,"kr":"안 돼요.","jp":"だめ。","cut":"P02-S14-C04"},{"start":939.2960333333332,"end":942.8960333333331,"kr":"놓으면— 놓으면, 전부 끝나 버려요……!!","jp":"手放したら——手放したら、全部終わってしまう……！！","cut":"P02-S14-C04"},{"start":942.9160333333332,"end":945.0360333333332,"kr":"놓으면…… 잊어버려요.","jp":"手放せば……忘れてしまう。","cut":"P02-S14-C04"},{"start":945.0560333333332,"end":949.1860333333332,"kr":"이 밤도, 서로도…… 전부, 처음부터 없던 것처럼…….","jp":"この夜も、お互いも……全部、初めからなかったように……。","cut":"P02-S14-C04"},{"start":949.2060333333332,"end":951.4800333333332,"kr":"그래도, 좋다는 건가요…….","jp":"それでも、いいというの……。","cut":"P02-S14-C04"},{"start":951.7499999999998,"end":960.5216999999998,"kr":"능력과 함께, 구하고 울고 웃은 시간까지 전부, 처음부터 없던 것처럼 잃게 될 거라면서요.","jp":"能力とともに、救い、泣き、笑った時間まで全部、初めからなかったかのように失うことになるんですよね。","cut":"P02-S14-C04-02"},{"start":960.7916666666664,"end":965.0456666666664,"kr":"그 선택은 어른이 대신할 수 없었습니다.","jp":"その選択を、大人が代わりに決めることはできませんでした。","cut":"P02-S14-C05"},{"start":965.0656666666664,"end":967.8556666666664,"kr":"그래도— 정해라, 너희가.","jp":"それでも——決めろ、お前たちが。","cut":"P02-S14-C05"},{"start":967.8756666666663,"end":970.8456666666664,"kr":"꽃의 규칙이 아니라, 너희 자신이!","jp":"花の掟じゃない、お前自身が！","cut":"P02-S14-C05"},{"start":970.8656666666664,"end":977.5505666666664,"kr":"하지만 치코링이 소녀들의 이름을 적은 일기장을 가슴에 꼭 안으며 말합니다.","jp":"しかしチコりんは、少女たちの名前を書き留めた日記帳を胸にぎゅっと抱きしめて言います。","cut":"P02-S14-C05"},{"start":977.5705666666664,"end":979.9305666666664,"kr":"이 일기에, 다 적어 놨어요.","jp":"この日記に、全部書いてあります。","cut":"P02-S14-C05"},{"start":979.9505666666664,"end":982.2805666666663,"kr":"오늘 밤도 꼭, 적을 거예요.","jp":"今夜も必ず、書きます。","cut":"P02-S14-C05"},{"start":982.3005666666664,"end":984.8505666666664,"kr":"그러니까…… 무섭지, 않아요.","jp":"だから……こわく、ありません。","cut":"P02-S14-C05"},{"start":984.8705666666664,"end":987.1105666666664,"kr":"…저희는, 씨앗이니까요.","jp":"…私たちは、種ですから。","cut":"P02-S14-C05"},{"start":987.1305666666664,"end":989.5705666666664,"kr":"놓아도, 다시 피니까요!","jp":"手放しても、また咲きますから！","cut":"P02-S14-C05"},{"start":989.5905666666664,"end":995.8705666666664,"kr":"자기 이름 하나를 말하는 데도 세 번을 걸리던 치코링이 한 번도 더듬지 않았죠.","jp":"自分の名前ひとつ言うのにも三度かかっていたチコりんが、一度も言葉に詰まりませんでした。","cut":"P02-S14-C05"},{"start":995.8905666666664,"end":999.3133666666664,"kr":"치코링이 새벽빛을 놓습니다.","jp":"チコりんが暁の光を手放します。","cut":"P02-S14-C05"},{"start":999.583333333333,"end":1000.493333333333,"kr":"……하암.","jp":"……ふあぁ。","cut":"P02-S14-C05-02"},{"start":1000.513333333333,"end":1003.433333333333,"kr":"…마지막까지, 좋은 바람이었어.","jp":"…最後まで、いい風だった。","cut":"P02-S14-C05-02"},{"start":1003.453333333333,"end":1005.9233333333331,"kr":"……처음으로 진심을 다했으니까.","jp":"……初めて、本気を出せたから。","cut":"P02-S14-C05-02"},{"start":1005.943333333333,"end":1007.383333333333,"kr":"미련, 없음.","jp":"未練、なし。","cut":"P02-S14-C05-02"},{"start":1007.4033333333331,"end":1008.5533333333331,"kr":"— 놓을게.","jp":"——手放す。","cut":"P02-S14-C05-02"},{"start":1008.573333333333,"end":1011.220133333333,"kr":"에잇, 이 몸답지 않아!","jp":"ええい、この私らしくない！","cut":"P02-S14-C05-02"},{"start":1011.240133333333,"end":1013.090133333333,"kr":"제일 밝게 터졌다!","jp":"一番明るく弾けた！","cut":"P02-S14-C05-02"},{"start":1013.110133333333,"end":1014.740133333333,"kr":"다들 봤지?!","jp":"みんな見たでしょ？！","cut":"P02-S14-C05-02"},{"start":1014.760133333333,"end":1017.0301333333331,"kr":"그럼— 됐어!!","jp":"なら——それでいい！！","cut":"P02-S14-C05-02"},{"start":1017.0501333333331,"end":1022.010133333333,"kr":"설령 잊게 되더라도— 있었던 밤이, 없던 밤이 되지는 않아요.","jp":"たとえ忘れてしまっても——あった夜が、なかった夜になるわけではありません。","cut":"P02-S14-C05-02"},{"start":1022.0301333333331,"end":1024.320133333333,"kr":"힘은— 돌려드릴게요.","jp":"力は——お返しします。","cut":"P02-S14-C05-02"},{"start":1024.3401333333331,"end":1028.300133333333,"kr":"이번에는, 아무도 잃지 않았어.","jp":"今度は、誰も失わなかった。","cut":"P02-S14-C05-02"},{"start":1028.320133333333,"end":1031.960133333333,"kr":"그러니까— 나도, 이제…… 놓을게……!","jp":"だから——私も、もう……手放す……！","cut":"P02-S14-C05-02"},{"start":1031.980133333333,"end":1036.630133333333,"kr":"히땅의 바람이 잦아들고, 네네링의 섬광도 사그라듭니다.","jp":"ヒーたんの風が静まり、ネネりんの閃光も消えていきます。","cut":"P02-S14-C05-02"},{"start":1036.650133333333,"end":1040.420133333333,"kr":"엔마루의 손을 떠난 등불도 빛을 잃습니다.","jp":"エンマルの手を離れた灯火も、光を失います。","cut":"P02-S14-C05-02"},{"start":1040.440133333333,"end":1043.021633333333,"kr":"레오나도 불꽃을 내려놓습니다.","jp":"レオナも炎を手放します。","cut":"P02-S14-C05-02"},{"start":1043.2916666666663,"end":1048.4216666666664,"kr":"그 시각, 목공소에 남은 쥬리땅도 마지막 유성을 거두죠.","jp":"その頃、木工所に残ったジュリたんも、最後の流星を収めます。","cut":"P02-S23-C02-workshop"},{"start":1048.4416666666664,"end":1051.6016666666662,"kr":"박수가 끝나도, 나는 나니까.","jp":"拍手が終わっても、私は私だから。","cut":"P02-S23-C02-workshop"},{"start":1051.6216666666662,"end":1053.9799666666663,"kr":"이 힘도— 놓을게.","jp":"この力も——手放すよ。","cut":"P02-S23-C02-workshop"},{"start":1054.2499999999995,"end":1058.1882999999996,"kr":"마법소녀 모두 스스로 힘을 내려놓았습니다.","jp":"魔法少女たちは皆、自ら力を手放しました。","cut":"P02-S23-C03-core-part2"},{"start":1058.4583333333328,"end":1060.332033333333,"kr":"입회인 권한으로.","jp":"立会人の権限において。","cut":"P02-S15-C01"},{"start":1060.3520333333329,"end":1062.5620333333327,"kr":"이 계약을, 파기한다!!","jp":"この契約を、破棄する！！","cut":"P02-S15-C01"},{"start":1062.582033333333,"end":1063.822033333333,"kr":"— 접수.","jp":"——受理。","cut":"P02-S15-C01"},{"start":1063.842033333333,"end":1069.6338333333329,"kr":"공통 원본이 찢어지자, 그 원본에 묶인 계약들이 함께 끝납니다.","jp":"共通原本が破られると、その原本に結ばれていた契約も共に終わります。","cut":"P02-S15-C01"},{"start":1071.1249999999995,"end":1072.1449999999995,"kr":"………어라.","jp":"………あら。","cut":"P02-S24-C02-larme"},{"start":1072.1649999999995,"end":1078.2449999999994,"kr":"……가벼워. 아아—— …이렇게, 놓는 거였구나.","jp":"……軽い。ああ——…こうやって、手放すものだったのね。","cut":"P02-S24-C02-larme"},{"start":1078.2649999999996,"end":1084.1466999999996,"kr":"비탄의 마녀, 라르므도 자신이 지은 시스템과 함께 풀려 소멸합니다.","jp":"悲嘆の魔女ラルムも、自ら築いた仕組みとともにほどけ、消滅します。","cut":"P02-S24-C02-larme"},{"start":1084.4166666666663,"end":1088.0633666666663,"kr":"소녀들은 돌아온 밤하늘을 올려다봅니다.","jp":"少女たちは、戻ってきた夜空を見上げます。","cut":"P02-S15-C03-02"},{"start":1088.333333333333,"end":1091.053333333333,"kr":"하지만 이리스도 흩어집니다.","jp":"けれど、イリスも散っていきます。","cut":"P02-S16-C01"},{"start":1091.073333333333,"end":1094.493333333333,"kr":"치코가 붙잡아도 이리스는 고개를 젓습니다.","jp":"チコが引き止めても、イリスは首を振ります。","cut":"P02-S16-C01"},{"start":1094.513333333333,"end":1098.911033333333,"kr":"무서움은 자신이 해 온 일의 변명이 될 수 없다고요.","jp":"怖かったということは、自分のしてきたことの言い訳にはならない、と。","cut":"P02-S16-C01"},{"start":1098.931033333333,"end":1102.896633333333,"kr":"정원을 다시 만들자는 치코에게 부탁을 남깁니다.","jp":"もう一度庭を作ろうというチコに、頼みを残します。","cut":"P02-S16-C01"},{"start":1103.1666666666663,"end":1108.6566666666663,"kr":"……그럼, 다음 정원은— 문이 있는 정원으로 해 줘요.","jp":"……じゃあ、次の庭は──扉のある庭にしてください。","cut":"P02-S16-C02-02"},{"start":1108.6766666666663,"end":1112.9383666666663,"kr":"들어오는 문과…… 나가는 문이, 있는.","jp":"入る扉と……出ていく扉が、ある庭に。","cut":"P02-S16-C02-02"},{"start":1113.208333333333,"end":1118.438333333333,"kr":"아이들이 다시 피기를 바라며, 이리스도 소멸합니다.","jp":"子どもたちがまた咲くことを願いながら、イリスもまた消えていきます。","cut":"P02-S16-C03"},{"start":1118.708333333333,"end":1121.978333333333,"kr":"살아남은 아이들에게도 대가가 찾아옵니다.","jp":"生き残った子どもたちにも、代価が訪れます。","cut":"P02-S17-C01"},{"start":1121.998333333333,"end":1127.896633333333,"kr":"레오나는 치코의 이름이 떠오르지 않고, 히스이는 왜 우는지 모릅니다.","jp":"レオナはチコの名を思い出せず、ヒスイはなぜ泣いているのかわかりません。","cut":"P02-S17-C01"},{"start":1128.1666666666663,"end":1131.3966666666663,"kr":"함께 싸운 밤들이 지워집니다.","jp":"ともに戦った夜が、消えていきます。","cut":"P02-S17-C01-02"},{"start":1131.6666666666663,"end":1137.1566666666663,"kr":"치코는 작은 일기장을 끌어안고, 잊기 전에 이름들을 적으려 합니다.","jp":"チコは小さな日記帳を抱きしめ、忘れる前に名前を書き留めようとします。","cut":"P02-S17-C02"},{"start":1137.1766666666663,"end":1145.5633666666663,"kr":"몇 번이나 연필을 떨어뜨리지만 다시 주워, 떠오르지 않는 이름의 자리에는 고맙다는 말이라도 남깁니다.","jp":"何度も鉛筆を落としながら、そのたびに拾い上げ、思い出せない名前の場所には、せめて、ありがとうと残します。","cut":"P02-S17-C02"},{"start":1145.833333333333,"end":1150.521633333333,"kr":"주군의 시야도 하얗게 바래고, 마침내 눈을 뜹니다.","jp":"主君の視界も白く薄れていき、やがて目を覚まします。","cut":"P02-S17-C03"}],"scenes":[{"id":"P02-S01","title":"오늘 밤을 지키는 치코링","start":0,"end":27.583333333333332,"file":"scenes/P02-S01.mp4?v=renumber-20261127","audio":{"kr":"scenes/P02-S01_kr.m4 261127"}</script><script>
const data=JSON.parse(document.getElementById('timeline').textContent),SC=data.scenes,video=document.getElementById('video'),cuts=document.getElementById('cuts');
let loadToken=0,currentIndex=-1,si=0,lang='kr',muted=false;
try{const v=localStorage.getItem('nnsLang');if(v==='kr'||v==='jp')lang=v;}catch(e){}
const A={kr:new Audio(),jp:new Audio()};for(const a of Object.values(A)){a.preload='auto';}
const cur=()=>A[lang];
const gtime=()=>SC[si].start+(video.currentTime||0);
const clock=t=>Math.floor(t/60)+':'+Math.floor(t%60).toString().padStart(2,'0');
function syncAudio(force){const a=cur();if(!a.src)return;if(a.readyState<1){if(!a._wait){a._wait=1;a.addEventListener('loadedmetadata',()=>{a._wait=0;syncAudio(true);},{once:true});}return;}const want=video.currentTime;if(force||Math.abs(a.currentTime-want)>.15){try{a.currentTime=want;}catch(e){}}a.playbackRate=video.playbackRate;a.muted=muted;
 for(const [k,o] of Object.entries(A))if(k!==lang&&!o.paused)o.pause();
 if(!video.paused&&!video.ended&&a.paused)a.play().catch(()=>{});if((video.paused||video.ended)&&!a.paused)a.pause();}
function load(i,t,play){const token=++loadToken;const want=play??!video.paused;si=i;video.src=SC[i].file;for(const k in A){A[k].src=SC[i].audio[k];A[k].load();}
 video.addEventListener('loadedmetadata',function f(){video.removeEventListener('loadedmetadata',f);if(token!==loadToken)return;video.currentTime=Math.max(0,t);video.playbackRate=Number(document.getElementById('speed').value);syncAudio(true);if(want)play_();update();});video.load();}
function play_(){video.play().catch(()=>{});const a=cur();try{a.currentTime=video.currentTime;}catch(e){}a.play().catch(()=>{});}
function seek(T){let i=SC.findIndex(x=>T>=x.start&&T<x.end);if(i<0)i=T<SC[0].start?0:SC.length-1;if(i===si&&video.readyState>0){video.currentTime=Math.max(0,T-SC[i].start);syncAudio(true);}else load(i,T-SC[i].start);}
data.cuts.forEach((c,i)=>{const b=document.createElement('button');b.dataset.index=i;b.innerHTML='<small>'+c.displayId+'</small><small>'+clock(c.start+data.lead)+'</small><span class="title"></span>';b.querySelector('.title').textContent=c.title;b.onclick=()=>{seek(c.start+data.lead+.02);update();};cuts.append(b)});
function update(){const time=gtime()-data.lead;currentIndex=data.cuts.findIndex(c=>time>=c.start&&time<c.end);for(const b of cuts.children){const active=Number(b.dataset.index)===currentIndex;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','true');else b.removeAttribute('aria-current')};const c=data.cuts[currentIndex];document.getElementById('current').textContent=c?c.displayId+' · '+c.title:gtime()<data.lead?'第2部':'エピローグへ';const q=c?.cues.filter(q=>q.scheduledTime<=time).at(-1);document.getElementById('cueInfo').textContent=q?'동작 '+q.step+' · '+q.action:c?'시작 배치':'마무리';document.getElementById('togglePlay').textContent=video.paused?'재생':'일시정지';document.getElementById('sceneSel').value=String(si);}
function setLang(l){lang=l;try{localStorage.setItem('nnsLang',l);}catch(e){}for(const b of document.querySelectorAll('.lang button'))b.setAttribute('aria-pressed',String(b.dataset.lang===l));for(const [k,o] of Object.entries(A))if(k!==l)o.pause();syncAudio(true);}
for(const b of document.querySelectorAll('.lang button'))b.onclick=()=>setLang(b.dataset.lang);
video.addEventListener('play',()=>{syncAudio(true);update();});video.addEventListener('playing',()=>syncAudio(true));
video.addEventListener('pause',()=>{for(const o of Object.values(A))o.pause();update();});video.addEventListener('waiting',()=>cur().pause());
video.addEventListener('seeked',()=>syncAudio(true));video.addEventListener('ratechange',()=>syncAudio(false));
video.addEventListener('timeupdate',()=>{update();syncAudio(false);});video.addEventListener('loadedmetadata',update);
video.addEventListener('ended',()=>{if(si<SC.length-1)load(si+1,0,true);else for(const o of Object.values(A))o.pause();});
document.getElementById('sceneSel').onchange=e=>load(Number(e.target.value),0);
document.getElementById('togglePlay').onclick=()=>video.paused?play_():video.pause();
document.getElementById('muteBtn').onclick=()=>{muted=!muted;for(const o of Object.values(A))o.muted=muted;document.getElementById('muteBtn').textContent=muted?'음소거 해제':'음소거'};
document.getElementById('speed').onchange=e=>{video.playbackRate=Number(e.target.value)};
document.getElementById('previous').onclick=()=>{const c=data.cuts[Math.max(0,currentIndex-1)];seek(c.start+data.lead+.02);update()};document.getElementById('next').onclick=()=>{const c=data.cuts[Math.min(data.cuts.length-1,currentIndex+1)];seek(c.start+data.lead+.02);update()};
document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();for(const b of cuts.children)b.hidden=!b.textContent.toLowerCase().includes(q)};
for(const k in A)A[k].src=SC[0].audio[k];setLang(lang);
</script></body></html>
