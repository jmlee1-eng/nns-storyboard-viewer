<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>매지컬・시노비 ~Le Jardin Clos~</title>
<style>
:root{
  --surface:#fcfcfb; --plane:#f9f9f7; --raise:#f2f1ee;
  --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --rule:#e1e0d9; --line:#c3c2b7; --ring:rgba(11,11,11,.10);
  --accent:#2a78d6; --mark:#eda100; --markink:#0b0b0b;
  --bad:#d03b3b; --badbg:#fdf0ef; --warn:#fab219; --good:#0ca30c;
  color-scheme:light;
}
html[data-theme="dark"]{
  --surface:#1a1a19; --plane:#0d0d0d; --raise:#232322;
  --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --rule:#2c2c2a; --line:#383835; --ring:rgba(255,255,255,.10);
  --accent:#3987e5; --mark:#c98500; --markink:#0d0d0d;
  --bad:#e66767; --badbg:#2a1a1a; --warn:#fab219; --good:#0ca30c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--plane); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",
    "Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}

/* ---------- 상단바 ---------- */
.top{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px;
  padding:0 16px; height:52px; background:var(--surface);
  border-bottom:1px solid var(--rule);
}
.brand{font-weight:700; letter-spacing:-.01em; white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);line-height:1.1}
.search{position:relative; flex:1; max-width:520px}
.search input{
  width:100%; height:34px; padding:0 84px 0 32px; border-radius:8px;
  background:var(--plane); border:1px solid var(--line); outline:none;
}
.search input:focus{border-color:var(--accent)}
.search .ico{position:absolute;left:10px;top:8px;color:var(--muted);font-size:13px}
.hitnav{
  position:absolute; right:5px; top:5px; display:flex; align-items:center; gap:2px;
  font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;
}
.hitnav button{padding:2px 6px;border-radius:5px;color:var(--ink2)}
.hitnav button:hover{background:var(--raise)}
.tools{display:flex;align-items:center;gap:6px;margin-left:auto}
.tg{
  padding:6px 11px; border-radius:7px; border:1px solid var(--line);
  font-size:13px; color:var(--ink2); white-space:nowrap;
}
.tg:hover{background:var(--raise)}
.tg[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

#tLint{display:none}
.pt-h{border-bottom:0;padding-bottom:0;margin-bottom:0}
.pt-h h1{font-size:20px}
/* ---------- 레이아웃 ---------- */
.wrap{display:grid; grid-template-columns:268px minmax(0,1fr) 0; height:calc(100vh - 52px)}
.wrap.side{grid-template-columns:268px minmax(0,1fr) 320px}
nav.toc,aside.side{overflow-y:auto; background:var(--surface); font-size:13.5px}
nav.toc{border-right:1px solid var(--rule); padding:10px 0 60px}
aside.side{border-left:1px solid var(--rule); padding:14px 14px 60px; display:none}
.wrap.side aside.side{display:block}
main{overflow-y:auto; padding:0 0 calc(100vh - 200px)}

.tabs{display:flex;gap:4px;padding:4px 10px 10px}
.tabs button{
  flex:1; padding:6px 0; border-radius:7px; font-size:13px;
  border:1px solid var(--line); color:var(--ink2);
}
.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.toc h4{
  margin:14px 0 4px; padding:0 14px; font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; color:var(--muted); font-weight:600;
}
.toc a{
  display:block; padding:5px 14px 5px 16px; color:var(--ink2);
  text-decoration:none; border-left:2px solid transparent;
}
.toc a.ep{font-weight:600;color:var(--ink);margin-top:6px}
.toc a.sc{padding-left:28px;font-size:12.5px;color:var(--muted)}
.toc a:hover{background:var(--raise);color:var(--ink)}
.toc a.on{border-left-color:var(--accent);background:var(--raise);color:var(--ink)}
.res{padding:2px 12px}
.res a{display:block;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink2)}
.res a:hover{background:var(--raise)}
.res .rw{font-size:11px;color:var(--muted);display:block;margin-bottom:2px}
.res .rt{color:var(--ink);font-size:13px;display:block;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{padding:20px 16px;color:var(--muted);font-size:13px}

/* ---------- 본문 ---------- */
.doc{max-width:760px;margin:0 auto;padding:28px 28px 0}
.pt-h{border-bottom:1px solid var(--rule);padding-bottom:18px;margin-bottom:8px}
.pt-h h1{font-size:22px;margin:0 0 10px;letter-spacing:-.01em;line-height:1.35}
.pt-h p{margin:3px 0;font-size:12.5px;color:var(--muted);line-height:1.55}
details.notes{margin:14px 0 0;border:1px solid var(--rule);border-radius:10px;background:var(--surface)}
details.notes summary{padding:10px 14px;cursor:pointer;font-size:13px;color:var(--ink2);font-weight:600}
details.notes div{padding:0 14px 12px;font-size:12.5px;color:var(--muted);line-height:1.7}
details.notes code{background:var(--plane);padding:1px 4px;border-radius:4px;font-size:11.5px}

.ep{margin:44px 0 0; scroll-margin-top:64px}
.ep > h2{
  font-size:19px; margin:0 0 4px; padding-bottom:10px;
  border-bottom:2px solid var(--line); letter-spacing:-.01em;
}
.sc{margin:26px 0 0; scroll-margin-top:64px; content-visibility:auto;
  contain-intrinsic-size:auto 1400px}
.sc > h3{
  font-size:14px; margin:0 0 14px; color:var(--accent); font-weight:600;
  letter-spacing:.01em;
}
.b{margin:0 0 9px}
.d{
  font-size:12.5px; color:var(--muted); line-height:1.55;
  padding-left:10px; border-left:2px solid var(--rule); margin:9px 0;
}
.d b{
  display:inline-block; min-width:44px; font-weight:600; font-size:11px;
  letter-spacing:.04em; color:var(--ink2); margin-right:6px;
}
.n{
  color:var(--narr); padding:2px 0 2px 14px; border-left:2px solid currentColor;
  margin:12px 0; line-height:1.75;
}
.l{display:grid; grid-template-columns:88px minmax(0,1fr); gap:10px; align-items:baseline;
  --sp:var(--ink2)}
.l .sp{
  font-weight:700; font-size:13px; text-align:right; color:var(--sp);
  overflow-wrap:anywhere; padding-top:1px;
}
.l .tx{line-height:1.75}
.l.mono .tx{color:var(--ink2)}
.p{color:var(--ink2);line-height:1.75;padding-left:14px}


body.nodir .d{display:none}
body.filtering .l:not(.hi){opacity:.24}
body.isolate .l:not(.hi){display:none}
body.isolate .d,body.isolate .n,body.isolate .p{opacity:.24}
.l.hi .tx{box-shadow:-7px 0 0 -3px var(--sp)}

mark{background:var(--mark);color:var(--markink);border-radius:2px;padding:0 1px}
mark.cur{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- 사이드 패널 ---------- */
.side h4{margin:6px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);font-weight:600}
.seg{display:flex;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:5px 0;font-size:12px;border:1px solid var(--line);
  border-radius:6px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  border:1px solid var(--line);font-size:12px;color:var(--ink2);
}
.chip:hover{background:var(--raise)}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--raise);color:var(--ink)}
.chip{--sp:var(--muted)}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--sp);flex:none}
.chip.una .dot{background:transparent;border:1.5px dashed var(--muted)}
.chip .n{all:unset;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11px}
.clr{font-size:12px;color:var(--accent);padding:4px 0}

.bars{margin-top:4px}
.bar{display:grid;grid-template-columns:60px minmax(0,1fr) 42px;gap:8px;
  align-items:center;margin-bottom:5px;font-size:12px}
.bar .nm{text-align:right;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.bar .tr{display:block;height:11px;background:var(--rule);border-radius:3px;overflow:hidden}
.bar .fl{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0;min-width:2px}
.bar .vl{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- 검수(린터) ---------- */
.tg.warn[aria-pressed="false"]{border-color:var(--bad);color:var(--bad)}
.tg.warn[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.tg .cnt{display:inline-block;margin-left:5px;padding:0 5px;border-radius:999px;
  background:var(--bad);color:#fff;font-size:11px;font-variant-numeric:tabular-nums}
.tg[aria-pressed="true"] .cnt{background:rgba(255,255,255,.28)}
.tg.ok[aria-pressed="false"]{border-color:var(--good);color:var(--good)}
.tg.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
body.lintOn .b.bad{
  background:var(--badbg); border-left:3px solid var(--bad);
  padding:4px 0 4px 9px; margin-left:-12px; border-radius:0 4px 4px 0;
}
.b.bad.cur{outline:2px solid var(--bad);outline-offset:2px}
.lz{border:1px solid var(--rule);border-radius:9px;padding:9px 11px;margin-bottom:7px;
  background:var(--surface);cursor:pointer;display:block;width:100%;text-align:left}
.lz:hover{background:var(--raise)}
.lz .hd{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.lz .sv{font-size:10px;padding:1px 6px;border-radius:4px;font-weight:700}
.lz .sv.v{background:var(--bad);color:#fff}
.lz .sv.c{background:var(--warn);color:#241a00}
.lz .rl{font-size:11.5px;font-weight:600;color:var(--ink)}
.lz .wh{font-size:10.5px;color:var(--muted);margin-bottom:3px}
.lz .tx{font-size:12px;color:var(--ink2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lz .dt{font-size:11px;color:var(--bad);margin-top:4px}
.pass{border:1px solid var(--good);border-radius:9px;padding:14px;text-align:center;
  color:var(--good);font-size:13px;font-weight:600;background:var(--surface)}
.pass small{display:block;font-weight:400;color:var(--muted);margin-top:5px;font-size:11.5px}
table.tv{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px}
table.tv th,table.tv td{padding:4px 6px;border-bottom:1px solid var(--rule);text-align:right}
table.tv th:first-child,table.tv td:first-child{text-align:left}
table.tv th{color:var(--muted);font-weight:600;font-size:11px}
table.tv td{font-variant-numeric:tabular-nums;color:var(--ink2)}
.note{font-size:11.5px;color:var(--muted);line-height:1.6;margin:10px 0 0}

/* 확정 캐릭터 색 스펙 — 기본값(.l/.chip)보다 뒤에 와야 이김 */
:root{--narr:#70757e}
.ci0{--sp:#2b2b2b}
.ci1{--sp:#df2d26}
.ci2{--sp:#058465}
.ci3{--sp:#946f0a}

.ci6{--sp:#007bb7}
.ci7{--sp:#d72883}
.ci8{--sp:#9f6a08}
.ci9{--sp:#5b2d91}
.ci10{--sp:#8a5a2b}

.ci12{--sp:#606dca}
.ci13{--sp:#2e2318}
.ci14{--sp:#b01030}
.ci15{--sp:#8266b8}
.ci16{--sp:#d63a42}
.ci17{--sp:#3b5bdb}
.ci18{--sp:#6b5b45}

.ci20{--sp:#a46079}
.ci21{--sp:#007083}
.ci22{--sp:#5a7240}
.ci23{--sp:#83587f}
.ci24{--sp:#74047c}
.ci25{--sp:#b9542f}
html[data-theme="dark"]{--narr:#8a8f98}
html[data-theme="dark"] .ci0{--sp:#e9e9e7}
html[data-theme="dark"] .ci1{--sp:#ef3f34}
html[data-theme="dark"] .ci2{--sp:#1f9e7a}
html[data-theme="dark"] .ci3{--sp:#e0a800}
html[data-theme="dark"] .ci4{--sp:#3fae2f}
html[data-theme="dark"] .ci5{--sp:#9ca5b4}
html[data-theme="dark"] .ci6{--sp:#4badeb}
html[data-theme="dark"] .ci7{--sp:#e73b90}
html[data-theme="dark"] .ci8{--sp:#d99000}
html[data-theme="dark"] .ci9{--sp:#976dd5}
html[data-theme="dark"] .ci10{--sp:#ce9a6a}
html[data-theme="dark"] .ci11{--sp:#b98cd9}
html[data-theme="dark"] .ci12{--sp:#6c7bd9}
html[data-theme="dark"] .ci13{--sp:#b0a294}
html[data-theme="dark"] .ci14{--sp:#e34c58}
html[data-theme="dark"] .ci15{--sp:#b196ec}
html[data-theme="dark"] .ci16{--sp:#e6494e}

html[data-theme="dark"] .ci18{--sp:#b3a28a}

html[data-theme="dark"] .ci20{--sp:#d790a9}

html[data-theme="dark"] .ci24{--sp:#bd5ac5}
html[data-theme="dark"] .ci25{--sp:#cb643f}

.mtabs{display:none}
@media (max-width:980px){
  .wrap,.wrap.side{grid-template-columns:1fr}
  nav.toc,aside.side{display:none}
  .brand small{display:none}
  .top{gap:8px;padding:0 10px}
  .tg{padding:6px 8px;font-size:12px}
  .mtabs{
    display:flex;gap:6px;position:sticky;top:0;z-index:30;
    padding:10px 14px;background:var(--plane);
    border-bottom:1px solid var(--rule);margin:0 -28px 8px;
  }
  .mtabs button{
    flex:1;padding:9px 0;border-radius:8px;font-size:14px;font-weight:600;
    border:1px solid var(--line);color:var(--ink2);background:var(--surface);
  }
  .mtabs button[aria-selected="true"]{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .doc{padding:0 20px 0}
  .l{grid-template-columns:64px minmax(0,1fr);gap:8px}
  .l .sp{font-size:12px}
}
</style>
</head>
<body>

<header class="top">
  <div class="brand">매지컬・시노비 <span style="font-weight:400;color:var(--muted)">~Le Jardin Clos~</span></div>
  <div class="search">
    <span class="ico">⌕</span>
    <input id="q" type="search" placeholder="전문 검색  (/ 로 포커스)" autocomplete="off">
    <span class="hitnav" id="hitnav" hidden>
      <span id="hitc">0</span>
      <button id="prev" title="이전 (Shift+Enter)">↑</button>
      <button id="next" title="다음 (Enter)">↓</button>
    </span>
  </div>
  <div class="tools">
    <button class="tg" id="tDir" aria-pressed="true">연출 지시</button>
    <button class="tg" id="tSide" aria-pressed="false">화자 · 통계</button>
    <button class="tg" id="tLint" aria-pressed="false">검수</button>
    <button class="tg" id="tTheme" aria-pressed="false" title="라이트/다크">◐</button>
  </div>
</header>

<div class="wrap" id="wrap">
  <nav class="toc" id="toc"></nav>
  <main id="main"><div class="doc" id="doc"></div></main>
  <aside class="side" id="side"></aside>
</div>

<script>

 얼굴이다— 라고? 처음 보는 눈을 한 상대에게?)","m":1},{"t":"d","g":"표정","x":"레오나(코스튬) = 미간"},{"t":"l","s":"레오나","c":"레오나","x":"대답. 일반인이 어떻게 이 시간에, '접힌 골목'에 들어와 있죠? 여기 서 있는 것 자체가 보통은 불가능한데."},{"t":"l","s":"주군","c":"주군","x":"……그걸 나도 알고 싶은 참이다. 정신을 차려 보니 여기 서 있었다. 그게 전부야."},{"t":"l","s":"레오나","c":"레오나","x":"정신을 차려 보니. ……그 말, 진짜예요?"},{"t":"l","s":"주군","c":"주군","x":"믿기 어렵겠지만."},{"t":"l","s":"레오나","c":"레오나","x":"안 믿기죠, 당연히. 그런데…… 거짓말하는 눈은 또 아니란 말이지."},{"t":"d","g":"표정","x":"레오나(코스튬) = 한숨"},{"t":"l","s":"레오나","c":"레오나","x":"하아…. 미아 어른이라는 거예요? 그 나이에?"},{"t":"l","s":"주군","c":"주군","x":"(부정할 말이 하나도 없다는 게 제일 아프군.)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"소지품은요. 신분증이라든가."},{"t":"l","s":"주군","c":"주군","x":"……공교롭게도, 빈손이다."},{"t":"l","s":"레오나","c":"레오나","x":"지갑도 없이 밤 산책. 점점 수상해지는데."},{"t":"l","s":"주군","c":"주군","x":"부정은 못 하겠군."},{"t":"l","s":"레오나","c":"레오나","x":"……솔직한 건 점수 줄게요."},{"t":"l","s":"주군","c":"주군","x":"(점수를 받아도 기쁘지 않은 건, 처음이군.)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"그리고 아까부터 궁금했는데. 그쪽, 괴이를 보고도 도망을 안 쳤죠. 보통은 소리부터 지르는데."},{"t":"l","s":"주군","c":"주군","x":"도망칠 곳이 안 보였을 뿐이다."},{"t":"l","s":"레오나","c":"레오나","x":"……그 침착함이 제일 수상하다니까."},{"t":"d","g":"표정","x":"레오나(코스튬) = 츳코미 자세"},{"t":"l","s":"레오나","c":"레오나","x":"…뭐, 좋아요. 괴이에게 안 잡아먹힌 것만 해도 운이 좋은 거니까. 나가는 길까지는 데려다줄게요. 단, 내 뒤에서 떨어지지 말 것. 알았죠?"},{"t":"l","s":"주군","c":"주군","x":"알았다. ……고맙군. 아까도, 지금도."},{"t":"l","s":"레오나","c":"레오나","x":"인사는 밖에 나가서 받을게요. 여긴 아직 '안'이니까."},{"t":"d","g":"SE","x":"나란해지지 않는 두 사람의 발소리"},{"t":"l","s":"레오나","c":"레오나","x":"모퉁이. 멈춰요."},{"t":"l","s":"주군","c":"주군","x":"……뭐가 있나?"},{"t":"l","s":"레오나","c":"레오나","x":"없으면 그냥 가면 되는 거고요. ……좋아, 없음. 가요."},{"t":"l","s":"주군","c":"주군","x":"(막힘이 없군. 대체 몇 번이나, 이런 밤을 걸었으면.)","m":1},{"t":"l","s":"주군","c":"주군","x":"아까 그건— '괴이'라고 했나. 저런 게 자주 나오는 건가?"},{"t":"l","s":"레오나","c":"레오나","x":"질문 금지…라고 하고 싶은데, 뭐, 그 정도는. — 나와요. 밤마다."},{"t":"l","s":"주군","c":"주군","x":"밤마다. ……그걸 너 혼자 상대하고 있는 건가?"},{"t":"l","s":"레오나","c":"레오나","x":"……. 손님. 질문이 두 개째부터는 유료예요."},{"t":"l","s":"주군","c":"주군","x":"(얼버무렸군. ……지금 한순간, 목소리가 낮아졌다.)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"그리고 하나 더. 오늘 본 건 밖에서 얘기하지 말 것. 아무도 안 믿어 주기도 하고— 믿는 사람이 있으면, 그게 더 골치 아프거든요."},{"t":"l","s":"주군","c":"주군","x":"(믿는 사람이 더 골치 아프다, 라. ……의미심장한 말이군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(하늘은 여전히 보라색이군. 걸어도 걸어도, 익숙해지지 않는 색이야.)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"출구까지는 이제 조금이에요. 발밑 조심해요."},{"t":"n","x":"앞장서 걷는 등은, 내가 아는 레오나 그대로였다. 보폭도, 어깨를 펴는 방식도."},{"t":"n","x":"그래서 더 — 낯설었다."},{"t":"l","s":"주군","c":"주군","x":"(겉모습은 전부 그대로다. 나만 지워져 있어. ……이 세계는 대체 뭐지.)","m":1}]},{"id":"p0-e1-s1","title":"1-2. 골목 끝 — 「골동품상과 여우 인형」","blocks":[{"t":"d","g":"배경","x":"골목 끝의 낡은 골동품상 — 등불 하나, 잡동사니 산더미. 안쪽 선반에, 소리 없는 낡은 축음기와 통 몇 개"},{"t":"d","g":"BGM","x":"오래된 축음기풍 왈츠 (작게)"},{"t":"d","g":"SE","x":"풍경(風鈴), 삐걱이는 마루"},{"t":"n","x":"골목을 빠져나가기 직전, 등불 켜진 가게 하나가 나타났다. 지도에 없을 것 같은 가게였다."},{"t":"n","x":"처마 밑에 사내가 하나 — 곰방대를 문 중년의 사내가 — 이쪽을 보고 있었다. 처음 보는 얼굴이었다."},{"t":"d","g":"표정","x":"하케 = 능청"},{"t":"l","s":"하케","c":"하케","x":"어이쿠. 산 사람이 걸어 나오는군. 오늘 밤 골목에서, 게다가 멀쩡한 낯짝으로."},{"t":"d","g":"표정","x":"주군 = 정지"},{"t":"l","s":"주군","c":"주군","x":"(—하케 씨다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(얼굴은 하나도 겹치지 않는다. 털도, 수염도, 그 뾰족한 귀도 없다. 사람의 낯이다. ……그런데도 안다. 저 목소리. 저 말버릇. 남의 사정을 다 아는 척하면서 정작 아무것도 말해 주지 않는 저 능청. — 저건 하케 씨야.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(……이 세계는 얼굴을 바꾸는 게 아니라, 배역을 바꾸는군. 저 사람에게는— 사람의 몸을 줬나.)","m":1},{"t":"d","g":"표정","x":"레오나(코스튬) = 익숙한 한숨"},{"t":"l","s":"레오나","c":"레오나","x":"사장님. 가게 좀 닫아요. 결계 예보 뜬 밤마다 열어 두면 어떡해요."},{"t":"l","s":"하케","c":"하케","x":"닫으면 뭐 하나. 골목이란 건, 문을 닫아도 스며드는 법인데."},{"t":"l","s":"레오나","c":"레오나","x":"그런 무서운 소리를 아무렇지도 않게 하지 마시고요."},{"t":"d","g":"표정","x":"하케 = 껄껄"},{"t":"l","s":"하케","c":"하케","x":"장사란 건 말이야, 손님이 올 때 여는 거지. 그리고 오늘 밤은 — 아주 큰 손님이 오셨거든."},{"t":"l","s":"레오나","c":"레오나","x":"큰 손님……?"},{"t":"n","x":"사내의 눈이 나를 향했다. 능청스러운 낯 뒤에서, 눈만은 웃고 있지 않았다."},{"t":"l","s":"주군","c":"주군","x":"(……이 남자, 뭘 알고 있는 건가?)","m":1},{"t":"l","s":"주군","c":"주군","x":"큰 손님이라니. 나는 길을 잃은 것뿐이다만."},{"t":"d","g":"표정","x":"하케 = 능청"},{"t":"l","s":"하케","c":"하케","x":"길을 잃은 게 아니라, 길이 자네를 주운 걸 수도 있지 않겠나. 자, 이거."},{"t":"d","g":"SE","x":"툭 (품에 안기는 소리)"},{"t":"n","x":"그는 대답할 틈도 주지 않고, 내 품에 무언가를 떠넘겼다. — 여우 인형 한 쌍이었다."},{"t":"d","g":"표정","x":"주군 = 경악"},{"t":"l","s":"주군","c":"주군","x":"(와카와…… 타마?! 왜 이 인형이 여기에!)","m":1},{"t":"n","x":"네코다니에서, 치코의 곁에 늘 있던 그 인형들이었다. 낡은 정도까지 똑같았다."},{"t":"l","s":"주군","c":"주군","x":"(털이 닳은 자리까지 같다……. 아니, 그럴 리가. 우연이다. 우연이라고, 해 두자.)","m":1},{"t":"l","s":"주군","c":"주군","x":"이봐, 이건—"},{"t":"d","g":"표정","x":"하케 = 손사래"},{"t":"l","s":"하케","c":"하케","x":"값은 안 받네. 그건 파는 물건이 아니라, 주인을 고르는 물건이라서 말이야. 이 가게에 굴러들어온 지 오래됐네만…… 오늘에서야 골랐군."},{"t":"l","s":"주군","c":"주군","x":"주인을 고른다니. 인형이, 말인가?"},{"t":"l","s":"하케","c":"하케","x":"물건이란 게 원래 그래. 오래 묵으면 고집이 생기지. 그 녀석들은 특히 고집이 세서 말이야."},{"t":"l","s":"주군","c":"주군","x":"(농담인지 진담인지 알 수 없는 얼굴이군. ……아니. 이 남자는, 처음부터 전부 진담인지도 모르지.)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"저기요, 사장님. 그런 걸 초면인 사람한테 떠넘겨요?"},{"t":"l","s":"하케","c":"하케","x":"초면? 물건과 사람 사이엔 초면이란 게 없어. 만나야 할 때 만날 뿐이지."},{"t":"d","g":"표정","x":"레오나(코스튬) = 수상쩍음"},{"t":"l","s":"레오나","c":"레오나","x":"……사장님. 그 인형, 설마."},{"t":"d","g":"표정","x":"하케 = 곰방대 연기"},{"t":"l","s":"하케","c":"하케","x":"글쎄다. 나는 그저 골동품상일 뿐이야. 물건의 내력까지는 보증 못 하지."},{"t":"l","s":"레오나","c":"레오나","x":"그 '그저 골동품상'이 제일 수상하다는 얘기, 몇 번째인지 아세요?"},{"t":"l","s":"하케","c":"하케","x":"하하. 수상한 가게일수록 좋은 물건이 있는 법이지."},{"t":"l","s":"주군","c":"주군","x":"……하나 묻지. 이 인형, 언제부터 이 가게에 있었나?"},{"t":"l","s":"하케","c":"하케","x":"글쎄. 내가 세는 걸 그만둘 만큼은 됐지."},{"t":"l","s":"주군","c":"주군","x":"(대답 같으면서, 하나도 대답이 아니군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(……안쪽 선반의 저 축음기. 바늘도 없이 놓여 있는데— 어째서인지, 자꾸 눈이 가는군.)","m":1},{"t":"l","s":"하케","c":"하케","x":"아, 그건 안 팔아."},{"t":"l","s":"주군","c":"주군","x":"……아직 아무 말도 안 했다만."},{"t":"l","s":"하케","c":"하케","x":"눈이 말했지. 손님, 물건 보는 눈은 나쁘지 않아."},{"t":"d","g":"표정","x":"레오나(코스튬) = 목소리 낮춤"},{"t":"l","s":"레오나","c":"레오나","x":"……저 사람하고는 흥정하려고 하지 마요. 이기는 걸 본 적이 없으니까."},{"t":"l","s":"하케","c":"하케","x":"다 들리는데."},{"t":"l","s":"레오나","c":"레오나","x":"들으라고 한 소리예요."},{"t":"n","x":"그는 그렇게 말하고, 처마의 등불을 훅 껐다. 어둠 속에서 마지막으로 목소리만 남았다."},{"t":"l","s":"하케","c":"하케","x":"주울 사람이 주웠군. ……잘 부탁하네, 계약자 양반."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(계약자……?)","m":1},{"t":"n","x":"계약자. 이 세계가 나를 부르는 이름은, 그것뿐이었다."},{"t":"n","x":"'주군'이라고 부르는 사람은 — 아무도 없었다."},{"t":"d","g":"표정","x":"레오나(코스튬) = 떨떠름"},{"t":"l","s":"레오나","c":"레오나","x":"……사장님이 물건을 공짜로 주는 건 처음 보네. 당신, 정말 뭐예요?"},{"t":"l","s":"주군","c":"주군","x":"그 질문, 오늘 밤 몇 번째지?"},{"t":"l","s":"레오나","c":"레오나","x":"답을 안 들었으니까 계속하는 거예요."},{"t":"l","s":"주군","c":"주군","x":"나야말로 묻고 싶다. ……이 도시는 뭐지? 아까 그 괴물은? 그리고 너— 아니, 너희 '마법소녀'는 뭐냐?"},{"t":"d","g":"표정","x":"레오나(코스튬) = 잠깐 침묵 → 어깨 으쓱"},{"t":"l","s":"레오나","c":"레오나","x":"그거, 설명하자면 긴데. …뭐, 좋아요. 오늘 밤 목숨 주운 기념으로, 기초 강의 정도는 해 줄게요. 걸으면서."},{"t":"l","s":"레오나","c":"레오나","x":"우선 첫째. 밤이 되면, 공간이 '접히는' 일이 있어요. 아까 그 골목처럼. 접힌 안쪽엔 괴이가 살고요."},{"t":"l","s":"주군","c":"주군","x":"접힌다……. 아까 '접힌 골목'이라고 했던 게 그건가."},{"t":"l","s":"레오나","c":"레오나","x":"그래요. 보통 사람은 접힌 데를 잘 못 봐요. 무의식적으로, 피해서 걷죠. — 가끔, 이상할 만큼 잘 보는 사람도 있지만요. ……그러니까, 그 안에 태연히 서 있던 그쪽이 이상하다는 거고."},{"t":"l","s":"주군","c":"주군","x":"둘째는?"},{"t":"l","s":"레오나","c":"레오나","x":"둘째. 괴이는 우리가— '마법소녀'가 태워요. 그게 일이에요."},{"t":"l","s":"주군","c":"주군","x":"어디서 오는 건가, 그건."},{"t":"l","s":"레오나","c":"레오나","x":"몰라요. — 아무도 안 밝혔고, 밝힐 시간도 없어요. 접히면 나오고, 나오면 태워요. 그게 다예요."},{"t":"l","s":"주군","c":"주군","x":"일이라. ……보수라도 나오는 건가?"},{"t":"l","s":"레오나","c":"레오나","x":"……. 셋째. 마법소녀에 대한 질문은, 별로 안 받아요."},{"t":"l","s":"주군","c":"주군","x":"(둘째에서 셋째로 넘어가는 속도가 빨랐군. ……건드리면 안 되는 곳이 어딘지는 알겠다.)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"넷째. 밤에 돌아다니지 말 것. 특히 결계 예보 뜬 밤엔. 알았어요?"},{"t":"l","s":"주군","c":"주군","x":"예보는 어디서 보지?"},{"t":"l","s":"레오나","c":"레오나","x":"……일반인은 못 봐요. 그러니까 그냥, 밤엔 나오지 마요."},{"t":"l","s":"주군","c":"주군","x":"……선처하지."},{"t":"l","s":"레오나","c":"레오나","x":"그 대답, 하나도 안 지킬 사람의 대답인데."},{"t":"l","s":"레오나","c":"레오나","x":"아, 그리고 그 인형. 집에 가면 소금이라도 뿌려 두는 게 좋을 거예요."},{"t":"l","s":"주군","c":"주군","x":"……진심으로 하는 말인가?"},{"t":"l","s":"레오나","c":"레오나","x":"반쯤은요. 나머지 반은…… 그냥, 마음에 안 들어서. 그거."},{"t":"n","x":"보라색 하늘 아래를, 나는 인형 두 개를 안고 걸었다."},{"t":"n","x":"그 밤, 나는 이 세계에서 나만이 '바깥'을 기억한다는 걸 알았다. — 그리고 품속의 인형이, 아주 조금 따뜻하다는 것도."},{"t":"l","s":"주군","c":"주군","x":"(……돌아가는 방법을 찾는다. 그때까지는, 지켜봐 주마. 이 세계가 뭘 하려는 건지.)","m":1}]}]},{"id":"p0-e2","title":"2화 「유령불」","scenes":[{"id":"p0-e2-s0","title":"2-1. 낮 — 「평범한 중학생」","blocks":[{"t":"d","g":"배경","x":"낮의 통학로 — 벚나무 가로수, 편의점, 학교 정문"},{"t":"d","g":"BGM","x":"잔잔한 일상곡 (단조 편곡 — 어딘가 옅게 그늘진)"},{"t":"d","g":"SE","x":"등교 소음, 자전거 벨"},{"t":"n","x":"이 도시의 낮은 놀랄 만큼 평범했다. 교복, 하굣길, 편의점 앞의 웃음소리."},{"t":"n","x":"레오나가 잡아 준 싸구려 하숙집에서 사흘. 나는 도시를 걸으며 아는 얼굴들을 하나씩 발견했다 — 나를 모르는, 아는 얼굴들을."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(쿠로코는 목공소, 타이가는 학생회, 료는…… 도서관인가. 배역만 바뀐 연극을 보는 기분이군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(며칠을 봐도 익숙해지질 않아. 말을 걸어 볼까 몇 번이나 생각했다만— 레오나 때와 같은 눈을 또 볼 자신이, 아직 없군.)","m":1},{"t":"d","g":"SE","x":"자전거 벨, 뛰는 발소리"},{"t":"l","s":"학생A","c":"학생A","x":"야, 뛰어! 지각이야, 지각!"},{"t":"l","s":"학생B","c":"학생B","x":"잠깐, 가방! 가방 열렸다니까!"},{"t":"l","s":"주군","c":"주군","x":"(평화롭군. 어이가 없을 만큼. ……그 밤의 골목과 같은 도시라는 게, 믿기지 않아.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(그리고 아무도 밤 이야기를 하지 않는다. 기억에 남지 않는 건가— 아니면, 남지 않게 되어 있는 건가.)","m":1},{"t":"d","g":"배경","x":"편의점 앞 (지나침)"},{"t":"l","s":"행인A","c":"행인A","x":"아 맞다, 너 그 얘기 들었어? 마법소녀 목격담."},{"t":"l","s":"행인B","c":"행인B","x":"또 그 얘기야? 어차피 합성이라니까, 그런 거."},{"t":"l","s":"행인A","c":"행인A","x":"아니라니까~. 우리 사촌이 진짜로 봤다니까? 밤하늘이 진짜로 반짝였대."},{"t":"l","s":"행인B","c":"행인B","x":"네네. 됐고, 늦겠다. 뛰자."},{"t":"l","s":"주군","c":"주군","x":"(마법소녀는 낮의 소문거리인가. 밤의 괴이는 아무도 모르는데, 싸우는 쪽만 유명하다니— 묘하게 뒤틀린 유명세군.)","m":1},{"t":"n","x":"그리고 학교 정문 앞. 그 아이가 있었다."},{"t":"d","g":"표정","x":"아카리 = 활짝"},{"t":"l","s":"아카리","c":"아카리","x":"치코쨩! 내일 디저트 신상 나오는 날이다? 같이 가자!"},{"t":"d","g":"표정","x":"치코 = 움츠림 → 배시시"},{"t":"l","s":"치코","c":"치코","x":"으, 응…! 가, 갈래…!"},{"t":"l","s":"아카리","c":"아카리","x":"좋았어, 약속! 방과 후에 정문에서! 잊어버리기 없기다?"},{"t":"l","s":"치코","c":"치코","x":"이, 잊어버리지, 않아…. 야, 약속……."},{"t":"l","s":"아카리","c":"아카리","x":"근데 치코쨩, 신상 몇 개까지 먹을 거야? 나 용돈이 좀 위기라서 말이지~."},{"t":"l","s":"치코","c":"치코","x":"어…… 하, 하나…? 하나면, 충분해……."},{"t":"l","s":"아카리","c":"아카리","x":"하나라니! 신상은 최소 두 개부터라구~."},{"t":"l","s":"치코","c":"치코","x":"두, 두 개는…… 사, 사치야……."},{"t":"l","s":"아카리","c":"아카리","x":"아하하, 뭐야 그거~. 치코쨩, 그런 건 또 진지한 얼굴로 말한다니까."},{"t":"l","s":"아카리","c":"아카리","x":"좋아, 치코쨩 몫까지 내가 고민해 줄게! 이래 봬도 신상은 전문이거든!"},{"t":"d","g":"표정","x":"치코 = 작게 웃음"},{"t":"l","s":"치코","c":"치코","x":"으, 응…… 미, 믿을게……."},{"t":"n","x":"오니카사 치코. 여기서는 신사도, 무녀복도, 와카도 타마도 없는 — 그저 평범한 중학생이었다."},{"t":"n","x":"말더듬도, 반 박자 늦게 웃는 버릇도 그대로였다. 그게 이상하게 안심됐고, 같은 만큼 불안했다."},{"t":"l","s":"주군","c":"주군","x":"(달라진 건 세계뿐이고, 저 아이는 저 아이 그대로다. ……그렇다면 저 아이의 '무서움'도, 그대로겠지.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(저 웃는 얼굴에서 밤의 그림자부터 찾는 건— 내 쪽의 나쁜 버릇이군.)","m":1},{"t":"l","s":"학생A","c":"학생A","x":"치코, 아카리! 먼저 간다~!"},{"t":"l","s":"아카리","c":"아카리","x":"아, 응! 이따 봐~!"},{"t":"l","s":"치코","c":"치코","x":"이, 이따 봐……."},{"t":"l","s":"아카리","c":"아카리","x":"아 맞다, 숙제! 치코쨩, 수학 했어? 나 마지막 문제 백지인데."},{"t":"l","s":"치코","c":"치코","x":"어…… 해, 했는데…… 마, 맞는지는, 몰라……."},{"t":"l","s":"아카리","c":"아카리","x":"보여줘 보여줘! 치코쨩 답은 대체로 맞아!"},{"t":"l","s":"치코","c":"치코","x":"대, 대체로라니……."},{"t":"l","s":"아카리","c":"아카리","x":"아, 베끼는 건 아니고? 참고! 참고하는 거야!"},{"t":"d","g":"표정","x":"치코 = 곤란한 웃음"},{"t":"l","s":"치코","c":"치코","x":"으, 응…… 그, 그럼…… 참고로……."},{"t":"d","g":"표정","x":"아카리 = 종알종알"},{"t":"l","s":"아카리","c":"아카리","x":"있지있지, 어제 그거 봤어? 마법소녀! 우리 동네에도 진짜 나온대! 유성의 소녀! 나 사인 받고 싶은데~."},{"t":"l","s":"아카리","c":"아카리","x":"유성의 소녀 말이야, 밤하늘을 별똥별처럼 슝— 지나간대! 사진은 다 흔들려서 못 찍힌대~."},{"t":"l","s":"치코","c":"치코","x":"벼, 별똥별…… 그, 그렇게, 빨리…?"},{"t":"d","g":"표정","x":"치코 = 겁먹음"},{"t":"l","s":"치코","c":"치코","x":"마, 마법소녀…… 그, 그거, 위험한 거 아니야…? 싸, 싸우는 거잖아……."},{"t":"d","g":"표정","x":"아카리 = 갸웃"},{"t":"l","s":"아카리","c":"아카리","x":"에~ 멋있잖아! 치코쨩은 무서워?"},{"t":"d","g":"표정","x":"치코 = 우물쭈물"},{"t":"l","s":"치코","c":"치코","x":"무, 무섭지…. 무섭지만…… 그, 멋있다고도, 생각해…. 조, 조금은."},{"t":"n","x":"조금은, 이라고 말하는 치코의 눈이 잠깐 — 아주 잠깐, 하늘을 봤다."},{"t":"l","s":"주군","c":"주군","x":"(……저 눈은 안 되는데. 저건, 동경하는 눈이다.)","m":1},{"t":"l","s":"아카리","c":"아카리","x":"근데 마법소녀는 어디서 오는 걸까? 변신은 어떻게 하는 거지? 계약, 같은 거 하나?"},{"t":"l","s":"치코","c":"치코","x":"계, 계약…?"},{"t":"l","s":"아카리","c":"아카리","x":"만화에서는 그렇잖아~. 신비한 생물이 나타나서, 「소녀여, 계약하자」 하는 거!"},{"t":"l","s":"주군","c":"주군","x":"(계약, 이라. ……그 골동품상이 말한 '계약자'라는 단어가, 왠지 뒤통수를 스치는군.)","m":1},{"t":"l","s":"치코","c":"치코","x":"그, 그런 거 오면…… 나, 나는 도망칠 거야…. 무, 무서우니까……."},{"t":"l","s":"아카리","c":"아카리","x":"에~ 아깝다! 나라면 바로 「할게요!」 할 텐데!"},{"t":"l","s":"치코","c":"치코","x":"아, 아카리쨩은…… 요, 용감하니까……."},{"t":"l","s":"아카리","c":"아카리","x":"치코쨩도 하면 되잖아~. 이래 봬도 나는 알거든? 치코쨩, 하면 하는 애라는 거."},{"t":"l","s":"치코","c":"치코","x":"……그, 그런 거…… 아니야……."},{"t":"l","s":"아카리","c":"아카리","x":"그런 거 맞다니까~? 뭐, 본인이 아니라면 아닌 걸로 해 두지요~."},{"t":"l","s":"치코","c":"치코","x":"무, 뭐야…… 그, 그 말투……."},{"t":"l","s":"주군","c":"주군","x":"(도망칠 거야, 라면서— 방금 '멋있다'고 말한 입으로 말하는군. ……모순이 아니지. 그 둘은, 늘 붙어 다니는 법이니까.)","m":1},{"t":"d","g":"SE","x":"예비종"},{"t":"l","s":"아카리","c":"아카리","x":"앗, 종! 뛰자, 치코쨩!"},{"t":"l","s":"치코","c":"치코","x":"으, 응! 기, 기다려…!"},{"t":"l","s":"주군","c":"주군","x":"(……그나저나, 나는 왜 아침부터 인형 두 개를 품에 넣고 다니는 건지. 두고 나오려고 할 때마다, 묘하게 손이 안 떨어져서 말이지.)","m":1},{"t":"d","g":"표정","x":"와카 = 인형(품 속에서 꼼지락)"},{"t":"l","s":"와카","c":"와카","x":"(…찾았다.)"},{"t":"d","g":"표정","x":"주군 = 흠칫"},{"t":"l","s":"주군","c":"주군","x":"(지금, 품속에서 목소리가……?)","m":1}]},{"id":"p0-e2-s1","title":"2-2. 밤 — 「접힌 거리」","blocks":[{"t":"d","g":"배경","x":"밤의 상점가 — 공간이 유리처럼 비틀려 '접힌' 결계 내부"},{"t":"d","g":"BGM","x":"결계 테마 — 역재생된 오르골"},{"t":"d","g":"SE","x":"유리 긁는 소리, 멀어지는 도시 소음"},{"t":"d","g":"이펙트","x":"화면 가장자리 만화경처럼 굴절"},{"t":"n","x":"그 밤, 거리 하나가 통째로 '접혔다'."},{"t":"n","x":"유리처럼 비틀린 공간. 간판의 글자가 녹아내리고, 가로등 불빛이 꽃잎 모양으로 일그러졌다. — 결계. 레오나의 기초 강의에서 배운, 괴이의 둥지였다."},{"t":"n","x":"하숙집으로 돌아가던 길이었다. ……반쯤은, 순찰 같은 밤 산책이 되어 있었지만."},{"t":"l","s":"주군","c":"주군","x":"(공기가 이상하다. 소리가— 한 겹, 멀어.)","m":1},{"t":"d","g":"표정","x":"주군 = 긴장"},{"t":"l","s":"주군","c":"주군","x":"(하필 상점가 한복판에. ……잠깐. 저 안에, 사람이—)","m":1},{"t":"n","x":"결계 안쪽. 무너진 자판기 옆에, 주저앉은 교복 차림이 보였다. — 치코였다."},{"t":"l","s":"주군","c":"주군","x":"(들어갈 수 있나— 아니, 생각할 시간에 발을 넣어라. 그 밤에도 서 있었잖나, '안'에!)","m":1},{"t":"d","g":"표정","x":"치코 = 공포(주저앉음)"},{"t":"l","s":"치코","c":"치코","x":"히익……! 시, 싫어…… 뭐야, 이거…… 아, 아카리 쨩…? 아무도, 없어……?"},{"t":"l","s":"치코","c":"치코","x":"누, 누가…… 누구 없어요……! 사, 사람…… 살려……."},{"t":"d","g":"SE","x":"그르르르……"},{"t":"l","s":"치코","c":"치코","x":"히익……! 오, 오지 마…… 오지 마아……!"},{"t":"n","x":"어둠이 세 갈래로 갈라지며, 괴이가 일어섰다. 치코는 도망치지 못했다. 다리가 풀려서, 뒷걸음질조차 못 하고 있었다."},{"t":"l","s":"주군","c":"주군","x":"(—달려간다. 생각은 그다음이다!)","m":1},{"t":"l","s":"주군","c":"주군","x":"이쪽이다! 이쪽을 봐!"},{"t":"d","g":"SE","x":"돌멩이가 양철 간판을 때리는 소리"},{"t":"l","s":"주군","c":"주군","x":"(좋아, 머리 하나가 이쪽을 봤다! ……그래, 그대로. 저 아이가 아니라 이쪽을 봐라!)","m":1},{"t":"l","s":"치코","c":"치코","x":"누, 누구……?"},{"t":"l","s":"주군","c":"주군","x":"괜찮다! 나를 봐라— 일어설 수 있나!"},{"t":"l","s":"치코","c":"치코","x":"다, 다리가…… 아, 안 움직여요……!"},{"t":"l","s":"주군","c":"주군","x":"그럼 그대로 있어라! 내가 간다!"},{"t":"l","s":"치코","c":"치코","x":"오, 오면 안 돼요…… 무, 물려요……!"},{"t":"l","s":"주군","c":"주군","x":"알고 있다! 알고서 가는 거다!"},{"t":"l","s":"주군","c":"주군","x":"(셋 중 둘이 이쪽으로 돌았다. ……좋지 않은 주목이다만, 저 아이한테서 떨어졌으면 됐다!)","m":1},{"t":"d","g":"SE","x":"콰앙!!"},{"t":"d","g":"이펙트","x":"홍련의 섬광"},{"t":"d","g":"표정","x":"레오나(코스튬) = 전투 개시"},{"t":"l","s":"레오나","c":"레오나","x":"[홍련의 소녀] — 참전! 계약자 씨, 애 데리고 물러나요! 화상 입어도 몰라!"},{"t":"l","s":"주군","c":"주군","x":"맡겼다! — 자, 아가씨. 실례한다!"},{"t":"l","s":"치코","c":"치코","x":"히익……!"},{"t":"l","s":"주군","c":"주군","x":"(가볍군……. 아니, 지금은 달리는 게 먼저다!)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"하나—!"},{"t":"d","g":"SE","x":"화르륵!"},{"t":"l","s":"레오나","c":"레오나","x":"둘—! ……쯧, 마지막 놈, 빠르네!"},{"t":"d","g":"이펙트","x":"어둠 하나가 지붕 위로 도약"},{"t":"l","s":"레오나","c":"레오나","x":"계약자 씨, 그대로 고개 숙여요! 바람 넣을 거니까!"},{"t":"l","s":"주군","c":"주군","x":"(바람? — 불길의 길을 낸다는 건가!)","m":1},{"t":"d","g":"이펙트","x":"화염, 소용돌이치며 상공으로"},{"t":"l","s":"레오나","c":"레오나","x":"도망 못 가. — 셋."},{"t":"d","g":"SE","x":"콰아앙!"},{"t":"n","x":"화염이 밤을 찢었다. 레오나는 세 갈래의 어둠을 하나씩, 정확하게 태워 나갔다. 군더더기 없는 — 몇 번이고 반복해 온 자의 움직임이었다."},{"t":"d","g":"표정","x":"치코 = 넋을 잃음"},{"t":"l","s":"치코","c":"치코","x":"…………아."},{"t":"n","x":"치코는 내 팔 안에서, 도망치는 것도 잊고 그 등을 올려다보고 있었다."},{"t":"l","s":"치코","c":"치코","x":"부, 불이…… 춤추고, 있어……."},{"t":"l","s":"주군","c":"주군","x":"(숨 쉬는 걸 잊고 있군, 이 아이. ……무리도 아니지.)","m":1},{"t":"d","g":"표정","x":"치코 = 작게"},{"t":"l","s":"치코","c":"치코","x":"……멋있, 다……."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………………들었다. 지금 그 말은, 못 들은 걸로 하고 싶은데.)","m":1},{"t":"d","g":"SE","x":"화르륵—— (마지막 괴이 소멸)"},{"t":"d","g":"이펙트","x":"결계 붕괴 — 유리가 원래대로 '펴지는' 연출"},{"t":"d","g":"표정","x":"레오나(코스튬) = 한숨 → 점검"},{"t":"l","s":"레오나","c":"레오나","x":"잔당 없음, 결계 해제. ……계약자 씨, 그 애 다친 데는?"},{"t":"l","s":"주군","c":"주군","x":"없다. 놀랐을 뿐이야. ……네 덕분에."},{"t":"l","s":"레오나","c":"레오나","x":"그쪽은요. 무모하게 뛰어드는 건 여전하고."},{"t":"l","s":"주군","c":"주군","x":"결과적으로는 무사하다."},{"t":"l","s":"레오나","c":"레오나","x":"'결과적으로는'이라는 말, 오래 살 사람 입에서는 잘 안 나오는 말인데."},{"t":"l","s":"주군","c":"주군","x":"(뼈아픈 지적이군.)","m":1},{"t":"l","s":"레오나","c":"레오나","x":"……요즘 많네요, 이런 거. 지키는 손은 그대로인데."},{"t":"l","s":"주군","c":"주군","x":"혼자서 계속 감당할 셈인가?"},{"t":"l","s":"레오나","c":"레오나","x":"그 질문, 유료라고 했을 텐데요. — 자, 다음."},{"t":"d","g":"표정","x":"레오나(코스튬) = 치코에게 쪼그려 앉음"},{"t":"l","s":"레오나","c":"레오나","x":"아가씨. 오늘 본 건 나쁜 꿈이야. 집에 가서, 따뜻한 거 마시고, 푹 자. 그럼 아침엔 다 잊어버려. 알았지?"},{"t":"l","s":"치코","c":"치코","x":"꾸, 꿈……."},{"t":"l","s":"레오나","c":"레오나","x":"그래, 꿈. 집 방향은? 혼자 갈 수 있겠어?"},{"t":"l","s":"치코","c":"치코","x":"가, 갈 수…… 있어요…… 아, 아마……."},{"t":"d","g":"표정","x":"치코 = 붙잡을 듯"},{"t":"l","s":"치코","c":"치코","x":"저, 저기……! 그…… 이름……!"},{"t":"d","g":"표정","x":"레오나(코스튬) = 등을 보인 채, 손만 흔든다"},{"t":"l","s":"레오나","c":"레오나","x":"[홍련의 소녀]. — 이름은, 몰라도 돼."},{"t":"l","s":"치코","c":"치코","x":"……가, 가르쳐 주지도 않고…… 가, 가 버렸어……."},{"t":"l","s":"주군","c":"주군","x":"(그 등에 대고 말해도 소용없다, 아가씨. 저건— 이름을 주지 않는 게 다정함이라고 믿는 등이야.)","m":1},{"t":"n","x":"레오나는 지붕 위로 사라졌다. 남겨진 치코는, 그녀가 사라진 밤하늘을 오래 올려다보고 있었다."},{"t":"n","x":"그 눈에 든 것이 공포가 아니라 동경이라는 걸 — 나는 이미 알고 있었다."},{"t":"l","s":"주군","c":"주군","x":"(이 도시에서 제일 위험한 감정이, 지금 막 심어졌다. ……하필, 저 아이한테.)","m":1},{"t":"l","s":"주군","c":"주군","x":"아가씨. 바람이 차다. 집까지 바래다주지."},{"t":"l","s":"치코","c":"치코","x":"아…… 네…… 가, 감사합니다……."},{"t":"l","s":"치코","c":"치코","x":"저, 저기…… 아까는…… 부, 불러 주셔서…… 감사, 했어요…. 무, 무서웠을 텐데……."},{"t":"l","s":"주군","c":"주군","x":"인사는 됐다. ……그보다, 오늘 일은 그 언니 말대로 나쁜 꿈이라고 생각해 두는 게 좋아."},{"t":"l","s":"치코","c":"치코","x":"……네…… 꿈…… 그, 그래도…… 꿈이라도…… 머, 멋있었어요……."},{"t":"l","s":"주군","c":"주군","x":"(……이거 참. 못을 박을 새도 없이 뿌리를 내리는군, 그 감정은.)","m":1},{"t":"d","g":"표정","x":"와카 = 품속에서 (작게)"},{"t":"l","s":"와카","c":"와카","x":"(…….역시, 저 애야.)"},{"t":"l","s":"주군","c":"주군","x":"(……지금 확실히 들렸다. 이 인형—— 말을 하는군?)","m":1}]}]},{"id":"p0-e3","title":"3화 「계약의 값」","scenes":[{"id":"p0-e3-s0","title":"3-1. 하숙집 — 「말하는 인형」","blocks":[{"t":"d","g":"배경","x":"주군의 하숙방 — 좁은 다다미방, 창밖은 보라색 밤"},{"t":"d","g":"BGM","x":"째깍이는 시계 소리 위주의 미니멀 트랙"},{"t":"d","g":"SE","x":"다다미 삐걱임"},{"t":"n","x":"하숙집에 돌아와 인형 두 개를 책상에 앉혔다. 그리고 기다렸다. 오래 걸리지는 않았다."},{"t":"l","s":"주군","c":"주군","x":"(자, 나와라. 낮이고 밤이고 실컷 소곤거렸잖나. 주인이 정좌하고 기다려 주는 건, 지금뿐이다.)","m":1},{"t":"d","g":"표정","x":"와카 = 벌떡 (귀 쫑긋)"},{"t":"l","s":"와카","c":"와카","x":"후와아~ 답답했다! 저기, 계약자! 아까 그 애 봤지? 봤지?!"},{"t":"d","g":"표정","x":"타마 = 따라 벌떡"},{"t":"l","s":"타마","c":"타마","x":"봤지~!"},{"t":"d","g":"표정","x":"주군 = 반쯤 예상, 반쯤 체념"},{"t":"l","s":"주군","c":"주군","x":"……역시 말을 하는군. 낮부터 목소리가 들린다 했다."},{"t":"l","s":"주군","c":"주군","x":"(놀라야 정상인데, 이상하게 놀랍지가 않아. 네코다니의 와카와 타마도— 아니. 지금은 이 세계의 규칙부터다.)","m":1},{"t":"l","s":"와카","c":"와카","x":"어라? 안 놀라네? 시시해~! 보통은 더 이렇게, 우와악! 하고 뒤로 자빠지는데!"},{"t":"l","s":"타마","c":"타마","x":"자빠지는데~!"},{"t":"l","s":"주군","c":"주군","x":"공교롭게도, 말하는 인형보다 이상한 것을 많이 봐 온 인생이라서 말이지."},{"t":"l","s":"와카","c":"와카","x":"뭐야 그거~. 그쪽이 더 수상하잖아!"},{"t":"d","g":"표정","x":"와카 = 신남"},{"t":"l","s":"와카","c":"와카","x":"우리는 와카! 그리고 타마! 소원을 이루는 신비한 인형이야! 딱 하나, 영업 품목이 있지— 그건 바로 「계약」!"},{"t":"d","g":"표정","x":"타마 = 짝"},{"t":"l","s":"타마","c":"타마","x":"계약~!"},{"t":"l","s":"와카","c":"와카","x":"계약하자! 계약하면 누구든 마법소녀가 될 수 있어! 마법소녀가 되면, 누구든 지킬 수 있어!"},{"t":"l","s":"와카","c":"와카","x":"어때? 두근두근하지? 지금이라면 특전으로— 음, 특전은 없지만! 마음은 담았어!"},{"t":"l","s":"타마","c":"타마","x":"담았어~!"},{"t":"l","s":"주군","c":"주군","x":"(영업 문구가 어딘가 닳아 있군. ……대체 몇 명에게, 이 말을 해 온 건지.)","m":1},{"t":"l","s":"주군","c":"주군","x":"그 전에 하나. 그 골동품상— 너희를 넘긴 그 사람과는 무슨 사이지?"},{"t":"l","s":"와카","c":"와카","x":"사장님? 으음~ ……오래 신세 진 사이?"},{"t":"l","s":"타마","c":"타마","x":"신세~!"},{"t":"l","s":"와카","c":"와카","x":"가게는 조용하고, 손님은 안 오고! 심심했어~! 그러니까 계약자가 데려가 줘서 기뻐!"},{"t":"l","s":"주군","c":"주군","x":"(얼버무린 건지, 정말 그것뿐인 건지— 판별이 안 되는군.)","m":1},{"t":"d","g":"표정","x":"주군 = 차갑게"},{"t":"l","s":"주군","c":"주군","x":"그 말, 아까 그 아이한테 할 생각이었나."},{"t":"d","g":"표정","x":"와카 = 움찔 → 히죽"},{"t":"l","s":"와카","c":"와카","x":"어~? 눈치 빠르네. 응! 저 애, 자질이 굉장하거든. 오늘 밤 봤잖아? 그 '동경'. 저런 반짝반짝한 마음이 제일 좋은 연료가— 아, 아니, 제일 좋은 소질이 된다구."},{"t":"l","s":"주군","c":"주군","x":"(……지금, '연료'라고 하려다 말았지.)","m":1},{"t":"l","s":"주군","c":"주군","x":"방금 그거, 다시 말해 봐라. 반짝반짝한 마음이, 뭐가 된다고?"},{"t":"l","s":"와카","c":"와카","x":"소·질! 소질이 된다구! 계약자, 귀 나빠~?"},{"t":"l","s":"타마","c":"타마","x":"귀 나빠~?"},{"t":"l","s":"주군","c":"주군","x":"(정정하는 목소리에 흔들림 하나 없군. 뻔뻔하기까지 해.)","m":1},{"t":"l","s":"주군","c":"주군","x":"안 된다. 그 아이는 안 돼."},{"t":"d","g":"표정","x":"와카 = 갸웃"},{"t":"l","s":"와카","c":"와카","x":"에~? 왜? 계약자가 그걸 정해?"},{"t":"l","s":"주군","c":"주군","x":"……무슨 뜻이지."},{"t":"d","g":"표정","x":"와카 = 또박또박 (영업 모드)"},{"t":"l","s":"와카","c":"와카","x":"있지, 규칙 설명! 우리는 지금 네 소유물이거든. 그러니까 계약서엔 어른의 서명이 필요해! 네가 우리의 '계약자'라는 거야. 소녀가 아무리 원해도, 계약자가 도장을 안 찍으면 계약은 없어! 좋은 시스템이지?"},{"t":"d","g":"표정","x":"타마 = 짝짝"},{"t":"l","s":"타마","c":"타마","x":"좋은 시스템~!"},{"t":"d","g":"표정","x":"주군 = 침묵"},{"t":"l","s":"주군","c":"주군","x":"(…………좋은 시스템일 리가 있나.)","m":1},{"t":"n","x":"아이가 아무리 원해도, 어른이 서명하지 않으면 계약은 없다."},{"t":"n","x":"뒤집어 말하면 이렇다 — 아이를 전장에 보낸 책임은, 전부 서명한 어른의 것이 된다."},{"t":"l","s":"주군","c":"주군","x":"(책임을 어른에게 지우는 구조가 아니야. 책임을 어른에게 '떠넘기게' 만드는 구조다. ……누가 설계했는지 몰라도, 악질이군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"하나 묻지. 계약하면— 그 아이들은 뭘 치르게 되지?"},{"t":"l","s":"와카","c":"와카","x":"치르다니~? 이상한 말 하네! 소원을 이루고, 힘을 받고, 소중한 걸 지켜! 좋은 일뿐이잖아?"},{"t":"l","s":"주군","c":"주군","x":"좋은 일뿐인 장사가 세상에 있을 리 없지. 대가 없는 힘도."},{"t":"l","s":"와카","c":"와카","x":"……."},{"t":"l","s":"타마","c":"타마","x":"……."},{"t":"l","s":"와카","c":"와카","x":"……계약자는 어려운 걸 좋아하네~! 자자, 어려운 얘기는 계약하고 나서!"},{"t":"l","s":"주군","c":"주군","x":"(지금, 한 박자 멈췄다. 인형 주제에— 대답을 '고르는' 간격이었어.)","m":1},{"t":"l","s":"주군","c":"주군","x":"그럼 이렇게 묻지. 계약을 그만둘 수는 있나? 하고 나서, 돌이키고 싶어지면."},{"t":"l","s":"와카","c":"와카","x":"으음~? 왜 그만둬? 다들 엄~청 기뻐하는데!"},{"t":"l","s":"주군","c":"주군","x":"질문에 질문으로 답하지 마라."},{"t":"l","s":"와카","c":"와카","x":"후후~ 비밀!"},{"t":"l","s":"타마","c":"타마","x":"비밀~!"},{"t":"l","s":"주군","c":"주군","x":"(……'대답하지 않는 질문'의 목록이, 점점 이 인형들의 정체를 그려 가는군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"서명하지 않는다. 오늘은— 아니, 앞으로도."},{"t":"d","g":"표정","x":"와카 = 어깨 으쓱 (인형인데)"},{"t":"l","s":"와카","c":"와카","x":"흐응~. 뭐, 좋아. 서두르지 않을게. ……그치만 계약자. 결계는 매일 밤 늘어나고 있어. 지키는 손이 모자란 것도, 매일 밤."},{"t":"l","s":"주군","c":"주군","x":"서두르지 않는다는 말이 제일 무섭게 들린다는 건, 알고 하는 말이겠지."},{"t":"l","s":"와카","c":"와카","x":"에헤헤~ 칭찬이지?"},{"t":"l","s":"주군","c":"주군","x":"아니다만."},{"t":"l","s":"와카","c":"와카","x":"그 애가 원하는 날이, 반드시 와. 그때도 그렇게 말할 수 있으면 좋겠다~?"},{"t":"l","s":"타마","c":"타마","x":"반드시 와~."},{"t":"l","s":"주군","c":"주군","x":"……그 자신감은 어디서 나오지."},{"t":"l","s":"와카","c":"와카","x":"후훗. 우리, 이래 봬도 오래 했거든~! ……이런 일."},{"t":"l","s":"주군","c":"주군","x":"(……협박치고는, 예언에 가까운 말투군.)","m":1}]},{"id":"p0-e3-s1","title":"3-2. 도서관 뒤 — 「관측자」","blocks":[{"t":"d","g":"배경","x":"방과 후 도서관 뒷마당 — 낡은 벤치, 전선 위 까마귀"},{"t":"d","g":"BGM","x":"로파이 미니멀"},{"t":"d","g":"SE","x":"페이지 넘기는 소리, 키보드 타건음"},{"t":"n","x":"다음 날, 도서관 뒤에서 료가 나를 붙잡았다. 이 세계에서도 그 아이는, 시니컬한 해석자였다."},{"t":"d","g":"SE","x":"까마귀 울음"},{"t":"l","s":"주군","c":"주군","x":"(낡은 벤치. 전선 위의 까마귀. 태블릿을 안은 소년. ……그림만 보면, 평화로운 방과 후다만.)","m":1},{"t":"d","g":"표정","x":"료 = 무표정·태블릿"},{"t":"l","s":"료","c":"료","x":"……저기. 잠깐 시간 돼요?"},{"t":"d","g":"표정","x":"주군 = 의외"},{"t":"l","s":"주군","c":"주군","x":"나한테 볼일인가? 며칠 전에 도서관에서 마주친 것뿐인데."},{"t":"d","g":"표정","x":"료 = 주위를 흘끗"},{"t":"l","s":"료","c":"료","x":"앉아서 얘기해요. 서 있으면 눈에 띄니까."},{"t":"l","s":"주군","c":"주군","x":"(……경계가 습관이 된 몸짓이군.)","m":1},{"t":"d","g":"표정","x":"료 = 담담"},{"t":"l","s":"료","c":"료","x":"그때 아저— ……그쪽이 반납한 책. 향토 지리지 세 권에, 옛날 신문 축쇄판 두 권. 이 도시 사람이 안 볼 조합이에요. 이 도시를 '모르는' 사람이 볼 조합이지."},{"t":"l","s":"주군","c":"주군","x":"……잘도 기억하는군. 남이 반납한 책의 목록까지."},{"t":"l","s":"료","c":"료","x":"반납 카운터 옆자리에 앉아 있었을 뿐이에요. 눈에 들어온 건 기억에 남고요. 그것뿐."},{"t":"l","s":"주군","c":"주군","x":"그것뿐이라고 하기엔, 상당한 재주다만."},{"t":"l","s":"료","c":"료","x":"칭찬은 됐어요. 얘기가 안 넘어가니까."},{"t":"l","s":"주군","c":"주군","x":"(칭찬이 아니라 경계였다만. ……말해도 소용없겠지.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(……이 관찰력은 세계가 바뀌어도 그대로군. 무섭게.)","m":1},{"t":"d","g":"표정","x":"료 = 태블릿을 내민다"},{"t":"l","s":"료","c":"료","x":"그래서, 거래. 나는 외지인의 눈이 필요하고, 그쪽은 정보가 필요할 거예요. — 결계 출현 기록, 삼 개월치. 직접 딴 거예요."},{"t":"l","s":"주군","c":"주군","x":"잠깐. 거래라는 건, 서로가 뭘 내놓는지 알고 하는 거다. '외지인의 눈'이 필요하다는 건 무슨 의미지?"},{"t":"l","s":"료","c":"료","x":"말 그대로예요. 이 도시 사람은 이 도시를 못 봐요. 태어날 때부터 보고 있으니까. 이상한 게 이상하게 안 보인다는 거죠."},{"t":"l","s":"료","c":"료","x":"그쪽은 달라요. 전부 처음 보는 눈이잖아요. 그 눈에 뭐가 걸리는지— 그게 그대로 데이터가 돼요."},{"t":"l","s":"주군","c":"주군","x":"(합리적이군. 소름 끼칠 만큼.)","m":1},{"t":"d","g":"표정","x":"주군 = 화면을 본다"},{"t":"l","s":"주군","c":"주군","x":"……직접? 이걸 혼자서?"},{"t":"d","g":"표정","x":"료 = 살짝 시선 피함"},{"t":"l","s":"료","c":"료","x":"취미예요. 밤에 잠이 안 와서. ……그보다, 여기 봐요."},{"t":"l","s":"주군","c":"주군","x":"(잠이 안 와서, 라. ……그 한마디에 얼마만큼의 밤이 들어 있는 건지.)","m":1},{"t":"n","x":"태블릿의 그래프는 소름 끼치게 정직했다. 출현 횟수는 완만한 우상향. 그리고 출현 지점은—"},{"t":"d","g":"표정","x":"료 = 지도 확대"},{"t":"l","s":"료","c":"료","x":"무작위처럼 보이는데, 아니에요. 나선이에요. 도시 바깥에서 안쪽으로, 아주 천천히 감겨 들어오고 있어요. 중심점은…… 아직 몰라요. 데이터가 모자라서."},{"t":"l","s":"주군","c":"주군","x":"(나선. 감겨 들어온다. ……무언가를 향해서.)","m":1},{"t":"l","s":"주군","c":"주군","x":"이 나선— 언제부터 감기기 시작한 거지?"},{"t":"l","s":"료","c":"료","x":"기록상으로는 삼 개월 전부터. 그 전엔 몰라요. 내가 세기 시작한 게 삼 개월 전이니까."},{"t":"l","s":"주군","c":"주군","x":"세기 시작한 계기는?"},{"t":"l","s":"료","c":"료","x":"……. 그건 거래 품목에 없어요."},{"t":"l","s":"주군","c":"주군","x":"(……여기서 문을 닫는군. 캐물을 일은 아니지.)","m":1},{"t":"l","s":"주군","c":"주군","x":"중심점을 계산할 수는 없나? 나선이라면, 수학적으로."},{"t":"l","s":"료","c":"료","x":"하고 있어요. 지금 데이터로는 오차 범위가 도시 절반이에요. 의미가 없죠."},{"t":"l","s":"료","c":"료","x":"앞으로 두세 번 더 접히면 좁혀져요. ……그게 제일 싫은 부분이지만. 데이터가 는다는 건, 결계가 늘었다는 거니까."},{"t":"l","s":"주군","c":"주군","x":"(데이터가 정확해질수록 사태는 나빠진다는 건가. ……고약한 계산이군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"이 얘기, 마법소녀들한테는?"},{"t":"d","g":"표정","x":"료 = 어깨 으쓱"},{"t":"l","s":"료","c":"료","x":"했죠. [홍련의 소녀]한테. 「어려운 얘기는 됐고, 나오면 태운다」— 라던데요."},{"t":"l","s":"주군","c":"주군","x":"(………레오나답다.)","m":1},{"t":"l","s":"료","c":"료","x":"……지금 웃었죠."},{"t":"l","s":"주군","c":"주군","x":"웃지 않았다."},{"t":"l","s":"료","c":"료","x":"웃었어요. 입가. ……역시 그쪽, [홍련의 소녀]하고 아는 사이예요?"},{"t":"l","s":"주군","c":"주군","x":"밤길에서 두어 번, 신세를 졌을 뿐이다."},{"t":"l","s":"료","c":"료","x":"흐음. ……그 '두어 번'도, 보통 사람한테는 안 일어나는 일인데."},{"t":"l","s":"주군","c":"주군","x":"(허를 찌르는군, 이 아이는. 세계가 바뀌어도.)","m":1},{"t":"d","g":"표정","x":"료 = 처음으로 주군을 정면으로 본다"},{"t":"l","s":"료","c":"료","x":"……하나만 물을게요. 그쪽, 뭘 알고 있죠? 이 도시를 처음 보는 눈으로 보는 주제에, 사람들을 보는 눈은…… 전부 아는 사람 같아서."},{"t":"d","g":"표정","x":"주군 = 잠깐 침묵"},{"t":"l","s":"주군","c":"주군","x":"……글쎄. 나도 그게 뭔지 알고 싶어서, 지리지를 뒤지고 있는 중이다."},{"t":"d","g":"표정","x":"료 = 픽"},{"t":"l","s":"료","c":"료","x":"대답이 안 되는 대답. ……뭐, 좋아요. 데이터는 공유할 테니까, 뭔가 알게 되면 그쪽도 공유. 거래 성립이에요."},{"t":"l","s":"주군","c":"주군","x":"성립인가. 내 대답은 아직 안 했다만."},{"t":"l","s":"료","c":"료","x":"얼굴이 대답했어요. 필요한 건, 필요하다고."},{"t":"l","s":"주군","c":"주군","x":"(……이 도시의 아이들은 하나같이, 사람 얼굴을 너무 잘 읽는군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"연락은 어떻게 하지?"},{"t":"l","s":"료","c":"료","x":"여기. 방과 후엔 대체로 있어요. 까마귀가 있으면 나도 있다— 정도로 기억해 두면 돼요."},{"t":"l","s":"주군","c":"주군","x":"까마귀?"},{"t":"l","s":"료","c":"료","x":"쟤, 내가 앉으면 와요. 이유는 몰라요. 데이터에도 안 잡히고. ……세상엔 그런 것도 있더라고요."},{"t":"l","s":"주군","c":"주군","x":"(데이터 신봉자인 줄 알았더니, 의외로 유연하군.)","m":1},{"t":"l","s":"료","c":"료","x":"아, 그리고. 밤에 돌아다니는 거, 적당히 해요. 그쪽, 최근 사흘 밤 내내 밖에 있었죠."},{"t":"l","s":"주군","c":"주군","x":"……그건 어떻게 알았지?"},{"t":"l","s":"료","c":"료","x":"신발. 아침마다 흙이 새로 묻어 있길래. ……도서관 카운터는, 그런 것도 보이는 자리라서요."},{"t":"l","s":"주군","c":"주군","x":"(무섭군. 정말로.)","m":1},{"t":"n","x":"돌아가는 길, 나는 그래프의 나선을 몇 번이고 머릿속에 그렸다."},{"t":"n","x":"결계는 늘어나고 있었다. 천천히, 무언가를 향해서. — 그리고 그 '무언가'의 한가운데쯤에, 저 아이들의 학교가 있었다."},{"t":"l","s":"주군","c":"주군","x":"(서두르자. 돌아갈 방법이든, 이 나선의 정체든— 어느 쪽이든, 시간이 많지 않아.)","m":1}]}]},{"id":"p0-e4","title":"4화 「여명」","scenes":[{"id":"p0-e4-s0","title":"4-1. 하굣길 — 「삼켜진 소꿉친구」","blocks":[{"t":"d","g":"배경","x":"해질녘 하굣길 — 육교 위, 노을이 보라색으로 식어가는 하늘"},{"t":"d","g":"BGM","x":"일상곡 → 뚝 끊김"},{"t":"d","g":"SE","x":"하교 소음 → 유리 긁는 소리"},{"t":"d","g":"이펙트","x":"공간 '접힘' 발생"},{"t":"n","x":"그것은 하굣길에, 아무 예고도 없이 일어났다."},{"t":"d","g":"표정","x":"히스이 = 축 늘어져 걷는다"},{"t":"l","s":"히스이","c":"히스이","x":"……하암. 치코. 오늘 저녁, 우리 집에서 먹고 가."},{"t":"d","g":"표정","x":"치코 = 갸웃"},{"t":"l","s":"치코","c":"치코","x":"어……? 가, 갑자기?"},{"t":"d","g":"표정","x":"히스이 = 느릿느릿"},{"t":"l","s":"히스이","c":"히스이","x":"만드는 건 귀찮으니까, 치코가 만들고. 나는 옆에서 응원. ……그게 제일 맛있어."},{"t":"d","g":"표정","x":"치코 = 웃음"},{"t":"l","s":"치코","c":"치코","x":"그, 그게 뭐야……. ……그, 그래도, 갈래. 히스이 쨩네 부엌, 좋아하니까."},{"t":"d","g":"표정","x":"히스이 = 문득 하늘을 본다"},{"t":"l","s":"히스이","c":"히스이","x":"……노을, 색이 이상하네. 보라색이야."},{"t":"d","g":"표정","x":"치코 = 따라 하늘을 본다"},{"t":"l","s":"치코","c":"치코","x":"저, 정말……. 예, 예쁘다……? 예쁜 걸까……?"},{"t":"n","x":"나는 그날도 조금 떨어진 길에서, 두 아이의 하굣길을 눈으로만 배웅하고 있었다."},{"t":"l","s":"주군","c":"주군","x":"(료의 지도가 맞다면, 이 근방도 나선 위다. ……며칠째 아무 일도 없다만. 기우라면, 그걸로 좋고.)","m":1},{"t":"d","g":"표정","x":"히스이 = 늘어짐 (하품)"},{"t":"l","s":"히스이","c":"히스이","x":"흐아암…… 치코, 오늘 숙제 뭐였지. 나 자느라 못 들었는데."},{"t":"d","g":"표정","x":"치코 = 웃음"},{"t":"l","s":"치코","c":"치코","x":"또, 또 잤구나…. 수, 수학 프린트야. 이따가 보여줄…… 게……."},{"t":"d","g":"SE","x":"쩌적——"},{"t":"d","g":"이펙트","x":"육교 건너편 공간이 유리처럼 접힌다"},{"t":"d","g":"표정","x":"치코 = 경악"},{"t":"l","s":"치코","c":"치코","x":"……히, 히스이 쨩……?"},{"t":"n","x":"히스이가 서 있던 자리가, 통째로 '접혀' 있었다. 비틀린 유리 저편에서, 소꿉친구의 실루엣이 어둠에 잠겨 갔다."},{"t":"d","g":"표정","x":"치코 = 유리면에 달려든다"},{"t":"l","s":"치코","c":"치코","x":"거, 거짓말…… 바, 방금까지, 여기…… 여기에 있었는데……!"},{"t":"d","g":"SE","x":"쿵, 쿵 (유리를 두드리는 소리)"},{"t":"l","s":"치코","c":"치코","x":"히스이 쨩! 대, 대답해……! 히스이 쨩!"},{"t":"d","g":"표정","x":"히스이 = 유리 저편 (목소리가 멀다)"},{"t":"l","s":"히스이","c":"히스이","x":"……치코……? 이상해…… 어두워……. 목소리가, 멀어……."},{"t":"d","g":"표정","x":"치코 = 필사적"},{"t":"l","s":"치코","c":"치코","x":"지, 지금 꺼내 줄게! 조, 조금만, 기다려……!"},{"t":"d","g":"표정","x":"치코 = 절규"},{"t":"l","s":"치코","c":"치코","x":"히스이 쨩!! 히스이 쨩——!!"},{"t":"d","g":"표정","x":"주군 = 달려온다"},{"t":"l","s":"주군","c":"주군","x":"물러나! 결계다— 접촉하면 너까지 삼켜져!"},{"t":"d","g":"표정","x":"치코 = 뿌리치려 한다"},{"t":"l","s":"치코","c":"치코","x":"시, 싫어요! 노, 놔 주세요……! 히스이 쨩이, 저 안에……!"},{"t":"l","s":"주군","c":"주군","x":"만지지 말라고 했다! 맨손으로 닿으면, 너부터 삼켜진다!"},{"t":"d","g":"표정","x":"치코 = 돌아본다 (눈물)"},{"t":"l","s":"치코","c":"치코","x":"다, 당신은…… 그, 그때의……! 부, 부탁이에요, 히스이 쨩이, 안에……!"},{"t":"d","g":"표정","x":"주군 = 짧게 끄덕"},{"t":"l","s":"주군","c":"주군","x":"상점가의 밤 이후로군. ……숨부터 쉬어라. 천천히. 무슨 일이 있었는지, 말할 수 있겠나."},{"t":"d","g":"표정","x":"치코 = 더듬더듬"},{"t":"l","s":"치코","c":"치코","x":"가, 갑자기, 공기가 유리처럼…… 히, 히스이 쨩이 있던 쪽만, 저, 접혀서……."},{"t":"n","x":"나는 결계의 표면을 살폈다. 두껍다. 레오나를 부르러 갈 시간은— 없다. 안쪽의 실루엣이 벌써 흐려지고 있었다."},{"t":"l","s":"주군","c":"주군","x":"(상점가 때와는 밀도가 다르다. ……최악의 자리에서, 최악의 두께다.)","m":1},{"t":"d","g":"표정","x":"와카 = 품에서 튀어나옴"},{"t":"l","s":"와카","c":"와카","x":"계약자! 지금이야! 저 애가 계약하면, 지금 바로 열 수 있어!"},{"t":"d","g":"표정","x":"타마 = 따라 튀어나옴"},{"t":"l","s":"타마","c":"타마","x":"지금이야~!"},{"t":"d","g":"표정","x":"주군 = 이를 악문다"},{"t":"l","s":"주군","c":"주군","x":"와카……! 너, 설마 이 순간을 기다리고—"},{"t":"d","g":"표정","x":"치코 = 와카를 본다"},{"t":"l","s":"치코","c":"치코","x":"이, 인형이…… 말을……?"},{"t":"d","g":"표정","x":"와카 = 치코에게"},{"t":"l","s":"와카","c":"와카","x":"계약하자! 계약하면 마법소녀가 될 수 있어! 마법소녀가 되면— 저 애를 지금 구할 수 있어!"},{"t":"d","g":"표정","x":"타마 = 짝"},{"t":"l","s":"타마","c":"타마","x":"구할 수 있어~!"},{"t":"d","g":"표정","x":"치코 = 주군을 본다"},{"t":"l","s":"치코","c":"치코","x":"저, 저기요……! 서, 서명해 주세요…! 이 애가, 어른의 서명이 필요하다고……!"},{"t":"d","g":"표정","x":"주군 = 고개를 젓는다"},{"t":"l","s":"주군","c":"주군","x":"……안 된다."},{"t":"d","g":"표정","x":"치코 = 충격"},{"t":"l","s":"치코","c":"치코","x":"어, 어째서……!"},{"t":"l","s":"주군","c":"주군","x":"네가 뭘 대가로 치르게 될지, 나도 모른다. 모르는 계약서에 아이를 앉힐 수는 없어. — 다른 방법을 찾는다. 와카, [홍련]을 불러라! 위치는—"},{"t":"d","g":"표정","x":"와카 = 다급하게"},{"t":"l","s":"와카","c":"와카","x":"늦어! [홍련]은 반대편 결계에 들어가 있어— 여기 닫히는 게 먼저야!"},{"t":"d","g":"표정","x":"주군 = 물고 늘어진다"},{"t":"l","s":"주군","c":"주군","x":"다른 소녀는! 이 구역까지 올 수 있는 손이, 하나쯤은—"},{"t":"l","s":"와카","c":"와카","x":"오늘 밤 예보는 여러 개야! 다들 자기 결계에 붙어 있어! 빈 곳은— 여기뿐이야!"},{"t":"l","s":"타마","c":"타마","x":"여기뿐~!"},{"t":"l","s":"주군","c":"주군","x":"(……그래서 오늘, 하필 이 아이들의 곁이 비어 있었다는 건가.)","m":1},{"t":"l","s":"주군","c":"주군","x":"그럼 내가 들어간다. 어른 하나쯤은—"},{"t":"d","g":"표정","x":"와카 = 고개를 젓는다"},{"t":"l","s":"와카","c":"와카","x":"계약 없는 사람은, 문을 '열 수'조차 없어! 휘말려서 갇히는 거랑, 열고 들어가는 건 다른 얘기야! 계약자, 시간 없어!"},{"t":"d","g":"표정","x":"주군 = 낮게"},{"t":"l","s":"주군","c":"주군","x":"……대가는 '비밀'이라면서, 규칙만은 빈틈없이 짜여 있군."},{"t":"d","g":"표정","x":"와카 = 어깨 으쓱 (인형인데)"},{"t":"l","s":"와카","c":"와카","x":"우리가 짠 게 아냐. 우리도, 규칙 '안'에 있는 것뿐인걸."},{"t":"l","s":"주군","c":"주군","x":"(……그 말, 나중에 반드시 다시 묻는다.)","m":1},{"t":"d","g":"SE","x":"쩌저적—— (결계가 조여드는 소리)"},{"t":"d","g":"표정","x":"치코 = 유리 저편을 본다"},{"t":"l","s":"치코","c":"치코","x":"히스이 쨩의 그림자가…… 여, 옅어지고 있어요……! 저, 저기……!"},{"t":"l","s":"주군","c":"주군","x":"(……전부 막혔다. 남은 문이— 하필, 제일 열고 싶지 않은 문 하나다.)","m":1},{"t":"d","g":"표정","x":"주군 = 치코를 정면으로 본다"},{"t":"l","s":"주군","c":"주군","x":"치코. ……잘 들어라. 이건, 어른이 아이에게 시켜도 되는 종류의 일이 아니다."},{"t":"d","g":"표정","x":"치코 = 고개를 젓는다"},{"t":"l","s":"치코","c":"치코","x":"아, 알아요…… 저, 저는 옛날부터, 히스이 쨩 뒤에만 숨어 있었어요…. 벌레도, 천둥도, 무, 무서운 건 전부……."},{"t":"l","s":"치코","c":"치코","x":"그, 그런데 히스이 쨩은, 한 번도 겁쟁이라고 안 웃었어요……. 어, 언제나, 먼저 손을 잡아 줬어요……."},{"t":"l","s":"주군","c":"주군","x":"그러니까 더더욱, 잃는 쪽의 각오까지 네가 짊어질 필요는—"},{"t":"l","s":"주군","c":"주군","x":"(그렇게 말하는 내 목소리가— 나조차 설득하지 못하고 있다. 저 안에 있는 게 히스이라는 걸, 나도 알고 있으니까.)","m":1},{"t":"d","g":"표정","x":"치코 = 떨면서, 그러나 똑바로"},{"t":"l","s":"치코","c":"치코","x":"무, 무서워요…. 계약도, 괴물도, 전부 무서워요…. 무서운데요……!"},{"t":"l","s":"치코","c":"치코","x":"히스이 쨩이 저 안에 있는데, 무서워서 아무것도 못 하는 게…… 그, 그게 제일, 싫어요……!"},{"t":"d","g":"표정","x":"주군 = 숨을 삼킨다"},{"t":"l","s":"주군","c":"주군","x":"(…………아아. 그렇구나.)","m":1},{"t":"n","x":"이 아이는 겁쟁이가 아니다."},{"t":"n","x":"겁쟁이인 채로, 걷는 아이다."},{"t":"d","g":"표정","x":"와카 = 다급"},{"t":"l","s":"와카","c":"와카","x":"계약자! 닫혀! 결정은—"},{"t":"l","s":"타마","c":"타마","x":"결정~!"},{"t":"d","g":"표정","x":"주군 = 와카를 보지 않고"},{"t":"l","s":"주군","c":"주군","x":"……닥쳐라. 지금 내가 보고 있는 건 결계가 아니라, 이 아이의 눈이다."},{"t":"l","s":"주군","c":"주군","x":"……하나만 약속해라. 무리라고 생각되면, 도망쳐. 그건 지는 게 아니다."},{"t":"d","g":"표정","x":"치코 = 끄덕 (몇 번이고)"},{"t":"l","s":"치코","c":"치코","x":"네…… 네……!"}]},{"id":"p0-e4-s1","title":"4-2. 결계 내부 — 「[여명의 소녀]」","blocks":[{"t":"d","g":"배경","x":"결계 내부 — 뒤집힌 육교, 어둠 속 부유하는 파편들"},{"t":"d","g":"BGM","x":"무음 → 각성 테마 (여명빛 스트링)"},{"t":"d","g":"SE","x":"펜이 종이를 긋는 소리 (길게)"},{"t":"d","g":"이펙트","x":"계약 문양 전개"},{"t":"n","x":"와카가 펼친 계약서는, 낡은 두루마리였다."},{"t":"n","x":"말미의 끝자락이 어딘가 허전하다고 — 잠깐, 생각했던 것 같다. 확인할 여유는, 없었다."},{"t":"d","g":"표정","x":"와카 = 두루마리를 펼친다"},{"t":"l","s":"와카","c":"와카","x":"여기! 입회인 란! 이름 한 줄이면 돼— 펜은, 자!"},{"t":"d","g":"표정","x":"타마 = 펜을 물어 온다"},{"t":"l","s":"타마","c":"타마","x":"자~!"},{"t":"d","g":"표정","x":"주군 = 치코를 본다"},{"t":"l","s":"주군","c":"주군","x":"치코. 마지막으로 한 번만 묻는다. ……정말, 하겠나."},{"t":"d","g":"표정","x":"치코 = 떨리는 목소리로, 그러나 곧게"},{"t":"l","s":"치코","c":"치코","x":"…………네. 부, 부탁, 드려요."},{"t":"l","s":"주군","c":"주군","x":"(목소리는 떨리는데, 눈은 흔들리지 않는군. ……졌다.)","m":1},{"t":"d","g":"표정","x":"주군 = 펜을 들되, 아직 종이에 대지 않는다"},{"t":"l","s":"주군","c":"주군","x":"하나만. — 이 문서의 전문(全文)을 보여 줘라."},{"t":"d","g":"표정","x":"와카 = 갸웃"},{"t":"l","s":"와카","c":"와카","x":"응~? 방금 다 설명했잖아? 소원 하나, 힘 하나—"},{"t":"l","s":"주군","c":"주군","x":"설명은 요약이지 문서가 아니다. 서명할 사람은, 서명할 문서를 전부 볼 권리가 있어. — 아닌가?"},{"t":"d","g":"표정","x":"와카 = 한 박자, 늦게"},{"t":"l","s":"와카","c":"와카","x":"…………어라."},{"t":"d","g":"표정","x":"타마 = 와카를 올려다본다"},{"t":"l","s":"타마","c":"타마","x":"……와카."},{"t":"d","g":"표정","x":"와카 = 다시 명랑하게. 다만, 빠르게"},{"t":"l","s":"와카","c":"와카","x":"그건 나중에! 지금은— 히스이 쨩, 시간 없다구!"},{"t":"d","g":"표정","x":"치코 = 주군의 소매를 잡는다"},{"t":"l","s":"치코","c":"치코","x":"부, 부탁드려요……! 지, 지금이 아니면…… 늦어요……!"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(……웃는 얼굴로 화제를 접었다. 접는 속도가— 웃는 얼굴치고는, 너무 빨랐다.)","m":1},{"t":"d","g":"표정","x":"주군 = 펜을 쥔다"},{"t":"l","s":"주군","c":"주군","x":"(평생 후회할 각오로 적는 이름이 있다면— 지금이, 그때다.)","m":1},{"t":"n" "x":"네네 = 발끈"},{"t":"l","s":"네네","c":"네네","x":"방금 뭐라 그랬어, 잠만보?!"},{"t":"d","g":"표정","x":"히스이 = 무심 (치코를 손끝으로 가리키며)"},{"t":"l","s":"히스이","c":"히스이","x":"잠만보 아니야. 히스이. ……마법소녀 쪽은, 히땅. — 쟤가 붙였어."},{"t":"d","g":"표정","x":"치코 = 움찔 → 수줍게"},{"t":"l","s":"치코","c":"치코","x":"헤, 헤헤…… 어, 어울리는 것 같아서……."},{"t":"d","g":"표정","x":"네네 = 어이없음 → 헛기침"},{"t":"l","s":"네네","c":"네네","x":"히땅…… 뭐야 그 성의 제로인 이름은! ……뭐, 이 몸의 '네네링'급은 아니어도, 어감은 봐줄 만하네!"},{"t":"d","g":"표정","x":"히스이 = 심드렁"},{"t":"l","s":"히스이","c":"히스이","x":"……그쪽도 별로 성의는……."},{"t":"l","s":"네네","c":"네네","x":"뭐라고?!"},{"t":"d","g":"표정","x":"히스이 = 이미 눕는 중"},{"t":"l","s":"히스이","c":"히스이","x":"사실을 말했을 뿐인데…. 아, 치코. 나 이 소파 마음에 들어. 여기가 내 자리. …치코가 강해지면 내가 잘 데가 없어지니까, 잘 부탁해."},{"t":"d","g":"표정","x":"치코 = 웃음"},{"t":"l","s":"치코","c":"치코","x":"그, 그게 무슨 부탁이야……."},{"t":"d","g":"표정","x":"네네 = 기가 참"},{"t":"l","s":"네네","c":"네네","x":"아니 잠깐, 선배 앞에서 대놓고 드러눕는 신입이 어디 있어!"},{"t":"d","g":"표정","x":"히스이 = 손만 든다"},{"t":"l","s":"히스이","c":"히스이","x":"여기. ……하암."},{"t":"l","s":"네네","c":"네네","x":"이, 이 몸의 위엄이……!"},{"t":"d","g":"표정","x":"레오나 = 어깨 으쓱"},{"t":"l","s":"레오나","c":"레오나","x":"포기해. 쟤는 원래 그래."},{"t":"d","g":"표정","x":"쿠로코 = 소파를 흘끗"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"……그 소파, 다리 한쪽이 삭았다. 내일 갈아 줄 테니까, 오늘은 험하게 쓰지 마라."},{"t":"d","g":"표정","x":"히스이 = 눈만 빼꼼"},{"t":"l","s":"히스이","c":"히스이","x":"……고마워, 사장님."},{"t":"d","g":"표정","x":"쿠로코 = 시선을 피하며"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"……별거 아니다. 수리비는 서비스다."},{"t":"d","g":"표정","x":"치코 = 작게"},{"t":"l","s":"치코","c":"치코","x":"쿠, 쿠로코 씨…… 다, 다정하신 분이구나……."},{"t":"d","g":"SE","x":"문이 조용히 열린다"},{"t":"d","g":"표정","x":"엔마 = 등불을 들고 등장"},{"t":"l","s":"엔마","c":"엔마","x":"……좋은 오후예요. 새 둥지의 냄새가 나서, 와 봤습니다."},{"t":"d","g":"표정","x":"레오나 = 자세를 고친다"},{"t":"l","s":"레오나","c":"레오나","x":"[윤회의 소녀]…. 선배가 직접 오다니, 웬일이에요."},{"t":"d","g":"표정","x":"엔마 = 등불을 창가에 놓는다"},{"t":"l","s":"엔마","c":"엔마","x":"새 등을 하나, 두고 가려고요. 밤에 돌아올 곳에는, 불이 켜져 있어야 하는 법이니까."},{"t":"d","g":"표정","x":"치코 = 꾸벅"},{"t":"l","s":"치코","c":"치코","x":"저, 저기…… 등불, 가, 감사합니다……!"},{"t":"d","g":"표정","x":"엔마 = 미소"},{"t":"l","s":"엔마","c":"엔마","x":"후후, 예의 바른 아이네요. 불씨는 아끼는 것이 아니랍니다. 밤길에, 자주 의지하세요."},{"t":"d","g":"표정","x":"네네 = 쪼르르"},{"t":"l","s":"네네","c":"네네","x":"선배! 들었어?! 이 몸, 요즘 연승 중이야! 어제도 결계 두 개나—"},{"t":"d","g":"표정","x":"엔마 = 부드럽게"},{"t":"l","s":"엔마","c":"엔마","x":"네, 네. 소문은 밤마다 듣고 있지요. 불꽃은 여전히 밝더군요. ……밝은 불일수록 금방 지치지요. 오늘은 일찍 쉬는 거예요."},{"t":"d","g":"표정","x":"네네 = 볼 부풀림"},{"t":"l","s":"네네","c":"네네","x":"어, 어린애 취급하지 마! …….뭐, 선배가 그렇게까지 말한다면, 오, 오늘만이야!"},{"t":"d","g":"표정","x":"히스이 = 소파에서 (작게)"},{"t":"l","s":"히스이","c":"히스이","x":"……학습이 안 되네."},{"t":"l","s":"네네","c":"네네","x":"소파에서 다 들린다?!"},{"t":"d","g":"표정","x":"엔마 = 웃음"},{"t":"l","s":"엔마","c":"엔마","x":"후후. 시끄러운 둥지네요. ……좋은 둥지예요, 시끄러운 둥지는."},{"t":"d","g":"표정","x":"레오나 = 스스럼없이"},{"t":"l","s":"레오나","c":"레오나","x":"선배도 자주 와요. 자리는 넉넉하니까."},{"t":"d","g":"표정","x":"엔마 = 등불을 바라보며"},{"t":"l","s":"엔마","c":"엔마","x":"글쎄요. 저는 밤이 본업이라서. ……그래도 등불은 보러 오겠어요. 꺼지지 않았는지, 확인하러— 말이지요."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(……이 세계의 엔마는 '선배'인가. 그 등불은, 여기서도 손에서 놓지 않는군.)","m":1}]},{"id":"p0-e5-s1","title":"5-2. 저녁 — 「전원이 웃는 사진」","blocks":[{"t":"d","g":"배경","x":"목공소 앞마당 — 노을, 급조한 나무 벤치와 화로"},{"t":"d","g":"BGM","x":"어쿠스틱 계속 (엔딩에서 서서히 페이드)"},{"t":"d","g":"SE","x":"화로 타닥임, 셔터음"},{"t":"n","x":"연승이었다. 결계가 열리면 넷이 움직였고, 다치는 사람 없이 밤이 끝났다."},{"t":"n","x":"좋은 날들이었다. — 그리고 좋은 날들은, 사진을 찍고 싶어지게 만든다."},{"t":"d","g":"표정","x":"치코 = 화로 앞에서 허둥"},{"t":"l","s":"치코","c":"치코","x":"소, 소시지 다 구워졌어요……! 앗, 뜨거……!"},{"t":"d","g":"표정","x":"히스이 = 옆에서 느긋"},{"t":"l","s":"히스이","c":"히스이","x":"치코. 후— 하고. 불고 나서 먹어."},{"t":"d","g":"표정","x":"네네 = 손 번쩍"},{"t":"l","s":"네네","c":"네네","x":"이 몸 것부터! 제일 큰 거!"},{"t":"d","g":"표정","x":"레오나 = 한숨"},{"t":"l","s":"레오나","c":"레오나","x":"선배 됐으면 양보라는 걸 배워, 양보라는 걸."},{"t":"d","g":"표정","x":"네네 = 당당"},{"t":"l","s":"네네","c":"네네","x":"이 몸은 신입을 지도해 준 보수를 받는 것뿐이거든?!"},{"t":"d","g":"표정","x":"쿠로코 = 지나가며"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"……화로 옆에 대패밥 자루 두지 마라. 불붙는다."},{"t":"d","g":"표정","x":"엔마 = 화로 곁에 앉으며"},{"t":"l","s":"엔마","c":"엔마","x":"후후 디를 주머니에 넣어 두었다. — 박수 때문에 싸우게 되면, 위험 신호."},{"t":"l","s":"주군","c":"주군","x":"(본인이 제일 잘 아는 말투였다. ……그게 마음에 걸리는군.)","m":1}]},{"id":"p0-e6-s1","title":"6-2. 광장 뒤 골목 — 「절화의 마녀」","blocks":[{"t":"d","g":"배경","x":"축제가 끝난 광장 뒤 골목 — 인파가 빠져나간 정적, 흩어진 전단지"},{"t":"d","g":"BGM","x":"무음 → 마녀 테마 (첼로, 아주 느리게)"},{"t":"d","g":"SE","x":"구두 소리 — 또각, 또각"},{"t":"d","g":"이펙트","x":"가로등이 하나씩 꺼진다"},{"t":"n","x":"환호성이 걷힌 골목은, 썰물 뒤의 해변처럼 조용했다. 그 정적의 끝에서 — 구두 소리가 걸어 나왔다."},{"t":"d","g":"표정","x":"네네 = 사인을 쥔 채 들떠서"},{"t":"l","s":"네네","c":"네네","x":"아~ 오늘 최고! 이 몸, 수확 대박…… 어라?"},{"t":"d","g":"표정","x":"치코 = 걸음을 늦춘다"},{"t":"l","s":"치코","c":"치코","x":"오, 오늘은, 좋은 날이었어…… 그렇지, 히스이 쨩…… 히스이 쨩?"},{"t":"d","g":"표정","x":"히스이 = 멈춰 선다"},{"t":"l","s":"히스이","c":"히스이","x":"……공기가, 안 움직여. 바람이, 없어."},{"t":"d","g":"SE","x":"또각, 또각——"},{"t":"d","g":"표정","x":"레오나 = 낮고 날카롭게"},{"t":"l","s":"레오나","c":"레오나","x":"……조용히. 전원, 멈춰."},{"t":"d","g":"표정","x":"치코 = 움찔"},{"t":"l","s":"치코","c":"치코","x":"레, 레오나 씨……?"},{"t":"d","g":"표정","x":"레오나 = 골목 안쪽을 노려본다"},{"t":"l","s":"레오나","c":"레오나","x":"가로등이. ……오는 방향부터, 순서대로 꺼지고 있어."},{"t":"d","g":"표정","x":"??? = 실루엣 → 등장"},{"t":"l","s":"???","c":"???","x":"어머. …봉주르. 좋은 밤이에요."},{"t":"d","g":"표정","x":"주군 = 굳는다"},{"t":"l","s":"주군","c":"주군","x":"(…………아야메?)","m":1},{"t":"n","x":"아야메의 얼굴이었다. 웃는 방식까지, 담장 너머에서 빵을 건네던 그대로여서 — 오히려 소름이 돋았다."},{"t":"d","g":"표정","x":"이리스 = 미소 그대로"},{"t":"l","s":"이리스","c":"아야메","x":"후후. 그렇게 굳지 않아도 괜찮아요. 밤 산책 중이었을 뿐이니까."},{"t":"l","s":"주군","c":"주군","x":"(목소리까지 같다. ……아니. 같아서, 더 다르다. 아야메는— 이렇게 차갑게 다정하지 않았어.)","m":1},{"t":"d","g":"표정","x":"치코 = 본능적으로 주군 앞을 막아선다 (떨면서)"},{"t":"l","s":"치코","c":"치코","x":"다, 당신은……!"},{"t":"d","g":"표정","x":"레오나 = 즉시 전투 태세"},{"t":"l","s":"레오나","c":"레오나","x":"치코, 물러나! ……총원, 산개! 저 사람이야. 저 사람이— 마녀들의 정점."},{"t":"d","g":"표정","x":"레오나 = 주군을 흘끗"},{"t":"l","s":"레오나","c":"레오나","x":"계약자 씨는 애들 뒤로. 무슨 일이 있어도, 나서지 마요."},{"t":"d","g":"표정","x":"주군 = 이를 악문다"},{"t":"l","s":"주군","c":"주군","x":"……알았다."},{"t":"d","g":"표정","x":"네네 = 목소리가 굳는다"},{"t":"l","s":"네네","c":"네네","x":"저, 정 음 연쇄"},{"t":"d","g":"표정","x":"학생A = 폰을 보며 킥킥"},{"t":"l","s":"학생A","c":"학생A","x":"야, 신입이 가로등 태운 클립 봤냐? 벌써 짤로 돌던데."},{"t":"d","g":"표정","x":"학생B = 웃다가, 멈칫"},{"t":"l","s":"학생B","c":"학생B","x":"ㅋㅋ 봤— ……아니다. 됐다. 왠지, 웃으면 안 될 것 같아."},{"t":"d","g":"표정","x":"레오나 = 화면을 노려본다"},{"t":"l","s":"레오나","c":"레오나","x":"……저 여자. 편집이 악랄한 게 아니야. 팩트만 오려 붙이니까 더 악랄한 거지."},{"t":"l","s":"주군","c":"주군","x":"끄지 그래. 봐서 좋을 게 없다."},{"t":"d","g":"표정","x":"레오나 = 화면에서 눈을 떼지 않고"},{"t":"l","s":"레오나","c":"레오나","x":"봐야죠. 적어도 우리는— 뭐가 잘려 나갔는지 아니까."},{"t":"l","s":"레오나","c":"레오나","x":"12분 늦은 날, 그 전에 세 군데를 돌고 왔다는 건 안 잘라 줘요. 가로등 세 개 값으로 사람이 몇 명 살았는지도, 안 잘라 주고."},{"t":"l","s":"주군","c":"주군","x":"……그걸 아는 사람이, 화면 밖에 몇이나 있지."},{"t":"d","g":"표정","x":"레오나 = 처음으로 시선을 내린다"},{"t":"l","s":"레오나","c":"레오나","x":"………지금은, 우리뿐이겠네요."},{"t":"d","g":"표정","x":"레오나 = 낮게"},{"t":"l","s":"레오나","c":"레오나","x":"계약자 씨. 저 방송, 시작된 게 언제라고 했죠?"},{"t":"l","s":"주군","c":"주군","x":"어느 아침부터— 라고밖에. 시작을 본 사람이 없다."},{"t":"l","s":"레오나","c":"레오나","x":"……그럼, 끄는 법을 아는 사람도 없겠네요."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"([풍문의 마녀], 벨·드·주르. ……시청자를 너무 잘 알아. 악의보다 무서운 건 저 정확함이다.)","m":1},{"t":"n","x":"여론은 하루 만에 식었다. 응원 플래카드가 사라지고, 목공소 앞에 '소음 민원' 딱지가 붙었다."},{"t":"d","g":"배경","x":"몽타주 — 상점가, 교문 앞, 버스 정류장"},{"t":"d","g":"표정","x":"점원 = 현수막을 걷으며"},{"t":"l","s":"점원","c":"점원","x":"응원 현수막이요? ……내렸어요. 본사에서 말이 나와서. 저도 뭐, 어쩔 수 없죠."},{"t":"d","g":"표정","x":"학부모A = 교문 앞"},{"t":"l","s":"학부모A","c":"학부모A","x":"우리 애 통학로에 그 '결계'인가 뭔가가 떴다면서요. 그 애들은 대체 뭘 한 거래요?"},{"t":"d","g":"표정","x":"학부모B = 목소리를 낮춰"},{"t":"l","s":"학부모B","c":"학부모B","x":"지켜 준 거…… 아니었어요?"},{"t":"l","s":"학부모A","c":"학부모A","x":"지켜 줬으면 애초에 안 떴어야죠. 안 그래요?"},{"t":"d","g":"표정","x":"학부모B = 머뭇거리며"},{"t":"l","s":"학부모B","c":"학부모B","x":"……그래도, 우리 골목은 그 애들이 지켜 줬다던데."},{"t":"l","s":"학부모A","c":"학부모A","x":"'그렇다던데'는 이제 안 믿기로 했어요. 화면에 나온 것만 믿을 거예요."},{"t":"d","g":"표정","x":"행인C = 버스를 기다리며"},{"t":"l","s":"행인C","c":"행인C","x":"고맙긴 한데…… 요즘은 좀 무섭더라고. 걔들이 무섭다는 게 아니라— 걔들이 싸우는 밤이."},{"t":"d","g":"이펙트","x":"화면 속 댓글 스크롤"},{ '방송'보다 '출석부'가 힘이 세거든요."},{"t":"d","g":"표정","x":"치코 = 조심스럽게"},{"t":"l","s":"치코","c":"치코","x":"회, 회장님은…… 무, 무섭지 않으세요? 화면에서, 매일 저렇게……."},{"t":"d","g":"표정","x":"타이가 = 찻잔을 바라보며"},{"t":"l","s":"타이가","c":"타이가","x":"무섭죠~. 다만 저는, 화면보다 눈앞의 찻잔을 믿는 성격이라서요."},{"t":"l","s":"치코","c":"치코","x":"……!"},{"t":"l","s":"타이가","c":"타이가","x":"소문은 식으면 다시 못 데우지만, 차는 식어도 다시 데우면 그만이에요~."},{"t":"d","g":"표정","x":"타이가 = 찻잔을 밀어준다"},{"t":"l","s":"타이가","c":"타이가","x":"자. 차라도 한잔하고 가세요. 쫓기는 날일수록, 차는 천천히 마시는 거예요~."},{"t":"d","g":"SE","x":"찻잔 내려놓는 소리"},{"t":"d","g":"표정","x":"치코 = 한 모금 → 어깨가 조금 내려간다"},{"t":"l","s":"치코","c":"치코","x":"……따, 따뜻해요……."},{"t":"d","g":"표정","x":"타이가 = 만족스럽게"},{"t":"l","s":"타이가","c":"타이가","x":"그렇죠~? 세상이 소란할수록, 이상하게 차 맛은 더 잘 느껴지죠."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(계약도 변신도 없이, 자기 자리에서 지켜 주는 사람이 있다. ……이 도시도, 아직 다 식지는 않았어.)","m":1}]},{"id":"p0-e7-s1","title":"7-2. 광장 구석 — 「거리의 가희」","blocks":[{"t":"d","g":"배경","x":"저녁 광장 구석 — 꺼진 전광판 아래, 작은 가로등 하나"},{"t":"d","g":"BGM","x":"무반주 → 소녀의 노래 (허밍에서 시작)"},{"t":"d","g":"SE","x":"웅성임이 서서히 잦아든다"},{"t":"n","x":"그 소란의 한가운데였다. 광장 구석에서, 노랫소리가 들린 것은."},{"t":"n","x":"반주도, 마이크도 없었다. 그런데도 사람들이 하나둘, 발걸음을 멈췄다."},{"t":"d","g":"표정","x":"행인A = 걸음을 멈춘다"},{"t":"l","s":"행인A","c":"행인A","x":"……뭐야, 이 노래."},{"t":"d","g":"표정","x":"행인B = 폰을 내린다"},{"t":"l","s":"행인B","c":"행인B","x":"조용히 해 봐. ……듣게."},{"t":"d","g":"표정","x":"행인C = 두리번거린다"},{"t":"l","s":"행인C","c":"행인C","x":"어디서 나는 소리야? 반주도 없는데."},{"t":"d","g":"표정","x":"행인D = 손끝으로 가리킨다"},{"t":"l","s":"행인D","c":"행인D","x":"저기. 꺼진 전광판 밑에."},{"t":"n","x":"절망 중계가 도배한 거리 한구석에서, 소녀 하나가 홀로 노래하고 있었다."},{"t":"n","x":"낯익은 얼굴이었다. — 마시로. 이 세계에서는, 무대도 밴드도 없는 거리의 가수."},{"t":"d","g":"표정","x":"아이 = 엄마 손을 잡고"},{"t":"l","s":"아이","c":"아이","x":"엄마, 저 언니 노래, 슬픈 거야?"},{"t":"d","g":"표정","x":"엄마 = 아이 손을 고쳐 잡으며"},{"t":"l","s":"엄마","c":"엄마","x":"……글쎄. 근데 이상하다. 듣고 있으니까, 무섭던 게 조금……."},{"t":"d","g":"표정","x":"행인D = 폰 카메라를 들다가, 내린다"},{"t":"l","s":"행인D","c":"행인D","x":"……찍는 게, 미안해지네. 이건."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(화면은 백 개인데, 노래는 하나다. 그런데— 하나가 이기고 있어.)","m":1},{"t":"d","g":"SE","x":"광장 반대편 전광판에서 방송 소리가 왈칵 커진다"},{"t":"l","s":"벨(먼 화면)","c":"메이","x":"「—자아, 다음 실패 영상은~」"},{"t":"d","g":"표정","x":"행인B = 눈살"},{"t":"l","s":"행인B","c":"행인B","x":"……시끄럽네, 저건. 오늘따라 더."},{"t":"d","g":"표정","x":"행인C = 노래 쪽으로 몸을 돌린다"},{"t":"l","s":"행인C","c":"행인C","x":"이상하지. 어제까진 다들 넋 놓고 봤는데."},{"t":"d","g":"표정","x":"치코 = 인파 속에서 까치발"},{"t":"l","s":"치코","c":"치코","x":"저, 저기, 죄송해요…… 조, 조금만, 앞에……."},{"t":"d","g":"표정","x":"행인A = 옆 사람에게, 소곤"},{"t":"l","s":"행인A","c":"행인A","x":"……희한하네. 폰 보던 것도 잊고 있었어, 나."},{"t":"l","s":"행인B","c":"행인B","x":"조용히 하라니까. ……끝나 간다."},{"t":"d","g":"SE","x":"노래가 끝난다 → 한 박자 뒤, 박수"},{"t":"d","g":"표정","x":"행인C = 박수를 치며"},{"t":"l","s":"행인C","c":"행인C","x":"한 곡만…… 한 곡만 더 안 될까요."},{"t":"d","g":"표정","x":"행인D = 끄덕인다"},{"t":"l","s":"행인D","c":"행인D","x":"부탁합니다. 요즘, 이런 게 없어서."},{"t":"d","g":"표정","x":"아이 = 폴짝폴짝"},{"t":"l","s":"아이","c":"아이","x":"한 번 더! 한 번 더!"},{"t":"d","g":"표정","x":"엄마 = 아이를 다독이며"},{"t":"l","s":"엄마","c":"엄마","x":"쉿, 조르는 거 아니야……. 죄, 죄송해요."},{"t":"d","g":"표정","x":"마시로 = 정중히 인사"},{"t":"l","s":"마시로","c":"마시로","x":"……들어 주셔서, 감사합니다. 무서운 밤일수록, 노래는 필요하니까요."},{"t":"d","g":"표정","x":"마시로 = 잠깐 생각 → 미소"},{"t":"l","s":"마시로","c":"마시로","x":"그럼, 짧은 걸로 하나만 더. 목이 하나뿐이라, 아껴 불러야 하거든요."},{"t":"d","g":"SE","x":"작은 웃음 — 오늘 이 거리에서 처음 나는 종류의 웃음"},{"t":"n","x":"두 번째 노래는 첫 번째보다 짧았고, 끝난 뒤의 정적은 더 길었다."},{"t":"d","g":"표정","x":"행인A = 눈가를 훔친다"},{"t":"l","s":"행인A","c":"행인A","x":"……뭐야. 왜 눈물이 나냐, 이게."},{"t":"d","g":"표정","x":"행인B = 먼 곳을 보며"},{"t":"l","s":"행인B","c":"행인B","x":"……우리 딸도 마법소녀 팬이었는데. 요즘은 무섭다고 울어. …이 노래, 들려주고 싶다."},{"t":"d","g":"표정","x":"엄마 = 아이를 안아 올리며"},{"t":"l","s":"엄마","c":"엄마","x":"끝까지 듣고 가자. ……오늘은, 그래도 될 것 같아."},{"t":"d","g":"표정","x":"아이 = 손뼉을 치며"},{"t":"l","s":"아이","c":"아이","x":"나 이 노래 좋아!"},{"t":"d","g":"표정","x":"행인D = 폰을 주머니에 넣는다"},{"t":"l","s":"행인D","c":"행인D","x":"……오늘은 됐다, 화면은."},{"t":"d","g":"표정","x":"치코 = 어느새 맨 앞줄 (눈물 그렁)"},{"t":"l","s":"치코","c":"치코","x":"저, 저기……! 노래, 정말…… 정말 좋았어요……!"},{"t":"d","g":"표정","x":"마시로 = 부드럽게"},{"t":"l","s":"마시로","c":"마시로","x":"감사합니다. …당신, 얼굴이 조금 지쳐 있네요. 요즘 밤에, 잘 못 주무시죠?"},{"t":"d","g":"표정","x":"치코 = 뜨끔"},{"t":"l","s":"치코","c":"치코","x":"에……?! 아, 아뇨, 그, 그게……."},{"t":"d","g":"표정","x":"마시로 = 미소 (더 묻지 않는다)"},{"t":"l","s":"마시로","c":"마시로","x":"캐묻지 않을게요. 다만— 지친 날에는 또 들으러 오세요. 저는 대체로, 여기 있으니까."},{"t":"d","g":"표정","x":"마시로 = 조금 곤란한 웃음"},{"t":"l","s":"마시로","c":"마시로","x":"후후. …그렇게 똑바로 칭찬해 주시면, 조금 부끄러운데요."},{"t":"d","g":"표정","x":"치코 = 허둥"},{"t":"l","s":"치코","c":"치코","x":"아…… 죄, 죄송해요……!"},{"t":"d","g":"표정","x":"마시로 = 고개를 젓는다"},{"t":"l","s":"마시로","c":"마시로","x":"사과할 일은 아니에요. 오늘 들은 것 중에, 제일 기쁜 말이었어요."},{"t":"d","g":"표정","x":"치코 = 머뭇머뭇"},{"t":"l","s":"치코","c":"치코","x":"저, 저기…… 노래하시는 분은, 무, 무섭지 않으세요? 화면에서 매일…… 무서운 것만, 나오는데……."},{"t":"d","g":"표정","x":"마시로 = 잠깐 눈을 감는다"},{"t":"l","s":"마시로","c":"마시로","x":"무서워요. 저도 사람이니까요. ……그래서 부르는 거예요. 목소리가 떨리는 날에는, 노래가 제일 정직하거든요."},{"t":"l","s":"치코","c":"치코","x":"저, 정직……?"},{"t":"l","s":"마시로","c":"마시로","x":"네. 떨리는 채로 부르면, 떨리는 채로 닿아요. 그거면 충분해요."},{"t":"d","g":"표정","x":"치코 = 자기 가슴께를 꼭 쥔다"},{"t":"l","s":"치코","c":"치코","x":"……저, 저도, 그렇게 될 수 있을까요. 떨, 떨리는 채로도…… 제대로……."},{"t":"d","g":"표정","x":"마시로 = 눈을 부드럽게 접으며"},{"t":"l","s":"마시로","c":"마시로","x":"후후. …지금도 충분히, 제대로 말하고 계신걸요."},{"t":"d","g":"표정","x":"행인B = 조심스럽게"},{"t":"l","s":"행인B","c":"행인B","x":"저기, 이름이 뭐예요? 가수분."},{"t":"d","g":"표정","x":"마시로 = 가볍게 목례"},{"t":"l","s":"마시로","c":"마시로","x":"……마시로, 라고 해요. 거리의, 그냥 가수예요."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"('그냥 가수', 라. …이 도시에서 '그냥'만큼 귀해진 말이 또 있을까.)","m":1},{"t":"d","g":"표정","x":"행인C = 손을 반쯤 들고"},{"t":"l","s":"행인C","c":"행인C","x":"저기, 다음엔 신청곡 해도 돼요?"},{"t":"d","g":"표정","x":"마시로 = 끄덕인다"},{"t":"l","s":"마시로","c":"마시로","x":"……네. 아는 곡이면, 꼭."},{"t":"d","g":"표정","x":"엄마 = 아이를 안은 채, 꾸벅"},{"t":"l","s":"엄마","c":"엄마","x":"감사합니다, 가수님. 애가 요즘 통 못 웃었는데."},{"t":"d","g":"표정","x":"마시로 = 아이에게 손을 흔들며"},{"t":"l","s":"마시로","c":"마시로","x":"저야말로. …아이 박수가, 제일 크게 들렸어요."},{"t":"d","g":"표정","x":"행인A = 아쉬운 듯"},{"t":"l","s":"행인A","c":"행인A","x":"내일도 여기서 불러요?"},{"t":"d","g":"표정","x":"마시로 = 미소"},{"t":"l","s":"마시로","c":"마시로","x":"……네, 아마도. 목이 허락하는 한."},{"t":"d","g":"표정","x":"주군 = 다가선다"},{"t":"l","s":"주군","c":"주군","x":"……좋은 노래였다. 그런데 하나 물어도 되나. 왜 하필 지금, 이 자리에서 부르지? 도시가 이 모양인 때에."},{"t":"d","g":"표정","x":"마시로 = 꺼진 전광판을 올려다본다"},{"t":"l","s":"마시로","c":"마시로","x":"이 모양인 때라서, 예요. …저 화면들은 사람들에게 「무서워해라」라고 말하잖아요. 그럼 누군가는, 「무서워해도 괜찮아」라고 말해야죠."},{"t":"l","s":"주군","c":"주군","x":"……'무서워해도 괜찮아'라. 화면 백 개가 하는 말보다, 그쪽이 어려운 말이군."},{"t":"d","g":"표정","x":"마시로 = 조용히"},{"t":"l","s":"마시로","c":"마시로","x":"어려운 말이라서, 노래에 실어요. 말로 하면 설교가 되지만, 노래로 하면— 위로가 되거든요."},{"t":"d","g":"표정","x":"마시로 = 주군을 본다"},{"t":"l","s":"마시로","c":"마시로","x":"노래는 계약이 필요 없거든요. …그게 노래의 제일 좋은 점이에요."},{"t":"d","g":"표정","x":"주군 = 순간 멈춘다"},{"t":"l","s":"주군","c":"주군","x":"(………계약이 필요 없다. …지금, '계약'이라고 했나? 아니— 우연이겠지. 우연이라고 해 두자.)","m":1},{"t":"d","g":"표정","x":"마시로 = 치코에게, 부드럽게"},{"t":"l","s":"마시로","c":"마시로","x":"그럼— 또 오세요. 다음에 만날 때는, 손님 얼굴이 덜 지쳐 있으면 좋겠네요."},{"t":"d","g":"표정","x":"치코 = 몇 번이고 끄덕"},{"t":"l","s":"치코","c":"치코","x":"네…… 네! 꼬, 꼭 올게요……!"},{"t":"d","g":"표정","x":"행인A = 돌아서며"},{"t":"l","s":"행인A","c":"행인A","x":"야, 근데 우리 지금 몇 분을 서 있었던 거냐."},{"t":"d","g":"표정","x":"행인B = 걸음을 떼며"},{"t":"l","s":"행인B","c":"행인B","x":"몰라. ……좋은 몇 분이었다는 것만 알아."},{"t":"n","x":"돌아가는 길, 치코는 그 노래를 서툴게 흥얼거렸다. 며칠 만에 보는, 아무것도 짊어지지 않은 얼굴이었다."},{"t":"n","x":"나는 그 사실을 — 계약 없이도 사람을 지키는 방법이 있다는 사실을 — 주머니 속 부적처럼 챙겨 두었다."}]}]},{"id":"p0-e8","title":"8화 「가시덩굴」","scenes":[{"id":"p0-e8-s0","title":"8-1. 버려진 성당 — 「결박의 마녀」","blocks":[{"t":"d","g":"배경","x":"버려진 성당 내부 — 무너진 제단, 스테인드글라스 틈의 달빛, 사방을 채운 장미 가시덩굴"},{"t":"d","g":"BGM","x":"파이프오르간 한 음이 길게 눌린 드론"},{"t":"d","g":"SE","x":"덩굴이 스치는 소리, 물방울"},{"t":"n","x":"결계의 좌표는, 언덕 위의 버려진 성당이었다."},{"t":"n","x":"정찰 계획을 승인한 것은— 나였다. 접촉은 피하고, 관측만 한다. 그렇게 조건을 달았고, 아이들은 끄덕였고, 나는 그것으로 충분하다고 생각했다."},{"t":"n","x":"문을 넘는 순간 알았다 — 이번 것은, 지금까지의 '둥지'와는 격이 다르다."},{"t":"d","g":"표정","x":"레오나 = 선두, 낮은 목소리"},{"t":"l","s":"레오나","c":"레오나","x":"……전원, 대형 유지. 벽에서 떨어져. 저 )","m":1},{"t":"d","g":"표정","x":"에글랑틴 = 황홀하게"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"이리스 님이 말씀하셨어요. 곧, 예쁘게 필 꽃들이 온다고. …그러니 시들기 전에, 여기 묶여 있어요. 제가 지켜 드릴게요. 영원히, 아무 데도 못 가게."},{"t":"d","g":"표정","x":"치코링 = 숨을 삼킨다"},{"t":"l","s":"치코링","c":"치코","x":"……! 그, 그 사람……."},{"t":"d","g":"표정","x":"레오나 = 낮게"},{"t":"l","s":"레오나","c":"레오나","x":"역시 이어져 있구나, 골목의 그 여자랑. …전원, 반보씩 물러서. 천천히."},{"t":"d","g":"표정","x":"에글랑틴 = 두 손을 다시 모은다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"그분은 시든 꽃도 버리지 않으세요. …이렇게 예쁜 밤에 여러분이 와 주신 것도, 전부 인도랍니다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(저 얼굴로, 저런 말을 하게 두는가. ……이 세계는 어디까지 악취미인 거지.)","m":1},{"t":"d","g":"표정","x":"히땅 = 오한"},{"t":"l","s":"히땅","c":"히스이","x":"……지켜 준다는 말이, 이렇게 무섭게 들리는 건 처음인데."},{"t":"d","g":"이펙트","x":"덩굴이 발목 높이로 스르륵 — 치코링을 향해 뻗는다"},{"t":"d","g":"표정","x":"치코링 = 펄쩍"},{"t":"l","s":"치코링","c":"치코","x":"히익! 바, 발……!"},{"t":"d","g":"표정","x":"치코링 = 뒷걸음질"},{"t":"l","s":"치코링","c":"치코","x":"지, 지금, 발목을…… 자, 잡으려고 했어요……!"},{"t":"d","g":"이펙트","x":"홍련의 불줄기가 바닥을 그어 저지선을 긋는다"},{"t":"d","g":"SE","x":"화륵!"},{"t":"d","g":"표정","x":"레오나 = 겨눈 채"},{"t":"l","s":"레오나","c":"레오나","x":"선 넘지 마. ……태운다."},{"t":"d","g":"표정","x":"에글랑틴 = 슬픈 얼굴"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"아아…… 불은 안 돼요. 꽃에게 불은, 제일 나쁜 어른이랍니다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(불을 보는 눈이 변했다. 경계…… 아니, 혐오에 가깝다.)","m":1},{"t":"d","g":"이펙트","x":"천장에서 가시 다발 낙하"},{"t":"d","g":"SE","x":"촤르륵!!"},{"t":"d","g":"표정","x":"히땅 = 올려다본다"},{"t":"l","s":"히땅","c":"히스이","x":"위에서. ……셋."},{"t":"d","g":"표정","x":"레오나 = 즉응"},{"t":"l","s":"레오나","c":"레오나","x":"태운다, 눈 감아!"},{"t":"d","g":"SE","x":"화르륵!!"},{"t":"d","g":"표정","x":"치코링 = 떨리는 손으로 조준"},{"t":"l","s":"치코링","c":"치코","x":"새, 새벽빛— 가, 갑니다……!"},{"t":"d","g":"이펙트","x":"유령불 화살이 덩굴 틈을 꿰뚫는다"},{"t":"d","g":"표정","x":"네네링 = 씩 웃으며"},{"t":"l","s":"네네링","c":"네네","x":"오, 제법인데 신입! 하지만 화력이라면 이 몸이지!"},{"t":"d","g":"표정","x":"레오나 = 제지"},{"t":"l","s":"레오나","c":"레오나","x":"큰 불꽃은 안 돼! 폭발광이 덩굴을 깨워!"},{"t":"d","g":"표정","x":"네네링 = 벙찜"},{"t":"l","s":"네네링" 야."},{"t":"n","x":"성당을 등지고 밤길을 달렸다. 아무도 입을 열지 않았다."},{"t":"n","x":"시들었다. — 그 한마디가, 등 뒤에서 가시처럼 박혀 빠지지 않았다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(레오나는 저 단어에 화를 냈다. 놀란 게 아니라— 화를 냈어. …알고 있는 자의 반응이다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(그리고— 이 정찰을 허가한 건, 나다. 조건 따위, 전장에서는 종이 한 장이라는 걸 알면서. …네네의 다리는, 내 서류의 값이다.)","m":1},{"t":"d","g":"배경","x":"병원 앞 — 새벽에 가까운 밤"},{"t":"d","g":"표정","x":"레오나 = 접수구의 불빛을 등지고"},{"t":"l","s":"레오나","c":"레오나","x":"……계약자 씨. 오늘 일은, 제 판단 미스예요. ……그렇게 해 두죠."},{"t":"d","g":"표정","x":"주군 = 고개를 젓는다"},{"t":"l","s":"주군","c":"주군","x":"……서명한 사람의 책임이다. 그 줄은, 내 몫이야."},{"t":"d","g":"표정","x":"레오나 = 한참 만에, 작게"},{"t":"l","s":"레오나","c":"레오나","x":"………나눠요, 그럼. 반씩."},{"t":"n","x":"그 밤, 네네는 전선을 떠났다. 병원은 '원인 불명의 탈진'이라고 했다."},{"t":"n","x":"원인을, 아는 사람은 따로 있는 것 같았지만."}]}]},{"id":"p0-e9","title":"9화 「시드는 냄새」","scenes":[{"id":"p0-e9-s0","title":"9-1. 병실 — 「꽃잎처럼」","blocks":[{"t":"d","g":"배경","x":"병원 개인실 — 창가의 꽃병, 오후의 흰 빛"},{"t":"d","g":"BGM","x":"무반주에 가까운 피아노 단음"},{"t":"d","g":"SE","x":"심전도 기계음 (규칙적), 커튼 흔들림"},{"t":"n","x":"병실의 네네는, 그 아이답지 않게 조용했다."},{"t":"d","g":"SE","x":"노크 → 문이 조심스럽게 열린다"},{"t":"d","g":"표정","x":"치코 = 봉지를 안고"},{"t":"l","s":"치코","c":"치코","x":"시, 실례합니다…… 네네링 씨, 저희 왔어요……."},{"t":"d","g":"표정","x":"치코 = 봉지를 들어 보인다"},{"t":"l","s":"치코","c":"치코","x":"과, 과일 사 왔어요. 좋아하시는 걸로…… 어, 얼마나 좋아하시는지 몰라서, 저, 전부……."},{"t":"d","g":"표정","x":"히스이 = 뒤따라 들어오며"},{"t":"l","s":"히스이","c":"히스이","x":"……전부 사 왔어. 봉지가 셋이야."},{"t":"d","g":"표정","x":"네네 = 창밖을 보다가, 억지 텐션"},{"t":"l","s":"네네","c":"네네","x":"……뭐야, 다들 그 얼굴은! 이 몸은 그냥 좀 과로한 것뿐이거든?! 금방 복귀할 거니까, 그, 그때까지 지지 말라구!"},{"t":"d","g":"표정","x":"네네 = 봉지를 가리키며"},{"t":"l","s":"네네","c":"네네","x":"그리고 뭐야 그 짐은! 문병이면 웃는 얼굴이 먼저잖아! 이 몸 앞에서 초상집 얼굴 금지!"},{"t":"d","g":"표정","x":"치코 = 입꼬리를 억지로 올린다"},{"t":"l","s":"치코","c":"치코","x":"우…… 우, 웃고 있어요……!"},{"t":"d","g":"표정","x":"네네 = 잠깐 보다가"},{"t":"l","s":"네네","c":"네네","x":"……못 웃네. 빵점. …뭐, 성의는 합격이지만?"},{"t":"d","g":"표정","x":"히스이 = 창가 의자에 앉는다"},{"t":"l","s":"히스이","c":"히스이","x":"……병실, 조용하네. 네가 있는데."},{"t":"d","g":"표정","x":"네네 = 발끈"},{"t":"l","s":"네네","c":"네네","x":"뭐?! 지금 이 몸이 시끄럽다는 거야, 조용하다는 거야!"},{"t":"d","g":"표정","x":"히스이 = 짧게"},{"t":"l","s":"히스이","c":"히스이","x":"……둘 다."},{"t":"n","x":"웃음소리가 나긴 했다. 다만 전보다 짧았고, 끝이 흐렸다."},{"t":"d","g":"표정","x":"치코 = 과도를 꺼낸다"},{"t":"l","s":"치코","c":"치코","x":"사, 사과 깎을게요. 토끼 모양…… 하, 할 줄 알아요."},{"t":"d","g":"표정","x":"네네 = 홱 돌아본다"},{"t":"l","s":"네네","c":"네네","x":"토끼?! …흐, 흥. 애도 아니고. ……귀는 크게 해."},{"t":"d","g":"표정","x":"히스이 = 무표정"},{"t":"l","s":"히스이","c":"히스이","x":"……결국 애잖아."},{"t":"d","g":"표정","x":"네네 = 베개를 던질 기세"},{"t":"l","s":"네네","c":"네네","x":"뭐라 했냐, 잠만보!"},{"t":"d","g":"표정","x":"네네 = 헛기침, 자랑 모드"},{"t":"l","s":"네네","c":"네네","x":"아, 맞다! 간호사 누나가 그러는데, 이 몸 회복력이 또래 평균 이상이래! 역시 이 몸이지!"},{"t":"d","g":"표정","x":"치코 = 진심으로"},{"t":"l","s":"치코","c":"치코","x":"다, 다행이에요…… 정말로……."},{"t":"d","g":"표정","x":"네네 = 시선을 피하며"},{"t":"l","s":"네네","c":"네네","x":"……그, 그러니까. 그런 얼굴 하지 말라구. 이 몸은, 괜찮으니까."},{"t":"d","g":"SE","x":"심전도 기계음 — 규칙적인 소리가 갑자기 크게 들린다"},{"t":"n","x":"대화가 끊길 때마다, 기계음이 방을 채웠다. 규칙적이라서, 더 무서운 소리였다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(병문안의 침묵은 두 종류다. 할 말이 없는 침묵과— 할 말을, 전원이 참고 있는 침묵.)","m":1},{"t":"d","g":"표정","x":"치코 = 과일을 깎다가 손을 멈춘다"},{"t":"l","s":"치코","c":"치코","x":"……네네링 씨. 저기, 하나만…… 무, 물어봐도 돼요?"},{"t":"d","g":"표정","x":"네네 = 뜨끔"},{"t":"l","s":"네네","c":"네네","x":"……뭔데."},{"t":"d","g":"표정","x":"치코 = 조심스럽게"},{"t":"l","s":"치코","c":"치코","x":"변신…… 지금, 될 것 같아요?"},{"t":"d","g":"표정","x":"네네 = 긴 침묵 → 이불을 살짝 쥔다"},{"t":"l","s":"네네","c":"네네","x":"…………안 해 보고 싶어. 지금은."},{"t":"n","x":"안 된다,가 아니라 안 해 보고 싶다. — 그 대답이 전부였다."},{"t":"d","g":"표정","x":"치코 = 고개를 숙인 채, 작게"},{"t":"l","s":"치코","c":"치코","x":"……네. 아, 안 해도 돼요. 지금은…… 그게, 맞아요."},{"t":"d","g":"표정","x":"네네 = 코웃음 (희미하게)"},{"t":"l","s":"네네","c":"네네","x":"……흥. 신입 주제에, 어른 같은 소리 하기는."},{"t":"n","x":"창밖으로 구름이 지나갔고, 방 안의 빛이 한 번 어두워졌다가 돌아왔다."},{"t":"d","g":"표정","x":"히스이 = 어느새 창가 의자에서 일어나, 복도 쪽 벽에 기대어 (드물게 깨어 있는 눈)"},{"t":"l","s":"히스이","c":"히스이","x":"……치코. 손."},{"t":"d","g":"표정","x":"치코 = 갸웃"},{"t":"l","s":"치코","c":"치코","x":"소, 손……?"},{"t":"n","x":"그때, 나도 봤다."},{"t":"n","x":"과도를 쥔 치코의 손끝이 — 꽃잎처럼 옅어졌다가, 천천히 원래대로 돌아오는 것을."},{"t":"d","g":"표정","x":"치코 = 자기 손을 본다 (한 박자 늦게 감춘다)"},{"t":"l","s":"치코","c":"치코","x":"어……? 지, 지금 손이…… 아, 아무것도 아니에요! 피, 피곤해서 그런가……!"},{"t":"d","g":"표정","x":"네네 = 이불에서 상체를 일으킨다"},{"t":"l","s":"네네","c":"네네","x":"……지금 거, 뭐야. 한 번 더 해 봐— 아, 아니, 하지 마. 하지 마!"},{"t":"d","g":"표정","x":"치코 = 허둥지둥"},{"t":"l","s":"치코","c":"치코","x":"괘, 괜찮아요! 아프지도 않고, 그, 금방 돌아오고……!"},{"t":"d","g":"표정","x":"히스이 = 조용히"},{"t":"l","s":"히스이","c":"히스이","x":"……아프지 않다는 걸, 왜 알아."},{"t":"d","g":"표정","x":"치코 = 말문이 막힌다"},{"t":"l","s":"치코","c":"치코","x":"아……."},{"t":"n","x":"겪어 본 적 없는 사람은, 아픈지 아닌지 말하지 못한다. — 방 안의 전원이, 같은 계산을 끝냈다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(아무것도 아닌 게 아니다. 그리고 방금 그 반응은— '처음 겪는' 자의 반응이 아니야.)","m":1},{"t":"d","g":"표정","x":"히스이 = 조용히"},{"t":"l","s":"히스이","c":"히스이","x":"……언제부터야."},{"t":"d","g":"표정","x":"치코 = 시선을 피한다"},{"t":"l","s":"치코","c":"치코","x":"…………성당, 다음 날부터…… 가, 가끔……."},{"t":"d","g":"표정","x":"네네 = 작게"},{"t":"l","s":"네네","c":"네네","x":"……성당."},{"t":"d","g":"표정","x":"치코 = 황급히"},{"t":"l","s":"치코","c":"치코","x":"우, 우연일 수도 있어요……! 그, 그냥, 피곤해서……!"},{"t":"d","g":"표정","x":"히스이 = 창밖을 보며"},{"t":"l","s":"히스이","c":"히스이","x":"……그럴지도. …아닐지도."},{"t":"d","g":"표정","x":"히스이 = 자기 손끝을 내려다본다"},{"t":"l","s":"히스이","c":"히스이","x":"……그래. …나는, 그저께부터."},{"t":"d","g":"표정","x":"치코 = 벌떡"},{"t":"l","s":"치코","c":"치코","x":"히, 히스이 쨩……! 왜, 왜 말 안 했어……!"},{"t":"d","g":"표정","x":"히스이 = 치코를 본다"},{"t":"l","s":"히스이","c":"히스이","x":"……너도 안 했잖아."},{"t":"d","g":"표정","x":"치코 = 움찔"},{"t":"l","s":"치코","c":"치코","x":"그, 그건……."},{"t":"d","g":"표정","x":"히스이 = 시선을 내리며, 천천히"},{"t":"l","s":"히스이","c":"히스이","x":"……무서웠어. 말하면, 진짜가 될 것 같아서."},{"t":"n","x":"그 애답지 않게 긴 문장이었다. 그리고 방 안의 누구도, 아니라고 말해 주지 못했다."},{"t":"d","g":"표정","x":"치코 = 무릎 위의 손을 꼭 쥔다"},{"t":"l","s":"치코","c":"치코","x":"저, 저도요…… 밤에 불을 끄고 나면…… 손을 자꾸 보게 돼요. 오, 오늘은 괜찮나, 하고…… 그러다 보면, 아침이고……."},{"t":"d","g":"표정","x":"네네 = 눈이 커진다"},{"t":"l","s":"네네","c":"네네","x":"……그래서 잠을 못 잤구나, 너."},{"t":"d","g":"표정","x":"치코 = 힘없이 웃는다"},{"t":"l","s":"치코","c":"치코","x":"……네. 노, 노래하는 분한테도 들켰어요. 얼굴만 보고."},{"t":"d","g":"표정","x":"주군 = 히스이에게"},{"t":"l","s":"주군","c":"주군","x":"……히스이. 그저께라면— 전투는 없던 날이지."},{"t":"d","g":"표정","x":"히스이 = 끄덕"},{"t":"l","s":"히스이","c":"히스이","x":"……싸움은, 없었어. …순찰은 돌았지만. …그저께 밤. 순찰 돌고, 집에 갔는데— 자다가, 알았어."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(싸움이 거듭될수록…… 쌓여 가는 건가. 아니— 표본이 둘뿐이다. 단정은 금물이야.)","m":1},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(성당, 다음 날. …우연인가. 아니면— 그 '시들었구나'라는 한마디가, 무언가를 깨운 건가.)","m":1},{"t":"d","g":"표정","x":"네네 = 이불을 만지작거리다가, 툭"},{"t":"l","s":"네네","c":"네네","x":"……저기. 다들. …밤에 소등하고 나면 말이야, 이 병실, 너무 조용해서— ……아, 아니다. 아무것도 아냐!"},{"t":"d","g":"표정","x":"치코 = 침대 곁으로"},{"t":"l","s":"치코","c":"치코","x":"네네링 씨……."},{"t":"d","g":"표정","x":"네네 = 홱 돌아눕는다 → 작게"},{"t":"l","s":"네네","c":"네네","x":"아무것도 아니라니까! ……내일도, 올 거지?"},{"t":"d","g":"표정","x":"치코 = 힘차게"},{"t":"l","s":"치코","c":"치코","x":"네! 매, 매일 올게요!"},{"t":"d","g":"표정","x":"히스이 = 끄덕"},{"t":"l","s":"히스이","c":"히스이","x":"……숙제도 가져올게."},{"t":"d","g":"표정","x":"네네 = 벌떡"},{"t":"l","s":"네네","c":"네네","x":"그건 안 가져와도 돼!!"},{"t":"d","g":"SE","x":"심전도 기계음만 남는다"},{"t":"n","x":"그리고 침묵을 깬 것은, 이 방에서 제일 시끄러운 아이였다."},{"t":"d","g":"표정","x":"네네 = 이불 속에서, 작게"},{"t":"l","s":"네네","c":"네네","x":"………미안. 이 몸이 먼저…… 말했어야 했는데."}]},{"id":"p0-e9-s1","title":"9-2. 목공소 옥상 — 「모르는 척해 줘요」","blocks":[{"t":"d","g":"배경","x":"밤의 목공소 옥상 — 보라색 하늘, 도시의 불빛"},{"t":"d","g":"BGM","x":"낮은 스트링"},{"t":"d","g":"SE","x":"밤바람"},{"t":"n","x":"그 밤, 나는 옥상에서 레오나를 붙잡았다. 더는 미룰 수 없었다."},{"t":"d","g":"SE","x":"옥상 문이 등 뒤에서 닫힌다"},{"t":"d","g":"표정","x":"레오나 = 난간에 팔을 얹은 채, 돌아보지 않고"},{"t":"l","s":"레오나","c":"레오나","x":"……어라, 계약자 씨. 야식이라도 들고 온 거예요? 빈손이네. 빵점."},{"t":"d","g":"표정","x":"주군 = 걸음을 멈춘다"},{"t":"l","s":"주군","c":"주군","x":"……농담할 기운은 남아 있군."},{"t":"d","g":"표정","x":"레오나 = 어깨를 으쓱"},{"t":"l","s":"레오나","c":"레오나","x":"남겨 둬야죠, 그건. 마지막까지 쓰는 근육이니까."},{"t":"d","g":"표정","x":"레오나 = 도시 쪽으로 턱짓"},{"t":"l","s":"레오나","c":"레오나","x":"옥상은 좋죠. 도시가 조용해 '보여서'. 실제로는 하나도 안 조용한데— 높이가 거짓말을 해 줘요."},{"t":"d","g":"표정","x":"주군 = 다가서지 않고, 그 자리에서"},{"t":"l","s":"주군","c":"주군","x":"오늘은 그 거짓말을 들으러 온 게 아니다."},{"t":"n","x":"나는 그 옆에 서지 않았다. 조금 떨어진 곳에서, 등에 대고 말했다. — 도망칠 길을 막지 않는 거리. 그것이 예의라고, 생각했다."},{"t":"d","g":"표정","x":"주군 = 정면으로"},{"t":"l","s":"주군","c":"주군","x":"너, 알고 있는 게 있지."},{"t":"d","g":"표정","x":"레오나 = 등을 보인 채"},{"t":"l","s":"레오나","c":"레오나","x":"……뭘요."},{"t":"l","s":"주군","c":"주군","x":"'시든다'는 말의 뜻. 에글랑틴이 그 말을 했을 때, 너는 놀라지 않았다. 화를 냈지. 그리고 아이들 손끝에 나타나는 그 증상— 너는 한 번도 이상하다고 말한 적이 없어."},{"t":"d","g":"표정","x":"레오나 = 여전히 등을 보인 채, 짧게 웃는다"},{"t":"l","s":"레오나","c":"레오나","x":"……하. 병실에서도, 그 눈으로 애들을 보고 있었구나."},{"t":"l","s":"주군","c":"주군","x":"병실만이 아니다. 성당에서, 네 첫마디는 '무슨 뜻이야'가 아니었어. — '입 다물어'였다."},{"t":"d","g":"표정","x":"레오나 = 침묵"},{"t":"l","s":"주군","c":"주군","x":"모르는 사람은 뜻을 묻는다. 아는 사람만이, 입을 막지."},{"t":"d","g":"표정","x":"레오나 = 침묵"},{"t":"l","s":"주군","c":"주군","x":"레오나."},{"t":"d","g":"표정","x":"레오나 = 돌아본다 — 웃고 있다"},{"t":"l","s":"레오나","c":"레오나","x":"……계약자 씨는, 가끔 눈이 너무 좋아서 곤란해요."},{"t":"n","x":"그녀는 한참 말이 없다가, 웃었다. 우는 것보다 나쁜 웃음이었다."},{"t":"d","g":"표정","x":"레오나 = 가볍게"},{"t":"l","s":"레오나","c":"레오나","x":"칭찬이에요, 그거. 절반은."},{"t":"l","s":"주군","c":"주군","x":"……나머지 절반은."},{"t":"d","g":"표정","x":"레오나 = 웃음을 유지한 채"},{"t":"l","s":"레오나","c":"레오나","x":"……원망."},{"t":"d","g":"SE","x":"밤바람 — 길게"},{"t":"d","g":"표정","x":"레오나 = 문득"},{"t":"l","s":"레오나","c":"레오나","x":"……하나만 물을게요. 그 좋은 눈으로 봐서— 애들, 지금 어때 보여요."},{"t":"d","g":"표정","x":"주군 = 잠깐 고른다"},{"t":"l","s":"주군","c":"주군","x":"……무서워하고 있다. 자기 손끝을. 그리고 서로에게 들키지 않으려고, 더 크게 웃고 있어."},{"t":"d","g":"표정","x":"레오나 = 도시의 불빛을 보며"},{"t":"l","s":"레오나","c":"레오나","x":"………그렇구나. 웃고는 있구나, 아직."},{"t":"d","g":"표정","x":"레오나 = 네네 쪽 하늘을 본다"},{"t":"l","s":"레오나","c":"레오나","x":"네네는요. ……오늘도, 시끄러웠어요?"},{"t":"l","s":"주군","c":"주군","x":"시끄러웠다. ……전보다, 조금 짧게."},{"t":"d","g":"표정","x":"레오나 = 눈을 내리깐다"},{"t":"l","s":"레오나","c":"레오나","x":"……그렇구나."},{"t":"d","g":"표정","x":"레오나 = 난간에 기댄다"},{"t":"l","s":"레오나","c":"레오나","x":"…조금만. 조금만 더, 모르는 척해 줘요. 지금 이 팀에 그 얘기는— 아직 일러."},{"t":"l","s":"주군","c":"주군","x":"모르는 척은, 이미 실패했다. 아이들 쪽이 먼저 알았어. 병실에서— 서로의 손끝을 보고, 서로 입을 다물더군."},{"t":"d","g":"표정","x":"레오나 = 눈을 감는다"},{"t":"l","s":"레오나","c":"레오나","x":"……그 침묵, 계약자 씨가 깨 줬어요?"},{"t":"l","s":"주군","c":"주군","x":"히스이가 깼다. — '언제부터야', 라고."},{"t":"d","g":"표정","x":"레오나 = 작게 웃는다"},{"t":"l","s":"레오나","c":"레오나","x":"……하하. 그 애답네. 제일 졸린 얼굴로, 제일 안 졸린 말만 골라 해."},{"t":"d","g":"표정","x":"레오나 = 웃음을 지운다"},{"t":"l","s":"레오나","c":"레오나","x":"……그 애들은 똑똑해요. 내가 입을 다물어도, 답의 반쯤은 이미 알고 있을 거야. …그러니까 더, 내 입으로는 말 못 해요. 남은 반은— 어른이 말하면, 진짜가 되니까."},{"t":"l","s":"주군","c":"주군","x":"진짜는, 말하지 않아도 진짜다."},{"t":"d","g":"표정","x":"레오나 = 난간을 쥔 손에 힘이 들어간다"},{"t":"l","s":"레오나","c":"레오나","x":"……그런 바른말은, 오늘 밤엔 반칙이에요."},{"t":"l","s":"주군","c":"주군","x":"아직 이르다는 건, 언젠가는 해야 한다는 뜻이다. 그 '언젠가'를 네가 정할 수 있다고 생각하나?"},{"t":"d","g":"표정","x":"레오나 = 도시를 내려다보며"},{"t":"l","s":"레오나","c":"레오나","x":"……못 정하겠죠. 알아요. 그치만— 지금 말하면, 저 애들은 멈추지 않아요. 알면서 싸우게 될 뿐이야. 그게 제일…… 제일 나쁜 거예요."},{"t":"l","s":"주군","c":"주군","x":"(………자기 얘기처럼 말하는군.)","m":1},{"t":"l","s":"주군","c":"주군","x":"'알면서 싸운다'가 왜 제일 나쁘지. 모르고 싸우는 것보다는—"},{"t":"d","g":"표정","x":"레오나 = 말을 자른다"},{"t":"l","s":"레오나","c":"레오나","x":"—모르고 싸우면, 무대 위에서 웃을 수 있어요. 알면서 싸우면, 웃는 '연기'를 하게 돼요. …그 차이, 보는 쪽은 몰라도 하는 쪽은 알아요."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………연기, 라. 광장의 그 무대 스마일이 스치는군. '박수 때문에 싸우게 되면, 위험 신호'— 라던.)","m":1},{"t":"d","g":"표정","x":"주군 = 한 발 다가선다"},{"t":"l","s":"주군","c":"주군","x":"네가 무너지면, 저 아이들의 밤은 통째로 무너진다. 그건 알고 있겠지."},{"t":"d","g":"표정","x":"레오나 = 어깨를 편다"},{"t":"l","s":"레오나","c":"레오나","x":"……알아요. 그래서 안 무너져요. 예정에 없거든요, 그런 거."},{"t":"l","s":"주군","c":"주군","x":"하나만 더. 너는— 너 자신은, 어디까지 와 있지?"},{"t":"d","g":"SE","x":"바람이 멎는다"},{"t":"n","x":"한 박자. 두 박자. — 도시의 소음이, 아주 멀었다."},{"t":"d","g":"표정","x":"레오나 = 순간 정지 → 씩 웃는다 (평소의 얼굴)"},{"t":"l","s":"레오나","c":"레오나","x":"베테랑은요, 페이스 조절의 프로예요. 걱정도 팔자셔."},{"t":"n","x":"대답이 아니었다. 그리고 대답이 아니라는 것 자체가— 대답이었다."},{"t":"l","s"
