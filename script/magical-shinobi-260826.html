"x":"「어머~ 시청자 여러분, 화나셨네요? …그 화, 잊지 마시고— 내일도 시청, 부탁드려요☆」"},{"t":"d","g":"표정","x":"치코 = 주저앉아, 두 손으로 입을 막고"},{"t":"l","s":"치코","c":"치코","x":"흐윽…… 으, 으흐윽……."},{"t":"d","g":"표정","x":"레오나 = 그 옆에 무릎을 굽힌다 — 아무 말도, 하지 못한다"},{"t":"d","g":"표정","x":"주군 = 이를 악문다"},{"t":"l","s":"주군","c":"주군","x":"(…………이 타이밍에 그걸 트나. 악질이라는 말로도 모자라는군.)","m":1}]},{"id":"p0-e10-s1","title":"10-2. 목공소 — 「전부, 말할게요」","blocks":[{"t":"d","g":"배경","x":"심야의 목공소 — 불 꺼진 작업장, 화로의 잔불만"},{"t":"d","g":"BGM","x":"무음에 가까운 저음"},{"t":"d","g":"SE","x":"잔불 타닥임"},{"t":"n","x":"그 밤, 목공소에 모인 얼굴들은 전부 창백했다. 침묵을 깬 것은— 레오나였다."},{"t":"d","g":"SE","x":"잔불이 탁, 튄다"},{"t":"n","x":"광장에서 돌아온 순서대로, 아무도 불을 켜지 않았다. 켜는 법을 잊은 사람들처럼."},{"t":"d","g":"표정","x":"히스이 = 어둠 속에서"},{"t":"l","s":"히스이","c":"히스이","x":"……네네한테는."},{"t":"d","g":"표정","x":"치코 = 폰을 쥔 손이 떨린다"},{"t":"l","s":"치코","c":"치코","x":"……아직, 못 보냈어…… 무, 뭐라고 써야 할지, 몰라서……."},{"t":"d","g":"표정","x":"엔마 = 등불을 탁자에 내려놓는다 — 불이 유난히 작다"},{"t":"d","g":"표정","x":"레오나 = 화로 앞에 선다"},{"t":"l","s":"레오나","c":"레오나","x":"……전부, 말할게요."},{"t":"d","g":"표정","x":"치코 = 고개를 든다"},{"t":"l","s":"치코","c":"치코","x":"레, 레오나 씨……."},{"t":"d","g":"표정","x":"레오나 = 한 사람씩 눈을 맞춘다"},{"t":"l","s":"레오나","c":"레오나","x":"오늘 밤까지 말 안 한 거, 전부. …앉아서 들어 줘요. 길지는 않아. 길게 말할 자격도, 나한텐 없고."},{"t":"d","g":"표정","x":"히스이 = 조용히 의자를 끈다"},{"t":"l","s":"히스이","c":"히스이","x":"……앉을게."},{"t":"d","g":"SE","x":"의자 끄는 소리 — 그것이 전부"},{"t":"d","g":"표정","x":"레오나 = 숨을 고른다"},{"t":"l","s":"레오나","c":"레오나","x":"마법소녀의 힘은 공짜가 아니에요. 쓰면 쓸수록, 간절하면 간절할수록— 우리는 '피어' 가요. 그리고 활짝 핀 꽃이 그다음에 뭘 하는지는, 다들 알죠."},{"t":"d","g":"표정","x":"치코 = 떨리는 목소리"},{"t":"l","s":"치코","c":"치코","x":"피…… 피어 간다니…… 그, 그게……."},{"t":"d","g":"표정","x":"레오나 = 담담하게"},{"t":"l","s":"레오나","c":"레오나","x":"강해지는 거야. 간절할수록, 반짝일수록. …좋은 일처럼 들리지? 나도 처음엔, 그런 줄 알았어."},{"t":"d","g":"표정","x":"히스이 = 조용히"},{"t":"l","s":"히스이","c":"히스이","x":"……시든다."},{"t":"d","g":"표정","x":"레오나 = 히스이를 본다"},{"t":"l","s":"레오나","c":"레오나","x":"……응. 역시, 반쯤은 알고 있었구나."},{"t":"d","g":"표정","x":"히스이 = 자기 손끝을 본다"},{"t":"l","s":"히스이","c":"히스이","x":"……손끝이, 가르쳐 줬어."},{"t":"d","g":"표정","x":"레오나 = 끄덕인다"},{"t":"l","s":"레오나","c":"레오나","x":"만개한 소녀는 시들어요. 시듦의 끝은— 마녀. …우리가 밤마다 싸워 온 상대는, 전부 '선배'들이에요."},{"t":"d","g":"SE","x":"화로의 장작이 무너진다"},{"t":"n","x":"누구도 소리를 지르지 않았다. 차라리, 지르는 편이 나았을 것이다."},{"t":"d","g":"표정","x":"치코 = 입술이 하얗다"},{"t":"l","s":"치코","c":"치코","x":"서, 선배…… 그, 그럼…… 우리가, 쓰, 쓰러뜨려 온 것들도……."},{"t":"d","g":"표정","x":"레오나 = 시선을 피하지 않는다"},{"t":"l","s":"레오나","c":"레오나","x":"……응. 언젠가의, 누군가야. 전부."},{"t":"d","g":"표정","x":"치코 = 고개를 떨군다"},{"t":"l","s":"치코","c":"치코","x":"그, 그런 걸…… 저희는, 모, 모르고……."},{"t":"d","g":"표정","x":"레오나 = 조용히"},{"t":"l","s":"레오나","c":"레오나","x":"……모르게 한 게, 나야."},{"t":"d","g":"표정","x":"히스이 = 입을 막는다"},{"t":"l","s":"히스이","c":"히스이","x":"……토할 것 같아."},{"t":"d","g":"표정","x":"치코 = 목소리가 떨린다"},{"t":"l","s":"치코","c":"치코","x":"그, 그럼…… 성당의 그 사람도…… 화면 속의 그 사람도…… 전부……."},{"t":"d","g":"표정","x":"레오나 = 눈을 감는다"},{"t":"l","s":"레오나","c":"레오나","x":"그리고— [절화의 마녀]는. …이 도시 최강이었던, [만개의 소녀]예요."},{"t":"d","g":"표정","x":"치코 = 멍하니"},{"t":"l","s":"치코","c":"치코","x":"최…… 강……."},{"t":"d","g":"표정","x":"히스이 = 낮게"},{"t":"l","s":"히스이","c":"히스이","x":"……제일 반짝였던 사람이, 제일 먼저 떨어졌다는 거네."},{"t":"d","g":"표정","x":"레오나 = 고개를 젓는다"},{"t":"l","s":"레오나","c":"레오나","x":"……그 이상은, 나도 소문밖에 몰라요. 소문조차— 입에 담기 무거운 종류의."},{"t":"d","g":"표정","x":"주군 = 숨을 삼킨다"},{"t":"l","s":"주군","c":"주군","x":"(………언젠가, 꿈에서 본 것 같은 광경이다. '축하해요, 당신 오늘 밤 만개했어요'. ……설마.)","m":1},{"t":"d","g":"표정","x":"치코 = 겨우, 묻는다"},{"t":"l","s":"치코","c":"치코","x":"그럼…… 쥬, 쥬리땅 씨도…… 지금……."},{"t":"d","g":"표정","x":"레오나 = 대답하지 못한다"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(광장의 자막이 스친다. '소'를 덮어쓰려던— 그 글자가. ……생각을, 여기서 멈춰야 하나.)","m":1},{"t":"d","g":"표정","x":"히스이 = 주먹을 쥔다"},{"t":"l","s":"히스이","c":"히스이","x":"……왜 지금까지 말 안 했어."},{"t":"d","g":"표정","x":"치코 = 놀라서"},{"t":"l","s":"치코","c":"치코","x":"히, 히스이 쨩…… 그, 그런 말투는……."},{"t":"d","g":"표정","x":"히스이 = 고개를 젓는다"},{"t":"l","s":"히스이","c":"히스이","x":"……화내는 게 아니야. …아니. 화내는 거, 맞아. 미안. 그래도— 들어야겠어."},{"t":"d","g":"표정","x":"엔마 = 조용히, 고개를 숙인다"},{"t":"l","s":"엔마","c":"엔마","x":"……저도, 알고 있었습니다. 소문의 끝자락뿐이라 확신이 없었다는 건— 변명이 되지 않겠지요. [홍련] 혼자 짊어질 일이 아니에요. 함께, 고개를 숙이겠습니다."},{"t":"n","x":"등불지기는 정말로, 깊게 고개를 숙였다. 등불의 그림자가 길게 흔들렸다."},{"t":"d","g":"표정","x":"치코 = 손을 내젓는다"},{"t":"l","s":"치코","c":"치코","x":"어, 얼굴 들어 주세요…… 두 분 다……. 저, 저희는, 사과를 받고 싶은 게, 아니라……."},{"t":"d","g":"표정","x":"엔마 = 고개를 숙인 채"},{"t":"l","s":"엔마","c":"엔마","x":"……알아요. 그래도 이것은, 먼저 온 사람의 몫이지요. 사과부터 하는 것이."},{"t":"d","g":"표정","x":"히스이 = 되뇐다"},{"t":"l","s":"히스이","c":"히스이","x":"……먼저 온 사람."},{"t":"d","g":"표정","x":"엔마 = 천천히 고개를 든다"},{"t":"l","s":"엔마","c":"엔마","x":"네. 등을 먼저 든 사람은, 뒤에 오는 사람의 발밑까지 밝혀야 하는 법이랍니다. …저는 그것을, 절반만 했지요."},{"t":"d","g":"표정","x":"레오나 = 똑바로 받는다"},{"t":"l","s":"레오나","c":"레오나","x":"말하면 너희가 멈출 것 같아서— 가 아니야. 반대야. …말해도 안 멈출 것 같아서. 알면서 싸우는 얼굴을, 보고 싶지 않았어."},{"t":"d","g":"표정","x":"치코 = 울음을 참으며"},{"t":"l","s":"치코","c":"치코","x":"……레오나, 씨……."},{"t":"d","g":"표정","x":"레오나 = 화로의 잔불을 보며"},{"t":"l","s":"레오나","c":"레오나","x":"웃으면서 싸우는 얼굴은, 봐 줄 수 있었어. 무서워하면서 싸우는 얼굴도. …근데 '알면서' 싸우는 얼굴은— 그건, 매일 밤이 장례식이야. 나는 그걸, 너희 얼굴에서 보고 싶지 않았어."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(그 얼굴을, 이 여자는 어디서 봤을까. — 물을 수 있는 밤이, 아니다.)","m":1},{"t":"d","g":"표정","x":"치코 = 일어선다"},{"t":"l","s":"치코","c":"치코","x":"그, 그럼…… 우리는…… 이기면, 뭐가 되는 건데요……?"},{"t":"n","x":"아무도 대답하지 못했다."},{"t":"d","g":"SE","x":"잔불이 사그라든다"},{"t":"d","g":"표정","x":"치코 = 한 번 더, 갈라진 목소리로"},{"t":"l","s":"치코","c":"치코","x":"대, 대답해 주세요…… 누구든…… 이기면…… 이, 이긴 다음에는……!"},{"t":"d","g":"표정","x":"레오나 = 입을 연다 — 닫는다"},{"t":"d","g":"표정","x":"엔마 = 등불만 바라본다"},{"t":"n","x":"이기면 시들고, 시들면 마녀가 된다. 지면— 도시가 삼켜진다. 어느 쪽으로 걸어도, 출구에 이름이 없었다."},{"t":"d","g":"표정","x":"히스이 = 등을 돌린다"},{"t":"l","s":"히스이","c":"히스이","x":"……미안. 오늘은, 생각할 시간이 필요해."},{"t":"d","g":"표정","x":"치코 = 손을 뻗다가, 내린다"},{"t":"l","s":"치코","c":"치코","x":"히스이, 쨩……."},{"t":"d","g":"SE","x":"문이 닫힌다 — 조심스럽게, 그래서 더 크게"},{"t":"d","g":"표정","x":"치코 = 고개를 숙인다"},{"t":"l","s":"치코","c":"치코","x":"저, 저도…… 죄송해요…… 오늘은, 머리가…… 아, 안 돌아가서……."},{"t":"d","g":"표정","x":"레오나 = 애써 부드럽게"},{"t":"l","s":"레오나","c":"레오나","x":"……응. 가. 밤길 조심하고. …데려다줄— …아니다. 혼자 걷고 싶지, 오늘은."},{"t":"d","g":"표정","x":"치코 = 문 앞에서, 작게"},{"t":"l","s":"치코","c":"치코","x":"……죄송해요……."},{"t":"d","g":"표정","x":"엔마 = 등불을 든다"},{"t":"l","s":"엔마","c":"엔마","x":"……저는 병원에 들르겠습니다. [섬화]에게는— 제 입으로 전하는 것이 맞겠지요."},{"t":"d","g":"표정","x":"주군 = 고개를 숙인다"},{"t":"l","s":"주군","c":"주군","x":"……부탁한다."},{"t":"d","g":"표정","x":"엔마 = 문가에서, 돌아보며"},{"t":"l","s":"엔마","c":"엔마","x":"계약자 님. …오늘 밤은 아무도, 자책으로 잠들지 않기를. 그것만 빌지요."},{"t":"n","x":"하나가 나가고, 둘이 나가고. 화로의 잔불이 꺼질 무렵에는— 목공소에 나와 레오나만 남아 있었다."},{"t":"d","g":"SE","x":"마지막 장작이 내려앉는다"},{"t":"d","g":"표정","x":"레오나 = 화로를 본 채"},{"t":"l","s":"레오나","c":"레오나","x":"……계약자 씨. 아직 안 갔네요."},{"t":"d","g":"표정","x":"주군 = 그 자리에 선 채"},{"t":"l","s":"주군","c":"주군","x":"……갈 데까지 보고 가는 게, 서명한 사람의 일이라서."},{"t":"d","g":"표정","x":"레오나 = 픽, 웃으려 한다"},{"t":"l","s":"레오나","c":"레오나","x":"하하…… 뭐예요, 그게. 이상한 직업 정신……."},{"t":"d","g":"표정","x":"레오나 = 웃으려던 얼굴이, 무너진다"},{"t":"l","s":"레오나","c":"레오나","x":"……이상하다. 웃으려고 했는데. 얼굴이…… 말을, 안 듣네……."},{"t":"n","x":"처음이었다. 이 여자의 밝음이 무너지는 것을 본 것은. 소리도 없이— 무릎보다 먼저, 얼굴부터 무너졌다."},{"t":"d","g":"표정","x":"레오나 = 두 손으로 얼굴을 가린다"},{"t":"l","s":"레오나","c":"레오나","x":"말 안 하면, 지킬 수 있을 줄 알았어…… 말하면 다 부서질 줄 알았는데…… 결국, 말도 못 하고, 지키지도 못하고……."},{"t":"d","g":"표정","x":"주군 = 한 걸음"},{"t":"l","s":"주군","c":"주군","x":"……레오나."},{"t":"d","g":"표정","x":"레오나 = 얼굴을 가린 채, 고개만 젓는다"},{"t":"l","s":"레오나","c":"레오나","x":"……미안해요. 잠깐만. 잠깐만, 이러고 있을게요."},{"t":"d","g":"표정","x":"레오나 = 잔불을 보며, 혼잣말처럼"},{"t":"l","s":"레오나","c":"레오나","x":"……또, 못 지켰네. 이번에도."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(팀은 소리도 없이 무너졌다. 나는 어른이면서— 이 밤을 위한 말을, 한마디도 준비해 두지 못했다.)","m":1}]},{"id":"p0-e10-s2","title":"1부-END. 「만개」 끝","blocks":[{"t":"n","x":"보라색 하늘 아래, 도시는 그날부터 마법소녀의 이야기를 하지 않게 되었다."},{"t":"n","x":"전광판은 꺼졌고, 목공소의 등불은 켜지지 않았고— 결계만이, 변함없이 밤마다 늘어났다."},{"t":"n","x":"료의 나선은, 이제 지도의 절반을 감고 있었다."},{"t":"l","s":"주군","c":"주군","x":"(……이대로 끝나게 둘 수는 없다. 서명한 어른이, 할 일이 남아 있어.)","m":1},{"t":"d","g":"이펙트","x":"암전 — 「2부 「절화」에서 계속」"}]}]}]},{"key":"2부","title":"2부 「절화(切花)」","meta":[],"notes":[],"episodes":[{"id":"p1-e0","title":"11화 「혼자 남은 등불」","scenes":[{"id":"p1-e0-s0","title":"11-1. 밤의 결계 — 「그래도 걷는 유령불」","blocks":[{"t":"d","g":"배경","x":"심야의 결계 내부 — 주택가가 접힌 공간"},{"t":"d","g":"BGM","x":"유령불 테마 (여명 테마의 단조 변주)"},{"t":"d","g":"SE","x":"소녀의 거친 숨소리"},{"t":"n","x":"아무도 목공소에 오지 않게 되었다."},{"t":"n","x":"그런데도 결계는 밤마다 열렸고 — 유령불 하나가, 혼자 그 안을 걷고 있었다."},{"t":"d","g":"이펙트","x":"접힌 주택가의 어둠 속 — 작은 등불 하나가 흔들리며 나아간다"},{"t":"d","g":"표정","x":"치코링 = 홀로, 등불을 앞세우고"},{"t":"l","s":"치코링","c":"치코","x":"……괘, 괜찮아. 오늘도 할 수 있어. 어, 어제도 했으니까."},{"t":"l","s":"치코링","c":"치코","x":"하나, 둘…… 숨. …그, 그래. 숨부터. 히스이 쨩이 그랬잖아. 숨이 무너지면, 다 무너진다고."},{"t":"d","g":"SE","x":"어둠 저편 — 무언가가 끌리는 소리"},{"t":"d","g":"표정","x":"치코링 = 멈춰 선다"},{"t":"l","s":"치코링","c":"치코","x":"……! 이, 있다……."},{"t":"l","s":"치코링","c":"치코","x":"(작게) 괘, 괜찮아. 무섭지만, 괜찮아. 무서운 건…… 익숙해지지 않지만, 그래도……."},{"t":"d","g":"이펙트","x":"접힌 골목 사이에서 괴이의 그림자가 부풀어 오른다"},{"t":"d","g":"SE","x":"유리를 긁는 듯한, 낮은 울음소리"},{"t":"l","s":"치코링","c":"치코","x":"이, 이 앞은 안 돼요! 이 앞은…… 사람들이 자고 있는 집이란 말이에요!"},{"t":"d","g":"표정","x":"치코링 = 등불을 고쳐 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"여, [여명의 소녀], 치코링…… 가, 갑니다……!"},{"t":"d","g":"SE","x":"빛이 터진다"},{"t":"d","g":"이펙트","x":"등불빛의 참격 — 어둠이 갈라진다"},{"t":"l","s":"치코링","c":"치코","x":"야앗……!"},{"t":"d","g":"SE","x":"격돌음 — 콰앙!"},{"t":"d","g":"표정","x":"치코링 = 튕겨나 바닥을 구른다"},{"t":"l","s":"치코링","c":"치코","x":"꺗……!"},{"t":"l","s":"치코링","c":"치코","x":"아, 아파…… 아프지만…… 이, 이 정도는, 아직……."},{"t":"d","g":"표정","x":"치코링 = 팔을 짚고 몸을 일으킨다"},{"t":"l","s":"치코링","c":"치코","x":"이, 일어나. 일어나, 나. ……여기서 내가 누우면, 오늘 밤엔 아무도 없단 말이야."},{"t":"d","g":"이펙트","x":"괴이가 다시 덮쳐 온다"},{"t":"l","s":"치코링","c":"치코","x":"혼자서도, 할 수 있어. 혼자서도…… 하, 하지만."},{"t":"l","s":"치코링","c":"치코","x":"(다들…… 지금쯤, 뭐 하고 있을까…….)"},{"t":"d","g":"표정","x":"치코링 = 고개를 세차게 젓는다"},{"t":"l","s":"치코링","c":"치코","x":"아, 안 돼. 지금은 눈앞…… 눈앞만!"},{"t":"d","g":"SE","x":"빛의 응집음"},{"t":"l","s":"치코링","c":"치코","x":"등불은…… 새벽까지, 꺼지면 안 되니까……!"},{"t":"d","g":"이펙트","x":"유령불이 크게 번쩍 — 괴이를 관통한다"},{"t":"d","g":"SE","x":"유리가 깨지듯 흩어지는 소리"},{"t":"l","s":"치코링","c":"치코","x":"하아…… 하아……. 끝…… 났, 다……."},{"t":"l","s":"치코링","c":"치코","x":"이, 이제…… 결계가, 닫히면……."},{"t":"d","g":"표정","x":"치코링 = 만신창이, 그래도 서 있다"},{"t":"l","s":"치코링","c":"치코","x":"하아……, 하아……. 괘, 괜찮아……. 오늘도, 아무도 안 다쳤어……."},{"t":"d","g":"SE","x":"결계 붕괴음 — 유리가 펴진다"},{"t":"d","g":"표정","x":"주군 = 결계 밖에서 기다리고 있었다"},{"t":"l","s":"주군","c":"주군","x":"……세 번째다. 혼자 들어가는 걸 본 게."},{"t":"d","g":"표정","x":"치코링 = 흠칫 → 어색한 웃음"},{"t":"l","s":"치코링","c":"치코","x":"계, 계약자 님……. 그, 그게, 산책을 하다 보니까……."},{"t":"d","g":"표정","x":"주군 = 팔짱을 낀 채, 시선은 아이의 상처에"},{"t":"l","s":"주군","c":"주군","x":"산책."},{"t":"l","s":"치코링","c":"치코","x":"네, 넷. 바, 밤공기가 좋아서……."},{"t":"l","s":"주군","c":"주군","x":"그 산책에서, 무릎은 왜 까졌지."},{"t":"l","s":"치코링","c":"치코","x":"어…… 그, 그건…… 너, 넘어져서……."},{"t":"l","s":"주군","c":"주군","x":"밤 두 시에, 결계 안으로 산책하는 중학생이 어디 있나."},{"t":"d","g":"표정","x":"치코링 = 시선을 떨군다"},{"t":"l","s":"치코링","c":"치코","x":"…………죄송해요."},{"t":"l","s":"주군","c":"주군","x":"(거짓말이 서툴다. 서툰 채로— 매일 밤 이걸 반복했다는 건가.)","m":1},{"t":"d","g":"표정","x":"치코링 = 손끝을 만지작거린다"},{"t":"l","s":"치코링","c":"치코","x":"……화, 나셨어요……?"},{"t":"l","s":"주군","c":"주군","x":"화가 났느냐고 물으면— 그래, 났다. 다만 너한테가 아니야."},{"t":"l","s":"치코링","c":"치코","x":"네……?"},{"t":"l","s":"주군","c":"주군","x":"아무것도 모르고 잠든 이 도시와, 아무것도 안 하고 지켜보기만 한 나한테다."},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다"},{"t":"l","s":"치코링","c":"치코","x":"계약자 님은…… 아, 아무것도 안 한 게 아니에요. 늘, 결계 밖에…… 계셨잖아요."},{"t":"l","s":"주군","c":"주군","x":"밖에 있는 건, 아무것도 아닌 거다."},{"t":"l","s":"주군","c":"주군","x":"사과를 받으려는 게 아니다. — 왜 혼자 계속하는 거냐. 이기면 시든다는 걸, 들었을 텐데."},{"t":"d","g":"표정","x":"치코링 = 어깨가 떨린다"},{"t":"l","s":"치코링","c":"치코","x":"……."},{"t":"l","s":"주군","c":"주군","x":"다른 아이들은 멈췄다. 들었기 때문이야. 그건 겁쟁이라서가 아니다— 똑바로 들었다는 뜻이지."},{"t":"l","s":"치코링","c":"치코","x":"아, 알아요. 아무도…… 자, 잘못 안 했어요."},{"t":"l","s":"주군","c":"주군","x":"그런데 왜 너만."},{"t":"d","g":"표정","x":"치코링 = 주먹을 꼭 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"……무, 무서워요. 무서운데요. 그치만— 오늘 밤 누가 다치는 건 '지금' 무섭잖아요."},{"t":"l","s":"치코링","c":"치코","x":"내일 시드는 건…… 내일의 내가 무서워하면 되니까……!"},{"t":"d","g":"표정","x":"주군 = 말문이 막힌다"},{"t":"l","s":"주군","c":"주군","x":"(…………열두 살한테, 오늘 밤 처음으로 배웠다.)","m":1},{"t":"d","g":"SE","x":"밤바람"},{"t":"d","g":"표정","x":"치코링 = 애써 웃는다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그리고요…… 등불은요, 계약자 님. 한 번 다 꺼뜨리면…… 다시 켜는 게, 더 힘들대요."},{"t":"l","s":"치코링","c":"치코","x":"그러니까…… 하나쯤은, 켜 둬야 해요. 다들이…… 돌아올 곳이, 캄캄하면 안 되잖아요."},{"t":"d","g":"표정","x":"주군 = 잠시, 말을 고른다"},{"t":"l","s":"주군","c":"주군","x":"(……돌아올 곳, 이라.)","m":1},{"t":"l","s":"주군","c":"주군","x":"……치코링."},{"t":"l","s":"치코링","c":"치코","x":"네, 넷."},{"t":"l","s":"주군","c":"주군","x":"다음부터는, 들어가기 전에 나한테 말해라."},{"t":"l","s":"치코링","c":"치코","x":"어…… 그, 그치만, 계약자 님은 결계 안에 못 들어오시잖아요. 위, 위험해요."},{"t":"l","s":"주군","c":"주군","x":"밖에서 기다리는 것과, 모르고 자는 건 다르다. — 적어도 네가 몇 시에 들어갔는지 아는 사람이, 한 명은 있어야지."},{"t":"d","g":"표정","x":"치코링 = 눈이 조금 커진다 → 천천히 끄덕인다"},{"t":"l","s":"치코링","c":"치코","x":"………네. 야, 약속할게요."},{"t":"d","g":"표정","x":"치코링 = 변신 해제 → 비틀거린다"},{"t":"l","s":"치코","c":"치코","x":"아……"},{"t":"d","g":"표정","x":"주군 = 부축한다"},{"t":"l","s":"주군","c":"주군","x":"……오늘은 여기까지다. 데려다주마."},{"t":"d","g":"표정","x":"치코 = 어깨에 기댄 채, 반쯤 감긴 눈으로"},{"t":"l","s":"치코","c":"치코","x":"……죄송해요. 무, 무겁죠……."},{"t":"l","s":"주군","c":"주군","x":"아니. — 가볍다. 너무 가벼워서, 문제다."},{"t":"l","s":"치코","c":"치코","x":"……다행이다……."},{"t":"l","s":"주군","c":"주군","x":"뭐가."},{"t":"l","s":"치코","c":"치코","x":"오늘도…… 아무도, 안 다쳐서……."},{"t":"d","g":"표정","x":"치코 = 말끝이 잦아든다 — 잠든 숨소리"},{"t":"l","s":"주군","c":"주군","x":"(……걸으면서 잠들 만큼, 이었나.)","m":1},{"t":"n","x":"어깨에 기댄 아이는 깃털처럼 가벼웠다. 이 무게로, 매일 밤 도시 하나를 떠받치고 있었다."},{"t":"n","x":"그날 나는 관찰자를 그만두었다. 서명한 어른이 할 일이, 지켜보는 것일 리 없었다."}]},{"id":"p1-e0-s1","title":"11-2. 하숙방 — 「입회인의 권리」","blocks":[{"t":"d","g":"배경","x":"주군의 하숙방 — 심야, 스탠드 불빛 하나"},{"t":"d","g":"BGM","x":"미니멀 (시계 소리)"},{"t":"d","g":"SE","x":"다다미, 인형이 움직이는 소리"},{"t":"d","g":"표정","x":"주군 = 책상 앞, 인형 둘을 정면에 앉힌다"},{"t":"l","s":"주군","c":"주군","x":"와카. 타마. — 그날 미룬 것, 오늘 받겠다. 계약서의 '원문'이다."},{"t":"d","g":"표정","x":"와카 = 갸웃"},{"t":"l","s":"와카","c":"와카","x":"응~? ……아, 그거. 아직도 붙들고 있었어?"},{"t":"l","s":"타마","c":"타마","x":"원문~?"},{"t":"d","g":"표정","x":"와카 = 데구르르 구르며 딴청"},{"t":"l","s":"와카","c":"와카","x":"그런 것보다 계약자, 내일 아침밥은 뭐야? 우리 몫도— 아, 우리 안 먹지. 아하하!"},{"t":"l","s":"주군","c":"주군","x":"말 돌리지 마라."},{"t":"d","g":"표정","x":"와카 = 뚝 멈춘다"},{"t":"l","s":"와카","c":"와카","x":"……돌린 거, 티 났어?"},{"t":"l","s":"주군","c":"주군","x":"인형 주제에, 알기 쉬운 딴청이었다."},{"t":"l","s":"와카","c":"와카","x":"실례네~! 이래 봬도 영업의 프로라구!"},{"t":"l","s":"타마","c":"타마","x":"프로~!"},{"t":"l","s":"주군","c":"주군","x":"프로라면, 계약 문서의 관리도 업무겠지. — 원문이다."},{"t":"d","g":"표정","x":"와카 = 눈을 가늘게 뜬다"},{"t":"l","s":"와카","c":"와카","x":"우~ ……있지, 계약자. 보통은 한 번 넘어가면 그걸로 끝이야. 그날 이후로 몇 밤이나 지났는데."},{"t":"l","s":"주군","c":"주군","x":"서명하던 밤에 이미 말했을 텐데. 요약만 들려주고 서명시키는 장사는, 대개 원본에 켕기는 데가 있는 법이지."},{"t":"l","s":"와카","c":"와카","x":"……우와아, 싫은 어른이다."},{"t":"l","s":"타마","c":"타마","x":"싫은 어른~……."},{"t":"l","s":"주군","c":"주군","x":"입회인의 권리다. 서명자는 자신이 서명한 문서의 전문을 열람할 권리가 있어. — 아닌가?"},{"t":"d","g":"표정","x":"와카 = 처음으로, 명백하게 곤란한 침묵"},{"t":"l","s":"와카","c":"와카","x":"…………."},{"t":"d","g":"표정","x":"타마 = 와카를 본다"},{"t":"l","s":"타마","c":"타마","x":"……와카."},{"t":"d","g":"표정","x":"와카 = 귀를 늘어뜨린다"},{"t":"l","s":"와카","c":"와카","x":"…어라. 그 권리를 '안 잊는' 어른은, 처음인데."},{"t":"l","s":"주군","c":"주군","x":"처음이라는 건, 지금까지의 어른들은 한 번 묻고 말았다는 거군."},{"t":"l","s":"와카","c":"와카","x":"……안 묻지, 보통은. 다들 서명만 하면 볼일 끝이라고 생각하니까. 소녀 쪽만 보고, 종이는 안 봐."},{"t":"l","s":"타마","c":"타마","x":"종이는, 안 봐……."},{"t":"l","s":"주군","c":"주군","x":"(……인형의 목소리가 낮아졌다. 명랑한 태엽이 멎으면, 이 아이들은 이런 소리를 내는 건가.)","m":1},{"t":"d","g":"표정","x":"주군 = 밀어붙인다"},{"t":"l","s":"주군","c":"주군","x":"있다는 뜻이군. 내놔라."},{"t":"d","g":"표정","x":"와카 = 타마와 마주 본다"},{"t":"l","s":"와카","c":"와카","x":"……타마. 어떡할까."},{"t":"l","s":"타마","c":"타마","x":"……규칙은, 규칙."},{"t":"l","s":"와카","c":"와카","x":"그치~. 규칙은 규칙이지~. ………하아."},{"t":"d","g":"표정","x":"와카 = 한숨 (인형인데)"},{"t":"l","s":"와카","c":"와카","x":"……규칙이니까, 보여는 줄게. 그치만 계약자. 먼저 말해 두는데— 그거, 읽어도 기분 좋은 문서 아니야."},{"t":"l","s":"주군","c":"주군","x":"기분 좋자고 읽는 게 아니다. 책임지려고 읽는 거지."},{"t":"d","g":"표정","x":"와카 = 주군을 빤히 본다"},{"t":"l","s":"와카","c":"와카","x":"……책임, 이라. 그 말, 서명하기 전에 들었으면 좋았을 텐데."},{"t":"l","s":"주군","c":"주군","x":"늦게 배운 만큼, 지금 하는 거다."},{"t":"l","s":"와카","c":"와카","x":"………그럼, 연다. — 불평은 안 받아."},{"t":"l","s":"타마","c":"타마","x":"안 받아~."},{"t":"d","g":"이펙트","x":"허공에 낡은 두루마리가 풀려 내린다 — 글자가 별빛처럼 떠 있다"},{"t":"n","x":"계약의 원문은, 낡은 두루마리 한 장이었다."},{"t":"d","g":"SE","x":"시계 초침 소리만"},{"t":"d","g":"표정","x":"주군 = 한 줄, 한 줄, 손가락으로 짚어 내려간다"},{"t":"l","s":"주군","c":"주군","x":"(……문장은 짧다. 짧은 주제에, 단어 하나하나가 저울처럼 무겁군.)","m":1},{"t":"l","s":"와카","c":"와카","x":"……천천히 읽어도 돼. 도망 안 가니까, 그 종이는."},{"t":"l","s":"주군","c":"주군","x":"이 '개화'라는 조항— 여기 적힌 그대로인가. 더도, 덜도 없이."},{"t":"l","s":"와카","c":"와카","x":"응. 적힌 그대로. 우리는 종이에 없는 건 몰라, 종이에 있는 건 못 어겨."},{"t":"l","s":"타마","c":"타마","x":"못 어겨……."},{"t":"l","s":"주군","c":"주군","x":"(아이들이 소문으로만 듣던 것이, 처음부터 전부 적혀 있었다. 숨긴 게 아니야— 아무도 안 읽었을 뿐이지. …그게 더 나쁘다.)","m":1},{"t":"n","x":"조항은 단순했다. 소원. 힘. 개화. …그리고 마지막 줄에 이르렀을 때— 나는 눈을 의심했다."},{"t":"d","g":"표정","x":"주군 = 두루마리 끝을 본다"},{"t":"l","s":"주군","c":"주군","x":"……이건. 마지막 줄이— 찢겨 있어."},{"t":"d","g":"표정","x":"와카 = 담담"},{"t":"l","s":"와카","c":"와카","x":"응. 처음부터 그래. 우리도 그 줄은 몰라. 정말이야."},{"t":"l","s":"주군","c":"주군","x":"'정말이야'라는 말을, 먼저 붙이는군."},{"t":"l","s":"와카","c":"와카","x":"……그야, 안 믿을 얼굴이니까."},{"t":"l","s":"타마","c":"타마","x":"정말이야……."},{"t":"l","s":"주군","c":"주군","x":"너희는 계약의 인형이잖나. 자기 계약서의 전문을 모른다는 게, 말이 되나."},{"t":"l","s":"와카","c":"와카","x":"말이 안 되지. 우리도 그렇게 생각해. ……그러니까 우리도, 쭉 이상했어. 있어야 할 게 없다는 것 정도는, 우리도 알아."},{"t":"l","s":"타마","c":"타마","x":"……쭉, 이상했어."},{"t":"l","s":"주군","c":"주군","x":"찢은 게 누구지."},{"t":"d","g":"표정","x":"와카 = 고개를 젓는다"},{"t":"l","s":"와카","c":"와카","x":"몰라. 우리가 '태어났'을 때부터, 이미 그랬어."},{"t":"l","s":"주군","c":"주군","x":"짐작도 없나."},{"t":"d","g":"표정","x":"와카 = 오래, 침묵한다"},{"t":"l","s":"와카","c":"와카","x":"………없어. 몇 번을 물어도, 그 대답은 안 변해."},{"t":"l","s":"타마","c":"타마","x":"안 변해……."},{"t":"l","s":"와카","c":"와카","x":"……계약자. 하나만 물어도 돼?"},{"t":"l","s":"주군","c":"주군","x":"말해라."},{"t":"l","s":"와카","c":"와카","x":"그거 알아서— 뭘 할 셈이야? 마지막 줄 같은 거, 없어도 계약은 굴러가. 지금까지 쭉 그랬듯이."},{"t":"l","s":"주군","c":"주군","x":"굴러가지. — 아이들을 갈아 넣으면서."},{"t":"d","g":"표정","x":"와카 = 대답하지 못한다"},{"t":"l","s":"와카","c":"와카","x":"…………."},{"t":"l","s":"타마","c":"타마","x":"…………와카."},{"t":"l","s":"와카","c":"와카","x":"……우리는, 계약을 돕는 인형이야. 그거밖에 못 해. 그치만—"},{"t":"d","g":"표정","x":"와카 = 귀가 축 처진다"},{"t":"l","s":"와카","c":"와카","x":"없어진 마지막 줄을 찾겠다는 어른을 말리는 규칙은, 어디에도 안 적혀 있네."},{"t":"l","s":"타마","c":"타마","x":"……안 적혀 있어."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(조항의 흐름상, 여기 있어야 할 것은— '해지'다. 계약을 끝내는 방법이 적혀 있어야 할 자리. …누군가가, 출구만 찢어 갔다.)","m":1},{"t":"n","x":"나는 그 밤, 찢긴 자리의 단면을 오래 들여다보았다."},{"t":"n","x":"출구가 없는 게 아니다. 출구가 '지워진' 것이다. — 그 둘은 전혀 다른 이야기였다."},{"t":"l","s":"주군","c":"주군","x":"(찾는다. 찢긴 마지막 줄. 그게 서명한 어른의— 내 몫의 싸움이다.)","m":1}]}]},{"id":"p1-e1","title":"12화 「조화(造花)」","scenes":[{"id":"p1-e1-s0","title":"12-1. 시계탑 — 「순백의 어둠」","blocks":[{"t":"d","g":"배경","x":"도시 중앙 시계탑 상공 — 하늘에 하얀 실금이 거미줄처럼 번진다"},{"t":"d","g":"BGM","x":"왈츠 리듬의 불협화음"},{"t":"d","g":"SE","x":"유리가 자라나는 소리"},{"t":"d","g":"이펙트","x":"하늘 전체에 백색 문양 전개"},{"t":"n","x":"도시의 하늘에, 하얀 실금이 번지기 시작했다."},{"t":"n","x":"결계가 아니었다. 결계의 '틀'이— 도시 전체를 감쌀 무언가의 뼈대가, 짜이고 있었다."},{"t":"d","g":"SE","x":"도시의 웅성임 — 창문이 하나둘 열리는 소리"},{"t":"d","g":"표정","x":"치코링 = 달려온다, 숨을 몰아쉬며"},{"t":"l","s":"치코링","c":"치코","x":"하아, 하아…… 시, 시계탑…… 위……!"},{"t":"l","s":"치코링","c":"치코","x":"저 하늘…… 저거, 전부…… 결계……?"},{"t":"d","g":"표정","x":"뮤게 = 시계탑 꼭대기, 과장된 포즈"},{"t":"l","s":"뮤게","c":"치사","x":"아─하하하핫! 순백의 어둠에 물드는 것이와요!"},{"t":"l","s":"뮤게","c":"치사","x":"보이시나요, 여러분! 들리시나요! 오늘 밤, 이 도시는 통째로 무대가 되는 것이와요!"},{"t":"d","g":"이펙트","x":"하얀 실금이 박자에 맞춰 뻗어 나간다"},{"t":"l","s":"뮤게","c":"치사","x":"한 올, 한 올! 자수처럼 정성껏! 이 몸이 손수 짜 드리는, 순백의 밤인 것이와요!"},{"t":"d","g":"표정","x":"치코링 = 올려다본다"},{"t":"l","s":"치코링","c":"치코","x":"저, 저 사람…… 처음 보는, 마녀……!"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(……이나가에 치사. 아니— 이 세계에서는, 저것도 마녀인가.)","m":1},{"t":"d","g":"표정","x":"뮤게 = 부채로 입가를 가리고, 아래를 내려다본다"},{"t":"l","s":"뮤게","c":"치사","x":"어머나? — 관객이 와 준 것이와요."},{"t":"l","s":"뮤게","c":"치사","x":"그것도 소문의— 마지막까지 남은 등불. [여명의 소녀]인 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"저, 저를…… 아세요……?"},{"t":"l","s":"뮤게","c":"치사","x":"알다마다요! 무대에 서는 자, 객석을 보는 법! 요즘 이 도시에서 제일 화제인 것이와요. 혼자서 밤마다 애쓰는, 갸륵하고— 촌스러운 등불."},{"t":"l","s":"치코링","c":"치코","x":"초, 촌스러……."},{"t":"l","s":"뮤게","c":"치사","x":"칭찬인 것이와요! 촌스러움도 거기까지 가면 예술의 영역— 이 몸, 노력하는 아이는 싫어하지 않는 것이와요."},{"t":"l","s":"치코링","c":"치코","x":"애, 애쓰는 게 아니라…… 그냥, 지키고 싶은 것뿐이에요."},{"t":"l","s":"뮤게","c":"치사","x":"어머, 겸손! 겸손은 미덕이지만— 무대 위에서는 죄인 것이와요. 지킨다면 당당하게, 박수를 요구하면서 지키는 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"바, 박수 받으려고 하는 게 아닌데요……!"},{"t":"d","g":"표정","x":"뮤게 = 부채가 멎는다 — 진심으로 의아한 얼굴"},{"t":"l","s":"뮤게","c":"치사","x":"……박수 없이 무대에 서는 의미가, 어디 있는 것이와요?"},{"t":"l","s":"주군","c":"주군","x":"(……지금 것은 야유가 아니라— 진심으로 이해를 못 한 얼굴이었다.)","m":1},{"t":"d","g":"표정","x":"뮤게 = 부채를 펼치듯 손을 펼친다"},{"t":"l","s":"뮤게","c":"치사","x":"소개가 늦었네요. [조화(造花)의 마녀], 뮤게·시엘! 도시 전체를 감쌀 최고 걸작의 결계— 그 설계자가 바로 이 몸인 것이와요!"},{"t":"d","g":"이펙트","x":"하늘의 백색 문양이 일제히 빛난다 — 과시하듯"},{"t":"l","s":"뮤게","c":"치사","x":"이름하여— 「순백의 어둠」! 완성되는 그날, 이 도시의 밤하늘은 통째로 이 몸의 캔버스가 되는 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"도, 도시 전체를…… 결계로……?"},{"t":"l","s":"뮤게","c":"치사","x":"네! 지금까지의 결계 따위, 습작! 낙서! 이 몸의 것은 격이 다른 것이와요— 무엇보다, 아름다우니까!"},{"t":"d","g":"표정","x":"치코링 = 등불을 고쳐 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"아, 아름다워도…… 결계는 결계예요! 사람들이 갇힌다구요!"},{"t":"l","s":"뮤게","c":"치사","x":"갇힌다니, 사람 듣기 안 좋게! '초대받는다'고 해 주시면 좋겠는 것이와요."},{"t":"l","s":"치코링","c":"치코","x":"마, 말장난이에요, 그런 거……!"},{"t":"l","s":"뮤게","c":"치사","x":"말은 장난이 아니라 장식인 것이와요. 예쁘게 포장하지 못하는 진실 따위, 상품 가치가 없는 것— 앗, 지금 것 명언! 받아 적으셔도 좋은 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"바, 받아 적을 리가……!"},{"t":"d","g":"SE","x":"빛의 응집음"},{"t":"d","g":"이펙트","x":"치코링의 등불빛이 실금 한 가닥을 향해 날아간다"},{"t":"l","s":"치코링","c":"치코","x":"야앗……!"},{"t":"d","g":"SE","x":"챙! — 유리에 튕기는 소리"},{"t":"d","g":"이펙트","x":"하얀 실금은 흠집 하나 없다"},{"t":"d","g":"표정","x":"뮤게 = 천천히, 고개를 기울인다"},{"t":"l","s":"뮤게","c":"치사","x":"어머나. — 지금 것, 이 몸의 작품에 손을 대신 것이와요?"},{"t":"d","g":"표정","x":"치코링 = 숨을 삼킨다"},{"t":"l","s":"치코링","c":"치코","x":"다, 단단해……. 흠집도, 안……."},{"t":"l","s":"뮤게","c":"치사","x":"후후, 당연한 것이와요! 걸작에 필요한 것은 첫째도 완성도, 둘째도 완성도! 어중간한 것은— 이 몸이 제일, 용서할 수 없는 것이와요."},{"t":"l","s":"주군","c":"주군","x":"(……지금, 목소리가 한순간 낮아졌다. '어중간한 것'— 그 한마디만, 연기 바깥에서 나왔어.)","m":1},{"t":"d","g":"이펙트","x":"실금에서 하얀 꽃잎이 흩날려 내린다 — 칼날처럼"},{"t":"d","g":"SE","x":"촤악!"},{"t":"d","g":"표정","x":"치코링 = 등불빛의 장막으로 막아 낸다"},{"t":"l","s":"치코링","c":"치코","x":"꺗……! 꼬, 꽃잎이…… 칼처럼……!"},{"t":"l","s":"뮤게","c":"치사","x":"어머나, 막으셨네요? 제법인 것이와요. — 지금 것은 인사. 무대 인사인 것이와요."},{"t":"l","s":"치코링","c":"치코","x":"이, 인사가 이렇게 아프면 안 되는 거예요……!"},{"t":"l","s":"뮤게","c":"치사","x":"아픔은 감동의 일종인 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"다, 달라요! 전혀 달라요!"},{"t":"l","s":"주군","c":"주군","x":"(막았지만— 팔이 떨리고 있다. 인사 한 번에 저 위력. …격이 다르다는 말은, 허세가 아니야.)","m":1},{"t":"d","g":"표정","x":"치코링 = 외친다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그만두세요! 그런 거, 다들 무서워한다구요……!"},{"t":"d","g":"표정","x":"뮤게 = 웃음이 한 박자 커진다"},{"t":"l","s":"뮤게","c":"치사","x":"무서워한다! 좋은 반응인 것이와요! 무서움은 곧 주목— 주목은 곧 평가! 이 몸의 작품은 언제나 만점이어야 하는 것이와요!"},{"t":"l","s":"뮤게","c":"치사","x":"잘 들으세요, 여명의 소녀! 무명의 밤은 길고, 무대는 좁고, 박수는 야박한 것이와요! 그러니 작품은 크게, 더 크게! 도시가 통째로 무대라면— 아무도 못 본 척할 수 없는 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"못 본 척이 아니라…… 무, 무서워서 못 보는 거예요, 다들……."},{"t":"l","s":"뮤게","c":"치사","x":"보게 되는 것이와요, 결국은! 시선은 정직하니까!"},{"t":"l","s":"치코링","c":"치코","x":"마, 만점이라니…… 누, 누구한테요?"},{"t":"d","g":"표정","x":"뮤게 = 부채가 반 박자, 멈춘다"},{"t":"l","s":"뮤게","c":"치사","x":"……누구, 라니. 이상한 걸 묻는 것이와요. 만점은 만점— 보는 눈 전부한테인 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"보는 눈, 전부……."},{"t":"l","s":"뮤게","c":"치사","x":"그래요! 백 명이 보면 백 점이 백 개! 그게 이 몸의 삶의 방식인 것이와요!"},{"t":"l","s":"주군","c":"주군","x":"(……채점자를 묻는 질문에, 답을 못 했다. 전원에게 만점이라는 건— 정해진 한 사람의 합격점이, 어디에도 없다는 뜻과 같은 말이다.)","m":1},{"t":"d","g":"표정","x":"치코링 = 뮤게를 똑바로 올려다본다"},{"t":"l","s":"치코링","c":"치코","x":"……저, 저기. 이상한 질문일지도, 모르지만."},{"t":"d","g":"표정","x":"치코링 = 문득, 묻는다"},{"t":"l","s":"치코링","c":"치코","x":"……다, 당신도. 당신도 원래는, 마법소녀였나요……?"},{"t":"d","g":"SE","x":"바람이 멎는다"},{"t":"d","g":"표정","x":"뮤게 = 웃음이, 딱 멎는다"},{"t":"l","s":"뮤게","c":"치사","x":"…………."},{"t":"n","x":"과장된 웃음소리가 처음으로 끊겼다. 부채처럼 펼쳐져 있던 손끝이, 아주 조금 떨렸다."},{"t":"d","g":"표정","x":"뮤게 = 등을 돌린다"},{"t":"l","s":"뮤게","c":"치사","x":"— 옛날 얘기는, 촌스러운 것이와요."},{"t":"d","g":"이펙트","x":"하얀 실금이 한층 빠르게 뻗어 나간다 — 대화를 끊듯"},{"t":"l","s":"뮤게","c":"치사","x":"발표회 날짜는 추후 공지인 것이와요. 여러분, 부디— 기대하며 무서워해 주시길."},{"t":"l","s":"뮤게","c":"치사","x":"그날까지, 시들지 말고 계시는 것이와요? 여명의 소녀."},{"t":"d","g":"표정","x":"치코링 = 숨을 삼킨다"},{"t":"l","s":"치코링","c":"치코","x":"……!"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(조화는 시들지 않는다. 하지만 피지도 않는다. …저 과장된 웃음은, 가면 위에 그린 웃음이다.)","m":1}]},{"id":"p1-e1-s1","title":"12-2. 실금 위 — 「황혼의 색」","blocks":[{"t":"d","g":"배경","x":"동일 — 하얀 실금이 노을빛을 받아 물드는 상공"},{"t":"d","g":"BGM","x":"정적 → 낯선 선율 (기존 어느 테마와도 다른 조성)"},{"t":"d","g":"SE","x":"실금 위에 내려서는 발소리"},{"t":"d","g":"이펙트","x":"새 실루엣 등장 — 황혼빛 역광"},{"t":"n","x":"그때였다. 하얀 실금 위에, 낯선 그림자가 내려선 것은."},{"t":"n","x":"소녀도, 마녀도 아니었다. 황혼의 색을 두른— 어느 쪽 하늘에도 걸쳐 있는 누군가였다."},{"t":"d","g":"SE","x":"바람의 결이 변한다"},{"t":"d","g":"표정","x":"뮤게 = 부채를 멈춘다"},{"t":"l","s":"뮤게","c":"치사","x":"……어머나? 지금, 이 몸의 무대에— 누가 허락도 없이 오른 것이와요?"},{"t":"d","g":"표정","x":"치코링 = 하늘을 본다"},{"t":"l","s":"치코링","c":"치코","x":"누, 누구지…… 마녀……? 아, 아니야…… 뭔가, 달라……."},{"t":"l","s":"뮤게","c":"치사","x":"초대장 없는 관객은 사절인 것이와요! 이름을 밝히시길!"},{"t":"d","g":"표정","x":"뮤게 = 부채를 쫙 펼친다"},{"t":"l","s":"뮤게","c":"치사","x":"말해 두지만, 이 무대의 좌석은 전석 매진인 것이와요! 서서 보는 것도 금지인 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"이, 이런 때에도 그 말투……."},{"t":"l","s":"뮤게","c":"치사","x":"말투가 아니라 품격인 것이와요! …그, 그보다 여명의 소녀. 저것— 설마 당신의 아는 얼굴은, 아닌 것이와요?"},{"t":"l","s":"치코링","c":"치코","x":"저, 저도 처음 봐요…… 저런 색, 처음이에요……."},{"t":"l","s":"주군","c":"주군","x":"(……색이 다르다. 마녀의 밤도, 소녀의 낮도 아닌— 그 사이의 색이다.)","m":1},{"t":"d","g":"표정","x":"[황혼] = 실금 위에 서서, 내려다본다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……당신들, 아직 '만개'가 뭔지도 모르는구나."},{"t":"d","g":"표정","x":"치코링 = 흠칫"},{"t":"l","s":"치코링","c":"치코","x":"마, 만개……."},{"t":"l","s":"뮤게","c":"치사","x":"……어머. 어린 분이, 어려운 단어를 아시는 것이와요."},{"t":"l","s":"[황혼]","c":"[황혼]","x":"어려운 단어 아니야. …당연한 단어지, 이 하늘 아래서는."},{"t":"l","s":"뮤게","c":"치사","x":"무, 무례한! 이 몸의 무대 위에서, 이 몸을 어린애 취급인 것이와요!?"},{"t":"d","g":"표정","x":"뮤게 = 경계 (한 발 물러선다)"},{"t":"l","s":"뮤게","c":"치사","x":"다, 당신은…… 정원의 명부에 없는 얼굴인 것이와요. 어느 쪽 소속인 것이와요!"},{"t":"d","g":"표정","x":"[황혼] = 대답하지 않는다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"소속. …그런 게 있으면, 편했겠네."},{"t":"l","s":"뮤게","c":"치사","x":"대, 대답이 안 되는 것이와요! 소녀인 것이와요, 마녀인 것이와요, 어느 쪽!"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"…………."},{"t":"l","s":"뮤게","c":"치사","x":"무, 무시! 이 몸을 무시하는 것이와요……!"},{"t":"l","s":"주군","c":"주군","x":"(……정원 쪽이 저렇게 동요하는 건 처음 본다. 적끼리도, 서로 모르는 상대라는 건가.)","m":1},{"t":"l","s":"뮤게","c":"치사","x":"여명의 소녀! 당신도 뭐라고 하시는 것이와요! 저건 당신들 편도 아닌 모양인데!"},{"t":"l","s":"치코링","c":"치코","x":"저, 저는…… 그보다, 아까 그 말이…… '만개'가, 마음에 걸려서……."},{"t":"d","g":"표정","x":"치코링 = 조심스럽게"},{"t":"l","s":"치코링","c":"치코","x":"저, 저기…… 당신은, 적인가요……? 아군인가요……?"},{"t":"d","g":"표정","x":"[황혼] = 잠시, 말이 없다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……그 질문, 좋아하는구나. 다들."},{"t":"l","s":"치코링","c":"치코","x":"어…… 그, 그게……."},{"t":"d","g":"표정","x":"[황혼] = 치코링을 본다 — 길게"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"………너, 그 빛. …너무 예쁘게 피지 마. 예쁜 것부터 잘리니까."},{"t":"d","g":"표정","x":"치코링 = 숨이 멎는다"},{"t":"l","s":"치코링","c":"치코","x":"잘…… 리니까……?"},{"t":"d","g":"이펙트","x":"황혼빛이 흩어지며 실루엣 소멸"},{"t":"d","g":"표정","x":"치코링 = 멍하니"},{"t":"l","s":"치코링","c":"치코","x":"……가, 버렸어요……."},{"t":"l","s":"치코링","c":"치코","x":"무, 물어보고 싶은 게…… 아직, 잔뜩 있었는데……."},{"t":"l","s":"치코링","c":"치코","x":"이, 이름도…… 안 가르쳐 줬어……."},{"t":"d","g":"표정","x":"뮤게 = 헛기침"},{"t":"l","s":"뮤게","c":"치사","x":"흠! 흠흠! …방금 것은, 그, 무대 연출의 일부인 것이와요. 놀라셨다면 그것도 연출의 공적인 것이와요."},{"t":"l","s":"치코링","c":"치코","x":"지, 지금, 목소리 떨렸잖아요……."},{"t":"l","s":"뮤게","c":"치사","x":"떨, 떨리지 않은 것이와요! 이 몸은 조금도, 요만큼도, 동요 같은 건…… 하지 않는 것이와요!"},{"t":"l","s":"뮤게","c":"치사","x":"대체로, 저런 정체불명은 상대하지 않는 게 일류인 것이와요! 무시! 무시가 답인 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"아까 무시당한 건…… 이, 이쪽인데요……."},{"t":"l","s":"뮤게","c":"치사","x":"드, 들리지 않는 것이와요~! 이 몸의 귀는 박수와 갈채 전용인 것이와요~!"},{"t":"l","s":"주군","c":"주군","x":"(……부채를 쥔 손이 하얗다. 저쪽도— 처음 보는 상대였다는 거군.)","m":1},{"t":"d","g":"표정","x":"뮤게 = 부채질로 동요를 감춘다"},{"t":"l","s":"뮤게","c":"치사","x":"흥, 흥! 무례한 난입자인 것이와요! …오늘은 여기까지! 걸작의 완성을, 기대하는 것이와요!"},{"t":"l","s":"뮤게","c":"치사","x":"여명의 소녀! 다음 막에서는— 그, 그 이상한 색의 난입자 없이, 정정당당 이 몸의 무대를 보여 드리는 것이와요!"},{"t":"l","s":"치코링","c":"치코","x":"저, 정정당당이라니…… 결계를 치는 쪽이 할 말이……."},{"t":"d","g":"이펙트","x":"뮤게 퇴장 — 하얀 꽃잎 소용돌이"},{"t":"d","g":"SE","x":"밤바람 — 갑자기 조용해진 상공"},{"t":"d","g":"표정","x":"치코링 = 하늘을 올려다본 채"},{"t":"l","s":"치코링","c":"치코","x":"……계약자 님. 아까, 그 사람……."},{"t":"l","s":"주군","c":"주군","x":"아아. — 들었다. 전부."},{"t":"l","s":"치코링","c":"치코","x":"'예쁘게 피지 마'…… 래요. 그, 그런 말, 처음 들어봐요. 다들…… 힘내라고 하거나, 그만두라고 하거나, 둘 중 하나였는데."},{"t":"l","s":"주군","c":"주군","x":"……그러게 말이다. 피지 말라는 건— 그 둘, 어느 쪽도 아니지."},{"t":"l","s":"치코링","c":"치코","x":"나쁜 사람…… 같지는, 않았어요. 그, 그냥……."},{"t":"l","s":"치코링","c":"치코","x":"엄청…… 지쳐 보였어요. 목소리가."},{"t":"l","s":"주군","c":"주군","x":"……피로, 인가."},{"t":"l","s":"치코링","c":"치코","x":"네…… 뭐, 뭐랄까…… 잔뜩 걸어온 사람의, 목소리였어요. 우, 우리보다 훨씬, 멀리서부터."},{"t":"l","s":"주군","c":"주군","x":"(……아이 쪽이 잘 본다. 나는 색을 봤고, 이 아이는 피로를 봤어.)","m":1},{"t":"l","s":"치코링","c":"치코","x":"계약자 님…… '만개'가 뭔지도 모른다고, 했잖아요. 우, 우리."},{"t":"l","s":"주군","c":"주군","x":"아아."},{"t":"l","s":"치코링","c":"치코","x":"우리가 모르는 걸…… 저 사람은, 알고 있는 거죠."},{"t":"l","s":"주군","c":"주군","x":"……그렇겠지. 아는 얼굴이었다."},{"t":"l","s":"치코링","c":"치코","x":"그럼…… 어, 언젠가, 또 만나야 해요. 물어봐야 하니까."},{"t":"l","s":"주군","c":"주군","x":"그때는— 도망 못 가게, 질문 목록이라도 만들어 두자."},{"t":"l","s":"치코링","c":"치코","x":"모, 목록…… 그거 좋네요. 첫 번째는— 이름."},{"t":"l","s":"주군","c":"주군","x":"두 번째는— '만개'가 뭔지. …목록이, 벌써 무겁군."},{"t":"l","s":"치코링","c":"치코","x":"그, 그래도…… 무, 물어볼 수 있는 날이, 오면 좋겠어요."},{"t":"l","s":"주군","c":"주군","x":"치코링. 오늘 밤은 이만 돌아가자. — 저 실금은, 하루아침에 완성되는 물건이 아니야."},{"t":"l","s":"치코링","c":"치코","x":"……네. 그, 그치만, 내일도 자라겠죠. 저거."},{"t":"l","s":"주군","c":"주군","x":"자라겠지. 그러니— 자라는 속도를, 기록해 두마. 어른의 일이다."},{"t":"l","s":"치코링","c":"치코","x":"……후후. 계약자 님, 요즘…… 조, 조금, 믿음직해요."},{"t":"l","s":"주군","c":"주군","x":"요즘, 이 붙는 건가."},{"t":"l","s":"치코링","c":"치코","x":"아, 아뇨! 처, 처음부터…… 그, 그게……."},{"t":"n","x":"시계탑 위에는 하얀 실금만 남았다. 그것은 밤이 깊도록, 아주 천천히— 확실하게 자라고 있었다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(마녀의 명부에 없는 자. '만개'를 아는 말투. …아군인가, 적인가. 저 아이의 색은, 어느 쪽 하늘에도 걸쳐 있었다.)","m":1},{"t":"n","x":"료의 지도 위에서, 나선은 이제 중심을 드러내고 있었다. — 시계탑. 하얀 실금의 발원지였다."},{"t":"n","x":"그리고 료가, 지도 귀퉁이에 메모 하나를 남겨 두었다 — 『만개 직전에 은퇴한 사람이 있대. 찻집을 한다던데』."}]}]},{"id":"p1-e2","title":"13화 「만개의 소녀」","scenes":[{"id":"p1-e2-s0","title":"13-1. 오래된 찻집 — 「은퇴자」","blocks":[{"t":"d","g":"배경","x":"골목 안 오래된 찻집 — 얼음처럼 조용한 실내, 김이 오르는 찻주전자"},{"t":"d","g":"BGM","x":"다관에 물 따르는 소리가 리듬이 되는 정적한 트랙"},{"t":"d","g":"SE","x":"찻잔, 괘종시계"},{"t":"n","x":"'은퇴한 최강'의 소문을 좇아, 나와 치코는 골목 안 찻집에 닿았다."},{"t":"n","x":"[빙화의 소녀]. 만개 직전에 스스로 멈춘, 유일한 생환자."},{"t":"d","g":"SE","x":"문에 달린 방울이 조그맣게 울린다"},{"t":"d","g":"표정","x":"치코 = 문틈으로 조심스럽게"},{"t":"l","s":"치코","c":"치코","x":"시, 실례합니다……."},{"t":"d","g":"표정","x":"세나 = 카운터 안쪽, 돌아보지도 않고"},{"t":"l","s":"세나","c":"세나","x":"……영업 전이야."},{"t":"l","s":"치코","c":"치코","x":"죄, 죄송해요……! 무, 문이 열려 있어서, 그……."},{"t":"l","s":"세나","c":"세나","x":"문이 열린 거랑, 들어와도 되는 건 다른 얘기지."},{"t":"d","g":"표정","x":"치코 = 그래도, 한 발 들어선다"},{"t":"l","s":"치코","c":"치코","x":"그, 그래도…… 꼭, 만나 뵙고 싶어서…… 왔어요."},{"t":"d","g":"표정","x":"세나 = 잠깐, 손이 멈춘다"},{"t":"l","s":"세나","c":"세나","x":"……손님이 아니라, 용건이 왔다는 거네. 제일 귀찮은 종류다."},{"t":"l","s":"주군","c":"주군","x":"(……목소리에 온도가 없다. 쫓아내는 것조차 귀찮다는— 그런 종류의 차가움이다.)","m":1},{"t":"d","g":"표정","x":"치코 = 우물쭈물하다가, 가까운 자리에 앉는다"},{"t":"d","g":"표정","x":"세나 = 차를 따르며, 시선은 찻잔에"},{"t":"l","s":"세나","c":"세나","x":"……주문도 안 하고 자리에 앉는 손님은, 오랜만이네."},{"t":"d","g":"표정","x":"치코 = 벌떡"},{"t":"l","s":"치코","c":"치코","x":"죄, 죄송해요! 저, 저기, 여쭤보고 싶은 게……!"},{"t":"d","g":"표정","x":"세나 = 처음으로 치코를 본다 — 눈이 조금 열린다"},{"t":"l","s":"세나","c":"세나","x":"…………치코 양, 이라고 했나."},{"t":"d","g":"표정","x":"치코 = 놀란다"},{"t":"l","s":"치코","c":"치코","x":"어, 어떻게 제 이름을……."},{"t":"d","g":"표정","x":"세나 = 찻잔을 내려놓는다"},{"t":"l","s":"세나","c":"세나","x":"얼굴이 좋네. …옛날의 '그 사람'이랑, 똑같은 얼굴이야."},{"t":"l","s":"치코","c":"치코","x":"그, 그 사람……?"},{"t":"d","g":"표정","x":"세나 = 대답 대신, 찻잔을 치코 앞에 놓는다"},{"t":"l","s":"세나","c":"세나","x":"마셔. 식기 전에."},{"t":"l","s":"치코","c":"치코","x":"아…… 가, 감사합니다……."},{"t":"d","g":"SE","x":"찻잔을 두 손으로 감싸 쥐는 소리"},{"t":"l","s":"치코","c":"치코","x":"……따뜻해."},{"t":"l","s":"세나","c":"세나","x":"차는 그러라고 있는 거야."},{"t":"l","s":"주군","c":"주군","x":"(질문에는 대답하지 않고, 차부터 내놓는다. …순서가 있는 사람이다. 이 사람의 순서를, 흐트러뜨리지 않는 게 좋겠어.)","m":1},{"t":"d","g":"표정","x":"주군 = 조용히"},{"t":"l","s":"주군","c":"주군","x":"그 사람— [만개의 소녀] 말인가."},{"t":"d","g":"SE","x":"괘종시계가 한 번 울린다"},{"t":"d","g":"표정","x":"세나 = 주군을 처음으로 본다 — 재는 눈"},{"t":"l","s":"세나","c":"세나","x":"……어른이 붙어 있네. 요즘 애들은, 보호자 동반으로 이런 걸 묻나."},{"t":"l","s":"주군","c":"주군","x":"입회인이다. — 서명한 책임이 있어서."},{"t":"l","s":"세나","c":"세나","x":"………입회인. 그 단어를 자기 입으로 말하는 어른은, 오랜만에 본다."},{"t":"d","g":"표정","x":"세나 = 긴 침묵 → 차를 새로 따른다"},{"t":"l","s":"세나","c":"세나","x":"……어디까지 알고 왔지?"},{"t":"l","s":"주군","c":"주군","x":"절화의 마녀가, 한때 이 도시 최강의 마법소녀였다는 것까지."},{"t":"l","s":"세나","c":"세나","x":"……그것까지 알고, 그 얼굴로 앉아 있을 수 있다는 건. 각오는 하고 왔다는 거네."},{"t":"l","s":"치코","c":"치코","x":"가, 각오라기보다는…… 아, 알아야 한다고, 생각해서요."},{"t":"l","s":"세나","c":"세나","x":"알아야 한다. …왜?"},{"t":"l","s":"치코","c":"치코","x":"어……."},{"t":"l","s":"세나","c":"세나","x":"이유 없이 아는 건, 그냥 구경이야. 왜 알아야 하는데."},{"t":"d","g":"표정","x":"치코 = 찻잔을 꼭 쥔다"},{"t":"l","s":"치코","c":"치코","x":"……무, 무서워서요. 모르는 채로 싸우는 게, 제일 무서우니까…… 아, 알고 싶어요. 알고, 그다음에…… 생각하고 싶어요."},{"t":"d","g":"표정","x":"세나 = 몇 초, 치코를 본다"},{"t":"l","s":"세나","c":"세나","x":"………합격."},{"t":"l","s":"치코","c":"치코","x":"네……?"},{"t":"l","s":"세나","c":"세나","x":"주문. — '알고 싶다'는 거, 접수했다는 뜻이야."},{"t":"l","s":"주군","c":"주군","x":"(……문답 하나로 자격을 재는 건가. 아이의 대답이 조금이라도 가벼웠으면, 이 사람은 아무것도 말하지 않았겠지.)","m":1},{"t":"d","g":"표정","x":"세나 = 담담하게, 그러나 또박또박"},{"t":"l","s":"세나","c":"세나","x":"그 사람은 [만개의 소녀]였어. 제일 다정하고, 제일 강해서— 제일 먼저 만개해 버렸지."},{"t":"l","s":"치코","c":"치코","x":"다, 다정하고…… 강해서……."},{"t":"l","s":"세나","c":"세나","x":"힘은 간절함을 먹고 자라. 그 사람은 누구보다 간절했어. 시들어 가는 동료를 전부 지키려고 했으니까. …그래서 제일 빨리 피었고, 제일 빨리— 꺾였어."},{"t":"l","s":"치코","c":"치코","x":"……가, 간절할수록…… 빨리……."},{"t":"l","s":"세나","c":"세나","x":"그래. 이 세계에서는 제일 성실한 아이부터 순서대로 벌을 받아. 잘 만든 규칙이지. — 비꼬는 거야, 지금."},{"t":"l","s":"치코","c":"치코","x":"……네에……."},{"t":"l","s":"주군","c":"주군","x":"(오래 정리해 온 사람의 요약이군.)","m":1},{"t":"d","g":"표정","x":"세나 = 아주 잠깐, 눈을 감는다"},{"t":"l","s":"세나","c":"세나","x":"…정정할게. 그 사람을 꺾은 사람은, 없어. — 스스로 꺾었으니까. 최초의 꽃은, 자기 손으로 자기를 잘랐어. 시들어 가는 자신을, 아무한테도 보이고 싶지 않아서."},{"t":"d","g":"SE","x":"다관의 김이 조용히 오른다"},{"t":"l","s":"치코","c":"치코","x":"스스로…… 자기, 를……."},{"t":"l","s":"세나","c":"세나","x":"이해가 안 되지. …안 되는 게 정상이야. 그 나이에 그게 이해되면, 그쪽이 문제야."},{"t":"l","s":"치코","c":"치코","x":"……어, 어째서, 아무한테도…… 보이고 싶지 않았을까요. 시드는 모습."},{"t":"l","s":"세나","c":"세나","x":"제일 강한 사람이었으니까. — 제일 강한 사람한테는, 무너지는 모습을 보일 자리가 없어. 다들, 그 사람만 보고 서 있었거든."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(———그 꿈. 우는 소녀와, 달래는 목소리가 같았던— 그 밤의 광경은, 그런 뜻이었나.)","m":1},{"t":"d","g":"표정","x":"치코 = 손을 꼭 쥔다"},{"t":"l","s":"치코","c":"치코","x":"그, 그럼…… 그 사람이 지금 하려는 건……."},{"t":"d","g":"표정","x":"세나 = 창밖의 하얀 실금을 본다"},{"t":"l","s":"세나","c":"세나","x":"자기가 겪은 걸, 아무도 겪지 않게 하는 것. — 시들기 전에, 세계째로 잘라서. …그 사람 나름의, 다정함이야. 뒤틀렸지만."},{"t":"l","s":"치코","c":"치코","x":"다정함……."},{"t":"d","g":"표정","x":"치코 = 고개를 젓는다"},{"t":"l","s":"치코","c":"치코","x":"……이, 이상해요. 다정한데…… 왜, 이렇게 무서운 모양이 되는 거예요."},{"t":"l","s":"세나","c":"세나","x":"다정함은 모양이 없거든. 담는 그릇 모양대로 굳지. — 금이 간 그릇에 담으면, 금 간 모양으로."},{"t":"l","s":"치코","c":"치코","x":"…………."},{"t":"l","s":"주군","c":"주군","x":"(……이 사람은 절화의 마녀를 감싸는 게 아니다. 미워하지도 않는다. 다만— 정확하게 말하고 있을 뿐이다. 그게 제일, 잔인하게 들린다.)","m":1},{"t":"d","g":"표정","x":"세나 = 덧붙인다"},{"t":"l","s":"세나","c":"세나","x":"그리고 가장 최근에 정원에 들어간 게, 저 하얀 아이야. 너희가 봤다는— 결계의 설계자. …그런데 이상하지. 그 애가 '꺾이는' 걸 봤다는 사람은, 아무도 없어."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(뮤게…… 치사가, 가장 최근의 사례. — '시듦의 끝은 마녀'의, 살아 있는 증거인가.)","m":1}]},{"id":"p1-e2-s1","title":"13-2. 찻집 — 「이기지 않을 방법」","blocks":[{"t":"d","g":"배경","x":"동일 — 해가 기울어 실내가 주황으로 물든다"},{"t":"d","g":"BGM","x":"동일 (더 낮게)"},{"t":"d","g":"SE","x":"찻잔 내려놓는 소리"},{"t":"d","g":"표정","x":"세나 = 자기 찻잔을 본다"},{"t":"l","s":"세나","c":"세나","x":"나? …나는 만개 직전에 도망쳤어. 동료를 두고."},{"t":"d","g":"SE","x":"해 저무는 골목의 소음이, 아주 멀다"},{"t":"d","g":"표정","x":"치코 = 숨을 삼킨다"},{"t":"l","s":"치코","c":"치코","x":"……!"},{"t":"l","s":"세나","c":"세나","x":"그 얼굴 할 것 없어. 미담이 아니야. — 무서워졌고, 그만뒀어. 그게 전부야."},{"t":"l","s":"치코","c":"치코","x":"무, 무서운 건…… 당연해요."},{"t":"l","s":"세나","c":"세나","x":"당연하지. 당연한 걸 당연하게 한 사람이, 나 하나뿐이었다는 얘기야."},{"t":"l","s":"치코","c":"치코","x":"……동, 동료분들은……."},{"t":"d","g":"표정","x":"세나 = 찻잔의 수면을 본다"},{"t":"l","s":"세나","c":"세나","x":"……그 질문에는, 대답 안 해."},{"t":"l","s":"치코","c":"치코","x":"죄, 죄송해요……."},{"t":"l","s":"세나","c":"세나","x":"사과할 일도 아니야. …차나 마셔. 식는다."},{"t":"d","g":"표정","x":"치코 = 고개를 젓는다"},{"t":"l","s":"치코","c":"치코","x":"도, 도망친 게 아니라…… 멈추신 거잖아요……."},{"t":"d","g":"표정","x":"세나 = 옅게 웃는다 — 웃음이 차갑다"},{"t":"l","s":"세나","c":"세나","x":"착한 아이네. …하지만 그 둘은, 남겨진 쪽에서 보면 같은 거야. 그러니 내 조언은 반쪽짜리야. 그래도 듣겠어?"},{"t":"d","g":"표정","x":"치코 = 무릎 위의 주먹을 본다"},{"t":"l","s":"치코","c":"치코","x":"……."},{"t":"d","g":"표정","x":"치코 = 고개를 숙인다"},{"t":"l","s":"치코","c":"치코","x":"드, 듣고 싶어요. …이기는 방법을."},{"t":"d","g":"SE","x":"정적"},{"t":"d","g":"표정","x":"세나 = 짧게"},{"t":"l","s":"세나","c":"세나","x":"없어."},{"t":"d","g":"표정","x":"치코 = 숨을 삼킨다"},{"t":"l","s":"치코","c":"치코","x":"……!"},{"t":"n","x":"찻잔 내려놓는 소리가, 유난히 크게 들렸다."},{"t":"d","g":"표정","x":"세나 = 치코의 눈을 똑바로 본다"},{"t":"l","s":"세나","c":"세나","x":"잘 들어. 그 사람과 싸워서 이긴다는 건— 네가 그 사람보다 활짝 핀다는 뜻이야. 그리고 활짝 핀 꽃이 어떻게 되는지는, 이제 알잖아. 이기는 순간, 너는 두 번째 [절화의 마녀]가 돼."},{"t":"d","g":"표정","x":"치코 = 손끝이 하얗게 질린다"},{"t":"l","s":"치코","c":"치코","x":"……."},{"t":"l","s":"세나","c":"세나","x":"무섭지."},{"t":"l","s":"치코","c":"치코","x":"……네."},{"t":"l","s":"세나","c":"세나","x":"무서워해. 실컷. — 그 무서움이, 널 두 번째로 만드는 걸 막아 줄 거야."},{"t":"l","s":"치코","c":"치코","x":"이, 이기면…… 제가……."},{"t":"l","s":"세나","c":"세나","x":"그래. 세상에서 제일 성대한 우승이지. 상품은 시듦이고."},{"t":"d","g":"표정","x":"치코 = 그래도, 고개를 든다"},{"t":"l","s":"치코","c":"치코","x":"그, 그치만…… 안 싸우면, 도시가…… 다들이……."},{"t":"l","s":"세나","c":"세나","x":"그것도 맞아. — 싸우면 네가 지고, 안 싸우면 도시가 져. 문제가 그렇게 생겨 먹었어."},{"t":"l","s":"치코","c":"치코","x":"그, 그런 건…… 무, 문제가, 잘못됐어요……."},{"t":"l","s":"세나","c":"세나","x":"……응. 잘 아네."},{"t":"d","g":"표정","x":"세나 = 처음으로, 치코를 정면에서 본다"},{"t":"l","s":"세나","c":"세나","x":"지금 네가 한 말— 그게 시작이야. 문제가 잘못됐으면, 문제 밖에서 답을 찾는 수밖에 없지."},{"t":"l","s":"치코","c":"치코","x":"무, 문제 밖……."},{"t":"l","s":"세나","c":"세나","x":"왜, 어른이 이런 말 하니까 이상해? — 나도 현역 때, 누가 말해 줬으면 했던 말이야."},{"t":"l","s":"치코","c":"치코","x":"……어, 어른들은, 아무도…… 안 말해 줬어요?"},{"t":"l","s":"세나","c":"세나","x":"어른들은 서명만 했지. — …아, 지금 건 너한테 한 말 아니야, 입회인."},{"t":"l","s":"주군","c":"주군","x":"……아니. 맞는 말이라, 받아 두지."},{"t":"d","g":"표정","x":"세나 = 아주 조금, 목소리가 부드러워진다"},{"t":"l","s":"세나","c":"세나","x":"……이기지 않을 방법을 찾는다면, 몰라도."},{"t":"d","g":"표정","x":"치코 = 되뇐다"},{"t":"l","s":"치코","c":"치코","x":"이기지, 않을…… 방법……."},{"t":"l","s":"치코","c":"치코","x":"그, 그게 뭔지는……."},{"t":"d","g":"표정","x":"세나 = 자리에서 일어선다 (다관을 정리하며)"},{"t":"l","s":"세나","c":"세나","x":"그 이상은 나도 몰라. 찾은 사람이 없었으니까. …다만, 하나. 그 사람은 계약의 '문'에 대해 뭔가 알고 있었어. 만개하기 전에, 계속 낡은 문서를 뒤졌지. …아니, 정확히는— 찾았는데, 열 수 없었다고 했어."},{"t":"l","s":"주군","c":"주군","x":"……계약의 문. 그 사람이, 그런 걸."},{"t":"l","s":"세나","c":"세나","x":"어울리지 않는다고 생각해? — 아니. 그 사람다웠어. 싸움의 한가운데서도, 끝내는 방법부터 찾는 사람이었으니까."},{"t":"l","s":"주군","c":"주군","x":"그 문서가 뭔지— 들은 건 없나."},{"t":"l","s":"세나","c":"세나","x":"없어. 나는 그때, 듣고 싶지 않았거든. — 그만둘 사람한테, 끝내는 방법 얘기는 독이야."},{"t":"l","s":"치코","c":"치코","x":"……."},{"t":"d","g":"표정","x":"세나 = 그날을 떠올리듯"},{"t":"l","s":"세나","c":"세나","x":"마지막으로 만난 밤에, 그 사람이 그랬어. 「찾았는데. 분명 찾았는데— 이건, 내 손에서는 노래하지 않아」라고. …무슨 뜻인지는, 끝내 못 물었어."},{"t":"d","g":"표정","x":"주군 = 시선이 날카로워진다"},{"t":"l","s":"주군","c":"주군","x":"(낡은 문서— 계약의 원문. 찢긴 마지막 줄. …그 여자도, 같은 것을 찾고 있었다는 건가.)","m":1},{"t":"d","g":"SE","x":"다관을 정리하는 소리"},{"t":"l","s":"치코","c":"치코","x":"……저, 저기. 마지막으로, 하나만…… 더."},{"t":"l","s":"세나","c":"세나","x":"짧게."},{"t":"l","s":"치코","c":"치코","x":"그만두고 나서…… 후, 후회는, 안 하세요?"},{"t":"d","g":"표정","x":"세나 = 손이 멈춘다 — 길게"},{"t":"l","s":"세나","c":"세나","x":"………매일 해."},{"t":"l","s":"치코","c":"치코","x":"……!"},{"t":"l","s":"세나","c":"세나","x":"후회 안 하는 방법 같은 것도, 없어. 어느 쪽을 골라도 하게 돼 있어. — 그러니까 하다못해, 후회할 쪽은 스스로 고르는 거야. 나는 골랐고. …그 값을, 이 가게에서 치르는 중이야."},{"t":"l","s":"치코","c":"치코","x":"…………네."},{"t":"l","s":"주군","c":"주군","x":"(……이 사람의 조언이 잔인할 만큼 정확한 이유를, 알 것 같다. 전부— 자기 상처에서 꺼낸 말이니까.)","m":1},{"t":"d","g":"표정","x":"세나 = 등을 보인 채, 마지막으로"},{"t":"l","s":"세나","c":"세나","x":"치코 양. …돌아가는 길에, 하나만 기억해. 나 같은 어른이 되는 것도— 그 사람 같은 마녀가 되는 것도, 정답이 아니야. 네가 세 번째 답을 찾으렴."},{"t":"d","g":"표정","x":"치코 = 깊이, 고개를 숙인다"},{"t":"l","s":"치코","c":"치코","x":"……가, 감사합니다. 차…… 잘 마셨습니다."},{"t":"l","s":"세나","c":"세나","x":"……답례는 됐어. 대신— 찾으면, 알려 주러 와. 그 답."},{"t":"l","s":"치코","c":"치코","x":"……네! 꼭…… 꼭이요!"},{"t":"n","x":"찻집을 나서자, 노을이 하얀 실금 사이로 갈라져 내리고 있었다."},{"t":"n","x":"돌아가는 길 내내, 치코는 그 말을 입안에서 굴리고 있었다. 이기지 않을 방법. 세 번째 답."},{"t":"l","s":"주군","c":"주군","x":"(처음이었다. '싸움' 바깥에 답이 있다고 말해 준 어른은. ……반쪽짜리라도, 지도는 지도다.)","m":1}]}]},{"id":"p1-e3","title":"14화 「들장미의 매듭」","scenes":[{"id":"p1-e3-s0","title":"14-1. 버려진 성당 — 「다시, 가시 앞에」","blocks":[{"t":"d","g":"배경","x":"버려진 성당 — 가시덩굴이 이전보다 빽빽하다, 달빛"},{"t":"d","g":"BGM","x":"파이프오르간 드론 (8화 변주)"},{"t":"d","g":"SE","x":"덩굴 스치는 소리"},{"t":"n","x":"치코가 '세 번째 답'의 첫 상대로 고른 것은— 가장 무서운 곳이었다."},{"t":"d","g":"표정","x":"치코링 = 성당 계단 아래, 문을 올려다본다 — 숨을 고른다"},{"t":"l","s":"치코링","c":"치코","x":"……후우……. 괘, 괜찮아. 괜찮아, 치코……."},{"t":"d","g":"표정","x":"히스이 = 팔짱, 반쯤 감긴 눈"},{"t":"l","s":"히스이","c":"히스이","x":"아까부터 그 '괜찮아', 몇 번째야."},{"t":"l","s":"치코링","c":"치코","x":"세, 세어 봤어……?"},{"t":"l","s":"히스이","c":"히스이","x":"열두 번. — 안 괜찮다는 뜻이잖아, 그거."},{"t":"d","g":"표정","x":"치코링 = 떨리는 손을 펴 보인다 → 꼭 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"……으. 마, 맞아. 하나도 안 괜찮아. 다, 다리도 떨리고, 손도 이렇게……."},{"t":"l","s":"치코링","c":"치코","x":"그, 그치만. 차, 찻집의 그분이 그랬어. 세 번째 답을 찾으라고. …차, 찾으려면, 만나러 가야 하잖아."},{"t":"d","g":"표정","x":"히스이 = 성당 문 앞, 한숨"},{"t":"l","s":"히스이","c":"히스이","x":"……진짜 갈 거야? 지난번에 네네가 어떻게 됐는지, 봤잖아."},{"t":"d","g":"표정","x":"치코링 = 끄덕인다 (떨면서)"},{"t":"l","s":"치코링","c":"치코","x":"으, 응……. 그, 그래도— 싸우러 가는 게 아니야. 마, 만나러 가는 거야."},{"t":"l","s":"히스이","c":"히스이","x":"만나러, 라……. 저쪽이 이야기로 받아 줄 거란 보장은?"},{"t":"l","s":"치코링","c":"치코","x":"어, 없어……."},{"t":"l","s":"히스이","c":"히스이","x":"없구나. 시원하게 없네."},{"t":"l","s":"치코링","c":"치코","x":"그, 그치만— 있잖아, 히스이 쨩. 지난번에, 그 사람…… 도, 도망치는 우리를, 안 쫓아왔어."},{"t":"l","s":"치코링","c":"치코","x":"무, 묶는 게 전부라면, 이상하잖아. 도, 도망치게 두는 사슬이, 어디 있어……."},{"t":"d","g":"표정","x":"히스이 = 잠깐, 눈을 제대로 뜬다"},{"t":"l","s":"히스이","c":"히스이","x":"………그런 건, 잘 보네. 너."},{"t":"d","g":"표정","x":"히스이 = 어깨를 으쓱 → 따라 들어간다"},{"t":"l","s":"히스이","c":"히스이","x":"……하아. 알았어, 알았어. 바람은 내가 막을게. 정위치."},{"t":"n","x":"히스이가 돌아와 있었다. '생각할 시간'의 답은 묻지 않았다. 옆에 서 있는 것이, 그 애의 답이었다."},{"t":"d","g":"SE","x":"무거운 문이 열린다 — 삐걱임이 성당 안으로 길게 울린다"},{"t":"n","x":"문 안쪽은 가시의 숲이었다. 달빛이 스테인드글라스를 지나, 가시 하나하나 위에서 조각나 있었다."},{"t":"d","g":"표정","x":"치코링 = 걸음을 멈춘다"},{"t":"l","s":"치코링","c":"치코","x":"……지, 지난번보다, 훨씬 늘었어……."},{"t":"l","s":"히스이","c":"히스이","x":"늘었네. — 저 안쪽, 제단. …있어."},{"t":"d","g":"표정","x":"에글랑틴 = 제단 위 — 기다리고 있었다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……또, 오셨네요."},{"t":"d","g":"표정","x":"에글랑틴 = 기도 자세 그대로, 돌아보지 않는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"두 번 찢고 도망친 꽃이, 세 번째에는 제 발로 화병에 돌아온 거랍니다. …기특한 일이에요."},{"t":"l","s":"치코링","c":"치코","x":"도, 돌아온 게 아니에요. 마, 만나러 온 거예요. 다, 당신을."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"만나러. …후후. 이상한 말을 하시네요."},{"t":"d","g":"표정","x":"에글랑틴 = 천천히 일어선다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"꽃이 정원사를 '만나러' 오지는 않아요. 꽃은 그저— 꽂혀 있으면 되는 거랍니다."},{"t":"l","s":"치코링","c":"치코","x":"다, 당신은…… 정원사가 아니라, 마법소녀였잖아요."},{"t":"d","g":"SE","x":"가시 몇 가닥이 — 삐걱, 뒤틀린다"},{"t":"d","g":"표정","x":"에글랑틴 = 처음으로, 고개만 이쪽으로"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"………그 이야기를, 어디서."},{"t":"l","s":"치코링","c":"치코","x":"드, 들었어요. 마녀는, 전부…… 워, 원래는, 우리랑 같은……."},{"t":"d","g":"표정","x":"에글랑틴 = 미소가 얇아진다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"옛날이야기랍니다. 시든 페이지는— 읽는 게 아니에요."},{"t":"d","g":"표정","x":"에글랑틴 = 곤혹과 분노 사이"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"어째서. 묶여도, 찢겨도, 어째서 이 아이들은 또……!"},{"t":"d","g":"이펙트","x":"가시덩굴이 일제히 곤두선다"},{"t":"d","g":"표정","x":"히땅 = 반보 앞으로 — 바람이 소매를 부풀린다"},{"t":"l","s":"히땅","c":"히스이","x":"……치코. 물러날 거면, 지금이야."},{"t":"l","s":"치코링","c":"치코","x":"……응. 아, 알아."},{"t":"n","x":"알아, 라고 말한 아이는— 물러나는 대신, 손에 든 빛을 풀었다."},{"t":"d","g":"표정","x":"치코링 = 무기를 내린다"},{"t":"l","s":"치코링","c":"치코","x":"……."},{"t":"d","g":"SE","x":"챙그랑— 빛의 무기가 바닥에 닿기 전에 입자로 흩어진다"},{"t":"d","g":"표정","x":"히스이 = 눈을 크게 뜬다"},{"t":"l","s":"히스이","c":"히스이","x":"야……! 무슨 짓이야. 그거 없으면, 가시를 못 쳐내—"},{"t":"l","s":"치코링","c":"치코","x":"으, 응. 못 쳐내. …그, 그래서, 내린 거야."},{"t":"l","s":"히스이","c":"히스이","x":"……하. 진심이구나."},{"t":"l","s":"치코링","c":"치코","x":"히스이 쨩은…… 나 말고, 성당 밖을 부탁해. 가, 가시가 밖으로 뻗으면, 마을 사람들이……."},{"t":"l","s":"히스이","c":"히스이","x":"……알았어. 대신— 쓰러지면, 억지로라도 끌고 나간다."},{"t":"d","g":"표정","x":"에글랑틴 = 멈칫"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……뭘 하는 거죠. 무기를, 왜."},{"t":"l","s":"치코링","c":"치코","x":"버, 버릴게요. 이길 방법은. …저, 저는 오늘, 다, 당신을 이기러 온 게 아니니까요."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……이기지 않는, 마법소녀?"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"후후…… 후후후. 그건 그냥— 먹잇감이라고 하는 거랍니다."},{"t":"d","g":"표정","x":"치코링 = 한 발 내딛는다"},{"t":"l","s":"치코링","c":"치코","x":"씨, 싸우러 온 게 아니에요. 그, 그러니까…… 이대로, 이야기하러 갈게요."},{"t":"d","g":"표정","x":"에글랑틴 = 목소리가 떨린다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"오지 마세요. …오지 마. 가시에 찢겨요. 아프다구요. 당신들은— 아픈 걸 모르는 얼굴로, 자꾸만……."},{"t":"d","g":"표정","x":"치코링 = 첫걸음"},{"t":"l","s":"치코링","c":"치코","x":"……가, 갈게요."},{"t":"d","g":"SE","x":"툭— 첫 가시가 소매를 문다"},{"t":"n","x":"치코는 걸었다. 가시가 뺨을 긋고, 팔을 긋었다. 유령불이 상처를 어루만지듯 흔들렸지만— 발은 멈추지 않았다."},{"t":"d","g":"표정","x":"에글랑틴 = 기도하듯 손을 모은다 — 목소리만 높아진다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"멈춰요. 멈추세요. 이리스 님은 말씀하셨답니다. 꽃은 걷기 때문에 시드는 거라고. 걸으니까— 찢기는 거라고……."},{"t":"l","s":"치코링","c":"치코","x":"그, 그럼…… 걷지 않는 꽃은, 안 아픈가요……?"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"아프지 않아요. 화병 속은, 아무것도—"},{"t":"l","s":"치코링","c":"치코","x":"다, 당신은요……? 당신은, 지금…… 아, 안 아픈가요……?"},{"t":"d","g":"SE","x":"가시 한 가닥이 — 갈피를 잃고 허공을 긋는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……무슨."},{"t":"l","s":"치코링","c":"치코","x":"아, 아까부터…… 가시가 저를 찌를 때마다, 다, 당신이 먼저, 움찔하잖아요……!"},{"t":"d","g":"표정","x":"에글랑틴 = 모은 손이, 흔들린다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……보지 마세요. 그런 건, 보는 게 아니랍니다."},{"t":"n","x":"가시가 무릎을 스쳤다. 뜨거움이 한 박자 늦게 오고, 그다음에야 아픔이 왔다. 아이는 그 순서를 전부 견디며 걸었다."},{"t":"d","g":"표정","x":"치코링 = 이를 악문다"},{"t":"l","s":"치코링","c":"치코","x":"읏……!"},{"t":"d","g":"표정","x":"히땅 = 바람으로 낙하하는 파편만 걷어낸다 — 앞은 막지 않는다"},{"t":"l","s":"히땅","c":"히스이","x":"(작게) ……막아 주고 싶은 걸 참는 것도, 일이네."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"어째서 걷는 거죠. 아프다면서요. 아픈 건, 나쁜 것이랍니다. 이리스 님이, 아픔이 없는 정원을—"},{"t":"l","s":"치코링","c":"치코","x":"아, 아픈 건 나빠요! 나쁜데— 아, 아무것도 못 느끼는 건, 더 무서워요……!"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……그게, 무슨……."},{"t":"l","s":"치코링","c":"치코","x":"소, 손을 잡을 때 따뜻한 거랑…… 노, 놓쳤을 때 아픈 건, 가, 같은 손이잖아요. 하나만 버릴 수는, 없잖아요……."},{"t":"d","g":"표정","x":"에글랑틴 = 모은 손이, 풀릴 듯 떨린다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"궤변이에요. 그런 건, 궤변이랍니다. 아픔은 실수예요. 세계의, 설계 실수—"},{"t":"l","s":"치코링","c":"치코","x":"그, 그럼 왜…… 다, 당신 가시에는, 꽃이 피어 있나요……."},{"t":"d","g":"SE","x":"정적"},{"t":"d","g":"표정","x":"에글랑틴 = 처음으로, 자기 정원을 둘러본다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"…………."},{"t":"l","s":"치코링","c":"치코","x":"드, 들장미…… 예쁘다고, 생각했어요. 처음 왔을 때부터. …버, 버리고 싶은 힘에서는, 꽃은 안 피어요……."},{"t":"l","s":"주군","c":"주군","x":"(문답이 아니다. 아이는 교리를 반박하는 게 아니라— 교리 밑에 깔린 사람을, 계속 부르고 있다.)","m":1},{"t":"d","g":"표정","x":"에글랑틴 = 뒷걸음질 — 제단에 등이 닿는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"오지 마요……. 부탁이니까……. 이 손은, 잡으면— 잡으면, 당신까지……."},{"t":"n","x":"'오지 마세요'가, '부탁'으로 바뀌어 있었다. 명령이 아니라— 비명이었다."},{"t":"d","g":"표정","x":"치코링 = 걸으면서"},{"t":"l","s":"치코링","c":"치코","x":"아, 아파요……! 엄청 아파요……! 그, 그치만— 당신의 가시, 이상해요……!"},{"t":"l","s":"치코링","c":"치코","x":"찌르는 방향이…… 저, 전부, 안쪽이잖아요……! 그거, 묶는 게 아니라— 사실은, 노, 놓치기 싫은 거잖아요……!"},{"t":"d","g":"SE","x":"덩굴 전체가 — 떨린다"}]},{"id":"p1-e3-s1","title":"14-2. 성당 — 「인연은 잡는 것」","blocks":[{"t":"d","g":"배경","x":"동일 — 달빛이 제단까지 닿는다"},{"t":"d","g":"BGM","x":"드론이 걷히고, 현악 한 줄"},{"t":"d","g":"SE","x":"가시가 풀리는 소리"},{"t":"n","x":"가시가 흔들렸다. 마녀의 정원에서, 처음으로."},{"t":"d","g":"표정","x":"에글랑틴 = 제단에 주저앉는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……[인연의 소녀]. 옛날에는, 그렇게 불렸답니다."},{"t":"d","g":"표정","x":"에글랑틴 = 스스로도 놀란 듯, 입가에 손을 댄다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"후후…… 이상하네요. 그 이름, 오랫동안 잊고 있었는데. 당신의 손을 보고 있으니— 입이, 멋대로 기억하고 있었어요."},{"t":"l","s":"치코링","c":"치코","x":"[인연의…… 소녀]."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"네. …빨간 실이, 특기랍니다. — 아, 아니. …특기'였어요'."},{"t":"d","g":"표정","x":"에글랑틴 = 기도의 말투가, 한 꺼풀 벗겨진다"},{"t":"d","g":"표정","x":"에글랑틴 = 자기 손바닥을 본다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"잇는 게 좋았어요. 사람과, 사람을. 실 하나로 누군가와 누군가가 이어지는 순간이— 세상에서 제일 좋았어요."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"미아가 된 아이와 엄마를 이었어요. 싸운 친구와 친구를 이었어요. 이어질 때마다 다들 웃어서— 저는, 그 웃는 얼굴을 매듭짓는 게……."},{"t":"l","s":"치코링","c":"치코","x":"……소, 솜씨, 지금도 안 죽었어요. 이, 이 정원의 매듭…… 저, 전부 예뻤는걸요. 무, 무서웠지만."},{"t":"d","g":"표정","x":"에글랑틴 = 허를 찔린 웃음"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……후후. 무서운데 예쁘다니. 당신, 정말 이상한 꽃이네요."},{"t":"d","g":"표정","x":"에글랑틴 = 손이 떨린다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"그런데, 무서워져서. 이어진 것이 풀리는 게, 시드는 것보다 무서워져서……. 정신을 차려 보니, 실이 전부— 가시가 되어 있었어요."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"처음에는, 매듭을 조금 단단히 묶었을 뿐이었어요. 풀리지 말라고. 다음에는, 조금 더. 그다음에는— 풀 수 없게."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"어느 날 실을 보니까, 가시가 돋아 있었어요. …그런데 저는, 무서워하기는커녕— 안심해 버렸어요. 아아, 이제 아무도 못 풀겠구나, 하고."},{"t":"d","g":"표정","x":"치코링 = 아무 말 없이, 한 걸음"},{"t":"l","s":"치코링","c":"치코","x":"……."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"그날부터일 거예요. [인연의 소녀]가 없어지고, [결박의 마녀]가 앉아 있게 된 건. — 누가 자른 것도 아닌데. 제 손으로, 제가…… 매듭이 되어 버렸답니다."},{"t":"l","s":"치코링","c":"치코","x":"……어, 없어지지 않았어요."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……네?"},{"t":"l","s":"치코링","c":"치코","x":"지, 지금, 얘기해 주고 있잖아요. 좋았던 걸, 좋았다고. …그, 그건, 그 소녀가 아직…… 마, 말할 수 있다는 거잖아요."},{"t":"d","g":"표정","x":"치코링 = 바로 앞까지 와 있다"},{"t":"l","s":"치코링","c":"치코","x":"에글랑틴 씨."},{"t":"d","g":"표정","x":"에글랑틴 = 고개를 든다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……왜, 도망치지 않는 거죠. 이 손은, 잡는 것마다 전부 묶어 버리는데."},{"t":"l","s":"치코링","c":"치코","x":"도, 도망치면…… 자, 잡을 수 없으니까요."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……잡는다니. 이 손을요? 가시투성이인데."},{"t":"l","s":"치코링","c":"치코","x":"지, 지금은…… 아니에요. 보, 보세요. 아까부터— 이, 이 근처만, 가시가 없어요."},{"t":"n","x":"정말이었다. 제단 앞 한 평 남짓— 소녀의 주위에서만, 덩굴이 스스로 물러나 있었다."},{"t":"d","g":"표정","x":"에글랑틴 = 제 덩굴을 보고, 힘없이 웃는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……아. …이 아이들도 참, 정직하네요."},{"t":"d","g":"표정","x":"치코링 = 손을 내민다"},{"t":"l","s":"치코링","c":"치코","x":"이, 인연은요. 묶는 게 아니라— 잡는 거예요."},{"t":"l","s":"치코링","c":"치코","x":"잡은 손은, 놓고 싶으면 놓을 수 있어요. 그, 그래도 다시 잡고 싶어지는 게…… 지, 진짜 인연이래요. 저희 할…… 어, 어떤 할아버지가 그랬어요."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………지금 하케 씨 얘기를 하려다 말았지. 이 세계에서는 만난 적도 없을 텐데. — 기억은 지워져도, 배운 것은 남는 건가.)","m":1},{"t":"d","g":"SE","x":"밤바람 — 스테인드글라스 너머로 구름이 흐른다"},{"t":"d","g":"표정","x":"에글랑틴 = 내밀어진 손을, 오래 본다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"………무서워요."},{"t":"l","s":"치코링","c":"치코","x":"아, 알아요. 저, 저도 무서워요. 소, 손, 이렇게 떨리는걸요."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"후후…… 정말이네. 떨면서, 내밀고 있어."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……저기. 하나만, 물어봐도 될까요."},{"t":"l","s":"치코링","c":"치코","x":"네, 네."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"만약 이 손이, 또 당신을 묶으려고 하면— 그때는, 어떻게 하실 건가요."},{"t":"l","s":"치코링","c":"치코","x":"노, 놓을 거예요."},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"…………네?"},{"t":"l","s":"치코링","c":"치코","x":"노, 놓고— 다, 다시 잡을 거예요. 몇 번이든. …그, 그게, 잡는다는 거라고 생각하니까요."},{"t":"d","g":"표정","x":"에글랑틴 = 숨을 삼킨다 — 그리고, 기도가 아닌 얼굴로 웃는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……졌네요. 완전히."},{"t":"l","s":"주군","c":"주군","x":"(……그 차이 하나를, 이 아이는 가시밭을 걸어서 증명했다.)","m":1},{"t":"d","g":"표정","x":"히땅 = 기둥 뒤에서, 바람을 죽인 채"},{"t":"l","s":"히땅","c":"히스이","x":"(작게) ……잡아. 이번엔, 아무도 안 찢어."},{"t":"d","g":"SE","x":"스르륵…… (덩굴이 풀리는 소리)"},{"t":"n","x":"에글랑틴은 오래 그 손을 바라보았다. 그리고— 떨리는 손이, 가시 하나 없이, 치코의 손을 잡았다."},{"t":"d","g":"이펙트","x":"가시덩굴이 빛의 입자로 풀리고, 들장미 꽃만 남는다 — 그리고, 마녀의 몸도 함께 풀리기 시작한다"},{"t":"d","g":"표정","x":"치코링 = 경악"},{"t":"l","s":"치코링","c":"치코","x":"……에? 에글랑틴 씨……? 소, 손이— 손이, 빛이……."},{"t":"d","g":"표정","x":"히스이 = 뛰어나온다"},{"t":"l","s":"히스이","c":"히스이","x":"……! 뭐야, 이거— 정화가, 아니야……?"},{"t":"d","g":"표정","x":"에글랑틴 = 자신의 풀려 가는 손끝을 본다 — 놀라지 않는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……아아. 그런, 거였군요. 마녀는— 놓으면, 끝나는 거였어요."},{"t":"l","s":"치코링","c":"치코","x":"노, 놓을게요……! 지금 놓으면— 자, 잡은 걸, 취소하면……!"},{"t":"d","g":"표정","x":"에글랑틴 = 잡은 손을, 놓아 주지 않는다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"후후. 늦었어요. …그리고— 취소라니, 너무해요. 모처럼, 잡았는데."},{"t":"d","g":"표정","x":"에글랑틴 = 그런데도, 잡은 손에 힘을 준다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"저를 세우고 있던 건, 이 힘이 아니라— '놓치기 싫다'는 마음 쪽이었으니까."},{"t":"d","g":"표정","x":"치코링 = 필사적으로 손을 붙든다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그럼 놓지 마세요……! 지금처럼, 계속 잡고 있으면……!"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……계속 잡고 있으면, 계속 이대로일까요."},{"t":"l","s":"치코링","c":"치코","x":"이, 있을 거예요! 분명……!"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"후후…… 거짓말이 서투르네요. 목소리가, 울고 있는걸요."},{"t":"d","g":"표정","x":"에글랑틴 = 고개를 젓는다 — 웃으면서"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"…후후. 이상하죠. 하나도, 무섭지 않아요. — 잡을 수 있었어요. 마지막에, 가시 없이. 그거면, 충분해요."},{"t":"d","g":"이펙트","x":"풀려난 빛이 들장미 꽃잎으로 바뀌어, 두 사람 주위를 천천히 돈다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"있잖아요. 마지막으로— 부탁이, 두 개 있어요."},{"t":"l","s":"치코링","c":"치코","x":"며, 몇 개든……!"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"하나. 이 정원의 들장미…… 가시는 이제 곧 없어질 테니까. 꽃만 남으면— 가끔, 보러 와 줄래요. 물은, 필요 없어요. 그냥…… 보러만."},{"t":"l","s":"치코링","c":"치코","x":"가, 갈게요. 매주…… 매, 매일이라도……!"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"후후, 매일은 너무 많아요. …둘."},{"t":"d","g":"표정","x":"에글랑틴 = [인연의 소녀]의 목소리로 — 기도의 말투가, 완전히 벗겨진다"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"그 손, 앞으로도 그렇게 내밀어 줘. 나 말고도— 묶인 채로 우는 애들이, 아직 있으니까."},{"t":"l","s":"치코링","c":"치코","x":"……네…… 네에……!"},{"t":"d","g":"표정","x":"에글랑틴 = 흩어지며, 마지막으로"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"[인연의 소녀]는…… 좋은 이름이었어요. 당신이, 기억해 줄래요?"},{"t":"l","s":"치코링","c":"치코","x":"기, 기억할게요……! [인연의 소녀]…… 세, 세상에서 제일 예쁜 매듭을 짓던 사람……! 이, 잊을 리가, 없잖아요……!"},{"t":"d","g":"표정","x":"에글랑틴 = 마지막 미소 — 소녀의 얼굴로"},{"t":"l","s":"에글랑틴","c":"시즈쿠","x":"……고마워. — 아아, 이 말도…… 참, 오랜만에 하네."},{"t":"d","g":"이펙트","x":"들장미 꽃보라 — 마녀, 소멸"},{"t":"d","g":"표정","x":"치코링 = 빈 손바닥을 본다 → 오열"},{"t":"l","s":"치코링","c":"치코","x":"……어…… 어어…… 으아아아앙……!!"},{"t":"l","s":"치코링","c":"치코","x":"자, 잡았는데…… 자, 잡았었는데……! 소, 손…… 따뜻했는데……!"},{"t":"d","g":"표정","x":"히스이 = 말없이 치코를 안는다 — 시선은 꽃보라를 좇는다"},{"t":"l","s":"히스이","c":"히스이","x":"…………기억할게. 우리가, 전부."},{"t":"l","s":"치코링","c":"치코","x":"히스이 쨩…… 나, 나…… 뭐, 뭘 한 거야……. 구, 구했는데…… 구한 거, 맞아……?"},{"t":"l","s":"히스이","c":"히스이","x":"……맞아. — 울어도 되니까, 그것만은 의심하지 마."},{"t":"n","x":"소녀는 울음소리 하나로 마녀 하나를 해방시켰다. 그리고 배웠다 — 이 세계에서 구제는, 작별이라는 것을."},{"t":"n","x":"마녀를 세우고 있는 것은 '놓지 못한 마음'이다. 그 매듭이 풀리는 순간— 매듭이 지탱하던 존재째로, 풀려 버린다. 마녀는, 돌아오지 못한다."},{"t":"l","s":"주군","c":"주군","x":"(시즈쿠의 얼굴로, 마지막에 웃었다. 아는 얼굴이 흩어지는 광경에는— 끝내, 익숙해질 것 같지 않다. ……이것이 '이기지 않는 방법'의 값인가. 구원과 상실이, 같은 문으로 온다.)","m":1}]}]},{"id":"p1-e4","title":"15화 「도시가 본 것」","scenes":[{"id":"p1-e4-s0","title":"15-1. 송출탑 — 「회선을 뒤집어라」","blocks":[{"t":"d","g":"배경","x":"방송 송출탑 상층 — 수백 개의 모니터, 케이블의 정글"},{"t":"d","g":"BGM","x":"노이즈 신스 (긴박 변주)"},{"t":"d","g":"SE","x":"키보드 연타, 모니터 잡음"},{"t":"n","x":"[풍문의 마녀]의 성은, 도시에서 제일 높은 송출탑이었다."},{"t":"n","x":"성당에서 돌아온 밤, 료가 무전기를 한 아름 말없이 내밀었다. \"다음은, 혼자 보내지 않을 거예요\"라는 말 대신이었을 것이다."},{"t":"n","x":"오늘도 그 꼭대기에서, 절망이 편집되고 있었다. — 그리고 이번에는, 우리도 알고 있었다. 이 문 너머의 구원이 무엇을 뜻하는지."},{"t":"d","g":"표정","x":"료(통신) = 작전 개시 전, 낮은 목소리"},{"t":"l","s":"료","c":"료","x":"「복습할게요. 이 탑의 송출은 삼중 우회— 겉 회선을 아무리 잘라도, 본체는 마녀의 결계 안이에요. 그러니까 자르지 않고, 통째로 '빌립니다'.」"},{"t":"l","s":"주군","c":"주군","x":"훔치는 게 아니라?"},{"t":"l","s":"료","c":"료","x":"「사람 듣기 나쁘게. …방송 시간을 빌리는 것뿐이에요. 편성표 바꿔치기— 방송국에서 늘 하는 일이잖아요?」"},{"t":"d","g":"표정","x":"벨 = 모니터 앞, 콧노래"},{"t":"l","s":"벨","c":"메이","x":"자~ 오늘의 하이라이트는~ 신입 씨의 우는 얼굴☆ 역시 다들 이런 걸 보고 싶어하는걸. 무너지는 장면, 우는 장면! 조회수는 정직하다구?"},{"t":"l","s":"벨","c":"메이","x":"아, 카메라 5번! 각도 최악이잖아~! 우는 얼굴은 반드시 정면이라고, 몇 번을 말해?"},{"t":"l","s":"벨","c":"메이","x":"어디 보자, 다음 편성은…… 아하, [들장미의 성당] 시간대가 비었네? 간판이 하나 내려가면, 그 자리를 채우는 게 방송국의 일이지☆"},{"t":"l","s":"벨","c":"메이","x":"(콧노래) 절망은 소재가 안 떨어져서 좋~다니까. 희망은 금방 품절되는데 말야?"},{"t":"l","s":"주군","c":"주군","x":"(성당의 꽃보라로부터, 아직 하루도 지나지 않았다. — 그 작별을 '빈 시간대'라고 부르는 목소리를, 아이들이 듣지 않아서 다행이다.)","m":1},{"t":"d","g":"표정","x":"주군 = 어둠 속에서 걸어 나온다"},{"t":"l","s":"주군","c":"주군","x":"— 그럼, 이것도 송출해 봐라. 조회수, 잘 나올 거다."},{"t":"d","g":"표정","x":"벨 = 홱 돌아본다"},{"t":"l","s":"벨","c":"메이","x":"하아?! 누구— 어떻게 여기까지 올라온 거야! 경비 결계는?!"},{"t":"d","g":"표정","x":"벨 = 카메라를 홱 돌려 주군에게 향한다"},{"t":"l","s":"벨","c":"메이","x":"……아니, 잠깐. 잘 왔어, 일반인 씨! 마침 코너가 하나 비었거든~ 제목은 「무단침입자의 최후」☆ 어때, 주연?"},{"t":"l","s":"주군","c":"주군","x":"사양하지. 주연은 따로 있다."},{"t":"l","s":"벨","c":"메이","x":"하아? 무슨—"},{"t":"d","g":"표정","x":"료(통신) = 무전 너머"},{"t":"l","s":"료","c":"료","x":"「경비 결계, 3분 전에 제가 접었어요. …계약자 씨, 회선 준비 완료. 언제든지.」"},{"t":"d","g":"표정","x":"주군 = 무전기를 들어 보인다"},{"t":"l","s":"주군","c":"주군","x":"밤에 잠이 안 오는 관측자가, 이쪽에도 있어서 말이지."},{"t":"l","s":"쿠로코(통신)","c":"쿠로코","x":"「이쪽 쿠로코! 예비 전원, 접속 끝! …그나저나 이 탑 배선, 엉망진창이다— 시공한 놈 얼굴 좀 보고 싶네!」"},{"t":"l","s":"료","c":"료","x":"「그 얼굴, 지금 모니터에 백 개쯤 떠 있어요.」"},{"t":"d","g":"표정","x":"벨 = 관자놀이에 핏대"},{"t":"l","s":"벨","c":"메이","x":"……하? 지금 이 몸의 탑에, 몇 명이나 기어들어 온 거야?"},{"t":"l","s":"료","c":"료","x":"「관측자 하나, 목수 하나, 현장 둘, 계약자 하나. — 그리고 시청자는, 곧 도시 전부.」"},{"t":"d","g":"표정","x":"벨 = 이를 간다"},{"t":"l","s":"벨","c":"메이","x":"하…… 하하! 뭘 하려는진 몰라도, 이 탑의 송출권은 전부 이 몸의—"},{"t":"l","s":"벨","c":"메이","x":"이 몸의 성이야! 이 몸의 채널이고, 이 몸의 시간이라구! 어디서 굴러온 일반인이—"},{"t":"l","s":"쿠로코(통신)","c":"쿠로코","x":"「주회선 물렸다! 언제든 가!」"},{"t":"d","g":"표정","x":"벨 = 케이블 다발을 발견한다"},{"t":"l","s":"벨","c":"메이","x":"……뭐?! 야, 그 케이블에서 손 떼—!"},{"t":"d","g":"표정","x":"료(통신) = 담담"},{"t":"l","s":"료","c":"료","x":"「회선, 뒤집습니다. 3, 2, 1—」"},{"t":"d","g":"SE","x":"뚝 — 모든 모니터가 일제히 전환된다"},{"t":"d","g":"이펙트","x":"수백 개의 화면에 '편집 없는 지금'이 뜬다 — 결계 안에서 싸우는 치코링과 히땅의 실시간 영상"},{"t":"n","x":"전 채널에, 편집 없는 '지금'이 흘렀다."},{"t":"n","x":"실패도, 비명도, 떨리는 다리도 그대로. — 그리고 그 모든 것에도 불구하고, 물러서지 않는 등도 그대로."},{"t":"d","g":"표정","x":"벨 = 모니터로 달려든다 — 키를 연타한다"},{"t":"l","s":"벨","c":"메이","x":"뭐야 이거, 뭐야 이거! 컷 전환! 컷 전환이 왜 안 먹어—!"},{"t":"l","s":"료","c":"료","x":"「소용없어요. 조정실 권한은 이미 이쪽. …당신은 지금부터, 시청자예요.」"},{"t":"l","s":"벨","c":"메이","x":"시청자아?! 이 몸이?! 웃기지 마, 이 탑에서 화면을 '보는' 건 딴 놈들 일이고, 이 몸은 '보여 주는' 쪽—"},{"t":"d","g":"표정","x":"벨 = 말이 끊긴다 — 화면 속, 치코링이 넘어진다"},{"t":"l","s":"벨","c":"메이","x":"……어."},{"t":"n","x":"화면 속에서, 유령불의 소녀가 넘어졌다. 편집이라면 잘렸을 3초— 넘어진 채 숨을 고르고, 다시 일어나는 3초가, 그대로 나갔다."},{"t":"l","s":"벨","c":"메이","x":"……왜 안 잘라. 지금 거, 방송 사고잖아. 넘어졌잖아. 못 봐 주겠잖아, 저런 거—"},{"t":"l","s":"주군","c":"주군","x":"그런데— 눈을 못 떼고 있군. 너도."},{"t":"l","s":"벨","c":"메이","x":"……!"},{"t":"l","s":"주군","c":"주군","x":"하나 묻지. 네가 편집으로 잘라낸 필름은, 전부 어디로 갔지."},{"t":"l","s":"벨","c":"메이","x":"……하? 필름?"},{"t":"l","s":"주군","c":"주군","x":"넘어진 아이가 일어나는 부분. 우는 사람이 눈물을 닦는 부분. 네가 매번 잘라낸 건— 늘, '그다음'이더군."},{"t":"l","s":"벨","c":"메이","x":"……시끄러워. '그다음' 같은 건, 시청률이 안 나온다구."},{"t":"d","g":"표정","x":"벨 = 모니터를 본다 → 격앙"},{"t":"l","s":"벨","c":"메이","x":"……뭐야, 이거. 이런 걸 누가 봐. 실패 장면도 안 자르고, 우는 것도 안 자르고— 이런 편집도 안 된 걸, 누가……!"},{"t":"d","g":"이펙트","x":"벨의 감정 폭주 — 송출탑 전체의 결계가 검붉게 뒤틀리기 시작"},{"t":"d","g":"SE","x":"철골이 우는 소리"},{"t":"l","s":"쿠로코(통신)","c":"쿠로코","x":"「우와, 뭐야 이 진동—! 4층 철골이 울고 있어! 지지대 박으러 간다!」"},{"t":"l","s":"료","c":"료","x":"「쿠로코 씨, 혼자는 무리예요— 서쪽 계단, 이미 뒤틀렸어요!」"},{"t":"l","s":"쿠로코(통신)","c":"쿠로코","x":"「무리가 아니라 일이야, 이건! 각목 하나로 버티는 게 목수의 긍지라고!」"},{"t":"d","g":"표정","x":"료(통신) = 다급"},{"t":"l","s":"료","c":"료","x":"「탑 하층부, 결계 폭주! 철골이 버티는 건 3분이에요— 안에 관리 직원들이 있어요!」"},{"t":"d","g":"표정","x":"치코링 = 즉시 몸을 돌린다"},{"t":"l","s":"치코링","c":"치코","x":"히, 히땅! 아래층!"},{"t":"d","g":"표정","x":"히땅 = 이미 낙하 중"},{"t":"l","s":"히땅","c":"히스이","x":"— 폭풍, 잔업 개시."},{"t":"l","s":"료","c":"료","x":"「치코링 씨는 2층 사무실— 세 명 남았어요! 히땅 씨는 지하 주차장, 경비원 한 명!」"},{"t":"l","s":"히땅","c":"히스이","x":"— 접수."},{"t":"l","s":"치코링","c":"치코","x":"이, 이쪽이에요! 소, 손 잡으세요! 발밑은, 제 불빛만 밟고……!"},{"t":"l","s":"치코링","c":"치코","x":"괘, 괜찮아요! 무, 무섭죠! 저도 무서워요! 그, 그러니까— 같이 달려요!"},{"t":"l","s":"료","c":"료","x":"「2층 클리어— 다음, 계단 왼쪽으로! 오른쪽은 무너져요!」"},{"t":"l","s":"치코링","c":"치코","x":"네, 넵……! 외, 왼쪽……!"},{"t":"l","s":"료","c":"료","x":"「잔해 낙하, 동쪽! — 히땅 씨!」"},{"t":"l","s":"히땅","c":"히스이","x":"봤어. …선풍, 우산 대신."},{"t":"l","s":"쿠로코(통신)","c":"쿠로코","x":"「지지대 3번, 들어갔다! 버텨라아……!」"},{"t":"l","s":"료","c":"료","x":"「남은 시간 90초— 치코링 씨, 마지막 한 명은?!」"},{"t":"l","s":"치코링","c":"치코","x":"어, 업었어요! 다, 달릴게요……!"},{"t":"l","s":"히땅","c":"히스이","x":"……무거워도, 말 안 함."},{"t":"d","g":"표정","x":"벨 = 그 화면에서, 눈을 떼지 못한다"},{"t":"l","s":"벨","c":"메이","x":"……바보 아냐? 남의 성이 무너지는데, 왜…… 왜 남의 직원을 구하러, 뛰어들어……."},{"t":"n","x":"두 아이가 무너지는 하층부에서 사람들을 실어 날랐다. 유령불이 길을 밝히고, 선풍이 낙하물을 걷어냈다."},{"t":"l","s":"료","c":"료","x":"「30초— 출구 확보…… 나왔다!」"},{"t":"d","g":"표정","x":"료(통신) = 안도"},{"t":"l","s":"료","c":"료","x":"「하층부, 전원 대피 완료! …그리고 지금— 이 화면, 도시 전체가 보고 있어요.」"},{"t":"l","s":"쿠로코(통신)","c":"쿠로코","x":"「……후우, 후우. 살았다아. — 야, 이 탑 주인! 이딴 날림 골조로 용케 버텼구나! 다음엔 내가 다시 지어 준다!」"},{"t":"l","s":"벨","c":"메이","x":"…………."},{"t":"n","x":"그 광경이— 그대로, 전 채널에 나가고 있었다. 편집 없이."},{"t":"d","g":"표정","x":"벨 = 무너진 하층부의 화면을 본다 — 격앙이, 갈 곳을 잃는다"},{"t":"l","s":"벨","c":"메이","x":"……뭐야. 저 녀석들, 카메라를 신경도 안 쓰잖아. 각도도 조명도 엉망이고, 대사 한 줄 없고— 그런데, 왜……."},{"t":"l","s":"벨","c":"메이","x":"(작게) ……잔업, 이라니. 출연료도, 없으면서."},{"t":"n","x":"그때, 화면 아래의 광장에서 — 노랫소리가 올라왔다."}]},{"id":"p1-e4-s1","title":"15-2. 송출탑 — 「나를 봐 줘」","blocks":[{"t":"d","g":"배경","x":"동일 — 모니터 너머로 광장의 인파가 보인다"},{"t":"d","g":"BGM","x":"마시로의 노래 (전파를 타고 확산 — 도시 전체 스케일로)"},{"t":"d","g":"SE","x":"광장의 합창 (하나둘 따라 부르기 시작)"},{"t":"n","x":"광장의 마시로가, 카메라를 향해 노래하고 있었다. 그 목소리가 뒤집힌 회선을 타고— 처음으로, 도시 전체에 닿았다."},{"t":"d","g":"표정","x":"마시로(화면 너머) = 노래의 끝자락에서, 나직이"},{"t":"l","s":"마시로","c":"마시로","x":"……무서운 밤일수록, 노래는 필요하니까요. — 한 곡 더, 불러도 될까요."},{"t":"d","g":"SE","x":"광장의 박수 — 크지 않은, 그러나 진짜인 박수"},{"t":"l","s":"료","c":"료","x":"「……신기하네요. 소리 데이터로는, 그냥 노래인데. 수치에 안 잡히는 뭔가가— 회선을 타고 있어요.」"},{"t":"n","x":"화면 앞의 사람들이 걸음을 멈췄다. 누군가는 웃었고, 누군가는 울었다."},{"t":"d","g":"표정","x":"벨 = 모니터를 하나하나 훑는다"},{"t":"l","s":"벨","c":"메이","x":"……어이, 카메라. 줌 당겨. …광장의 저 녀석들, 왜 화면 앞을 안 떠나. 노래 하나잖아. 효과음도, 자막도, 편집도 없는— 그냥, 노래잖아."},{"t":"d","g":"표정","x":"벨 = 뒷걸음질"},{"t":"l","s":"벨","c":"메이","x":"……뭐야. 뭐야, 이거. 다들, 왜 웃어. 왜 우는 거야."},{"t":"l","s":"벨","c":"메이","x":"이 몸은 십 년을 떠들었어! 매일 밤, 목이 쉬도록! 무서운 얘기도, 웃기는 얘기도, 전부 일등으로 물어 왔다구! 그런데— 그런데, 노래 한 곡한테……!"},{"t":"d","g":"이펙트","x":"검붉은 결계가 명멸한다 — 그러나, 이미 힘이 없다"},{"t":"l","s":"료","c":"료","x":"「결계 출력…… 오히려 떨어지고 있어요. 폭주가 아니라— 이건, 우는 것에 가까워요.」"},{"t":"d","g":"표정","x":"벨 = 모니터를 두드린다"},{"t":"l","s":"벨","c":"메이","x":"봐. 봐 봐. 나를 봐. 채널 고정. 채널 고정이라구. …왜 아무도, 이쪽을……."},{"t":"n","x":"'봐'가— 방송의 말에서, 아이의 말로 무너져 내리고 있었다."},{"t":"d","g":"표정","x":"벨 = 목소리가 갈라진다"},{"t":"l","s":"벨","c":"메이","x":"나를 봐. 내 방송을 봐. 나는— 나는 이렇게 크게 떠들고 있는데, 왜, 아무도……!"},{"t":"d","g":"표정","x":"벨 = 무너지듯"},{"t":"l","s":"벨","c":"메이","x":"나를…… 봐 줘……."},{"t":"d","g":"표정","x":"벨 = 제 목소리에, 제가 놀란다"},{"t":"l","s":"벨","c":"메이","x":"……지금 거, 편집. 컷. 방금 건, 컷이야. …방송 사고니까, 잊어……."},{"t":"n","x":"[갈채의 소녀]. — 도시의 갈채를 한 몸에 받던 소녀는, 갈채를 잃는 것이 시드는 것보다 무서웠다."},{"t":"n","x":"그래서 갈채 대신 풍문을 택했다. 미움이라도, 시선은 시선이니까."},{"t":"l","s":"주군","c":"주군","x":"— [갈채의 소녀]."},{"t":"d","g":"표정","x":"벨 = 어깨가 떨린다"},{"t":"l","s":"벨","c":"메이","x":"……그 이름, 부르지 마. …그 이름으로 불리던 시절의 이 몸은, 진짜로 일등이었단 말야. 무대 위에서 손을 흔들면, 광장이 전부 손을 흔들었어. …그게 어느 날, 뚝. 조명 떨어지듯이— 뚝."},{"t":"l","s":"벨","c":"메이","x":"알아? 갈채가 끊긴 무대에 혼자 서 있는 기분. …정적이, 살갗을 벗겨 가. 그래서 틀었어. 볼륨을. 미움이든 뭐든— 소리가 나는 쪽으로."},{"t":"l","s":"주군","c":"주군","x":"(허세가 아니었다. 생존이었다. — 야유조차 조명이라고 부르는 아이에게, 이 도시는 한 번이라도 박수를 돌려준 적이 있었나.)","m":1},{"t":"n","x":"그때— 계단을 전부 뛰어 올라온 발소리가, 조정실 문을 밀었다. 그을음투성이의, 작은 유령불이었다."},{"t":"d","g":"표정","x":"치코링(화면 속→실제로 탑에 도착) = 숨을 고르며"},{"t":"l","s":"치코링","c":"치코","x":"하아, 하아…… 벨, 씨……!"},{"t":"d","g":"표정","x":"벨 = 억지로, 방송의 얼굴을 주워 쓴다"},{"t":"l","s":"벨","c":"메이","x":"……하. 주연 등장이네. 마지막 신에, 딱 맞춰서."},{"t":"d","g":"표정","x":"벨 = 반사적으로 소리친다"},{"t":"l","s":"벨","c":"메이","x":"오, 오지 마! 너까지 나를 비웃으러—"},{"t":"l","s":"치코링","c":"치코","x":"비, 비웃으러 온 거, 아니에요!"},{"t":"l","s":"벨","c":"메이","x":"거짓말. 다들 그래. 카메라 뒤에서는 다들 웃는다구. 저 녀석 또 떠든다, 또 시끄럽다— 그, 그러니까 이쪽이 먼저 웃어 주는 거야. 우스운 꼴이 되기 전에, 먼저……!"},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다, 모니터를 가리킨다"},{"t":"l","s":"치코링","c":"치코","x":"보, 보고 있어요!"},{"t":"d","g":"표정","x":"벨 = 멈춘다"},{"t":"l","s":"벨","c":"메이","x":"……에?"},{"t":"l","s":"치코링","c":"치코","x":"도, 도시가— 전부, 보고 있어요! 벨 씨가 세운 탑에서, 벨 씨가 깐 회선으로……!"},{"t":"l","s":"벨","c":"메이","x":"그, 그건 이 몸의 방송이 아니잖아! 저건 그 가수 애랑, 너희들—"},{"t":"d","g":"표정","x":"치코링 = 필사적으로"},{"t":"l","s":"치코링","c":"치코","x":"벨 씨가 진짜로 보여 주고 싶었던 거— 사, 사람들이 뭔가를 보고, 웃거나 우는 거…… 지금, 모두가 하고 있잖아요! 벨 씨의 화면으로! 벨 씨의 전파로!"},{"t":"l","s":"치코링","c":"치코","x":"그, 그러니까 이건— 벨 씨의 방송이에요! 시, 시청률, 역대 최고예요……!"},{"t":"d","g":"표정","x":"벨 = 반박하려고 입을 연다 — 말이, 나오지 않는다"},{"t":"l","s":"벨","c":"메이","x":"아니야, 저건…… 이 몸의 기획이 아니고, 콘티도 없고, 큐시트도……."},{"t":"l","s":"치코링","c":"치코","x":"어, 없어도, 방송이에요. 버, 벨 씨가 그랬잖아요. 조회수는, 정직하다고. — 지, 지금 이 도시에서 제일 정직한 화면이, 이거예요."},{"t":"l","s":"벨","c":"메이","x":"……하. 이 몸의 말을, 그렇게 돌려주기야?"},{"t":"d","g":"SE","x":"정적 → 광장의 노래가 탑 안까지 스며든다"},{"t":"d","g":"표정","x":"벨 = 모니터를 본다 — 오래"},{"t":"l","s":"벨","c":"메이","x":"……………하, 뭐야 그거. 역대 최고라니. …그런 말, 반칙이잖아."},{"t":"d","g":"표정","x":"벨 = 천천히, 조정석에 앉는다 — 십 년 만에, 등받이에 등을 붙인다"},{"t":"l","s":"벨","c":"메이","x":"……저 화면, 조명이 별로네. 노을 역광이고. …그런데, 왜 이렇게…… 눈이 부시냐."},{"t":"n","x":"마녀는 카메라를 내려놓았다. 그리고 처음으로— 자기가 만든 화면을, 시청자의 얼굴로 바라보았다."},{"t":"d","g":"이펙트","x":"검붉은 결계가 걷히고 — 벨의 몸이, 화면의 빛 속으로 풀리기 시작한다"},{"t":"d","g":"표정","x":"치코링 = 달려온다"},{"t":"l","s":"치코링","c":"치코","x":"벨 씨……! 아, 안 돼요, 아직—!"},{"t":"l","s":"벨","c":"메이","x":"하이하이~ 울지 않는다, 울지 않는다. …신입, 성당 끝나고 나온 얼굴, 이 몸의 카메라가 봤다구. 울었지, 너?"},{"t":"l","s":"치코링","c":"치코","x":"그, 그럼…… 아, 알잖아요……! 이, 이게, 어떻게 되는 건지……!"},{"t":"l","s":"벨","c":"메이","x":"응. — 알아. 알고, 내려놨어."},{"t":"d","g":"표정","x":"벨 = 자기 손을 본다 → 쓴웃음"},{"t":"l","s":"벨","c":"메이","x":"……아~ 그렇구나. 성당의 장미 애랑, 같은 거네. 놓으면— 끝. …알고 왔으면서, 왜 우는 건데, 신입."},{"t":"l","s":"치코링","c":"치코","x":"우, 우는 게 아니라…… 우, 우는 거지만……! 벨 씨, 아직 하고 싶은 방송…… 이, 있잖아요……!"},{"t":"l","s":"벨","c":"메이","x":"있지. 잔뜩 있어. 십 년 치 기획이 이 머릿속에— ……하. 이상하네. 지금은, 하나도 안 아까워."},{"t":"l","s":"벨","c":"메이","x":"왜냐면 말야, 방송쟁이의 꿈은 기획서가 아니라— 「누가 봐 주는 화면」이거든. …그게 지금 나가고 있잖아? 이 몸의 탑에서, 이 몸의 전파로. 논스톱, 무편집으로."},{"t":"d","g":"표정","x":"벨 = 떨어져 있던 마이크를 줍는다 — 방송의 얼굴로, 마지막으로"},{"t":"l","s":"벨","c":"메이","x":"아─, 아─. 마이크 테스트. …하이하이~ 여러분, 오래 기다리셨습니다☆ 임시 편성을 알려 드릴게요. 오늘부로 이 채널의 풍문 특집은, 전부 종영! 후속 프로그램은— 지금 보고 계신, 그거."},{"t":"l","s":"벨","c":"메이","x":"그리고, 정정 방송이 하나. ……'안 떨어지는 별' 특집은— 편집이 나빴어. 그 별은, 떨어진 게 아니라…… 끝까지, 날았던 거야. 이 몸이 잘못 잘랐어. — 정정, 이상☆"},{"t":"l","s":"치코링","c":"치코","x":"벨, 씨……."},{"t":"l","s":"벨","c":"메이","x":"마지막 큐는 스스로 내는 거야. 그게, 프로☆"},{"t":"d","g":"표정","x":"벨 = 마지막으로, 손가락으로 브이"},{"t":"l","s":"벨","c":"메이","x":"울지 마. 화면 밖에서 우는 얼굴은— 아무도 편집 못 해 주니까."},{"t":"d","g":"SE","x":"광장의 합창이 — 한층 커진다, 탑을 감싸듯"},{"t":"d","g":"표정","x":"벨 = 모니터의 웃고 우는 사람들을 보며"},{"t":"l","s":"벨","c":"메이","x":"……하, 최고 시청률이네. 마지막 방송치고는— 나쁘지 않아☆"},{"t":"d","g":"이펙트","x":"마녀, 빛의 노이즈가 되어 화면 속으로 흩어진다 — 소멸"},{"t":"d","g":"SE","x":"광장의 노래만 남는다"},{"t":"d","g":"표정","x":"치코링 = 빈 조정석 앞 — 마이크만 남아 있다"},{"t":"l","s":"치코링","c":"치코","x":"……벨 씨는, 나쁜 사람이었는데…… 나, 나쁜 방송만, 했는데……. 왜, 왜, 이렇게……."},{"t":"d","g":"표정","x":"치코링 = 마이크를 꼭 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"……자, 잘 봤습니다……. 마, 마지막 방송…… 최고였어요……."},{"t":"d","g":"표정","x":"히땅 = 조정실 문가에, 어느새"},{"t":"l","s":"히땅","c":"히스이","x":"……끝났어?"},{"t":"l","s":"치코링","c":"치코","x":"……응. …마, 마지막 방송, 히땅도 봤어……?"},{"t":"l","s":"히땅","c":"히스이","x":"봤어. — 나쁘지 않았음."},{"t":"d","g":"표정","x":"료(통신) = 무전 — 한참 만에"},{"t":"l","s":"료","c":"료","x":"「……계약자 씨. 병원에서 연락이에요. — 깨어났대요. '유성', 눈 떴대요.」"},{"t":"d","g":"표정","x":"치코링 = 눈물을 닦지도 못한 채, 웃는다"},{"t":"l","s":"치코링","c":"치코","x":"……!! 쥬, 쥬리땅 씨가……!"},{"t":"d","g":"배경","x":"(짧게) 병실 — 창가의 노을"},{"t":"d","g":"표정","x":"치코 = 병실 문을 열다 만 채, 얼어붙는다"},{"t":"l","s":"치코","c":"치코","x":"……쥬…… 쥬리땅, 씨……."},{"t":"d","g":"표정","x":"쥬리 = 침대에서, 힘없이 그러나 웃으며"},{"t":"l","s":"쥬리","c":"쥬리","x":"……아, 앗찌다. 치코링도…… 헤헤. …유성은 말야, 떨어져도…… 별이더라?"},{"t":"d","g":"표정","x":"치코 = 침대로 달려간다 — 웃음과 울음이 반반"},{"t":"l","s":"치코","c":"치코","x":"……네…… 네에……! 벼, 별이에요……! 쥬리땅 씨는, 계속…… 계속, 별이었어요……!"},{"t":"d","g":"표정","x":"쥬리 = 힘없이, 고개를 갸웃"},{"t":"l","s":"쥬리","c":"쥬리","x":"……에헤. 왜 울어, 치코링. …내가 자는 사이에, 무슨 일…… 있었어?"},{"t":"d","g":"표정","x":"치코 = 웃으려고 한다 — 절반쯤, 실패한다"},{"t":"l","s":"치코","c":"치코","x":"……아, 아무것도…… 아무것도, 아니에요……. 그, 그냥…… 다녀왔습니다, 예요……."},{"t":"l","s":"쥬리","c":"쥬리","x":"……그래애. 다녀왔어? …어서 와아……."},{"t":"d","g":"표정","x":"쥬리 = 치코의 손을 더듬어 잡는다"},{"t":"l","s":"쥬리","c":"쥬리","x":"치코링, 손…… 까끌까끌해. 어디서 이렇게…… 다쳤어어……."},{"t":"l","s":"치코","c":"치코","x":"이, 이건…… 자, 장미 가시에, 조금……."},{"t":"n","x":"아이는 침대 옆에서, 웃는 얼굴과 우는 얼굴을 반반씩 하고 있었다. 오늘 배운 작별과, 오늘 돌아온 사람을— 같은 손으로 안은 채."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………한쪽에서는 별이 돌아오고, 한쪽에서는 꽃이 진다. 이 세계는 기쁨과 상실을— 꼭 같은 밤에 배달하는군.)","m":1},{"t":"n","x":"팀이 돌아오기 시작했다. 하나씩. 저마다의 속도로 — 저마다의 작별을 안은 채. 제일 먼저 돌아온 발소리는, 제일 오래 혼자 서 있던 사람의 것이었다."},{"t":"n","x":"하늘의 하얀 실금은— 이제 도시의 절반을 덮고 있었다."}]}]},{"id":"p1-e5","title":"16화 「찢긴 마지막 줄」","scenes":[{"id":"p1-e5-s0","title":"16-1. 하숙방 — 「출구의 흔적」","blocks":[{"t":"d","g":"배경","x":"주군의 하숙방 — 벽 한 면에 자료·지도·필사본이 빼곡하다"},{"t":"d","g":"BGM","x":"미니멀 (긴장 변주)"},{"t":"d","g":"SE","x":"종이 넘기는 소리"},{"t":"n","x":"송출탑의 밤으로부터, 며칠. 아이들은 벨의 마지막 방송을 아직 입에 올리지 못했다. — 애도에는, 시간이 걸린다."},{"t":"n","x":"낮에는 아이들이 도시를 지켰고, 밤에는 내가 문서를 팠다."},{"t":"n","x":"도서관의 향토지, 골동품상의 낡은 장부, 료가 긁어 온 옛 기록— 그리고 계약 원문의 필사본."},{"t":"d","g":"SE","x":"책장 넘기는 소리 — 멎는다"},{"t":"d","g":"표정","x":"주군 = 펜 끝으로 장부 한 줄을 짚는다"},{"t":"l","s":"주군","c":"주군","x":"(향토지 제3권, 낙장. 장부는 물에 번져서 연대가 안 읽힌다. …이 도시의 기록은, 이상할 정도로 '오래된 쪽'만 이가 빠져 있다.)","m":1},{"t":"d","g":"표정","x":"와카 = 방석 위, 평소보다 조용하다"},{"t":"l","s":"와카","c":"와카","x":"……계약자. 오늘, 애들은?"},{"t":"l","s":"주군","c":"주군","x":"치코는 순찰. 히스이가 붙었다. …다들, 필요 이상으로 바쁘게 지내는 중이지. — 그런 시기다."},{"t":"d","g":"표정","x":"타마 = 꼬리를 만다"},{"t":"l","s":"타마","c":"타마","x":"……탑, 이제 조용하대~. …너무, 조용하대."},{"t":"d","g":"표정","x":"와카 = 귀를 접는다"},{"t":"l","s":"와카","c":"와카","x":"그 애 방송, 시끄러웠는데. …없어지니까 알겠네. 시끄러운 게 얼마나 큰 자리였는지."},{"t":"d","g":"표정","x":"타마 = 작게"},{"t":"l","s":"타마","c":"타마","x":"……입회인은, 작별 담당이 아닌데~. …이럴 때 무슨 말 하는지, 배운 적 없어~."},{"t":"d","g":"표정","x":"주군 = 펜을 든 채, 잠깐 멈춘다"},{"t":"l","s":"주군","c":"주군","x":"말은 안 배워도 된다. 조용히 옆에 있는 것도— 말이다. …자리가 비어 있는 동안은, 비워 두는 게 예의고."},{"t":"d","g":"SE","x":"현관 — 노크 두 번"},{"t":"d","g":"표정","x":"료 = 문틈으로, 종이 꾸러미부터 내민다"},{"t":"l","s":"료","c":"료","x":"배달이에요. 등기소 이전 기록, 시계탑 준공 이전 지도 두 장. …그리고 부탁한 신문 축쇄판, 제일 오래된 해."},{"t":"l","s":"주군","c":"주군","x":"……밤 세 시다. 잠은."},{"t":"d","g":"표정","x":"료 = 무표정"},{"t":"l","s":"료","c":"료","x":"안 와요. 원래도 안 왔는데, 요즘은 더 안 와요. …그러니까 이건 불면증의 유효 활용이에요."},{"t":"d","g":"표정","x":"주군 = 꾸러미를 받아 든다"},{"t":"l","s":"주군","c":"주군","x":"유효 활용이라. …도서관 대출 한도는, 진작에 넘었을 텐데."},{"t":"d","g":"표정","x":"료 = 안경을 밀어 올린다"},{"t":"l","s":"료","c":"료","x":"사서랑 협상했어요. 조건은 '반납 기한 엄수'. — 그러니까 그거, 구기지 말아요. 밑줄도 금지."},{"t":"l","s":"주군","c":"주군","x":"……고맙다. 다음 목록은 책상 위에 있다."},{"t":"d","g":"표정","x":"료 = 방 안의 벽 — 자료로 뒤덮인 벽을 본다"},{"t":"l","s":"료","c":"료","x":"……벽이, 지난주보다 두 배네요. 뭘 찾는지는 안 물을게요. 어차피 대답 안 할 거고."},{"t":"l","s":"료","c":"료","x":"다만— 찾으면 공유. 거래는 아직 유효하니까."},{"t":"l","s":"주군","c":"주군","x":"알고 있다. …외지인의 눈은, 아직 빌리는 중이다."},{"t":"d","g":"표정","x":"료 = 등을 돌리다가, 문가에서"},{"t":"l","s":"료","c":"료","x":"……그 애 방송 말인데요. 마지막 거. 나, 아직 한 번도 다시 못 틀었어요. …계약자 씨는요?"},{"t":"d","g":"표정","x":"주군 = 잠깐 침묵"},{"t":"l","s":"주군","c":"주군","x":"……나도다."},{"t":"d","g":"표정","x":"료 = 끄덕, 그대로 나간다"},{"t":"l","s":"료","c":"료","x":"……그럼 됐어요. 어른도 못 트는 거면— 내가 못 트는 것도, 정상이네요."},{"t":"d","g":"SE","x":"문이 닫힌다"},{"t":"d","g":"표정","x":"와카 = 문 쪽을 보며"},{"t":"l","s":"와카","c":"와카","x":"……저 애도, 안 자고 버티는 거네. 어른도 아니면서."},{"t":"l","s":"주군","c":"주군","x":"어른 흉내로 버티는 중이지. — 말리진 않는다. 지금 저 아이한테서 '할 일'을 뺏으면, 남는 건 빈 방과 그 방송뿐이니까."},{"t":"n","x":"발소리가 계단을 내려가고 나서도, 나는 한동안 문 쪽을 보고 있었다. 애도에는 시간이 걸린다. — 어른에게도, 똑같이."},{"t":"d","g":"표정","x":"주군 = 료가 두고 간 지도를 벽에 핀으로 고정한다"},{"t":"l","s":"주군","c":"주군","x":"(준공 이전의 지도. — 시계탑 자리가 비어 있고, 성당 자리도 비어 있다. 그런데 저 골동품상이 있던 골목만은…… 가게는 지도에 없어도, 길의 모양이 지금과 똑같군.)","m":1},{"t":"d","g":"표정","x":"와카 = 지도를 곁눈질"},{"t":"l","s":"와카","c":"와카","x":"……뭔가, 찾았어?"},{"t":"l","s":"주군","c":"주군","x":"아직 모른다. 다만— 이 도시에서 변하지 않은 장소가 하나뿐이라는 건, 기억해 둘 만하지."},{"t":"d","g":"표정","x":"주군 = 필사본을 노려본다"},{"t":"l","s":"주군","c":"주군","x":"(조항 칠. 개화에 관하여. 조항 팔. 대가에 관하여. …그리고 찢긴 마지막 줄. 앞뒤 문맥상 여기 들어갈 말은— '해지에 관하여'뿐이다.)","m":1},{"t":"d","g":"표정","x":"주군 = 필사본 옆에 축쇄판을 편다"},{"t":"l","s":"주군","c":"주군","x":"(대조한다. 향토지의 연표, 등기의 연대, 축쇄판의 날짜. 이 도시에서 '제일 오래된 것'이 무엇인지— 종이가 말해 주지 않는다면, 종이의 바깥에서 좁혀 간다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(시계탑, 준공 연도 불명. 성당, 개축 기록만 남고 원 기록은 소실. 골동품상— …지도에 아예 없다. 이 도시는, 자기 나이를 숨기는 도시다.)","m":1},{"t":"d","g":"표정","x":"타마 = 필사본 위를 아장아장 걷는다"},{"t":"l","s":"타마","c":"타마","x":"계약자~ 그거, 벌써 백 번은 읽었어~."},{"t":"l","s":"주군","c":"주군","x":"백한 번째에 보이는 게 있다."},{"t":"d","g":"표정","x":"와카 = 타마를 끌어 내리며"},{"t":"l","s":"와카","c":"와카","x":"없으면?"},{"t":"l","s":"주군","c":"주군","x":"백두 번째를 읽지."},{"t":"d","g":"표정","x":"와카 = 벽의 지도를 올려다본다"},{"t":"l","s":"와카","c":"와카","x":"……그래서. 뭐라도, 나왔어?"},{"t":"d","g":"표정","x":"주군 = 펜을 돌린다"},{"t":"l","s":"주군","c":"주군","x":"나온 건 '없다'는 사실뿐이다. — 다만, 없는 것에도 모양이 있지. 전부 같은 시대의 기록만 없다. 누가 지운 것처럼."},{"t":"d","g":"표정","x":"와카 = 목소리가 낮아진다"},{"t":"l","s":"와카","c":"와카","x":"……지웠다면, 누가?"},{"t":"l","s":"주군","c":"주군","x":"그걸 모르니까 파는 거다. 기록을 지운 손과, 마지막 줄을 찢은 손. — 같은 손이라고 단정하긴 이르지만, 겹쳐 보이는 건 어쩔 수 없군."},{"t":"d","g":"표정","x":"타마 = 축쇄판 위에 엎드린다"},{"t":"l","s":"타마","c":"타마","x":"계약자~ 이 신문, 곰팡이 냄새나~."},{"t":"l","s":"주군","c":"주군","x":"백 년 묵은 냄새다. 참아라. — 오래된 종이는, 오래된 것끼리 이어져 있는 법이지."},{"t":"d","g":"표정","x":"와카 = 책상 끝에서 (얌전히)"},{"t":"l","s":"와카","c":"와카","x":"……계약자는, 무섭지 않아?"},{"t":"l","s":"주군","c":"주군","x":"뭐가 말이냐."},{"t":"d","g":"표정","x":"와카 = 드물게, 조용한 목소리"},{"t":"l","s":"와카","c":"와카","x":"그 줄. …찾아서 읽었는데, 만약 '해지 같은 건 없다'라고 적혀 있으면 어떡해?"},{"t":"d","g":"표정","x":"주군 = 펜을 멈추지 않는다"},{"t":"l","s":"주군","c":"주군","x":"그럼 그때 절망하지. 지금 미리 절망해 두는 건, 시간 낭비다."},{"t":"d","g":"표정","x":"와카 = 잠깐 입을 다문다"},{"t":"l","s":"와카","c":"와카","x":"……절망을, 예약해 두는 어른은 처음 봐."},{"t":"l","s":"주군","c":"주군","x":"예약이 아니라 후불이다. 절망은 미리 내는 게 아니야. — 문 앞에 도착한 날, 그때 치른다."},{"t":"d","g":"표정","x":"타마 = 갸웃"},{"t":"l","s":"타마","c":"타마","x":"……어른의 셈법이야~?"},{"t":"l","s":"주군","c":"주군","x":"어른의 버릇이다. 좋은 버릇은 아니지."},{"t":"d","g":"표정","x":"와카 = 타마와 눈을 마주친다"},{"t":"l","s":"와카","c":"와카","x":"(……이상한 어른이야, 역시.)"},{"t":"d","g":"표정","x":"타마 = 끄덕"},{"t":"l","s":"타마","c":"타마","x":"(이상해~.)"},{"t":"d","g":"SE","x":"창문 — 톡, 톡"},{"t":"n","x":"창밖, 전선 위에 황혼빛 실루엣이 앉아 있었다. 언제부터 봤는지는— 묻지 않기로 했다."},{"t":"d","g":"표정","x":"[황혼] = 창틀에 걸터앉는다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……그 종이, 태우지 그래?"},{"t":"l","s":"주군","c":"주군","x":"갑자기 나타나서 하는 말이 그건가."},{"t":"d","g":"표정","x":"[황혼] = 대답 대신, 방 안의 자료를 훑어본다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"소녀도, 마녀도, 계약도— 전부 없던 일로 하면 편할 텐데. 그 종이가 이 세계의 심장이야. 태우면, 전부 끝나."},{"t":"d","g":"표정","x":"주군 = 의자를 창 쪽으로 반쯤 돌린다"},{"t":"l","s":"주군","c":"주군","x":"태우면— 저 아이들은 어떻게 되지."},{"t":"d","g":"표정","x":"[황혼] = 어깨를 으쓱"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"몰라. …알 필요 있어? 끝나는데."},{"t":"l","s":"주군","c":"주군","x":"모르는 채로, 끝을 권하는 건가."},{"t":"d","g":"표정","x":"[황혼] = 시선을 피하지 않는다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"아는 채로 계속하게 두는 것보단 나아. — 어른의 '조금만 더'는, 늘 늦으니까."},{"t":"d","g":"표정","x":"주군 = 펜을 내려놓는다"},{"t":"l","s":"주군","c":"주군","x":"끝나는 것과 풀리는 것은 다르다. 태우면 저 아이들의 힘도, 기억도, 함께 타겠지. — 나는 출구를 찾는 거지, 방화범이 되려는 게 아니야."},{"t":"d","g":"표정","x":"[황혼] = 픽, 웃음기 없는 웃음"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"방화범. …그거, 나쁜 이름이야? 감옥은 불타는 집보단 안전한데."},{"t":"l","s":"주군","c":"주군","x":"감옥이 안전한 건, 문이 잠겨 있어서다. 나는 잠긴 문을 안전이라고 부르지 않아. — 열리는 문을 만든다. 그게 어른의 일이다."},{"t":"d","g":"표정","x":"[황혼] = 잠깐, 아주 잠깐 말이 없다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……그 말 하는 어른, 많이 봤어. 끝까지 한 어른은, 못 봤고."},{"t":"d","g":"표정","x":"주군 = 시선을 피하지 않는다"},{"t":"l","s":"주군","c":"주군","x":"그럼 잘 봐 둬라. 표본이 하나는 있어야, 통계가 시작되지."},{"t":"d","g":"표정","x":"[황혼] = 잠깐 침묵 → 픽"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……이상한 어른."}]},{"id":"p1-e5-s1","title":"16-2. 하숙방 — 「피기 전에 잘린 쪽」","blocks":[{"t":"d","g":"배경","x":"동일 — 달이 구름에 가린다"},{"t":"d","g":"BGM","x":"낯선 선율 (12화 변주, 더 여리게)"},{"t":"d","g":"SE","x":"밤바람"},{"t":"d","g":"표정","x":"주군 = 정면으로 묻는다"},{"t":"l","s":"주군","c":"주군","x":"너는 뭐냐. 소녀도 마녀도 아니고, 정원의 명부에도 없다. 어느 쪽 하늘에서 온 거지."},{"t":"d","g":"표정","x":"[황혼] = 무릎을 안는다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……어느 쪽도."},{"t":"d","g":"표정","x":"주군 = 천천히"},{"t":"l","s":"주군","c":"주군","x":"어느 쪽도 아닌 자가, 만개를 알고, 정원을 알고, 계약서의 사정까지 알고 있다."},{"t":"d","g":"표정","x":"[황혼] = 무릎에 턱을 얹는다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……아는 게 죄야?"},{"t":"l","s":"주군","c":"주군","x":"죄가 아니라 단서다. 아는 자는, 어딘가에서 배웠다는 뜻이니까."},{"t":"l","s":"[황혼]","c":"[황혼]","x":"나는— 피기 전에, 잘린 쪽이야."},{"t":"d","g":"표정","x":"주군 = 숨을 멈춘다"},{"t":"l","s":"주군","c":"주군","x":"(피기 전에, 잘렸다……? 만개 전의 소녀를 자르는 건, 절화의 방식에도 없다. 그건— 시스템 바깥의 이야기다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(……그리고, 그 말을 하는 얼굴이 문제다. 원망도, 슬픔도 아니다. 날씨 얘기를 하는 얼굴이다. — 아이가 자기 상처를 날씨처럼 말하게 되기까지, 대체 얼마나 걸리지.)","m":1},{"t":"l","s":"주군","c":"주군","x":"……잘랐다는 건, 누구지."},{"t":"d","g":"표정","x":"[황혼] = 고개를 숙인 채"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……."},{"t":"l","s":"주군","c":"주군","x":"(……저 아이는, 어느 쪽의 말로 말하는 거지.)","m":1},{"t":"d","g":"표정","x":"[황혼] = 대답하지 않는다 — 다만, 무릎을 안은 팔에 힘이 들어간다"},{"t":"d","g":"표정","x":"주군 = 한 박자, 물러선다"},{"t":"l","s":"주군","c":"주군","x":"……자세히 말해 줄 생각은."},{"t":"d","g":"표정","x":"[황혼] = 고개를 젓는다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"없어. 아직은. …그쪽이 그 줄을 진심으로 찾는지, 조금 더 볼 거니까."},{"t":"d","g":"표정","x":"[황혼] = 창틀에서 일어나며, 툭"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"— 힌트 하나. 찢긴 건 종이지, 말이 아니야."},{"t":"l","s":"주군","c":"주군","x":"……무슨 뜻이지."},{"t":"d","g":"표정","x":"[황혼] = 황혼빛에 녹아들며"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"적힌 걸 찢어도, 말해진 건 남아. 그 줄을 '들은' 존재가, 이 도시 어딘가에 아직 있어. …제일 오래된 물건 곁을 뒤져 봐."},{"t":"d","g":"표정","x":"주군 = 되묻는다"},{"t":"l","s":"주군","c":"주군","x":"'들은' 존재— 사람인가."},{"t":"d","g":"표정","x":"[황혼] = 이미 반쯤 빛에 녹아 있다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"……사람이 백 년을 살아?"},{"t":"d","g":"표정","x":"[황혼] = 사라지기 직전, 돌아보지 않은 채"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"그리고— 조심해. 종이를 찢은 '손'은, 아직 이 하늘 어딘가에 있으니까."},{"t":"d","g":"이펙트","x":"소멸"},{"t":"d","g":"SE","x":"방 안 — 정적"},{"t":"d","g":"표정","x":"와카 = 책상 밑에서 고개를 내민다"},{"t":"l","s":"와카","c":"와카","x":"……갔어? 저 애, 올 때마다 심장에 안 좋아. 인형인데."},{"t":"d","g":"표정","x":"타마 = 창틀로 뛰어올라, 코를 킁킁"},{"t":"l","s":"타마","c":"타마","x":"냄새도 없어~. 있던 자리에, 온기도 없어~."},{"t":"d","g":"표정","x":"와카 = 창틀의 빈자리를 본다"},{"t":"l","s":"와카","c":"와카","x":"'피기 전에 잘렸다'…… 계약자, 그런 일이 가능해? 우리 규칙엔 없어. 진짜로 없어."},{"t":"l","s":"주군","c":"주군","x":"규칙에 없는 일이 방금까지 눈앞에 앉아 있었다. — 그렇다면 의심할 건 눈이 아니라, 규칙의 완전성 쪽이지."},{"t":"d","g":"표정","x":"타마 = 시무룩"},{"t":"l","s":"타마","c":"타마","x":"……규칙이 전부인 줄 알았는데~. 우리, 규칙으로 만들어졌는데~."},{"t":"l","s":"주군","c":"주군","x":"만들어진 것들은 만든 쪽의 사정을 모른다. 너희 잘못이 아니야. — 설계도 바깥은, 원래 설계자만 아는 법이다."},{"t":"d","g":"표정","x":"와카 = 목소리를 낮춘다"},{"t":"l","s":"와카","c":"와카","x":"……그리고, 아까 그 말. '종이를 찢은 손이 아직 하늘에 있다'는 거."},{"t":"d","g":"표정","x":"타마 = 꼬리를 만다"},{"t":"l","s":"타마","c":"타마","x":"……우리, 그런 얘기 처음 들었어~. 입회인인데~. 입회인인데도~."},{"t":"d","g":"표정","x":"주군 = 창가에 선 채"},{"t":"l","s":"주군","c":"주군","x":"너희가 모르는 걸 저 녀석이 안다. — 그것 자체가 정보다. 저 아이는 명부 바깥, 계약 바깥의 사정을 알고 있어."},{"t":"l","s":"와카","c":"와카","x":"……계약자. 무섭지 않아? 이번엔 진짜로 묻는 거야. 상대가 '누군지도 모르는 손'이야."},{"t":"d","g":"표정","x":"주군 = 담담하게"},{"t":"l","s":"주군","c":"주군","x":"무섭다. — 그러니까 서두르는 거다. 무서운 걸 무서운 채로 두는 게, 제일 비싸게 먹히니까."},{"t":"d","g":"표정","x":"타마 = 주군의 소매를 톡톡"},{"t":"l","s":"타마","c":"타마","x":"……계약자~. 비싸게 먹혀도~, 죽는 것보단 싸~."},{"t":"l","s":"주군","c":"주군","x":"명언이군. 수첩에 적어 두지."},{"t":"l","s":"주군","c":"주군","x":"(……농으로 받았지만, 등이 서늘한 건 사실이다. 저 아이의 경고에는 과장이 없었다. 겁주려는 자는 목소리를 꾸민다. — 저 목소리는, 그냥 사실을 놓고 갔다.)","m":1},{"t":"d","g":"표정","x":"주군 = 책상으로 돌아온다 — 펜을 든다"},{"t":"l","s":"주군","c":"주군","x":"둘 다, 일어난 김에 머리를 빌리마. — '그 줄을 들은 존재'. 짚이는 게 있나."},{"t":"d","g":"표정","x":"와카 = 갸웃"},{"t":"l","s":"와카","c":"와카","x":"들은 존재…… 계약할 때 소리 내서 읽어 주는 규칙은 없는데. 우리도 원문은 '보는' 거지, '듣는' 게 아니고."},{"t":"l","s":"주군","c":"주군","x":"그래. 하지만 찢기 전의 원문은— 언젠가, 어디선가, 소리로 존재했을 수 있다. 낭독이든, 선서든. …문서란 건 대개, 말이 먼저고 종이가 나중이다."},{"t":"d","g":"표정","x":"타마 = 갸웃갸웃"},{"t":"l","s":"타마","c":"타마","x":"그치만~ 그걸 '들은' 사람이 아직 있으면, 백 살도 넘었을걸~?"},{"t":"l","s":"주군","c":"주군","x":"그 말대로다. 사람은 아니야. — 방금 저 녀석도 그랬지. '사람이 백 년을 사나'라고."},{"t":"d","g":"표정","x":"와카 = 귀가 쫑긋"},{"t":"l","s":"와카","c":"와카","x":"사람이 아닌데, 듣는 것. ……인형?"},{"t":"l","s":"주군","c":"주군","x":"너희는 들은 적 없다고 했다."},{"t":"l","s":"와카","c":"와카","x":"……없어. 유감이지만."},{"t":"d","g":"표정","x":"타마 = 골똘"},{"t":"l","s":"타마","c":"타마","x":"종이도 아니고~ 인형도 아니고~…… 돌? 돌은 오래 살아~."},{"t":"l","s":"주군","c":"주군","x":"돌은 오래 살지만, 듣지 못한다. — 조건은 둘 다다. 오래 살 것. 그리고, 들을 것."},{"t":"d","g":"표정","x":"주군 = 펜이 멎는다"},{"t":"l","s":"주군","c":"주군","x":"(사람이 아니고, 인형도 아니고. 오래 살고— 목소리를 '가지고' 있는 것…….)","m":1},{"t":"d","g":"표정","x":"와카 = 꼬리가 선다"},{"t":"l","s":"와카","c":"와카","x":"……짚이는 거, 있어?"},{"t":"l","s":"주군","c":"주군","x":"아직은 절반만. — 다만, '제일 오래된 물건 곁을 뒤져 봐'라고 했지. 이 도시에서 제일 오래된 물건들이 모이는 곳. 지도에 없고, 장부에 연대가 없고, 이 도시가 생기기 전 물건을 아무렇지 않게 쌓아 두는 가게."},{"t":"d","g":"표정","x":"주군 = 창밖을 오래 본다"},{"t":"l","s":"주군","c":"주군","x":"골동품상. — 그 남자를 만나야겠군."},{"t":"d","g":"표정","x
