t":"d","g":"표정","x":"치코 = 잡은 손에 힘을 준다"},{"t":"l","s":"치코","c":"치코","x":"괘, 괜찮아요. 우는 데…… 나이 같은 거, 없어요."},{"t":"d","g":"표정","x":"치사 = 고개를 숙인다 — 어깨가 떨린다"},{"t":"l","s":"치사","c":"치사","x":"……응. …미안. 조금만…… 이렇게, 있을게. …손, 따뜻하다."},{"t":"d","g":"표정","x":"치사 = 문득, 하늘을 본다"},{"t":"l","s":"치사","c":"치사","x":"……별, 오래간만에 본 것 같아. …이상하다. 매일 밤, 있었을 텐데."},{"t":"d","g":"표정","x":"치코 = 같이 하늘을 본다"},{"t":"l","s":"치코","c":"치코","x":"……오, 오늘은…… 잘 보이는 날이에요. 분명."},{"t":"d","g":"SE","x":"밤바람 — 도시의 소음이 천천히 돌아온다"},{"t":"n","x":"밤하늘이 돌아왔다. 보라색이 아닌, 그냥— 밤의 색이었다."},{"t":"n","x":"그리고 나는 보았다. 서로를 부둥켜안았던 아이들이— 한 박자, 서로를 낯선 눈으로 바라보는 것을."},{"t":"d","g":"표정","x":"레오나 = 문득, 손바닥을 내려다본다"},{"t":"l","s":"레오나","c":"레오나","x":"……어라. 나…… 뭘 하고 있었지. 왜 이렇게— 온몸이, 다 무겁지."},{"t":"d","g":"표정","x":"네네 = 눈을 깜빡인다"},{"t":"l","s":"네네","c":"네네","x":"……어라? 이 몸, 왜 이런 데서…… 너희랑……."},{"t":"d","g":"표정","x":"히스이 = 이마를 짚는다"},{"t":"l","s":"히스이","c":"히스이","x":"……뭔가, 굉장히 중요한 걸…… 잊어버린 것 같은데……."},{"t":"d","g":"표정","x":"네네 = 히스이를 본다 — 낯설게"},{"t":"l","s":"네네","c":"네네","x":"……히스이. …너, 왜 울어."},{"t":"d","g":"표정","x":"히스이 = 자기 뺨을 만진다"},{"t":"l","s":"히스이","c":"히스이","x":"……우는 건 너야. …나도, 인가. — 이상하네. 슬픈 일 같은 건, 하나도 기억이 안 나는데."},{"t":"d","g":"표정","x":"엔마 = 두 사람을 번갈아 본다"},{"t":"l","s":"엔마","c":"엔마","x":"……저기. 우리…… 왜, 다 같이 있는 거죠. 모, 모르는 사이는…… 아닌 것 같은데……."},{"t":"d","g":"표정","x":"레오나 = 치코를 본다 — 한 박자, 낯선 눈"},{"t":"l","s":"레오나","c":"레오나","x":"……너는…… 아. 미안. …이름이, 목까지 나왔는데."},{"t":"d","g":"표정","x":"치코 = 얼어붙는다"},{"t":"l","s":"치코","c":"치코","x":"……레, 레오나 씨……? 저, 저예요. 치코예요……."},{"t":"d","g":"표정","x":"레오나 = 웃으려다, 실패한다"},{"t":"l","s":"레오나","c":"레오나","x":"……치코. 그래, 치코다. …미안, 잠깐— 안개가 꼈나 봐."},{"t":"l","s":"주군","c":"주군","x":"(빠져나가는 것은, 힘만이 아니었다. 함께 싸운 밤들이— 이름부터, 지워지고 있었다.)","m":1},{"t":"n","x":"씨앗은, 힘을 기억하지 않는다. — 함께 싸운 밤들도, 힘과 함께 씨앗으로 돌아가고 있었다."},{"t":"n","x":"목공소 벽의 그 사진도, 지금쯤— 하얗게 바래 가고 있을 것이다. 전원이 웃고 있던, 단 한 장."},{"t":"n","x":"그러고 보면— 문을 잡아 주던 황혼빛의 그 아이는, 어디에도 보이지 않았다."},{"t":"n","x":"그 한가운데에서, 치코만이— 품속의 작은 일기장을 꼭 쥔 채, 소리 없이 울고 있었다."},{"t":"d","g":"표정","x":"치코 = 일기장을 끌어안고"},{"t":"l","s":"치코","c":"치코","x":"……이, 이상하다…… 왜 눈물이…… 머, 멈추질 않지……."},{"t":"d","g":"표정","x":"치코 = 일기장을 펼친다 — 몇 번이나 연필을 떨어뜨리며"},{"t":"l","s":"치코","c":"치코","x":"저, 적어야 해……. 잊기 전에…… 저, 전부……."},{"t":"l","s":"치코","c":"치코","x":"히스이…… 네네 씨…… 엔마 씨…… 레오나 씨……. 벨 씨, 에글랑틴 씨…… 이리스 씨……. 그리고…… 그리고……."},{"t":"d","g":"표정","x":"치코 = 연필이, 멎는다"},{"t":"l","s":"치코","c":"치코","x":"……누, 누구였더라. 무, 문을…… 문을, 잡아 준……."},{"t":"d","g":"표정","x":"치코 = 그래도, 쓴다"},{"t":"l","s":"치코","c":"치코","x":"……'고마워'라고만, 써 둘게요. 이, 이름은— 생각나면, 그때……."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(적어 둔 것만이, 남는다. …그 애가 일기를 쓰던 이유를— 세계가 이런 식으로 증명할 줄은 몰랐다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(그리고— 이 하얗게 바래 가는 시야. …기억을 가져가는 것은, 아이들의 것만이 아닌 모양이었다.)","m":1},{"t":"d","g":"이펙트","x":"화이트아웃 (천천히)"},{"t":"n","x":"세계가 하얗게 바래고, 나는, 눈을 떴다."},{"t":"d","g":"이펙트","x":"암전 — 「에필로그에서 계속」"}]}]},{"id":"p1-e11","title":"에필로그","scenes":[{"id":"p1-e11-s0","title":"EP-1. 「각본집」 ※최종장 클리어 직후 해금","blocks":[{"t":"d","g":"배경","x":"네코다니 — 주군의 저택, 아침 햇살"},{"t":"d","g":"BGM","x":"네코다니 일상 테마 (라이브 기존곡)"},{"t":"d","g":"SE","x":"새소리, 마당의 빗자루질 소리"},{"t":"n","x":"저택의 아침이었다. 아무 일도 없는— 네코다니의, 평범한 아침."},{"t":"n","x":"꿈치고는, 손끝에 서명의 감각이 너무 선명하게 남아 있었다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(……꿈. 꿈이었나. 그 보라색 하늘도, 꽃보라도, 전부.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(긴 꿈이었다. 계절이 두 번은 바뀔 만큼. …그런데 이상하지. 깨어난 몸에, 피로가 없다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(오른손. …펜을 쥐었던 자리가, 아직 뜨겁다. 꿈에서 쥔 펜이— 어째서 현실의 손에 남지.)","m":1},{"t":"d","g":"표정","x":"주군 = 무심코, 자기 양어깨를 본다"},{"t":"l","s":"주군","c":"주군","x":"(……와카. 타마. — 부르고 나서, 스스로 어이가 없었다. 이 방에, 인형 같은 건 없다.)","m":1},{"t":"n","x":"책상 위에— 낡은 각본집 한 권이, 놓여 있었다."},{"t":"l","s":"주군","c":"주군","x":"(……책상 위. — 어제까지, 저기엔 아무것도 없었다.)","m":1},{"t":"d","g":"표정","x":"주군 = 집어 든다"},{"t":"l","s":"주군","c":"주군","x":"(『매지컬・시노비 ~切花의 마녀~』. …각본집? 작자— 미상.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(………산 적, 없다. 이런 책.)","m":1},{"t":"d","g":"SE","x":"종이 넘기는 소리 — 낡고, 건조하다"},{"t":"l","s":"주군","c":"주군","x":"(종이가 낡았다. 오래된 축음기 통 같은, 마른 냄새. — …그만두자. 그 비유는, 기분이 나쁘다.)","m":1},{"t":"n","x":"페이지를 넘기자, 캐스트 목록이 나왔다."},{"t":"n","x":"치코링. 레오냥. 히땅. 네네링. 쥬리땅. — 전부, 아는 이름이었다. 전부, '그 꿈'의 이름이었다."},{"t":"l","s":"주군","c":"주군","x":"(배역 소개까지, 그 꿈 그대로다. [여명]. [홍련]. [선풍]. …읽는 손끝이, 차가워진다.)","m":1},{"t":"n","x":"그리고 목록의 맨 끝. 한 줄이— 찢겨 나가 있었다. 배역명이 있어야 할 자리만, 공백으로."},{"t":"l","s":"주군","c":"주군","x":"(찢겨 있다. — 깨끗하게, 그 한 줄만.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(단면이 낡았다. 어제오늘 찢은 게 아니다. …이 책은, 처음부터 이런 채로 '완성'되어 있었다는 건가.)","m":1},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………찢긴 줄은, 이제 지긋지긋한데.)","m":1},{"t":"d","g":"SE","x":"문 벌컥"},{"t":"d","g":"표정","x":"쥬리 = 들이닥친다"},{"t":"l","s":"쥬리","c":"쥬리","x":"쮸군~! 굿모닝☆ 아침부터 뭐 봐?"},{"t":"d","g":"표정","x":"주군 = 반사적으로, 책을 덮을 뻔한다"},{"t":"l","s":"주군","c":"주군","x":"……쥬리. 노크는."},{"t":"d","g":"표정","x":"쥬리 = 이미 옆에 와 있다"},{"t":"l","s":"쥬리","c":"쥬리","x":"했지~ 마음속으로! 쥬리땅의 노크는 빛보다 빨라서 쮸군한텐 안 들리는 거야. 그래서 그래서, 그 낡은 책 뭐야? 보물지도?"},{"t":"d","g":"표정","x":"쥬리 = 각본집을 들여다본다"},{"t":"l","s":"쥬리","c":"쥬리","x":"……어? 치코링이잖아! 그거 내가 지은 별명인데? 헤헤, 치코링 데뷔작이야? 축하 안 해줘?"},{"t":"d","g":"표정","x":"주군 = 조용히"},{"t":"l","s":"주군","c":"주군","x":"……네가 지은 별명이라고?"},{"t":"d","g":"표정","x":"쥬리 = 당당하게"},{"t":"l","s":"쥬리","c":"쥬리","x":"응! 치코는 치코링. 귀엽지? 쮸군은 그러니까 쮸군! 어때, 천잰가? …어라? 근데 나, 치코링은— 언제 지었더라?"},{"t":"d","g":"표정","x":"쥬리 = 캐스트 목록을 짚어 내려간다"},{"t":"l","s":"쥬리","c":"쥬리","x":"레오냥! 푸훗, 레오나가 들으면 화낼 것 같아~ 히땅, 네네링…… 뭐야 이거, 전부 쥬리땅 스타일이잖아! 이 작가, 별명 재능 있네! 나만큼!"},{"t":"d","g":"표정","x":"쥬리 = 턱을 괸다, 심각한 얼굴"},{"t":"l","s":"쥬리","c":"쥬리","x":"히땅은 좀 아깝네~. 나라면…… '히페커'…… 아니다. 역시 히땅이다. 응, 히땅이 정답!"},{"t":"d","g":"표정","x":"주군 = 어이없다는 듯"},{"t":"l","s":"주군","c":"주군","x":"……정답이라니. 기준이 뭐지."},{"t":"d","g":"표정","x":"쥬리 = 가슴을 편다"},{"t":"l","s":"쥬리","c":"쥬리","x":"감! 쥬리땅의 감은 네코다니 제일이거든☆"},{"t":"l","s":"주군","c":"주군","x":"……그 별명들, 실제로 쓴 적은."},{"t":"d","g":"표정","x":"쥬리 = 손가락을 입에 대고, 갸웃"},{"t":"l","s":"쥬리","c":"쥬리","x":"없…… 지? 없나? …어라. 부른 적, 있는 것 같기도 하고~? 크게, 아~주 크게…… 어라라?"},{"t":"d","g":"표정","x":"쥬리 = 페이지를 넘기다, 손이 멎는다"},{"t":"l","s":"쥬리","c":"쥬리","x":"……어, 이 '쥬리땅'이란 애— 대사가 완전 나 같아. 「별은, 떨어져도 별」…… 캬~ 멋있다! 이거, 내가 한 말이면 좋겠다!"},{"t":"l","s":"주군","c":"주군","x":"(………그 대사를, 나는— 병실의 노을 속에서, 들었다.)","m":1},{"t":"d","g":"표정","x":"쥬리 = 고개를 마구 흔든다"},{"t":"l","s":"쥬리","c":"쥬리","x":"에잇, 몰라! 아무튼 이 책 재밌겠다! 다 읽으면 빌려줘, 쮸군!"},{"t":"d","g":"표정","x":"주군 = 쥬리를 본다 — 오래"},{"t":"l","s":"주군","c":"주군","x":"(……'쮸군'. 그래. 이 아이는 나를 그렇게 부르지. 꿈속의 '앗찌'가 아니라.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(전부 쥬리의 별명이다. 캐스트 전원이. — 꿈이 이 아이를 베낀 건가. 아니면…… 이 아이가, 그 꿈을?)","m":1},{"t":"l","s":"주군","c":"주군","x":"……쥬리. 이 책, 네가 가져다 놨나?"},{"t":"d","g":"표정","x":"쥬리 = 갸웃"},{"t":"l","s":"쥬리","c":"쥬리","x":"응~? 아니? 쥬리땅, 쮸군 방에 함부로 안 들어가는데~. …어, 근데 이 제목 뭔가 좋다. 매지컬・시노비! 어디서 들어 본 것 같기도 하고?"},{"t":"d","g":"표정","x":"쥬리 = 제목을 손가락으로 따라 그린다"},{"t":"l","s":"쥬리","c":"쥬리","x":"매~지컬 시노비. 매지컬…… 응, 역시 좋아. 입에 착 붙어. …근데 왜일까? 좋은데— 조금, 눈물 날 것 같아."},{"t":"d","g":"표정","x":"주군 = 굳는다"},{"t":"l","s":"주군","c":"주군","x":"……쥬리?"},{"t":"d","g":"표정","x":"쥬리 = 평소의 얼굴로 돌아온다, 활짝"},{"t":"l","s":"쥬리","c":"쥬리","x":"응? 뭐가~? 아, 배고프다! 쮸군, 아침 뭐야?"},{"t":"l","s":"주군","c":"주군","x":"(………지금 이 아이는, 자기가 무슨 말을 했는지도 모른다. — 꿈은, 어느 쪽의 것이었지.)","m":1},{"t":"d","g":"SE","x":"조용한 발소리"},{"t":"d","g":"표정","x":"마시로 = 문가에서 — 각본집을 응시하고 있다"},{"t":"l","s":"마시로","c":"마시로","x":"……주군."},{"t":"d","g":"표정","x":"주군 = 돌아본다"},{"t":"l","s":"주군","c":"주군","x":"마시로. 언제부터 거기—"},{"t":"d","g":"표정","x":"쥬리 = 손을 흔든다"},{"t":"l","s":"쥬리","c":"쥬리","x":"아, 마시로다! 웬일이야, 이 아침부터~?"},{"t":"d","g":"표정","x":"마시로 = 대답하지 않는다 — 시선은, 책에 못 박힌 채"},{"t":"l","s":"주군","c":"주군","x":"(마시로의 시선은— 표지가 아니라, 캐스트 목록의 찢긴 줄에, 못 박혀 있었다.)","m":1},{"t":"d","g":"표정","x":"마시로 = 시선을 떼지 않은 채, 낮은 목소리"},{"t":"l","s":"마시로","c":"마시로","x":"그 각본…… 어디서, 나셨어요?"},{"t":"d","g":"표정","x":"주군 = 한 박자 늦게"},{"t":"l","s":"주군","c":"주군","x":"……일어나 보니, 책상 위에 있었다. — 왜 그러지."},{"t":"d","g":"표정","x":"마시로 = 한 박자 — 시선을, 천천히 내린다"},{"t":"l","s":"마시로","c":"마시로","x":"……아뇨. …아무것도, 아니에요. — 실례했어요."},{"t":"d","g":"표정","x":"주군 = 부른다"},{"t":"l","s":"주군","c":"주군","x":"……마시로."},{"t":"d","g":"표정","x":"마시로 = 문가에서 반쯤 돌아본다 — 눈을 맞추지 않는다"},{"t":"l","s":"마시로","c":"마시로","x":"……좋은 아침이에요. 주군."},{"t":"d","g":"SE","x":"멀어지는 발소리"},{"t":"d","g":"표정","x":"쥬리 = 갸웃갸웃"},{"t":"l","s":"쥬리","c":"쥬리","x":"……뭐야, 마시로 쟤. 아침부터 낮은 목소리 대회야?"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………아는 목소리였다. 무대 위의 것이 아니라— 광장의.)","m":1},{"t":"d","g":"이펙트","x":"암전"}]},{"id":"p1-e11-s1","title":"EP-2. 「좋은 꿈」 ※시간차 해금 (2주 후)","blocks":[{"t":"d","g":"배경","x":"네코다니 — 마을길, 늦은 오후"},{"t":"d","g":"BGM","x":"일상 테마 (아주 조금, 반음 낮은 편곡)"},{"t":"d","g":"SE","x":"풍경(風鈴), 멀리 아이들 소리"},{"t":"n","x":"며칠이 지났다. 각본집은 서랍에 넣어 두었다. — 열지 않은 채로."},{"t":"n","x":"마을은 평화로웠다. 치코는 신사 계단에서 넘어질 뻔했고, 레오나는 그걸 받아 주다 같이 넘어졌다. 늘 있는 광경. …늘 있는, 이라고 믿고 싶은 광경."},{"t":"d","g":"SE","x":"와당탕"},{"t":"d","g":"표정","x":"레오나 = 계단 아래, 치코를 안은 채 대자로 뻗어 있다"},{"t":"l","s":"레오나","c":"레오나","x":"……세이프. — 주군, 보셨어요? 지금 거, 완벽하게 받았죠."},{"t":"d","g":"표정","x":"치코 = 레오나 위에서, 눈이 뱅글뱅글"},{"t":"l","s":"치코","c":"치코","x":"가, 감사해요, 레오나 씨……. 그, 그치만 레오나 씨가 밑에 깔리셨는데요……!"},{"t":"d","g":"표정","x":"레오나 = 일어나 치코를 세워 주며, 씩 웃는다"},{"t":"l","s":"레오나","c":"레오나","x":"받는 쪽이 깔리는 건 기본이야. — 좋아, 오늘 수련 여기까지. 주군, 신사 계단, 위험하니까 공사 건의 좀 해 주세요."},{"t":"d","g":"표정","x":"주군 = 한숨"},{"t":"l","s":"주군","c":"주군","x":"……검토하지. 네가 계단에서 수련하는 것부터, 재검토다."},{"t":"d","g":"표정","x":"레오나 = 치코의 머리에 붙은 흙을 털어 준다"},{"t":"l","s":"레오나","c":"레오나","x":"치코, 다친 데 없지? — 좋아. 오늘의 구출, 일 회 완료."},{"t":"d","g":"표정","x":"레오나 = 웃으며 달려간다"},{"t":"l","s":"레오나","c":"레오나","x":"하하, 그럼 이만— 사부가 기다려서!"},{"t":"d","g":"표정","x":"치코 = 그 등에 대고, 작게"},{"t":"l","s":"치코","c":"치코","x":"레, 레오나 씨…… 뛰면, 또 넘어질 텐데……."},{"t":"n","x":"늘 있는 광경이, 늘 있는 소리를 내며 지나갔다. …그 소리가, 이상할 만큼 고마웠다."},{"t":"d","g":"표정","x":"치코 = 계단 아래에서, 쭈뼛쭈뼛"},{"t":"l","s":"치코","c":"치코","x":"즈, 주군님……! 저, 저기, 요즘…… 일기를 쓰기 시작했어요. 에헤헤…… 아, 아무것도 아니에요!"},{"t":"d","g":"표정","x":"주군 = 멈칫"},{"t":"l","s":"주군","c":"주군","x":"(……일기, 라고 했나. 지금.)","m":1},{"t":"l","s":"주군","c":"주군","x":"……언제부터지."},{"t":"d","g":"표정","x":"치코 = 손가락을 꼼지락"},{"t":"l","s":"치코","c":" /* ---------- 상태 ---------- */
const S = { part:0, q:"", hits:[], hi:0, sel:new Set(), mode:"highlight",
            scope:"total", view:"chart", side:null, lz:-1 };
const LINT = DATA.lint || [];
const BAD = new Set(LINT.map(v => v.id));
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PKEY = i => DATA.parts[i].key;

/* 화자 → 확정 색 스펙 인덱스. 미배정이면 -1 */
function slot(c){ const i = DATA.palette[c]; return i === undefined ? -1 : i; }
const cls = c => { const i = slot(c); return i < 0 ? "" : " ci" + i; };

/* 통합 인물 표기: 본명이 대본상 최다 표기가 아니면 「본명·최다표기」로 */
function alia(n){
  const a = DATA.counts[n].aliases;
  return Object.keys(a).sort((x, y) => a[y] - a[x]);
}
function label(n){
  const t = alia(n)[0];
  return t && t !== n ? n + "·" + t : n;
}
function tip(n){
  const a = DATA.counts[n].aliases, ks = alia(n);
  return ks.length > 1 ? "대본 표기: " + ks.map(k => k + " " + a[k] + "줄").join(" / ") : n;
}

/* 검색어 하이라이트 */
function hl(text, q){
  const t = esc(text);
  if(!q) return t;
  const parts = [];
  const lo = t.toLowerCase(), lq = q.toLowerCase();
  let i = 0, p = 0;
  while((i = lo.indexOf(lq, p)) !== -1){
    parts.push(t.slice(p, i), '<mark>', t.slice(i, i + q.length), '</mark>');
    p = i + q.length;
  }
  parts.push(t.slice(p));
  return parts.join("");
}

/* ---------- 본문 렌더 ---------- */
function renderDoc(){
  const P = DATA.parts[S.part], q = S.q;
  const o = [];
  o.push('<div class="mtabs">');
  DATA.parts.forEach((pp, i) =>
    o.push('<button data-mp="', i, '" aria-selected="', i === S.part, '">', pp.key, '</button>'));
  o.push('</div>');
  o.push('<div class="pt-h"><h1>', esc(P.title), '</h1>');
  P.meta.forEach(m => o.push('<p>', esc(m.replace(/\*\*/g, "")), '</p>'));
  o.push('</div>');
  if(P.notes.length){
    P.notes.forEach(n => {
      o.push('<details class="notes"><summary>', esc(n.h), '</summary><div>');
      n.body.forEach(b => o.push('<p>', esc(b.replace(/^-\s*/, "· ").replace(/\*\*/g, "")), '</p>'));
      o.push('</div></details>');
    });
  }
  P.episodes.forEach(ep => {
    o.push('<section class="ep" id="', ep.id, '"><h2>', esc(ep.title), '</h2>');
    ep.scenes.forEach(sc => {
      o.push('<section class="sc" id="', sc.id, '"><h3>', esc(sc.title), '</h3>');
      sc.blocks.forEach((b, bi) => {
        const id = sc.id + '-b' + bi, bad = BAD.has(id) ? ' bad' : '';
        if(b.t === "d"){
          o.push('<div class="b d', bad, '" id="', id, '"><b>', esc(b.g), '</b>', hl(b.x, q), '</div>');
        } else if(b.t === "n"){
          o.push('<div class="b n', bad, '" id="', id, '">', hl(b.x, q), '</div>');
        } else if(b.t === "l"){
          o.push('<div class="b l', cls(b.c), b.m ? ' mono' : '', bad,
                 '" id="', id, '" data-c="', esc(b.c), '"><div class="sp">', esc(b.s),
                 '</div><div class="tx">', hl(b.x, q), '</div></div>');
        } else {
          o.push('<div class="b p', bad, '" id="', id, '">', hl(b.x, q), '</div>');
        }
      });
      o.push('</section>');
    });
    o.push('</section>');
  });
  $("#doc").innerHTML = o.join("");
  S.hits = Array.from(document.querySelectorAll("#doc mark"));
  S.hi = 0;
  applyFilter();
  updHitNav();
}

    o.push('<h4>검색 결과 ', rs.length >= 300 ? '300+' : rs.length, '건</h4>');
    if(!rs.length) o.push('<p class="empty">일치하는 내용이 없습니다.</p>');
    o.push('<div class="res">');
    rs.slice(0, 300).forEach(r => o.push(
      '<a href="#" data-p="', r.p, '" data-s="', r.sid, '" data-i="', r.i, '">',
      '<span class="rw">', esc(r.where), '</span>',

    o.push('</div>');
  } else {
    const P = DATA.parts[S.part];

          const from = Math.max(0, at - 26);
          out.push({
            p: pi, sid: sc.id, i: bi,
            where: P.key + " · " + ep.title.replace(/「.*/, "").trim() + " · " + sc.title.split("—")[0].trim(),
            snip: (from ? "…" : "") + hl(txt.slice(from, from + 110), q) + (txt.length > from + 110 ? "…" : "")
          });
          if(out.length > 320) throw { done: out };
        });
      });
    });
  });
  return out;
}
function searchSafe(q){ try { return search(q); } catch(e){ return e.done || []; } }

/* ---------- 검색 이동 ---------- */
function updHitNav(){
  const n = S.hits.length;
  $("#hitnav").hidden = !S.q;
  $("#hitc").textContent = n ? (S.hi + 1) + "/" + n : "0";
}
function goHit(d){
  if(!S.hits.length) return;
  S.hits[S.hi] && S.hits[S.hi].classList.remove("cur");
  S.hi = (S.hi + d + S.hits.length) % S.hits.length;
  const m = S.hits[S.hi];
  m.classList.add("cur");
  m.scrollIntoView({ block: "center", behavior: "smooth" });
  updHitNav();
}

/* ---------- 화자 필터 ---------- */
function applyFilter(){
  document.body.classList.toggle("filtering", S.sel.size > 0 && S.mode === "highlight");
  document.body.classList.toggle("isolate", S.sel.size > 0 && S.mode === "isolate");
  document.querySelectorAll("#doc .l").forEach(el =>
    el.classList.toggle("hi", S.sel.has(el.dataset.c)));
}

/* ---------- 사이드 패널 ---------- */
function renderSide(){
  if(S.side === "lint") return renderLint();
  const names = Object.keys(DATA.counts)
    .sort((a, b) => DATA.counts[b].total - DATA.counts[a].total);
  const o = [];

  o.push('<h4>화자 필터</h4>');
  o.push('<div class="seg">',
    '<button data-m="highlight" aria-pressed="', S.mode === "highlight", '">강조</button>',
    '<button data-m="isolate" aria-pressed="', S.mode === "isolate", '">선택만 보기</button></div>');
  o.push('<div class="chips">');
  let una = [];
  names.forEach(n => {
    const i = slot(n);
    if(i < 0 && DATA.counts[n].total >= 5) una.push(n);
    o.push('<button class="chip', cls(n), i < 0 ? ' una' : '', '" data-n="', esc(n),
           '" title="', esc(tip(n)), '" aria-pressed="', S.sel.has(n),
           '"><i class="dot"></i>', esc(label(n)),
           '<span class="n">', DATA.counts[n].total, '</span></button>');
  });
  o.push('</div>');
  if(S.sel.size) o.push('<button class="clr" id="clr">선택 해제 (', S.sel.size, ')</button>');
  o.push('<p class="note">확정 캐릭터 색 스펙 적용. 라이트 모드가 스펙 원본 hex이고, 다크 모드는 색상·채도를 유지한 채 명도만 올린 대응 단계입니다. 변신·마녀 표기는 본명으로 통합했습니다 — 치코=치코링, 히스이=히땅, 네네=네네링, 쥬리=쥬리땅, 엔마=엔마루, 아야메=이리스, 시즈쿠=에글랑틴, 메이=벨, 치사=뮤게. 칩에 마우스를 올리면 대본 표기별 줄 수가 나옵니다.</p>');
  if(una.length) o.push('<p class="note" style="color:var(--ink2)">◌ <b>색 미배정 ', una.length,
    '인</b> — ', una.map(esc).join(", "), '. 스펙에 없는 인물이라 무채색으로 두었습니다.</p>');

  o.push('<h4 style="margin-top:22px">화자별 대사량</h4>');
  o.push('<div class="seg">',
    ['total', '1부', '2부'].map(s =>
      '<button data-sc="' + s + '" aria-pressed="' + (S.scope === s) + '">' +
      (s === 'total' ? '전체' : s) + '</button>').join(""), '</div>');
  o.push('<div class="seg">',
    '<button data-v="chart" aria-pressed="', S.view === "chart", '">그래프</button>',
    '<button data-v="table" aria-pressed="', S.view === "table", '">표</button></div>');

  const rows = names.map(n => ({ n: n, v: DATA.counts[n][S.scope] }))
                    .filter(r => r.v > 0).sort((a, b) => b.v - a.v);
  const max = rows.length ? rows[0].v : 1;
  const tot = rows.reduce((s, r) => s + r.v, 0);

  if(S.view === "chart"){
    o.push('<div class="bars">');
    rows.slice(0, 24).forEach(r => o.push(
      '<div class="bar" title="', esc(tip(r.n)), '"><span class="nm">', esc(label(r.n)), '</span>',
      '<span class="tr"><span class="fl" style="width:', (r.v / max * 100).toFixed(1), '%"></span></span>',
      '<span class="vl">', r.v, '</span></div>'));
    o.push('</div>');
    if(rows.length > 24) o.push('<p class="note">상위 24인 표시 · 전체 ', rows.length, '인은 [표]에서 확인.</p>');
  } else {
    o.push('<table class="tv"><thead><tr><th>화자</th><th>대사</th><th>비중</th></tr></thead><tbody>');
    rows.forEach(r => o.push('<tr title="', esc(tip(r.n)), '"><td>', esc(label(r.n)), '</td><td>', r.v, '</td><td>',
      (r.v / tot * 100).toFixed(1), '%</td></tr>'));
    o.push('</tbody></table>');
  }
  o.push('<p class="note">합계 ', tot.toLocaleString(), '줄 · ', rows.length, '인. 연출 지시와 나레이션은 제외한 순수 대사줄 기준입니다.</p>');
  $("#side").innerHTML = o.join("");
}

/* ---------- 검수 패널 ---------- */
function renderLint(){
  const o = ['<h4>정본 검수</h4>'];
  if(!LINT.length){
    o.push('<div class="pass">✔ 검수 통과<small>호칭·표기 8개 규칙 · 대사 전수 점검에서 위반 0건</small></div>');
    o.push('<p class="note">점검 규칙 — 주군 호칭(story_rules §3.1) · 꿈속 계약자 치환 · \'아저씨\' 금지(예외 2건) · 통칭 2글자 · 호칭 띄어쓰기(§3.4) · 조사 정합 · 나레이션 1인칭 시점(§2). 규칙 정의는 <code>lint_rules.py</code>.</p>');
    $("#side").innerHTML = o.join("");
    return;
  }
  const v = LINT.filter(x => x.sev === "위반").length;
  o.push('<p class="note" style="margin:0 0 10px">위반 <b style="color:var(--bad)">', v,
         '</b>건 · 확인 필요 ', LINT.length - v, '건</p>');
  LINT.forEach((x, i) => o.push(
    '<button class="lz" data-lz="', i, '">',
    '<span class="hd"><span class="sv ', x.sev === "위반" ? 'v">위반' : 'c">확인',
    '</span><span class="rl">', esc(x.rule), '</span></span>',
    '<span class="wh">', esc(x.where), '</span>',
    '<span class="tx">', esc(x.s ? x.s + ": " : ""), esc(x.x), '</span>',
    '<span class="dt">→ ', esc(x.d), '</span></button>'));
  $("#side").innerHTML = o.join("");
}

function gotoLint(i){
  const x = LINT[i]; if(!x) return;
  if(x.p !== S.part){ S.part = x.p; renderDoc(); renderToc(); initSpy(); }
  const el = document.getElementById(x.id);
  if(!el) return;
  document.querySelectorAll(".b.cur").forEach(e => e.classList.remove("cur"));
  el.classList.add("cur");
  el.scrollIntoView({ block: "center" });   // 장문 점프는 즉시 이동
  S.lz = i;
}

let _jt = [];
function jump(el){
  if(!el) return;
  _jt.forEach(clearTimeout); _jt = [];
  el.scrollIntoView({ block: "start" });
  requestAnimationFrame(() => el.scrollIntoView({ block: "start" }));
  _jt.push(setTimeout(() => el.scrollIntoView({ block: "start" }), 150));
  _jt.push(setTimeout(() => el.scrollIntoView({ block: "start" }), 450));
}

/* ---------- 스크롤 연동 ---------- */
let spy;
function initSpy(){
  if(spy) spy.disconnect();
  spy = new IntersectionObserver(es => {
    es.forEach(e => {
      if(!e.isIntersecting) return;
      document.querySelectorAll('#toc a.on').forEach(a => a.classList.remove("on"));
      const a = document.querySelector('#toc a[href="#' + e.target.id + '"]');
      if(a){ a.classList.add("on"); }
    });
  }, { root: $("#main"), rootMargin: "-64px 0px -70% 0px" });
  document.querySelectorAll("#doc .sc, #doc .ep").forEach(el => spy.observe(el));
}

/* ---------- 이벤트 ---------- */
let t;
$("#q").addEventListener("input", e => {
  clearTimeout(t);
  t = setTimeout(() => { S.q = e.target.value.trim(); renderDoc(); renderToc(); initSpy(); }, 180);
});
$("#q").addEventListener("keydown", e => {
  if(e.key === "Enter"){ e.preventDefault(); goHit(e.shiftKey ? -1 : 1); }
  if(e.key === "Escape"){ e.target.value = ""; S.q = ""; renderDoc(); renderToc(); initSpy(); }
});
$("#next").addEventListener("click", () => goHit(1));
$("#prev").addEventListener("click", () => goHit(-1));
document.addEventListener("keydown", e => {
  if(e.key === "/" && e.target.tagName !== "INPUT"){ e.preventDefault(); $("#q").focus(); }
});

$("#tDir").addEventListener("click", e => {
  const on = e.target.getAttribute("aria-pressed") === "true";
  e.target.setAttribute("aria-pressed", !on);
  document.body.classList.toggle("nodir", on);
});
function setSide(mode){
  S.side = (S.side === mode) ? null : mode;
  $("#tSide").setAttribute("aria-pressed", S.side === "stat");
  $("#tLint").setAttribute("aria-pressed", S.side === "lint");
  $("#wrap").classList.toggle("side", !!S.side);
  document.body.classList.toggle("lintOn", S.side === "lint");
  if(S.side) renderSide();
}
$("#tSide").addEventListener("click", () => setSide("stat"));
$("#tLint").addEventListener("click", () => setSide("lint"));
$("#tTheme").addEventListener("click", e => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  e.target.setAttribute("aria-pressed", next === "dark");
});

$("#doc").addEventListener("click", e => {
  const t = e.target.closest("button[data-mp]");
  if(t){ S.part = +t.dataset.mp; renderDoc(); renderToc(); initSpy(); $("#main").scrollTop = 0; }
});
$("#toc").addEventListener("click", e => {
  const tab = e.target.closest("button[data-p]");
  if(tab){ S.part = +tab.dataset.p; renderDoc(); renderToc(); initSpy(); $("#main").scrollTop = 0; return; }
  const res = e.target.closest("a[data-s]");
  if(res){
    e.preventDefault();
    const p = +res.dataset.p;
    if(p !== S.part){ S.part = p; renderDoc(); initSpy(); }
    jump(document.getElementById(res.dataset.s));
    return;
  }
  const a = e.target.closest("a[href^='#']");
  if(a){
    e.preventDefault();
    jump(document.getElementById(a.getAttribute("href").slice(1)));
  }
});

$("#side").addEventListener("click", e => {
  const lz = e.target.closest("[data-lz]");
  if(lz){ gotoLint(+lz.dataset.lz); return; }
  const c = e.target.closest(".chip");
  if(c){ const n = c.dataset.n; S.sel.has(n) ? S.sel.delete(n) : S.sel.add(n); renderSide(); applyFilter(); return; }
  const m = e.target.closest("button[data-m]");
  if(m){ S.mode = m.dataset.m; renderSide(); applyFilter(); return; }
  const s = e.target.closest("button[data-sc]");
  if(s){ S.scope = s.dataset.sc; renderSide(); return; }
  const v = e.target.closest("button[data-v]");
  if(v){ S.view = v.dataset.v; renderSide(); return; }
  if(e.target.id === "clr"){ S.sel.clear(); renderSide(); applyFilter(); }
});

/* ---------- 시작 ---------- */
(function initLintBtn(){
  const b = $("#tLint");
  if(!LINT.length){ b.classList.add("ok"); b.innerHTML = '검수 ✔'; b.title = "위반 0건"; }
  else {
    b.classList.add("warn");
    b.innerHTML = '검수<span class="cnt">' + LINT.length + '</span>';
    b.title = LINT.filter(x => x.sev === "위반").length + "건 위반 / "
            + LINT.filter(x => x.sev !== "위반").length + "건 확인 필요";
  }
})();
renderDoc(); renderToc(); initSpy();
</script>
</body>
