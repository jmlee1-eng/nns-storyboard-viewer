":"와카 = 움찔"},{"t":"l","s":"와카","c":"와카","x":"골동품상…… 아, 그 가게. 계약자가 우리를 주운—"},{"t":"l","s":"타마","c":"타마","x":"시작의 가게다~."},{"t":"l","s":"주군","c":"주군","x":"시작의 가게에, 끝의 줄이 있다면— 이야기로서는 너무 잘 짜여 있지. …하지만 잘 짜인 이야기는, 대개 누가 짠 거다. 경계는 하고 간다."},{"t":"d","g":"표정","x":"와카 = 진지하게"},{"t":"l","s":"와카","c":"와카","x":"같이 갈까? 만일의 경우엔, 물어뜯을 수 있어. 인형이지만."},{"t":"l","s":"주군","c":"주군","x":"마음만 받지. — 너희는 여기서 원문을 지켜라. 찢은 '손'이 있다는 걸 안 이상, 남은 종이의 가치는 오늘부터 두 배다."},{"t":"d","g":"표정","x":"타마 = 경례"},{"t":"l","s":"타마","c":"타마","x":"파수꾼 임무~, 접수~."},{"t":"n","x":"나는 외투를 걸쳤다. 새벽이 오기 전에, 갈 곳이 생겼다."},{"t":"n","x":"창밖의 하얀 실금은— 이제 하늘의 칠 할을 덮고 있었다."},{"t":"d","g":"표정","x":"타마 = 외투 자락을 붙잡는다"},{"t":"l","s":"타마","c":"타마","x":"지금~? 해도 안 떴는데~?"},{"t":"l","s":"주군","c":"주군","x":"골동품이란 건, 해 뜨기 전이 제일 정직한 법이다."},{"t":"d","g":"표정","x":"와카 = 걱정스럽게"},{"t":"l","s":"와카","c":"와카","x":"계약자, 어디 가?"},{"t":"l","s":"주군","c":"주군","x":"장 보러. — 세상에서 제일 비싼 골동품을 사러 간다."}]}]},{"id":"p1-e6","title":"17화 「목소리가 든 통」","scenes":[{"id":"p1-e6-s0","title":"17-1. 골동품상 — 「세상에서 제일 비싼 물건」","blocks":[{"t":"d","g":"배경","x":"새벽의 골동품상 — 등불 하나, 잡동사니 산더미 (1화와 동일 구도)"},{"t":"d","g":"BGM","x":"오래된 축음기풍 왈츠 (1화 변주, 반음 낮게)"},{"t":"d","g":"SE","x":"풍경(風鈴), 곰방대 연기"},{"t":"n","x":"가게는, 처음 그 밤과 똑같은 자리에 있었다. 지도에 없는 가게치고는, 성실한 영업이었다."},{"t":"d","g":"SE","x":"풍경이 한 번, 저 혼자 운다"},{"t":"n","x":"새벽 네 시. 골목의 안개가 무릎까지 차오르고, 가게의 등불 하나만 호박색으로 젖어 있었다."},{"t":"d","g":"표정","x":"주군 = 문 앞에서 멈춰 선다"},{"t":"l","s":"주군","c":"주군","x":"(문이…… 열려 있군. 이 시간에. — 지난번엔 길이 나를 주웠다고 했지. 오늘은 내가 길을 짚어 왔다. 이 차이를, 저 남자가 뭐라고 감정할지.)","m":1},{"t":"d","g":"SE","x":"문을 밀자 — 곰방대 연기 냄새"},{"t":"d","g":"표정","x":"하케 = 기다리고 있었다는 듯"},{"t":"l","s":"하케","c":"하케","x":"…왔군. 늦었어, 계약자 양반."},{"t":"l","s":"주군","c":"주군","x":"내가 올 걸 알고 있었나."},{"t":"d","g":"표정","x":"하케 = 곰방대 연기"},{"t":"l","s":"하케","c":"하케","x":"나는 골동품상일세. 물건이 주인을 고르는 순간만큼은— 놓치는 법이 없지."},{"t":"d","g":"표정","x":"주군 = 가게 안을 둘러본다"},{"t":"l","s":"주군","c":"주군","x":"……'늦었다'는 건. 언제부터 기다린 거지."},{"t":"d","g":"표정","x":"하케 = 곰방대를 재떨이에 톡, 턴다"},{"t":"l","s":"하케","c":"하케","x":"글쎄. 물건 쪽에 물어보게. 기다린 건 내가 아니라 저쪽이니까. — 나야 그저, 가게 문이나 열어 둔 거지."},{"t":"d","g":"표정","x":"주군 = 본론으로"},{"t":"l","s":"주군","c":"주군","x":"이 도시에서 제일 오래된 물건을 찾고 있다."},{"t":"d","g":"표정","x":"하케 = 연기 사이로, 눈이 가늘어진다"},{"t":"l","s":"하케","c":"하케","x":"……호오. 아주 큰 걸 물어보는군, 새벽부터."},{"t":"l","s":"하케","c":"하케","x":"제일 오래된 물건이라. — 골동품 찾는 손님이야 흔하지. 한데 이름도, 생김새도 모르면서 '제일 오래된 것'을 달라는 손님은 둘 중 하나야. 아주 어리석거나, 아주 절박하거나. 자네는 어느 쪽인가."},{"t":"l","s":"주군","c":"주군","x":"둘 다다. 어리석지 않고서야 이런 계약서에 서명했을 리 없고— 절박하지 않고서야, 이 시간에 문을 두드렸을 리 없지."},{"t":"d","g":"표정","x":"하케 = 짧게, 낮게 웃는다"},{"t":"l","s":"하케","c":"하케","x":"……정직한 대답이군. 정직한 손님한테는, 가게도 정직해지는 법이지."},{"t":"d","g":"표정","x":"하케 = 곰방대로 주군의 외투를 가리킨다"},{"t":"l","s":"하케","c":"하케","x":"그 전에. — 밤을 며칠이나 새운 얼굴이군. 차라도 내올까."},{"t":"l","s":"주군","c":"주군","x":"마음만 받지. 시간이 아까운 밤이라서."},{"t":"d","g":"표정","x":"하케 = 픽"},{"t":"l","s":"하케","c":"하케","x":"시간이 아깝다는 손님일수록, 이 가게에선 오래 머물다 가네. …뭐, 좋아."},{"t":"d","g":"표정","x":"하케 = 자리에서 일어선다 — 관절 소리"},{"t":"l","s":"하케","c":"하케","x":"따라오게. 안쪽이네."},{"t":"n","x":"그는 잡동사니 산더미 깊숙한 곳에서, 낡은 축음기 실린더 하나를 꺼내 왔다. 이 도시가 생기기 전부터 있었다는— 목소리가 든 통."},{"t":"d","g":"SE","x":"나무 상자 — 오래된 경첩 소리"},{"t":"n","x":"상자 속의 실린더는, 손바닥 두 개 길이의 금속 통이었다. 표면의 홈은 닳아 있었지만— 이상하리만치, 녹 하나 없었다."},{"t":"d","g":"표정","x":"주군 = 상자 위로 몸을 숙인다"},{"t":"l","s":"주군","c":"주군","x":"……이게, 그건가."},{"t":"d","g":"표정","x":"하케 = 끄덕인다"},{"t":"l","s":"하케","c":"하케","x":"목소리가 든 통. — 이 가게에서 유일하게, 들어온 날짜가 장부에 없는 재고지."},{"t":"l","s":"주군","c":"주군","x":"장부에 없다?"},{"t":"l","s":"하케","c":"하케","x":"내가 물려받았을 때 이미 있었네. 선대도 '원래 있던 물건'이라고만 들었다더군. 가게보다 오래된 재고라— 말이 안 되지. …이 도시보다 오래됐다는 쪽이, 차라리 앞뒤가 맞아."},{"t":"d","g":"표정","x":"주군 = 실린더의 홈을 본다"},{"t":"l","s":"주군","c":"주군","x":"뭐가 들어 있는지는."},{"t":"d","g":"표정","x":"하케 = 고개를 젓는다"},{"t":"l","s":"하케","c":"하케","x":"모르네. 들어 본 적이 없으니까. — 수십 년을 한 지붕 밑에서 살았는데, 이 통은 나한테 한 소절도 들려준 적이 없어."},{"t":"l","s":"주군","c":"주군","x":"……수십 년."},{"t":"d","g":"표정","x":"하케 = 곰방대에 새로 불을 붙인다"},{"t":"l","s":"하케","c":"하케","x":"골동품상이 제 재고의 소리를 못 듣는다. 웃기는 얘기지. …그래서 알았네. 이건 파는 물건이 아니라— 기다리는 물건이라는 걸."},{"t":"l","s":"주군","c":"주군","x":"기다리는 물건. — 누구를."},{"t":"l","s":"하케","c":"하케","x":"그걸 알면 벌써 배달을 갔겠지. 이 장사는 배달이 안 되는 게 흠이야. — 주인이 문을 열고 들어올 때까지, 그저 먼지나 닦아 주는 거네."},{"t":"d","g":"표정","x":"주군 = 받아 든다"},{"t":"l","s":"주군","c":"주군","x":"……값은."},{"t":"d","g":"표정","x":"하케 = 처음으로, 웃지 않는다"},{"t":"l","s":"하케","c":"하케","x":"비싸네. 세상에서 제일 비싸. — 하지만 자네는 이미 치르고 있어. 서명한 그 밤부터, 줄곧."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………책임이 값이라는 건가. 지독한 가격표군.)","m":1},{"t":"d","g":"표정","x":"하케 = 연기를 길게 내뿜는다"},{"t":"l","s":"하케","c":"하케","x":"돈은 안 받네. 첫날 밤에도 말했지 — 이 가게 물건은, 주인을 고르는 물건이라고."},{"t":"l","s":"주군","c":"주군","x":"값을 치르지 않은 물건은, 무겁다. 받기만 하는 건 성미에 안 맞는데."},{"t":"d","g":"표정","x":"하케 = 정면으로 주군을 본다"},{"t":"l","s":"하케","c":"하케","x":"그럼 하나 두고 가게. — 자네가 그걸 어디에 쓸 셈인지. 그거면 셈은 맞네."},{"t":"d","g":"표정","x":"주군 = 실린더를 내려다본다 → 정면으로"},{"t":"l","s":"주군","c":"주군","x":"출구를 찾는다. 서명 위에 세워진 이 세계에서— 아이들이 걸어 나갈 수 있는, 정식 출구를."},{"t":"d","g":"SE","x":"곰방대 — 재가 떨어지는 소리"},{"t":"d","g":"표정","x":"하케 = 한동안, 말이 없다"},{"t":"l","s":"하케","c":"하케","x":"………출구라."},{"t":"l","s":"하케","c":"하케","x":"이 장사를 오래 하다 보면 말이지, 물건마다 얼굴이 보이네. 미련의 얼굴, 후회의 얼굴. — 하지만 '출구'를 찾으러 온 얼굴은, 자네가 처음이야."},{"t":"l","s":"주군","c":"주군","x":"다들, 뭘 찾으러 오지."},{"t":"d","g":"표정","x":"하케 = 연기 너머로"},{"t":"l","s":"하케","c":"하케","x":"되돌리는 걸 찾지. 시간을, 사람을, 저지른 일을. — 그리고 그런 건, 이 가게에 없네. 어느 가게에도 없고."},{"t":"l","s":"주군","c":"주군","x":"(……되돌리기가 아니라, 나아가기. 이 남자는 지금— 물건이 아니라 나를 감정하고 있군.)","m":1},{"t":"d","g":"표정","x":"하케 = 목소리가 낮아진다"},{"t":"l","s":"하케","c":"하케","x":"계약자 양반. 하나 물어보지. — 그 출구, 자네 몫도 있나."},{"t":"l","s":"주군","c":"주군","x":"……무슨 뜻이지."},{"t":"l","s":"하케","c":"하케","x":"남의 출구만 찾아 주는 사람은, 정작 제 몫의 문 앞을 그냥 지나치는 법이라서 말이야. …오래 장사하다 보면, 그런 얼굴도 보이네."},{"t":"l","s":"주군","c":"주군","x":"(………내 몫의 문. 생각해 본 적도 없었다는 게— 대답이 되어 버리는군.)","m":1},{"t":"d","g":"표정","x":"하케 = 대답을 기다리지 않는다"},{"t":"l","s":"하케","c":"하케","x":"대답은 됐네. 얼굴에 적혀 있으니. — 그것까지 포함해서, 비싸다는 거지."},{"t":"d","g":"표정","x":"하케 = 실린더를 가리키며"},{"t":"l","s":"하케","c":"하케","x":"하나만 일러두지. 이건— 서명한 손에만, 노래하네."},{"t":"l","s":"주군","c":"주군","x":"……서명한 손에만?"},{"t":"d","g":"표정","x":"하케 = 등불을 훅 끄며"},{"t":"l","s":"하케","c":"하케","x":"옛날에도 그걸 찾아온 손님이 하나 있었거든. 몇 밤이고 태엽을 감았지만— 통은 끝내 입을 열지 않았어. …가엾은 일이지. 그 아이는, 서명하는 쪽이 아니라— 서명당하는 쪽이었으니."},{"t":"d","g":"표정","x":"주군 = 실린더를 쥔 손에 힘이 들어간다"},{"t":"l","s":"주군","c":"주군","x":"(———절화의 마녀. '내 손에서는 노래하지 않는다'던 그 여자. 답의 바로 앞까지 왔었다는 건, 이런 뜻이었나.)","m":1},{"t":"d","g":"표정","x":"주군 = 조심스럽게"},{"t":"l","s":"주군","c":"주군","x":"……그 손님은, 그 뒤에 어떻게 됐지."},{"t":"d","g":"표정","x":"하케 = 어둠 속, 곰방대 불씨만 빨갛다"},{"t":"l","s":"하케","c":"하케","x":"어느 밤부터, 안 왔네. 그리고 얼마 뒤에— 도시의 꽃이 하나, 저 혼자 꺾였다는 소문이 돌았지."},{"t":"d","g":"SE","x":"정적 — 풍경도 울지 않는다"},{"t":"l","s":"주군","c":"주군","x":"(………스스로 꺾인 최초의 꽃. 시기가 겹친다. — 답을 눈앞에 두고, 열지 못한 채.)","m":1},{"t":"d","g":"표정","x":"하케 = 담담하게"},{"t":"l","s":"하케","c":"하케","x":"그 뒤로 나는, 이 통을 팔지 않기로 했네. 못 여는 손에 들려 보내는 건— 물건한테도, 손님한테도 몹쓸 짓이라서."},{"t":"l","s":"하케","c":"하케","x":"그러니 잘 듣게. 태엽은 오래전에 죽었어. 내 손으로는 감히 못 건드렸네. 서툰 수리는 홈을 갉아먹으니까. — 고칠 거면, 기계를 아는 손에 맡기게. 단단히 아는 손에."},{"t":"l","s":"주군","c":"주군","x":"……짚이는 손이, 하나 있다."},{"t":"l","s":"하케","c":"하케","x":"그 손한테 전하게. — 서두르되, 서툴지는 말라고. 백 년 기다린 물건은, 하룻밤 더 기다릴 줄도 아니까."},{"t":"l","s":"주군","c":"주군","x":"(하룻밤. …그 하룻밤이 있을지가 문제지만— 그건 이쪽 사정이다.)","m":1},{"t":"d","g":"표정","x":"하케 = 상자 뚜껑을 닫아 건넨다"},{"t":"l","s":"하케","c":"하케","x":"그리고 이건 덤이네. — 통이 노래하기 시작하면, 끝까지 듣게. 도중에 귀를 막고 싶어져도. …오래 기다린 목소리일수록, 하고 싶은 말이 많은 법이니까."},{"t":"l","s":"주군","c":"주군","x":"(끝까지 들어라. ……각오하라는 뜻으로 들리는군.)","m":1},{"t":"l","s":"하케","c":"하케","x":"잘 부탁하네, 계약자 양반. — 이번에야말로, 좋은 손이 주웠기를 바라지."}]},{"id":"p1-e6-s1","title":"17-2. 목공소 — 「어른의 몫」","blocks":[{"t":"d","g":"배경","x":"심야의 목공소 — 화로의 불, 태엽 감는 소리"},{"t":"d","g":"BGM","x":"결전 전야 트랙 (조용한 고양)"},{"t":"d","g":"SE","x":"장비 점검 소리"},{"t":"d","g":"표정","x":"레오나 = 주군에게, 둘만 남은 구석에서"},{"t":"l","s":"레오나","c":"레오나","x":"……계약자 씨. 그 얼굴, 뭔가 찾았죠."},{"t":"d","g":"표정","x":"주군 = 화로 불빛을 등지고 선다"},{"t":"l","s":"주군","c":"주군","x":"……얼굴에 나오나."},{"t":"d","g":"표정","x":"레오나 = 팔짱, 옅게 웃는다"},{"t":"l","s":"레오나","c":"레오나","x":"나와요. 계약자 씨, 포커페이스는 좋은데— 눈이 문제예요. 찾은 사람 눈은, 못 숨겨요."},{"t":"l","s":"주군","c":"주군","x":"베테랑의 관찰안인가."},{"t":"l","s":"레오나","c":"레오나","x":"후배들 얼굴만 십 년 본 관찰안이에요. …그래서요. 뭔데요, 그거."},{"t":"d","g":"표정","x":"주군 = 품에서 낡은 축음기 실린더를 꺼낸다"},{"t":"l","s":"주군","c":"주군","x":"골동품상의 재고 목록에 있더군. '목소리가 든 통'이. — 하케 씨의 말로는, 이 도시가 생기기 전부터 있던 물건이라고 했다."},{"t":"d","g":"표정","x":"레오나 = 숨을 삼킨다"},{"t":"l","s":"레오나","c":"레오나","x":"그게 설마—"},{"t":"l","s":"주군","c":"주군","x":"계약 원문의, 찢긴 마지막 줄. …그 줄을 '들은' 존재의 기록이다. — 하케 씨가, 넘겨주며 한마디를 붙이더군. 「이건, 서명한 손에만 노래하네」."},{"t":"l","s":"주군","c":"주군","x":"아직 재생은 못 했다. 태엽이 죽어 있어서— 쿠로코가 지금 고치고 있다."},{"t":"d","g":"SE","x":"작업대 쪽 — 금속을 다루는 미세한 소리"},{"t":"d","g":"배경","x":"(시선 이동) 작업대 — 스탠드 불빛 아래, 분해된 태엽 기구와 부품이 헝겊 위에 줄지어 있다"},{"t":"d","g":"표정","x":"쿠로코 = 확대경을 낀 채, 돌아보지도 않고"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"거기 둘. 떠들 거면 세 걸음 물러나라. 숨결에 먼지 날린다."},{"t":"d","g":"표정","x":"레오나 = 목소리를 낮춘다"},{"t":"l","s":"레오나","c":"레오나","x":"……고칠 수 있대요?"},{"t":"d","g":"표정","x":"쿠로코 = 핀셋으로 태엽판을 들어 보인다"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"주 태엽, 균열. 감속 톱니 둘, 이 빠짐. 굴대는 살았다. — 못 고칠 물건은 아니다. 문제는 부품이 아니라 시간이지."},{"t":"l","s":"주군","c":"주군","x":"얼마나 걸리지."},{"t":"l","s":"쿠로코","c":"쿠로코","x":"제대로 하면 이레. 밤새우면— 아침."},{"t":"d","g":"표정","x":"레오나 = 숨을 삼킨다"},{"t":"l","s":"레오나","c":"레오나","x":"……밤새울 거죠?"},{"t":"d","g":"표정","x":"쿠로코 = 대답 대신, 확대경을 고쳐 낀다"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"질문이 됐냐, 그게. — 화로에 물 올려라. 긴 밤엔 뜨거운 물이 필요하다."},{"t":"d","g":"표정","x":"주군 = 고개를 숙인다"},{"t":"l","s":"주군","c":"주군","x":"……빚지는군."},{"t":"l","s":"쿠로코","c":"쿠로코","x":"빚 아니다. 죽은 태엽 살리는 건— 목수한테는 그냥, 좋은 일감이다. 저리 가라. 여기부턴 손끝 일이다."},{"t":"d","g":"표정","x":"레오나 = 작게, 주군에게만"},{"t":"l","s":"레오나","c":"레오나","x":"……저 사람, 계약도 안 했는데. 안 무섭냐고 물어봤거든요, 전에."},{"t":"l","s":"주군","c":"주군","x":"뭐라던가."},{"t":"l","s":"레오나","c":"레오나","x":"'밤에 망치 소리 나는 동네가, 조용한 동네보다 안전하다'— 래요. …무슨 뜻인지 반나절 생각했어요."},{"t":"d","g":"표정","x":"와카 = 주군의 어깨 위로 뛰어오른다"},{"t":"l","s":"와카","c":"와카","x":"…그거, 진짜로 찾아냈구나. 그럼— 이것도, 이제 네 몫이야."},{"t":"d","g":"이펙트","x":"와카의 입에서 빛이 흘러나와 — 낡은 두루마리 '원본'이 주군의 손에 나타난다"},{"t":"d","g":"표정","x":"타마 = 짝"},{"t":"l","s":"타마","c":"타마","x":"입회인의 권리, 최종 조항~. 관리자 권한으로— 원본, 인도."},{"t":"l","s":"주군","c":"주군","x":"(보여 주는 게 아니라, 넘겨준다라. — 너희도, 출구를 기다리고 있었던 건가.)","m":1},{"t":"d","g":"표정","x":"와카 = 평소보다 낮은 목소리"},{"t":"l","s":"와카","c":"와카","x":"……오해하지 마. 규칙이 허락해서 주는 게 아니야. 규칙을 '여기까지' 끌고 온 어른이, 처음이라서 주는 거야."},{"t":"d","g":"표정","x":"타마 = 꾸벅"},{"t":"l","s":"타마","c":"타마","x":"입회인 일동~, 이하 동문~."},{"t":"l","s":"주군","c":"주군","x":"……받아 두지. 무게째로."},{"t":"d","g":"표정","x":"레오나 = 이해가 따라잡는다"},{"t":"l","s":"레오나","c":"레오나","x":"서명한 손……. 그럼, [절화의 마녀]가 옛날에 「내 손에서는 노래하지 않는다」고 했다는 게—"},{"t":"l","s":"주군","c":"주군","x":"그래. 그 여자는 답의 바로 앞까지 갔었다. 하지만 그녀는 계약의 '당사자'였지, 입회인이 아니었어. — 이 통은, 처음부터 어른의 몫이었던 거다."},{"t":"d","g":"표정","x":"레오나 = 실린더를 오래 본다"},{"t":"l","s":"레오나","c":"레오나","x":"……그 사람, 어떤 기분이었을까. 답이 든 통을 손에 들고— 몇 밤이나 태엽을 감으면서."},{"t":"l","s":"주군","c":"주군","x":"상상은 해 봤다. 도중에 그만뒀지. — 상상만으로도, 손이 차가워져서."},{"t":"d","g":"표정","x":"레오나 = 화로 쪽으로 손을 뻗는다"},{"t":"l","s":"레오나","c":"레오나","x":"……우리는 열 수 있어요. 이번에는. 그렇죠?"},{"t":"l","s":"주군","c":"주군","x":"연다. 서명한 손은 여기 있고— 태엽은 지금 되살아나는 중이다."},{"t":"d","g":"표정","x":"레오나 = 웃는다 — 이번엔, 제대로 된 웃음"},{"t":"l","s":"레오나","c":"레오나","x":"……역시 계약자 씨는, 눈이 너무 좋아."},{"t":"d","g":"표정","x":"레오나 = 잠깐 망설이다가"},{"t":"l","s":"레오나","c":"레오나","x":"저기. 그때— 그 옥상에서 했던 부탁. 기억해요?"},{"t":"l","s":"주군","c":"주군","x":"'이번에는 아무도 잃지 않는다'. — 잊을 리가."},{"t":"d","g":"표정","x":"레오나 = 무릎 위에서 손가락을 만지작거린다"},{"t":"l","s":"레오나","c":"레오나","x":"……그때 나, 되게 치사한 부탁을 한 거예요. 알고 있었어요?"},{"t":"l","s":"주군","c":"주군","x":"치사하다니."},{"t":"l","s":"레오나","c":"레오나","x":"'아무도'라고 말하면서— 머릿속 명단에, 내 이름은 처음부터 안 넣었거든요. 잃어도 되는 자리에 나를 세워 두면, 계산이 편해지니까. …십 년 내내, 그렇게 계산해 왔으니까."},{"t":"d","g":"표정","x":"주군 = 말없이, 다음 말을 기다린다"},{"t":"l","s":"주군","c":"주군","x":"(………알고 있었다. 알면서도, 본인이 말할 때까지 기다리는 것밖에— 어른이 할 수 있는 게 없었다.)","m":1},{"t":"d","g":"표정","x":"레오나 = 화로의 불을 본다"},{"t":"l","s":"레오나","c":"레오나","x":"……그거, 정정할게요. '아무도'에— 나도 포함시켜 줘요."},{"t":"d","g":"표정","x":"주군 = 처음으로, 그녀의 손끝을 본다 — 꽃잎처럼 옅다"},{"t":"l","s":"주군","c":"주군","x":"(……레오나. 너—)","m":1},{"t":"d","g":"표정","x":"레오나 = 손을 등 뒤로 감춘다, 웃으며"},{"t":"l","s":"레오나","c":"레오나","x":"베테랑은 페이스 조절의 프로라니까요. …그치만, 오늘 밤은 좀 오버 페이스로 갈 거라서. 보험이에요, 보험."},{"t":"d","g":"표정","x":"주군 = 시선을 피하지 않는다"},{"t":"l","s":"주군","c":"주군","x":"……언제부터냐. 손끝이 그렇게 된 게."},{"t":"d","g":"표정","x":"레오나 = 웃음을 유지하려다 — 실패한다"},{"t":"l","s":"레오나","c":"레오나","x":"………성당 앞에서, 조금. 송출탑에서, 조금 더. …펴질 않았는데도 이래요. 웃기죠. 페이스 조절의 프로가."},{"t":"l","s":"주군","c":"주군","x":"웃기지 않다. — 십 년 치의 밤이, 한꺼번에 무게를 얹어 온 것뿐이다."},{"t":"d","g":"표정","x":"레오나 = 고개를 숙인다 — 목소리가 처음으로, 작아진다"},{"t":"l","s":"레오나","c":"레오나","x":"……무서워요, 사실은. 지금까지는, 잃는 게 무서웠는데. 처음으로— 잃어지는 쪽이 될까 봐, 무서워요."},{"t":"l","s":"레오나","c":"레오나","x":"이런 말, 후배들한텐 죽어도 못 해요. 그러니까…… 계약자 씨한테만, 맡겨 둘게요. 이 무서움."},{"t":"d","g":"표정","x":"주군 = 한 박자 — 받아 낸다"},{"t":"l","s":"주군","c":"주군","x":"맡아 두지. 이자는 없다. — 전부 끝나면, 원금 그대로 돌려주마. 그때는 웃으면서 받아라."},{"t":"d","g":"표정","x":"레오나 = 눈가를 훔친다 — 빠르게"},{"t":"l","s":"레오나","c":"레오나","x":"……하, 뭐예요 그거. 은행이에요?"},{"t":"d","g":"표정","x":"주군 = 정면으로"},{"t":"l","s":"주군","c":"주군","x":"— 약속하지. 아무도 잃지 않는다. 너를 포함해서. …그러니 너도 약속해라. 쓰러지기 전에, 반드시 소리를 내겠다고."},{"t":"d","g":"표정","x":"레오나 = 한 박자 → 끄덕"},{"t":"l","s":"레오나","c":"레오나","x":"………네. 약속."},{"t":"d","g":"SE","x":"작업대 — 태엽 감기는 소리가, 반 바퀴 돌다 멎는다"},{"t":"d","g":"표정","x":"쿠로코 = 손등으로 이마를 훔친다"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"……동력부, 절반 살았다. 소리 내는 쪽은 아직이다. — 날 밝기 전엔 끝낸다. 잠이나 자 둬라, 둘 다."},{"t":"d","g":"표정","x":"레오나 = 자리에서 일어나며"},{"t":"l","s":"레오나","c":"레오나","x":"……물, 더 올릴게요. 긴 밤이니까."},{"t":"d","g":"표정","x":"쿠로코 = 등을 보인 채"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"진하게 타라. 설탕은 빼고."},{"t":"l","s":"주군","c":"주군","x":"(무뚝뚝한 등이, 밤을 새워 출구의 태엽을 감고 있다. — 계약도 마법도 없이. …이 도시의 어른들도, 지지 않았다.)","m":1},{"t":"n","x":"이제 — 흩어진 아이들을, 다시 부를 시간이었다. 시든다는 걸 알면서도, 와 줄 아이들이다."},{"t":"n","x":"그렇다면 어른의 일은 하나다. — 저 낡은 실린더 속의, 마지막 줄이다."},{"t":"l","s":"주군","c":"주군","x":"(쿠로코, 부탁한다. 태엽 하나에— 이 밤의 출구가 걸려 있다.)","m":1}]}]},{"id":"p1-e7","title":"18화 「만개」","scenes":[{"id":"p1-e7-s0","title":"18-1. 시계탑 — 「최종 결계 기동」","blocks":[{"t":"d","g":"배경","x":"시계탑 상공 — 하얀 실금이 하늘 전체를 뒤덮고, 도시가 어스름에 잠긴다"},{"t":"d","g":"BGM","x":"마녀 테마 풀 오케스트라 (왈츠 → 진혼곡)"},{"t":"d","g":"SE","x":"시계탑의 종 — 열두 번"},{"t":"d","g":"이펙트","x":"하늘이 꽃봉오리처럼 '닫히기' 시작"},{"t":"n","x":"그 밤, 도시의 하늘이 통째로 꽃잎이 되었다."},{"t":"n","x":"처음 알아차린 것은, 별이었다. 하나, 또 하나— 밤하늘의 별이 하얀 실금 뒤로 지워져 갔다. 사람들은 그것을 구름이라고 생각했다. 구름이, 아니었다."},{"t":"d","g":"표정","x":"와카 = 주군의 어깨 위, 하늘을 올려다본다"},{"t":"l","s":"와카","c":"와카","x":"……계약자. 하늘, 봐. — 별이, 안 보여."},{"t":"d","g":"표정","x":"타마 = 귀를 쭈뼛 세운다"},{"t":"l","s":"타마","c":"타마","x":"구름 아니야~……. 저거, 전부…… 꽃잎이야."},{"t":"d","g":"표정","x":"주군 = 거리 한복판에서 걸음을 멈춘다"},{"t":"l","s":"주군","c":"주군","x":"(실금이— 자라는 게 아니다. 오므라들고 있다. 도시의 하늘 전체가, 하나의 거대한 꽃봉오리처럼.)","m":1},{"t":"d","g":"SE","x":"웅성임 — 사람들이 하나둘, 하늘을 올려다본다"},{"t":"d","g":"표정","x":"행인A = 하늘을 본 채  ※19-1에 재등장 — 동일 인물"},{"t":"l","s":"행인A","c":"행인A","x":"……예쁘네. 무섭다고 해야 하는 건데, 그 말이 안 나와."},{"t":"l","s":"행인B","c":"행인B","x":"뉴스에서 그러던데. 저게 다 닫히면— 밤이 안 온대. 결계도, 그 애들 싸움도, 전부."},{"t":"d","g":"표정","x":"행인A = 하늘에서 눈을 못 뗀다"},{"t":"l","s":"행인A","c":"행인A","x":"……그럼 됐잖아. 안 그래? 애들이 저러고 다니는 것보다야."},{"t":"l","s":"행인B","c":"행인B","x":"……그치. 이대로 멈추면, 적어도— 더 다치는 애는, 없는 거잖아."},{"t":"d","g":"표정","x":"주군 = 그 목소리를 듣는다"},{"t":"l","s":"주군","c":"주군","x":"(………방금 그건, 마녀가 한 말이 아니다.)","m":1},{"t":"d","g":"표정","x":"와카 = 목소리가 낮아진다"},{"t":"l","s":"와카","c":"와카","x":"계약자…… 저거, 다 닫히면— 어떻게 되는 거야?"},{"t":"d","g":"표정","x":"주군 = 하늘에서 눈을 떼지 않은 채"},{"t":"l","s":"주군","c":"주군","x":"닫히게 두지 않는다. — 그 얘기는, 그걸로 끝이다."},{"t":"d","g":"표정","x":"타마 = 꼬리를 만다"},{"t":"l","s":"타마","c":"타마","x":"……끝이래. 든든한 건지, 무서운 건지~……."},{"t":"d","g":"표정","x":"료(통신) = 무전, 숨 가쁘게"},{"t":"l","s":"료","c":"료","x":"「계약자 씨, 들리세요?! 관측 계기 전부 일치— 도시 외곽의 실금은 봉합 완료, 상공의 실금은 한 점을 향해 수렴 개시예요!」"},{"t":"l","s":"주군","c":"주군","x":"수렴점은 어디냐."},{"t":"l","s":"료","c":"료","x":"「시계탑— 아뇨, 정확히는 시계탑 '바로 위'요. 하늘의, 정중앙이에요.」"},{"t":"d","g":"SE","x":"시계탑의 종 — 한 번"},{"t":"n","x":"종이 울리기 시작했다. 자정을 알리는 열두 번의— 그 첫 번째가."},{"t":"d","g":"표정","x":"뮤게 = 시계탑 첨탑, 선언"},{"t":"l","s":"뮤게","c":"치사","x":"최종 결계— 『만개』. 기동인 것이와요."},{"t":"d","g":"표정","x":"뮤게 = 부채를 크게 펼친다"},{"t":"l","s":"뮤게","c":"치사","x":"골조 전개율, 십 할! 외주 봉합, 완료! 이 몸의 설계에— 오차는 한 치도 없는 것이와요!"},{"t":"d","g":"표정","x":"이리스 = 첨탑의 나선 계단을, 천천히 올라온다"},{"t":"l","s":"이리스","c":"아야메","x":"……수고했어요, 뮤게. 정말— 훌륭한 결계예요."},{"t":"d","g":"표정","x":"뮤게 = 부채가 한 박자, 멈춘다"},{"t":"l","s":"뮤게","c":"치사","x":"……! 다, 당연한 것이와요. 이 몸의— 최고 걸작인 것이와요."},{"t":"d","g":"표정","x":"이리스 = 미소"},{"t":"l","s":"이리스","c":"아야메","x":"네. 알아요. 이 정원에서 제일 성실한 손이, 접은 하늘인걸요. — 그러니 마지막 꽃잎도, 당신 손으로 접어 주세요."},{"t":"d","g":"표정","x":"뮤게 = 깊이, 고개를 숙인다"},{"t":"l","s":"뮤게","c":"치사","x":"……분부, 받드는 것이와요. — 자, 최종 공정! 개시인 것이와요!"},{"t":"d","g":"표정","x":"뮤게 = 첨탑 가장자리에서, 도시를 굽어본다"},{"t":"l","s":"뮤게","c":"치사","x":"꽃잎 매수, 십이만 사천 장! 접합부는 전부, 이 몸이 손수 붙인 것이와요! 걸작을— 기계 따위에 맡길 수는 없는 것이와요!"},{"t":"d","g":"표정","x":"이리스 = 그 옆에 선다"},{"t":"l","s":"이리스","c":"아야메","x":"후후. …그 한 장 한 장을, 오늘 밤 전부 닫는 거예요. 이 도시에서 제일 큰— 꽃다발처럼."},{"t":"d","g":"표정","x":"뮤게 = 부채를 가슴에 댄다"},{"t":"l","s":"뮤게","c":"치사","x":"역사에 남는 것이와요. …아니— 역사째로, 액자에 넣는 것이와요."},{"t":"d","g":"SE","x":"시계탑의 종 — 네 번째"},{"t":"d","g":"표정","x":"이리스 = 첨탑 최상부, 팔을 벌린다"},{"t":"l","s":"이리스","c":"아야메","x":"여러분. …오래 기다리셨어요."},{"t":"n","x":"그 목소리는 확성기도 전파도 없이— 결계의 실금을 타고, 도시의 구석구석까지 스며들었다. 골목에서, 광장에서, 닫힌 창문 안에서. 모두가, 같은 목소리를 들었다."},{"t":"d","g":"이펙트","x":"도시 전역의 하얀 실금이 일제히 빛난다 — 하늘이 안쪽으로 말려들기 시작"},{"t":"n","x":"도시가, 비명을 질렀다."},{"t":"d","g":"표정","x":"료(통신) = 다급하게"},{"t":"l","s":"료","c":"료","x":"「시가지 전역, 목격 보고 폭주! 사람들이 거리로 쏟아져 나오고 있어요— 대로가 막히면, 압사가 나요!」"},{"t":"d","g":"표정","x":"레오나(통신) = 무전에 끼어든다"},{"t":"l","s":"레오나","c":"레오나","x":"「전원, 들어요! 지금부터 대피 유도 최우선! 싸움은— 그다음이에요!」"},{"t":"d","g":"표정","x":"쿠로코(통신) = 둔탁하게"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"「목공소 셔터, 전부 열었다. 지하 창고에 삼백은 들어간다. — 오늘 밤은, 자재비도 임대료도 없다.」"},{"t":"d","g":"표정","x":"타이가(통신) = 평소의 어조 그대로"},{"t":"l","s":"타이가","c":"타이가","x":"「학생회장 권한으로, 강당과 체육관을 개방합니다~. 야간 개방 허가요? …그런 건, 내일 아침의 제가 혼나면 되는 일이랍니다.」"},{"t":"d","g":"표정","x":"쥬리(통신) = 끼어든다"},{"t":"l","s":"쥬리","c":"쥬리","x":"「회장~ 체육관 조명, 전부 켜 줘! 어두우면 다들 더 무서워하니까☆」"},{"t":"d","g":"표정","x":"타이가(통신) = 웃음기"},{"t":"l","s":"타이가","c":"타이가","x":"「이미 켰답니다~. 무대 조명이라고, 생각해 주세요.」"},{"t":"d","g":"표정","x":"료(통신) = 빠르게"},{"t":"l","s":"료","c":"료","x":"「동쪽 다리, 정체 시작! 누가 광장 쪽 흐름을 정리해 줘요— 사람이 사람을 밀고 있어요!」"},{"t":"d","g":"표정","x":"쥬리(통신) = 숨을 고르며"},{"t":"l","s":"쥬리","c":"쥬리","x":"「쥬리땅, 광장 나갈게! 다리는 아직 이 모양이지만— 목소리는 만전이거든☆」"},{"t":"d","g":"표정","x":"레오나(통신) = 한순간 멈칫"},{"t":"l","s":"레오나","c":"레오나","x":"「쥬리……. 무리하지 마요. 당신은, 아직—」"},{"t":"d","g":"표정","x":"쥬리(통신) = 웃는다"},{"t":"l","s":"쥬리","c":"쥬리","x":"「무리 아냐, 무대야. — 별은 떨어져도 별이라구, 리더☆」"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(변신도 못 하는 몸으로, 제일 먼저 손을 든다. ……이 아이들의 용기에는, 바닥이 없다.)","m":1},{"t":"n","x":"광장 쪽에서, 노랫소리가 올라왔다. 마시로였다. 뜀박질이던 사람들의 발이— 조금씩, 걸음으로 돌아왔다."},{"t":"d","g":"표정","x":"마시로(통신) = 노래의 사이, 짧게"},{"t":"l","s":"마시로","c":"마시로","x":"「……광장은 괜찮아요. 무서워해도 괜찮다고— 계속, 노래하고 있을게요.」"},{"t":"d","g":"표정","x":"세나(통신) = 담담하게"},{"t":"l","s":"세나","c":"세나","x":"「찻집, 문 열어 뒀어. 골목 안쪽 사람들은 이리로 보내. …오늘은, 찻값도 안 받아.」"},{"t":"d","g":"표정","x":"료(통신) = 확인"},{"t":"l","s":"료","c":"료","x":"「쿠로코 씨, 지하 창고 환기는요? 삼백 명이면, 공기가—」"},{"t":"d","g":"표정","x":"쿠로코(통신) = 짧게"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"「뚫어 놨다. 이쪽은 목수다— 사람 들일 곳에는, 숨구멍부터 낸다.」"},{"t":"d","g":"표정","x":"와카 = 털이 곤두선다"},{"t":"l","s":"와카","c":"와카","x":"계약자, 저거— 하늘이, 덮여! 가장자리부터!"},{"t":"d","g":"표정","x":"타마 = 떨리는 목소리"},{"t":"l","s":"타마","c":"타마","x":"별이…… 다, 없어져……."},{"t":"d","g":"SE","x":"시계탑의 종 — 여덟 번째"},{"t":"d","g":"표정","x":"이리스 = 도망치는 거리의 불빛들을, 내려다본다"},{"t":"l","s":"이리스","c":"아야메","x":"……도망치지 않아도 돼요. 아프게 하지 않아요. 무섭게 하지도 않을 거예요."},{"t":"d","g":"표정","x":"이리스 = 노래하듯"},{"t":"l","s":"이리스","c":"아야메","x":"다들, 충분히 아름다워졌어요. 웃는 얼굴도, 우는 얼굴도, 오늘 밤의 노래도— 전부, 지금이 가장 아름다워요."},{"t":"l","s":"이리스","c":"아야메","x":"그러니 시들기 전에. …세계째로, 잘라 드릴게요."},{"t":"d","g":"표정","x":"뮤게 = 부채를 내리친다"},{"t":"l","s":"뮤게","c":"치사","x":"봉오리, 제일 접합— 개시인 것이와요!"},{"t":"d","g":"이펙트","x":"하늘의 가장자리부터, 거대한 꽃잎이 도시 위로 '접혀' 내려온다"},{"t":"d","g":"표정","x":"뮤게 = 첨탑 위, 도취된 웃음"},{"t":"l","s":"뮤게","c":"치사","x":"아─하하하핫! 보는 것이와요, 이 완성도! 역사상 누구도 접지 못한 하늘을, 이 몸이 접는 것이와요!"},{"t":"d","g":"표정","x":"이리스 = 조용히"},{"t":"l","s":"이리스","c":"아야메","x":"……곧, 그 아이들이 오겠네요."},{"t":"d","g":"표정","x":"뮤게 = 부채로 입가를 가린다"},{"t":"l","s":"뮤게","c":"치사","x":"오게 두는 것이와요. 어차피 코어의 문 앞에는— 이 몸이 서 있을 테니까요."},{"t":"d","g":"표정","x":"이리스 = 눈을 감는다"},{"t":"l","s":"이리스","c":"아야메","x":"죽이지는 마세요, 뮤게. 꽃은 꺾는 게 아니라— 자르는 거예요. 제일, 아름다운 순간에."},{"t":"d","g":"표정","x":"뮤게 = 부채를 접으며"},{"t":"l","s":"뮤게","c":"치사","x":"……분부대로, 인 것이와요."},{"t":"d","g":"표정","x":"이리스 = 다시, 도시를 향해"},{"t":"l","s":"이리스","c":"아야메","x":"……자, 다 함께 잠들 준비를 해요. 오늘 밤의 당신들은— 어제까지의 당신들보다, 아름다우니까."},{"t":"d","g":"표정","x":"료(통신) = 다급"},{"t":"l","s":"료","c":"료","x":"「전 구역 관측 이상! 이 결계, 도시를 '가두는' 게 아니에요— 도시 전체를 억지로 '피우고' 있어요! 사람도, 거리도, 전부— 만개점 쪽으로 떠밀리고 있어요!」"},{"t":"d","g":"표정","x":"주군 = 무전기를 고쳐 쥔다"},{"t":"l","s":"주군","c":"주군","x":"료. 떠밀리는 속도는."},{"t":"l","s":"료","c":"료","x":"「계산 중— ……빨라요. 이대로면, 날이 밝기 전에 도시 전체가 만개점을 넘어요.」"},{"t":"d","g":"표정","x":"쿠로코(통신) = 낮게"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"「……그럼 밤새 버티면 되는 거군. 알기 쉬워서 좋다.」"},{"t":"d","g":"표정","x":"타이가(통신) = 부드럽게, 그러나 또렷하게"},{"t":"l","s":"타이가","c":"타이가","x":"「여러분~. 무서운 밤일수록, 할 일은 단순한 법이랍니다. …모여서, 정하고, 갑시다.」"},{"t":"d","g":"표정","x":"레오나(통신) = 숨을 들이쉰다"},{"t":"l","s":"레오나","c":"레오나","x":"「……전원. 대피 유도가 일단락되는 대로— 목공소로. 총원, 집합이에요.」"},{"t":"d","g":"표정","x":"주군 = 무전기에, 짧게"},{"t":"l","s":"주군","c":"주군","x":"레오나. — 먼저 가 있지. 챙길 게, 하나 있다."},{"t":"d","g":"표정","x":"레오나(통신) = 한 박자 → 부드럽게"},{"t":"l","s":"레오나","c":"레오나","x":"「……네. 기다릴게요, 계약자 씨.」"},{"t":"d","g":"표정","x":"와카 = 주군의 옷깃을 꼭 붙든다"},{"t":"l","s":"와카","c":"와카","x":"……계약자. 실린더, 갖고 있지?"},{"t":"l","s":"주군","c":"주군","x":"품에 있다. — 떨어뜨릴 생각은 없다."},{"t":"d","g":"SE","x":"시계탑의 종 — 열두 번째. 그리고, 정적"},{"t":"d","g":"표정","x":"주군 = 하늘을 노려본다"},{"t":"l","s":"주군","c":"주군","x":"(도시를 통째로 만개점 너머로 미는 술식. — 전원이 가장 아름다워진 순간에, 세계째 자른다. 그게 저 여자의 '자비'인가……!)","m":1}]},{"id":"p1-e7-s1","title":"18-2. 목공소 — 「재집결」","blocks":[{"t":"d","g":"배경","x":"목공소 — 불이 다시 켜진다"},{"t":"d","g":"BGM","x":"결전 전야 트랙 (조용한 고양)"},{"t":"d","g":"SE","x":"문이 벌컥 열리는 소리, 장비 점검 소리"},{"t":"d","g":"SE","x":"목공소의 문이 벌컥 열린다"},{"t":"d","g":"표정","x":"레오나 = 중앙에 선다"},{"t":"l","s":"레오나","c":"레오나","x":"— 총원, 집합!"},{"t":"n","x":"목공소에 다시 불이 켜졌다. 흩어졌던 발소리들이, 하나씩 돌아왔다."},{"t":"d","g":"표정","x":"쿠로코 = 작업대에서 고개도 들지 않고"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"늦었군. 방벽 자재는 벌써 세 번째 트럭이다."},{"t":"d","g":"표정","x":"료 = 모니터 앞, 지도를 펼친다"},{"t":"l","s":"료","c":"료","x":"대피 유도, 팔 할 완료예요. 남은 문제는— 코어까지 가는 길이에요."},{"t":"d","g":"SE","x":"문 — 두 번째로, 벌컥"},{"t":"d","g":"표정","x":"네네링 = 붕대 차림, 숨을 몰아쉬며"},{"t":"l","s":"네네링","c":"네네","x":"하아, 하아…… 세이프! 이 몸, 지각 아니지?!"},{"t":"d","g":"표정","x":"히땅 = 그 뒤에서, 하품을 씹으며"},{"t":"l","s":"히땅","c":"히스이","x":"……아웃이야. 병원 창문으로 나온 주제에."},{"t":"d","g":"표정","x":"레오나 = 눈썹이 올라간다"},{"t":"l","s":"레오나","c":"레오나","x":"창문?! 네네, 당신 그 몸으로—"},{"t":"d","g":"표정","x":"네네링 = 붕대 감긴 팔을 붕붕 휘두른다"},{"t":"l","s":"네네링","c":"네네","x":"다 나았어! 거의! 팔 할쯤! …아, 아프긴 한데, 그건 지금 중요한 게 아니고!"},{"t":"d","g":"표정","x":"엔마루 = 문가에서, 조용히 등불을 밝힌다"},{"t":"l","s":"엔마루","c":"엔마","x":"……전원의 얼굴이 한 등불에 비치는 밤. 이 광경을 다시 보게 되리라고는— 예언하지 못했습니다."},{"t":"d","g":"표정","x":"쥬리 = 목발을 짚고, 그래도 포즈"},{"t":"l","s":"쥬리","c":"쥬리","x":"늦어서 미안☆ 광장 무대 세팅에 시간이 걸려서~. …다들, 얼굴 보니까 좋다."},{"t":"d","g":"표정","x":"네네링 = 쥬리에게 달려간다"},{"t":"l","s":"네네링","c":"네네","x":"쥬리땅! 다리는?! 이제 괜찮은 거야?!"},{"t":"d","g":"표정","x":"쥬리 = 목발을 빙글 돌린다"},{"t":"l","s":"쥬리","c":"쥬리","x":"삼분의 이쯤☆ …나머지 삼분의 일은, 기합으로 채우는 중!"},{"t":"d","g":"표정","x":"타이가 = 찻주전자를 들고 돌아다닌다"},{"t":"l","s":"타이가","c":"타이가","x":"자아, 우선 한 잔씩 드세요~. 쫓기는 밤일수록, 차는 천천히— 랍니다."},{"t":"d","g":"표정","x":"네네링 = 잔을 받으며"},{"t":"l","s":"네네링","c":"네네","x":"회장, 이런 때까지 차야?!"},{"t":"d","g":"표정","x":"타이가 = 생긋"},{"t":"l","s":"타이가","c":"타이가","x":"이런 때일수록, 랍니다. 손이 떨리는 사람이 있는지— 잔을 보면 알 수 있거든요."},{"t":"d","g":"표정","x":"치코링 = 주군의 옆에서, 모두를 둘러본다"},{"t":"l","s":"치코링","c":"치코","x":"……다, 다들……."},{"t":"d","g":"표정","x":"레오나 = 둘러본다"},{"t":"l","s":"레오나","c":"레오나","x":"[여명], [선풍]— 그리고 걸을 수 있는 사람, 전부. …와 줬구나."},{"t":"d","g":"표정","x":"네네링 = 붕대 차림으로 제일 먼저 손을 든다"},{"t":"l","s":"네네링","c":"네네","x":"당연히 포함이지! 이 몸의 제일 빛나는 순간, 아직 안 보여 줬거든!"},{"t":"d","g":"표정","x":"레오나 = 잠깐, 말문이 막힌다"},{"t":"l","s":"레오나","c":"레오나","x":"……네네. 그 붕대로 '제일 빛나는' 걸 하면— 상처, 벌어져요."},{"t":"d","g":"표정","x":"네네링 = 씩 웃는다"},{"t":"l","s":"네네링","c":"네네","x":"벌어지면 또 감으면 되지! 이 몸이 무서운 건 상처가 아니야— 제일 빛나는 순간을, 침대 위에서 놓치는 거야!"},{"t":"d","g":"표정","x":"히땅 = 네네링의 머리를 꾹 누른다"},{"t":"l","s":"히땅","c":"히스이","x":"……무리하면, 바람으로 묶어서 돌려보낼 거야."},{"t":"d","g":"표정","x":"네네링 = 버둥거린다"},{"t":"l","s":"네네링","c":"네네","x":"하, 할 수 있으면 해 보시지!"},{"t":"d","g":"표정","x":"히땅 = 기지개"},{"t":"l","s":"히땅","c":"히스이","x":"……하암. 폭풍, 깨울 시간이네."},{"t":"d","g":"표정","x":"치코링 = 작게 웃는다"},{"t":"l","s":"치코링","c":"치코","x":"히, 히땅. …그 말, 기다렸어."},{"t":"d","g":"표정","x":"히땅 = 어깨를 으쓱"},{"t":"l","s":"히땅","c":"히스이","x":"……밀린 잠, 오늘로 사흘 치. 끝나면 몰아서 잘 거야. — 아무도 못 깨움."},{"t":"d","g":"표정","x":"쿠로코 = 피식"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"그 낮잠용 침대는 내가 짜 주지. — 목수의 보증이 붙는다."},{"t":"d","g":"표정","x":"엔마루 = 등불을 챙긴다"},{"t":"l","s":"엔마루","c":"엔마","x":"이 밤을 기억하는 것이, 저의 역할. — 전원, 살아서 기억되어 주세요."},{"t":"d","g":"표정","x":"쥬리 = 등불을 들여다본다"},{"t":"l","s":"쥬리","c":"쥬리","x":"엔마루의 등불이 있으면~ 백 년 뒤에도 오늘 밤이 남는 거지?"},{"t":"d","g":"표정","x":"엔마루 = 끄덕인다"},{"t":"l","s":"엔마루","c":"엔마","x":"네. 등불은 거짓을 비추지 않습니다. …그러니 부디— 비추기에 부끄럽지 않은 밤이 되기를."},{"t":"d","g":"표정","x":"료 = 지도를 확대한다"},{"t":"l","s":"료","c":"료","x":"브리핑할게요. 결계 코어는 시계탑 직하— 진입로는 세 개였는데, 두 개는 이미 꽃잎에 먹혔어요. 남은 건 중앙 대로, 하나뿐이에요."},{"t":"d","g":"표정","x":"네네링 = 지도를 들여다본다"},{"t":"l","s":"네네링","c":"네네","x":"하나면 충분해! 길은 좁을수록— 이 몸의 빛이 잘 보이거든!"},{"t":"d","g":"표정","x":"료 = 안경을 고쳐 쓴다"},{"t":"l","s":"료","c":"료","x":"……든든한데, 작전은 끝까지 들어 주세요. 부탁이니까."},{"t":"d","g":"표정","x":"쿠로코 = 도면을 겹쳐 놓는다"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"그 대로에 이동 방벽을 열두 장 깐다. 전진할 때마다 한 장씩 버리는 소모식이다. — 아깝다고 돌아보지 마라."},{"t":"d","g":"표정","x":"타이가 = 손을 든다"},{"t":"l","s":"타이가","c":"타이가","x":"학교 옥상에 중계기를 놔뒀답니다~. 무전은 끝까지 제가 이어 드릴게요. 회장은 원래— 말을 전하는 게 일이니까요."},{"t":"d","g":"표정","x":"레오나 = 고개를 숙인다"},{"t":"l","s":"레오나","c":"레오나","x":"……고마워요, 회장. 매번— 등을 맡기네."},{"t":"d","g":"표정","x":"타이가 = 찻잔을 들어 올린다"},{"t":"l","s":"타이가","c":"타이가","x":"이자는, 졸업식 때 눈물로 받겠답니다~."},{"t":"d","g":"표정","x":"쥬리 = 확성기를 두드린다"},{"t":"l","s":"쥬리","c":"쥬리","x":"쥬리땅은 광장! 대피 제2진 유도 담당☆ …싸움엔 못 끼지만, 무대 뒤도 무대거든."},{"t":"d","g":"표정","x":"마시로 = 조용히 고개를 숙인다"},{"t":"l","s":"마시로","c":"마시로","x":"저는 광장에서, 계속 노래할게요. …여러분이 돌아올 곳의 소리를, 꺼뜨리지 않도록."},{"t":"d","g":"표정","x":"세나 = 문가에 서 있다 — 안으로는 들어오지 않는다"},{"t":"l","s":"세나","c":"세나","x":"……차, 가져왔어. 식기 전에 마셔. — 치코 양."},{"t":"d","g":"표정","x":"치코링 = 돌아본다"},{"t":"l","s":"치코링","c":"치코","x":"세, 세나 씨……."},{"t":"d","g":"표정","x":"세나 = 짧게"},{"t":"l","s":"세나","c":"세나","x":"세 번째 답. …찾았으면, 보여 주고 오렴. 나는 여기서— 돌아올 자리나 데워 두지."},{"t":"d","g":"표정","x":"치코링 = 깊이, 고개를 숙인다"},{"t":"l","s":"치코링","c":"치코","x":"……네. 다, 다녀오겠습니다."},{"t":"d","g":"표정","x":"주군 = 실린더를 탁자 위에 올린다"},{"t":"l","s":"주군","c":"주군","x":"— 다들 모였으니, 어른 쪽의 몫도 말해 두지. 계약 원문의, 찢긴 마지막 줄. 그 줄을 '들은' 기록이— 이 안에 있다."},{"t":"d","g":"표정","x":"와카 = 탁자 위로 폴짝 뛰어오른다"},{"t":"l","s":"와카","c":"와카","x":"태엽은 쿠로코가 살려냈어. 그치만 이 통, 노래하는 건— 서명한 손 앞에서, 한 번뿐일 거야."},{"t":"d","g":"표정","x":"타마 = 드물게, 진지하게"},{"t":"l","s":"타마","c":"타마","x":"한 번뿐~……. 그러니까, 제일 필요한 순간에."},{"t":"d","g":"표정","x":"쿠로코 = 무뚝뚝하게"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"태엽은 살렸다. 하지만 낡았어. 험하게 다루면 두 번은 없다— 품에서 꺼내는 건, 마지막의 마지막으로 해라."},{"t":"d","g":"표정","x":"주군 = 끄덕인다"},{"t":"l","s":"주군","c":"주군","x":"알고 있다. …좋은 일을 해 줬다, 쿠로코."},{"t":"d","g":"표정","x":"레오나 = 전원을 둘러본다"},{"t":"l","s":"레오나","c":"레오나","x":"그러니까 우리의 일은, 하나예요. 계약자 씨와 이 실린더를— 코어의 문 앞까지, 살려서 보내는 것."},{"t":"d","g":"표정","x":"네네링 = 손을 번쩍 든다"},{"t":"l","s":"네네링","c":"네네","x":"좋아, 쉽네! 이 몸이 제일 앞에서 제일 밝게 빛나면 되는 거지!"},{"t":"d","g":"표정","x":"히땅 = 무심하게"},{"t":"l","s":"히땅","c":"히스이","x":"……그거, 과녁이 되겠다는 소리야."},{"t":"d","g":"표정","x":"네네링 = 당당하게"},{"t":"l","s":"네네링","c":"네네","x":"알고 하는 소리다!"},{"t":"d","g":"표정","x":"엔마루 = 등불을 가슴 앞에 든다"},{"t":"l","s":"엔마루","c":"엔마","x":"……하나만, 말해 두겠습니다. 오늘 밤 우리는 이기러 가는 것이 아닙니다. — 그 말을, 전원이 잊지 않기를."},{"t":"d","g":"표정","x":"레오나 = 끄덕인다"},{"t":"l","s":"레오나","c":"레오나","x":"네. 이건— '이기지 않을 방법'을, 문 앞까지 데려다주는 싸움이에요."},{"t":"d","g":"표정","x":"주군 = 치코링의 앞에 선다"},{"t":"l","s":"주군","c":"주군","x":"치코. …마지막으로 확인한다. 코어의 문 앞에서, 마녀와 마주 서는 건— 너다. 할 수 있겠나."},{"t":"d","g":"표정","x":"치코링 = 손바닥을 편다 — 떨림이, 없다"},{"t":"l","s":"치코링","c":"치코","x":"……계약자 님. 저, 지금요. 손이— 안 떨려요."},{"t":"l","s":"치코링","c":"치코","x":"무, 무섭지 않은 게 아니에요. 무서운데…… 오늘 밤 무서운 것보다, 하고 싶은 게 더 커요. 처, 처음으로요."},{"t":"d","g":"표정","x":"레오나 = 웃는다"},{"t":"l","s":"레오나","c":"레오나","x":"……그럼 됐어. 그게— 대장의 얼굴이야."},{"t":"d","g":"표정","x":"쥬리 = 확성기를 들어 올린다"},{"t":"l","s":"쥬리","c":"쥬리","x":"그럼~ 개막 선언은 쥬리땅이 할게☆ …오늘 밤의 무대, 전원 주연! 앙코르는— 내일 아침에!"},{"t":"d","g":"표정","x":"치코링 = 고개를 끄덕인다 (떨림이, 멎어 있다)"},{"t":"l","s":"치코링","c":"치코","x":"…가요. 다 같이."}]}]},{"id":"p1-e8","title":"19화 「모든 꽃들」","scenes":[{"id":"p1-e8-s0","title":"19-1. 도시 전역 — 「총력전」","blocks":[{"t":"d","g":"배경","x":"닫혀 가는 꽃잎 하늘 아래의 도시 — 결계 코어(시계탑)로 향하는 진격로"},{"t":"d","g":"BGM","x":"총력전 트랙 (전 테마 메들리)"},{"t":"d","g":"SE","x":"폭음, 바람, 무전 교신"},{"t":"n","x":"총력전이었다."},{"t":"n","x":"이 도시의 모든 소녀가, 각자의 밤을 등에 지고— 꽃잎의 하늘 아래 섰다."},{"t":"d","g":"표정","x":"료(통신) = 개전 신호"},{"t":"l","s":"료","c":"료","x":"「전 회선, 개방. 중계는 학교 옥상— 감도 양호. …시작해요.」"},{"t":"d","g":"표정","x":"레오나(통신) = 낮고, 뜨겁게"},{"t":"l","s":"레오나","c":"레오나","x":"「전원— 진격 개시. 대피는 계속, 길은 앞으로만. 갑니다!」"},{"t":"d","g":"표정","x":"네네링(통신) = 외침"},{"t":"l","s":"네네링","c":"네네","x":"「[섬화], 준비 완료! 제일 앞!」"},{"t":"d","g":"표정","x":"히땅(통신) = 하품 섞인 목소리"},{"t":"l","s":"히땅","c":"히스이","x":"「[선풍]…… 기상 완료. 마지못해.」"},{"t":"d","g":"표정","x":"엔마루(통신) = 조용히"},{"t":"l","s":"엔마루","c":"엔마","x":"「[윤회]— 등불, 점화했습니다.」"},{"t":"d","g":"표정","x":"치코링(통신) = 또렷하게"},{"t":"l","s":"치코링","c":"치코","x":"「[여명]…… 가, 갑니다!」"},{"t":"d","g":"SE","x":"대로의 폭음 — 첫 번째 방벽이 전개된다"},{"t":"d","g":"표정","x":"쿠로코 = 바리케이드 위에서"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"방벽 최종 보강 완료! 부술 거면 지금 다 부숴라— 오늘은 자재비 청구 안 한다!"},{"t":"d","g":"표정","x":"료(통신) = 담담하게, 빠르게"},{"t":"l","s":"료","c":"료","x":"「제1방벽, 접촉! 버티는 시간, 사십 초— 그 사이에 이백 미터 전진해요!」"},{"t":"d","g":"표정","x":"쿠로코 = 망치를 어깨에 걸친다"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"사십 초면 충분하다. …내 못질은, 사십 초짜리가 아니거든."},{"t":"d","g":"표정","x":"료(통신) = 카운트"},{"t":"l","s":"료","c":"료","x":"「삼십 초…… 이십 초…… — 제2방벽으로, 이동!」"},{"t":"d","g":"표정","x":"쿠로코 = 뛰어내리며"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"다음! 못 세 개면 벽 하나다— 아직, 서른여섯 개 남았다!"},{"t":"d","g":"SE","x":"꽃잎의 격류가 방벽을 삼킨다 — 한 장, 버려진다"},{"t":"d","g":"표정","x":"료(통신) = 연속 교신"},{"t":"l","s":"료","c":"료","x":"「결계 코어까지의 경로, 3번 갱신. 서둘러요— 꽃잎이 닫히는 속도가 빨라졌어요!」"},{"t":"d","g":"표정","x":"레오나(통신) = 달리면서"},{"t":"l","s":"레오나","c":"레오나","x":"「료, 다음 갈림길은?!」"},{"t":"d","g":"표정","x":"료(통신) = 즉답"},{"t":"l","s":"료","c":"료","x":"「우측! 좌측 골목은 삼 분 전에 꽃잎이 먹었어요— 지도는 제가 계속 다시 그릴게요. 여러분은, 달리기만 해요!」"},{"t":"d","g":"표정","x":"치코링(통신) = 달리며"},{"t":"l","s":"치코링","c":"치코","x":"고, 고마워요, 료 씨! 길, 믿을게요!"},{"t":"d","g":"표정","x":"타이가(통신) = 태연"},{"t":"l","s":"타이가","c":"타이가","x":"「학생회장으로서 공지합니다~. 오늘 밤 야간 외출은, 전원 공결 처리랍니다. …그러니 마음 놓고, 다녀오세요.」"},{"t":"d","g":"표정","x":"네네링(통신) = 달리며, 웃음"},{"t":"l","s":"네네링","c":"네네","x":"「회장! 이 몸, 지각 기록도 지워 줘!」"},{"t":"d","g":"표정","x":"타이가(통신) = 능청스럽게"},{"t":"l","s":"타이가","c":"타이가","x":"「그건 등교해서 직접 교섭하시죠~. — 살아서, 반드시.」"},{"t":"d","g":"표정","x":"히땅(통신) = 툭"},{"t":"l","s":"히땅","c":"히스이","x":"「……결석계, 나도. 내일 아침 거.」"},{"t":"d","g":"표정","x":"타이가(통신) = 한숨 섞인 웃음"},{"t":"l","s":"타이가","c":"타이가","x":"「욕심쟁이들뿐이네요, 우리 학교는~.」"},{"t":"d","g":"표정","x":"쥬리 = 광장, 목발을 짚고 확성기를 든다"},{"t":"l","s":"쥬리","c":"쥬리","x":"자~ 다들 이쪽! 대피 경로는 쥬리땅이 안내할게☆ 넘어지지 말고, 뛰지 말고— 오늘 밤은, 쥬리땅의 마지막 무대거든!"},{"t":"d","g":"SE","x":"광장의 술렁임 — 아이 우는 소리"},{"t":"d","g":"표정","x":"쥬리 = 확성기를 내리고, 목발째 무릎을 굽힌다"},{"t":"l","s":"쥬리","c":"쥬리","x":"아이고~ 울보 발견☆ 자, 손. …그렇지. 쥬리땅 손은 마이크 잡던 손이라, 꽉 잡는 건 프로거든."},{"t":"d","g":"표정","x":"쥬리 = 다시 확성기를 든다"},{"t":"l","s":"쥬리","c":"쥬리","x":"무서운 사람~! 손 들어! …좋아, 솔직해서 백 점! 무서우면 옆 사람 손을 잡아! 그게 오늘 밤의 안무야☆"},{"t":"d","g":"SE","x":"광장의 사람들이, 하나둘 손을 잡는다"},{"t":"d","g":"표정","x":"쥬리 = 꽃잎의 하늘을 등지고"},{"t":"l","s":"쥬리","c":"쥬리","x":"하늘이 무섭게 굴어도~ 무대는 이쪽이야! 시선은 쥬리땅한테☆ …그래, 그거야! 전원, 백 점!"},{"t":"d","g":"표정","x":"쥬리 = 확성기를 내린 채, 작게"},{"t":"l","s":"쥬리","c":"쥬리","x":"(……전원, 데리고 돌아와. 앙코르는— 다 같이 하는 거니까.)"},{"t":"n","x":"변신은 없었다. 목발과 확성기뿐이었다. 그런데도 사람들은— 그 목소리를 따라 움직였다. 별은, 떨어져도 별이었다."},{"t":"n","x":"광장 안쪽에서는 마시로의 노래가, 찻집 앞에서는 세나가 내미는 따뜻한 잔이— 도망쳐 온 사람들의 등을, 조용히 받치고 있었다."},{"t":"d","g":"표정","x":"마시로(통신) = 노래의 사이, 한마디"},{"t":"l","s":"마시로","c":"마시로","x":"「……광장, 이상 없어요. 노래, 이어 갈게요.」"},{"t":"d","g":"표정","x":"세나(통신) = 짧게"},{"t":"l","s":"세나","c":"세나","x":"「이쪽도. — 앞은 부탁해.」"},{"t":"n","x":"진격로의 요소요소에는 들장미 넝쿨이 — 가시 없는 넝쿨이, 명줄처럼 드리워져 있었다. 언제 자란 것인지는, 아무도 몰랐다. 다만 그것은 단 한 번도, 아무도 묶지 않았다."},{"t":"d","g":"표정","x":"치코링 = 달리며, 넝쿨을 스치듯 어루만진다"},{"t":"l","s":"치코링","c":"치코","x":"……고, 고마워요."},{"t":"d","g":"표정","x":"히땅 = 곁눈질"},{"t":"l","s":"히땅","c":"히스이","x":"……누구한테 한 인사야?"},{"t":"d","g":"표정","x":"치코링 = 앞을 본 채, 작게 웃는다"},{"t":"l","s":"치코링","c":"치코","x":"비, 비밀."},{"t":"d","g":"이펙트","x":"진격 몽타주 — 섬화가 길을 열고, 선풍이 파편을 걷어내고, 윤회의 등불이 어둠을 밝힌다"},{"t":"d","g":"표정","x":"엔마루 = 등불을 높이 든다"},{"t":"l","s":"엔마루","c":"엔마","x":"길이 어두운 것은, 두려워할 일이 아닙니다. — 등불은, 이런 밤을 위해 있으니."},{"t":"d","g":"표정","x":"치코링 = 달리며, 곁눈질"},{"t":"l","s":"치코링","c":"치코","x":"엔, 엔마루! 등불— 흔들리는데, 괜찮아?!"},{"t":"d","g":"표정","x":"엔마루 = 흔들림 없이"},{"t":"l","s":"엔마루","c":"엔마","x":"등불은 흔들리는 것입니다. — 흔들리며, 꺼지지 않는 것. 그것이 오늘 밤의 예언입니다."},{"t":"d","g":"표정","x":"레오나 = 최전선, 홍련 전개"},{"t":"l","s":"레오나","c":"레오나","x":"정면, 꽃잎 장벽! — 태워서 열게요, 뒤로 붙어요!"},{"t":"d","g":"표정","x":"료(통신) = 경고"},{"t":"l","s":"료","c":"료","x":"「레오나 씨, 출력 페이스가 너무 빨라요! 그 페이스면 코어 전에—」"},{"t":"d","g":"표정","x":"레오나(통신) = 웃으며"},{"t":"l","s":"레오나","c":"레오나","x":"「알아요. …보험은 들어 뒀거든요. 소리, 내기로 약속했으니까.」"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(홍련의 출력이, 눈에 띄게 올라가 있다. — 레오나. 약속을 잊지 마라. 쓰러지기 전에, 반드시 소리를 내라.)","m":1},{"t":"d","g":"표정","x":"네네링 = 최전열, 활짝"},{"t":"l","s":"네네링","c":"네네","x":"봐라, 이게 이 몸의 제일 밝은 거다아아——!!"},{"t":"d","g":"이펙트","x":"섬화의 대폭발 — 밤이 한순간, 한낮이 된다"},{"t":"d","g":"표정","x":"네네링 = 숨을 몰아쉬며, 그래도 웃는다"},{"t":"l","s":"네네링","c":"네네","x":"하아, 하아…… 어때! 붕대 감고도 이 정도라구!"},{"t":"d","g":"표정","x":"히땅 = 옆에 착지한다"},{"t":"l","s":"히땅","c":"히스이","x":"……무리하지 마. 다음 벽은, 내 차례."},{"t":"d","g":"표정","x":"네네링 = 씩 웃는다"},{"t":"l","s":"네네링","c":"네네","x":"순서 양보라니, 웬일이야?!"},{"t":"d","g":"표정","x":"히땅 = 앞을 본 채"},{"t":"l","s":"히땅","c":"히스이","x":"……양보 아냐. 분담."},{"t":"d","g":"표정","x":"히땅 = 눈을 뜬다 (졸음기 없음)"},{"t":"l","s":"히땅","c":"히스이","x":"——폭풍, 기상."},{"t":"d","g":"이펙트","x":"나선 폭풍이 꽃잎의 장벽을 뚫는다"},{"t":"d","g":"표정","x":"히땅 = 낮게"},{"t":"l","s":"히땅","c":"히스이","x":"……진로, 개통. 지나가."},{"t":"d","g":"표정","x":"레오나(통신) = 호령"},{"t":"l","s":"레오나","c":"레오나","x":"「전원, 통과! 멈추지 마요— 등 뒤는, 서로가 봐요!」"},{"t":"d","g":"표정","x":"치코링(통신) = 달리며"},{"t":"l","s":"치코링","c":"치코","x":"「네!」"},{"t":"d","g":"표정","x":"쿠로코(통신) = 보고"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"「방벽 잔량, 다섯 장! 중간 지점은 넘겼다— 아끼지 말고 써라!」"},{"t":"d","g":"표정","x":"료(통신) = 목소리가 굳는다"},{"t":"l","s":"료","c":"료","x":"「……전원, 주의. 코어 반경 오백, 꽃잎 밀도가— 계산이 안 돼요. 여기서부터는, 지도 밖이에요.」"},{"t":"d","g":"표정","x":"치코링 = 숨을 삼키고, 그래도"},{"t":"l","s":"치코링","c":"치코","x":"……가, 가요. 지도 밖이어도— 방향은, 알고 있으니까."},{"t":"d","g":"표정","x":"네네링 = 웃는다"},{"t":"l","s":"네네링","c":"네네","x":"지도 밖이라니, 최고잖아! 아무도 못 가 본 데서 빛나는 게— 제일 눈에 띈다구!"},{"t":"d","g":"표정","x":"엔마루 = 등불을 앞세운다"},{"t":"l","s":"엔마루","c":"엔마","x":"지도에 없는 길은, 오늘 밤 우리가 그리는 것입니다. — 등불이, 먼저 갑니다."},{"t":"n","x":"그리고— 도시가 통째로 만개점에 떠밀리자, 이 거리에 새겨져 있던 것들까지가 깨어났다."},{"t":"n","x":"무너지는 첨탑 사이로, 금빛 섬광이 지나갔다. 전설이라던 [태양의 소녀]의 잔광이. 실체인지 메아리인지— 아무도 묻지 않았다. 물을 필요가, 없었다."},{"t":"d","g":"표정","x":"네네링 = 눈을 크게 뜬다"},{"t":"l","s":"네네링","c":"네네","x":"지, 지금 거— 금색……!"},{"t":"d","g":"표정","x":"히땅 = 앞을 본 채"},{"t":"l","s":"히땅","c":"히스이","x":"……묻지 마. 그냥— 고마워해."},{"t":"d","g":"표정","x":"레오나 = 금빛의 궤적을 좇는다 — 한순간"},{"t":"l","s":"레오나","c":"레오나","x":"(……저 빛. 어디서, 본 적이…….)"},{"t":"d","g":"표정","x":"료(통신) = 떨리는 목소리"},{"t":"l","s":"료","c":"료","x":"「지금 거…… 관측 불능이에요. 기록에 없는— 아뇨. …기록, 안 할게요. 그냥— 고마운 빛으로 둘게요.」"},{"t":"n","x":"그 빛을 좇는 달빛 하나가, 말없이 아이들의 퇴로를 지켰다. 그쪽은— 메아리가 아니었다."},{"t":"d","g":"표정","x":"아카네(월광) = 스치듯, 낮게"},{"t":"l","s":"아카네","c":"아카네","x":"……앞만 봐. 뒤는, 달이 본다."},{"t":"d","g":"표정","x":"치코링 = 돌아보려다, 멈춘다"},{"t":"l","s":"치코링","c":"치코","x":"아……!"},{"t":"d","g":"표정","x":"아카네(월광) = 이미 어둠 속으로"},{"t":"l","s":"아카네","c":"아카네","x":"……가. 밤은, 짧아."},{"t":"d","g":"표정","x":"치코링 = 앞을 향해 외친다"},{"t":"l","s":"치코링","c":"치코","x":"가, 감사합니다……! 전부, 전부 빌릴게요……! — 이 앞은, 제가 갈게요!"},{"t":"d","g":"표정","x":"레오나(통신) = 보고"},{"t":"l","s":"레오나","c":"레오나","x":"「선두, 시계탑 직하 도달! 코어 입구— 보여요!」"},{"t":"d","g":"표정","x":"쿠로코(통신) = 마지막 보고"},{"t":"l","s":"쿠로코","c":"쿠로코","x":"「방벽, 마지막 한 장— 입구에 박아 뒀다. 돌아올 때의 문이다. …반드시 써라.」"},{"t":"d","g":"표정","x":"타이가(통신) = 조용히"},{"t":"l","s":"타이가","c":"타이가","x":"「전원의 공결 처리, 완료했답니다. — 그러니 내일은, 전원 등교예요.」"},{"t":"d","g":"표정","x":"료(통신) = 조용히"},{"t":"l","s":"료","c":"료","x":"「……여기서부터는, 무전이 안 닿아요. 전파가 아니라— 마음으로 이어 둘게요. 다녀오세요.」"},{"t":"d","g":"SE","x":"거리 — 창문이 하나씩, 열리는 소리"},{"t":"n","x":"시계탑으로 향하는 길 양쪽에 불이 켜졌다. 닫힌 하늘 아래에서, 사람들이 창을 열고 있었다."},{"t":"d","g":"표정","x":"행인A = 창밖으로, 어색하게  ※18-1의 그 사람"},{"t":"l","s":"행인A","c":"행인A","x":"……저기! 그, 뭐냐…… 조심해서, 가!"},{"t":"l","s":"행인B","c":"행인B","x":"우리는 여기 있을게! 어디 안 가! 여기서, 기다릴 테니까—!"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(모든 꽃이 한 방향을 봤다. 정원이 아니라— 내일을.)","m":1}]},{"id":"p1-e8-s1","title":"19-2. 시계탑 아래 — 「최후의 문」","blocks":[{"t":"d","g":"배경","x":"시계탑 직하 — 거대한 꽃봉오리 형태의 결계 코어 입구"},{"t":"d","g":"BGM","x":"메들리 → 뚝, 정적"},{"t":"d","g":"SE","x":"심장 박동"},{"t":"n","x":"시계탑 아래. 결계 코어의 문 앞에서— 조화의 마녀가 기다리고 있었다."},{"t":"n","x":"폭음이 멀어졌다. 여기만— 거짓말처럼, 조용했다."},{"t":"d","g":"표정","x":"레오나 = 후미를 막아선다"},{"t":"l","s":"레오나","c":"레오나","x":"후방은 내가 봐요. — 앞은, 맡길게."},{"t":"d","g":"표정","x":"네네링 = 주위를 둘러본다"},{"t":"l","s":"네네링","c":"네네","x":"……조용해. 너무, 조용한데."},{"t":"d","g":"표정","x":"히땅 = 낮게"},{"t":"l","s":"히땅","c":"히스이","x":"……심장 소리가, 들릴 정도로."},{"t":"d","g":"표정","x":"엔마루 = 등불을 든 채"},{"t":"l","s":"엔마루","c":"엔마","x":"폭풍의 눈입니다. — 이 앞이, 이 밤의 한가운데."},{"t":"d","g":"표정","x":"뮤게 = 문을 등지고"},{"t":"l","s":"뮤게","c":"치사","x":"여기서부터는, 못 지나가는 것이와요. 이 몸의 최고 걸작— 그 심장부인 것이와요."},{"t":"d","g":"이펙트","x":"하얀 조화의 꽃잎이 소용돌이치며, 문 앞에 겹겹의 방벽을 짠다"},{"t":"d","g":"표정","x":"네네링 = 한 발 나서려 한다"},{"t":"l","s":"네네링","c":"네네","x":"비켜! 부수고 갈—"},{"t":"d","g":"표정","x":"치코링 = 팔을 들어, 막는다"},{"t":"l","s":"치코링","c":"치코","x":"네, 네네링. …안 돼. 여, 여기는— 부수는 곳이 아니야."},{"t":"d","g":"표정","x":"히땅 = 조용히 물러선다"},{"t":"l","s":"히땅","c":"히스이","x":"……알았어. 대장 말대로."},{"t":"d","g":"표정","x":"치코링 = 앞으로 나선다"},{"t":"l","s":"치코링","c":"치코","x":"뮤, 뮤게 씨! 비켜 주세요! 이 앞에 있는 사람을— 마, 말리러 가야 해요!"},{"t":"d","g":"표정","x":"뮤게 = 부채를 편다 (손이 떨린다)"},{"t":"l","s":"뮤게","c":"치사","x":"말린다? 이리스 님을? …우, 웃기는 것이와요! 저분의 계획은 완벽— 이 몸의 결계도 완벽— 완벽한 것들이 완벽하게……."},{"t":"d","g":"표정","x":"뮤게 = 목소리가 커진다"},{"t":"l","s":"뮤게","c":"치사","x":"완벽하게, 아름답게 끝나는 것이와요! 그것이 최선— 그것이 정답— 채점은 이미 끝난 것이와요!"},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다"},{"t":"l","s":"치코링","c":"치코","x":"끝, 끝나는 게 정답인 시험이…… 이, 있을 리 없어요."},{"t":"d","g":"표정","x":"뮤게 = 코웃음"},{"t":"l","s":"뮤게","c":"치사","x":"있는 것이와요! 미완성은 감점— 미완의 꽃은 낙제인 것이와요! 이 몸은 낙제 따위, 두 번 다시—"},{"t":"d","g":"표정","x":"뮤게 = 말이, 뚝 끊긴다"},{"t":"l","s":"뮤게","c":"치사","x":"……………."},{"t":"d","g":"표정","x":"치코링 = 조용히"},{"t":"l","s":"치코링","c":"치코","x":"……두 번, 다시?"},{"t":"d","g":"표정","x":"뮤게 = 부채로 얼굴을 가린다"},{"t":"l","s":"뮤게","c":"치사","x":"마, 말꼬리 잡기는 무례한 것이와요!"},{"t":"d","g":"표정","x":"치코링 = 조용히"},{"t":"l","s":"치코링","c":"치코","x":"……채점은, 누가 하는데요?"},{"t":"d","g":"표정","x":"뮤게 = 부채가 흔들린다"},{"t":"l","s":"뮤게","c":"치사","x":"그, 그야— 이리스 님이…… 세계가…… 보, 보는 눈이 있는 모두가, 인 것이와요!"},{"t":"d","g":"표정","x":"치코링 = 한 박자, 그리고"},{"t":"l","s":"치코링","c":"치코","x":"……그, 그 사람들이 채점을 안 해 주면— 당신의 결계는, 걸작이 아니게 되는 건가요?"},{"t":"d","g":"표정","x":"뮤게 = 부채가 크게 흔들린다"},{"t":"l","s":"뮤게","c":"치사","x":"다, 당연…… 당연한 것…… 이와요……."},{"t":"d","g":"표정","x":"히땅 = 조용히"},{"t":"l","s":"히땅","c":"히스이","x":"……손, 떨리는데."},{"t":"d","g":"표정","x":"뮤게 = 움찔"},{"t":"l","s":"뮤게","c":"치사","x":"떨, 떨리지 않는 것이와요!"},{"t":"d","g":"표정","x":"네네링 = 팔짱을 낀다"},{"t":"l","s":"네네링","c":"네네","x":"떨리고 있잖아. 부채 끝, 아까부터 계속. — 이 몸, 그런 건 잘 보이거든."},{"t":"d","g":"표정","x":"뮤게 = 부채를 홱 고쳐 쥔다"},{"t":"l","s":"뮤게","c":"치사","x":"시, 시끄러운 것이와요! 이 몸은 [조화의 마녀]— 시들지 않는 완성품인 것이와요!"},{"t":"d","g":"표정","x":"치코링 = 슬프게"},{"t":"l","s":"치코링","c":"치코","x":"……와, 완성품은요. 더는, 안 자라요. 시들지 않는 대신— 피지도, 않아요."},{"t":"d","g":"표정","x":"뮤게 = 움찔"},{"t":"l","s":"뮤게","c":"치사","x":"…………그, 그것이 어떻다는 것이와요."},{"t":"d","g":"표정","x":"치코링 = 또렷하게"},{"t":"l","s":"치코링","c":"치코","x":"만, 만든 사람이 그걸— 제일 잘 알고 있을 거라고, 생각해서요."},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다"},{"t":"l","s":"치코링","c":"치코","x":"……예, 예전에 물었죠. 당신도, 마법소녀였냐고."},{"t":"d","g":"표정","x":"뮤게 = 반사적으로"},{"t":"l","s":"뮤게","c":"치사","x":"옛날 얘기는— 촌스러운 것이와요!"},{"t":"d","g":"표정","x":"치코링 = 물러서지 않는다"},{"t":"l","s":"치코링","c":"치코","x":"초, 촌스러워도 물을게요. 몇 번이라도요. …그, 그 대답을, 아직 못 들었으니까."},{"t":"d","g":"표정","x":"뮤게 = 부채 너머, 목소리가 낮아진다"},{"t":"l","s":"뮤게","c":"치사","x":"………듣고 싶은 것이와요? 촌스럽고, 시시하고— 아무도 박수치지 않았던, 옛날 얘기 따위를."},{"t":"d","g":"표정","x":"치코링 = 끄덕인다"},{"t":"l","s":"치코링","c":"치코","x":"드, 듣고 싶어요. 박수도, 칠 거예요."},{"t":"d","g":"표정","x":"뮤게 = 흠칫 — 부채를 고쳐 쥔다"},{"t":"l","s":"뮤게","c":"치사","x":"……!! 지, 지금은 근무 중인 것이와요! 잡담 금지인 것이와요!"},{"t":"d","g":"표정","x":"치코링 = 한 발 다가선다"},{"t":"l","s":"치코링","c":"치코","x":"뮤게 씨. …저, 저는 알아요. 당신의 매듭이 풀리면— 당신도, 사라져 버릴지도 몰라요. 성당의 그 사람처럼. 탑의 그 사람처럼."},{"t":"d","g":"표정","x":"뮤게 = 숨을 삼킨다"},{"t":"l","s":"뮤게","c":"치사","x":"……그, 그걸 알면서— 왜, 오는 것이와요."},{"t":"l","s":"치코링","c":"치코","x":"그, 그래도— 만나러 왔어요. 사라지는 게 무서워서 못 만나는 건…… 이제, 안 하기로 했으니까."},{"t":"d","g":"표정","x":"뮤게 = 부채 너머의 눈이, 흔들린다"},{"t":"l","s":"뮤게","c":"치사","x":"………이해, 불능인 것이와요. 그런 건— 설계도에, 없는 것이와요."},{"t":"d","g":"표정","x":"치코링 = 작게 웃는다"},{"t":"l","s":"치코링","c":"치코","x":"서, 설계도에 없는 걸, 하러 왔어요. 오늘 밤은— 다들, 그래요."},{"t":"l","s":"치코링","c":"치코","x":"그러니까 하나만 물을게요. 그 결계, 정말 '걸작'이라고 생각하세요?"},{"t":"d","g":"표정","x":"뮤게 = 정지"},{"t":"l","s":"뮤게","c":"치사","x":"……무, 슨."},{"t":"d","g":"표정","x":"치코링 = 똑바로"},{"t":"l","s":"치코링","c":"치코","x":"저, 결계 안쪽 봤어요. 설계가…… 서, 성실했어요. 무너지는 데 없이, 구석까지 꼼꼼하게. …그, 그런 걸 만드는 사람이, 세계를 끝내는 데 쓰라고 만들었을 리 없어요."},{"t":"d","g":"표정","x":"뮤게 = 뒷걸음질 반 보"},{"t":"l","s":"뮤게","c":"치사","x":"다, 닥치는 것이와요……. 그 이상은……."},{"t":"l","s":"치코링","c":"치코","x":"그건— 누, 누가 봐 줬으면 해서, 만든 거잖아요. 잘 만들었다고, 한마디…… 들었으면 해서."},{"t":"d","g":"SE","x":"부채가 떨어진다"},{"t":"d","g":"표정","x":"뮤게 = 그 자리에 못 박힌다"},{"t":"l","s":"뮤게","c":"치사","x":"……………이 몸, 은……."},{"t":"n","x":"가면이 벗겨진 것은 아니었다. 다만 처음으로— 가면 아래의, 숨소리가 들렸다."},{"t":"d","g":"표정","x":"치코링 = 아주 작게, 그러나 또렷하게"},{"t":"l","s":"치코링","c":"치코","x":"……자, 잘 만들었어요. 정말로요. — 그, 그러니까 이런 데 쓰게 두고 싶지 않은 거예요."},{"t":"d","g":"표정","x":"[황혼] = 어느새 문 옆에 서 있다"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"— 지나가. 문은 내가 잡고 있을게."},{"t":"d","g":"표정","x":"주군 = 놀란다"},{"t":"l","s":"주군","c":"주군","x":"너— 언제부터."},{"t":"d","g":"표정","x":"[황혼] = 문에 손을 대며"},{"t":"l","s":"[황혼]","c":"[황혼]","x":"처음부터. …그쪽이 종이를 안 태우는 거, 끝까지 봤으니까. 이번엔 내가 보여 줄 차례야."},{"t":"d","g":"표정","x":"레오나 = 짧게 눈을 맞춘다"},{"t":"l","s":"레오나","c":"레오나","x":"……고마워. 부탁할게."},{"t":"d","g":"표정","x":"[황혼] = 대답 대신, 문에 몸을 기댄다"},{"t":"d","g":"표정","x":"와카 = 주군의 어깨 위에서, 낮게"},{"t":"l","s":"와카","c":"와카","x":"……계약자. 저 애가 문을 잡는 동안— 이 앞은, 되돌아올 길이 없어."},{"t":"d","g":"표정","x":"주군 = 끄덕인다"},{"t":"l","s":"주군","c":"주군","x":"알고 있다. — 처음부터, 되돌아올 생각으로 온 길이 아니다."},{"t":"d","g":"표정","x":"네네링 = 문 안쪽의 어둠을 노려본다"},{"t":"l","s":"네네링","c":"네네","x":"이 몸도 간다! 대장만 보낼 수는 없지— 전원, 이라고 했잖아!"},{"t":"d","g":"표정","x":"히땅 = 끄덕인다"},{"t":"l","s":"히땅","c":"히스이","x":"……전원. 그게, 조건이었어."},{"t":"d","g":"표정","x":"레오나 = 치코링의 어깨에, 손을 얹는다"},{"t":"l","s":"레오나","c":"레오나","x":"가자. — 전원이, 전원인 채로."},{"t":"d","g":"표정","x":"치코링 = 못 박힌 채인 뮤게에게, 마지막으로"},{"t":"l","s":"치코링","c":"치코","x":"뮤게 씨. 다, 다녀올게요. …그리고 돌아와서— 그 결계 얘기, 더 듣고 싶어요. 어, 어디가 제일 어려웠는지, 어디가 제일 자신 있는지…… 저, 전부요."},{"t":"d","g":"표정","x":"뮤게 = 움직이지 않는다 — 떨어진 부채를, 줍지 못한다"},{"t":"l","s":"뮤게","c":"치사","x":"………………."},{"t":"d","g":"표정","x":"네네링 = 지나치며, 툭"},{"t":"l","s":"네네링","c":"네네","x":"……부채, 주워 놔. 대답할 거면— 살아 있으라구."},{"t":"d","g":"표정","x":"히땅 = 지나치며, 짧게"},{"t":"l","s":"히땅","c":"히스이","x":"……설계는, 나쁘지 않았어."},{"t":"d","g":"표정","x":"엔마루 = 등불을 들어, 계단을 비춘다"},{"t":"l","s":"엔마루","c":"엔마","x":"……기록하겠습니다. 이 문이 열린 밤을— 그리고, 열어 준 이를."},{"t":"n","x":"문이 열렸다. 꽃봉오리의 심장으로 이어지는— 꽃잎의 계단이."},{"t":"n","x":"치코링이 앞장섰다. 나는 그 등을 따라 걸었다. 실린더를, 품에 안고."},{"t":"d","g":"표정","x":"타마 = 주군의 품 안에서, 속삭이듯"},{"t":"l","s":"타마","c":"타마","x":"……심장 소리, 들려. 통 안에서— 노래가, 깨고 싶어 해."},{"t":"d","g":"표정","x":"와카 = 조용히"},{"t":"l","s":"와카","c":"와카","x":"……계약자. 무슨 일이 있어도— 그 손, 놓지 마."},{"t":"l","s":"주군","c":"주군","x":"(쿠로코가 살려낸 태엽. 이 안에 뭐가 들었든— 이제 되돌릴 수 없는 곳까지 왔다.)","m":1}]}]},{"id":"p1-e9","title":"20화 「씨앗의 답」","scenes":[{"id":"p1-e9-s0","title":"20-1. 꽃봉오리의 심장 — 「문답」","blocks":[{"t":"d","g":"배경","x":"결계 코어 내부 — 거대한 꽃의 중심, 꽃잎이 천천히 닫혀 가는 하늘"},{"t":"d","g":"BGM","x":"마녀 테마와 여명 테마가 대위법으로 얽힌다"},{"t":"d","g":"SE","x":"꽃잎이 닫히는 소리 (멀리서, 계속)"},{"t":"n","x":"꽃잎의 중심에서— 마녀와 소녀가 마주 섰다."},{"t":"n","x":"넓었다. 꽃의 안쪽이라고는 믿기지 않을 만큼. 머리 위에서는 하늘의 꽃잎이, 아주 천천히— 오므라들고 있었다."},{"t":"d","g":"표정","x":"이리스 = 온화하게"},{"t":"l","s":"이리스","c":"아야메","x":"…와 버렸네요. 여기까지."},{"t":"d","g":"표정","x":"이리스 = 일행을 천천히 둘러본다"},{"t":"l","s":"이리스","c":"아야메","x":"상처투성이네요, 다들. …그런데도, 그렇게 예쁘게 피어서. — 정말, 못 말리는 아이들."},{"t":"d","g":"표정","x":"이리스 = 미소"},{"t":"l","s":"이리스","c":"아야메","x":"차라도 내드리고 싶은데— 여기엔, 꽃밖에 없네요."},{"t":"d","g":"표정","x":"네네링 = 으르렁거린다"},{"t":"l","s":"네네링","c":"네네","x":"누가 마녀의 차를—"},{"t":"d","g":"표정","x":"히땅 = 소매를 잡는다"},{"t":"l","s":"히땅","c":"히스이","x":"……참아. 지금은— 말의 싸움이야."},{"t":"d","g":"표정","x":"레오나 = 치코링의 반보 뒤에 선다"},{"t":"l","s":"레오나","c":"레오나","x":"……치코. 여기부터는— 당신의 무대야. 우리는, 안 넘어져."},{"t":"d","g":"표정","x":"네네링 = 이를 악문다"},{"t":"l","s":"네네링","c":"네네","x":"……이 몸, 참을게. 참는 거다. 대장이 말로 한댔으니까."},{"t":"d","g":"표정","x":"치코링 = 무기를 들지 않는다"},{"t":"l","s":"치코링","c":"치코","x":"이, 이리스 씨. 그만두세요. 이런 거— 다들, 바라지 않아요."},{"t":"d","g":"표정","x":"이리스 = 천천히 고개를 젓는다"},{"t":"l","s":"이리스","c":"아야메","x":"어째서 거부하나요. 가장 아름다운 순간에 끝나는 것이— 자비인데."},{"t":"d","g":"표정","x":"치코링 = 한 발 나선다"},{"t":"l","s":"치코링","c":"치코","x":"사, 사람들은 도망치면서도— 서로 손을 잡았어요. 우는 아이를 업고, 모르는 사람한테 어깨를 빌려줬어요. …사, 살고 싶어 해요, 다들!"},{"t":"d","g":"표정","x":"이리스 = 다정하게, 그러나 단호하게"},{"t":"l","s":"이리스","c":"아야메","x":"네. 살고 싶어 하죠. — 시든 적이, 없으니까요."},{"t":"l","s":"이리스","c":"아야메","x":"살고 싶다는 말은, 시듦을 모르는 사람의 말이에요. 시들어 본 사람은— 그 말을, 그렇게 쉽게 못 해요."},{"t":"d","g":"표정","x":"치코링 = 반박한다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그럼— 시들어 본 사람은, 전부 당신처럼 생각하나요? 아, 아니잖아요. 다, 다르게 생각한 사람도, 있었잖아요!"},{"t":"d","g":"표정","x":"이리스 = 부드럽게"},{"t":"l","s":"이리스","c":"아야메","x":"다르게 생각한 아이들이 어디로 갔는지— 이제, 아시잖아요."},{"t":"d","g":"표정","x":"치코링 = 주먹을 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"가, 간 곳이 어디든— 그 사람들이 '틀렸다'는 건, 아니에요."},{"t":"d","g":"표정","x":"이리스 = 눈을 내리깐다"},{"t":"l","s":"이리스","c":"아야메","x":"틀리지 않았죠. 다만— 닿지 못했을 뿐. …닿지 못하는 길을, 아이들에게 또 걷게 할 건가요?"},{"t":"d","g":"표정","x":"이리스 = 시선이 멀어진다"},{"t":"l","s":"이리스","c":"아야메","x":"시들어 가는 모습을, 나는 봤어요. 몇 번이고. 제일 빛나던 아이가, 조금씩 바래고, 흐려지고, 마지막에는— 자기가 누구였는지도 잊어요. …그걸 알고도, 시들 때까지 살라고 하는 게 다정함인가요?"},{"t":"d","g":"표정","x":"이리스 = 손끝으로, 허공의 꽃잎을 어루만진다"},{"t":"l","s":"이리스","c":"아야메","x":"좋아하던 노래를 잊어요. 함께 웃던 얼굴을 잊어요. 마지막에는, 거울 속의 자신에게— '누구세요'라고 물어요. …나는 그 옆에, 끝까지 앉아 있었어요."},{"t":"d","g":"표정","x":"치코링 = 목소리가 떨린다"},{"t":"l","s":"치코링","c":"치코","x":"……끝, 끝까지 옆에 앉아 있었던 거잖아요. 그, 그건— 그 사람의 마지막이, 혼자가 아니었다는 거잖아요."},{"t":"d","g":"표정","x":"이리스 = 한순간, 말이 늦는다"},{"t":"l","s":"이리스","c":"아야메","x":"………그게, 무슨 의미가 있죠. 그 아이는 나를— 기억하지도 못했는데."},{"t":"d","g":"표정","x":"치코링 = 똑바로"},{"t":"l","s":"치코링","c":"치코","x":"이, 있어요. 기억 못 해도— 무섭지 않았을 거예요. 모르는 사람이라도, 옆에 있어 주는 사람이 다정하다는 건…… 아, 알 수 있으니까요."},{"t":"d","g":"표정","x":"이리스 = 눈을 가늘게 뜬다"},{"t":"l","s":"이리스","c":"아야메","x":"……착한 아이네요, 정말. — 그래서, 더 아까워요."},{"t":"d","g":"표정","x":"치코링 = 주먹을 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그치만— 곁에 있는 사람이, 기억해요! 잊어버려도, 잊혀지는 게 아니에요!"},{"t":"d","g":"표정","x":"이리스 = 조용히 고개를 젓는다"},{"t":"l","s":"이리스","c":"아야메","x":"기억되는 것과 살아 있는 것은, 달라요. 남는 건 추억이 아니라— 남겨진 사람의, 상처예요."},{"t":"l","s":"이리스","c":"아야메","x":"만개 직전에 '멈춘' 아이가, 그 뒤로 어떻게 사는지 아나요? …차갑게 식은 채로, 수십 년을 살아요. 자기만 살아남았다는 겨울 속에서. — 그것도, 내가 본 것 중 하나예요."},{"t":"d","g":"표정","x":"치코링 = 떨리는 목소리로, 그래도"},{"t":"l","s":"치코링","c":"치코","x":"……세, 세나 씨는— 겨울 속에서도, 저희한테 길을 줬어요! 차를 데워 주고, 세 번째 답을 찾으라고…… 그, 그건 시든 사람이 아니에요!"},{"t":"d","g":"표정","x":"이리스 = 아주 잠깐, 눈이 흔들린다 → 다시 고요해진다"},{"t":"l","s":"이리스","c":"아야메","x":"………그 아이다운 일이네요. …하지만, 그러니까 더더욱— 그런 겨울을, 더 만들면 안 되는 거예요."},{"t":"d","g":"표정","x":"치코링 = 물러서지 않는다"},{"t":"l","s":"치코링","c":"치코","x":"겨, 겨울을 없애는 방법이— 왜, 봄을 없애는 것뿐인가요! 겨, 겨울을 같이 나는 방법도, 있잖아요!"},{"t":"d","g":"표정","x":"이리스 = 조용히"},{"t":"l","s":"이리스","c":"아야메","x":"……같이 나 줄 사람도, 언젠가 시들어요. 그다음 겨울은— 누가 나 주죠?"},{"t":"d","g":"표정","x":"치코링 = 말문이 막힌다 — 그러나 눈은 피하지 않는다"},{"t":"l","s":"치코링","c":"치코","x":"……그, 그건…… 그다음의, 누군가가…… 이, 있을 거예요……."},{"t":"d","g":"표정","x":"이리스 = 슬프게 웃는다"},{"t":"l","s":"이리스","c":"아야메","x":"'있을 거예요'로— 아이들의 밤을 지킬 수는 없어요. 나는, '반드시'를 드리는 거예요."},{"t":"d","g":"표정","x":"이리스 = 조용히, 결정타를 놓는다"},{"t":"l","s":"이리스","c":"아야메","x":"그리고— 보셨잖아요? 성당에서. 탑에서. 매듭이 풀린 아이들이, 어떻게 됐는지."},{"t":"l","s":"이리스","c":"아야메","x":"구원은, 소멸이에요. 당신들이 그토록 찾던 '다른 길'의 끝이 그거예요. 이 세계에 출구는 없어요. — 그러니, 가장 아름다운 순간에 자르는 것만이 자비인 거예요. 이제는, 당신들도 알 텐데요."},{"t":"d","g":"표정","x":"이리스 = 한 발, 다가온다"},{"t":"l","s":"이리스","c":"아야메","x":"대답해 보세요, 여명의 아이. 그 아이들은— 지금, 어디에 있나요?"},{"t":"d","g":"표정","x":"치코링 = 주먹이 떨린다 — 반박할 말을, 바로 찾지 못한다"},{"t":"l","s":"치코링","c":"치코","x":"……그, 그건……."},{"t":"d","g":"표정","x":"히땅 = 조용히, 그러나 또렷하게"},{"t":"l","s":"히땅","c":"히스이","x":"……마지막에, 웃었어. 둘 다."},{"t":"d","g":"표정","x":"이리스 = 히땅을 본다 — 슬프게 미소 짓는다"},{"t":"l","s":"이리스","c":"아야메","x":"네. 웃으며 끝나는 것. — 그게 바로, 내가 드리려는 거예요. 그 아이들이 마지막에 가졌던 것을, 전원에게. 시듦이 오기 전에."},{"t":"d","g":"표정","x":"네네링 = 참지 못하고"},{"t":"l","s":"네네링","c":"네네","x":"……웃기지 마. 그 애들이 마지막에 웃은 건— 네 덕분이 아니라, 치코 덕분이야!"},{"t":"d","g":"표정","x":"이리스 = 부정하지 않는다"},{"t":"l","s":"이리스","c":"아야메","x":"네, 그럴지도요. — 하지만 '끝이 왔다'는 사실은, 누구의 덕분이어도 바뀌지 않아요."},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다 — 말이, 아직 따라오지 못한다"},{"t":"l","s":"치코링","c":"치코","x":"다, 다르다고…… 생각해요. 뭐, 뭐가 다른지, 아직 말로는…… 그, 그치만, 달라요……!"},{"t":"d","g":"표정","x":"이리스 = 기다린다 — 정말로, 다정하게"},{"t":"l","s":"이리스","c":"아야메","x":"천천히 해도 돼요. …나는, 아이의 말을 끊는 어른이 되고 싶지는 않으니까."},{"t":"d","g":"표정","x":"치코링 = 떨리는 목소리로, 그러나 또렷하게"},{"t":"l","s":"치코링","c":"치코","x":"시, 시들고 싶지 않아요……! 무서워요……! 그건— 당신이, 제일 잘 알잖아요……!"},{"t":"d","g":"표정","x":"이리스 = 처음으로, 미소가 흔들린다"},{"t":"l","s":"이리스","c":"아야메","x":"………그래요. 알아요."},{"t":"d","g":"표정","x":"이리스 = 자신의 손바닥을 내려다본다"},{"t":"l","s":"이리스","c":"아야메","x":"나도— 무서웠어요. 제일 예쁘게 핀 밤에, 거울을 보면서 생각했어요. 여기서부터는, 내려가는 길밖에 없구나…… 하고."},{"t":"d","g":"표정","x":"치코링 = 조심스럽게"},{"t":"l","s":"치코링","c":"치코","x":"……그, 그때. 옆에, 누가 있었나요?"},{"t":"d","g":"표정","x":"이리스 = 침묵 — 길게"},{"t":"l","s":"이리스","c":"아야메","x":"………아무도. …아무도, 없었어요. 제일 강한 아이의 옆에는— 아무도, 있어 주지 않는 법이거든요."},{"t":"d","g":"표정","x":"치코링 = 눈물이 맺힌다"},{"t":"l","s":"치코링","c":"치코","x":"……그, 그랬구나……."},{"t":"d","g":"표정","x":"이리스 = 표정을 지운다"},{"t":"l","s":"이리스","c":"아야메","x":"동정은 필요 없어요. — 이건, 끝난 얘기예요."},{"t":"l","s":"이리스","c":"아야메","x":"그러니까 자르는 거예요. 시드는 걸, 보고 싶지 않으니까. 내가 그랬듯이— 다들, 가장 예쁜 순간에 멈춰 있으면 되니까."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(……그 다정함이, 이 정원의 전부였다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(틀린 말이, 하나도 없다. 그게 이 여자의 무서움이다. 절망을 논리로 다듬어서— 자비라는 이름을 붙였다.)","m":1},{"t":"l","s":"주군","c":"주군","x":"(하지만— 저 논리에는 구멍이 하나 있다. 저 아이만이, 계속 쥐고 있던 것. 이 여자가, 단 한 번도 가져 본 적 없는 것.)","m":1},{"t":"d","g":"표정","x":"이리스 = 손을 내민다"},{"t":"l","s":"이리스","c":"아야메","x":"여명의 아이. 당신은 특히— 곱게 피고 있어요. 이대로 싸우면, 오늘 밤 만개해요. 그리고 알죠? 만개한 꽃이 어떻게 되는지."},{"t":"d","g":"표정","x":"레오나 = 반사적으로, 한 발"},{"t":"l","s":"레오나","c":"레오나","x":"치코—!"},{"t":"d","g":"표정","x":"치코링 = 손을 들어, 조용히 제지한다"},{"t":"l","s":"치코링","c":"치코","x":"……괘, 괜찮아요, 레오나 씨. — 저, 도망치지 않아요."},{"t":"l","s":"이리스","c":"아야메","x":"그러니 선택하게 해 줄게요. 지금 여기서, 가장 아름다운 채로 잘리는 것. …나쁘지 않은 결말이라고 생각하는데."},{"t":"d","g":"표정","x":"이리스 = 내민 손끝에, 빛의 꽃잎이 맺힌다"},{"t":"l","s":"이리스","c":"아야메","x":"아프지 않아요. 무섭지도 않아요. 제일 예쁜 오늘의 당신인 채로— 영원이 되는 거예요."},{"t":"d","g":"표정","x":"레오나 = 이를 악문다"},{"t":"l","s":"레오나","c":"레오나","x":"(……움직이면, 진다. 여기는— 치코의 말이 이기는 곳이야.)"},{"t":"d","g":"표정","x":"이리스 = 기다린다"},{"t":"l","s":"이리스","c":"아야메","x":"자아. — 대답을, 들려주세요."},{"t":"d","g":"SE","x":"꽃잎이 닫히는 소리 — 조금, 가까워진다"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………답해라, 치코. 네가 계속 쥐고 있던— 그 답을.)","m":1},{"t":"d","g":"표정","x":"치코링 = 고개를 숙인다 → 주먹을 쥔다 → 고개를 든다"},{"t":"l","s":"치코링","c":"치코","x":"— 아니에요."}]},{"id":"p1-e9-s1","title":"20-2. 꽃봉오리의 심장 — 「씨앗」","blocks":[{"t":"d","g":"배경","x":"동일 — 닫히던 꽃잎이, 아주 잠깐 멈칫한다"},{"t":"d","g":"BGM","x":"대위법이 풀리고 — 여명 테마 단독, 아주 여리게"},{"t":"d","g":"SE","x":"정적"},{"t":"d","g":"표정","x":"치코링 = 한 발, 앞으로"},{"t":"l","s":"치코링","c":"치코","x":"꽃은, 지는 게 끝이 아니라— …씨앗을, 남기는걸요."},{"t":"d","g":"표정","x":"이리스 = 정지"},{"t":"l","s":"이리스","c":"아야메","x":"…………."},{"t":"d","g":"표정","x":"이리스 = 되묻는다 — 목소리가, 아주 조금 얇아진다"},{"t":"l","s":"이리스","c":"아야메","x":"……씨앗?"},{"t":"d","g":"표정","x":"치코링 = 숨을 크게 들이쉰다"},{"t":"l","s":"치코링","c":"치코","x":"마, 말로 하는 거, 서툴러서…… 처음부터 할게요. 드, 들어 주세요."},{"t":"d","g":"표정","x":"치코링 = 더듬으며, 그러나 멈추지 않고"},{"t":"l","s":"치코링","c":"치코","x":"저, 저기, 저…… 매일 일기를 써요. 잘한 것도, 무서웠던 것도, 전부요. 그래서 알았어요— 어제의 저는, 어제로 끝나는 게 아니에요."},{"t":"d","g":"표정","x":"치코링 = 손가락을 꼽으며"},{"t":"l","s":"치코링","c":"치코","x":"호, 혼자 결계에 들어가던 밤의 페이지에는— '무서웠다'라고만, 세 번 적혀 있어요. 글씨가, 다 삐뚤어져 있어요."},{"t":"l","s":"치코링","c":"치코","x":"그, 그런데 그다음 날 페이지에는요. '오늘도 무서웠다. 그치만 어제보다, 조금 빨리 발이 나갔다'— 그렇게, 적혀 있어요."},{"t":"d","g":"표정","x":"치코링 = 이어 간다"},{"t":"l","s":"치코링","c":"치코","x":"네, 네네링이 쓰러진 날 페이지는— 눈물로 글씨가 다 번져서, 못 읽어요. 그, 그치만 그 옆 장에는, '병문안 갈 때 제일 밝은 꽃을 사 가자'라고 적혀 있어요."},{"t":"l","s":"치코링","c":"치코","x":"쥬, 쥬리땅 씨가 눈을 뜬 날에는— '별은 떨어져도 별이었다'라고요. 그, 그 말, 제가 만든 게 아니에요. 쥬리땅 씨가, 심어 준 거예요."},{"t":"d","g":"표정","x":"네네링 = 코를 훌쩍인다"},{"t":"l","s":"네네링","c":"네네","x":"……이 몸 얘기, 쓰지 마…… 아, 아니, 써도 돼……."},{"t":"d","g":"표정","x":"이리스 = 고개를 젓는다"},{"t":"l","s":"이리스","c":"아야메","x":"……그건 성장의 이야기예요. 피어 가는 이야기. — 피어 가는 것은 전부, 만개를 향해요. 결말은, 같아요."},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다 — 크게"},{"t":"l","s":"치코링","c":"치코","x":"아, 아니에요! 어제의 저는— 어제의 페이지에서, 진짜로 끝났어요. 무서워서 아무것도 못 하던 그 애는, 이제 없어요. 시, 시든 거예요, 이미!"},{"t":"l","s":"치코링","c":"치코","x":"어제의 저는 어제 시들고…… 오늘의 저는, 어제가 남긴 씨앗에서 새로 펴요. 매일요. 매일, 다시 펴요."},{"t":"d","g":"표정","x":"이리스 = 고개를 젓는다 — 그러나, 느리게"},{"t":"l","s":"이리스","c":"아야메","x":"……궤변이에요. 마음이 매일 새로 핀다 한들— 계약이 세는 '꽃'은, 하나예요."},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그 '하나'가 세는 건— '제일 예쁜 순간'이잖아요. 마, 마음이 매일 새로 피면, '제일'은— 영원히, 안 정해져요!"},{"t":"d","g":"표정","x":"이리스 = 숨을 멈춘다"},{"t":"l","s":"이리스","c":"아야메","x":"……!"},{"t":"d","g":"표정","x":"이리스 = 반박한다 — 그러나 목소리에, 처음으로 힘이 들어간다"},{"t":"l","s":"이리스","c":"아야메","x":"말장난이에요. 일기장은— 무덤이에요. 어제의 당신이 묻힌. 사람의 꽃은, 한 번 지면—"},{"t":"d","g":"표정","x":"치코링 = 말을 받는다 — 떨리면서도, 또박또박"},{"t":"l","s":"치코링","c":"치코","x":"무, 무덤 아니에요. 밭이에요!"},{"t":"l","s":"치코링","c":"치코","x":"무덤은 닫는 거잖아요. 그, 그치만 저는 매일 밤 일기장을 '열어요'. 어제의 제가 무서워한 걸 읽고— 오늘의 제가, 거기서 시작해요. 무, 묻은 게 아니라, 심은 거예요!"},{"t":"d","g":"표정","x":"이리스 = 반박하려다— 말이, 나오지 않는다"},{"t":"l","s":"이리스","c":"아야메","x":"그런, 건……."},{"t":"d","g":"표정","x":"치코링 = 부드럽게"},{"t":"l","s":"치코링","c":"치코","x":"이, 이리스 씨도— 읽어 볼래요? 제 일기. 대, 대단한 건 하나도 안 적혀 있어요. 그, 그치만…… 매일이, 조금씩 달라요. 그게 전부고— 그게, 씨앗이에요."},{"t":"d","g":"표정","x":"치코링 = 이리스의 눈을 똑바로 본다"},{"t":"l","s":"치코링","c":"치코","x":"마, 만개가 끝이라는 건— 꽃을 '한 송이'로만 볼 때 얘기예요. 하, 하지만 사람은, 한 송이가 아니라— 꼬, 꽃밭이에요! 지고, 피고, 지고, 또 피고……!"},{"t":"d","g":"표정","x":"이리스 = 되뇐다"},{"t":"l","s":"이리스","c":"아야메","x":"……꽃밭……."},{"t":"d","g":"표정","x":"치코링 = 끄덕인다"},{"t":"l","s":"치코링","c":"치코","x":"다, 당신의 정원도— 한 송이씩 잘라서 액자에 넣는 곳이 아니라…… 지고 피는 걸, 같이 봐 주는 곳이었으면— 조, 좋았을 텐데요."},{"t":"d","g":"표정","x":"이리스 = 한 발, 물러선다 — 처음으로"},{"t":"l","s":"이리스","c":"아야메","x":"……그럼, 물을게요. 잘린 아이들은요. 씨앗을 남길 새도 없이— 사라진 아이들은, 뭐가 되나요."},{"t":"d","g":"표정","x":"이리스 = 목소리가, 흔들린다"},{"t":"l","s":"이리스","c":"아야메","x":"성당의 아이도, 탑의 아이도— 아무것도 안 남았어요. 빛이 되어서, 끝. …그것도 꽃밭이라고, 말할 수 있나요?"},{"t":"d","g":"표정","x":"치코링 = 눈물을 닦는다"},{"t":"l","s":"치코링","c":"치코","x":"에글랑틴 씨도, 벨 씨도— 사라졌어요. 그, 그치만, 없어진 게 아니에요. 마지막에 잡아 준 손도, 울지 말라던 목소리도— 전부, 여기 심어졌어요. 저희 안에요."},{"t":"d","g":"표정","x":"치코링 = 가슴에 손을 얹는다"},{"t":"l","s":"치코링","c":"치코","x":"이, 인연은 묶는 게 아니라 잡는 거라고— 저, 이제 그렇게 말할 수 있어요. 에글랑틴 씨가 심어 준 거예요. 우, 울 것 같을 때 화면 밖을 생각하는 것도— 벨 씨가 심어 준 거예요."},{"t":"l","s":"치코링","c":"치코","x":"그, 그게 씨앗이에요. 당신이 '소멸'이라고 부르는 것에도— 씨앗은, 남아요."},{"t":"d","g":"표정","x":"이리스 = 손끝이, 떨린다"},{"t":"l","s":"이리스","c":"아야메","x":"……그만……."},{"t":"d","g":"표정","x":"치코링 = 한 발 더, 다가간다 — 부드럽게"},{"t":"l","s":"치코링","c":"치코","x":"이리스 씨 안에도, 있잖아요. …시들어 간 사람들이 심어 준 것. 그, 그 사람들의 목소리로, 당신은 지금도 '다정하게' 말하잖아요. 그게— 그 사람들이 남긴, 씨앗이잖아요."},{"t":"d","g":"표정","x":"이리스 = 숨을 멈춘다"},{"t":"l","s":"이리스","c":"아야메","x":"………………."},{"t":"d","g":"표정","x":"이리스 = 뒷걸음질 — 반 보"},{"t":"l","s":"이리스","c":"아야메","x":"……그럼, 나는…… 나는 지금까지, 뭘 잘라 온 거죠. 씨앗째로…… 전부……."},{"t":"d","g":"표정","x":"치코링 = 울면서, 고개를 젓는다"},{"t":"l","s":"치코링","c":"치코","x":"……지, 지금부터 세면 돼요. 이리스 씨의 일기도— 오늘 밤부터, 새로 쓰면 돼요."},{"t":"d","g":"표정","x":"치코링 = 눈물이 고인 채, 웃는다"},{"t":"l","s":"치코링","c":"치코","x":"그러니까, 무서워도— 나는, 내일의 나를 보고 싶어요!"},{"t":"d","g":"SE","x":"— 꽃잎이 닫히는 소리가, 멎는다"},{"t":"d","g":"표정","x":"네네링 = 하늘을 올려다본다 — 속삭임"},{"t":"l","s":"네네링","c":"네네","x":"……멎었, 어……."},{"t":"d","g":"표정","x":"히땅 = 조용히"},{"t":"l","s":"히땅","c":"히스이","x":"……하늘이, 듣고 있네."},{"t":"d","g":"표정","x":"레오나 = 치코링의 등을 본다 — 움직이지 않는다"},{"t":"l","s":"레오나","c":"레오나","x":"(……저 등이, 오늘 밤 제일— 큰 등이야.)"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(계약은 소녀를 '한 송이의 꽃'으로 계산한다. 피고, 지고, 끝. — 그 계산식에 들어 있지 않은 것. 씨앗. …찢긴 마지막 줄. 그 답을, 나는 이제 안다.)","m":1},{"t":"d","g":"표정","x":"이리스 = 아주 오래, 침묵한다"},{"t":"l","s":"이리스","c":"아야메","x":"…………."},{"t":"d","g":"표정","x":"이리스 = 눈을 감는다 — 목소리가, 처음으로 마녀가 아니라 소녀의 것이 된다"},{"t":"l","s":"이리스","c":"아야메","x":"……당신, 정말……."},{"t":"l","s":"이리스","c":"아야메","x":"그 사람들이랑, 똑같은 말을 하네요."},{"t":"d","g":"표정","x":"치코링 = 조심스럽게"},{"t":"l","s":"치코링","c":"치코","x":"……그 사람들, 은……."},{"t":"d","g":"표정","x":"이리스 = 눈을 감은 채"},{"t":"l","s":"이리스","c":"아야메","x":"……내가, 지키고 싶었던 아이들. 시들어 가면서도— 마지막까지, 내일 얘기를 하던 아이들이에요."},{"t":"l","s":"이리스","c":"아야메","x":"'다음 봄에는'이라고, 몇 번이나 말했어요. 다음 봄이, 없다는 걸 알면서. …나는 그게, 강한 척이라고만 생각했는데."},{"t":"d","g":"표정","x":"치코링 = 눈물을 닦으며"},{"t":"l","s":"치코링","c":"치코","x":"……드, 들려줬으면 좋겠어요. 그 사람들 얘기. 어, 언젠가— 전부요."},{"t":"d","g":"표정","x":"이리스 = 아주 희미하게 — 웃음이 비친다"},{"t":"l","s":"이리스","c":"아야메","x":"………이상한 아이. 마녀의 옛날 얘기를, 듣고 싶어 하다니."},{"t":"d","g":"표정","x":"이리스 = 천천히, 눈을 뜬다"},{"t":"l","s":"이리스","c":"아야메","x":"……강한 척이, 아니었던 건가요. 그것도— 씨앗이었던, 건가요."},{"t":"d","g":"표정","x":"와카 = 주군의 품에서, 작게"},{"t":"l","s":"와카","c":"와카","x":"……계약자. 지금이야. 통이— 제일 잘 들리는 밤이야."},{"t":"d","g":"표정","x":"타마 = 끄덕"},{"t":"l","s":"타마","c":"타마","x":"……노래할, 시간~."},{"t":"d","g":"표정","x":"주군 = 품의 실린더를 꺼낸다"},{"t":"l","s":"주군","c":"주군","x":"— 그럼, 이것도 들어 보겠나. '그 사람들'의 목소리 같으니까."},{"t":"d","g":"표정","x":"이리스 = 눈을 뜬다"},{"t":"l","s":"이리스","c":"아야메","x":"……그건."},{"t":"d","g":"표정","x":"이리스 = 실린더에서, 눈을 떼지 못한다 — 손끝이, 떨리고 있다"},{"t":"l","s":"이리스","c":"아야메","x":"……그 통…… 어째서, 당신이……."},{"t":"d","g":"표정","x":"이리스 = 아주 작게 — 애원처럼"},{"t":"l","s":"이리스","c":"아야메","x":"………들려, 줘요."},{"t":"d","g":"표정","x":"주군 = 태엽에 손을 건다"},{"t":"l","s":"주군","c":"주군","x":"(한 번뿐이다. — 하지만 처음부터, 이 순간을 위한 한 번이었다.)","m":1},{"t":"d","g":"SE","x":"태엽 감는 소리 — 끼릭, 끼릭"}]}]},{"id":"p1-e10","title":"최종장 「폐원(閉園)」 — 3씬 구성","scenes":[{"id":"p1-e10-s0","title":"종막-1. 꽃봉오리의 심장 — 「마지막 줄」","blocks":[{"t":"d","g":"배경","x":"동일 — 실린더의 빛이 낡은 축음기 나팔처럼 퍼진다"},{"t":"d","g":"BGM","x":"무음 → 실린더 속 목소리 (오래된 녹음의 질감)"},{"t":"d","g":"SE","x":"태엽, 바늘이 홈을 긋는 소리"},{"t":"d","g":"이펙트","x":"실린더 재생 — 공간 전체에 오래된 목소리가 울린다"},{"t":"d","g":"SE","x":"지지직— 바늘이 홈을 찾는다"},{"t":"n","x":"백 년 묵은 숨소리가, 한 번. — 그리고, 목소리는 낭독을 시작했다."},{"t":"l","s":"목소리(실린더)","c":"목소리(실린더)","x":"『——조항, 마지막. 해지에 관하여.』"},{"t":"d","g":"표정","x":"치코링 = 숨을 죽인다"},{"t":"l","s":"치코링","c":"치코","x":"……해, 해지……. 이, 있었어요……. 정말로, 있었어……."},{"t":"d","g":"표정","x":"레오나 = 실린더에서 눈을 떼지 못한다"},{"t":"l","s":"레오나","c":"레오나","x":"……계약자 씨. 이게— 그 찢긴, 마지막 줄……."},{"t":"d","g":"표정","x":"주군 = 손을 든다"},{"t":"l","s":"주군","c":"주군","x":"그래. — 조용히. 한 글자도, 놓치지 마라."},{"t":"d","g":"표정","x":"이리스 = 숨을 멈춘다"},{"t":"l","s":"이리스","c":"아야메","x":"……!"},{"t":"n","x":"마녀의 부채 같은 손끝이, 허공에서 멎어 있었다. 그토록 찾아 헤맨 문이— 지금, 남의 손 위에서 열리고 있었다."},{"t":"l","s":"목소리(실린더)","c":"목소리(실린더)","x":"『계약은, 입회인의 손으로 파기할 수 있다. 단— 파기된 계약의 힘은 꽃에서 떠나, 씨앗으로 돌아간다.』"},{"t":"d","g":"표정","x":"네네링 = 자기 손바닥을 내려다본다"},{"t":"l","s":"네네링","c":"네네","x":"……힘이, 떠난다……."},{"t":"d","g":"표정","x":"히땅 = 눈을 뜬 채, 낮게"},{"t":"l","s":"히땅","c":"히스이","x":"……씨앗으로, 돌아간다."},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(파기의 대가는, 힘 그 자체. — 예상은 했다. 하지만 조항은, 아직 끝나지 않았다.)","m":1},{"t":"l","s":"목소리(실린더)","c":"목소리(실린더)","x":"『씨앗은 힘을 기억하지 않는다. 다만, 살아 있다. — 다시 피는 것은, 소녀 자신의 몫이다.』"},{"t":"d","g":"표정","x":"치코링 = 가슴을 누른다"},{"t":"l","s":"치코링","c":"치코","x":"기, 기억하지…… 않는다……."},{"t":"d","g":"표정","x":"엔마루 = 등불을 고쳐 안는다"},{"t":"l","s":"엔마루","c":"엔마","x":"……힘이 잊어도. — 등불은, 적을 수 있어요."},{"t":"l","s":"주군","c":"주군","x":"(……'기억하지 않는다'. 그 한 구절이, 목에 걸렸다. 힘만의 이야기라면— 좋겠지만.)","m":1},{"t":"l","s":"목소리(실린더)","c":"목소리(실린더)","x":"『그리고 명심하라. 파기는— 계약된 자들이, 스스로 그 힘을 놓을 때에만 성립한다. 움켜쥔 꽃은, 종이를 찢어도 지지 않는다.』"},{"t":"d","g":"표정","x":"레오나 = 낮게 되뇐다"},{"t":"l","s":"레오나","c":"레오나","x":"……스스로, 놓는다. — 찢는 것만으로는, 부족하다는 거네요."},{"t":"d","g":"표정","x":"치코링 = 고개를 끄덕인다 — 떨면서, 그러나 분명하게"},{"t":"l","s":"치코링","c":"치코","x":"……네. …노, 놓는 것까지가— 저희 몫이에요."},{"t":"d","g":"SE","x":"재생 종료 — 바늘 올라가는 소리"},{"t":"d","g":"표정","x":"주군 (텍스트만)"},{"t":"l","s":"주군","c":"주군","x":"(………이 목소리. 어딘가, 그리운— 아니. 지금은, 눈앞의 일이 먼저다.)","m":1},{"t":"n","x":"공간이, 조용해졌다. 닫히다 만 꽃잎 사이로— 진짜 밤하늘이, 실낱처럼 보였다."},{"t":"d","g":"표정","x":"와카 = 주군의 어깨 위에서, 작게"},{"t":"l","s":"와카","c":"와카","x":"……그게, 우리가 몰랐던 줄이구나. 이상하네. 처음 듣는데— 처음 듣는 것 같지가, 않아."},{"t":"d","g":"표정","x":"타마 = 귀를 접는다"},{"t":"l","s":"타마","c":"타마","x":"……내내, 빈자리였는걸. 저 말이 있던 자리."},{"t":"d","g":"표정","x":"와카 = 이리스 쪽을 본다"},{"t":"l","s":"와카","c":"와카","x":"계약자. …마지막 기회일지도 몰라. — 저 사람도, 데리고 가 줘."},{"t":"l","s":"주군","c":"주군","x":"(와카도 타마도, 낭독이 끝난 뒤로 이상할 만큼 얌전했다. 백 년 만에 돌아온 말 앞에서는— 인형도, 숙연해지는 모양이었다.)","m":1},{"t":"d","g":"표정","x":"이리스 = 떨리는 목소리"},{"t":"l","s":"이리스","c":"아야메","x":"………그 통. …나도, 찾았었어요. 몇 밤이고, 몇 밤이고 태엽을 감았는데— 내 손에서는, 끝내 노래하지 않았어요."},{"t":"d","g":"표정","x":"이리스 = 실린더에서 눈을 떼지 못한다"},{"t":"l","s":"이리스","c":"아야메","x":"그 골동품상의 등불 아래에서…… 새벽까지, 태엽을 감고, 귀를 대고. 감고, 또 귀를 대고. …통은 차갑기만 했어요. 돌멩이처럼."},{"t":"l","s":"이리스","c":"아야메","x":"마지막 밤에는, 빌기까지 했어요. 한 소절이라도 좋으니— 출구가 있다고, 말해 달라고."},{"t":"d","g":"표정","x":"치코링 = 울 것 같은 얼굴"},{"t":"l","s":"치코링","c":"치코","x":"이리스 씨……."},{"t":"d","g":"표정","x":"주군 = 조용히"},{"t":"l","s":"주군","c":"주군","x":"……가게 주인이 말하더군. 이 통은— 서명한 손에만, 노래한다고."},{"t":"l","s":"이리스","c":"아야메","x":"……그랬군요. 어른의, 손. 처음부터, 그쪽 몫이었군요. 우리가 아무리 울어도— 열리지 않던 문이."},{"t":"d","g":"표정","x":"이리스 = 웃는다 — 웃음이, 칼날처럼 얇다"},{"t":"l","s":"이리스","c":"아야메","x":"후후…… 후후후. 너무하네요. 정말— 너무해요. 답은 처음부터 있었는데. 자물쇠는 처음부터— 아이들 손에는, 맞지 않게 만들어져 있었다니."},{"t":"l","s":"이리스","c":"아야메","x":"그 한 소절만 들었더라면. ……나는, 자르지 않아도 됐을 텐데."},{"t":"l","s":"주군","c":"주군","x":"(통한이라는 말로도 모자랐다. 이 여자는 그 옛날에— 답의 문고리까지, 손을 뻗었던 것이다.)","m":1},{"t":"d","g":"표정","x":"주군 = 두루마리 원본을 펼친다"},{"t":"l","s":"주군","c":"주군","x":"누가 찢었는지는, 이제 중요하지 않다. — 중요한 건, 이 줄이 '있었다'는 것. 그리고 입회인이, 지금 여기 서 있다는 것이다."},{"t":"d","g":"표정","x":"레오나 = 한 발 나선다"},{"t":"l","s":"레오나","c":"레오나","x":"이리스 씨. …늦지 않았어요. 지금이라면— 자르는 것 말고도, 이 밤을 끝내는 방법이 있어요."},{"t":"d","g":"표정","x":"치코링 = 손을 내밀 듯"},{"t":"l","s":"치코링","c":"치코","x":"가, 같이…… 같이 놓아요. 저희랑, 같이……."},{"t":"d","g":"표정","x":"이리스 = 고개를 젓는다 — 처음으로, 목소리가 흐트러진다"},{"t":"l","s":"이리스","c":"아야메","x":"……안, 돼요. 이제 와서, 그런…… 그럼 지금까지 잘라 온 아이들은— 내가 거둬 온 그 아이들은, 뭐가 되나요."},{"t":"l","s":"이리스","c":"아야메","x":"자비라고 믿었어요. 수십 년을, 그 믿음 하나로 서 있었어요. 그게 아니었다고 하면— 그 아이들의 마지막 얼굴은, 전부…… 전부, 내 죄가 돼요."},{"t":"d","g":"표정","x":"치코링 = 고개를 젓는다"},{"t":"l","s":"치코링","c":"치코","x":"죄, 죄가 아니라……"},{"t":"d","g":"표정","x":"이리스 = 목소리가 떨린다"},{"t":"l","s":"이리스","c":"아야메","x":"위로는, 필요 없어요. …잘라 온 만큼의 무게를 지는 것이— 정원사예요."},{"t":"l","s":"주군","c":"주군","x":"(…그 무게째로 데려갈 방법을 찾아야 한다. 단죄도, 용서도 아닌— 세 번째 답을.)","m":1},{"t":"d","g":"SE","x":"——— 공기가, 낮게 운다"},{"t":"d","g":"표정","x":"히땅 = 고개를 든다"},{"t":"l","s":"히땅","c":"히스이","x":"……조용히 해 봐. …뭔가, 온다."},{"t":"d","g":"표정","x":"네네링 = 주위를 둘러본다"},{"t":"l","s":"네네링","c":"네네","x":"뭐, 뭐야. 하늘이— 아까부터, 소리가 이상해."},{"t":"d","g":"표정","x":"엔마루 = 등불을 본다 — 불꽃이 수평으로 눕는다"},{"t":"l","s":"엔마루","c":"엔마","x":"……등불이, 떨고 있어요. 이런 건— 처음이에요."},{"t":"d","g":"표정","x":"레오나 = 자세를 낮춘다"},{"t":"l","s":"레오나","c":"레오나","x":"전원, 내 뒤로! …계약자 씨, 두루마리를!"},{"t":"l","s":"주군","c":"주군","x":"(결계의 문제가 아니다. 더 바깥— 세계의 이음매 그 자체가, 울고 있었다.)","m":1},{"t":"d","g":"SE","x":"— 삐걱. (세계 전체가 한 번, 크게 삐걱인다)"},{"t":"d","g":"이펙트","x":"꽃잎의 하늘 너머 — 밤하늘 그 자체가 '접히며' 열린다"},{"t":"d","g":"표정","x":"이리스 = 얼어붙는다"},{"t":"l","s":"이리스","c":"아야메","x":"……! 이건— 내 결계가, 아니야……."},{"t":"d","g":"표정","x":"치코링 = 올려다본다 — 목소리가 얼어 있다"},{"t":"l","s":"치코링","c":"치코","x":"하, 하늘이…… 종이처럼…… 저, 접히고 있어요……."},{"t":"d","g":"표정","x":"료(통신) = 지지직"},{"t":"l","s":"료","c":"료","x":"「전 구역, 관측 불— 지직— 하늘이, 하늘 바깥에서— 지지직——」"},{"t":"d","g":"SE","x":"통신 두절"},{"t":"d","g":"표정","x":"레오나 = 이를 악문다"},{"t":"l","s":"레오나","c":"레오나","x":"료……! — 끊겼어. 전원, 위를 봐. …온다."},{"t":"d","g":"표정","x":"네네링 = 어깨를 감싼다"},{"t":"l","s":"네네링","c":"네네","x":"……추워. 뭐야, 이 밤— 갑자기, 한겨울이야."},{"t":"d","g":"표정","x":"히땅 = 하늘을 응시한다"},{"t":"l","s":"히땅","c":"히스이","x":"……울음소리. 하늘에서— 들려."},{"t":"n","x":"하늘의 갈라진 틈에서, 그 여자가 내려왔다."},{"t":"n","x":"눈처럼 흰 머리칼. 마르지 않는 눈물 자국. 그리고 그 주위를 도는— 여섯 개의, 검은 구슬."},{"t":"d","g":"표정","x":"엔마루 = 숨을 삼킨다"},{"t":"l","s":"엔마루","c":"엔마","x":"……저 구슬 안에…… 무언가가, 잠들어 있어요. 아주 오래— 아주, 조용히."},{"t":"d","g":"표정","x":"치코링 = 뒷걸음질"},{"t":"l","s":"치코링","c":"치코","x":"우, 울고 있어요……. 저 사람— 울면서, 내려오고 있어요……."},{"t":"d","g":"표정","x":"??? = 조용히, 울면서"},{"t":"l","s":"???","c":"???","x":"……돌려주지 않아요."},{"t":"d","g":"표정","x":"주군 = 전율"},{"t":"l","s":"주군","c":"주군","x":"(———이 목소리. 실린더의, 그 목소리다. 다만— 울고 있다.)","m":1},{"t":"d","g":"표정","x":"??? = 여섯 구슬을 끌어안듯, 낮게"},{"t":"l","s":"???","c":"???","x":"문을, 열었네요. …백 년 동안, 아무도 못 열었는데. ……아무것도, 돌려주지 않아요. 꽃도, 씨앗도— 하나도."},{"t":"d","g":"표정","x":"레오나 = 무기를 겨눈 채, 떨림을 누른다"},{"t":"l","s":"레오나","c":"레오나","x":"계약자 씨…… 저건, 뭐예요. 마녀……? 아니— 마녀랑은, 격이 달라……."},{"t":"d","g":"표정","x":"이리스 = 뒷걸음질 (처음으로)"},{"t":"l","s":"이리스","c":"아야메","x":"당신은…… 아아. 그랬군요. 정원 밖에— 더 큰, 정원이……."}]},{"id":"p1-e10-s1","title":"종막-2. 꽃봉오리의 심장 — 「비탄의 마녀」","blocks":[{"t":"d","g":"배경","x":"동일 — 접힌 하늘의 틈, 여섯 구슬이 낮게 공명한다"},{"t":"d","g":"BGM","x":"라르므 테마 — 실린더 목소리의 선율을 단조로 뒤집은 진혼곡"},{"t":"d","g":"SE","x":"구슬의 공명음, 물방울"},{"t":"d","g":"표정","x":"라르므 = 내려선다 — 눈물은 흐르는데, 표정은 고요하다"},{"t":"l","s":"라르므","c":"라르므","x":"최초의 입회인. 계약의 설계자. 마지막 줄을 찢은 손. ……뭐라고 불러도 좋아요."},{"t":"d","g":"표정","x":"치코링 = 목소리를 쥐어짠다"},{"t":"l","s":"치코링","c":"치코","x":"다, 당신이…… 전부, 만든 건가요. 계약도, 마녀도, 이…… 이 전부를……."},{"t":"d","g":"표정","x":"라르므 = 고개를 젓는다 — 눈물이 뚝, 떨어진다"},{"t":"l","s":"라르므","c":"라르므","x":"마녀는, 만들지 않았어요. 정원도. …나는 규칙을 적었을 뿐이에요. 소원에는 힘을. 힘에는 대가를. — 그다음은 전부, 꽃들이 스스로 걸어간 길이에요."},{"t":"l","s":"라르므","c":"라르므","x":"나는 그저…… 지켜봤어요. 백 년을. 피는 것도. 시드는 것도. …놓은 아이가, 빛이 되어 사라지는 것도."},{"t":"l","s":"라르므","c":"라르므","x":"나는 그저— 더는, 잃고 싶지 않았을 뿐이니까."},{"t":"d","g":"표정","x":"주군 = 두루마리를 쥔 채"},{"t":"l","s":"주군","c":"주군","x":"……네가 찢었나. 출구를."},{"t":"d","g":"표정","x":"라르므 = 끄덕인다 — 아무렇지도 않게"},{"t":"l","s":"라르므","c":"라르므","x":"네. 해지는 잔인해요. 아이들은 힘을 잃고, 나를 잊고, 떠나요. …그래서 찢었어요. 떠날 문이 없으면— 아무도, 떠나지 않으니까."},{"t":"d","g":"표정","x":"주군 = 낮게"},{"t":"l","s":"주군","c":"주군","x":"……그 탓에, 백 년이다. 출구 없는 정원에서— 얼마나 많은 아이가 시들고, 얼마나 많은 마녀가 태어났는지. 알고는 있나."},{"t":"d","g":"표정","x":"라르므 = 끄덕인다 — 눈물은, 멎지 않는다"},{"t":"l","s":"라르므","c":"라르므","x":"알아요. 전부, 세고 있었어요. …한 송이도, 빠짐없이."},{"t":"l","s":"라르므","c":"라르므","x":"그래서 거두는 거예요. 시들어 간 아이를, 더는— 혼자 두지 않으려고."},{"t":"d","g":"표정","x":"라르므 = 여섯 구슬을 어루만진다"},{"t":"l","s":"라르므","c":"라르므","x":"씨앗은 위험해요. 다시 피면, 다시 시들어요. 그러니 여기서— 내 곁에서, 영원히 잠들게 해요. 이 아이들처럼. …이름도 남기지 못하고 시들어 간, 아주 오래된 아이들이에요."},{"t":"d","g":"표정","x":"치코링 = 구슬을 본다 — 목소리가 떨린다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그 안의 아이들은…… 그걸, 바랐나요."},{"t":"d","g":"표정","x":"라르므 = 구슬에 뺨을 대듯"},{"t":"l","s":"라르므","c":"라르므","x":"……잠들어 있으면, 아프지 않아요. 무섭지도 않아요. 시들지도, 잊혀지지도 않아요. …그보다 좋은 게, 있나요?"},{"t":"d","g":"표정","x":"치코링 = 주먹을 쥔다"},{"t":"l","s":"치코링","c":"치코","x":"이, 있어요. …내일이요."},{"t":"d","g":"표정","x":"라르므 = 아주 조용히"},{"t":"l","s":"라르므","c":"라르므","x":"……내일은, 시들어요."},{"t":"d","g":"표정","x":"치코링 = 구슬을 본다 → 외친다"},{"t":"l","s":"치코링","c":"치코","x":"그, 그건…… 지키는 게 아니에요! 꽃을— 두 번 죽이는 거예요!!"},{"t":"d","g":"표정","x":"라르므 = 처음으로, 치코링을 똑바로 본다 — 목소리는, 낮은 채"},{"t":"l","s":"라르므","c":"라르므","x":"……심한 말을 하네요. 나는, 지키고 있는데. 백 년 동안…… 나만, 곁에 있어 줬는데."},{"t":"l","s":"라르므","c":"라르므","x":"당신도, 울고 있잖아요. 무섭잖아요. 시드는 것도, 잊는 것도. …알아요. 나도, 무서우니까. — 그러니까, 같이 잠들어요. 다 같이. 아무도, 잃지 않는 곳에서."},{"t":"d","g":"표정","x":"치코링 = 눈물을 닦지 않는다"},{"t":"l","s":"치코링","c":"치코","x":"무, 무서워요! 무서운데요……! 그, 그치만— 무서워서 가두는 건, 지키는 게 아니에요! 그건 그냥…… 우, 울면서 문을 잠그는 거예요!"},{"t":"d","g":"표정","x":"라르므 = 조용히, 손을 든다"},{"t":"l","s":"라르므","c":"라르므","x":"……이야기는, 끝이에요. 자요, 여러분. — 아무것도, 아프지 않게."},{"t":"d","g":"이펙트","x":"라르므의 공세 — 공간 그 자체가 '접히며' 아이들을 짓누른다"},{"t":"d","g":"SE","x":"세계가 구겨지는 소리"},{"t":"d","g":"표정","x":"레오나 = 일행 앞을 막아선다 — 홍련 최대 전개"},{"t":"l","s":"레오나","c":"레오나","x":"— 전원, 엎드려!! 여긴 내가……!!"},{"t":"d","g":"이펙트","x":"홍련의 방벽 위로, 접힌 공간의 주름이 산맥처럼 내려앉는다"},{"t":"d","g":"표정","x":"레오나 = 무릎이 꺾인다"},{"t":"l","s":"레오나","c":"레오나","x":"크, 윽……! 무, 겁다— 이건, 공격이 아니야…… 하늘, 그 자체……!"},{"t":"d","g":"표정","x":"히땅 = 폭풍 전개"},{"t":"l","s":"히땅","c":"히스이","x":"——폭풍, 전력. …밀어낸다."},{"t":"d","g":"이펙트","x":"나선 폭풍이 주름에 맞부딪힌다 — 폭풍째로, 접혀 들어간다"},{"t":"d","g":"표정","x":"히땅 = 처음으로, 표정이 무너진다"},{"t":"l","s":"히땅","c":"히스이","x":"……바람이, 접혀……?!"},{"t":"d","g":"표정","x":"네네링 = 섬광 연발"},{"t":"l","s":"네네링","c":"네네","x":"이 몸의 제일 밝은 걸로도— 그, 그림자 하나 안 생겨……!"},{"t":"d","g":"표정","x":"엔마루 = 등불을 치켜든다"},{"t":"l","s":"엔마루","c":"엔마","x":"등불이 꺼지지 않는 한, 밤은 끝나지 않아요……! 전원, 빛 안쪽으로!"},{"t":"l","s":"주군","c":"주군","x":"(승산의 문제가 아니었다. 저것은 세계의 바깥쪽— 종이를 접는 손이다. 종이 위의 그림이, 손과 싸울 수는 없다.)","m":1},{"t":"d","g":"표정","x":"이리스 = 그 옆에, 나란히 선다"},{"t":"l","s":"이리스","c":"아야메","x":"………내 정원의 아이들에게, 손대지 마세요."},{"t":"d","g":"표정","x":"레오나 = 곁눈질"},{"t":"l","s":"레오나","c":"레오나","x":"……! 당신—"},{"t":"d","g":"표정","x":"이리스 = 꽃잎의 폭풍을 일으키며"},{"t":"l","s":"이리스","c":"아야메","x":"착각하지 마세요, [홍련의 소녀]. 자를지 말지는— 정원사가 정해요. 이 아이들의 정원사는, 저 사람이 아니라 나예요."},{"t":"d","g":"표정","x":"라르므 = 슬프게"},{"t":"l","s":"라르므","c":"라르므","x":"……절화의 아이. 당신이, 왜. …당신이 제일 잘 알잖아요. 시드는 게, 얼마나……."},{"t":"d","g":"표정","x":"이리스 = 꽃잎을 칼날처럼 세운다"},{"t":"l","s":"이리스","c":"아야메","x":"네, 알아요. 수십 년 동안, 알다 못해— 잘라 왔어요. 그래서 알아요. 당신의 그 손이— 옛날의 나와, 같은 손이라는 걸."},{"t":"l","s":"이리스","c":"아야메","x":"자르는 것과, 가두는 것. …다르다고 믿고 싶었지만, 같은 거였어요. 시드는 게 무서워서— 시간을 멈추는 손."},{"t":"d","g":"표정","x":"레오나 = 방벽을 다시 일으킨다"},{"t":"l","s":"레오나","c":"레오나","x":"……하. 마녀랑 등을 맞대는 날이 올 줄이야. — 빚은 안 갚아도 돼요. 대신 오늘 밤만, 같은 편으로!"},{"t":"d","g":"표정","x":"이리스 = 옅게 웃는다"},{"t":"l","s":"이리스","c":"아야메","x":"후후. …아이들을 지키는 데에, 편 가르기는 촌스럽죠."},{"t":"d","g":"이펙트","x":"절화의 꽃잎 폭풍과 홍련의 방벽이, '접히는 세계'를 함께 밀어낸다 — 레오나의 몸이 눈부시게 '피어오르기' 시작"},{"t":"d","g":"이펙트","x":"화면 강진동 (VM: SHAKE 120) → 레오나에게 접근 (VM: FOCUS / ZOOM 인)"},{"t":"d","g":"SE","x":"전파가 끊기는 소리 — 지지직, 지지직"},{"t":"n","x":"레오나의 이름이 걸린 자막이 흔들렸다. 「[홍련의 소녀]」 — 그 「소」의 획이, 하나씩 다른 획으로 바뀌어 가고 있었다."},{"t":"d","g":"표정","x":"치코링 = 절규"},{"t":"l","s":"치코링","c":"치코","x":"레오나 씨——!! 안 돼, 피지 마, 피지 마아——!!"},{"t":"d","g":"표정","x":"레오나 = 온몸이 불꽃처럼 빛난다 — 손끝이, 투명해진다"},{"t":"l","s":"레오나","c":"레오나","x":"……아. 이거…… 예쁘네. 안 되겠다— 이건, 진짜…… 마지막 한 발이다……."},{"t":"d","g":"표정","x":"주군 = 외친다"},{"t":"l","s":"주군","c":"주군","x":"레오나! 약속을 잊었나— 소리를 내라!!"},{"t":"d","g":"표정","x":"레오나 = 불꽃 속에서, 웃는다"},{"t":"l","s":"레오나","c":"레오나","x":"……하, 하하. 미안. 약속— 소리, 지금 낼게요. 계약자 씨…… 빨리……!!"},{"t":"d","g":"표정","x":"주군 = 두루마리를 잡는다"},{"t":"l","s":"주군","c":"주군","x":"전원— 들어라! 파기는 너희가 힘을 '놓아야' 성립한다! 움켜쥔 채로는, 종이를 찢어도 끝나지 않아!"},{"t":"d","g":"표정","x":"라르므 = 처음으로, 목소리가 커진다"},{"t":"l","s":"라르므","c":"라르므","x":"안 돼요. 놓으면— 놓으면, 전부 끝나 버려요……!!"},{"t":"d","g":"표정","x":"라르므 = 목소리가 다시, 울음으로 잦아든다"},{"t":"l","s":"라르므","c":"라르므","x":"놓으면…… 잊어버려요. 이 밤도, 서로도…… 전부, 처음부터 없던 것처럼……. 그래도, 좋다는 건가요……."},{"t":"l","s":"주군","c":"주군","x":"(………그 말만은, 거짓이 아닐 것이다. 씨앗은 힘을 기억하지 않는다— 조항이, 그렇게 말했으니까.)","m":1},{"t":"d","g":"표정","x":"주군 = 그래도, 목소리를 편다"},{"t":"l","s":"주군","c":"주군","x":"그래도— 정해라, 너희가. 꽃의 규칙이 아니라, 너희 자신이!"},{"t":"d","g":"표정","x":"히땅 = 폭풍의 중심에서, 아주 작게"},{"t":"l","s":"히땅","c":"히스이","x":"……하암. …마지막까지, 좋은 바람이었어."},{"t":"d","g":"표정","x":"히땅 = 눈을 감는다 → 뜬다"},{"t":"l","s":"히땅","c":"히스이","x":"……처음으로 진심을 다했으니까. 미련, 없음. — 놓을게."},{"t":"d","g":"표정","x":"네네링 = 자기 손을 내려다본다"},{"t":"l","s":"네네링","c":"네네","x":"……손이, 좀 떨리는데. …에잇, 이 몸답지 않아!"},{"t":"d","g":"표정","x":"네네링 = 이를 악물고 → 활짝 웃는다"},{"t":"l","s":"네네링","c":"네네","x":"제일 밝게 터졌다! 다들 봤지?! 그럼— 됐어!!"},{"t":"d","g":"표정","x":"엔마루 = 등불에 이마를 댄다, 작게"},{"t":"l","s":"엔마루","c":"엔마","x":"……고마웠어요. 잘, 밝혀 줘서."},{"t":"d","g":"표정","x":"엔마루 = 등불을 가슴에 안는다"},{"t":"l","s":"엔마루","c":"엔마","x":"설령 잊게 되더라도— 있었던 밤이, 없던 밤이 되지는 않아요. 힘은— 돌려드릴게요."},{"t":"d","g":"표정","x":"치코링 = 일기장이 든 가슴께를 누른다"},{"t":"l","s":"치코링","c":"치코","x":"……이, 일기에, 다 적어 놨어요. 오늘 밤도— 꼭, 적을 거예요. 그, 그러니까…… 무섭지, 않아요."},{"t":"d","g":"표정","x":"치코링 = 마지막으로, 레오나를 본다 → 고개를 끄덕인다"},{"t":"l","s":"치코링","c":"치코","x":"……저희는, 씨앗이니까요. — 놓아도, 다시 피니까요!"},{"t":"d","g":"표정","x":"주군 = 정지"},{"t":"l","s":"주군","c":"주군","x":"(……안 더듬었다. 한 번도.)","m":1},{"t":"n","x":"처음 그 밤, 자기 이름 하나를 말하는 데도 세 번을 걸리던 아이였다. ——치코, 링. 치, 치코링으로, 할게요."},{"t":"n","x":"그 아이가 방금, 한 문장을 끝까지 걸리지 않고 말했다. 스스로는 눈치도 못 챈 얼굴로."},{"t":"d","g":"표정","x":"레오나 = 방벽을 편 채, 처음으로— 힘을 뺀다"},{"t":"l","s":"레오나","c":"레오나","x":"……이번에는, 아무도 잃지 않았어. 그러니까— 나도, 이제…… 놓을게……!"},{"t":"d","g":"표정","x":"치코링 = 코어의 문 쪽을 돌아본다"},{"t":"l","s":"치코링","c":"치코","x":"뮤, 뮤게 씨……!"},{"t":"d","g":"표정","x":"뮤게 = 등을 보인 채"},{"t":"l","s":"뮤게","c":"치사","x":"……보고 있는 것이와요. 말 걸지 않는 것이와요. …지금 이 몸은— 아주 중요한 걸, 놓는 중이니까."},{"t":"d","g":"표정","x":"뮤게 = 코어의 문가— 떨어진 부채를, 줍지 않는다"},{"t":"l","s":"뮤게","c":"치사","x":"………걸작은, 미완성인 채로. — 가면도, 여기 두고 가는 것이와요."},{"t":"n","x":"도시 곳곳에서 — 오늘 밤을 함께 버틴 소녀들이, 하나둘, 움켜쥔 손을 폈다."},{"t":"d","g":"표정","x":"라르므 = 두 손으로 입을 가린다, 조용히"},{"t":"l","s":"라르므","c":"라르므","x":"안 돼…… 그만…… 제발……."},{"t":"d","g":"표정","x":"주군 = 두루마리를 두 손으로 잡는다"},{"t":"l","s":"주군","c":"주군","x":"— 입회인 권한으로. 이 계약을, 파기한다!!"},{"t":"d","g":"표정","x":"와카&타마 = 주군의 양어깨에서, 동시에 고개를 끄덕인다"},{"t":"l","s":"와카&타마","c":"와카&타마","x":"— 접수."},{"t":"d","g":"SE","x":"종이 찢어지는 소리 — 세계가 숨을 삼키는 소리와 겹친다"},{"t":"d","g":"이펙트","x":"두루마리의 별빛 글자들이 흩어져 도시 전체로 씨앗처럼 흩날린다"},{"t":"d","g":"이펙트","x":"진동이 뚝 멎는다 (VM: SHAKE → RESET) — 레오나에게 고정 (VM: FOCUS)"},{"t":"d","g":"SE","x":"노이즈가 역재생되듯 잦아든다"},{"t":"n","x":"마지막 한 획이 남은 자리에서, 자막이 멈췄다. 그리고— 천천히, 왔던 길을 되짚어 갔다."},{"t":"d","g":"표정","x":"치코링 = 자막을 가리키며, 울면서 웃는다"},{"t":"l","s":"치코링","c":"치코","x":"레, 레오나 씨! 이름이— 이름이, 돌아왔어요……!"},{"t":"d","g":"표정","x":"레오나 = 무릎을 짚은 채, 웃는다"},{"t":"l","s":"레오나","c":"레오나","x":"……보이는 것부터 말해 줘서, 고마워. …후배."},{"t":"d","g":"SE","x":"쩌적— 여섯 구슬에, 일제히 금이 간다"},{"t":"d","g":"표정","x":"라르므 = 깨지는 구슬을 붙들려 한다"},{"t":"l","s":"라르므","c":"라르므","x":"안 돼…… 안 돼. 가지 마— 가지 마요……!"},{"t":"d","g":"표정","x":"라르므 = 금 간 구슬을 쓸어안는다, 조용히"},{"t":"l","s":"라르므","c":"라르므","x":"이름도…… 못 지어 줬는데. …이름을 불러서, 보내 주지도…… 못하는데……."},{"t":"d","g":"이펙트","x":"구슬 여섯 개가 깨지고 — 갇혀 있던 씨앗들이 빛이 되어, 도시의 밤하늘로 흩어진다"},{"t":"n","x":"씨앗들은 그녀의 손가락 사이로, 강물처럼 빠져나갔다."},{"t":"n","x":"백 년을 움켜쥔 손이었다. 그래서— 더는, 잡는 법밖에 몰랐던 손이었다."},{"t":"d","g":"표정","x":"치코링 = 흩어지는 빛을 올려다보며, 조용히"},{"t":"l","s":"치코링","c":"치코","x":"……가둬서 지킬 수 있는 건, 없어요. 그치만— 놓아서 지킬 수 있는 건, 있어요."},{"t":"d","g":"표정","x":"라르므 = 텅 빈 두 손을 내려다본다 — 오래"},{"t":"l","s":"라르므","c":"라르므","x":"………어라. ……가벼워."},{"t":"n","x":"그 순간, 그녀의 뺨에서— 눈물 자국이, 처음으로 말랐다."},{"t":"d","g":"표정","x":"라르므 = 마른 뺨을, 어린애처럼 만져 본다"},{"t":"l","s":"라르므","c":"라르므","x":"백 년 만에…… 손이, 펴져요. …이 손…… 이렇게, 컸었나요."},{"t":"d","g":"표정","x":"라르므 = 흩어지며, 아주 작게"},{"t":"l","s":"라르므","c":"라르므","x":"아아—— …이렇게, 놓는 거였구나."},{"t":"d","g":"이펙트","x":"비탄의 마녀, 자신이 지은 시스템과 함께 풀려 소멸 — 접혔던 하늘이 펴진다"}]},{"id":"p1-e10-s2","title":"종막-3. 꽃보라 — 「내일의 씨앗」","blocks":[{"t":"d","g":"배경","x":"붕괴하는 결계 — 꽃잎의 하늘이 무너지고, 진짜 밤하늘이 돌아온다"},{"t":"d","g":"BGM","x":"진혼곡 → 여명 테마 (풀 편성, 그러나 조용하게)"},{"t":"d","g":"SE","x":"꽃보라"},{"t":"n","x":"꽃잎의 하늘이 무너져 내렸다."},{"t":"n","x":"아이들의 몸에서 빛이— 힘이, 씨앗이 되어 빠져나가 밤하늘로 흩어졌다. 변신이 풀리고, 코스튬이 사복으로 돌아가고— 그리고."},{"t":"d","g":"표정","x":"네네 = 자기 손에서 빠져나가는 빛을 본다"},{"t":"l","s":"네네","c":"네네","x":"……아. 간다. …이 몸의, 제일 밝은 게……."},{"t":"d","g":"표정","x":"히스이 = 하늘로 올라가는 빛을 배웅한다"},{"t":"l","s":"히스이","c":"히스이","x":"……잘 가. …좋은 바람이었어."},{"t":"d","g":"표정","x":"엔마 = 풀려 가는 빛을 안은 채"},{"t":"l","s":"엔마","c":"엔마","x":"……빛이, 씨앗이 되어…… 올라가요. — 별 같아요."},{"t":"d","g":"표정","x":"치코 = 주위를 둘러본다"},{"t":"l","s":"치코","c":"치코","x":"다, 다들……! 괘, 괜찮으세요……!"},{"t":"d","g":"표정","x":"레오나 = 사복 차림으로 무릎을 꿇는다 — 웃으며"},{"t":"l","s":"레오나","c":"레오나","x":"……하아. 끝났, 구나. — 이번엔, 아무도 안 잃었어."},{"t":"d","g":"표정","x":"네네 = 하늘을 올려다본다"},{"t":"l","s":"네네","c":"네네","x":"……하늘. 진짜 하늘이다. …이 몸, 별이 이렇게 많은 줄 몰랐어."},{"t":"d","g":"표정","x":"히스이 = 나란히 올려다본다"},{"t":"l","s":"히스이","c":"히스이","x":"……응. …오래, 보게 되네."},{"t":"l","s":"주군","c":"주군","x":"(약속은 지켜졌다. …아니. 지금부터 잃는 것의 '방식'이 다를 뿐이라는 걸— 그때의 나는, 아직 몰랐다.)","m":1},{"t":"d","g":"표정","x":"이리스 = 하늘을 올려다본다 — 몸의 윤곽이 빛으로 풀리기 시작한다"},{"t":"l","s":"이리스","c":"아야메","x":"……아아. 정원이, 닫히네요."},{"t":"d","g":"표정","x":"치코 = 달려간다"},{"t":"l","s":"치코","c":"치코","x":"이리스 씨! 소, 손을! 손을 잡으면—!"},{"t":"d","g":"표정","x":"이리스 = 부드럽게 고개를 젓는다"},{"t":"l","s":"이리스","c":"아야메","x":"…저는, 안 돼요. 마녀는— 매듭이 풀리면, 존재째로 풀리는걸요. 게다가 저는 이미— 씨앗까지, 힘으로 다 태워 버린 지 오래라서."},{"t":"d","g":"표정","x":"치코 = 고개를 젓는다, 몇 번이고"},{"t":"l","s":"치코","c":"치코","x":"그, 그런 거…… 시, 싫어요. 겨우…… 겨우, 이야기할 수 있게 됐는데……."},{"t":"d","g":"표정","x":"이리스 = 치코의 머리를, 꽃잎 같은 손끝으로 쓰다듬는다"},{"t":"l","s":"이리스","c":"아야메","x":"……울보네요, 여명의 아이는. 후후. — 옛날의 누구를, 보는 것 같아요."},{"t":"d","g":"SE","x":"정적 — 꽃보라만 내린다"},{"t":"d","g":"표정","x":"이리스 = 주군을 본다"},{"t":"l","s":"이리스","c":"아야메","x":"계약자 님. …그 통, 잘 울렸나요."},{"t":"d","g":"표정","x":"주군 = 끄덕인다"},{"t":"l","s":"주군","c":"주군","x":"……잘 울렸다. 네 백 년이 헛돌지 않았다는 소리도— 함께 들었다."},{"t":"d","g":"표정","x":"이리스 = 눈을 감는다"},{"t":"l","s":"이리스","c":"아야메","x":"……그래요. …그거면, 됐어요."},{"t":"d","g":"SE","x":"꽃보라 — 잠시, 아무도 말하지 않는다"},{"t":"d","g":"표정","x":"치코 = 겨우, 목소리를 낸다"},{"t":"l","s":"치코","c":"치코","x":"……가, 가지 마세요……."},{"t":"d","g":"표정","x":"이리스 = 눈을 뜬다 — 온화하게"},{"t":"l","s":"이리스","c":"아야메","x":"……정원사는, 정원과 함께 닫히는 법이에요. 그게— 마지막 긍지예요."},{"t":"d","g":"표정","x":"이리스 = 그런데도, 웃는다"},{"t":"l","s":"이리스","c":"아야메","x":"고마워요, 계약자 님. …저는 조금, 피곤했나 봐요. 계속, 계속— 자르는 쪽이었으니까."},{"t":"d","g":"표정","x":"치코 = 매달리듯"},{"t":"l","s":"치코","c":"치코","x":"이, 이리스 씨는…… 나쁜 사람이, 아니에요. 무, 무서웠던 것뿐이에요. 저, 저는 알아요……!"},{"t":"d","g":"표정","x":"이리스 = 고개를 젓는다 — 부드럽게, 그러나 분명하게"},{"t":"l","s":"이리스","c":"아야메","x":"……아니요. 나빴어요. 무서움은, 변명이 되지 않아요. — 그건, 그 애한테도 그래요. 방금 하늘로 돌아간— 그, 우는 아이한테도."},{"t":"l","s":"이리스","c":"아야메","x":"그러니 미워해도 돼요. 잊지 말고, 미워하다가— 언젠가, 아주 잠깐만…… 불쌍히 여겨 줘요. 그거면, 충분해요."},{"t":"d","g":"표정","x":"치코 = 필사적으로"},{"t":"l","s":"치코","c":"치코","x":"저, 정원…… 다시, 만들 수 있어요. 씨앗이, 있으니까. 그, 그러니까—"},{"t":"d","g":"표정","x":"이리스 = 아주 잠깐, 눈을 크게 뜬다 → 미소"},{"t":"l","s":"이리스","c":"아야메","x":"……그럼, 다음 정원은— 문이 있는 정원으로 해 줘요. 들어오는 문과…… 나가는 문이, 있는."},{"t":"l","s":"이리스","c":"아야메","x":"먼저 진 아이들도…… 인연의 아이도, 갈채의 아이도. 부디, 같은 하늘에 있기를. — 이제야, 저도. …시들 수 있겠어요."},{"t":"d","g":"표정","x":"이리스 = 자신의 풀려 가는 손끝을 본다 — 신기한 듯"},{"t":"l","s":"이리스","c":"아야메","x":"……신기해요. 하나도, 무섭지 않아요. 시든다는 건, 이렇게— 조용한 거였군요. …그렇게 오래, 무서워했는데."},{"t":"d","g":"표정","x":"치코 = 눈물"},{"t":"l","s":"치코","c":"치코","x":"이리스 씨……! 아야메 씨——!!"},{"t":"d","g":"표정","x":"이리스 = 마지막으로, 그 이름에 아주 조금 눈을 크게 뜬다"},{"t":"l","s":"이리스","c":"아야메","x":"……어머. …그 이름, 어디서……."},{"t":"d","g":"SE","x":"꽃보라가, 한 박자— 멎는다"},{"t":"l","s":"이리스","c":"아야메","x":"……후후. 뭐, 좋아요. — 잘 자요, 여러분. 부디, 몇 번이고 다시 피기를."},{"t":"d","g":"이펙트","x":"절화의 마녀, 꽃보라가 되어 흩어진다 — 끝까지 웃는 얼굴로"},{"t":"n","x":"절화의 마녀는 꽃보라가 되어 흩어졌다. 웃는 얼굴이었다. — 그게 제일, 아팠다."},{"t":"d","g":"SE","x":"꽃보라 속 — 작은 기침 소리"},{"t":"n","x":"흩어지는 빛 속에서, 단 한 사람— 조화의 마녀만이, 무릎을 꿇은 채 사람의 숨을 되찾았다."},{"t":"n","x":"마녀는 돌아오지 못한다. 매듭이 곧 존재이니까. — 하지만 저 아이는, 마녀가 된 적이 없었다. 집착이 아니라 가면으로 서 있던, 가짜 꽃. …꺾인 적 없는 꽃은, 시들 수도 없다."},{"t":"d","g":"표정","x":"치사 = 무릎 꿇은 채, 자기 뺨을 만진다"},{"t":"l","s":"치사","c":"치사","x":"…………어, 라. ……나, 왜…… 울고 있지……."},{"t":"n","x":"그 목소리에는 '것이와요'도, 과장된 웃음도 없었다."},{"t":"n","x":"가면이 벗겨진 자리에 남은 것은— 어른이 되지 못한 채 멈춰 있던, 평범한 열여덟 살이었다."},{"t":"d","g":"표정","x":"치사 = 주위를 둘러본다 — 초점이, 돌아오지 않는 눈"},{"t":"l","s":"치사","c":"치사","x":"……여기, 어디……. 춥다. …나, 왜 이런 데에……."},{"t":"d","g":"표정","x":"치사 = 자기 손을 내려다본다"},{"t":"l","s":"치사","c":"치사","x":"손이…… 내 손이다. …당연한데. 왜 이게, 이상하지……."},{"t":"d","g":"표정","x":"치코 = 치사 곁에 무릎을 꿇고, 손을 잡는다"},{"t":"l","s":"치코","c":"치코","x":"……가, 같이 울어도, 돼요. 여기, 아무도 안 웃어요."},{"t":"d","g":"표정","x":"치사 = 치코를 본다 — 한참"},{"t":"l","s":"치사","c":"치사","x":"……너, 누구야. …모르는 앤데. 모르는 애 앞에서, 나……."},{"t":"d","g":"표정","x":"치사 = 말이 끝나기 전에, 눈물이 쏟아진다"},{"t":"l","s":"치사","c":"치사","x":"……어, 어…… 이상하다, 진짜. …나 고3이라고. 우, 우는 나이 아닌데……."},{"
